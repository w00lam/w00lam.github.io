    - id: action
      kind: "적용"
      name: "Domain Action"
      description: "검증된 결과를 저장·분류·정산 같은 업무로 연결"
  steps:
    - title: "1. 입력 수집"
      from: "Receipt Image / Text"
      to: "Vision / LLM Extraction"
      route_label: "이미지와 텍스트를 모델이 처리할 수 있는 입력으로 준비한다."
      active_actors: [input, extract]
      description: "파일 형식·크기·민감 정보 처리를 모델 호출 전 경계에서 관리한다."
