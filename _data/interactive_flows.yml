      kind: "생성"
      name: "Chat Model"
      description: "텍스트나 구조화 응답을 생성하는 모델"
    - id: parser
      kind: "검증"
      name: "Output Parser / Memory"
      description: "응답을 타입·스키마로 변환하고 필요한 문맥을 관리"
  steps:
    - title: "1. 프롬프트 준비"
      from: "Prompt Template"
      to: "ChatClient"
      route_label: "템플릿에 사용자 입력·지침·대화 문맥을 채워 모델 요청을 만든다."
      active_actors: [prompt, client]
      description: "입력 구조를 고정하면 출력 품질과 테스트 기준을 관리하기 쉽다."
      payload: ["system", "user", "context"]
      outcomes:
        - status: info
          text: "프롬프트는 코드와 데이터가 만나는 입력 계약이다."
    - title: "2. 모델 응답"
      from: "ChatClient"
      to: "Chat Model"
      route_label: "ChatClient가 모델을 호출하고 응답을 수신한다."
      active_actors: [client, model]
      description: "모델 응답 지연·오류·비용은 애플리케이션 운영 지표로 남긴다."
      payload: ["messages", "temperature", "response"]
      outcomes:
        - status: allow
          text: "모델 호출이 애플리케이션의 명시적인 단계가 된다."
    - title: "3. 구조화·기억"
      from: "Chat Model"
      to: "Output Parser / Memory"
      route_label: "응답을 스키마로 파싱하고 다음 요청에 필요한 문맥을 저장하거나 검색한다."
      active_actors: [model, parser, prompt]
      description: "모델 텍스트를 도메인 객체로 쓰기 전에 형식과 필수 값을 검증한다."
      payload: ["JSON", "schema", "memory"]
      outcomes:
        - status: allow
          text: "생성 결과가 애플리케이션에서 다룰 수 있는 구조로 변환된다."

ai_function_decomposition:
  eyebrow: "Interactive flow"
  title: "AI 기능 단계별 분해"
  summary: "영수증 처리처럼 입력 수집·문서 해석·검증·저장·응답을 별도 책임으로 나눠 설계한다."
  actors:
    - id: input
      kind: "입력"
