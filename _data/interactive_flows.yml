spring_security:
  eyebrow: "Interactive flow"
  title: "Spring Security 인증 처리 흐름"
  summary: "인증 결과를 검증하는 단계와 SecurityContext에 반영하는 단계를 나누어 본다."
  layout: six
  actors:
    - id: client
      kind: "요청 주체"
      name: "Client"
      description: "로그인 정보 또는 Bearer Token을 보냄"
    - id: filter
      kind: "인증 경계"
      name: "Security Filter"
      description: "인증 요청을 읽고 인증 객체를 생성함"
    - id: manager
      kind: "위임 조정"
      name: "AuthenticationManager"
      description: "사용할 인증 Provider를 선택함"
    - id: provider
      kind: "자격 증명"
      name: "AuthenticationProvider"
      description: "자격 증명을 검증함"
    - id: context
      kind: "현재 요청"
      name: "SecurityContext"
      description: "인증 결과와 현재 사용자 정보를 보관함"
    - id: controller
      kind: "애플리케이션"
      name: "Controller"
      description: "인가된 요청을 처리함"
  steps:
    - title: "1. 인증 요청"
      from: "Client"
      to: "Security Filter"
      route_label: "Filter가 로그인 정보나 Bearer Token을 읽는다."
      active_actors: [client, filter]
      description: "인증 필터가 요청에서 인증에 필요한 값을 읽고 인증 전 Authentication을 만든다."
      payload: ["로그인 정보", "Bearer Token"]
      outcomes:
        - status: info
          text: "아직 인증이 끝난 상태가 아닌 Authentication이 만들어진다."
    - title: "2. 인증 위임"
      from: "Security Filter"
      to: "AuthenticationManager"
      route_label: "Filter가 인증 전 Authentication을 Manager에 전달한다."
      active_actors: [filter, manager]
      description: "AuthenticationManager는 직접 모든 방식을 검증하지 않고 적절한 Provider에 처리를 위임한다."
      payload: ["인증 전 Authentication"]
      outcomes:
        - status: info
          text: "인증 방식에 따른 Provider 선택이 Manager의 책임이다."
    - title: "3. 자격 증명 검증"
      from: "AuthenticationManager"
      to: "AuthenticationProvider"
      route_label: "Manager가 선택한 Provider가 자격 증명을 검증한다."
      active_actors: [manager, provider]
      description: "Provider는 자신이 지원하는 인증 방식으로 자격 증명을 확인하고 인증된 Authentication을 반환한다."
      payload: ["검증할 자격 증명", "인증된 Authentication"]
      outcomes:
        - status: allow
          text: "검증에 성공하면 인증된 Authentication이 반환된다."
    - title: "4. 인증 결과 반환"
      from: "AuthenticationProvider"
      to: "Security Filter"
      route_label: "Provider의 인증 결과가 Filter로 돌아온다."
      active_actors: [provider, filter]
      description: "Provider가 결과를 반환하는 것과 SecurityContext에 저장하는 것은 서로 다른 단계다."
      payload: ["인증된 Authentication"]
      outcomes:
        - status: info
          text: "Provider가 SecurityContext에 직접 저장한다고 단정하지 않는다."
    - title: "5. SecurityContext 설정"
      from: "Security Filter"
      to: "SecurityContext"
      route_label: "인증 필터가 반환된 인증 결과를 현재 보안 컨텍스트에 설정한다."
      active_actors: [filter, context]
      description: "인증 필터가 인증된 결과를 SecurityContext에 반영해 현재 요청의 인증 정보를 준비한다."
      payload: ["인증된 Authentication", "SecurityContext"]
      outcomes:
        - status: allow
          text: "현재 요청에서 인증 정보를 사용할 수 있는 상태가 된다."
    - title: "6. 인가 후 요청 처리"
      from: "SecurityContext"
      to: "Controller"
      route_label: "인가 단계가 권한을 확인한 뒤 Controller로 요청을 이어 보낸다."
      active_actors: [context, controller]
      description: "인증 정보의 권한을 확인한 뒤 허용된 요청만 애플리케이션 Controller로 전달된다."
      payload: ["현재 사용자 정보", "권한 확인 결과"]
      outcomes:
        - status: allow
          text: "인가를 통과한 요청이 Controller 처리로 이어진다."

slf4j_logback:
  eyebrow: "Interactive structure"
  title: "SLF4J와 Logback의 관계"
  summary: "애플리케이션 코드는 API를 호출하고, 구현체가 실제 로그를 출력한다."
  actors:
    - id: application
      kind: "호출자"
      name: "Application"
      description: "Logger API를 사용해 로그를 호출함"
    - id: slf4j
      kind: "추상화 계층"
      name: "SLF4J"
      description: "로깅 API와 호출 규약을 제공함"
    - id: logback
      kind: "구현체"
      name: "Logback"
      description: "로그 출력과 관리를 수행함"
    - id: appender
      kind: "출력 구성"
      name: "Appender / Layout"
      description: "로그의 출력 대상과 형식을 결정함"
  steps:
    - title: "1. Logger 호출"
      from: "Application"
      to: "SLF4J"
      route_label: "애플리케이션이 SLF4J Logger API를 호출한다."
      active_actors: [application, slf4j]
      description: "애플리케이션 코드는 log.info() 같은 SLF4J API를 사용하고 특정 구현체의 API를 직접 호출하지 않는다."
      payload: ["Logger 호출", "log.info()"]
      outcomes:
        - status: info
          text: "호출 규약과 실제 출력 구현을 분리할 수 있다."
    - title: "2. 추상화 계층"
      from: "SLF4J"
      to: "Logback"
      route_label: "SLF4J 호출이 연결된 로깅 구현체로 전달된다."
      active_actors: [slf4j, logback]
      description: "SLF4J는 애플리케이션 코드와 실제 로깅 구현체 사이의 추상화 계층으로 동작한다."
      payload: ["로깅 API", "구현체 연결"]
      outcomes:
        - status: info
          text: "실제 연결은 의존성과 설정에 따라 결정된다."
    - title: "3. 출력과 관리"
      from: "Logback"
      to: "Appender / Layout"
      route_label: "Logback이 Appender와 Layout을 사용해 로그를 처리한다."
      active_actors: [logback, appender]
      description: "Logback은 Logger, Appender, Layout을 조합해 로그 출력과 관리, 형식 구성을 담당한다."
      payload: ["Logger", "Appender", "Layout"]
      outcomes:
        - status: allow
          text: "구현체가 실제 로그 출력과 관리 책임을 맡는다."
    - title: "4. 구현체 교체 기준"
      from: "Application"
      to: "Logback"
      route_label: "구현체를 바꾸더라도 애플리케이션 호출부 변경을 줄일 수 있다."
      active_actors: [application, slf4j, logback]
      description: "SLF4J를 사이에 두면 애플리케이션이 구현체에 직접 묶이지 않지만 실제 동작은 의존성과 설정을 확인해야 한다."
      payload: ["추상화", "의존성", "설정"]
      outcomes:
        - status: info
          text: "SLF4J 사용만으로 항상 같은 출력 방식이 보장되는 것은 아니다."

csrf:
  eyebrow: "Interactive flow"
  title: "CSRF 공격과 토큰 검증 흐름"
  summary: "공격자는 Cookie 값을 읽지 않아도 피해자의 브라우저가 대상 서버에 요청하도록 유도할 수 있다."
  actors:
    - id: user
      kind: "주체"
      name: "User"
      description: "대상 서버에 로그인한 사용자"
    - id: browser
      kind: "클라이언트"
      name: "Browser"
      description: "인증 Cookie를 보관하고 요청을 보냄"
    - id: attacker
      kind: "외부 사이트"
      name: "Attacker Site"
      description: "피해자의 브라우저가 요청하도록 유도"
    - id: server
      kind: "서버"
      name: "Target Server"
      description: "Cookie와 CSRF Token을 검증"
  steps:
    - title: "1. 로그인"
      from: "User"
      to: "Browser"
      route_label: "로그인 정보가 Browser로 전달된다."
      active_actors: [user, browser]
      description: "사용자가 대상 서버에 로그인하고 Browser가 인증 상태를 맡는다."
      payload: ["로그인 정보"]
      outcomes:
        - status: allow
          text: "Browser가 인증 Cookie를 저장한다."
    - title: "2. 인증 상태 유지"
      from: "Browser"
      to: "Target Server"
      route_label: "정상 요청에는 인증 Cookie가 포함될 수 있다."
      active_actors: [browser, server]
      description: "Browser는 대상 서버와 통신할 때 조건에 맞는 인증 Cookie를 전송할 수 있다."
      payload: ["인증 Cookie"]
      outcomes:
        - status: info
          text: "공격자가 Cookie 값을 직접 읽어야 하는 것은 아니다."
    - title: "3. 공격 페이지 방문"
      from: "Attacker Site"
      to: "Browser"
      route_label: "공격 페이지가 Browser에 대상 서버 요청을 유도한다."
      active_actors: [attacker, browser]
      description: "로그인 상태의 사용자가 공격자가 준비한 페이지를 방문한다."
      payload: ["상태 변경 요청 유도"]
      outcomes:
        - status: warning
          text: "피해자의 Browser가 요청을 시작하도록 이용된다."
    - title: "4. 대상 서버 요청"
      from: "Browser"
      to: "Target Server"
      route_label: "Browser가 대상 서버로 상태 변경 요청을 보낸다."
      active_actors: [browser, server]
      description: "Cookie 전송 조건이 충족되면 공격자가 만든 요청에도 인증 Cookie가 포함될 수 있다."
      payload: ["상태 변경 요청", "Cookie는 요청 조건에 따라 포함"]
      outcomes:
        - status: warning
          text: "SameSite 정책과 요청 조건에 따라 Cookie 전송 여부가 달라진다."
    - title: "5. CSRF Token 검증"
      from: "Browser"
      to: "Target Server"
      route_label: "Target Server가 CSRF Token을 검증한다."
      active_actors: [browser, server]
      description: "보호 대상 요청은 유효한 CSRF Token이 있는지 확인한 뒤 처리 여부를 결정한다."
      payload: ["CSRF Token"]
      outcomes:
        - status: reject
          text: "Token 없음·불일치 → 보호 대상 요청 거부"
        - status: allow
          text: "유효한 Token → 애플리케이션 정책에 따라 처리"

xss:
  eyebrow: "Interactive comparison"
  title: "Stored XSS와 Reflected XSS"
  summary: "저장 여부와 악성 입력이 응답에 들어오는 경로가 다르다."
  actors:
    - id: attacker
      kind: "입력 주체"
      name: "Attacker Input"
      description: "악성 문자열이나 준비된 요청을 전달함"
    - id: application
      kind: "처리 경계"
      name: "Application"
      description: "입력을 저장하거나 응답에 반영함"
    - id: storage
      kind: "저장 경로"
      name: "Server / DB"
      description: "Stored XSS 입력을 보관함"
    - id: browser
      kind: "실행 환경"
      name: "Victim Browser"
      description: "응답을 문맥에 따라 해석함"
  steps:
    - title: "1. Stored XSS: 저장"
      from: "Attacker Input"
      to: "Server / DB"
      route_label: "악성 입력이 게시글이나 댓글처럼 서버에 저장된다."
      active_actors: [attacker, application, storage]
      description: "Stored XSS에서는 공격자 입력이 서버나 데이터베이스에 저장된 뒤 나중에 조회된다."
      payload: ["악성 입력", "게시글·댓글"]
      outcomes:
        - status: warning
          text: "저장된 콘텐츠를 여러 사용자의 응답에 포함할 수 있다."
    - title: "2. Stored XSS: 조회 응답"
      from: "Server / DB"
      to: "Victim Browser"
      route_label: "저장된 입력이 다른 사용자의 조회 응답에 포함된다."
      active_actors: [storage, application, browser]
      description: "출력 처리가 취약하면 브라우저가 저장된 입력을 실행 가능한 문맥으로 해석할 수 있다."
      payload: ["조회 응답", "저장된 입력"]
      outcomes:
        - status: reject
          text: "안전한 출력 처리를 사용하면 실행 가능한 문맥을 만들지 않는다."
    - title: "3. Reflected XSS: 준비된 요청"
      from: "Attacker Input"
      to: "Application"
      route_label: "공격자가 준비한 요청의 입력이 서버로 전달된다."
      active_actors: [attacker, application]
      description: "Reflected XSS에서는 입력이 저장되지 않고 현재 요청의 파라미터나 오류 메시지 등에 들어온다."
      payload: ["준비된 요청", "검색어·오류 입력"]
      outcomes:
        - status: info
          text: "저장되지 않았다는 이유만으로 안전하다고 판단할 수 없다."
    - title: "4. Reflected XSS: 현재 응답"
      from: "Application"
      to: "Victim Browser"
      route_label: "서버가 요청 입력을 현재 응답에 반영한다."
      active_actors: [application, browser]
      description: "두 유형 모두 브라우저가 입력을 실행 가능한 출력 문맥으로 해석하고 방어가 부족할 때 문제가 된다."
      payload: ["현재 응답", "출력 문맥"]
      outcomes:
        - status: reject
          text: "단순 텍스트는 textContent 같은 안전한 DOM API로 출력한다."
        - status: info
          text: "HTML을 허용해야 한다면 Sanitization과 CSP를 함께 검토한다."

oauth_code:
  eyebrow: "Interactive flow"
  title: "OAuth Authorization Code Grant 흐름"
  summary: "브라우저 리다이렉트와 서버 간 토큰 교환을 분리해 인가 코드의 역할을 확인한다."
  layout: six
  actors:
    - id: user
      kind: "Resource Owner"
      name: "User"
      description: "로그인하고 애플리케이션의 권한 요청에 동의함"
    - id: client
      kind: "애플리케이션"
      name: "Client"
      description: "인가 요청을 만들고 코드를 토큰으로 교환함"
    - id: auth_server
      kind: "인가 서버"
      name: "Authorization Server"
      description: "로그인·동의를 처리하고 토큰을 발급함"
    - id: resource_server
      kind: "보호된 API"
      name: "Resource Server"
      description: "Access Token을 검증하고 사용자 정보를 제공함"
  steps:
    - title: "1. 인가 요청 준비"
      from: "User"
      to: "Client"
      route_label: "Client가 사용자 대신 인가 요청을 시작한다."
      active_actors: [user, client]
      description: "Client는 state와 code_challenge를 포함해 Authorization Server로 보낼 요청을 준비한다."
      payload: ["state", "code_challenge", "Redirect URI"]
      outcomes:
        - status: info
          text: "사용자의 비밀번호는 Client에 전달하지 않는다."
    - title: "2. 브라우저 리다이렉트"
      from: "Client"
      to: "Authorization Server"
      route_label: "브라우저가 인가 요청을 Authorization Server로 전달한다."
      active_actors: [client, auth_server]
      description: "Authorization Server는 등록된 Redirect URI와 요청의 state·PKCE 값을 기준으로 로그인과 동의를 진행한다."
      payload: ["인가 요청", "state", "code_challenge"]
      outcomes:
        - status: info
          text: "State는 시작한 요청과 돌아온 응답을 연결한다."
    - title: "3. Authorization Code 반환"
      from: "Authorization Server"
      to: "Client"
      route_label: "동의가 끝나면 Redirect URI로 일회성에 가까운 Code를 돌려준다."
      active_actors: [user, auth_server, client]
      description: "브라우저가 받은 Authorization Code는 보호된 API를 호출하는 Access Token이 아니라 토큰 교환을 위한 중간 자격 증명이다."
      payload: ["Redirect URI", "Authorization Code"]
      outcomes:
        - status: allow
          text: "Client가 Code를 받았지만 아직 Resource Server를 호출할 수는 없다."
    - title: "4. 서버 간 Code 교환"
      from: "Client"
      to: "Authorization Server"
      route_label: "Client가 Code와 code_verifier를 서버 간 요청으로 교환한다."
      active_actors: [client, auth_server]
      description: "Authorization Server는 PKCE의 code_verifier를 비교하고 Code의 유효성과 Redirect URI를 확인한다."
      payload: ["Authorization Code", "code_verifier"]
      outcomes:
        - status: reject
          text: "검증에 실패하면 토큰을 발급하지 않는다."
    - title: "5. Access Token 발급"
      from: "Authorization Server"
      to: "Client"
      route_label: "검증을 통과한 Client에 Access Token을 발급한다."
      active_actors: [auth_server, client]
      description: "Code 교환이 끝나면 Client는 보호된 API를 호출할 수 있는 Access Token을 받는다."
      payload: ["Access Token"]
      outcomes:
        - status: allow
          text: "Authorization Code와 API 호출용 Access Token의 역할을 구분한다."
    - title: "6. 보호된 API 요청"
      from: "Client"
      to: "Resource Server"
      route_label: "Client가 Access Token을 Bearer 요청에 담아 보낸다."
      active_actors: [client, resource_server]
      description: "Resource Server는 토큰을 검증한 뒤 허용된 범위의 리소스만 제공한다."
      payload: ["Bearer Access Token"]
      outcomes:
        - status: info
          text: "Access Token은 보호된 API를 호출하는 자격 증명이다."
    - title: "7. 사용자 정보 응답"
      from: "Resource Server"
      to: "Client"
      route_label: "검증된 토큰의 범위에 맞는 사용자 정보를 반환한다."
      active_actors: [client, resource_server]
      description: "Client는 Resource Server가 반환한 리소스 표현을 사용해 사용자 화면이나 기능을 구성한다."
      payload: ["사용자 정보", "리소스 표현"]
      outcomes:
        - status: allow
          text: "허용된 범위의 리소스만 Client에 전달된다."

jwt_structure:
  eyebrow: "Interactive structure"
  title: "JWT Header·Payload·Signature 구조"
  summary: "디코딩할 수 있는 정보와 신뢰성을 확인해야 하는 정보를 나눠 본다."
  actors:
    - id: header
      kind: "첫 번째 부분"
      name: "Header"
      description: "서명 알고리즘과 토큰 유형 같은 메타데이터를 담음"
    - id: payload
      kind: "두 번째 부분"
      name: "Payload"
      description: "sub·iss·exp 같은 Claim을 담음"
    - id: signature
      kind: "세 번째 부분"
      name: "Signature"
      description: "Header와 Payload의 무결성과 서명을 검증함"
    - id: verifier
      kind: "검증 경계"
      name: "API Verifier"
      description: "서명과 Claim, API 권한을 확인한 뒤 토큰을 신뢰함"
  steps:
    - title: "1. Header 확인"
      from: "JWT"
      to: "Header"
      route_label: "첫 번째 점 앞의 부분에서 메타데이터를 읽는다."
      active_actors: [header]
      description: "Header에는 alg와 typ이 들어가며 서버는 허용할 알고리즘과 검증 키를 관리한다."
      payload: ["alg: HS256", "typ: JWT"]
      outcomes:
        - status: info
          text: "Header를 읽을 수 있다는 사실만으로 토큰을 신뢰할 수는 없다."
    - title: "2. Payload 디코딩"
      from: "JWT"
      to: "Payload"
      route_label: "두 번째 부분을 Base64URL로 디코딩해 Claim을 확인한다."
      active_actors: [payload]
      description: "Payload는 일반적인 서명 JWT에서 암호화되지 않으므로 외부에서 읽을 수 있고 민감정보를 넣지 않아야 한다."
      payload: ["sub", "iss", "exp", "Base64URL"]
      outcomes:
        - status: warning
          text: "Base64URL 인코딩은 암호화가 아니며 기밀성을 제공하지 않는다."
    - title: "3. Signature 검증"
      from: "Header + Payload"
      to: "Signature"
      route_label: "서버가 Header와 Payload에 대한 서명 또는 MAC을 검증한다."
      active_actors: [header, payload, signature]
      description: "Signature는 내용이 바뀌지 않았는지와 신뢰할 수 있는 발급자가 서명했는지를 확인하는 값이다."
      payload: ["Header + Payload", "검증 키"]
      outcomes:
        - status: reject
          text: "서명 검증 실패 → 토큰을 인증 정보로 사용하지 않는다."
        - status: allow
          text: "서명 검증 성공 → 다음 Claim 검증으로 진행한다."
    - title: "4. Claim과 권한 검증"
      from: "Signature"
      to: "API Verifier"
      route_label: "서명 뒤 iss·aud·exp와 API 권한을 순서대로 확인한다."
      active_actors: [signature, verifier]
      description: "서명만 맞는지 보지 않고 발급자·대상·만료 시각과 요청 권한까지 확인해야 토큰을 신뢰할 수 있다."
      payload: ["iss", "aud", "exp", "API 권한"]
      outcomes:
        - status: allow
          text: "모든 검증을 통과한 경우에만 보호된 요청을 처리한다."

refresh_rotation:
  eyebrow: "Interactive flow"
  title: "Refresh Token Rotation과 재사용 거부"
  summary: "R1을 사용해 R2를 발급한 뒤 폐기된 R1의 재제출을 탐지하는 흐름이다."
  actors:
    - id: client
      kind: "토큰 보유자"
      name: "Client"
      description: "만료된 Access Token과 Refresh Token을 제출함"
    - id: auth_server
      kind: "검증 주체"
      name: "Auth Server"
      description: "Refresh Token의 만료·폐기·재사용을 확인함"
    - id: token_pair
      kind: "새 자격 증명"
      name: "A2 + R2"
      description: "정상 재발급으로 만들어지는 새 토큰 쌍"
    - id: reuse_policy
      kind: "보호 정책"
      name: "Reuse Detection"
      description: "이미 폐기된 Refresh Token의 재사용을 탐지함"
  steps:
    - title: "1. 만료와 R1 제출"
      from: "Client"
      to: "Auth Server"
      route_label: "Access Token이 만료되면 Client가 Refresh Token R1을 제출한다."
      active_actors: [client, auth_server]
      description: "Refresh Token은 새 Access Token을 발급받기 위한 자격 증명이며 존재만으로 재발급이 허용되지는 않는다."
      payload: ["Access Token 만료", "Refresh Token R1"]
      outcomes:
        - status: info
          text: "서버는 R1의 유효 기간과 상태를 확인해야 한다."
    - title: "2. R1 검증"
      from: "Auth Server"
      to: "Reuse Detection"
      route_label: "서버가 만료·폐기·재사용 여부를 확인한다."
      active_actors: [auth_server, reuse_policy]
      description: "Rotation을 적용하려면 Refresh Token 상태와 현재 클라이언트에 연결된 토큰인지 서버가 관리해야 한다."
      payload: ["만료 확인", "폐기 확인", "재사용 확인"]
      outcomes:
        - status: reject
          text: "유효하지 않거나 이미 사용된 R1이면 발급을 중단한다."
        - status: allow
          text: "정상 R1이면 새 토큰 발급으로 진행한다."
    - title: "3. 새 토큰 발급과 R1 폐기"
      from: "Auth Server"
      to: "A2 + R2"
      route_label: "정상 R1에 대해 A2와 R2를 발급하고 기존 R1을 무효화한다."
      active_actors: [auth_server, token_pair, reuse_policy]
      description: "새 토큰을 발급하는 순간 기존 R1의 사용 가능 상태를 명시적으로 폐기해야 Rotation이 성립한다."
      payload: ["Access Token A2", "Refresh Token R2", "R1 폐기"]
      outcomes:
        - status: allow
          text: "정상 재발급 뒤 다음 Refresh Token은 R2가 된다."
    - title: "4. 폐기된 R1 재사용"
      from: "Client"
      to: "Auth Server"
      route_label: "공격자나 오래된 Client가 이미 폐기된 R1을 다시 제출한다."
      active_actors: [client, auth_server, reuse_policy]
      description: "R2를 발급받은 뒤 R1이 다시 제출되면 단순한 만료 여부가 아니라 토큰 재사용 사건으로 볼 수 있다."
      payload: ["Refresh Token R1", "재사용 요청"]
      outcomes:
        - status: warning
          text: "새 토큰을 발급했다는 사실만으로 이전 토큰이 자동 무효화되지는 않는다."
    - title: "5. 재사용 거부와 세션 폐기"
      from: "Reuse Detection"
      to: "Client"
      route_label: "서버가 재사용을 탐지하고 요청과 관련 토큰군을 거부한다."
      active_actors: [auth_server, reuse_policy, client]
      description: "정책에 따라 관련 토큰군이나 세션을 폐기해 탈취된 Refresh Token의 확산을 막는다."
      payload: ["요청 거부", "토큰군 폐기", "세션 폐기"]
      outcomes:
        - status: reject
          text: "폐기된 R1 재사용 → 재발급 거부"

rest_resource:
  eyebrow: "Interactive flow"
  title: "REST API의 Resource·URI·Representation"
  summary: "URI가 대상을 식별하고 HTTP Method가 의도를 나타내며 Representation이 현재 상태를 전달한다."
  actors:
    - id: client
      kind: "요청 주체"
      name: "Client"
      description: "HTTP Method와 URI로 리소스 표현을 요청함"
    - id: uri
      kind: "식별자"
      name: "URI"
      description: "대상 Resource를 식별함"
    - id: server
      kind: "처리 주체"
      name: "Server"
      description: "요청 의미에 따라 Resource를 처리함"
    - id: representation
      kind: "응답 데이터"
      name: "Representation"
      description: "특정 시점의 Resource 상태를 표현함"
  steps:
    - title: "1. HTTP 요청 작성"
      from: "Client"
      to: "URI"
      route_label: "Client가 GET /orders/123처럼 Method와 URI를 함께 보낸다."
      active_actors: [client, uri]
      description: "HTTP Method는 리소스에 어떤 동작을 요청하는지, URI는 어떤 대상을 가리키는지 나타낸다."
      payload: ["GET", "/orders/123"]
      outcomes:
        - status: info
          text: "Client가 서버 내부 클래스나 DB 구조를 알 필요는 없다."
    - title: "2. Resource 식별"
      from: "URI"
      to: "Server"
      route_label: "서버가 URI를 보고 123번 Order Resource를 식별한다."
      active_actors: [uri, server]
      description: "URI는 리소스 자체와 동일한 데이터가 아니라 요청 대상의 식별자 역할을 한다."
      payload: ["Order Resource", "ID: 123"]
      outcomes:
        - status: allow
          text: "요청 대상이 일관된 URI 규칙으로 식별된다."
    - title: "3. Representation 생성"
      from: "Server"
      to: "Representation"
      route_label: "서버가 리소스의 현재 상태를 JSON Representation으로 만든다."
      active_actors: [server, representation]
      description: "Representation은 Resource 그 자체가 아니라 특정 시점의 상태를 전달하는 데이터다."
      payload: ["HTTP 200 OK", "JSON", "status: PAID"]
      outcomes:
        - status: info
          text: "응답 표현과 서버 내부 저장 구조를 분리할 수 있다."
    - title: "4. 응답 전달"
      from: "Representation"
      to: "Client"
      route_label: "Client가 상태 표현을 받아 다음 동작을 결정한다."
      active_actors: [representation, client]
      description: "응답은 리소스의 현재 상태와 요청 처리 결과를 Client가 이해할 수 있는 형태로 전달한다."
      payload: ["HTTP 200 OK", "JSON Representation"]
      outcomes:
        - status: allow
          text: "Method·URI·Representation을 한 요청 흐름에서 함께 읽는다."

nginx_spring:
  eyebrow: "Interactive flow"
  title: "Nginx와 Spring Boot 요청 처리 흐름"
  summary: "Nginx는 전달을 담당하고 Tomcat과 Spring MVC는 애플리케이션 요청을 실행한다."
  layout: six
  actors:
    - id: client
      kind: "외부 요청"
      name: "Client"
      description: "HTTPS 요청을 보냄"
    - id: nginx
      kind: "Reverse Proxy"
      name: "Nginx"
      description: "TLS 종료·라우팅·전달을 담당함"
    - id: tomcat
      kind: "Servlet Container"
      name: "Embedded Tomcat"
      description: "HTTP 요청을 받을 실행 환경을 제공함"
    - id: mvc
      kind: "Front Controller"
      name: "DispatcherServlet"
      description: "Spring MVC의 요청 진입점으로 동작함"
    - id: controller
      kind: "웹 계층"
      name: "Controller"
      description: "요청을 매핑하고 응답 조합을 시작함"
    - id: domain
      kind: "애플리케이션 계층"
      name: "Service → Repository → DB"
      description: "비즈니스 규칙을 처리하고 저장소와 데이터베이스에 접근함"
  steps:
    - title: "1. 외부 HTTPS 요청"
      from: "Client"
      to: "Nginx"
      route_label: "Client가 Nginx로 HTTPS Request를 보낸다."
      active_actors: [client, nginx]
      description: "앞단에 Nginx를 두는 구성에서는 외부 연결과 애플리케이션 전달을 분리할 수 있다."
      payload: ["HTTPS Request"]
      outcomes:
        - status: info
          text: "Nginx 없이 Embedded Tomcat이 직접 외부 요청을 받을 수도 있다."
    - title: "2. Reverse Proxy 전달"
      from: "Nginx"
      to: "Embedded Tomcat"
      route_label: "Nginx가 라우팅한 요청을 Spring Boot의 Tomcat으로 전달한다."
      active_actors: [nginx, tomcat]
      description: "Nginx는 TLS·정적 파일·라우팅·부하 분산을 담당할 수 있지만 비즈니스 규칙을 실행하지는 않는다."
      payload: ["Reverse Proxy", "Routing"]
      outcomes:
        - status: info
          text: "프록시 계층은 선택 가능한 구성 요소다."
    - title: "3. Servlet 요청 진입"
      from: "Embedded Tomcat"
      to: "DispatcherServlet"
      route_label: "Tomcat이 HTTP 요청을 DispatcherServlet에 연결한다."
      active_actors: [tomcat, mvc]
      description: "Tomcat은 Servlet Container로서 HTTP 처리 환경을 제공하고 Spring MVC 진입점으로 요청을 넘긴다."
      payload: ["Servlet Request", "Spring MVC"]
      outcomes:
        - status: info
          text: "컨테이너 처리와 애플리케이션 라우팅을 구분한다."
    - title: "4. Controller 매핑"
      from: "DispatcherServlet"
      to: "Controller"
      route_label: "DispatcherServlet이 요청을 매핑된 Controller로 전달한다."
      active_actors: [mvc, controller]
      description: "Controller는 요청을 받아 애플리케이션 계층에 필요한 작업을 요청하고 응답을 조합한다."
      payload: ["요청 매핑", "Controller"]
      outcomes:
        - status: allow
          text: "Spring MVC Front Controller 뒤에서 구체적인 Controller가 선택된다."
    - title: "5. 비즈니스 처리와 저장"
      from: "Controller"
      to: "Service → Repository → DB"
      route_label: "Controller가 Service를 거쳐 Repository와 Database 작업을 수행한다."
      active_actors: [controller, domain]
      description: "주문 조회나 권한 판단처럼 애플리케이션 의미를 이해해야 하는 로직은 이 계층에서 실행된다."
      payload: ["비즈니스 규칙", "Repository", "Database"]
      outcomes:
        - status: allow
          text: "요청 처리의 핵심은 Spring 애플리케이션 계층에서 수행된다."
    - title: "6. 응답 역방향 전달"
      from: "Controller"
      to: "Client"
      route_label: "처리 결과가 같은 경로를 거꾸로 지나 Client에 응답된다."
      active_actors: [client, nginx, tomcat, mvc, controller]
      description: "Controller가 만든 응답은 Tomcat과 필요하면 Nginx를 거쳐 외부 Client로 돌아간다."
      payload: ["Response"]
      outcomes:
        - status: allow
          text: "Nginx와 Spring Boot를 반드시 함께 사용해야 한다는 뜻은 아니다."

http_methods:
  eyebrow: "Interactive comparison"
  title: "HTTP 메서드의 안전성과 멱등성"
  summary: "안전성은 상태 변경 요청 여부이고, 멱등성은 의도한 효과를 반복해도 같은지의 기준이다."
  layout: six
  actors:
    - id: get
      kind: "조회"
      name: "GET"
      description: "리소스 표현 조회 · 안전 예 · 멱등 예"
    - id: head
      kind: "메타데이터"
      name: "HEAD"
      description: "GET과 같은 대상 · 본문 없음 · 안전 예"
    - id: post
      kind: "제출·처리"
      name: "POST"
      description: "데이터 제출 · 안전 아니오 · 멱등 아니오"
    - id: put
      kind: "생성·교체"
      name: "PUT"
      description: "지정한 상태로 맞춤 · 안전 아니오 · 멱등 예"
    - id: patch
      kind: "부분 변경"
      name: "PATCH"
      description: "변경 방식에 따라 멱등성이 조건부"
    - id: delete
      kind: "연결 제거"
      name: "DELETE"
      description: "리소스와 연결 제거 · 안전 아니오 · 멱등 예"
  steps:
    - title: "1. GET"
      from: "GET"
      to: "GET"
      route_label: "리소스 표현을 조회한다."
      active_actors: [get]
      description: "GET은 서버 상태 변경을 요청하지 않으며 같은 요청을 반복해도 의도된 상태 효과가 같다."
      payload: ["안전: 예", "멱등: 예"]
      outcomes:
        - status: allow
          text: "조회 메서드"
    - title: "2. HEAD"
      from: "HEAD"
      to: "HEAD"
      route_label: "GET과 같은 대상의 메타데이터를 확인한다."
      active_actors: [head]
      description: "HEAD는 응답 본문 없이 GET과 같은 대상의 메타데이터를 확인하는 안전하고 멱등적인 요청이다."
      payload: ["안전: 예", "멱등: 예", "본문 없음"]
      outcomes:
        - status: allow
          text: "메타데이터 확인"
    - title: "3. POST"
      from: "POST"
      to: "POST"
      route_label: "데이터 제출이나 처리를 요청한다."
      active_actors: [post]
      description: "POST는 일반적으로 서버 상태를 변경하고 같은 요청을 반복했을 때 동일한 결과를 보장하지 않는다."
      payload: ["안전: 아니오", "멱등: 아니오"]
      outcomes:
        - status: warning
          text: "반복 요청의 효과를 API 설계에서 별도로 다뤄야 한다."
    - title: "4. PUT"
      from: "PUT"
      to: "PUT"
      route_label: "리소스 표현을 지정한 상태로 생성하거나 교체한다."
      active_actors: [put]
      description: "PUT은 안전하지 않지만 같은 표현을 반복해도 의도한 상태에 도달하는 멱등 요청으로 설계된다."
      payload: ["안전: 아니오", "멱등: 예"]
      outcomes:
        - status: allow
          text: "지정 상태로 맞추는 요청"
    - title: "5. PATCH"
      from: "PATCH"
      to: "PATCH"
      route_label: "리소스의 일부 변경을 적용한다."
      active_actors: [patch]
      description: "PATCH 자체는 멱등성을 보장하지 않으며 특정 값 설정인지 1씩 증가인지 구현한 변경 방식에 따라 결과가 달라진다."
      payload: ["안전: 아니오", "멱등: 조건부"]
      outcomes:
        - status: warning
          text: "메서드 이름만으로 멱등성을 판단하지 않는다."
    - title: "6. DELETE"
      from: "DELETE"
      to: "DELETE"
      route_label: "리소스와의 연결 제거를 요청한다."
      active_actors: [delete]
      description: "DELETE는 안전하지 않지만 첫 요청 뒤 의도한 리소스가 없는 상태가 유지된다면 멱등으로 볼 수 있다."
      payload: ["안전: 아니오", "멱등: 예"]
      outcomes:
        - status: allow
          text: "응답 코드가 같아야 한다는 뜻은 아니다."

http_5xx:
  eyebrow: "Interactive diagnosis"
  title: "5xx 오류가 발생한 위치"
  summary: "Client·Gateway·Application Server의 요청 경로에서 실패 지점과 의미를 함께 확인한다."
  actors:
    - id: client
      kind: "요청 주체"
      name: "Client"
      description: "요청을 보내고 응답을 받음"
    - id: gateway
      kind: "전달 경계"
      name: "Gateway"
      description: "Reverse Proxy로 상위 서버에 요청을 전달함"
    - id: application
      kind: "처리 주체"
      name: "Application Server"
      description: "요청 처리와 응답 생성을 담당함"
    - id: status
      kind: "실패 결과"
      name: "5xx Status"
      description: "실패 지점에 따라 다른 처리 결과를 표현함"
  steps:
    - title: "1. 500 Internal Server Error"
      from: "Application Server"
      to: "5xx Status"
      route_label: "애플리케이션 서버 내부의 예상하지 못한 처리 실패를 500으로 표현한다."
      active_actors: [application, status]
      description: "더 적절한 5xx가 없는 경우 애플리케이션 내부 처리 실패를 500으로 반환할 수 있다."
      payload: ["500", "Internal Server Error"]
      outcomes:
        - status: reject
          text: "애플리케이션 처리 실패"
    - title: "2. 502 Bad Gateway"
      from: "Gateway"
      to: "5xx Status"
      route_label: "Gateway가 상위 서버에서 유효하지 않은 응답을 받으면 502를 반환한다."
      active_actors: [gateway, application, status]
      description: "502는 게이트웨이가 응답을 받았지만 프로토콜이나 내용상 유효하게 해석하지 못한 상황이다."
      payload: ["502", "유효하지 않은 상위 응답"]
      outcomes:
        - status: reject
          text: "응답은 받았지만 해석할 수 없음"
    - title: "3. 504 Gateway Timeout"
      from: "Gateway"
      to: "5xx Status"
      route_label: "Gateway가 상위 서버의 응답을 제한 시간 안에 받지 못하면 504를 반환한다."
      active_actors: [gateway, application, status]
      description: "504는 502와 달리 상위 서버의 응답을 제때 받지 못해 기다림이 시간 제한을 넘은 상황이다."
      payload: ["504", "Gateway Timeout"]
      outcomes:
        - status: warning
          text: "응답을 받지 못함"
    - title: "4. 503 Service Unavailable"
      from: "Gateway"
      to: "5xx Status"
      route_label: "현재 요청을 처리할 준비가 되지 않은 상태를 503으로 표현한다."
      active_actors: [client, gateway, application, status]
      description: "503은 특정 구성 요소에 고정된 코드가 아니라 유지보수나 과부하처럼 일시적인 처리 불가 상태를 나타낸다."
      payload: ["503", "Service Unavailable", "Retry-After"]
      outcomes:
        - status: warning
          text: "게이트웨이에서도 반환될 수 있다."

browser_rendering:
  eyebrow: "Interactive flow"
  title: "브라우저가 응답을 픽셀로 바꾸는 흐름"
  summary: "자원 요청부터 DOM·스타일 계산, Layout·Paint를 거쳐 화면이 만들어지는 과정을 본다."
  layout: six
  actors:
    - id: input
      kind: "시작"
      name: "URL Input"
      description: "주소와 경로를 입력함"
    - id: network
      kind: "자원 확보"
      name: "Request / Response"
      description: "HTML·CSS·이미지 같은 자원을 주고받음"
    - id: dom
      kind: "문서 구조"
      name: "HTML → DOM"
      description: "HTML을 파싱해 문서 구조를 만듦"
    - id: style
      kind: "스타일 계산"
      name: "CSS → Style"
      description: "CSS를 파싱하고 계산된 스타일을 만듦"
    - id: layout
      kind: "표시 모델"
      name: "Render → Layout"
      description: "표시 대상의 크기와 위치를 계산함"
    - id: paint
      kind: "화면 출력"
      name: "Paint → Pixels"
      description: "색·글자·테두리를 그려 픽셀로 표시함"
  steps:
    - title: "1. URL 입력"
      from: "URL Input"
      to: "Request / Response"
      route_label: "브라우저가 URL에 필요한 자원을 요청한다."
      active_actors: [input, network]
      description: "HTML뿐 아니라 CSS와 이미지·글꼴처럼 화면에 필요한 자원도 요청과 응답 흐름에 포함된다."
      payload: ["URL", "HTML", "CSS", "이미지"]
      outcomes:
        - status: info
          text: "HTML 전체 도착을 기다리지 않고 도착한 부분부터 파싱될 수 있다."
    - title: "2. HTML 파싱"
      from: "Request / Response"
      to: "HTML → DOM"
      route_label: "받은 HTML을 파싱해 DOM을 만든다."
      active_actors: [network, dom]
      description: "브라우저는 HTML을 그대로 화면에 올리는 대신 문서 구조로 해석한다."
      payload: ["받은 HTML", "DOM"]
      outcomes:
        - status: info
          text: "자원 응답과 문서 구조 생성을 구분한다."
    - title: "3. CSS 계산"
      from: "Request / Response"
      to: "CSS → Style"
      route_label: "CSS 규칙을 파싱해 계산된 스타일을 만든다."
      active_actors: [network, style]
      description: "CSS 파싱 결과는 각 표시 대상에 적용할 색·크기·배치 관련 스타일을 결정하는 입력이 된다."
      payload: ["CSS", "계산된 스타일"]
      outcomes:
        - status: info
          text: "DOM과 스타일 계산은 화면 표시를 위한 서로 다른 입력이다."
    - title: "4. 렌더 트리와 Layout"
      from: "HTML → DOM"
      to: "Render → Layout"
      route_label: "DOM과 계산된 스타일을 바탕으로 표시 대상과 크기·위치를 계산한다."
      active_actors: [dom, style, layout]
      description: "렌더 트리는 표시할 요소를 구성하고 Layout 단계는 화면에서 차지할 위치와 크기를 계산한다."
      payload: ["Render Tree", "크기", "위치"]
      outcomes:
        - status: info
          text: "브라우저 내부 단계는 이해를 돕기 위한 단순화된 모델이다."
    - title: "5. Paint와 픽셀 표시"
      from: "Render → Layout"
      to: "Paint → Pixels"
      route_label: "계산된 모델을 색·글자·테두리로 그려 화면에 표시한다."
      active_actors: [layout, paint]
      description: "Paint는 준비된 표시 대상에 시각적 표현을 적용하고 최종 화면 픽셀을 만든다."
      payload: ["Layout", "Paint", "Pixels"]
      outcomes:
        - status: allow
          text: "응답이 해석과 계산을 거쳐 화면으로 바뀐다."

cookie_session:
  eyebrow: "Interactive flow"
  title: "Cookie와 Session으로 로그인 상태 유지"
  summary: "브라우저는 세션 ID를 전달하고 서버는 그 ID로 사용자 상태를 조회한다."
  actors:
    - id: browser
      kind: "클라이언트"
      name: "Browser"
      description: "로그인 요청과 이후 Cookie를 보냄"
    - id: cookie
      kind: "브라우저 저장소"
      name: "Cookie"
      description: "sessionId 같은 식별자를 저장함"
    - id: server
      kind: "상태 처리"
      name: "Server"
      description: "자격 증명을 확인하고 Session을 조회함"
    - id: session
      kind: "서버 저장소"
      name: "Session Store"
      description: "사용자별 로그인 상태를 보관함"
  steps:
    - title: "1. 로그인 요청"
      from: "Browser"
      to: "Server"
      route_label: "Browser가 로그인 정보를 서버에 보낸다."
      active_actors: [browser, server]
      description: "HTTP 요청 자체는 이전 요청의 사용자 상태를 자동으로 포함하지 않으므로 로그인 절차가 필요하다."
      payload: ["로그인 정보"]
      outcomes:
        - status: info
          text: "서버가 자격 증명을 확인한다."
    - title: "2. Session 상태 저장"
      from: "Server"
      to: "Session Store"
      route_label: "서버가 로그인 상태와 사용자 식별 정보를 Session에 저장한다."
      active_actors: [server, session]
      description: "Session은 여러 요청에 걸친 사용자 상태를 서버가 관리하는 저장 방식이다."
      payload: ["로그인 상태", "사용자 식별 정보"]
      outcomes:
        - status: allow
          text: "Session ID와 연결할 서버 측 상태가 만들어진다."
    - title: "3. Set-Cookie 응답"
      from: "Server"
      to: "Cookie"
      route_label: "서버가 세션 ID를 Set-Cookie로 Browser에 저장하게 한다."
      active_actors: [server, browser, cookie]
      description: "일반적인 세션 로그인에서는 로그인 정보 전체가 아니라 Session을 찾을 식별자를 Cookie에 담는다."
      payload: ["Set-Cookie", "sessionId=abc..."]
      outcomes:
        - status: info
          text: "브라우저에는 세션 ID만 저장된다."
    - title: "4. 이후 요청에 Cookie 전송"
      from: "Cookie"
      to: "Server"
      route_label: "조건에 맞는 이후 요청에 Browser가 sessionId Cookie를 포함한다."
      active_actors: [browser, cookie, server]
      description: "Cookie는 브라우저가 저장했다가 조건에 맞는 요청에 다시 보내는 데이터다."
      payload: ["Cookie: sessionId=abc..."]
      outcomes:
        - status: info
          text: "Cookie와 Session은 같은 저장 방식이 아니다."
    - title: "5. Session ID 조회"
      from: "Server"
      to: "Session Store"
      route_label: "서버가 받은 세션 ID로 사용자 상태를 찾아 요청을 처리한다."
      active_actors: [server, session]
      description: "서버는 Cookie의 식별자를 Session Store의 상태와 연결해 여러 요청을 한 로그인 흐름으로 묶는다."
      payload: ["sessionId", "로그인 상태"]
      outcomes:
        - status: allow
          text: "세션 ID로 확인된 사용자 상태를 요청 처리에 사용한다."

observability:
  eyebrow: "Interactive comparison"
  title: "관측 도구가 답하는 운영 질문"
  summary: "Health·Metrics·Trace ID·로그는 서로 다른 운영 질문에 답하며 함께 읽어야 흐름이 연결된다."
  actors:
    - id: health
      kind: "현재 상태"
      name: "Health"
      description: "지금 요청을 받을 수 있는지 확인함"
    - id: metrics
      kind: "시간에 따른 수치"
      name: "Metrics"
      description: "지연과 사용량의 변화를 보여 줌"
    - id: trace
      kind: "요청 흐름 식별자"
      name: "Trace ID"
      description: "하나의 요청이 거친 경로를 연결함"
    - id: logs
      kind: "이벤트 기록"
      name: "Logs"
      description: "무슨 일이 언제 발생했는지 기록함"
  steps:
    - title: "1. Health 확인"
      from: "Health"
      to: "Health"
      route_label: "현재 서비스가 요청을 받을 준비가 되었는지 확인한다."
      active_actors: [health]
      description: "Health는 특정 시점의 현재 상태를 확인하는 질문에 답한다."
      payload: ["현재 상태", "Ready 여부"]
      outcomes:
        - status: info
          text: "지금 요청을 받을 수 있는가?"
    - title: "2. Metrics 확인"
      from: "Metrics"
      to: "Metrics"
      route_label: "시간에 따른 지연과 사용량의 변화를 확인한다."
      active_actors: [metrics]
      description: "Metrics는 p95처럼 여러 요청의 지연 분포나 사용량 변화를 요약한다."
      payload: ["p95", "사용량", "시간 변화"]
      outcomes:
        - status: info
          text: "지연과 사용량은 어떻게 변했는가?"
    - title: "3. Trace ID 연결"
      from: "Trace ID"
      to: "Trace ID"
      route_label: "같은 Trace ID로 서비스와 DB 호출을 한 요청으로 묶는다."
      active_actors: [trace]
      description: "Trace ID는 요청이 어느 컴포넌트를 거쳤는지 찾는 식별자이며 지연 분포 자체를 대신하지 않는다."
      payload: ["Trace ID", "서비스 호출", "DB 호출"]
      outcomes:
        - status: info
          text: "이 요청은 어디를 거쳤는가?"
    - title: "4. 로그 사건 확인"
      from: "Logs"
      to: "Logs"
      route_label: "오류·상태 변화·처리 결과를 이벤트 기록으로 확인한다."
      active_actors: [logs]
      description: "로그는 특정 시점의 사건을 남기며 여러 인스턴스의 기록을 모아 Trace ID와 함께 검색할 수 있다."
      payload: ["오류 메시지", "상태 변화", "처리 결과"]
      outcomes:
        - status: info
          text: "무슨 일이 언제 기록되었는가?"

db_redis_lock:
  eyebrow: "Interactive structure"
  title: "수평 확장과 DB 연결 상한·공유 Redis 락"
  summary: "DB 연결 수는 인스턴스별 풀이 합산되고 분산 락 상태는 공통 Redis에서 공유된다."
  actors:
    - id: app_a
      kind: "애플리케이션"
      name: "App Instance A"
      description: "커넥션 풀 최대 N을 보유함"
    - id: app_b
      kind: "애플리케이션"
      name: "App Instance B"
      description: "독립된 커넥션 풀 최대 N을 보유함"
    - id: db
      kind: "데이터베이스"
      name: "DB"
      description: "모든 인스턴스 연결 상한을 함께 부담함"
    - id: redis
      kind: "공유 자원"
      name: "Common Redis"
      description: "모든 인스턴스가 확인하는 분산 락 상태를 저장함"
  steps:
    - title: "1. Instance A의 DB 연결"
      from: "App Instance A"
      to: "DB"
      route_label: "Instance A의 커넥션 풀이 DB 연결 상한을 사용한다."
      active_actors: [app_a, db]
      description: "인스턴스 하나의 풀 최대가 N이면 해당 인스턴스가 사용할 수 있는 연결 수의 상한이 된다."
      payload: ["Pool max N"]
      outcomes:
        - status: info
          text: "인스턴스별 풀이 따로 존재한다."
    - title: "2. Instance B의 DB 연결"
      from: "App Instance B"
      to: "DB"
      route_label: "Instance B의 풀도 같은 DB의 전체 연결 상한에 더해진다."
      active_actors: [app_b, db]
      description: "앱을 수평 확장하면 DB가 부담하는 연결 수는 대략 N × 인스턴스 수로 합산된다."
      payload: ["Pool max N", "N × instance count"]
      outcomes:
        - status: warning
          text: "인스턴스 증설은 DB 연결 비용도 함께 바꾼다."
    - title: "3. 공통 Redis에 락 저장"
      from: "App Instance A"
      to: "Common Redis"
      route_label: "여러 인스턴스가 같은 키의 분산 락 상태를 Redis에 기록한다."
      active_actors: [app_a, app_b, redis]
      description: "로컬 메모리가 아니라 공통 Redis에 락을 두어 Instance A와 B가 같은 상태를 확인하게 한다."
      payload: ["공유 Lock Key", "분산 락 상태"]
      outcomes:
        - status: allow
          text: "모든 인스턴스가 같은 락 상태를 볼 수 있다."
    - title: "4. 락 획득 여부 확인"
      from: "Common Redis"
      to: "App Instance B"
      route_label: "각 인스턴스가 Redis의 같은 키를 확인하고 획득 여부를 판단한다."
      active_actors: [app_a, app_b, redis]
      description: "Redis를 공통으로 사용한다고 모든 상태가 자동 공유되는 것은 아니며 공유해야 할 상태만 공통 자원에 둬야 한다."
      payload: ["같은 키 확인", "획득 성공·실패"]
      outcomes:
        - status: info
          text: "공유 범위와 보관 위치를 먼저 정한다."

functional_pipeline:
  eyebrow: "Interactive flow"
  title: "filter·map·reduce 데이터 처리 흐름"
  summary: "여러 항목을 선택하고 변환한 뒤 하나의 결과로 누적한다."
  actors:
    - id: input
      kind: "입력"
      name: "Input Data"
      description: "여러 항목의 목록을 제공함"
    - id: filter
      kind: "선택"
      name: "filter"
      description: "조건에 맞는 항목만 남김"
    - id: map
      kind: "변환"
      name: "map"
      description: "각 항목을 다른 값으로 바꿈"
    - id: reduce
      kind: "누적"
      name: "reduce"
      description: "여러 항목을 하나의 결과로 모음"
  steps:
    - title: "1. 입력 목록"
      from: "Input Data"
      to: "filter"
      route_label: "여러 항목의 목록을 조건 선택 단계로 넘긴다."
      active_actors: [input, filter]
      description: "전체 데이터에서 먼저 어떤 항목을 처리할지 선택한다."
      payload: ["여러 항목", "목록"]
      outcomes:
        - status: info
          text: "다음 단계는 선택된 항목만 받는다."
    - title: "2. 조건에 맞게 선택"
      from: "filter"
      to: "map"
      route_label: "filter가 조건에 맞는 항목만 map으로 전달한다."
      active_actors: [filter, map]
      description: "filter는 값을 변환하지 않고 처리 대상의 범위를 줄이는 역할을 한다."
      payload: ["조건", "선택된 목록"]
      outcomes:
        - status: allow
          text: "예시 결과: [5, 7]"
    - title: "3. 각 항목 변환"
      from: "map"
      to: "reduce"
      route_label: "map이 선택된 항목을 각각 다른 값으로 바꾼다."
      active_actors: [map, reduce]
      description: "map은 여러 항목 각각에 같은 변환 함수를 적용해 새로운 목록을 만든다."
      payload: ["변환 함수", "변환된 목록"]
      outcomes:
        - status: allow
          text: "예시 결과: [9, 16]"
    - title: "4. 하나의 결과로 누적"
      from: "reduce"
      to: "Result"
      route_label: "reduce가 여러 값을 하나의 결과로 합친다."
      active_actors: [reduce]
      description: "reduce는 누적 규칙에 따라 목록을 하나의 값으로 접어 전체 처리 흐름을 마무리한다."
      payload: ["누적 규칙", "결과: 10"]
      outcomes:
        - status: allow
          text: "선택·변환·누적의 역할이 분리된다."

devops_feedback:
  eyebrow: "Interactive structure"
  title: "Agile·지속적 통합·DevOps의 피드백"
  summary: "개발과 운영은 한쪽이 끝난 뒤 넘겨받는 순서가 아니라 양방향 피드백으로 연결된다."
  actors:
    - id: development
      kind: "변경 생성"
      name: "Development"
      description: "기능과 변경을 만듦"
    - id: operations
      kind: "운영 관점"
      name: "Operations"
      description: "운영 중 문제와 요구를 공유함"
    - id: agile
      kind: "연관 실천"
      name: "Agile"
      description: "짧은 주기와 피드백으로 다음 작업을 조정함"
    - id: ci
      kind: "연관 실천"
      name: "Continuous Integration"
      description: "초기부터 반복 통합하고 품질을 확인함"
  steps:
    - title: "1. 개발 변경"
      from: "Development"
      to: "Operations"
      route_label: "개발에서 만든 변경과 배포가 운영으로 이어진다."
      active_actors: [development, operations]
      description: "DevOps는 개발과 운영을 별도의 인수인계 단계로 나누기보다 변경과 운영을 연결한다."
      payload: ["기능", "변경", "배포"]
      outcomes:
        - status: info
          text: "운영은 개발이 끝난 뒤 시작되는 별도 단계가 아니다."
    - title: "2. 운영 피드백"
      from: "Operations"
      to: "Development"
      route_label: "운영 중 발견한 문제와 요구를 다음 개발에 전달한다."
      active_actors: [operations, development]
      description: "양방향 피드백은 실제 운영 조건을 다음 구현과 배포 판단에 반영하게 한다."
      payload: ["운영 문제", "요구", "피드백"]
      outcomes:
        - status: allow
          text: "개발과 운영의 협업이 반복된다."
    - title: "3. Agile과 연결"
      from: "Agile"
      to: "Development"
      route_label: "짧은 개발 주기와 피드백으로 다음 작업을 조정한다."
      active_actors: [agile, development]
      description: "Agile은 DevOps와 연관되지만 DevOps 전체와 같은 개념이거나 먼저 끝나는 단계는 아니다."
      payload: ["짧은 주기", "피드백", "우선순위 조정"]
      outcomes:
        - status: info
          text: "관련은 있지만 동일한 개념은 아니다."
    - title: "4. 지속적 통합과 연결"
      from: "Continuous Integration"
      to: "Development"
      route_label: "초기부터 반복 통합하고 품질을 확인해 빠른 피드백을 얻는다."
      active_actors: [ci, development]
      description: "지속적 통합은 DevOps와 연결되는 실천이지만 DevOps 전체를 뜻하지는 않는다."
      payload: ["반복 통합", "품질 확인", "빠른 피드백"]
      outcomes:
        - status: info
          text: "서로 연결되지만 순차적으로 한 번씩 밟는 단계는 아니다."

agile_scrum:
  eyebrow: "Interactive flow"
  title: "Agile과 Scrum의 반복 흐름"
  summary: "Product Backlog에서 Sprint와 피드백을 거쳐 다음 작업을 조정한다."
  actors:
    - id: product_backlog
      kind: "제품 전체"
      name: "Product Backlog"
      description: "제품 요구사항과 우선순위를 담음"
    - id: sprint_backlog
      kind: "이번 주기"
      name: "Sprint Backlog"
      description: "이번 Sprint에 진행할 작업을 담음"
    - id: sprint
      kind: "반복 개발"
      name: "Sprint"
      description: "짧은 주기 동안 실행 가능한 결과물을 만듦"
    - id: review
      kind: "검토"
      name: "Review"
      description: "결과물을 보고 고객 피드백을 확인함"
    - id: next_work
      kind: "조정"
      name: "Next Work"
      description: "피드백을 반영해 다음 작업 우선순위를 정함"
  steps:
    - title: "1. Product Backlog 정리"
      from: "Product Backlog"
      to: "Sprint Backlog"
      route_label: "제품 전체 요구사항 중 이번 Sprint 작업을 선택한다."
      active_actors: [product_backlog, sprint_backlog]
      description: "Product Backlog는 제품 전체의 요구사항과 우선순위를 담고 Sprint Backlog는 이번 주기에 실제 진행할 일을 담는다."
      payload: ["요구사항", "우선순위", "Sprint 목표"]
      outcomes:
        - status: info
          text: "두 Backlog의 범위를 구분한다."
    - title: "2. Sprint 실행"
      from: "Sprint Backlog"
      to: "Sprint"
      route_label: "선택한 작업으로 짧은 반복 개발 주기를 진행한다."
      active_actors: [sprint_backlog, sprint]
      description: "팀은 Sprint 목표에 필요한 작업을 진행하고 실행 가능한 결과물을 만든다."
      payload: ["Sprint 목표", "진행 작업", "결과물"]
      outcomes:
        - status: allow
          text: "짧은 주기 안에서 결과물을 만든다."
    - title: "3. 결과물 검토"
      from: "Sprint"
      to: "Review"
      route_label: "Sprint 결과물을 고객과 함께 검토한다."
      active_actors: [sprint, review]
      description: "검토는 모든 요구를 즉시 바꾸는 단계가 아니라 실제 결과에 대한 피드백을 확인하는 단계다."
      payload: ["실행 가능한 결과물", "고객 피드백"]
      outcomes:
        - status: info
          text: "Burn Down Chart는 시간과 남은 작업량을 확인하는 보조 도구다."
    - title: "4. 다음 작업 조정"
      from: "Review"
      to: "Next Work"
      route_label: "검토한 피드백으로 다음 작업의 우선순위를 조정한다."
      active_actors: [review, next_work]
      description: "피드백을 Product Backlog에 반영하고 다음 Sprint에서 진행할 작업을 다시 정한다."
      payload: ["피드백 반영", "우선순위 조정"]
      outcomes:
        - status: allow
          text: "다음 반복 주기로 이어진다."
    - title: "5. 다음 Sprint로 반복"
      from: "Next Work"
      to: "Product Backlog"
      route_label: "조정한 다음 작업을 다시 제품 Backlog와 Sprint 계획에 반영한다."
      active_actors: [next_work, product_backlog, sprint_backlog]
      description: "Agile과 Scrum의 핵심은 짧은 결과물과 피드백을 기준으로 다음 작업을 조정하는 반복이다."
      payload: ["다음 Sprint", "새 우선순위"]
      outcomes:
        - status: allow
          text: "계획을 한 번 고정하는 대신 학습 결과를 다음 주기에 반영한다."

object_dependency:
  eyebrow: "Interactive structure"
  title: "객체에 모은 책임과 추상 타입 의존성"
  summary: "관련 데이터와 기능은 객체에 모으고 고수준 정책은 추상 타입을 바라보게 한다."
  actors:
    - id: book
      kind: "응집된 객체"
      name: "Book"
      description: "제목·저자·페이지와 읽기·예약 책임을 함께 관리함"
    - id: service
      kind: "고수준 정책"
      name: "LibraryService"
      description: "도서 처리 정책을 수행함"
    - id: abstraction
      kind: "추상 타입"
      name: "BookReader"
      description: "read() 메시지로 구현체와 정책 사이를 분리함"
    - id: implementation
      kind: "구현체"
      name: "Memory / File"
      description: "같은 추상 메시지에 저장 방식별로 응답함"
  steps:
    - title: "1. 책임을 Book에 모으기"
      from: "Book"
      to: "Book"
      route_label: "상태와 그 상태를 다루는 기능을 같은 객체 경계에 둔다."
      active_actors: [book]
      description: "관련 데이터와 기능을 함께 관리하면 변경될 책임과 객체 사이의 관계를 따라 코드를 읽기 쉬워진다."
      payload: ["제목·저자·페이지", "읽기", "예약"]
      outcomes:
        - status: allow
          text: "응집도를 높이고 관련 변경을 가까이 둔다."
    - title: "2. 고수준 정책의 추상 의존"
      from: "LibraryService"
      to: "BookReader"
      route_label: "LibraryService가 구체 클래스 대신 BookReader 추상 타입에 의존한다."
      active_actors: [service, abstraction]
      description: "고수준 정책과 저수준 구현 사이에 추상 타입을 두면 구현 교체가 정책 코드로 번지는 범위를 줄일 수 있다."
      payload: ["고수준 정책", "read()", "추상 타입"]
      outcomes:
        - status: info
          text: "의존성의 방향을 구체 구현에서 추상 계약 쪽으로 둔다."
    - title: "3. 구현체 선택"
      from: "BookReader"
      to: "Memory / File"
      route_label: "같은 read() 메시지를 Memory와 File 구현체가 각 방식으로 처리한다."
      active_actors: [abstraction, implementation]
      description: "구현체가 바뀌어도 고수준 정책은 BookReader라는 같은 메시지와 계약을 사용할 수 있다."
      payload: ["Memory", "File", "같은 메시지"]
      outcomes:
        - status: allow
          text: "구체 구현에 대한 결합도를 낮춘다."

tdd_cycle:
  eyebrow: "Interactive flow"
  title: "TDD의 테스트·구현·리팩토링·재검증"
  summary: "기대 동작을 먼저 표현하고 구현한 뒤 내부 구조를 개선하고 다시 검증한다."
  actors:
    - id: test
      kind: "기대 표현"
      name: "Test"
      description: "기대 입력과 결과를 코드로 표현함"
    - id: implementation
      kind: "동작 구현"
      name: "Implementation"
      description: "테스트를 통과하도록 기능을 작성함"
    - id: refactoring
      kind: "구조 개선"
      name: "Refactoring"
      description: "외부 동작을 유지하며 내부 구조를 개선함"
    - id: verification
      kind: "회귀 확인"
      name: "Re-verification"
      description: "기존 기대 동작이 계속 유지되는지 확인함"
  steps:
    - title: "1. 테스트 작성"
      from: "Test"
      to: "Test"
      route_label: "기대 입력과 결과를 테스트로 먼저 표현한다."
      active_actors: [test]
      description: "테스트는 단순한 오류 검출을 넘어 다른 개발자가 기대 동작을 파악하는 문서 역할도 한다."
      payload: ["입력", "기대 결과"]
      outcomes:
        - status: info
          text: "개발의 기준을 코드로 남긴다."
    - title: "2. 구현"
      from: "Test"
      to: "Implementation"
      route_label: "테스트를 통과하도록 필요한 동작을 구현한다."
      active_actors: [test, implementation]
      description: "구현은 테스트가 표현한 기대 결과를 만족하도록 작성하며 새 동작의 기준을 명확히 한다."
      payload: ["기능 코드", "테스트 통과"]
      outcomes:
        - status: allow
          text: "기대 동작이 실행 가능한 코드가 된다."
    - title: "3. 리팩토링"
      from: "Implementation"
      to: "Refactoring"
      route_label: "외부 동작을 바꾸지 않고 내부 구조를 개선한다."
      active_actors: [implementation, refactoring]
      description: "리팩토링은 TDD와 같은 개념이 아니라 TDD 사이클 안에서 수행되는 구조 개선 단계다."
      payload: ["중복 제거", "구조 개선", "동작 유지"]
      outcomes:
        - status: info
          text: "새 동작 추가와 내부 구조 개선을 구분한다."
    - title: "4. 재검증"
      from: "Refactoring"
      to: "Re-verification"
      route_label: "같은 테스트를 다시 실행해 기존 기대 동작을 확인한다."
      active_actors: [refactoring, verification, test]
      description: "리팩토링 후에도 테스트가 같은 결과를 요구하므로 변경 전후의 외부 동작을 비교할 수 있다."
      payload: ["회귀 테스트", "기존 기대 동작"]
      outcomes:
        - status: allow
          text: "검증이 끝나면 다음 동작의 테스트 작성으로 다시 이어진다."

blocking_io:
  eyebrow: "Interactive comparison"
  title: "Blocking I/O와 Selector 기반 Non-Blocking I/O"
  summary: "호출 스레드가 데이터를 기다리는 방식과 준비된 채널을 처리하는 방식을 비교한다."
  actors:
    - id: caller
      kind: "호출 주체"
      name: "Application Thread"
      description: "read() 또는 채널 처리를 실행함"
    - id: blocking
      kind: "대기 방식"
      name: "Blocking I/O"
      description: "데이터가 도착할 때까지 같은 호출 스레드를 멈춤"
    - id: selector
      kind: "준비 상태 감시"
      name: "Selector"
      description: "여러 Non-Blocking 채널의 준비 상태를 확인함"
    - id: channels
      kind: "입출력 대상"
      name: "Selectable Channels"
      description: "읽기·쓰기 준비 상태를 애플리케이션에 알림"
  steps:
    - title: "1. Blocking read 호출"
      from: "Application Thread"
      to: "Blocking I/O"
      route_label: "호출 스레드가 InputStream.read()를 호출한다."
      active_actors: [caller, blocking]
      description: "Blocking I/O에서는 호출한 스레드가 데이터 도착·스트림 종료·예외 중 하나가 될 때까지 반환을 기다린다."
      payload: ["InputStream.read()"]
      outcomes:
        - status: warning
          text: "같은 스레드는 대기 중 다음 줄을 실행하지 못한다."
    - title: "2. Blocking 대기"
      from: "Blocking I/O"
      to: "Application Thread"
      route_label: "데이터가 준비될 때까지 read() 호출이 돌아오지 않는다."
      active_actors: [caller, blocking]
      description: "Blocking이라는 이름은 호출한 흐름이 I/O 완료를 기다리는 호출 방식에 초점을 둔다."
      payload: ["데이터 대기", "호출 스레드 정지"]
      outcomes:
        - status: info
          text: "대기 시간 동안 같은 호출 흐름의 다음 처리가 멈춘다."
    - title: "3. Blocking read 반환"
      from: "Blocking I/O"
      to: "Application Thread"
      route_label: "데이터가 준비되면 read()가 반환되고 다음 처리가 실행된다."
      active_actors: [caller, blocking]
      description: "읽기 결과가 반환된 뒤에야 호출 스레드가 다음 줄의 애플리케이션 작업을 진행한다."
      payload: ["read() 반환", "입력 데이터"]
      outcomes:
        - status: allow
          text: "한 채널의 대기와 처리가 호출 흐름에 직접 묶인다."
    - title: "4. 채널 등록"
      from: "Application Thread"
      to: "Selector"
      route_label: "여러 SelectableChannel을 Non-Blocking 모드로 등록한다."
      active_actors: [caller, selector, channels]
      description: "Selector 기반 방식에서는 채널을 감시 대상으로 등록하고 애플리케이션이 준비된 채널을 나중에 처리한다."
      payload: ["SelectableChannel", "Non-Blocking"]
      outcomes:
        - status: info
          text: "여러 채널의 준비 상태를 한 Selector에서 확인할 수 있다."
    - title: "5. 준비 상태 확인"
      from: "Selector"
      to: "Selectable Channels"
      route_label: "Selector.select()가 읽기·쓰기 준비 상태를 확인한다."
      active_actors: [selector, channels]
      description: "Selector.select() 자체는 기다릴 수 있지만 각 채널의 실제 I/O 완료를 대신하는 것은 아니다."
      payload: ["Selector.select()", "읽기 준비", "쓰기 준비"]
      outcomes:
        - status: info
          text: "준비 상태 알림과 I/O 완료는 구분해야 한다."
    - title: "6. 준비된 채널 처리"
      from: "Selectable Channels"
      to: "Application Thread"
      route_label: "애플리케이션이 준비된 채널을 얻어 실제 read()·write()를 수행한다."
      active_actors: [caller, channels, selector]
      description: "준비된 채널만 골라 처리하므로 여러 채널의 대기를 하나의 이벤트 감시 흐름으로 묶을 수 있다."
      payload: ["준비된 채널", "read()", "write()"]
      outcomes:
        - status: allow
          text: "Non-Blocking은 모든 대기를 없애는 말이 아니라 호출과 준비 상태 처리를 분리하는 방식이다."

tls_handshake:
  eyebrow: "Interactive comparison"
  title: "TLS 1.2 ECDHE와 TLS 1.3 핸드셰이크"
  summary: "버전에 따라 메시지와 키 파생 흐름은 달라도 인증과 통신 키 설정 뒤 애플리케이션 데이터를 보호한다."
  actors:
    - id: client
      kind: "통신 주체"
      name: "Client"
      description: "ClientHello와 암호화된 데이터 교환을 시작함"
    - id: server
      kind: "통신 주체"
      name: "Server"
      description: "인증서와 ServerHello를 보내고 핸드셰이크를 완료함"
    - id: certificate
      kind: "서버 인증"
      name: "Certificate"
      description: "서버 공개키와 신원을 증명하는 자료"
    - id: keys
      kind: "키 파생"
      name: "Traffic Keys"
      description: "공유 비밀과 HKDF 등으로 파생된 통신 키"
  steps:
    - title: "1. ClientHello"
      from: "Client"
      to: "Server"
      route_label: "Client가 random 또는 key_share를 포함한 ClientHello를 보낸다."
      active_actors: [client, server]
      description: "TLS 1.2 ECDHE 예시와 TLS 1.3 모두 클라이언트가 핸드셰이크를 시작하지만 키 교환 메시지 구성은 다르다."
      payload: ["ClientHello", "client_random", "key_share"]
      outcomes:
        - status: info
          text: "버전에 따라 같은 이름의 단계가 같은 세부 흐름을 뜻하지는 않는다."
    - title: "2. ServerHello와 인증서"
      from: "Server"
      to: "Client"
      route_label: "Server가 선택 결과와 인증에 필요한 Certificate를 보낸다."
      active_actors: [server, certificate, client]
      description: "TLS 1.2에서는 ServerHello·Certificate·ServerKeyExchange 등이 이어지고 TLS 1.3에서는 메시지와 암호화 시점이 달라진다."
      payload: ["ServerHello", "Certificate", "server_random"]
      outcomes:
        - status: info
          text: "인증서가 서버 신원과 키 교환 검증의 한 축이 된다."
    - title: "3. 공유 비밀과 키 파생"
      from: "Client + Server"
      to: "Traffic Keys"
      route_label: "양쪽이 공유 비밀에서 방향별 핸드셰이크·애플리케이션 키를 파생한다."
      active_actors: [client, server, keys]
      description: "TLS 1.2 자료에서는 pre_master_secret과 master_secret을, TLS 1.3에서는 HKDF 기반 파생 흐름을 사용한다."
      payload: ["공유 비밀", "master_secret", "HKDF"]
      outcomes:
        - status: info
          text: "서로 같은 비밀을 계산하되 네트워크로 비밀값 자체를 보내지 않는다."
    - title: "4. 인증서 검증"
      from: "Certificate"
      to: "Client"
      route_label: "Client가 인증서와 CertificateVerify 등 서버 인증 자료를 검증한다."
      active_actors: [certificate, client, server]
      description: "TLS 1.3의 CertificateVerify는 인증서 개인키를 보유했다는 증명과 연결되며 버전별 메시지 위치를 구분해 봐야 한다."
      payload: ["CertificateVerify", "서버 신원", "서명 검증"]
      outcomes:
        - status: reject
          text: "인증 검증 실패 → 보호된 통신으로 진행하지 않는다."
        - status: allow
          text: "인증 검증 성공 → Finished 확인으로 진행한다."
    - title: "5. Finished 교환"
      from: "Client"
      to: "Server"
      route_label: "양쪽이 Finished로 핸드셰이크 무결성과 키 설정을 확인한다."
      active_actors: [client, server, keys]
      description: "Finished 확인이 끝나면 애플리케이션 데이터에 사용할 대칭키 설정이 합의된 상태가 된다."
      payload: ["Finished", "핸드셰이크 무결성"]
      outcomes:
        - status: allow
          text: "TLS 핸드셰이크가 완료된다."
    - title: "6. 애플리케이션 데이터 보호"
      from: "Traffic Keys"
      to: "Client + Server"
      route_label: "파생된 통신 키로 애플리케이션 데이터를 보호한다."
      active_actors: [client, server, keys]
      description: "핸드셰이크 뒤에는 합의한 대칭키로 애플리케이션 데이터를 암호화하고 무결성을 확인한다."
      payload: ["Application Traffic Key", "암호화된 데이터"]
      outcomes:
        - status: allow
          text: "통신 내용 보호가 시작된다."

load_balancing:
  eyebrow: "Interactive flow"
  title: "로드 밸런서의 요청 분산과 헬스 체크"
  summary: "L4·L7 판단과 헬스 체크 결과에 따라 정상 인스턴스에만 요청을 분배한다."
  actors:
    - id: client
      kind: "요청 주체"
      name: "Client"
      description: "여러 사용자의 HTTP 요청을 보냄"
    - id: load_balancer
      kind: "분산 경계"
      name: "Load Balancer"
      description: "L4·L7 기준으로 전달 대상을 선택함"
    - id: health
      kind: "상태 검사"
      name: "Health Check"
      description: "인스턴스가 요청을 받을 수 있는지 주기적으로 확인함"
    - id: instances
      kind: "백엔드"
      name: "Spring Boot Instances"
      description: "정상 인스턴스는 받고 비정상 인스턴스는 새 요청에서 제외됨"
  steps:
    - title: "1. 요청 도착"
      from: "Client"
      to: "Load Balancer"
      route_label: "Client가 Host·Path·Header를 포함한 HTTP 요청을 보낸다."
      active_actors: [client, load_balancer]
      description: "로드 밸런서는 여러 사용자의 요청을 받아 백엔드 선택 기준을 적용할 경계가 된다."
      payload: ["HTTP Request", "Host", "Path", "Header"]
      outcomes:
        - status: info
          text: "분산 판단을 요청 처리와 분리한다."
    - title: "2. 전달 기준 판단"
      from: "Load Balancer"
      to: "Spring Boot Instances"
      route_label: "L4는 IP·Port, L7은 Host·Path·Header 같은 기준으로 대상을 고른다."
      active_actors: [load_balancer, instances]
      description: "어떤 계층의 정보를 볼 수 있는지에 따라 선택 가능한 분산 기준이 달라진다."
      payload: ["L4: IP·Port", "L7: Host·Path·Header"]
      outcomes:
        - status: info
          text: "Round Robin·Weighted·Least Connections·IP Hash 등을 선택할 수 있다."
    - title: "3. 헬스 체크"
      from: "Load Balancer"
      to: "Health Check"
      route_label: "로드 밸런서가 인스턴스의 상태를 주기적으로 확인한다."
      active_actors: [load_balancer, health, instances]
      description: "헬스 체크 결과는 새 요청을 어느 인스턴스에 보낼 수 있는지 판단하는 입력이 된다."
      payload: ["주기적 검사", "정상", "비정상"]
      outcomes:
        - status: allow
          text: "정상 → 분배 대상에 포함"
        - status: reject
          text: "비정상 → 새 요청에서 제외"
    - title: "4. 정상 인스턴스로 분산"
      from: "Load Balancer"
      to: "Spring Boot Instances"
      route_label: "정상으로 확인된 A·B·C에 새 요청을 분산한다."
      active_actors: [client, load_balancer, health, instances]
      description: "비정상 D를 새 분배에서 제외하고 정상 인스턴스가 요청을 처리하도록 한다."
      payload: ["Spring Boot A·B·C", "요청 처리"]
      outcomes:
        - status: allow
          text: "회복이 확인되면 다시 분배 대상에 포함할 수 있다."

tcp_control:
  eyebrow: "Interactive comparison"
  title: "TCP 흐름 제어와 혼잡 제어"
  summary: "흐름 제어는 수신 버퍼를, 혼잡 제어는 네트워크 경로를 보호한다."
  actors:
    - id: sender
      kind: "송신 주체"
      name: "Sender"
      description: "데이터를 네트워크로 전송함"
    - id: receiver
      kind: "수신 자원"
      name: "Receiver Buffer"
      description: "받은 데이터를 보관할 버퍼와 남은 공간을 가짐"
    - id: flow
      kind: "흐름 제어"
      name: "rwnd"
      description: "수신자가 감당할 수 있는 전송 범위를 알림"
    - id: network
      kind: "혼잡 제어"
      name: "Network Path / cwnd"
      description: "경로에 주입할 데이터 양과 혼잡 상태를 조절함"
  steps:
    - title: "1. 수신 버퍼 상태"
      from: "Receiver Buffer"
      to: "rwnd"
      route_label: "수신 버퍼의 남은 공간을 rwnd로 알린다."
      active_actors: [receiver, flow]
      description: "흐름 제어는 송신자가 수신자가 처리할 수 있는 양보다 많이 보내 버퍼를 넘치게 하지 않도록 한다."
      payload: ["수신 버퍼", "남은 공간", "rwnd"]
      outcomes:
        - status: info
          text: "보호 대상은 수신 측 버퍼다."
    - title: "2. 흐름 제어 적용"
      from: "rwnd"
      to: "Sender"
      route_label: "송신자가 수신 윈도우에 맞춰 보낼 수 있는 범위를 줄이거나 늘린다."
      active_actors: [sender, receiver, flow]
      description: "수신 버퍼가 가득 차면 송신 가능한 데이터 범위를 줄여 수신 측 처리 속도와 균형을 맞춘다."
      payload: ["rwnd", "송신 범위"]
      outcomes:
        - status: warning
          text: "수신 버퍼가 흐름 제어의 기준이다."
    - title: "3. 네트워크 혼잡 확인"
      from: "Network Path / cwnd"
      to: "Sender"
      route_label: "송신자가 네트워크 경로의 혼잡에 맞춰 cwnd를 조절한다."
      active_actors: [sender, network]
      description: "혼잡 제어는 특정 수신 버퍼가 아니라 병목과 손실이 발생할 수 있는 네트워크 경로를 보호한다."
      payload: ["cwnd", "병목", "혼잡 신호"]
      outcomes:
        - status: warning
          text: "혼잡하면 증가 폭을 완만하게 하거나 전송량을 줄인다."
    - title: "4. 두 제어를 함께 적용"
      from: "Sender"
      to: "Receiver Buffer"
      route_label: "실제 전송량은 수신 버퍼와 네트워크 경로 양쪽의 제한을 함께 고려한다."
      active_actors: [sender, receiver, flow, network]
      description: "rwnd와 cwnd는 이름이 비슷한 전송량 제한이지만 각각 수신 측과 네트워크 경로라는 다른 대상을 보호한다."
      payload: ["rwnd", "cwnd", "실제 전송 범위"]
      outcomes:
        - status: allow
          text: "보호 대상이 다르므로 두 제어를 같은 개념으로 합치지 않는다."

udp_header:
  eyebrow: "Interactive structure"
  title: "UDP 데이터그램 헤더와 데이터"
  summary: "UDP 헤더는 네 개의 16비트 필드로 구성되고 길이는 헤더와 데이터를 모두 포함한다."
  actors:
    - id: datagram
      kind: "전송 단위"
      name: "UDP Datagram"
      description: "헤더와 애플리케이션 데이터를 함께 담음"
    - id: ports
      kind: "주소 식별"
      name: "Source / Destination Port"
      description: "송신·수신 애플리케이션 포트를 표현함"
    - id: length
      kind: "크기 정보"
      name: "Length"
      description: "UDP 헤더 8바이트와 데이터 길이의 합을 나타냄"
    - id: checksum
      kind: "검사 정보"
      name: "Checksum"
      description: "데이터그램 오류 검사를 위한 필드"
  steps:
    - title: "1. 포트 필드"
      from: "UDP Datagram"
      to: "Source / Destination Port"
      route_label: "출발지와 목적지 애플리케이션 포트를 헤더에 기록한다."
      active_actors: [datagram, ports]
      description: "UDP 헤더의 앞 두 필드는 송신 측과 수신 측 포트를 각각 16비트로 담는다."
      payload: ["출발지 포트", "목적지 포트", "각 16비트"]
      outcomes:
        - status: info
          text: "포트는 데이터그램을 애플리케이션과 연결하는 식별 정보다."
    - title: "2. Length 필드"
      from: "UDP Datagram"
      to: "Length"
      route_label: "헤더와 데이터 전체 길이를 Length에 기록한다."
      active_actors: [datagram, length]
      description: "UDP Length는 헤더 8바이트만이 아니라 UDP 데이터그램 전체 크기를 포함한다."
      payload: ["UDP Header: 8 bytes", "Data length", "전체 길이"]
      outcomes:
        - status: allow
          text: "Length = 헤더 길이 + 데이터 길이"
    - title: "3. Checksum 필드"
      from: "UDP Datagram"
      to: "Checksum"
      route_label: "데이터그램의 검사 값을 헤더에 포함한다."
      active_actors: [datagram, checksum]
      description: "Checksum은 UDP 데이터그램의 전송 중 오류를 확인하는 헤더 필드다."
      payload: ["Checksum", "16비트"]
      outcomes:
        - status: info
          text: "헤더 필드 자체와 애플리케이션 데이터의 역할을 구분한다."
    - title: "4. 데이터그램 완성"
      from: "Source / Destination Port"
      to: "UDP Datagram"
      route_label: "네 개의 헤더 필드와 데이터를 하나의 UDP 데이터그램으로 전송한다."
      active_actors: [datagram, ports, length, checksum]
      description: "UDP 데이터그램은 출발지 포트·목적지 포트·길이·체크섬 헤더와 애플리케이션 데이터를 함께 가진다."
      payload: ["4 × 16비트 헤더 필드", "Application Data"]
      outcomes:
        - status: allow
          text: "UDP 헤더의 기본 구조를 완성한다."

osi_layers:
  eyebrow: "Interactive flow"
  title: "OSI 7계층과 데이터 단위"
  summary: "송신 측은 상위에서 하위로 캡슐화하고 수신 측은 하위에서 상위로 해석한다."
  actors:
    - id: application
      kind: "7~5계층"
      name: "Application Data"
      description: "응용·표현·세션 계층의 애플리케이션 데이터"
    - id: transport
      kind: "4계층"
      name: "Transport"
      description: "TCP 세그먼트 또는 UDP 데이터그램으로 전달함"
    - id: network
      kind: "3계층"
      name: "Network"
      description: "패킷 단위로 다음 네트워크를 선택함"
    - id: link
      kind: "2계층"
      name: "Data Link"
      description: "프레임 단위로 인접 노드에 전달함"
    - id: physical
      kind: "1계층"
      name: "Physical"
      description: "비트 신호로 실제 전송함"
  steps:
    - title: "1. 응용 데이터"
      from: "Application Data"
      to: "Transport"
      route_label: "응용 데이터가 전송 계층으로 내려간다."
      active_actors: [application, transport]
      description: "응용·표현·세션 계층에서 다루는 데이터가 아래 계층으로 전달될 준비를 한다."
      payload: ["데이터"]
      outcomes:
        - status: info
          text: "송신 측에서는 위에서 아래로 흐름을 본다."
    - title: "2. 전송 계층 캡슐화"
      from: "Transport"
      to: "Network"
      route_label: "TCP 세그먼트 또는 UDP 데이터그램으로 포장해 전달한다."
      active_actors: [transport, network]
      description: "전송 계층은 애플리케이션 데이터에 전송 계층 정보를 붙여 세그먼트나 데이터그램으로 만든다."
      payload: ["TCP Segment", "UDP Datagram"]
      outcomes:
        - status: info
          text: "전송 계층 데이터 단위가 만들어진다."
    - title: "3. 네트워크 계층"
      from: "Transport"
      to: "Network"
      route_label: "전송 단위를 패킷으로 감싸 목적지 네트워크를 향하게 한다."
      active_actors: [transport, network]
      description: "네트워크 계층은 상위 전송 단위를 패킷에 담아 다음 경로를 따라 전달할 수 있게 한다."
      payload: ["Packet"]
      outcomes:
        - status: info
          text: "데이터 → 세그먼트·데이터그램 → 패킷"
    - title: "4. 데이터 링크 계층"
      from: "Network"
      to: "Data Link"
      route_label: "패킷을 프레임에 담아 인접 네트워크 장치로 전달한다."
      active_actors: [network, link]
      description: "데이터 링크 계층은 현재 링크에서 전달할 프레임 단위와 관련 정보를 다룬다."
      payload: ["Frame"]
      outcomes:
        - status: info
          text: "패킷이 프레임으로 캡슐화된다."
    - title: "5. 물리 전송과 역캡슐화"
      from: "Data Link"
      to: "Physical"
      route_label: "프레임을 비트 신호로 전송하고 수신 측은 아래에서 위로 해석한다."
      active_actors: [link, physical, application]
      description: "물리 계층에서 비트가 전송된 뒤 수신 측은 하위 계층에서 상위 계층으로 각 데이터 단위를 벗겨낸다."
      payload: ["Bits", "Frame", "Packet", "Data"]
      outcomes:
        - status: allow
          text: "수신 측에서는 아래에서 위로 흐름을 이해한다."

tcp_handshake:
  eyebrow: "Interactive flow"
  title: "TCP 연결 수립과 정상 종료"
  summary: "3-Way Handshake로 연결을 수립하고 FIN·ACK 교환으로 양방향 송신을 종료한다."
  actors:
    - id: host_a
      kind: "연결 주체"
      name: "Host A"
      description: "연결을 시작하고 종료를 요청할 수 있음"
    - id: host_b
      kind: "연결 상대"
      name: "Host B"
      description: "요청을 확인하고 자신의 송신 종료를 알림"
    - id: connection
      kind: "연결 상태"
      name: "TCP Connection"
      description: "양쪽의 순서 번호와 확인 응답을 관리함"
    - id: time_wait
      kind: "종료 상태"
      name: "TIME-WAIT"
      description: "마지막 ACK와 지연 세그먼트를 고려하는 상태"
  steps:
    - title: "1. SYN"
      from: "Host A"
      to: "Host B"
      route_label: "Host A가 연결 요청과 초기 순서 번호를 보낸다."
      active_actors: [host_a, host_b, connection]
      description: "3-Way Handshake의 첫 메시지는 연결을 시작하고 Host A의 순서 번호를 알린다."
      payload: ["SYN", "초기 순서 번호"]
      outcomes:
        - status: info
          text: "아직 양쪽의 연결 확인이 모두 끝난 상태는 아니다."
    - title: "2. SYN-ACK"
      from: "Host B"
      to: "Host A"
      route_label: "Host B가 요청을 확인하고 자신의 연결 요청을 함께 보낸다."
      active_actors: [host_a, host_b, connection]
      description: "Host B는 Host A의 SYN을 확인하는 ACK와 자신의 SYN을 하나의 응답으로 보낸다."
      payload: ["SYN-ACK", "요청 확인", "서버의 요청"]
      outcomes:
        - status: info
          text: "양쪽이 서로의 요청을 확인할 준비를 한다."
    - title: "3. ACK와 연결 수립"
      from: "Host A"
      to: "Host B"
      route_label: "Host A가 Host B의 SYN을 확인하는 ACK를 보낸다."
      active_actors: [host_a, host_b, connection]
      description: "세 번째 ACK까지 확인하면 양쪽의 요청과 응답을 바탕으로 통신을 시작할 수 있다."
      payload: ["ACK", "연결 수립"]
      outcomes:
        - status: allow
          text: "3-Way Handshake 완료"
    - title: "4. 첫 번째 FIN"
      from: "Host A"
      to: "Host B"
      route_label: "Host A가 자신의 송신 방향을 끝내겠다고 알린다."
      active_actors: [host_a, host_b, connection]
      description: "TCP 종료는 한 번에 양방향을 모두 끊는 것이 아니라 각 방향의 송신 종료를 따로 확인한다."
      payload: ["FIN", "A 방향 송신 종료"]
      outcomes:
        - status: info
          text: "Host B의 송신 방향은 아직 열려 있을 수 있다."
    - title: "5. 첫 번째 FIN 확인"
      from: "Host B"
      to: "Host A"
      route_label: "Host B가 첫 번째 FIN을 ACK로 확인한다."
      active_actors: [host_a, host_b, connection]
      description: "첫 번째 FIN에 대한 ACK는 Host A의 종료 요청을 받았다는 뜻이며 Host B의 송신 종료와는 별개다."
      payload: ["ACK", "첫 FIN 확인"]
      outcomes:
        - status: info
          text: "종료가 양방향에서 동시에 끝나는 것은 아니다."
    - title: "6. 두 번째 FIN과 ACK"
      from: "Host B"
      to: "Host A"
      route_label: "Host B가 자신의 FIN을 보내고 Host A가 마지막 ACK를 보낸다."
      active_actors: [host_a, host_b, connection, time_wait]
      description: "B의 FIN 뒤 A가 ACK를 보내면 정상 종료의 네 메시지 흐름이 완성된다."
      payload: ["FIN", "ACK", "두 번째 송신 종료"]
      outcomes:
        - status: allow
          text: "정상 종료 메시지 교환 완료"
    - title: "7. TIME-WAIT 고려"
      from: "Host A"
      to: "TIME-WAIT"
      route_label: "마지막 ACK 손실에 대비해 Host A가 TIME-WAIT 상태를 고려한다."
      active_actors: [host_a, host_b, time_wait]
      description: "마지막 ACK를 받지 못하면 B가 FIN을 재전송할 수 있으므로 종료 직후의 지연 세그먼트를 고려한다."
      payload: ["TIME-WAIT", "FIN 재전송", "ACK 재전송"]
      outcomes:
        - status: info
          text: "연결 종료 뒤에도 재전송 가능성을 고려한다."

procedure_call:
  eyebrow: "Interactive flow"
  title: "저장 프로시저의 정의와 호출"
  summary: "정의할 때 본문을 DB에 저장하고 호출할 때는 이름과 인수를 전달한다."
  actors:
    - id: deploy
      kind: "정의 주체"
      name: "DB Admin / Deploy"
      description: "CREATE PROCEDURE로 본문과 매개변수를 정의함"
    - id: database
      kind: "실행 장소"
      name: "Database"
      description: "저장된 프로시저 본문을 보관하고 실행함"
    - id: application
      kind: "호출자"
      name: "Application"
      description: "프로시저 이름과 인수를 전달함"
    - id: result
      kind: "반환 값"
      name: "Result"
      description: "실행 결과 행이나 OUT 값을 호출자에게 반환함"
  steps:
    - title: "1. 프로시저 정의"
      from: "DB Admin / Deploy"
      to: "Database"
      route_label: "정의 시점에 CREATE PROCEDURE와 본문을 DB에 저장한다."
      active_actors: [deploy, database]
      description: "프로시저 전체 본문은 호출할 때마다 다시 보내는 것이 아니라 정의 단계에서 DB에 보관된다."
      payload: ["CREATE PROCEDURE", "본문", "매개변수"]
      outcomes:
        - status: allow
          text: "DB 내부에 add_amount 같은 저장 작업이 생긴다."
    - title: "2. 이름과 인수로 호출"
      from: "Application"
      to: "Database"
      route_label: "애플리케이션이 CALL 이름과 입력값만 전달한다."
      active_actors: [application, database]
      description: "호출자는 저장된 프로시저 본문 전체가 아니라 add_amount(5, 10, NULL)처럼 이름과 인수를 보낸다."
      payload: ["CALL add_amount", "입력 인수"]
      outcomes:
        - status: info
          text: "정의와 호출에서 전달되는 값의 범위를 구분한다."
    - title: "3. DB 내부 실행"
      from: "Database"
      to: "Result"
      route_label: "DB가 저장된 본문을 찾아 실행하고 결과를 만든다."
      active_actors: [database, result]
      description: "프로시저는 DB 내부에서 실행되며 예시에서는 p_total과 p_added 같은 결과를 계산한다."
      payload: ["저장된 본문", "p_total: 15", "p_added: 5"]
      outcomes:
        - status: allow
          text: "실행 위치는 DB 내부다."
    - title: "4. 결과 반환"
      from: "Result"
      to: "Application"
      route_label: "출력 결과 행이나 OUT 값을 호출자에게 반환한다."
      active_actors: [result, application]
      description: "호출자는 DB가 실행한 작업의 결과만 받아 다음 애플리케이션 흐름에 사용한다."
      payload: ["결과 행", "15", "5"]
      outcomes:
        - status: allow
          text: "호출마다 본문 전체를 전송하지 않는다."

cache_invalidation:
  eyebrow: "Interactive flow"
  title: "DB 변경과 Redis 캐시 무효화"
  summary: "TTL 만료와 원본 변경에 따른 캐시 무효화는 서로 다른 흐름이다."
  actors:
    - id: database
      kind: "원본 상태"
      name: "Relational DB"
      description: "변경 내용을 커밋해 기준 상태를 확정함"
    - id: cache
      kind: "캐시 상태"
      name: "Redis"
      description: "조회 결과와 TTL을 보관함"
    - id: invalidation
      kind: "무효화"
      name: "Cache Invalidation"
      description: "원본 변경과 관련된 오래된 결과를 삭제함"
    - id: reader
      kind: "조회 경로"
      name: "Next Read"
      description: "캐시 미스 뒤 DB에서 새 결과를 읽음"
  steps:
    - title: "1. DB 변경 커밋"
      from: "Relational DB"
      to: "Redis"
      route_label: "DB에는 새 주소가 커밋됐지만 Redis에는 이전 조회 결과가 남을 수 있다."
      active_actors: [database, cache]
      description: "DB와 Redis가 하나의 트랜잭션으로 자동 처리된다고 가정하지 않고 두 상태를 따로 확인한다."
      payload: ["새 주소", "이전 캐시", "TTL 남음"]
      outcomes:
        - status: warning
          text: "다음 요청이 만료 전 오래된 결과를 받을 수 있다."
    - title: "2. 관련 캐시 삭제"
      from: "Relational DB"
      to: "Cache Invalidation"
      route_label: "DB 변경을 확정한 뒤 관련 키의 오래된 캐시를 무효화한다."
      active_actors: [database, invalidation, cache]
      description: "캐시 무효화는 원본 변경으로 더 이상 사용할 수 없는 결과를 제거하는 대응이다."
      payload: ["DB 변경 커밋", "관련 키 삭제"]
      outcomes:
        - status: allow
          text: "오래된 조회 결과를 다음 요청에서 사용하지 않는다."
    - title: "3. 다음 조회의 Cache Miss"
      from: "Next Read"
      to: "Relational DB"
      route_label: "다음 조회가 캐시 미스를 만나 DB에서 새 결과를 읽는다."
      active_actors: [reader, cache, database]
      description: "삭제된 캐시가 없으므로 조회 경로는 원본 DB를 읽어 최신 결과를 얻는다."
      payload: ["Cache Miss", "DB 조회", "새 결과"]
      outcomes:
        - status: info
          text: "캐시 삭제와 DB 조회를 한 단계로 뭉치지 않는다."
    - title: "4. 새 결과 재저장"
      from: "Relational DB"
      to: "Redis"
      route_label: "새 조회 결과를 Redis에 저장하고 필요한 TTL을 다시 설정한다."
      active_actors: [database, cache, reader]
      description: "TTL은 시간이 지나면 키를 만료시키고 무효화는 원본 변경으로 오래된 결과를 제거한다."
      payload: ["새 조회 결과", "TTL 재설정"]
      outcomes:
        - status: allow
          text: "다음 요청부터 새 결과를 사용할 수 있다."

snapshot_timing:
  eyebrow: "Interactive comparison"
  title: "READ COMMITTED와 REPEATABLE READ의 스냅샷 기준"
  summary: "BEGIN 시점과 실제 스냅샷 기준 문장을 구분해 재조회 결과를 비교한다."
  actors:
    - id: t1
      kind: "첫 트랜잭션"
      name: "T1"
      description: "BEGIN 뒤 같은 행을 다시 조회함"
    - id: t2
      kind: "동시 변경"
      name: "T2"
      description: "이름을 변경하고 커밋함"
    - id: read_committed
      kind: "문장 기준"
      name: "READ COMMITTED"
      description: "각 문장이 시작할 때의 스냅샷을 사용함"
    - id: repeatable_read
      kind: "트랜잭션 기준"
      name: "REPEATABLE READ"
      description: "첫 조회·변경 문장의 스냅샷을 유지함"
  steps:
    - title: "1. T1 BEGIN"
      from: "T1"
      to: "READ COMMITTED"
      route_label: "T1이 시작되지만 BEGIN만으로 REPEATABLE READ 스냅샷이 확정되지는 않는다."
      active_actors: [t1, read_committed, repeatable_read]
      description: "트랜잭션 시작 시점과 실제 첫 조회 또는 첫 변경 문장의 시점을 나누어 본다."
      payload: ["BEGIN", "아직 조회 없음"]
      outcomes:
        - status: info
          text: "BEGIN과 스냅샷 확정은 같은 사건이 아니다."
    - title: "2. T1 첫 SELECT"
      from: "T1"
      to: "REPEATABLE READ"
      route_label: "첫 조회가 REPEATABLE READ에서 유지할 스냅샷의 기준이 된다."
      active_actors: [t1, repeatable_read]
      description: "첫 SELECT에서 달빛국수를 읽은 시점의 스냅샷을 이후 재조회가 참조하게 된다."
      payload: ["첫 SELECT", "달빛국수", "스냅샷 확정"]
      outcomes:
        - status: info
          text: "첫 조회 또는 첫 변경 문장이 기준이다."
    - title: "3. T2 UPDATE와 COMMIT"
      from: "T2"
      to: "T1"
      route_label: "T2가 이름을 달빛면옥으로 바꾸고 커밋한다."
      active_actors: [t1, t2, read_committed, repeatable_read]
      description: "동시 트랜잭션이 뒤에서 변경을 확정해도 격리 수준에 따라 T1의 다음 조회가 보는 스냅샷이 달라진다."
      payload: ["UPDATE", "COMMIT", "달빛면옥"]
      outcomes:
        - status: info
          text: "T2의 커밋이 T1의 모든 조회에 같은 방식으로 보이는 것은 아니다."
    - title: "4. T1 재조회 결과"
      from: "T1"
      to: "READ COMMITTED / REPEATABLE READ"
      route_label: "READ COMMITTED는 새 문장 스냅샷, REPEATABLE READ는 기존 스냅샷을 참조한다."
      active_actors: [t1, read_committed, repeatable_read]
      description: "READ COMMITTED에서는 달빛면옥을 읽을 수 있지만 REPEATABLE READ에서는 첫 조회 때의 달빛국수가 유지된다."
      payload: ["READ COMMITTED: 달빛면옥", "REPEATABLE READ: 달빛국수"]
      outcomes:
        - status: allow
          text: "격리 수준 이름보다 스냅샷 기준 시점을 확인한다."

serializable_rule:
  eyebrow: "Interactive comparison"
  title: "REPEATABLE READ와 SERIALIZABLE의 결과 보장"
  summary: "같은 값을 반복해 읽는 보장과 업무 규칙을 깨지 않는 직렬 실행 결과 보장은 다르다."
  actors:
    - id: t1
      kind: "동시 트랜잭션"
      name: "T1"
      description: "활성 운영자 A를 비활성화하려 함"
    - id: t2
      kind: "동시 트랜잭션"
      name: "T2"
      description: "활성 운영자 B를 비활성화하려 함"
    - id: repeatable
      kind: "스냅샷 보장"
      name: "REPEATABLE READ"
      description: "각 트랜잭션이 안정적인 스냅샷을 읽음"
    - id: serializable
      kind: "결과 보장"
      name: "SERIALIZABLE"
      description: "성공한 결과가 어떤 직렬 실행과 같아야 함"
  steps:
    - title: "1. 공통 초기 상태"
      from: "T1"
      to: "T2"
      route_label: "T1과 T2가 활성 운영자 A와 B 두 명을 확인한다."
      active_actors: [t1, t2]
      description: "업무 규칙은 활성 운영자가 최소 한 명 남아야 한다는 것이며 두 트랜잭션은 같은 초기 상태를 읽는다."
      payload: ["A: 활성", "B: 활성", "최소 1명"]
      outcomes:
        - status: info
          text: "각자 확인한 상태가 최종 업무 규칙을 자동 보장하지는 않는다."
    - title: "2. 서로 다른 운영자 변경"
      from: "T1"
      to: "T2"
      route_label: "T1은 A를, T2는 B를 비활성화한다."
      active_actors: [t1, t2, repeatable, serializable]
      description: "두 변경이 서로 다른 행을 건드리면 일반적인 행 충돌만으로 업무 규칙 위반을 발견하기 어려울 수 있다."
      payload: ["A 비활성화", "B 비활성화"]
      outcomes:
        - status: warning
          text: "각 트랜잭션의 안정적인 스냅샷과 전체 결과의 직렬성은 별개다."
    - title: "3. REPEATABLE READ 결과"
      from: "REPEATABLE READ"
      to: "T1 + T2 COMMIT"
      route_label: "두 트랜잭션이 모두 커밋하면 활성 운영자 0명이 될 수 있다."
      active_actors: [repeatable, t1, t2]
      description: "REPEATABLE READ는 같은 트랜잭션에서 같은 값을 읽는 성질을 제공해도 애플리케이션 업무 규칙을 자동으로 지키게 하지는 않는다."
      payload: ["T1 COMMIT", "T2 COMMIT", "활성 운영자 0명"]
      outcomes:
        - status: reject
          text: "스냅샷 안정성이 업무 규칙 보장을 의미하지 않는다."
    - title: "4. SERIALIZABLE 결과"
      from: "SERIALIZABLE"
      to: "T1 또는 T2 실패"
      route_label: "직렬 실행으로 설명할 수 없는 결과를 만들지 않도록 한 트랜잭션이 실패할 수 있다."
      active_actors: [serializable, t1, t2]
      description: "SERIALIZABLE은 모든 작업을 실제로 한 줄로 실행하는 것이 아니라 성공 결과가 어떤 직렬 실행과 같도록 조정한다."
      payload: ["직렬화 실패", "40001 가능", "재시도 고려"]
      outcomes:
        - status: allow
          text: "두 작업이 모두 커밋해 업무 규칙을 깨는 결과를 허용하지 않는다."

transaction_boundary:
  eyebrow: "Interactive comparison"
  title: "자동 커밋과 트랜잭션 경계"
  summary: "같은 실패라도 여러 SQL을 하나로 묶었는지에 따라 남는 결과가 달라진다."
  actors:
    - id: restaurant
      kind: "첫 작업"
      name: "Restaurant INSERT"
      description: "음식점 101 저장을 수행함"
    - id: relation
      kind: "두 번째 작업"
      name: "RestaurantVideo INSERT"
      description: "존재하지 않는 video_id 999 연결을 시도함"
    - id: autocommit
      kind: "분리된 확정"
      name: "Auto Commit"
      description: "각 문장을 별도 트랜잭션으로 확정함"
    - id: transaction
      kind: "업무 단위"
      name: "Explicit Transaction"
      description: "BEGIN부터 COMMIT·ROLLBACK까지 묶음"
  steps:
    - title: "1. 음식점 저장"
      from: "Restaurant INSERT"
      to: "Auto Commit"
      route_label: "자동 커밋에서는 음식점 101 저장이 즉시 확정된다."
      active_actors: [restaurant, autocommit]
      description: "첫 SQL이 성공하면 다음 SQL의 성공 여부와 분리된 커밋으로 남을 수 있다."
      payload: ["restaurant 101", "COMMIT"]
      outcomes:
        - status: allow
          text: "첫 문장의 변경이 이미 확정된다."
    - title: "2. 영상 연결 실패"
      from: "RestaurantVideo INSERT"
      to: "Auto Commit"
      route_label: "존재하지 않는 video_id 999 외래키 오류가 발생한다."
      active_actors: [relation, autocommit]
      description: "자동 커밋에서는 두 번째 문장의 실패가 앞선 커밋을 자동으로 취소하지 않는다."
      payload: ["video_id 999", "Foreign Key Error"]
      outcomes:
        - status: reject
          text: "음식점 101은 남고 영상 연결은 없다."
    - title: "3. 명시적 트랜잭션 시작"
      from: "Explicit Transaction"
      to: "Restaurant INSERT"
      route_label: "BEGIN 뒤 음식점 저장과 영상 연결을 하나의 성공 단위로 실행한다."
      active_actors: [transaction, restaurant, relation]
      description: "두 작업이 함께 성공해야 하는지는 SQL 개수가 아니라 업무의 성공 조건으로 정한다."
      payload: ["BEGIN", "음식점 저장", "영상 연결"]
      outcomes:
        - status: info
          text: "첫 작업이 성공해도 아직 최종 확정 전이다."
    - title: "4. 오류 시 ROLLBACK"
      from: "RestaurantVideo INSERT"
      to: "Explicit Transaction"
      route_label: "영상 연결이 실패하면 전체 트랜잭션을 ROLLBACK한다."
      active_actors: [transaction, relation, restaurant]
      description: "명시적 경계에서는 앞선 음식점 저장까지 함께 취소해 업무 단위의 부분 성공을 막을 수 있다."
      payload: ["외래키 오류", "ROLLBACK", "전체 취소"]
      outcomes:
        - status: reject
          text: "음식점 저장도 함께 취소된다."

wal_mvcc:
  eyebrow: "Interactive structure"
  title: "WAL·데이터 페이지·MVCC의 역할 구분"
  summary: "WAL은 장애 복구 기록이고 MVCC는 동시 실행 중 어떤 행 버전을 볼지 결정한다."
  actors:
    - id: query
      kind: "변경 실행"
      name: "SQL / Query Processor"
      description: "데이터 변경을 수행함"
    - id: buffer
      kind: "메모리 페이지"
      name: "Buffer Manager"
      description: "변경된 데이터 페이지를 메모리에 유지함"
    - id: wal
      kind: "영속 로그"
      name: "Persistent WAL"
      description: "데이터 페이지보다 먼저 변경 기록을 flush함"
    - id: data_file
      kind: "영속 데이터"
      name: "Data File / MVCC"
      description: "페이지를 기록하고 스냅샷에 따른 행 가시성을 관리함"
  steps:
    - title: "1. SQL 변경"
      from: "SQL / Query Processor"
      to: "Buffer Manager"
      route_label: "SQL 실행이 데이터 페이지의 메모리 변경을 만든다."
      active_actors: [query, buffer]
      description: "변경된 페이지는 즉시 데이터 파일에 기록되지 않고 Buffer Manager 메모리에 남아 있을 수 있다."
      payload: ["UPDATE", "변경 페이지", "메모리"]
      outcomes:
        - status: info
          text: "커밋과 데이터 페이지 기록은 같은 사건이 아니다."
    - title: "2. WAL 먼저 영속화"
      from: "Buffer Manager"
      to: "Persistent WAL"
      route_label: "데이터 페이지보다 변경 기록을 먼저 WAL에 flush한다."
      active_actors: [buffer, wal]
      description: "WAL은 커밋 내구성과 장애 뒤 복구에 필요한 변경 기록을 보관하는 층위다."
      payload: ["변경 기록", "WAL flush", "커밋 내구성"]
      outcomes:
        - status: allow
          text: "먼저 기록된 WAL이 REDO의 근거가 된다."
    - title: "3. 데이터 파일 반영"
      from: "Buffer Manager"
      to: "Data File / MVCC"
      route_label: "변경된 페이지는 나중에 데이터 파일에 기록될 수 있다."
      active_actors: [buffer, data_file]
      description: "장애로 메모리를 잃으면 WAL을 읽어 데이터 파일에 REDO할 수 있으므로 두 기록 시점을 분리한다."
      payload: ["최신 페이지", "데이터 파일", "REDO"]
      outcomes:
        - status: info
          text: "데이터 파일 쓰기가 WAL보다 늦을 수 있다."
    - title: "4. MVCC 가시성 판단"
      from: "Data File / MVCC"
      to: "Data File / MVCC"
      route_label: "트랜잭션 스냅샷에 따라 v1·v2 중 보이는 행 버전을 선택한다."
      active_actors: [data_file]
      description: "MVCC는 WAL 기록 순서의 단계가 아니라 동시 실행 중 트랜잭션이 어떤 행 버전을 읽을지 관리하는 별도의 축이다."
      payload: ["v1 이전 값", "v2 변경 값", "스냅샷"]
      outcomes:
        - status: info
          text: "WAL과 MVCC를 하나의 저장 순서로 합치지 않는다."

normalization:
  eyebrow: "Interactive structure"
  title: "함수 종속성에 따른 정규화 분해"
  summary: "사실을 결정하는 키가 있는 테이블에 두고 관계는 연결 테이블로 분리한다."
  actors:
    - id: raw
      kind: "분해 전"
      name: "RestaurantVideoDetail"
      description: "음식점·영상·유튜버 사실이 한 행에 함께 반복됨"
    - id: dependency
      kind: "분석 기준"
      name: "Functional Dependencies"
      description: "키가 어떤 사실을 결정하는지 확인함"
    - id: entities
      kind: "대상 테이블"
      name: "Restaurant / Video / YouTuber"
      description: "각 대상의 사실을 식별 키와 함께 관리함"
    - id: relation
      kind: "연결 테이블"
      name: "RestaurantVideo"
      description: "음식점과 영상의 관계와 복합 PK를 관리함"
  steps:
    - title: "1. 통합 구조 확인"
      from: "RestaurantVideoDetail"
      to: "Functional Dependencies"
      route_label: "한 행에 반복된 음식점·영상·유튜버 정보를 함수 종속성으로 분석한다."
      active_actors: [raw, dependency]
      description: "restaurant_id가 이름을, video_id가 제목과 youtuber_id를, youtuber_id가 이름을 결정하는 관계를 찾는다."
      payload: ["restaurant_name", "video_title", "youtuber_name"]
      outcomes:
        - status: warning
          text: "서로 다른 사실이 한 행에 반복되면 갱신 이상이 생길 수 있다."
    - title: "2. 결정 키별 테이블 분리"
      from: "Functional Dependencies"
      to: "Restaurant / Video / YouTuber"
      route_label: "각 사실을 결정하는 키가 있는 대상 테이블로 옮긴다."
      active_actors: [dependency, entities]
      description: "Restaurant·Video·YouTuber 각각의 고유 사실을 해당 PK가 있는 곳에서 한 번 관리한다."
      payload: ["PK", "restaurant_id", "video_id", "youtuber_id"]
      outcomes:
        - status: allow
          text: "이름과 제목의 중복 저장을 줄인다."
    - title: "3. 관계를 연결 테이블로 이동"
      from: "Restaurant / Video / YouTuber"
      to: "RestaurantVideo"
      route_label: "음식점과 영상의 연결은 FK와 복합 PK를 가진 연결 테이블에 둔다."
      active_actors: [entities, relation]
      description: "대상의 사실과 대상 사이 관계를 분리하면 각 책임과 중복 방지 규칙을 구분해 관리할 수 있다."
      payload: ["restaurant_id FK", "video_id FK", "PK (restaurant_id, video_id)"]
      outcomes:
        - status: allow
          text: "연결 관계의 중복을 복합 PK로 제한한다."

lossless_dependency:
  eyebrow: "Interactive comparison"
  title: "무손실 복원과 종속성 보존"
  summary: "JOIN으로 원래 정보를 복원할 수 있는지와 업무 규칙을 강제할 수 있는지는 별도로 확인한다."
  actors:
    - id: original
      kind: "분해 전 관계"
      name: "Featured Video Relation"
      description: "음식점·유튜버 조합마다 대표 영상 하나라는 규칙을 가짐"
    - id: video
      kind: "대상 테이블"
      name: "Video"
      description: "video_id와 youtuber_id를 관리함"
    - id: join_table
      kind: "연결 테이블"
      name: "RestaurantFeaturedVideo"
      description: "restaurant_id와 video_id를 연결함"
    - id: rule
      kind: "추가 업무 규칙"
      name: "Dependency Check"
      description: "음식점·유튜버 조합의 대표 영상 개수를 검증함"
  steps:
    - title: "1. 분해와 FK 연결"
      from: "Featured Video Relation"
      to: "Video"
      route_label: "Video와 연결 테이블로 정보를 나누고 video_id FK로 연결한다."
      active_actors: [original, video, join_table]
      description: "개별 PK·FK를 두어도 원래 대상과 관계를 참조할 수 있는 구조를 만들 수 있다."
      payload: ["video_id PK", "video_id FK", "restaurant_id"]
      outcomes:
        - status: allow
          text: "참조 대상이 존재하는지 확인할 수 있다."
    - title: "2. 무손실 JOIN 복원"
      from: "RestaurantFeaturedVideo"
      to: "Video"
      route_label: "연결 테이블과 Video를 JOIN해 원래 관계의 속성을 복원한다."
      active_actors: [join_table, video, original]
      description: "공통 속성 video_id가 연결되므로 restaurant_id와 youtuber_id를 포함한 관계를 복원할 수 있다."
      payload: ["JOIN ON video_id", "원래 관계 복원"]
      outcomes:
        - status: allow
          text: "무손실 복원은 가능하다."
    - title: "3. 종속성 규칙 별도 검증"
      from: "RestaurantFeaturedVideo"
      to: "Dependency Check"
      route_label: "PK·FK만으로 음식점·유튜버 조합의 대표 영상 하나 규칙을 보장할 수 있는지 확인한다."
      active_actors: [join_table, video, rule]
      description: "같은 조합에 V101과 V103이 모두 연결되면 JOIN은 되지만 대표 영상 하나라는 업무 규칙은 깨질 수 있다."
      payload: ["(restaurant_id, youtuber_id)", "→ video_id", "추가 검증"]
      outcomes:
        - status: reject
          text: "무손실 복원과 종속성 보존은 같은 보장이 아니다."

anomaly_index:
  eyebrow: "Interactive comparison"
  title: "정규화와 복합 인덱스 설계 기준"
  summary: "중복된 사실은 책임별로 나누고 복합 인덱스는 앞 컬럼 조건이 만드는 구간을 기준으로 읽는다."
  actors:
    - id: duplicated
      kind: "갱신 이상"
      name: "Duplicated Rows"
      description: "같은 음식점 이름이 여러 연결 행에 반복됨"
    - id: normalized
      kind: "분리된 책임"
      name: "Restaurant + RestaurantVideo"
      description: "이름과 연결을 서로 다른 책임으로 관리함"
    - id: index
      kind: "정렬 키"
      name: "Composite Index"
      description: "region_id·category_id·created_at DESC 순으로 정렬함"
    - id: query
      kind: "조회 조건"
      name: "Query Predicate"
      description: "앞 컬럼을 얼마나 고정하는지에 따라 읽을 구간이 달라짐"
  steps:
    - title: "1. 중복 행의 갱신 이상"
      from: "Duplicated Rows"
      to: "Duplicated Rows"
      route_label: "연결 행 일부만 음식점 이름을 바꾸면 서로 다른 이름이 함께 남는다."
      active_actors: [duplicated]
      description: "음식점의 사실과 영상 연결을 한 테이블에 반복 저장하면 일부 행만 수정되는 갱신 이상이 생길 수 있다."
      payload: ["달빛국수", "달빛면옥", "부분 수정"]
      outcomes:
        - status: warning
          text: "한 사실을 여러 행에서 관리하는 비용이 드러난다."
    - title: "2. 책임별 분리"
      from: "Duplicated Rows"
      to: "Restaurant + RestaurantVideo"
      route_label: "Restaurant에는 이름을 한 번 두고 RestaurantVideo에는 연결만 둔다."
      active_actors: [duplicated, normalized]
      description: "이름 변경 대상은 Restaurant 한 행으로 좁히고 영상 관계는 별도 연결 테이블에서 관리한다."
      payload: ["Restaurant", "RestaurantVideo", "책임 분리"]
      outcomes:
        - status: allow
          text: "사실과 관계의 변경 범위를 구분한다."
    - title: "3. 복합 인덱스 정렬"
      from: "Composite Index"
      to: "Query Predicate"
      route_label: "region_id → category_id → created_at DESC 순으로 구간과 정렬이 이어진다."
      active_actors: [index, query]
      description: "앞의 컬럼으로 범위를 좁힌 뒤 같은 조합 안에서 뒤 컬럼의 정렬 순서를 활용한다."
      payload: ["region_id", "category_id", "created_at DESC"]
      outcomes:
        - status: info
          text: "인덱스는 각 컬럼의 독립 목록이 아니다."
    - title: "4. 조건에 따른 활용 범위"
      from: "Query Predicate"
      to: "Composite Index"
      route_label: "지역과 카테고리를 모두 고정하면 해당 구간에서 최신순으로 읽기 쉽다."
      active_actors: [index, query]
      description: "category_id 조건이 빠지면 지역 전체가 created_at 순으로 바로 이어진다고 단정할 수 없어 실행계획을 확인해야 한다."
      payload: ["region_id = 17", "category_id = 3", "LIMIT 20"]
      outcomes:
        - status: info
          text: "복합 인덱스 선택 여부는 데이터 분포와 실행계획으로 확인한다."

composite_index:
  eyebrow: "Interactive comparison"
  title: "복합 인덱스의 컬럼 순서와 조회 조건"
  summary: "앞의 컬럼을 고정한 구간 안에서 뒤 컬럼의 정렬 순서를 활용한다."
  actors:
    - id: index
      kind: "정렬 키"
      name: "region_id → category_id → created_at DESC"
      description: "지역·카테고리·최신순으로 이어지는 복합 인덱스"
    - id: full_match
      kind: "조건이 충분함"
      name: "지역 + 카테고리"
      description: "앞의 두 컬럼이 동등 조건으로 고정됨"
    - id: partial_match
      kind: "조건이 부족함"
      name: "지역만"
      description: "category_id가 고정되지 않음"
    - id: plan
      kind: "검증 기준"
      name: "Execution Plan"
      description: "옵티마이저가 실제 인덱스 활용을 판단함"
  steps:
    - title: "1. 인덱스 순서"
      from: "region_id → category_id → created_at DESC"
      to: "지역 + 카테고리"
      route_label: "먼저 지역으로 묶고 같은 지역 안에서 카테고리, 그 안에서 최신순이 이어진다."
      active_actors: [index, full_match]
      description: "복합 인덱스는 각 컬럼이 독립된 정렬 목록이 아니라 앞 컬럼으로 만든 구간 안에서 다음 순서를 갖는다."
      payload: ["region_id", "category_id", "created_at DESC"]
      outcomes:
        - status: info
          text: "컬럼 순서가 조회 가능한 구간의 기준이 된다."
    - title: "2. 앞의 두 조건 고정"
      from: "지역 + 카테고리"
      to: "Execution Plan"
      route_label: "region_id = 17 AND category_id = 3이면 해당 조합 구간을 최신순으로 읽기 쉽다."
      active_actors: [index, full_match, plan]
      description: "앞의 두 컬럼이 동등 조건으로 고정되면 created_at DESC 순서를 LIMIT 조회에 활용할 가능성이 있다."
      payload: ["region_id = 17", "category_id = 3", "LIMIT 20"]
      outcomes:
        - status: allow
          text: "필요한 구간에서 최신순 읽기를 기대할 수 있다."
    - title: "3. 카테고리 조건 누락"
      from: "지역만"
      to: "Execution Plan"
      route_label: "region_id만 고정하면 지역 전체가 created_at 순이라고 바로 볼 수 없다."
      active_actors: [index, partial_match, plan]
      description: "category_id가 빠지면 여러 카테고리 구간이 섞여 뒤 컬럼의 전역 순서를 직접 보장하지 못할 수 있다."
      payload: ["region_id = 17", "category_id 조건 없음"]
      outcomes:
        - status: warning
          text: "인덱스 순서만 보고 정렬을 단정하지 않는다."
    - title: "4. 실행계획 확인"
      from: "Execution Plan"
      to: "지역 + 카테고리"
      route_label: "데이터 분포와 비용을 포함한 실행계획으로 실제 선택을 확인한다."
      active_actors: [plan, index, full_match, partial_match]
      description: "복합 인덱스를 만들었다는 사실만으로 사용이 보장되지는 않으므로 실제 조회 패턴과 실행계획을 함께 확인한다."
      payload: ["데이터 분포", "옵티마이저 비용", "실행계획"]
      outcomes:
        - status: info
          text: "자주 쓰는 조회가 다르면 다른 인덱스 후보도 검토한다."

replica_consistency:
  eyebrow: "Interactive flow"
  title: "PostgreSQL Primary·Read Replica 읽기 일관성"
  summary: "쓰기 경로와 읽기 분산을 나누되, 수정 직후 최신 값이 필요한지는 별도로 판단한다."
  actors:
    - id: request
      kind: "요청 유형"
      name: "Application Request"
      description: "관리자 수정·일반 검색·수정 직후 조회를 구분함"
    - id: primary
      kind: "쓰기 원본"
      name: "PostgreSQL Primary"
      description: "쓰기와 최신 상태 확인을 처리함"
    - id: wal
      kind: "복제 경로"
      name: "WAL / Standby"
      description: "Primary 변경 기록을 Replica로 전달하고 적용함"
    - id: replica
      kind: "읽기 분산"
      name: "Read Replica"
      description: "복제 지연을 허용할 수 있는 일반 검색을 처리함"
  steps:
    - title: "1. 관리자 수정은 Primary"
      from: "Application Request"
      to: "PostgreSQL Primary"
      route_label: "관리자 음식점 수정은 Primary로 보내 최신 상태를 기록한다."
      active_actors: [request, primary]
      description: "INSERT·UPDATE는 Primary에 먼저 반영되고 커밋 응답의 기준도 Primary가 된다."
      payload: ["관리자 수정", "INSERT·UPDATE"]
      outcomes:
        - status: allow
          text: "쓰기 요청은 자동으로 여러 Replica에 분산되는 것이 아니다."
    - title: "2. WAL 비동기 전달"
      from: "PostgreSQL Primary"
      to: "WAL / Standby"
      route_label: "Primary가 변경 기록을 WAL로 만들고 Standby에 전달한다."
      active_actors: [primary, wal, replica]
      description: "비동기 복제에서는 Primary 커밋 시점과 Replica 적용 시점 사이에 지연이 생길 수 있다."
      payload: ["WAL", "비동기 적용", "복제 지연"]
      outcomes:
        - status: warning
          text: "Replica에는 이전 값이 잠시 남을 수 있다."
    - title: "3. 일반 검색 분산"
      from: "Application Request"
      to: "Read Replica"
      route_label: "짧은 지연을 허용하는 일반 검색을 Read Replica로 보낸다."
      active_actors: [request, replica]
      description: "Read Replica는 읽기 요청을 나누는 데 도움을 주지만 쓰기 확장을 자동으로 해결하는 구성은 아니다."
      payload: ["일반 검색", "읽기 전용 쿼리"]
      outcomes:
        - status: info
          text: "읽기 분산과 쓰기 확장은 다른 문제다."
    - title: "4. 수정 직후 최신 값 확인"
      from: "Application Request"
      to: "PostgreSQL Primary"
      route_label: "최신 값이 즉시 필요하면 Primary를 읽거나 복제 적용을 확인한다."
      active_actors: [request, primary, replica, wal]
      description: "수정 직후 화면은 Replica 지연을 허용하지 않을 수 있으므로 읽기 대상을 최신성 요구에 맞춰 선택한다."
      payload: ["최신 값 필요", "Primary 읽기", "복제 적용 확인"]
      outcomes:
        - status: allow
          text: "동기 복제도 응답 지연과 보장 범위를 함께 검토해야 한다."

floating_point_repr:
  eyebrow: "Interactive comparison"
  title: "고정 소수점과 부동 소수점 표현"
  summary: "고정 소수점은 자릿수를 약속하고 부동 소수점은 부호·지수·가수로 범위와 정밀도를 나눈다."
  actors:
    - id: input
      kind: "입력 값"
      name: "Decimal Value"
      description: "십진수로 표현한 원래 값"
    - id: fixed
      kind: "고정 위치"
      name: "Fixed Point"
      description: "소수점 위치를 미리 정한 표현"
    - id: floating
      kind: "분해 표현"
      name: "Floating Point"
      description: "부호·지수·가수로 나눈 표현"
    - id: precision
      kind: "저장 한계"
      name: "Finite Precision"
      description: "제한된 비트 수에 맞춰 반올림되는 정밀도"
  steps:
    - title: "1. 소수점 위치 약속"
      from: "Decimal Value"
      to: "Fixed Point"
      route_label: "정해 둔 자릿수에 정수부와 소수부를 배치한다."
      active_actors: [input, fixed]
      description: "고정 소수점은 소수점이 움직이지 않으므로 표현 범위와 정밀도 배분을 먼저 정해야 한다."
      payload: ["정수부", "소수부", "고정 위치"]
      outcomes:
        - status: info
          text: "구조가 단순하지만 큰 범위와 세밀한 정밀도를 동시에 얻기 어렵다."
    - title: "2. 이진 분수 변환"
      from: "Decimal Value"
      to: "Floating Point"
      route_label: "십진 값을 이진수의 부호와 정규화된 형태로 바꾼다."
      active_actors: [input, floating]
      description: "부동 소수점은 값의 크기와 세밀함을 서로 다른 필드로 나누어 표현한다."
      payload: ["부호", "지수", "가수"]
      outcomes:
        - status: info
          text: "지수는 범위를, 가수는 유효한 정밀도를 좌우한다."
    - title: "3. 반복되는 0.1"
      from: "Decimal Value"
      to: "Floating Point"
      route_label: "0.1의 이진 분수는 끝나지 않아 저장 가능한 비트에서 잘린다."
      active_actors: [input, floating, precision]
      description: "십진수의 유한한 표기가 이진수에서도 유한하다는 보장은 없으므로 근삿값이 저장될 수 있다."
      payload: ["0.1₁₀", "반복 이진 분수", "근삿값"]
      outcomes:
        - status: warning
          text: "저장값과 수학적으로 정확한 0.1을 구분해야 한다."
    - title: "4. 연산 후 오차"
      from: "Floating Point"
      to: "Finite Precision"
      route_label: "제한된 비트 수가 중간 계산과 비교 결과에 영향을 줄 수 있다."
      active_actors: [floating, precision]
      description: "부동 소수점 비교에서는 표현 오차와 허용 오차를 함께 고려해야 한다."
      payload: ["반올림", "표현 오차", "허용 오차"]
      outcomes:
        - status: warning
          text: "실수 비교를 단순한 동등 비교로만 처리하지 않는다."

hamming_syndrome:
  eyebrow: "Interactive flow"
  title: "Hamming(7,4) 오류 검출과 수정"
  summary: "패리티 검사 결과를 신드롬으로 합치면 한 비트 오류의 위치를 가리킬 수 있다."
  actors:
    - id: data
      kind: "원본 데이터"
      name: "Data Bits"
      description: "패리티를 제외한 네 개의 데이터 비트"
    - id: parity
      kind: "검사 비트"
      name: "P1 · P2 · P4"
      description: "각 위치 묶음의 홀짝을 확인하는 비트"
    - id: syndrome
      kind: "오류 위치"
      name: "S4 · S2 · S1"
      description: "검사 결과를 이진 위치 번호로 합친 값"
    - id: decoder
      kind: "수정기"
      name: "Decoder"
      description: "신드롬이 가리킨 비트를 반전하는 처리"
  steps:
    - title: "1. 데이터 배치"
      from: "Data Bits"
      to: "P1 · P2 · P4"
      route_label: "데이터 비트 사이에 위치 1·2·4의 패리티 자리를 둔다."
      active_actors: [data, parity]
      description: "Hamming(7,4)은 일곱 위치 중 네 곳에 데이터를 배치하고 세 곳을 검사 비트로 사용한다."
      payload: ["0110", "위치 1·2·4", "7비트 코드워드"]
      outcomes:
        - status: info
          text: "위치 번호와 패리티 묶음을 먼저 분리해 읽는다."
    - title: "2. 수신 코드워드 검사"
      from: "P1 · P2 · P4"
      to: "S4 · S2 · S1"
      route_label: "각 패리티 묶음의 홀짝 결과를 S1·S2·S4로 계산한다."
      active_actors: [parity, syndrome]
      description: "검사 결과가 모두 0이면 오류가 없거나 검출 범위를 벗어난 상황으로 해석한다."
      payload: ["S1", "S2", "S4", "홀짝 검사"]
      outcomes:
        - status: info
          text: "검사 비트 자체가 오류 위치 계산에도 참여한다."
    - title: "3. 신드롬 101"
      from: "S4 · S2 · S1"
      to: "Decoder"
      route_label: "S4·S2·S1을 위치 번호 101₂로 읽어 5번 비트를 찾는다."
      active_actors: [syndrome, decoder]
      description: "신드롬은 오류가 의심되는 코드워드 위치를 이진수로 표현한다."
      payload: ["101₂", "5번 위치", "오류 검출"]
      outcomes:
        - status: warning
          text: "신드롬 비트의 읽는 순서를 바꾸면 다른 위치가 된다."
    - title: "4. 한 비트 반전"
      from: "Decoder"
      to: "Data Bits"
      route_label: "가리킨 위치의 비트를 반전한 뒤 데이터 위치를 다시 읽는다."
      active_actors: [decoder, data]
      description: "기본 Hamming(7,4)은 한 비트 오류를 전제로 위치를 찾아 수정한다."
      payload: ["5번 비트 반전", "0110 복원", "단일 오류"]
      outcomes:
        - status: allow
          text: "여러 비트 오류에는 기본 코드의 보장 범위를 벗어날 수 있다."

bytecode_jvm:
  eyebrow: "Interactive flow"
  title: "Java 바이트코드와 플랫폼별 JVM"
  summary: "JAR의 바이트코드는 재사용할 수 있지만 JVM과 네이티브 라이브러리는 대상 환경에 맞아야 한다."
  actors:
    - id: app
      kind: "애플리케이션"
      name: "Java JAR"
      description: "공통 Java 바이트코드를 담은 패키지"
    - id: jvm
      kind: "실행기"
      name: "Target JVM"
      description: "클래스 파일과 API를 해석하는 환경별 JVM"
    - id: platform
      kind: "플랫폼"
      name: "OS + CPU"
      description: "Linux x86-64 또는 Linux ARM64 같은 실행 환경"
    - id: native
      kind: "추가 의존성"
      name: "Native Library"
      description: "JNI 등으로 연결되는 플랫폼별 바이너리"
  steps:
    - title: "1. 공통 바이트코드"
      from: "Java JAR"
      to: "Target JVM"
      route_label: "같은 JAR의 클래스 파일을 대상 JVM이 읽는다."
      active_actors: [app, jvm]
      description: "Java 소스에서 빌드한 바이트코드는 JVM이 제공하는 실행 추상화에 올라간다."
      payload: [".class", "JAR", "Java 버전"]
      outcomes:
        - status: info
          text: "JAR이 같다는 사실만으로 실행 환경 호환성이 완성되지는 않는다."
    - title: "2. JVM 선택"
      from: "OS + CPU"
      to: "Target JVM"
      route_label: "Linux x86-64와 Linux ARM64에 맞는 JVM 구현을 선택한다."
      active_actors: [platform, jvm]
      description: "JVM 자체가 대상 OS와 CPU에서 동작하고 클래스 파일 버전과 API를 지원해야 한다."
      payload: ["Linux x86-64", "Linux ARM64", "JVM 배포판"]
      outcomes:
        - status: allow
          text: "플랫폼에 맞는 JVM이 있으면 같은 바이트코드를 실행할 수 있다."
    - title: "3. 네이티브 의존성 확인"
      from: "Java JAR"
      to: "Native Library"
      route_label: "JNI 라이브러리가 있으면 OS와 CPU용 바이너리를 별도로 확인한다."
      active_actors: [app, native, platform]
      description: "네이티브 코드는 바이트코드처럼 JVM이 자동으로 이식해 주지 않는다."
      payload: ["JNI", "x86-64 바이너리", "ARM64 바이너리"]
      outcomes:
        - status: warning
          text: "CPU가 같아도 운영체제가 다르면 라이브러리가 호환되지 않을 수 있다."
    - title: "4. 실제 실행 검증"
      from: "Target JVM"
      to: "OS + CPU"
      route_label: "대상 환경에서 클래스 파일·API·네이티브 의존성을 함께 실행해 확인한다."
      active_actors: [jvm, platform, native]
      description: "버전 숫자만 비교하지 말고 실제 배포 환경에서 시작과 주요 기능을 검증한다."
      payload: ["클래스 파일 버전", "API 지원", "실행 테스트"]
      outcomes:
        - status: info
          text: "호환성 판단은 구성 요소별 조건을 확인한 뒤 실행으로 마무리한다."

multiplatform_image:
  eyebrow: "Interactive flow"
  title: "Docker 멀티 플랫폼 이미지 선택"
  summary: "하나의 이미지 이름 아래 매니페스트가 플랫폼별 이미지를 연결하고 런타임이 맞는 변형을 고른다."
  actors:
    - id: tag
      kind: "이미지 이름"
      name: "One Image Tag"
      description: "사용자가 pull·run에 지정하는 공통 이름"
    - id: manifest
      kind: "선택 목록"
      name: "Manifest List"
      description: "linux/amd64와 linux/arm64 변형을 연결하는 목록"
    - id: platform
      kind: "실행 환경"
      name: "Host Platform"
      description: "현재 호스트의 OS와 CPU 조합"
    - id: image
      kind: "실제 이미지"
      name: "Platform Image"
      description: "선택된 플랫폼 전용 레이어 묶음"
  steps:
    - title: "1. 공통 태그 요청"
      from: "One Image Tag"
      to: "Manifest List"
      route_label: "런타임이 하나의 이미지 이름으로 매니페스트 목록을 조회한다."
      active_actors: [tag, manifest]
      description: "사용자는 플랫폼별 태그를 직접 고르지 않고 공통 이미지 이름을 요청할 수 있다."
      payload: ["image:latest", "pull", "run"]
      outcomes:
        - status: info
          text: "공통 태그는 여러 플랫폼 변형을 가리킬 수 있다."
    - title: "2. 호스트 플랫폼 판별"
      from: "Host Platform"
      to: "Manifest List"
      route_label: "매니페스트에서 현재 OS와 CPU에 맞는 항목을 찾는다."
      active_actors: [platform, manifest]
      description: "linux/amd64와 linux/arm64처럼 플랫폼 식별자가 선택 기준이 된다."
      payload: ["os", "architecture", "variant"]
      outcomes:
        - status: allow
          text: "호스트와 일치하는 이미지 변형을 선택할 수 있다."
    - title: "3. 플랫폼 이미지 선택"
      from: "Manifest List"
      to: "Platform Image"
      route_label: "선택된 매니페스트 항목이 해당 플랫폼의 이미지 레이어를 가리킨다."
      active_actors: [manifest, image]
      description: "매니페스트는 실제 실행에 사용할 플랫폼 전용 이미지의 위치를 연결한다."
      payload: ["linux/amd64", "linux/arm64", "digest"]
      outcomes:
        - status: info
          text: "같은 애플리케이션 버전이어도 플랫폼별 레이어가 다를 수 있다."
    - title: "4. 컨테이너 실행"
      from: "Platform Image"
      to: "Host Platform"
      route_label: "선택된 이미지가 현재 OS와 CPU에서 실행된다."
      active_actors: [image, platform]
      description: "네이티브 라이브러리나 실행 환경의 추가 제약은 이미지 선택 뒤에도 확인해야 한다."
      payload: ["컨테이너", "CPU 명령어", "실행 환경"]
      outcomes:
        - status: warning
          text: "플랫폼 이미지가 있어도 내부 네이티브 의존성의 호환성은 별도 문제다."

array_memory:
  eyebrow: "Interactive comparison"
  title: "기본형 배열과 참조형 배열의 메모리 구조"
  summary: "기본형 배열은 값 슬롯을 담고 참조형 배열은 객체를 가리키는 참조 슬롯과 별도 객체를 가진다."
  actors:
    - id: array
      kind: "배열"
      name: "Array Slots"
      description: "인덱스로 접근하는 연속된 슬롯"
    - id: value
      kind: "기본형"
      name: "Primitive Values"
      description: "슬롯 안에 직접 저장되는 값"
    - id: reference
      kind: "참조형"
      name: "References"
      description: "별도 객체를 가리키는 참조 값"
    - id: object
      kind: "객체"
      name: "Heap Objects"
      description: "참조가 가리키는 실제 객체 데이터"
  steps:
    - title: "1. 기본형 값 저장"
      from: "Array Slots"
      to: "Primitive Values"
      route_label: "배열 슬롯에 int·double 같은 기본형 값이 직접 놓인다."
      active_actors: [array, value]
      description: "기본형 배열은 인덱스가 가리키는 위치에서 값을 바로 읽는 구조로 생각할 수 있다."
      payload: ["int[]", "값 슬롯", "index"]
      outcomes:
        - status: info
          text: "배열 길이와 요소 타입이 저장 구조를 결정한다."
    - title: "2. 참조 저장"
      from: "Array Slots"
      to: "References"
      route_label: "참조형 배열의 슬롯에는 객체 자체가 아니라 참조가 저장된다."
      active_actors: [array, reference]
      description: "각 슬롯의 참조는 같은 객체를 가리킬 수도 있고 null일 수도 있다."
      payload: ["String[]", "참조 슬롯", "null"]
      outcomes:
        - status: info
          text: "슬롯의 값과 객체의 실제 데이터 위치를 구분한다."
    - title: "3. 객체 접근"
      from: "References"
      to: "Heap Objects"
      route_label: "슬롯의 참조를 따라 힙에 있는 객체의 필드와 값을 읽는다."
      active_actors: [reference, object]
      description: "참조형 배열은 배열 영역과 각 객체 영역을 함께 생각해야 한다."
      payload: ["reference → object", "필드", "객체 수명"]
      outcomes:
        - status: info
          text: "배열의 요소 접근과 객체 내부 접근은 서로 다른 단계다."

linked_list_traversal:
  eyebrow: "Interactive flow"
  title: "연결 리스트의 인덱스 탐색"
  summary: "이중 연결 리스트는 인덱스와 head·tail의 거리를 비교해 가까운 끝에서 노드를 따라간다."
  actors:
    - id: index
      kind: "조회 요청"
      name: "Index 7"
      description: "찾으려는 논리적 위치"
    - id: head
      kind: "앞 포인터"
      name: "Head"
      description: "첫 노드를 가리키는 시작점"
    - id: tail
      kind: "뒤 포인터"
      name: "Tail"
      description: "마지막 노드를 가리키는 시작점"
    - id: node
      kind: "연결 노드"
      name: "Linked Nodes"
      description: "prev·next로 이웃과 연결된 노드"
  steps:
    - title: "1. 인덱스 거리 비교"
      from: "Index 7"
      to: "Head / Tail"
      route_label: "인덱스 7이 head와 tail 중 어느 쪽에 가까운지 계산한다."
      active_actors: [index, head, tail]
      description: "이중 연결 리스트는 양쪽 끝을 모두 알고 있어 탐색 시작점을 선택할 수 있다."
      payload: ["index = 7", "head 거리", "tail 거리"]
      outcomes:
        - status: allow
          text: "가까운 끝에서 시작하면 불필요한 이동을 줄인다."
    - title: "2. Tail에서 시작"
      from: "Tail"
      to: "Linked Nodes"
      route_label: "tail에서 prev 포인터를 따라 9, 8, 7 순서로 이동한다."
      active_actors: [tail, node, index]
      description: "뒤에서 접근하는 편이 가까운 예시에서는 tail이 인덱스 탐색의 시작점이 된다."
      payload: ["tail", "prev", "9 → 8 → 7"]
      outcomes:
        - status: info
          text: "노드 수를 세는 것이 아니라 링크를 따라 이동한다."
    - title: "3. 대상 노드 도착"
      from: "Linked Nodes"
      to: "Index 7"
      route_label: "일곱 번째 위치의 노드에 도착해 값을 반환한다."
      active_actors: [node, index]
      description: "연결 리스트의 인덱스 접근은 배열처럼 즉시 주소를 계산하는 연산이 아니다."
      payload: ["target node", "value", "반환"]
      outcomes:
        - status: info
          text: "탐색 비용은 시작점과 대상 위치 사이의 이동 거리와 연결된다."
    - title: "4. 비용 해석"
      from: "Head / Tail"
      to: "Index 7"
      route_label: "가까운 끝에서 이동한 노드 수가 최종 접근 비용이 된다."
      active_actors: [head, tail, index]
      description: "이중 연결 리스트도 임의 인덱스 접근이 배열의 O(1)과 같아지는 것은 아니다."
      payload: ["탐색 거리", "O(min(i, n-i))", "연결 추적"]
      outcomes:
        - status: warning
          text: "빈번한 인덱스 접근에는 배열이 더 적합할 수 있다."

array_list_insertion:
  eyebrow: "Interactive comparison"
  title: "배열과 연결 리스트의 중간 삽입"
  summary: "배열은 뒤 요소를 이동하고 연결 리스트는 주변 노드의 링크를 바꾼다."
  actors:
    - id: position
      kind: "삽입 위치"
      name: "Insert Position"
      description: "새 요소 X가 들어갈 위치"
    - id: array
      kind: "연속 저장"
      name: "Array"
      description: "인덱스 순서대로 붙어 있는 요소들"
    - id: linked
      kind: "연결 저장"
      name: "Linked List"
      description: "노드의 next 링크로 이어진 요소들"
    - id: element
      kind: "새 요소"
      name: "Element X"
      description: "중간에 추가할 값 또는 노드"
  steps:
    - title: "1. 배열 위치 확보"
      from: "Insert Position"
      to: "Array"
      route_label: "삽입 위치 뒤의 요소를 한 칸씩 뒤로 옮겨 빈 슬롯을 만든다."
      active_actors: [position, array]
      description: "연속 저장 구조에서는 중간 공간을 만들기 위해 여러 요소의 위치가 바뀐다."
      payload: ["index", "shift right", "빈 슬롯"]
      outcomes:
        - status: warning
          text: "이동해야 하는 요소 수가 많으면 삽입 비용이 커진다."
    - title: "2. 배열에 X 저장"
      from: "Element X"
      to: "Array"
      route_label: "확보한 슬롯에 새 요소 X를 기록한다."
      active_actors: [element, array]
      description: "배열 삽입은 공간 확보와 값 기록을 나누어 생각할 수 있다."
      payload: ["X", "index", "연속 슬롯"]
      outcomes:
        - status: allow
          text: "인덱스 접근은 빠르지만 중간 삽입은 이동 비용을 부담한다."
    - title: "3. 연결 리스트 위치 찾기"
      from: "Insert Position"
      to: "Linked List"
      route_label: "삽입 지점의 앞 노드와 뒤 노드를 찾는다."
      active_actors: [position, linked]
      description: "링크를 바꾸기 전에 대상 위치까지 노드를 따라가야 한다."
      payload: ["prev", "next", "탐색"]
      outcomes:
        - status: info
          text: "연결 리스트도 위치 탐색 비용은 별도로 발생한다."
    - title: "4. 링크 재연결"
      from: "Element X"
      to: "Linked List"
      route_label: "앞 노드와 X, 뒤 노드의 링크를 새 순서로 연결한다."
      active_actors: [element, linked]
      description: "노드 위치를 모두 이동시키는 대신 제한된 포인터를 수정해 삽입을 마무리한다."
      payload: ["prev.next = X", "X.next = next", "링크 변경"]
      outcomes:
        - status: allow
          text: "위치를 이미 알고 있다면 연결 변경 자체는 일정한 작업이다."

arraylist_capacity:
  eyebrow: "Interactive flow"
  title: "ArrayList의 size와 capacity"
  summary: "size는 실제 요소 수이고 capacity는 현재 내부 배열이 담을 수 있는 슬롯 수다."
  actors:
    - id: list
      kind: "컬렉션"
      name: "ArrayList"
      description: "동적 배열을 감싸는 리스트"
    - id: size
      kind: "사용량"
      name: "size = 3"
      description: "현재 실제로 들어 있는 요소 개수"
    - id: capacity
      kind: "저장 공간"
      name: "capacity = 6"
      description: "내부 배열이 수용할 수 있는 슬롯 개수"
    - id: resize
      kind: "확장 처리"
      name: "Resize"
      description: "더 큰 배열을 만들고 기존 요소를 복사하는 작업"
  steps:
    - title: "1. 실제 요소 세기"
      from: "ArrayList"
      to: "size = 3"
      route_label: "리스트가 현재 보유한 A·B·C 세 요소를 size로 센다."
      active_actors: [list, size]
      description: "size는 사용 중인 요소의 개수이지 내부 배열의 전체 슬롯 수가 아니다."
      payload: ["A", "B", "C", "size = 3"]
      outcomes:
        - status: info
          text: "요소를 제거하면 size가 줄어든다."
    - title: "2. 여유 슬롯 확인"
      from: "ArrayList"
      to: "capacity = 6"
      route_label: "내부 배열에 세 개의 사용 중 슬롯과 세 개의 여유 슬롯이 남아 있다."
      active_actors: [list, capacity]
      description: "capacity는 추가 삽입을 즉시 수용할 수 있는 현재 공간의 크기다."
      payload: ["capacity = 6", "사용 3", "여유 3"]
      outcomes:
        - status: allow
          text: "여유가 있으면 내부 배열을 다시 만들지 않고 삽입할 수 있다."
    - title: "3. 공간 부족"
      from: "size = 3"
      to: "Resize"
      route_label: "요소를 계속 추가해 size가 capacity에 도달하면 확장이 필요하다."
      active_actors: [size, capacity, resize]
      description: "capacity가 가득 찬 순간 다음 삽입을 위해 더 큰 저장 공간을 준비한다."
      payload: ["size == capacity", "다음 삽입", "확장"]
      outcomes:
        - status: warning
          text: "확장 시 기존 요소를 새 배열로 복사하는 비용이 발생한다."
    - title: "4. 새 배열로 복사"
      from: "Resize"
      to: "ArrayList"
      route_label: "더 큰 내부 배열로 기존 요소를 복사한 뒤 새 요소를 추가한다."
      active_actors: [resize, list, capacity]
      description: "동적 배열은 매번 한 칸씩 늘리기보다 여유를 포함해 확장해 평균 삽입 비용을 낮춘다."
      payload: ["copy", "larger array", "새 capacity"]
      outcomes:
        - status: info
          text: "개별 확장은 비싸지만 전체 삽입 비용은 분산될 수 있다."

stack_queue_deque:
  eyebrow: "Interactive comparison"
  title: "Stack·Queue·Deque의 처리 순서"
  summary: "같은 입력도 자료구조가 허용하는 삽입·삭제 위치에 따라 LIFO, FIFO, 양방향 결과가 달라진다."
  actors:
    - id: input
      kind: "입력"
      name: "A → B → C"
      description: "차례로 들어오는 세 요소"
    - id: stack
      kind: "한쪽 끝"
      name: "Stack"
      description: "마지막에 넣은 요소를 먼저 꺼내는 구조"
    - id: queue
      kind: "양 끝 역할 분리"
      name: "Queue"
      description: "먼저 들어온 요소를 먼저 꺼내는 구조"
    - id: deque
      kind: "양쪽 끝"
      name: "Deque"
      description: "앞과 뒤에서 삽입·삭제할 수 있는 구조"
  steps:
    - title: "1. 입력 순서"
      from: "A → B → C"
      to: "Stack / Queue / Deque"
      route_label: "A, B, C를 같은 순서로 세 자료구조에 넣는다."
      active_actors: [input, stack, queue, deque]
      description: "처리 결과를 비교하려면 입력 순서를 먼저 고정해야 한다."
      payload: ["A", "B", "C", "push / offer"]
      outcomes:
        - status: info
          text: "차이는 입력 자체가 아니라 꺼내는 규칙에서 생긴다."
    - title: "2. Stack LIFO"
      from: "Stack"
      to: "A → B → C"
      route_label: "마지막에 들어온 C부터 B, A 순서로 꺼낸다."
      active_actors: [stack, input]
      description: "Stack은 한쪽 끝에서 넣고 빼므로 후입선출 순서가 된다."
      payload: ["push", "pop", "C → B → A"]
      outcomes:
        - status: info
          text: "호출 스택과 되돌리기 기능 같은 흐름을 설명할 때 유용하다."
    - title: "3. Queue FIFO"
      from: "Queue"
      to: "A → B → C"
      route_label: "먼저 들어온 A부터 B, C 순서로 꺼낸다."
      active_actors: [queue, input]
      description: "Queue는 한쪽에서 넣고 반대쪽에서 빼므로 선입선출 순서가 된다."
      payload: ["offer", "poll", "A → B → C"]
      outcomes:
        - status: info
          text: "작업 대기열처럼 도착 순서를 보존해야 하는 흐름에 맞다."
    - title: "4. Deque 양방향"
      from: "Deque"
      to: "A → B → C"
      route_label: "앞과 뒤 어느 쪽에서도 삽입·삭제해 순서를 정책으로 선택한다."
      active_actors: [deque, input]
      description: "Deque는 Stack과 Queue 동작을 모두 표현할 수 있는 양방향 구조다."
      payload: ["addFirst", "addLast", "removeFirst / removeLast"]
      outcomes:
        - status: allow
          text: "양쪽 연산을 허용하는 만큼 사용 규칙을 코드로 분명히 해야 한다."

heap_mapping:
  eyebrow: "Interactive comparison"
  title: "Min Heap의 트리와 배열 매핑"
  summary: "완전 이진 트리는 빈 슬롯 없이 채워지므로 부모·자식 관계를 인덱스 계산으로 표현할 수 있다."
  actors:
    - id: heap
      kind: "우선순위 구조"
      name: "Min Heap"
      description: "부모가 자식보다 작거나 같은 완전 이진 트리"
    - id: tree
      kind: "논리 구조"
      name: "Complete Tree"
      description: "레벨 순서로 채워지는 트리 표현"
    - id: array
      kind: "물리 표현"
      name: "Index Array"
      description: "0번 인덱스부터 노드를 담는 배열"
    - id: relation
      kind: "인덱스 규칙"
      name: "Parent / Child Index"
      description: "부모와 자식 위치를 계산하는 관계"
  steps:
    - title: "1. 힙 조건"
      from: "Min Heap"
      to: "Complete Tree"
      route_label: "각 부모의 값이 자식보다 작거나 같도록 트리를 유지한다."
      active_actors: [heap, tree]
      description: "Min Heap의 루트에는 전체 원소 중 가장 작은 값이 온다."
      payload: ["2", "4", "7", "9", "8"]
      outcomes:
        - status: info
          text: "힙은 전체 정렬이 아니라 부모·자식 사이의 부분 순서다."
    - title: "2. 레벨 순서 저장"
      from: "Complete Tree"
      to: "Index Array"
      route_label: "트리 노드를 위에서 아래, 왼쪽에서 오른쪽 순서로 배열에 담는다."
      active_actors: [tree, array]
      description: "완전 이진 트리는 배열에 빈 슬롯을 거의 두지 않고 표현할 수 있다."
      payload: ["index 0", "level order", "[2, 4, 7, 9, 8]"]
      outcomes:
        - status: allow
          text: "노드마다 별도 left·right 포인터를 저장하지 않아도 된다."
    - title: "3. 부모·자식 계산"
      from: "Index Array"
      to: "Parent / Child Index"
      route_label: "0번 기준으로 parent=(i-1)/2, left=2i+1, right=2i+2를 계산한다."
      active_actors: [array, relation]
      description: "배열 인덱스만으로 트리의 이웃 위치를 찾을 수 있다."
      payload: ["parent(i)", "left(i)", "right(i)"]
      outcomes:
        - status: info
          text: "인덱스 계산 규칙은 배열이 완전 이진 트리라는 전제에 기대고 있다."
    - title: "4. 최소값 접근"
      from: "Parent / Child Index"
      to: "Min Heap"
      route_label: "루트 인덱스 0의 값을 읽어 최솟값을 확인한다."
      active_actors: [relation, heap]
      description: "Min Heap은 루트 최소값 접근을 빠르게 제공하지만 임의 값 전체 순서를 보장하지 않는다."
      payload: ["root = array[0]", "min = 2", "부분 순서"]
      outcomes:
        - status: allow
          text: "우선순위 큐의 최솟값 확인과 제거에 적합하다."

heap_sift:
  eyebrow: "Interactive flow"
  title: "Min Heap의 Sift Up과 Sift Down"
  summary: "삽입은 부모 방향으로, 루트 제거는 더 작은 자식 방향으로 이동하며 힙 조건을 복구한다."
  actors:
    - id: heap
      kind: "힙"
      name: "Min Heap"
      description: "부모가 자식보다 작거나 같은 구조"
    - id: inserted
      kind: "삽입 값"
      name: "Inserted 1"
      description: "새로 추가되어 위치를 찾아야 하는 값"
    - id: root
      kind: "제거 대상"
      name: "Root 2"
      description: "최솟값이라 먼저 제거되는 루트"
    - id: child
      kind: "비교 후보"
      name: "Smaller Child"
      description: "아래로 내려갈 때 선택하는 더 작은 자식"
  steps:
    - title: "1. 1 삽입"
      from: "Inserted 1"
      to: "Min Heap"
      route_label: "새 값 1을 배열의 마지막 빈 위치에 넣는다."
      active_actors: [inserted, heap]
      description: "완전 이진 트리 모양을 유지하기 위해 새 노드는 마지막 위치에서 시작한다."
      payload: ["insert 1", "last slot", "힙 조건 위반"]
      outcomes:
        - status: warning
          text: "부모보다 작다면 현재 위치에서 바로 멈출 수 없다."
    - title: "2. Sift Up"
      from: "Inserted 1"
      to: "Min Heap"
      route_label: "부모와 비교하며 1이 더 작으면 위로 교환한다."
      active_actors: [inserted, heap]
      description: "삽입 후에는 부모 방향으로 이동해 루트까지 힙 조건을 확인한다."
      payload: ["compare parent", "swap", "sift up"]
      outcomes:
        - status: allow
          text: "조건을 만족하는 위치에 도달하면 삽입 복구가 끝난다."
    - title: "3. 루트 제거"
      from: "Root 2"
      to: "Min Heap"
      route_label: "루트 2를 제거하고 마지막 원소를 루트 자리로 옮긴다."
      active_actors: [root, heap]
      description: "최솟값을 꺼낸 뒤 빈 루트를 채우는 과정에서 아래쪽 조건이 깨질 수 있다."
      payload: ["remove min", "move last", "root replacement"]
      outcomes:
        - status: warning
          text: "루트 교체만으로는 자식과의 순서가 보장되지 않는다."
    - title: "4. Sift Down"
      from: "Min Heap"
      to: "Smaller Child"
      route_label: "더 작은 자식과 비교하며 조건이 맞을 때까지 아래로 교환한다."
      active_actors: [heap, child]
      description: "두 자식 중 작은 값을 선택해야 다음 단계에서도 부모·자식 조건을 유지할 수 있다."
      payload: ["left child", "right child", "smaller child"]
      outcomes:
        - status: allow
          text: "삽입은 Sift Up, 루트 제거는 Sift Down으로 구분한다."

tree_types:
  eyebrow: "Interactive comparison"
  title: "이진 트리의 형태 조건"
  summary: "자식 수와 레벨을 얼마나 채우는지에 따라 일반·정·완전·포화 이진 트리를 구분한다."
  actors:
    - id: tree
      kind: "트리"
      name: "Binary Tree"
      description: "각 노드가 최대 두 자식을 가지는 구조"
    - id: children
      kind: "자식 조건"
      name: "Children Count"
      description: "노드마다 자식이 몇 개인지 보는 기준"
    - id: level
      kind: "레벨 조건"
      name: "Level Filling"
      description: "마지막 레벨까지 노드를 채우는 방식"
    - id: shape
      kind: "형태 분류"
      name: "Tree Shape"
      description: "조건을 만족하는 트리 유형"
  steps:
    - title: "1. 최대 두 자식"
      from: "Binary Tree"
      to: "Children Count"
      route_label: "각 노드가 자식을 0·1·2개까지 가질 수 있는지 확인한다."
      active_actors: [tree, children]
      description: "이진 트리는 자식 수의 상한만 정하고 모든 레벨을 채우라는 규칙은 없다."
      payload: ["0 children", "1 child", "2 children"]
      outcomes:
        - status: info
          text: "자식 수 조건만으로 정·완전·포화 여부를 결정할 수 없다."
    - title: "2. 정이진 트리"
      from: "Children Count"
      to: "Tree Shape"
      route_label: "모든 내부 노드가 자식 2개를 가지는지 확인한다."
      active_actors: [children, shape]
      description: "정이진 트리는 한쪽 자식만 있는 내부 노드를 허용하지 않는다."
      payload: ["0 or 2", "한쪽 자식 없음", "Full Binary Tree"]
      outcomes:
        - status: info
          text: "레벨이 모두 채워졌다는 뜻은 아니다."
    - title: "3. 완전 이진 트리"
      from: "Level Filling"
      to: "Tree Shape"
      route_label: "마지막 레벨 전까지 채우고 마지막 레벨은 왼쪽부터 채우는지 본다."
      active_actors: [level, shape]
      description: "완전 이진 트리는 배열 기반 힙처럼 레벨 순서 표현과 잘 맞는다."
      payload: ["앞 레벨 완성", "마지막 레벨 왼쪽부터", "Complete"]
      outcomes:
        - status: allow
          text: "마지막 레벨이 일부만 차도 왼쪽 정렬이면 완전할 수 있다."
    - title: "4. 포화 이진 트리"
      from: "Level Filling"
      to: "Tree Shape"
      route_label: "모든 내부 노드가 두 자식이고 모든 잎이 같은 레벨인지 확인한다."
      active_actors: [children, level, shape]
      description: "포화 이진 트리는 각 레벨이 빠짐없이 채워진 가장 엄격한 형태다."
      payload: ["2 children", "same leaf level", "Perfect"]
      outcomes:
        - status: info
          text: "포화 조건은 정이진·완전 조건을 함께 강하게 만족시킨다."

tree_representation:
  eyebrow: "Interactive comparison"
  title: "트리의 배열 표현과 연결 표현"
  summary: "같은 트리도 배열은 위치와 빈 슬롯을 보존하고 연결 표현은 실제 자식 관계만 참조한다."
  actors:
    - id: tree
      kind: "논리 구조"
      name: "Tree A–F"
      description: "A부터 F까지의 동일한 트리 관계"
    - id: array
      kind: "순차 표현"
      name: "Array Slots"
      description: "인덱스 위치에 노드를 저장하는 표현"
    - id: linked
      kind: "포인터 표현"
      name: "Child References"
      description: "왼쪽·오른쪽 자식 참조로 관계를 저장하는 표현"
    - id: slot
      kind: "빈 위치"
      name: "Empty Slots"
      description: "배열에서 존재하지 않는 위치를 표시하는 자리"
  steps:
    - title: "1. 같은 트리 고정"
      from: "Tree A–F"
      to: "Array Slots"
      route_label: "A부터 F까지 같은 논리 관계를 두 표현으로 옮길 준비를 한다."
      active_actors: [tree, array]
      description: "표현 방법을 비교하려면 값과 부모·자식 관계가 같은 트리를 사용해야 한다."
      payload: ["A", "B", "C", "D", "E", "F"]
      outcomes:
        - status: info
          text: "자료구조의 논리와 저장 표현을 분리해 본다."
    - title: "2. 배열 위치 보존"
      from: "Tree A–F"
      to: "Array Slots"
      route_label: "레벨 순서 인덱스에 노드를 두고 없는 자리는 빈 슬롯으로 남긴다."
      active_actors: [tree, array, slot]
      description: "배열은 부모와 자식의 위치 계산을 쉽게 하지만 희소한 트리에서는 공간을 낭비할 수 있다."
      payload: ["index", "빈 슬롯", "level order"]
      outcomes:
        - status: warning
          text: "트리 모양이 치우치면 빈 슬롯이 늘어날 수 있다."
    - title: "3. 연결 관계만 저장"
      from: "Tree A–F"
      to: "Child References"
      route_label: "각 노드가 실제로 가진 왼쪽·오른쪽 자식만 참조한다."
      active_actors: [tree, linked]
      description: "연결 표현은 빈 위치를 저장하지 않고 존재하는 관계를 포인터로 나타낸다."
      payload: ["left", "right", "null reference"]
      outcomes:
        - status: allow
          text: "모양이 불규칙한 트리도 빈 슬롯 없이 표현할 수 있다."

tree_traversal:
  eyebrow: "Interactive comparison"
  title: "이진 트리 순회 순서"
  summary: "같은 트리라도 현재 노드를 처리하는 시점과 레벨 처리 방식에 따라 방문 결과가 달라진다."
  actors:
    - id: tree
      kind: "대상 구조"
      name: "Tree A–F"
      description: "모든 순회가 공유하는 동일한 이진 트리"
    - id: preorder
      kind: "현재 노드 먼저"
      name: "Preorder"
      description: "현재 → 왼쪽 → 오른쪽"
    - id: inorder
      kind: "왼쪽 뒤 현재"
      name: "Inorder"
      description: "왼쪽 → 현재 → 오른쪽"
    - id: postorder
      kind: "자식 뒤 현재"
      name: "Postorder"
      description: "왼쪽 → 오른쪽 → 현재"
    - id: level
      kind: "레벨 순서"
      name: "Level Order"
      description: "같은 깊이를 왼쪽부터 처리"
  steps:
    - title: "1. 전위 순회"
      from: "Tree A–F"
      to: "Preorder"
      route_label: "현재 노드를 처리한 뒤 왼쪽, 오른쪽 서브트리로 내려간다."
      active_actors: [tree, preorder]
      description: "전위 순회는 부모를 자식보다 먼저 방문한다."
      payload: ["현재", "왼쪽", "오른쪽", "A B D E C F"]
      outcomes:
        - status: info
          text: "방문 결과는 트리 구조와 현재 노드 처리 시점에 의해 결정된다."
    - title: "2. 중위 순회"
      from: "Tree A–F"
      to: "Inorder"
      route_label: "왼쪽 서브트리를 처리한 뒤 현재 노드와 오른쪽을 처리한다."
      active_actors: [tree, inorder]
      description: "중위 순회는 이진 탐색 트리의 정렬 순서와 연결해 설명할 수 있지만 모든 이진 트리에서 정렬되지는 않는다."
      payload: ["왼쪽", "현재", "오른쪽", "D B E A C F"]
      outcomes:
        - status: info
          text: "정렬 결과라는 해석에는 이진 탐색 트리의 추가 규칙이 필요하다."
    - title: "3. 후위 순회"
      from: "Tree A–F"
      to: "Postorder"
      route_label: "두 서브트리를 모두 처리한 뒤 현재 노드를 방문한다."
      active_actors: [tree, postorder]
      description: "후위 순회는 자식 결과를 모은 뒤 부모를 처리하는 흐름을 표현한다."
      payload: ["왼쪽", "오른쪽", "현재", "D E B F C A"]
      outcomes:
        - status: info
          text: "서브트리 삭제나 계산 결과 조합을 설명할 때 자주 사용한다."
    - title: "4. 레벨 순회"
      from: "Tree A–F"
      to: "Level Order"
      route_label: "깊이로 내려가기보다 같은 레벨의 노드를 왼쪽부터 처리한다."
      active_actors: [tree, level]
      description: "레벨 순회는 큐를 사용해 현재 깊이의 노드를 다음 깊이보다 먼저 방문한다."
      payload: ["level 0", "level 1", "level 2", "A B C D E F"]
      outcomes:
        - status: allow
          text: "전체 순회는 노드 수에 비례해 O(n)으로 처리한다."

btree_split_merge:
  eyebrow: "Interactive flow"
  title: "B-Tree 노드 분할·재분배·병합"
  summary: "삽입은 가득 찬 노드를 나누고 삭제는 형제 여유에 따라 재분배하거나 부모 경계 키와 병합한다."
  actors:
    - id: node
      kind: "현재 노드"
      name: "Target Node"
      description: "삽입 또는 삭제가 발생한 B-Tree 노드"
    - id: parent
      kind: "상위 경계"
      name: "Parent Separator"
      description: "자식 범위를 나누는 부모 키"
    - id: sibling
      kind: "형제 노드"
      name: "Sibling"
      description: "키를 빌려주거나 병합하는 이웃 노드"
    - id: root
      kind: "루트"
      name: "Root"
      description: "높이 증가와 감소가 시작되는 최상위 노드"
  steps:
    - title: "1. 가득 찬 노드 분할"
      from: "Target Node"
      to: "Parent Separator"
      route_label: "삽입으로 가득 찬 노드를 둘로 나누고 가운데 키를 부모로 올린다."
      active_actors: [node, parent]
      description: "분할 뒤에도 각 자식 노드의 키 범위와 최소 조건을 유지한다."
      payload: ["split", "middle key", "promote"]
      outcomes:
        - status: allow
          text: "루트가 분할되면 트리 높이가 증가할 수 있다."
    - title: "2. 삭제 후 형제 확인"
      from: "Target Node"
      to: "Sibling"
      route_label: "삭제로 노드가 부족해지면 먼저 형제에게 빌릴 여유가 있는지 본다."
      active_actors: [node, sibling, parent]
      description: "재분배는 부모의 경계 키와 형제 키를 함께 조정하는 작업이다."
      payload: ["underflow", "borrow", "redistribute"]
      outcomes:
        - status: info
          text: "형제 키 하나를 단순 복사하는 것과는 다르다."
    - title: "3. 형제와 병합"
      from: "Sibling"
      to: "Parent Separator"
      route_label: "빌릴 키가 없으면 부모 경계 키와 두 노드를 하나로 합친다."
      active_actors: [sibling, node, parent]
      description: "병합 후 부모의 키와 자식 포인터가 줄어 상위 노드에서도 부족이 이어질 수 있다."
      payload: ["merge", "parent key", "child pointer 감소"]
      outcomes:
        - status: warning
          text: "부족 조건이 부모 방향으로 전파될 수 있다."
    - title: "4. 루트 높이 조정"
      from: "Parent Separator"
      to: "Root"
      route_label: "루트가 분할되면 높이가 늘고 루트 병합으로 하나의 자식만 남으면 높이가 줄어든다."
      active_actors: [parent, root]
      description: "삽입과 삭제의 루트 처리는 트리 높이를 바꾸는 특별한 경계 사례다."
      payload: ["root split", "root merge", "height ± 1"]
      outcomes:
        - status: info
          text: "높이 변화도 각 노드의 최소·최대 조건을 지키는 결과다."

btree_vs_bplus:
  eyebrow: "Interactive comparison"
  title: "B-Tree와 B+Tree의 검색 경로"
  summary: "B-Tree는 내부 노드에도 데이터가 있을 수 있고 B+Tree는 인덱스 키를 따라 리프와 리프 연결로 접근한다."
  actors:
    - id: query
      kind: "검색 요청"
      name: "Search Key"
      description: "정확한 일치 또는 범위를 찾는 키"
    - id: btree
      kind: "혼합 저장"
      name: "B-Tree"
      description: "내부 노드와 리프에 데이터가 있을 수 있는 구조"
    - id: bplus
      kind: "리프 집중"
      name: "B+Tree"
      description: "내부는 안내 키, 실제 데이터는 리프에 모이는 구조"
    - id: leaf
      kind: "데이터 페이지"
      name: "Linked Leaves"
      description: "범위 검색을 이어 가는 연결된 리프 페이지"
  steps:
    - title: "1. B-Tree 내부 확인"
      from: "Search Key"
      to: "B-Tree"
      route_label: "검색 키가 내부 노드에서 데이터와 일치하면 그 자리에서 도달할 수 있다."
      active_actors: [query, btree]
      description: "B-Tree는 내부 키가 데이터 또는 데이터 접근 정보를 함께 가질 수 있다."
      payload: ["internal key", "data", "검색 종료 가능"]
      outcomes:
        - status: info
          text: "모든 검색이 리프까지 내려간다고 단정하지 않는다."
    - title: "2. B+Tree 리프 도달"
      from: "Search Key"
      to: "B+Tree"
      route_label: "내부 키는 방향을 안내하고 실제 항목은 리프까지 내려가 확인한다."
      active_actors: [query, bplus]
      description: "B+Tree에서는 내부 키와 같은 값을 만나도 리프의 실제 데이터를 확인한다."
      payload: ["separator key", "child pointer", "leaf data"]
      outcomes:
        - status: info
          text: "내부 노드와 데이터 페이지의 책임이 분리된다."
    - title: "3. 리프 연결 따라가기"
      from: "B+Tree"
      to: "Linked Leaves"
      route_label: "시작 리프를 찾은 뒤 다음 리프 포인터를 따라 범위를 읽는다."
      active_actors: [bplus, leaf]
      description: "리프 연결은 범위 검색에서 다음 페이지로 이동하는 통로가 된다."
      payload: ["start leaf", "next leaf", "range scan"]
      outcomes:
        - status: allow
          text: "범위 검색을 리프 순서로 이어가기 쉽다."
    - title: "4. 페이지 I/O 분리"
      from: "Search Key"
      to: "Linked Leaves"
      route_label: "논리적 페이지 방문과 버퍼에 없는 페이지의 실제 디스크 읽기를 따로 센다."
      active_actors: [query, btree, bplus, leaf]
      description: "검색 경로의 페이지 수와 저장 장치 I/O 수는 캐시 상태에 따라 달라질 수 있다."
      payload: ["logical page", "buffer hit", "disk I/O"]
      outcomes:
        - status: info
          text: "페이지 방문 횟수와 실제 디스크 읽기 횟수를 같은 값으로 보지 않는다."

database_key:
  eyebrow: "Interactive flow"
  title: "외래키와 복합 UNIQUE 제약조건"
  summary: "외래키는 참조 대상의 존재를 확인하고 복합 UNIQUE는 같은 관계의 중복 저장을 막는다."
  actors:
    - id: member
      kind: "참조 대상"
      name: "Members"
      description: "찜을 저장한 회원 테이블"
    - id: restaurant
      kind: "참조 대상"
      name: "Restaurants"
      description: "찜 대상 음식점 테이블"
    - id: relation
      kind: "관계 행"
      name: "MemberRestaurants"
      description: "회원과 음식점을 연결하는 자식 테이블"
    - id: constraint
      kind: "무결성 규칙"
      name: "FK + UNIQUE"
      description: "존재·필수·중복을 검증하는 제약조건 묶음"
  steps:
    - title: "1. 회원 참조"
      from: "MemberRestaurants"
      to: "Members"
      route_label: "member_id FK가 members.id에 존재하는지 확인한다."
      active_actors: [relation, member, constraint]
      description: "존재하지 않는 회원을 가리키는 찜 행은 외래키 검사에서 거부된다."
      payload: ["member_id", "members.id", "FK"]
      outcomes:
        - status: allow
          text: "참조 대상의 존재를 보장한다."
    - title: "2. 음식점 참조"
      from: "MemberRestaurants"
      to: "Restaurants"
      route_label: "restaurant_id FK가 restaurants.id에 존재하는지 확인한다."
      active_actors: [relation, restaurant, constraint]
      description: "외래키는 음식점 참조도 검증하지만 같은 조합의 중복까지 판단하지는 않는다."
      payload: ["restaurant_id", "restaurants.id", "FK"]
      outcomes:
        - status: allow
          text: "두 참조 대상이 모두 존재해야 관계를 저장할 수 있다."
    - title: "3. 필수 관계 확인"
      from: "MemberRestaurants"
      to: "FK + UNIQUE"
      route_label: "필수 관계라면 member_id와 restaurant_id에 NOT NULL도 적용한다."
      active_actors: [relation, constraint]
      description: "FK와 NULL 허용 여부는 서로 다른 질문이므로 필요한 규칙을 각각 둔다."
      payload: ["NOT NULL", "필수 관계", "참조 무결성"]
      outcomes:
        - status: info
          text: "외래키가 있다고 모든 컬럼 값이 반드시 존재하는 것은 아니다."
    - title: "4. 중복 관계 차단"
      from: "MemberRestaurants"
      to: "FK + UNIQUE"
      route_label: "UNIQUE(member_id, restaurant_id)로 같은 찜 관계의 두 번째 행을 막는다."
      active_actors: [relation, constraint]
      description: "외래키는 대상 존재를, 복합 UNIQUE는 관계 조합의 중복을 담당한다."
      payload: ["(member_id, restaurant_id)", "UNIQUE", "중복 거부"]
      outcomes:
        - status: reject
          text: "같은 회원과 음식점 조합을 두 번 저장할 수 없다."

join_results:
  eyebrow: "Interactive comparison"
  title: "JOIN 종류와 결과 행 수"
  summary: "JOIN은 어떤 쪽 행을 보존할지 정하고 결과 행 수는 매칭되는 행 조합으로 결정된다."
  actors:
    - id: restaurant
      kind: "왼쪽 테이블"
      name: "Restaurant"
      description: "음식점 세 행을 가진 기준 테이블"
    - id: visit
      kind: "오른쪽 테이블"
      name: "Visit"
      description: "음식점별 방문 기록 테이블"
    - id: join
      kind: "연결 조건"
      name: "ON restaurant_id"
      description: "두 테이블을 연결하는 매칭 조건"
    - id: result
      kind: "결과 집합"
      name: "Joined Rows"
      description: "매칭 조합과 보존 규칙으로 만들어진 행들"
  steps:
    - title: "1. 매칭 조합 만들기"
      from: "Restaurant"
      to: "ON restaurant_id"
      route_label: "각 음식점 행과 같은 restaurant_id를 가진 방문 기록을 찾는다."
      active_actors: [restaurant, visit, join]
      description: "한 음식점에 방문 기록이 여러 개면 하나의 왼쪽 행이 여러 결과 조합으로 늘어난다."
      payload: ["restaurant.id", "visit.restaurant_id", "매칭"]
      outcomes:
        - status: info
          text: "결과 행 수를 왼쪽 테이블 행 수만으로 예측하지 않는다."
    - title: "2. INNER JOIN"
      from: "ON restaurant_id"
      to: "Joined Rows"
      route_label: "양쪽에 매칭되는 음식점과 방문 기록 조합만 결과에 남긴다."
      active_actors: [restaurant, visit, join, result]
      description: "매칭되지 않는 왼쪽 또는 오른쪽 행은 INNER JOIN 결과에서 제외된다."
      payload: ["INNER", "matched pairs", "NULL 행 없음"]
      outcomes:
        - status: info
          text: "보존 규칙은 양쪽 매칭 행만 남기는 것이다."
    - title: "3. LEFT JOIN"
      from: "Restaurant"
      to: "Joined Rows"
      route_label: "모든 음식점을 남기고 방문 기록이 없으면 오른쪽 컬럼을 NULL로 채운다."
      active_actors: [restaurant, visit, result]
      description: "방문 기록이 없는 파스타집도 LEFT JOIN 결과에서는 보존된다."
      payload: ["LEFT", "all restaurants", "NULL visit"]
      outcomes:
        - status: allow
          text: "왼쪽 행 보존과 오른쪽 매칭 개수에 따라 결과 행 수가 달라진다."
    - title: "4. FULL OUTER JOIN"
      from: "Restaurant + Visit"
      to: "Joined Rows"
      route_label: "양쪽 행을 모두 보존하고 반대편이 없으면 해당 컬럼을 NULL로 채운다."
      active_actors: [restaurant, visit, result]
      description: "외래키가 없는 방문 기록까지 있다면 음식점 쪽 컬럼이 NULL인 행도 남을 수 있다."
      payload: ["FULL OUTER", "양쪽 보존", "NULL"]
      outcomes:
        - status: info
          text: "JOIN 종류는 보존할 행의 기준을 선택하는 문법이다."

on_where_join:
  eyebrow: "Interactive comparison"
  title: "LEFT JOIN에서 ON과 WHERE의 차이"
  summary: "ON 조건은 매칭 대상을 줄이면서 왼쪽 행을 보존하고 WHERE 조건은 JOIN 결과 행 자체를 걸러낸다."
  actors:
    - id: left
      kind: "보존 대상"
      name: "Restaurant"
      description: "LEFT JOIN에서 항상 남겨야 하는 왼쪽 행"
    - id: on
      kind: "매칭 조건"
      name: "ON visit.youtuber = '철수'"
      description: "오른쪽에서 연결할 행을 제한하는 조건"
    - id: where
      kind: "후처리 조건"
      name: "WHERE visit.youtuber = '철수'"
      description: "JOIN 결과 전체에 적용되는 필터"
    - id: result
      kind: "결과 집합"
      name: "Joined Result"
      description: "조건 위치에 따라 달라지는 결과 행"
  steps:
    - title: "1. LEFT JOIN 시작"
      from: "Restaurant"
      to: "Joined Result"
      route_label: "모든 음식점 행을 기준으로 방문 기록을 붙일 준비를 한다."
      active_actors: [left, result]
      description: "LEFT JOIN의 기본 약속은 왼쪽 테이블의 행을 보존하는 것이다."
      payload: ["LEFT JOIN", "all left rows", "매칭 준비"]
      outcomes:
        - status: info
          text: "보존 규칙과 필터 적용 시점을 분리해 읽는다."
    - title: "2. ON에서 철수 제한"
      from: "ON visit.youtuber = '철수'"
      to: "Joined Result"
      route_label: "철수 방문 기록만 매칭하고 방문 기록이 없는 음식점은 NULL로 남긴다."
      active_actors: [left, on, result]
      description: "ON 조건은 오른쪽 매칭 후보를 줄이지만 LEFT JOIN의 왼쪽 행 보존은 유지한다."
      payload: ["ON", "철수", "NULL 보존"]
      outcomes:
        - status: allow
          text: "왼쪽 행을 유지한 채 연결할 오른쪽 행만 제한한다."
    - title: "3. WHERE에서 철수 제한"
      from: "Joined Result"
      to: "WHERE visit.youtuber = '철수'"
      route_label: "JOIN 후 오른쪽 컬럼이 NULL인 행까지 WHERE 조건으로 다시 검사한다."
      active_actors: [result, where]
      description: "NULL은 철수와 같지 않으므로 방문 기록이 없는 음식점 행이 제거될 수 있다."
      payload: ["WHERE", "NULL 비교", "후처리 필터"]
      outcomes:
        - status: warning
          text: "WHERE에 오른쪽 조건을 두면 LEFT JOIN이 INNER JOIN처럼 보일 수 있다."
    - title: "4. 조건 위치 선택"
      from: "ON / WHERE"
      to: "Joined Result"
      route_label: "왼쪽 행을 보존할지, 매칭된 결과만 남길지 의도에 맞춰 조건 위치를 정한다."
      active_actors: [on, where, result, left]
      description: "조건 자체보다 JOIN 전 매칭 제한인지 JOIN 후 행 제거인지가 결과를 바꾼다."
      payload: ["보존 필요", "매칭 제한", "결과 필터"]
      outcomes:
        - status: info
          text: "SQL을 읽을 때 ON과 WHERE를 처리 순서와 함께 확인한다."

cache_hierarchy:
  eyebrow: "Interactive flow"
  title: "CPU 캐시 계층의 히트와 미스"
  summary: "가까운 캐시부터 블록을 찾고 없으면 더 느린 하위 계층으로 내려간다."
  actors:
    - id: cpu
      kind: "요청 주체"
      name: "CPU"
      description: "명령어 또는 데이터 블록을 요청하는 프로세서"
    - id: l1
      kind: "가장 가까운 캐시"
      name: "L1 Cache"
      description: "작고 빠른 1차 캐시"
    - id: l2
      kind: "중간 캐시"
      name: "L2 / L3 Cache"
      description: "더 큰 하위 캐시 계층"
    - id: ram
      kind: "주기억장치"
      name: "RAM"
      description: "캐시에 없는 블록을 제공하는 메모리"
  steps:
    - title: "1. L1 조회"
      from: "CPU"
      to: "L1 Cache"
      route_label: "CPU가 먼저 가장 가까운 L1 캐시에서 요청 블록을 찾는다."
      active_actors: [cpu, l1]
      description: "L1에 블록이 있으면 하위 계층까지 이동하지 않고 빠르게 결과를 얻는다."
      payload: ["주소", "캐시 라인", "태그 비교"]
      outcomes:
        - status: allow
          text: "L1 hit이면 접근 비용을 가장 작게 유지한다."
    - title: "2. 하위 캐시 확인"
      from: "L1 Cache"
      to: "L2 / L3 Cache"
      route_label: "L1 miss이면 L2와 L3에서 같은 블록을 차례로 찾는다."
      active_actors: [l1, l2]
      description: "각 계층의 용량과 지연 시간은 다르지만 가까운 곳부터 확인한다는 원리는 같다."
      payload: ["L1 miss", "L2 hit", "L3 hit"]
      outcomes:
        - status: info
          text: "캐시 계층의 이름보다 탐색 순서와 비용 차이가 핵심이다."
    - title: "3. RAM 접근"
      from: "L2 / L3 Cache"
      to: "RAM"
      route_label: "모든 캐시에서 찾지 못하면 RAM에서 블록을 가져온다."
      active_actors: [l2, ram, cpu]
      description: "RAM 접근은 캐시 hit보다 느리므로 가져온 블록을 캐시에 채우는 과정이 뒤따를 수 있다."
      payload: ["cache miss", "메모리 블록", "fill line"]
      outcomes:
        - status: warning
          text: "하위 계층까지 내려갈수록 지연 시간이 커진다."

cache_conflict:
  eyebrow: "Interactive flow"
  title: "Direct Mapped 캐시의 충돌 미스"
  summary: "서로 다른 블록이 같은 인덱스에 매핑되면 한 라인이 반복해서 교체될 수 있다."
  actors:
    - id: request
      kind: "메모리 요청"
      name: "Address 0 · 1 · 16"
      description: "서로 다른 주소에서 발생한 접근"
    - id: index
      kind: "캐시 위치"
      name: "Index 0"
      description: "블록을 배치할 Direct Mapped 라인"
    - id: block0
      kind: "기존 블록"
      name: "Block 0"
      description: "처음 Index 0에 들어온 블록"
    - id: block4
      kind: "새 블록"
      name: "Block 4"
      description: "같은 Index 0을 차지하려는 블록"
  steps:
    - title: "1. 블록 0 적재"
      from: "Address 0 · 1 · 16"
      to: "Block 0"
      route_label: "주소 0이 처음 요청되어 블록 0이 Index 0에 적재된다."
      active_actors: [request, block0, index]
      description: "처음 요청한 블록이 캐시에 없으면 콜드 미스가 발생한다."
      payload: ["address 0", "block 0", "index 0"]
      outcomes:
        - status: info
          text: "블록 안의 주소 1은 같은 블록에 있으면 hit가 될 수 있다."
    - title: "2. 같은 블록 hit"
      from: "Address 0 · 1 · 16"
      to: "Block 0"
      route_label: "주소 1은 같은 블록 0의 다른 offset을 읽어 hit가 된다."
      active_actors: [request, block0, index]
      description: "주소가 달라도 블록 번호와 인덱스가 현재 캐시 라인과 맞으면 RAM까지 내려가지 않는다."
      payload: ["address 1", "same block", "hit"]
      outcomes:
        - status: allow
          text: "공간적 지역성이 캐시 hit로 이어지는 예다."
    - title: "3. 블록 4 교체"
      from: "Address 0 · 1 · 16"
      to: "Block 4"
      route_label: "주소 16의 블록 4도 4 % 4 = 0이어서 Index 0의 블록 0을 교체한다."
      active_actors: [request, block0, block4, index]
      description: "서로 다른 태그를 가진 블록이 같은 인덱스를 쓰면 충돌 미스가 발생한다."
      payload: ["address 16", "block 4", "tag 1", "replace"]
      outcomes:
        - status: warning
          text: "같은 라인을 번갈아 쓰는 접근 패턴은 캐시 효율을 떨어뜨린다."

cpu_bus:
  eyebrow: "Interactive flow"
  title: "CPU와 RAM 사이의 주소·제어·데이터 흐름"
  summary: "CPU는 주소와 읽기·쓰기 제어 신호를 보내고 RAM은 읽기 값 또는 저장 결과를 데이터 버스로 교환한다."
  actors:
    - id: cpu
      kind: "처리 장치"
      name: "CPU"
      description: "레지스터·제어장치·ALU를 가진 프로세서"
    - id: control
      kind: "제어"
      name: "Control Unit"
      description: "명령어를 해석하고 버스 동작을 지시함"
    - id: alu
      kind: "연산"
      name: "ALU / Registers"
      description: "값을 계산하고 주소·중간 결과를 보관함"
    - id: ram
      kind: "메모리"
      name: "RAM"
      description: "주소별 명령어와 데이터를 저장함"
  steps:
    - title: "1. 명령어 인출"
      from: "Control Unit"
      to: "RAM"
      route_label: "제어장치가 PC의 주소와 읽기 신호를 RAM으로 보낸다."
      active_actors: [cpu, control, ram]
      description: "RAM은 해당 주소의 명령어를 CPU 쪽 데이터 버스로 돌려준다."
      payload: ["PC address", "read", "instruction"]
      outcomes:
        - status: allow
          text: "CPU는 인출한 명령어를 해석할 수 있다."
    - title: "2. 피연산자 읽기"
      from: "ALU / Registers"
      to: "RAM"
      route_label: "ADD 등에 필요한 데이터 주소와 읽기 신호를 RAM으로 보낸다."
      active_actors: [alu, ram]
      description: "주소·제어 신호와 실제 값이 서로 다른 방향으로 흐를 수 있음을 구분한다."
      payload: ["data address", "read", "operand"]
      outcomes:
        - status: info
          text: "읽기에서는 주소와 제어는 CPU에서, 값은 RAM에서 온다."
    - title: "3. 연산 수행"
      from: "RAM"
      to: "ALU / Registers"
      route_label: "RAM이 보낸 실제 값을 레지스터와 ALU가 계산에 사용한다."
      active_actors: [ram, alu]
      description: "제어장치가 명령어 순서를 조정하고 ALU가 산술·논리 연산을 수행한다."
      payload: ["data bus", "ADD", "result"]
      outcomes:
        - status: info
          text: "메모리 접근과 CPU 내부 연산은 서로 다른 책임이다."
    - title: "4. STORE"
      from: "ALU / Registers"
      to: "RAM"
      route_label: "저장 주소와 쓰기 신호, 레지스터의 값을 RAM으로 보낸다."
      active_actors: [alu, control, ram]
      description: "쓰기에서는 저장할 실제 값도 CPU에서 메모리로 이동한다."
      payload: ["address 502", "write", "value 13"]
      outcomes:
        - status: allow
          text: "RAM[502]에 새로운 값이 기록된다."

jpa_dirty_check:
  eyebrow: "Interactive flow"
  title: "JPA Dirty Checking과 테스트 트랜잭션 경계"
  summary: "영속 상태의 엔티티 변경을 트랜잭션 종료 시점에 감지해 UPDATE하고, 별도 트랜잭션에서 커밋 결과를 확인한다."
  actors:
    - id: service
      kind: "업무 흐름"
      name: "Service Transaction"
      description: "User를 조회하고 도메인 메서드를 호출하는 트랜잭션"
    - id: entity
      kind: "영속 객체"
      name: "Managed User"
      description: "영속성 컨텍스트가 스냅샷과 함께 추적하는 엔티티"
    - id: flush
      kind: "변경 감지"
      name: "Flush / UPDATE"
      description: "스냅샷과 현재 상태를 비교해 SQL을 준비하는 단계"
    - id: test
      kind: "검증 경계"
      name: "Separate Read Transaction"
      description: "커밋된 결과를 별도 트랜잭션에서 읽는 검증"
  steps:
    - title: "1. 엔티티 조회"
      from: "Service Transaction"
      to: "Managed User"
      route_label: "서비스 트랜잭션 안에서 User를 영속 상태로 조회한다."
      active_actors: [service, entity]
      description: "영속성 컨텍스트는 조회 시점의 상태를 스냅샷으로 기억한다."
      payload: ["find User", "managed", "snapshot"]
      outcomes:
        - status: info
          text: "변경 감지는 영속 상태 엔티티를 기준으로 동작한다."
    - title: "2. 도메인 변경"
      from: "Managed User"
      to: "Service Transaction"
      route_label: "setter 또는 changeName 같은 도메인 메서드로 엔티티 상태를 변경한다."
      active_actors: [entity, service]
      description: "변경 문법보다 영속성 컨텍스트가 추적하는 상태가 바뀌었는지가 중요하다."
      payload: ["changeName()", "현재 상태", "dirty"]
      outcomes:
        - status: info
          text: "엔티티 안에 변경 책임을 두면 정책을 함께 관리하기 쉽다."
    - title: "3. Flush와 커밋"
      from: "Managed User"
      to: "Flush / UPDATE"
      route_label: "flush 시점에 스냅샷과 현재 상태를 비교해 UPDATE SQL을 준비한다."
      active_actors: [entity, flush, service]
      description: "flush가 SQL을 보낸 시점과 트랜잭션이 최종 커밋된 시점은 구분해서 본다."
      payload: ["dirty checking", "UPDATE", "commit"]
      outcomes:
        - status: allow
          text: "커밋이 성공해야 다른 트랜잭션에서 변경 결과를 읽을 수 있다."
    - title: "4. 별도 조회 검증"
      from: "Separate Read Transaction"
      to: "Managed User"
      route_label: "서비스 트랜잭션이 끝난 뒤 별도 트랜잭션으로 변경된 User를 조회한다."
      active_actors: [test, entity]
      description: "테스트가 같은 트랜잭션 안에서만 동작하면 커밋과 격리 경계를 검증하지 못할 수 있다."
      payload: ["new transaction", "committed value", "assert"]
      outcomes:
        - status: info
          text: "검증하려는 사실에 맞춰 트랜잭션 경계를 설계한다."

boot_startup:
  eyebrow: "Interactive flow"
  title: "Spring Boot 애플리케이션 시작"
  summary: "Spring Boot가 설정과 클래스패스를 바탕으로 컨테이너와 웹 인프라를 준비한 뒤 애플리케이션을 실행한다."
  actors:
    - id: app
      kind: "시작점"
      name: "SpringApplication"
      description: "main에서 부트스트랩을 시작하는 진입점"
    - id: config
      kind: "환경 설정"
      name: "Auto Configuration"
      description: "클래스패스와 설정에 맞는 자동 구성 후보"
    - id: container
      kind: "객체 관리"
      name: "Spring Container"
      description: "BeanDefinition으로 객체와 의존성을 관리하는 컨테이너"
    - id: web
      kind: "웹 인프라"
      name: "Embedded Web Server"
      description: "HTTP 요청을 받을 서버와 Servlet 환경"
  steps:
    - title: "1. 애플리케이션 시작"
      from: "SpringApplication"
      to: "Auto Configuration"
      route_label: "SpringApplication이 환경과 클래스패스를 읽어 시작 구성을 결정한다."
      active_actors: [app, config]
      description: "Boot는 반복적인 초기화 코드를 줄이고 애플리케이션 구성 후보를 준비한다."
      payload: ["main", "classpath", "application.yml"]
      outcomes:
        - status: info
          text: "자동 구성은 조건에 따라 적용되므로 모든 애플리케이션의 결과가 동일하지 않다."
    - title: "2. 컨테이너 준비"
      from: "Auto Configuration"
      to: "Spring Container"
      route_label: "설정과 컴포넌트 스캔 결과로 BeanDefinition을 등록한다."
      active_actors: [config, container]
      description: "컨테이너는 Bean을 만들고 의존 관계를 연결할 준비를 한다."
      payload: ["BeanDefinition", "component scan", "dependency graph"]
      outcomes:
        - status: allow
          text: "객체 생성과 연결의 책임이 컨테이너로 모인다."
    - title: "3. 웹 인프라 준비"
      from: "Spring Container"
      to: "Embedded Web Server"
      route_label: "웹 관련 Bean과 내장 서버·Servlet 환경을 함께 준비한다."
      active_actors: [container, web]
      description: "웹 애플리케이션은 컨테이너 초기화와 HTTP 진입점 준비가 함께 완료되어야 한다."
      payload: ["DispatcherServlet", "embedded server", "port"]
      outcomes:
        - status: allow
          text: "서버가 뜬 뒤에야 외부 HTTP 요청을 받을 수 있다."
    - title: "4. 요청 대기"
      from: "Embedded Web Server"
      to: "SpringApplication"
      route_label: "초기화가 끝난 애플리케이션이 포트에서 HTTP 요청을 기다린다."
      active_actors: [web, app, container]
      description: "실제 Boot 내부 이벤트 순서 전체가 아니라 핵심 책임 연결을 단순화한 흐름이다."
      payload: ["started", "listening", "ready"]
      outcomes:
        - status: info
          text: "시작 성공과 요청 처리 흐름을 별개의 단계로 구분한다."

security_mvc:
  eyebrow: "Interactive flow"
  title: "Spring Security에서 Spring MVC까지"
  summary: "HTTP 요청은 Security Filter에서 인증·인가를 거친 뒤 DispatcherServlet과 Controller로 이어진다."
  actors:
    - id: client
      kind: "요청"
      name: "Client Request"
      description: "브라우저나 API 클라이언트의 HTTP 요청"
    - id: security
      kind: "보안 경계"
      name: "Security Filter"
      description: "인증 정보와 접근 권한을 확인하는 필터 체인"
    - id: mvc
      kind: "웹 분배"
      name: "DispatcherServlet"
      description: "Spring MVC의 Front Controller"
    - id: controller
      kind: "업무 진입점"
      name: "Controller"
      description: "매핑된 요청을 처리하는 컨트롤러"
  steps:
    - title: "1. 요청 진입"
      from: "Client Request"
      to: "Security Filter"
      route_label: "HTTP 요청이 애플리케이션 앞단의 Security Filter Chain으로 들어온다."
      active_actors: [client, security]
      description: "보안 검증은 MVC Controller보다 앞선 요청 경계에서 실행된다."
      payload: ["HTTP request", "Cookie / Bearer", "filter chain"]
      outcomes:
        - status: info
          text: "인증 정보가 없거나 유효하지 않으면 MVC로 내려가지 않을 수 있다."
    - title: "2. 인증·인가 확인"
      from: "Security Filter"
      to: "DispatcherServlet"
      route_label: "인증 결과와 권한 정책을 확인한 뒤 통과한 요청만 MVC로 넘긴다."
      active_actors: [security, mvc]
      description: "SecurityContext에 현재 요청의 인증 정보가 설정되는 시점과 Controller 호출을 구분한다."
      payload: ["Authentication", "Authorization", "SecurityContext"]
      outcomes:
        - status: allow
          text: "검증을 통과한 요청만 다음 계층에서 처리된다."
    - title: "3. 핸들러 매핑"
      from: "DispatcherServlet"
      to: "Controller"
      route_label: "DispatcherServlet이 URL과 HTTP 메서드에 맞는 Controller 핸들러를 찾는다."
      active_actors: [mvc, controller]
      description: "Spring MVC는 요청을 적절한 컨트롤러 메서드로 분배한다."
      payload: ["handler mapping", "path", "method"]
      outcomes:
        - status: allow
          text: "컨트롤러가 실제 비즈니스 요청 처리를 시작한다."
    - title: "4. 응답 반환"
      from: "Controller"
      to: "Client Request"
      route_label: "Controller의 결과가 MVC와 보안 계층을 거쳐 HTTP 응답으로 돌아간다."
      active_actors: [controller, mvc, client]
      description: "요청이 내려가는 경로와 응답이 올라오는 경로를 하나의 왕복으로 이해한다."
      payload: ["response body", "status", "HTTP response"]
      outcomes:
        - status: info
          text: "보안 필터와 MVC는 서로 다른 책임을 가진 요청 처리 계층이다."

mvc_http:
  eyebrow: "Interactive flow"
  title: "Spring MVC의 JSON 요청과 응답"
  summary: "Servlet Container가 요청을 받고 DispatcherServlet·Controller·MessageConverter를 거쳐 JSON 응답을 만든다."
  actors:
    - id: client
      kind: "HTTP 클라이언트"
      name: "Client"
      description: "JSON 요청을 보내고 응답을 받는 쪽"
    - id: servlet
      kind: "서블릿 환경"
      name: "Servlet Container"
      description: "네트워크 요청과 Servlet 실행을 담당하는 런타임"
    - id: dispatcher
      kind: "분배기"
      name: "DispatcherServlet"
      description: "핸들러를 찾고 MVC 처리를 조정하는 Front Controller"
    - id: converter
      kind: "변환기"
      name: "HttpMessageConverter"
      description: "객체와 JSON Body를 변환하는 계층"
  steps:
    - title: "1. JSON 요청 수신"
      from: "Client"
      to: "Servlet Container"
      route_label: "클라이언트가 JSON Body를 포함한 HTTP 요청을 보낸다."
      active_actors: [client, servlet]
      description: "URL 파라미터 요청과 JSON Body 요청은 필요한 변환 경로가 다를 수 있다."
      payload: ["POST /users", "Content-Type: application/json", "JSON"]
      outcomes:
        - status: info
          text: "모든 HTTP 요청이 JSON 변환을 필요로 하지는 않는다."
    - title: "2. MVC 분배"
      from: "Servlet Container"
      to: "DispatcherServlet"
      route_label: "Servlet Container가 요청을 DispatcherServlet에 전달한다."
      active_actors: [servlet, dispatcher]
      description: "DispatcherServlet이 Spring MVC 내부의 요청 처리를 시작한다."
      payload: ["servlet request", "handler mapping", "controller"]
      outcomes:
        - status: allow
          text: "적절한 컨트롤러 메서드가 선택된다."
    - title: "3. JSON 역직렬화"
      from: "HttpMessageConverter"
      to: "DispatcherServlet"
      route_label: "Jackson 같은 변환기가 Request Body를 Java 객체로 만든다."
      active_actors: [converter, dispatcher]
      description: "객체로 바꾸는 단계는 들어오는 JSON Body에 대한 역직렬화다."
      payload: ["JSON", "CreateUserRequest", "deserialize"]
      outcomes:
        - status: info
          text: "객체 변환과 비즈니스 로직 수행을 하나의 단계로 합치지 않는다."
    - title: "4. JSON 응답 직렬화"
      from: "DispatcherServlet"
      to: "Client"
      route_label: "Controller 결과 객체를 JSON으로 직렬화해 HTTP 응답으로 보낸다."
      active_actors: [dispatcher, converter, client]
      description: "응답 객체를 JSON으로 바꾸는 과정은 들어올 때와 반대 방향의 변환이다."
      payload: ["UserResponse", "serialize", "HTTP response"]
      outcomes:
        - status: allow
          text: "네트워크 I/O와 객체 직렬화 책임을 분리해 설명할 수 있다."

bean_lifecycle:
  eyebrow: "Interactive flow"
  title: "Annotation에서 Spring Bean 생명주기까지"
  summary: "Spring이 어노테이션 메타데이터를 읽어 BeanDefinition을 만들고 객체를 생성·주입·초기화한다."
  actors:
    - id: annotation
      kind: "메타데이터"
      name: "@Service / @Component"
      description: "클래스가 Bean 후보임을 나타내는 어노테이션"
    - id: reflection
      kind: "해석"
      name: "Reflection / Scan"
      description: "클래스패스의 메타데이터를 읽는 과정"
    - id: definition
      kind: "설계 정보"
      name: "BeanDefinition"
      description: "생성·주입·스코프 정보를 담은 정의"
    - id: bean
      kind: "관리 객체"
      name: "Spring Bean"
      description: "컨테이너가 생성하고 생명주기를 관리하는 객체"
  steps:
    - title: "1. 후보 표시"
      from: "@Service / @Component"
      to: "Reflection / Scan"
      route_label: "컴포넌트 스캔이 직접 또는 메타 어노테이션을 가진 클래스를 찾는다."
      active_actors: [annotation, reflection]
      description: "@Service 자체가 객체를 만드는 것이 아니라 Bean 후보라는 메타데이터를 제공한다."
      payload: ["@Service", "@Component", "classpath"]
      outcomes:
        - status: info
          text: "어노테이션과 객체 생성 주체를 구분한다."
    - title: "2. 정의 등록"
      from: "Reflection / Scan"
      to: "BeanDefinition"
      route_label: "Spring이 클래스 정보와 설정을 BeanDefinition으로 등록한다."
      active_actors: [reflection, definition]
      description: "컨테이너가 이후 어떤 방식으로 Bean을 만들지 설명하는 내부 정의가 준비된다."
      payload: ["class metadata", "scope", "constructor"]
      outcomes:
        - status: allow
          text: "객체 생성 계획과 의존성 정보가 컨테이너에 모인다."
    - title: "3. 객체 생성과 주입"
      from: "BeanDefinition"
      to: "Spring Bean"
      route_label: "컨테이너가 객체를 만들고 필요한 의존성을 연결한다."
      active_actors: [definition, bean]
      description: "생성자 주입 등 구성 규칙에 따라 Bean 그래프가 완성된다."
      payload: ["instantiate", "dependency injection", "proxy 후보"]
      outcomes:
        - status: allow
          text: "애플리케이션 코드가 구현체를 직접 생성하지 않아도 된다."
    - title: "4. 생명주기 관리"
      from: "Spring Bean"
      to: "Spring Container"
      route_label: "초기화 콜백과 스코프 규칙에 따라 컨테이너가 Bean을 관리한다."
      active_actors: [bean, definition]
      description: "Bean 등록은 생성 한 번으로 끝나지 않고 초기화·사용·종료까지 이어진다."
      payload: ["init", "scope", "destroy"]
      outcomes:
        - status: info
          text: "생명주기 책임이 컨테이너에 있다는 점이 핵심이다."

ioc_di:
  eyebrow: "Interactive comparison"
  title: "직접 생성과 Spring IoC·DI"
  summary: "직접 생성은 서비스가 구현체를 선택하지만 IoC·DI에서는 컨테이너가 객체 생성과 의존성 연결을 맡는다."
  actors:
    - id: service
      kind: "사용자"
      name: "OrderService"
      description: "OrderRepository 계약을 필요로 하는 서비스"
    - id: impl
      kind: "구현체"
      name: "JdbcOrderRepository"
      description: "Repository 계약의 구체 구현"
    - id: container
      kind: "외부 조정자"
      name: "Spring IoC Container"
      description: "객체를 만들고 의존성을 주입하는 관리 주체"
    - id: contract
      kind: "추상화"
      name: "OrderRepository"
      description: "서비스와 구현체 사이의 계약"
  steps:
    - title: "1. 직접 생성"
      from: "OrderService"
      to: "JdbcOrderRepository"
      route_label: "서비스가 new JdbcOrderRepository()로 구체 구현체를 직접 만든다."
      active_actors: [service, impl]
      description: "호출부가 구현체 선택과 생성 방법을 함께 알아야 하는 구조다."
      payload: ["new", "구체 클래스", "강한 결합"]
      outcomes:
        - status: warning
          text: "구현체 교체와 테스트 대체 범위가 서비스에 퍼질 수 있다."
    - title: "2. 계약 의존"
      from: "OrderService"
      to: "OrderRepository"
      route_label: "서비스는 필요한 기능의 계약만 알고 구체 구현체는 직접 만들지 않는다."
      active_actors: [service, contract]
      description: "인터페이스 타입에 의존하면 구현의 세부 사항과 호출부를 분리할 수 있다."
      payload: ["constructor parameter", "interface", "역할"]
      outcomes:
        - status: allow
          text: "서비스의 책임이 의존성 생성에서 업무 처리로 좁혀진다."
    - title: "3. 컨테이너 주입"
      from: "Spring IoC Container"
      to: "OrderService"
      route_label: "컨테이너가 OrderRepository 구현체를 선택해 생성자에 전달한다."
      active_actors: [container, contract, service, impl]
      description: "IoC는 객체 관리의 제어권을 외부로 넘기는 더 큰 개념이고 DI는 그 전달 방식이다."
      payload: ["bean creation", "constructor injection", "wiring"]
      outcomes:
        - status: allow
          text: "구현체 선택과 연결 책임이 바깥 구성으로 이동한다."

modern_java_selection:
  eyebrow: "Interactive flow"
  title: "코드 의도에서 Modern Java 기능 선택"
  summary: "최신 문법을 무조건 적용하지 않고 코드가 표현하려는 의도와 기능의 책임을 맞춰 선택한다."
  actors:
    - id: intent
      kind: "문제 의도"
      name: "Code Intent"
      description: "데이터 전달·부재·분기·타입 계층 같은 코드의 목적"
    - id: data
      kind: "데이터 전달"
      name: "record"
      description: "값 중심 DTO를 간결하게 표현하는 기능"
    - id: absence
      kind: "부재 표현"
      name: "Optional / orElseGet"
      description: "값의 부재와 기본값 계산 시점을 표현함"
    - id: type
      kind: "타입·분기"
      name: "sealed / pattern / switch"
      description: "허용 타입과 분기 의도를 드러내는 기능들"
  steps:
    - title: "1. 의도 확인"
      from: "Code Intent"
      to: "record"
      route_label: "주된 책임이 데이터 전달인지 먼저 확인한다."
      active_actors: [intent, data]
      description: "DTO처럼 값 전달이 중심이면 record가 후보가 될 수 있다."
      payload: ["DTO", "불변 값", "record"]
      outcomes:
        - status: info
          text: "Entity까지 같은 방식으로 바꾸는 것은 도메인 책임을 다시 확인해야 한다."
    - title: "2. 부재와 비용"
      from: "Code Intent"
      to: "Optional / orElseGet"
      route_label: "값이 없을 수 있는지와 기본값 계산 비용이 큰지를 구분한다."
      active_actors: [intent, absence]
      description: "Optional은 부재를, orElseGet은 기본값 계산 시점 지연을 표현한다."
      payload: ["empty result", "Optional", "lazy default"]
      outcomes:
        - status: allow
          text: "기능 이름보다 코드가 전달하려는 사실을 먼저 드러낸다."
    - title: "3. 타입 계층과 분기"
      from: "Code Intent"
      to: "sealed / pattern / switch"
      route_label: "허용 타입을 닫거나 분기 결과를 표현해야 하는지 판단한다."
      active_actors: [intent, type]
      description: "sealed, pattern matching, switch expression은 서로 다른 의도를 위한 도구다."
      payload: ["sealed", "instanceof pattern", "switch expression"]
      outcomes:
        - status: info
          text: "최신 문법 사용 자체가 리팩터링의 목적은 아니다."

spring_http_io:
  eyebrow: "Interactive flow"
  title: "Spring HTTP 요청의 직렬화와 I/O"
  summary: "클라이언트 JSON은 Java 객체로 역직렬화되고 비즈니스 로직 뒤 응답 객체가 다시 JSON으로 직렬화된다."
  actors:
    - id: client
      kind: "네트워크 입력"
      name: "HTTP Client"
      description: "JSON Request를 보내고 JSON Response를 받는 클라이언트"
    - id: converter
      kind: "변환 계층"
      name: "Jackson Converter"
      description: "JSON과 Java 객체 사이를 변환하는 계층"
    - id: service
      kind: "업무 로직"
      name: "Spring Service"
      description: "변환된 요청을 처리하는 비즈니스 계층"
    - id: response
      kind: "네트워크 출력"
      name: "HTTP Response"
      description: "직렬화된 JSON을 담은 응답"
  steps:
    - title: "1. JSON 수신"
      from: "HTTP Client"
      to: "Jackson Converter"
      route_label: "클라이언트가 JSON Request Body를 네트워크로 보낸다."
      active_actors: [client, converter]
      description: "HTTP 네트워크 입력과 JSON 형식 자체를 구분한다."
      payload: ["HTTP request", "JSON", "Request Body"]
      outcomes:
        - status: info
          text: "JSON이 들어온다는 사실과 객체 변환은 서로 다른 단계다."
    - title: "2. 역직렬화"
      from: "Jackson Converter"
      to: "Spring Service"
      route_label: "Request Body를 CreateUserRequest 같은 Java 객체로 변환한다."
      active_actors: [converter, service]
      description: "외부 표현을 애플리케이션 내부 타입으로 바꾸는 과정이다."
      payload: ["deserialize", "CreateUserRequest", "Java object"]
      outcomes:
        - status: allow
          text: "서비스는 JSON 문법보다 객체의 의미를 다룬다."
    - title: "3. 비즈니스 처리"
      from: "Spring Service"
      to: "Jackson Converter"
      route_label: "서비스가 처리 결과를 UserResponse 같은 객체로 만든다."
      active_actors: [service, converter]
      description: "업무 로직 수행과 결과 객체 생성은 직렬화 전의 별도 책임이다."
      payload: ["business logic", "UserResponse", "result object"]
      outcomes:
        - status: info
          text: "객체가 만들어졌다고 네트워크 응답이 바로 되는 것은 아니다."
    - title: "4. 직렬화와 응답"
      from: "Jackson Converter"
      to: "HTTP Response"
      route_label: "응답 객체를 JSON으로 바꾸고 HTTP Response로 전송한다."
      active_actors: [converter, response, client]
      description: "내부 객체를 외부 전송 형식으로 바꾸는 과정이 직렬화다."
      payload: ["serialize", "JSON response", "network output"]
      outcomes:
        - status: allow
          text: "입력의 역직렬화와 출력의 직렬화를 왕복 흐름으로 구분한다."

race_condition:
  eyebrow: "Interactive flow"
  title: "count++에서 발생하는 Race Condition"
  summary: "두 Thread가 같은 값을 읽고 각각 계산한 뒤 덮어쓰면 기대한 2가 아니라 1이 남을 수 있다."
  actors:
    - id: thread_a
      kind: "실행 흐름 A"
      name: "Thread A"
      description: "공유 count를 읽고 증가시키는 스레드"
    - id: thread_b
      kind: "실행 흐름 B"
      name: "Thread B"
      description: "같은 공유 상태에 동시에 접근하는 스레드"
    - id: shared
      kind: "공유 상태"
      name: "count = 0"
      description: "두 Thread가 함께 읽고 쓰는 값"
    - id: result
      kind: "최종 결과"
      name: "count = 1"
      description: "쓰기 충돌로 한 증가가 사라진 결과"
  steps:
    - title: "1. 같은 값 읽기"
      from: "count = 0"
      to: "Thread A / Thread B"
      route_label: "두 Thread가 거의 동시에 공유 count의 0을 읽는다."
      active_actors: [shared, thread_a, thread_b]
      description: "count++는 한 번에 끝나는 원자 연산이 아니라 읽기·수정·쓰기의 묶음이다."
      payload: ["read 0", "read 0", "shared state"]
      outcomes:
        - status: warning
          text: "둘 다 같은 이전 값을 기반으로 계산할 수 있다."
    - title: "2. 각각 1 계산"
      from: "Thread A / Thread B"
      to: "count = 0"
      route_label: "각 Thread가 로컬 계산 결과 1을 만든다."
      active_actors: [thread_a, thread_b, shared]
      description: "각자 한 번 증가시켰다는 사실과 공유 메모리에 반영된 횟수는 다를 수 있다."
      payload: ["0 + 1", "local result 1", "overlap"]
      outcomes:
        - status: warning
          text: "두 계산 사이에 다른 Thread의 쓰기가 끼어들 수 있다."
    - title: "3. 마지막 쓰기"
      from: "Thread A / Thread B"
      to: "count = 1"
      route_label: "마지막으로 기록된 1이 앞선 Thread의 결과를 덮어쓴다."
      active_actors: [thread_a, thread_b, result]
      description: "실행 순서에 따라 결과가 달라지는 것이 Race Condition이다."
      payload: ["write 1", "write 1", "lost update"]
      outcomes:
        - status: reject
          text: "두 번의 증가가 모두 반영될 것이라는 보장이 깨진다."
    - title: "4. 제어 범위 선택"
      from: "count = 1"
      to: "count = 0"
      route_label: "락·원자 연산·불변 구조 등 공유 상태에 맞는 제어 방식을 선택한다."
      active_actors: [result, shared]
      description: "동기화 여부보다 어떤 상태를 어느 범위에서 보호해야 하는지 먼저 판단한다."
      payload: ["lock", "atomic", "critical section"]
      outcomes:
        - status: info
          text: "문제의 원인은 Thread 수가 아니라 공유 상태의 경쟁이다."

singleton_shared_state:
  eyebrow: "Interactive flow"
  title: "Spring Singleton Bean과 공유 mutable 상태"
  summary: "여러 HTTP 요청이 하나의 Singleton Bean 인스턴스에 동시에 들어오면 mutable field가 요청 간 공유될 수 있다."
  actors:
    - id: requests
      kind: "동시 요청"
      name: "HTTP Requests"
      description: "서로 다른 요청 Thread에서 들어오는 호출들"
    - id: threads
      kind: "실행 흐름"
      name: "Request Threads"
      description: "각 요청을 처리하는 독립 실행 흐름"
    - id: bean
      kind: "공유 객체"
      name: "Singleton Bean"
      description: "컨테이너가 기본적으로 하나만 만드는 Bean"
    - id: state
      kind: "변경 가능 필드"
      name: "Mutable Field"
      description: "요청별 값이 섞일 수 있는 인스턴스 상태"
  steps:
    - title: "1. 요청 분리"
      from: "HTTP Requests"
      to: "Request Threads"
      route_label: "여러 HTTP 요청이 서로 다른 Thread에서 동시에 실행된다."
      active_actors: [requests, threads]
      description: "요청별 로컬 변수는 Thread마다 분리되지만 Bean 인스턴스는 별도 문제다."
      payload: ["request A", "request B", "thread"]
      outcomes:
        - status: info
          text: "Thread가 다르다는 사실만으로 객체 상태가 분리되지는 않는다."
    - title: "2. 하나의 Bean 공유"
      from: "Request Threads"
      to: "Singleton Bean"
      route_label: "여러 Thread가 컨테이너의 같은 Singleton Bean을 호출한다."
      active_actors: [threads, bean]
      description: "Singleton은 인스턴스 수를 줄이는 스코프이지 자동으로 Thread-safe하게 만드는 장치가 아니다."
      payload: ["same instance", "DI", "concurrent call"]
      outcomes:
        - status: warning
          text: "인스턴스 필드가 요청별 작업 공간으로 사용되면 경쟁이 생긴다."
    - title: "3. mutable field 충돌"
      from: "Singleton Bean"
      to: "Mutable Field"
      route_label: "동시 요청이 같은 mutable field를 읽고 쓰면서 값이 섞일 수 있다."
      active_actors: [bean, state, threads]
      description: "요청 데이터는 메서드 로컬 변수나 불변 값으로 두고 공유 상태는 별도 보호가 필요하다."
      payload: ["field write", "request data", "race"]
      outcomes:
        - status: reject
          text: "Singleton이라는 이유만으로 공유 필드가 안전해지지 않는다."

distributed_jvm_lock:
  eyebrow: "Interactive comparison"
  title: "여러 서버에서 JVM Lock이 충분하지 않은 이유"
  summary: "각 서버의 JVM Lock은 자기 프로세스 안에서만 유효하므로 같은 DB를 향한 전역 경쟁을 막지 못한다."
  actors:
    - id: request_a
      kind: "요청 경로 A"
      name: "Server A"
      description: "첫 번째 JVM에서 요청을 처리하는 서버"
    - id: request_b
      kind: "요청 경로 B"
      name: "Server B"
      description: "두 번째 JVM에서 요청을 처리하는 서버"
    - id: lock
      kind: "프로세스 잠금"
      name: "JVM Locks"
      description: "각 JVM 내부 객체에 걸린 독립된 락"
    - id: db
      kind: "공유 자원"
      name: "Shared Database"
      description: "두 서버가 함께 변경하는 외부 상태"
  steps:
    - title: "1. 요청 분산"
      from: "Server A / Server B"
      to: "JVM Locks"
      route_label: "로드 밸런서가 같은 자원 요청을 서로 다른 서버로 보낼 수 있다."
      active_actors: [request_a, request_b]
      description: "서버가 여러 대가 되면 요청이 한 프로세스에만 머문다는 보장이 없다."
      payload: ["request 1", "request 2", "load balancing"]
      outcomes:
        - status: warning
          text: "분산 배치에서는 서버별 메모리 상태가 서로 다르다."
    - title: "2. 독립 Lock 획득"
      from: "JVM Locks"
      to: "Shared Database"
      route_label: "Server A와 B가 서로 다른 JVM Lock을 획득하고 DB에 접근한다."
      active_actors: [request_a, request_b, lock, db]
      description: "객체 주소와 락 모니터가 JVM마다 다르므로 한쪽 락이 다른 서버를 멈추지 않는다."
      payload: ["lock A", "lock B", "same row"]
      outcomes:
        - status: reject
          text: "프로세스 내부 락만으로 전역 상호 배제를 만들 수 없다."
    - title: "3. 공유 제어 선택"
      from: "Shared Database"
      to: "JVM Locks"
      route_label: "DB Lock·분산 Lock·원자 연산처럼 공유 자원에 도달하는 제어를 선택한다."
      active_actors: [db, request_a, request_b]
      description: "락의 위치는 보호하려는 상태가 실제로 어디에 있는지에 맞춰야 한다."
      payload: ["DB row lock", "distributed lock", "atomic update"]
      outcomes:
        - status: info
          text: "단일 JVM 문제와 여러 서버의 공유 상태 문제를 구분한다."

jvm_memory:
  eyebrow: "Interactive flow"
  title: "JVM Stack·Heap·Method Area와 객체 생명주기"
  summary: "Stack의 여러 참조가 Heap의 같은 객체를 가리킬 수 있고 Method Area는 클래스 수준 정보를 관리한다."
  actors:
    - id: stack
      kind: "호출 프레임"
      name: "JVM Stack"
      description: "메서드별 지역 변수와 객체 참조를 담는 영역"
    - id: heap
      kind: "객체 저장"
      name: "Heap"
      description: "new로 생성된 객체가 놓이는 영역"
    - id: method
      kind: "클래스 정보"
      name: "Method Area"
      description: "클래스 메타데이터와 정적 수준 정보를 관리하는 영역"
    - id: gc
      kind: "회수 판단"
      name: "Garbage Collector"
      description: "더 이상 도달할 수 없는 객체를 회수하는 런타임"
  steps:
    - title: "1. 객체 생성"
      from: "JVM Stack"
      to: "Heap"
      route_label: "메서드 안의 참조 변수 user1·user2가 Heap의 User 객체를 가리킨다."
      active_actors: [stack, heap]
      description: "변수 두 개가 있어도 new를 한 번만 했다면 같은 객체를 함께 가리킬 수 있다."
      payload: ["user1", "user2", "new User()"]
      outcomes:
        - status: info
          text: "참조 변수 수와 Heap 객체 수를 같은 숫자로 세지 않는다."
    - title: "2. 클래스 정보 사용"
      from: "Method Area"
      to: "Heap"
      route_label: "User 클래스의 메타데이터와 메서드 정보가 객체 동작을 뒷받침한다."
      active_actors: [method, heap]
      description: "객체 인스턴스 데이터와 클래스 수준 정보는 다른 메모리 책임으로 나누어 본다."
      payload: ["class metadata", "method", "static info"]
      outcomes:
        - status: info
          text: "Method Area의 구현 세부는 JVM 버전에 따라 달라질 수 있다."
    - title: "3. 프레임 종료"
      from: "JVM Stack"
      to: "Garbage Collector"
      route_label: "메서드가 끝나면 Stack의 지역 참조는 사라지고 Heap 객체의 도달 가능성을 다시 판단한다."
      active_actors: [stack, heap, gc]
      description: "참조가 모두 끊겼다고 해서 즉시 객체가 삭제되는 것은 아니며 GC가 회수 시점을 결정한다."
      payload: ["frame pop", "reachability", "GC candidate"]
      outcomes:
        - status: info
          text: "메서드 종료와 객체 즉시 소멸을 같은 사건으로 보지 않는다."

collection_framework:
  eyebrow: "Interactive comparison"
  title: "Java Collection Framework의 구조"
  summary: "공통 인터페이스 아래 List·Set과 별도 Map 계층이 저장과 조회 방식에 맞는 구현체를 제공한다."
  actors:
    - id: collection
      kind: "공통 계약"
      name: "Collection"
      description: "여러 요소를 다루는 공통 인터페이스"
    - id: list
      kind: "순서·중복"
      name: "List"
      description: "인덱스와 입력 순서를 다루는 계층"
    - id: set
      kind: "중복 없음"
      name: "Set"
      description: "논리적 중복을 허용하지 않는 계층"
    - id: map
      kind: "키·값"
      name: "Map"
      description: "Key와 Value 관계를 관리하는 별도 계층"
  steps:
    - title: "1. 공통 컬렉션 계약"
      from: "Collection"
      to: "List / Set"
      route_label: "List와 Set이 Collection의 공통 연산 계약을 확장한다."
      active_actors: [collection, list, set]
      description: "Collection은 단순히 크기가 변하는 배열이 아니라 여러 구조를 공통 방식으로 다루는 틀이다."
      payload: ["add", "remove", "iterate"]
      outcomes:
        - status: info
          text: "공통 인터페이스와 저장 구조 구현체를 구분한다."
    - title: "2. List 선택"
      from: "List"
      to: "Collection"
      route_label: "순서와 인덱스 접근이 중요하면 List 계열을 선택한다."
      active_actors: [list, collection]
      description: "ArrayList와 LinkedList는 같은 List 계약을 서로 다른 저장 구조로 구현한다."
      payload: ["order", "duplicates", "index"]
      outcomes:
        - status: allow
          text: "사용 패턴이 구현체 선택의 기준이 된다."
    - title: "3. Set 선택"
      from: "Set"
      to: "Collection"
      route_label: "중복을 허용하지 않는 값 집합이 필요하면 Set 계열을 선택한다."
      active_actors: [set, collection]
      description: "Set의 중복 판단은 구현체의 해시·동등성 계약과 연결된다."
      payload: ["unique", "equals", "hashCode"]
      outcomes:
        - status: info
          text: "중복 없음은 값의 의미를 어떻게 정의하는지에 달려 있다."
    - title: "4. Map 분리"
      from: "Map"
      to: "Collection"
      route_label: "키와 값의 관계를 저장해야 하면 Collection과 별도인 Map 계층을 사용한다."
      active_actors: [map, collection]
      description: "Map은 요소 하나씩의 순서보다 키로 값을 찾는 관계를 모델링한다."
      payload: ["key", "value", "lookup"]
      outcomes:
        - status: info
          text: "List·Set·Map을 하나의 배열 대체품으로 묶어 선택하지 않는다."

arraylist_linkedlist:
  eyebrow: "Interactive comparison"
  title: "ArrayList와 LinkedList 저장 구조"
  summary: "ArrayList는 배열 인덱스로 접근하고 LinkedList는 노드 링크를 따라가므로 접근과 삽입 비용이 다르다."
  actors:
    - id: operation
      kind: "사용 패턴"
      name: "Access / Insert"
      description: "인덱스 조회와 중간 삽입·삭제 같은 작업"
    - id: array
      kind: "연속 저장"
      name: "ArrayList"
      description: "내부 배열과 인덱스로 요소를 저장"
    - id: linked
      kind: "노드 연결"
      name: "LinkedList"
      description: "노드와 next·prev 링크로 요소를 저장"
    - id: cost
      kind: "비용 판단"
      name: "Actual Workload"
      description: "탐색과 이동을 함께 포함한 실제 비용"
  steps:
    - title: "1. 인덱스 조회"
      from: "Access / Insert"
      to: "ArrayList"
      route_label: "ArrayList는 인덱스로 내부 배열 위치를 계산해 요소를 읽는다."
      active_actors: [operation, array]
      description: "연속 저장 덕분에 임의 인덱스 접근이 일정한 비용에 가깝다."
      payload: ["get(i)", "array index", "O(1)"]
      outcomes:
        - status: allow
          text: "인덱스 조회와 순회가 많은 코드에서 기본 선택이 될 수 있다."
    - title: "2. 링크 탐색"
      from: "Access / Insert"
      to: "LinkedList"
      route_label: "LinkedList는 시작점에서 노드를 따라가 대상 위치를 찾는다."
      active_actors: [operation, linked]
      description: "삽입 위치를 이미 알고 있지 않다면 탐색 비용이 먼저 발생한다."
      payload: ["node", "next / prev", "traversal"]
      outcomes:
        - status: warning
          text: "중간 삽입이 항상 전체 작업에서 빠르다고 단정하지 않는다."
    - title: "3. 구현체 선택"
      from: "Actual Workload"
      to: "ArrayList"
      route_label: "조회·순회·삽입 빈도와 위치 지식까지 포함해 구현체를 선택한다."
      active_actors: [cost, array, linked]
      description: "Big-O 하나만 보지 말고 실제 호출 패턴과 메모리 비용을 함께 비교한다."
      payload: ["access frequency", "known position", "node overhead"]
      outcomes:
        - status: info
          text: "자료구조 선택은 작업 패턴에 대한 설계 결정이다."

hashset_equals:
  eyebrow: "Interactive flow"
  title: "HashSet의 hashCode와 equals"
  summary: "HashSet은 hashCode로 후보 버킷을 찾은 뒤 equals로 논리적 중복을 최종 판단한다."
  actors:
    - id: object
      kind: "입력 객체"
      name: "User Object"
      description: "Set에 추가하거나 이미 존재하는지 확인할 객체"
    - id: hash
      kind: "1차 탐색"
      name: "hashCode()"
      description: "객체가 들어갈 후보 버킷을 계산하는 값"
    - id: bucket
      kind: "후보 영역"
      name: "Hash Bucket"
      description: "같은 해시 후보가 모이는 저장 영역"
    - id: equals
      kind: "최종 비교"
      name: "equals()"
      description: "논리적으로 같은 객체인지 확인하는 비교"
  steps:
    - title: "1. 해시 계산"
      from: "User Object"
      to: "hashCode()"
      route_label: "입력 객체의 hashCode를 계산해 후보 버킷을 찾는다."
      active_actors: [object, hash]
      description: "해시값은 탐색 범위를 좁히는 기준이지 동등성의 최종 증거는 아니다."
      payload: ["hashCode", "bucket index", "candidate"]
      outcomes:
        - status: info
          text: "서로 다른 객체도 같은 해시값을 가질 수 있다."
    - title: "2. 버킷 진입"
      from: "hashCode()"
      to: "Hash Bucket"
      route_label: "계산된 해시 위치의 후보 요소만 비교 대상으로 좁힌다."
      active_actors: [hash, bucket]
      description: "해시 테이블은 전체 요소를 모두 비교하지 않도록 후보를 줄인다."
      payload: ["bucket", "collision", "candidate set"]
      outcomes:
        - status: info
          text: "충돌이 있어도 다음 equals 단계로 판단할 수 있다."
    - title: "3. 논리적 동등성"
      from: "Hash Bucket"
      to: "equals()"
      route_label: "후보 객체와 equals를 호출해 논리적으로 같은지 확인한다."
      active_actors: [bucket, equals, object]
      description: "equals가 true인 두 객체는 같은 hashCode를 반환해야 계약이 유지된다."
      payload: ["equals", "same identity by rule", "duplicate"]
      outcomes:
        - status: reject
          text: "equals와 hashCode 계약을 어기면 Set의 중복 판단이 깨질 수 있다."

generic_pecs:
  eyebrow: "Interactive comparison"
  title: "Generic Wildcard와 PECS"
  summary: "extends는 생산자에서 안전하게 읽는 방향이고 super는 소비자에 값을 넣는 방향을 표현한다."
  actors:
    - id: producer
      kind: "상한 타입"
      name: "? extends T"
      description: "T의 하위 타입을 생산하는 컬렉션"
    - id: consumer
      kind: "하한 타입"
      name: "? super T"
      description: "T 또는 상위 타입을 소비하는 컬렉션"
    - id: read
      kind: "읽기"
      name: "Read as T"
      description: "상한을 알고 읽을 수 있는 방향"
    - id: write
      kind: "쓰기"
      name: "Write T"
      description: "하한이 보장되어 넣을 수 있는 방향"
  steps:
    - title: "1. extends 생산자"
      from: "? extends T"
      to: "Read as T"
      route_label: "T의 하위 타입을 담은 컬렉션에서 값을 T로 읽는다."
      active_actors: [producer, read]
      description: "정확한 실제 하위 타입은 몰라도 T라는 상한은 보장된다."
      payload: ["Producer", "? extends T", "get"]
      outcomes:
        - status: allow
          text: "값을 읽는 용도에 적합하다."
    - title: "2. extends 쓰기 제한"
      from: "Read as T"
      to: "? extends T"
      route_label: "어떤 구체 하위 타입인지 모르므로 임의의 T 값을 넣기 어렵다."
      active_actors: [producer, read]
      description: "하위 타입 전용 컬렉션일 수 있어 안전한 추가 타입을 확정할 수 없다."
      payload: ["unknown subtype", "add 제한", "type safety"]
      outcomes:
        - status: warning
          text: "extends를 읽기와 쓰기 모두 가능하다고 외우지 않는다."
    - title: "3. super 소비자"
      from: "? super T"
      to: "Write T"
      route_label: "T 또는 T의 상위 타입 컬렉션에는 T 값을 안전하게 넣을 수 있다."
      active_actors: [consumer, write]
      description: "실제 타입이 T의 부모여도 T는 그 안에 들어갈 수 있다."
      payload: ["Consumer", "? super T", "add(T)"]
      outcomes:
        - status: allow
          text: "값을 소비하는 메서드의 매개변수에 적합하다."
    - title: "4. PECS 적용"
      from: "Producer / Consumer"
      to: "Read as T"
      route_label: "데이터를 꺼내는 쪽은 extends, 넣는 쪽은 super를 후보로 삼는다."
      active_actors: [producer, consumer, read, write]
      description: "PECS는 암기보다 컴파일러가 확정할 수 있는 타입 범위를 묻는 규칙이다."
      payload: ["Producer Extends", "Consumer Super", "generic API"]
      outcomes:
        - status: info
          text: "실제 API의 반환·입력 역할에 맞춰 wildcard를 선택한다."

string_pool:
  eyebrow: "Interactive flow"
  title: "String Pool과 new String"
  summary: "문자열 리터럴은 String Pool의 객체를 공유할 수 있지만 new String은 별도 객체를 만든다."
  actors:
    - id: literal
      kind: "리터럴"
      name: '"hello"'
      description: "String Pool에 intern되는 문자열 리터럴"
    - id: pool
      kind: "공유 영역"
      name: "String Pool"
      description: "같은 리터럴 객체를 재사용하는 풀"
    - id: reference
      kind: "참조 변수"
      name: "a · b · c"
      description: "문자열 객체를 가리키는 변수들"
    - id: fresh
      kind: "새 객체"
      name: "new String()"
      description: "내용은 같지만 별도로 생성된 객체"
  steps:
    - title: "1. 리터럴 조회"
      from: '"hello"'
      to: "String Pool"
      route_label: "문자열 리터럴은 Pool에서 같은 내용의 객체를 재사용할 수 있다."
      active_actors: [literal, pool]
      description: "리터럴 표현과 객체 생성 표현은 같은 참조 동작을 보장하지 않는다."
      payload: ["literal", "intern", "shared object"]
      outcomes:
        - status: info
          text: "내용이 같다는 사실과 참조가 같다는 사실은 분리해서 확인한다."
    - title: "2. a와 b 공유"
      from: "String Pool"
      to: "a · b · c"
      route_label: "같은 리터럴을 사용한 a와 b가 Pool의 동일 객체를 가리킬 수 있다."
      active_actors: [pool, reference]
      description: "참조 동일성은 리터럴 풀링 규칙과 연결된다."
      payload: ["a", "b", "same reference"]
      outcomes:
        - status: allow
          text: "a == b가 true가 될 수 있는 구조다."
    - title: "3. c는 별도 객체"
      from: "new String()"
      to: "a · b · c"
      route_label: "new String(\"hello\")는 같은 내용을 가진 새 객체를 만든다."
      active_actors: [fresh, reference]
      description: "c의 문자열 내용은 같아도 Pool 객체와 참조는 다를 수 있다."
      payload: ["c", "new", "different reference"]
      outcomes:
        - status: warning
          text: "문자열 내용 비교에는 equals를 사용한다."

string_immutable_assignment:
  eyebrow: "Interactive flow"
  title: "String 불변성과 재대입"
  summary: "문자열 연산은 기존 객체를 바꾸지 않고 새로운 결과 객체를 만들어 변수의 참조를 바꾼다."
  actors:
    - id: variable
      kind: "변수"
      name: "value"
      description: "현재 문자열 객체를 가리키는 참조 변수"
    - id: old
      kind: "기존 객체"
      name: '"hello"'
      description: "연산 전부터 존재하는 불변 String 객체"
    - id: operation
      kind: "연산"
      name: 'value + " world"'
      description: "새로운 문자열 내용을 계산하는 표현"
    - id: fresh
      kind: "새 객체"
      name: '"hello world"'
      description: "연산 결과로 만들어진 String 객체"
  steps:
    - title: "1. 기존 참조"
      from: "value"
      to: '"hello"'
      route_label: "value가 기존 hello 객체를 가리킨다."
      active_actors: [variable, old]
      description: "String 객체의 내부 문자를 직접 바꾸는 것이 아니라 참조 관계를 관찰한다."
      payload: ["value", "hello", "reference"]
      outcomes:
        - status: info
          text: "현재 객체는 연산 전후에도 내용이 바뀌지 않는다."
    - title: "2. 새 내용 계산"
      from: 'value + " world"'
      to: '"hello world"'
      route_label: "문자열 결합 결과로 새로운 String 객체가 만들어진다."
      active_actors: [operation, fresh, old]
      description: "불변성 때문에 기존 hello 객체를 수정하는 대신 결과 객체를 생성한다."
      payload: ["concat", "new object", "hello world"]
      outcomes:
        - status: allow
          text: "기존 문자열 객체의 상태는 유지된다."
    - title: "3. 참조 재대입"
      from: "value"
      to: '"hello world"'
      route_label: "value가 새 결과 객체를 가리키도록 참조를 재대입한다."
      active_actors: [variable, fresh]
      description: "겉으로 값이 바뀐 것처럼 보이지만 실제로는 변수가 다른 객체를 참조하게 된 것이다."
      payload: ["assignment", "new reference", "old object remains"]
      outcomes:
        - status: info
          text: "String 불변성과 변수 재대입을 하나의 개념으로 혼동하지 않는다."

defensive_copy:
  eyebrow: "Interactive comparison"
  title: "컬렉션 참조 공유와 방어적 복사"
  summary: "생성자와 getter에서 같은 컬렉션 참조를 공유하면 외부 변경이 객체 내부 상태를 바꿀 수 있다."
  actors:
    - id: caller
      kind: "외부 코드"
      name: "Caller List"
      description: "객체 생성자에 전달하거나 getter 결과를 받는 컬렉션"
    - id: user
      kind: "도메인 객체"
      name: "User.roles"
      description: "사용자 내부 역할 목록"
    - id: shared
      kind: "공유 참조"
      name: "Same List Object"
      description: "외부와 내부가 함께 가리키는 가변 컬렉션"
    - id: copy
      kind: "경계 보호"
      name: "Defensive Copy"
      description: "복사·불변 뷰로 외부 변경을 차단하는 경계"
  steps:
    - title: "1. 같은 List 전달"
      from: "Caller List"
      to: "User.roles"
      route_label: "생성자가 전달받은 List를 그대로 roles 필드에 저장한다."
      active_actors: [caller, user, shared]
      description: "caller와 User가 같은 컬렉션 객체를 가리키면 한쪽 변경이 다른 쪽에 보인다."
      payload: ["constructor", "roles", "same reference"]
      outcomes:
        - status: warning
          text: "객체 생성 뒤에도 외부가 내부 상태를 바꿀 수 있다."
    - title: "2. 외부 변경 전파"
      from: "Caller List"
      to: "User.roles"
      route_label: "caller가 roles에 ADMIN을 추가하면 User 내부 목록에도 즉시 반영된다."
      active_actors: [caller, shared, user]
      description: "참조 공유는 메서드를 호출하지 않아도 상태가 바뀌는 경계를 만든다."
      payload: ["add ADMIN", "mutation", "unexpected state"]
      outcomes:
        - status: reject
          text: "불변 객체 설계의 캡슐화 경계가 무너진다."
    - title: "3. 방어적 복사"
      from: "Caller List"
      to: "Defensive Copy"
      route_label: "생성 시 복사하고 getter에서는 수정할 수 없는 값이나 복사본을 반환한다."
      active_actors: [caller, copy, user]
      description: "내부 컬렉션과 외부 컬렉션의 객체 identity를 분리한다."
      payload: ["List.copyOf", "copy", "unmodifiable view"]
      outcomes:
        - status: allow
          text: "외부 변경이 내부 상태로 전파되지 않는다."

identity_equality:
  eyebrow: "Interactive comparison"
  title: "참조 동일성과 논리적 동등성"
  summary: "==는 같은 객체를 가리키는지 보고 equals는 도메인 규칙상 같은 값인지 판단한다."
  actors:
    - id: a
      kind: "객체 A"
      name: "User A"
      description: "비슷한 상태를 가진 첫 번째 객체"
    - id: b
      kind: "객체 B"
      name: "User B"
      description: "별도로 생성됐지만 같은 ID를 가질 수 있는 객체"
    - id: identity
      kind: "참조 비교"
      name: "=="
      description: "두 참조가 같은 객체를 가리키는지 비교"
    - id: logical
      kind: "값 비교"
      name: "equals()"
      description: "개발자가 정의한 논리적 동등성 비교"
  steps:
    - title: "1. 객체 참조 준비"
      from: "User A"
      to: "User B"
      route_label: "내용이 비슷한 두 객체라도 별도로 new하면 참조는 다를 수 있다."
      active_actors: [a, b]
      description: "객체의 상태와 메모리 identity를 같은 질문으로 취급하지 않는다."
      payload: ["id = 1", "same name", "different object"]
      outcomes:
        - status: info
          text: "값이 같아 보여도 == 결과는 false일 수 있다."
    - title: "2. == 비교"
      from: "User A"
      to: "=="
      route_label: "두 변수의 참조가 같은 객체를 가리키는지 비교한다."
      active_actors: [a, b, identity]
      description: "==는 객체의 필드 값을 해석하지 않고 참조 동일성만 확인한다."
      payload: ["a == b", "reference", "identity"]
      outcomes:
        - status: reject
          text: "논리적 사용자 동일성을 표현하는 비교로는 부족할 수 있다."
    - title: "3. equals 비교"
      from: "User A"
      to: "equals()"
      route_label: "User가 정의한 equals 규칙에 따라 ID나 상태를 비교한다."
      active_actors: [a, b, logical]
      description: "도메인이 같은 사용자라고 보는 기준을 equals에 일관되게 구현해야 한다."
      payload: ["a.equals(b)", "business key", "logical equality"]
      outcomes:
        - status: allow
          text: "참조가 달라도 논리적 동등성을 true로 표현할 수 있다."

hashset_lookup:
  eyebrow: "Interactive flow"
  title: "HashSet 조회의 해시와 동등성"
  summary: "HashSet은 먼저 hashCode로 버킷을 좁히고 같은 버킷 후보에 equals를 적용한다."
  actors:
    - id: query
      kind: "조회 객체"
      name: "Target User"
      description: "contains 또는 add를 수행할 객체"
    - id: hash
      kind: "해시 단계"
      name: "hashCode()"
      description: "버킷 위치를 계산하는 단계"
    - id: bucket
      kind: "후보 버킷"
      name: "Bucket"
      description: "같은 위치에 모인 후보 객체들"
    - id: equals
      kind: "동등성 단계"
      name: "equals()"
      description: "최종 동일 여부를 판정하는 단계"
  steps:
    - title: "1. 해시 위치 계산"
      from: "Target User"
      to: "hashCode()"
      route_label: "조회 객체의 hashCode로 찾아갈 버킷 위치를 계산한다."
      active_actors: [query, hash]
      description: "해시는 빠른 후보 선택을 위한 1차 필터다."
      payload: ["hash", "index", "contains"]
      outcomes:
        - status: info
          text: "해시가 다르면 같은 버킷에서 비교할 필요가 줄어든다."
    - title: "2. 후보 확인"
      from: "hashCode()"
      to: "Bucket"
      route_label: "계산한 위치의 버킷에서 후보 객체를 읽는다."
      active_actors: [hash, bucket]
      description: "해시 충돌이 있으면 한 버킷에 여러 후보가 남을 수 있다."
      payload: ["bucket", "collision", "candidate list"]
      outcomes:
        - status: info
          text: "후보가 있다는 사실이 곧 논리적 동등성을 뜻하지 않는다."
    - title: "3. equals 최종 판정"
      from: "Bucket"
      to: "equals()"
      route_label: "후보마다 equals를 적용해 같은 사용자 여부를 최종 확인한다."
      active_actors: [bucket, equals, query]
      description: "hashCode와 equals 계약이 함께 맞아야 HashSet의 조회·중복 제거가 올바르게 동작한다."
      payload: ["equals", "match", "duplicate check"]
      outcomes:
        - status: allow
          text: "해시 탐색과 논리 비교는 서로 다른 단계다."

payment_contract:
  eyebrow: "Interactive flow"
  title: "PaymentService 인터페이스 계약"
  summary: "PaymentController는 구현체가 아니라 PaymentService 계약에 의존하고 구현체가 그 계약을 제공한다."
  actors:
    - id: controller
      kind: "호출부"
      name: "PaymentController"
      description: "결제 기능을 요청하는 웹 계층"
    - id: contract
      kind: "계약"
      name: "PaymentService"
      description: "pay() 같은 결제 기능의 인터페이스"
    - id: card
      kind: "구현체"
      name: "CardPaymentService"
      description: "카드 결제를 구현하는 클래스"
    - id: other
      kind: "대체 구현"
      name: "Other Payment Service"
      description: "계약을 구현하는 다른 결제 방식"
  steps:
    - title: "1. Controller 의존"
      from: "PaymentController"
      to: "PaymentService"
      route_label: "Controller가 구체 클래스가 아니라 PaymentService 계약을 주입받는다."
      active_actors: [controller, contract]
      description: "호출부는 결제 기능의 사용법만 알고 구현 세부 내용은 알지 않는다."
      payload: ["constructor injection", "pay()", "interface"]
      outcomes:
        - status: allow
          text: "구현체 변경이 Controller까지 퍼지는 것을 줄인다."
    - title: "2. 카드 구현"
      from: "PaymentService"
      to: "CardPaymentService"
      route_label: "CardPaymentService가 PaymentService의 계약을 구현한다."
      active_actors: [contract, card]
      description: "실제 객체의 pay() 구현은 런타임 다형성으로 선택된다."
      payload: ["implements", "pay()", "card gateway"]
      outcomes:
        - status: info
          text: "변수 타입과 실제 객체 타입은 다를 수 있다."
    - title: "3. 대체 구현 교체"
      from: "PaymentService"
      to: "Other Payment Service"
      route_label: "같은 계약을 구현한 다른 결제 서비스를 구성에서 선택할 수 있다."
      active_actors: [contract, other, controller]
      description: "호출부가 계약만 사용하면 구현체 교체 시 수정 범위가 좁아진다."
      payload: ["mock", "bank payment", "implementation swap"]
      outcomes:
        - status: allow
          text: "테스트 대역과 운영 구현을 같은 계약으로 연결할 수 있다."

interface_vs_abstract:
  eyebrow: "Interactive comparison"
  title: "인터페이스와 추상 클래스의 책임"
  summary: "인터페이스는 무엇을 제공하는지 계약하고 추상 클래스는 같은 계열 구현체의 상태와 공통 행동을 공유한다."
  actors:
    - id: contract
      kind: "계약"
      name: "Interface"
      description: "외부에 제공할 메서드와 역할"
    - id: abstract
      kind: "공통 기반"
      name: "Abstract Class"
      description: "공통 상태와 구현을 공유하는 부모 클래스"
    - id: implementation
      kind: "구현체"
      name: "Concrete Service"
      description: "계약을 구현하고 필요하면 공통 기반을 상속하는 클래스"
    - id: composition
      kind: "대안"
      name: "Composition"
      description: "상속 대신 필요한 객체를 내부에 두고 위임하는 구조"
  steps:
    - title: "1. 계약 표현"
      from: "Interface"
      to: "Concrete Service"
      route_label: "인터페이스가 외부에 제공할 기능의 이름과 계약을 정의한다."
      active_actors: [contract, implementation]
      description: "구현체가 달라도 호출부는 같은 계약을 사용할 수 있다."
      payload: ["what", "method contract", "polymorphism"]
      outcomes:
        - status: allow
          text: "역할과 구현을 분리한다."
    - title: "2. 공통 상태 공유"
      from: "Abstract Class"
      to: "Concrete Service"
      route_label: "추상 클래스가 같은 계열 서비스의 필드와 검증·공통 행동을 제공한다."
      active_actors: [abstract, implementation]
      description: "상속받은 구현체가 공통 상태와 알고리즘 일부를 재사용한다."
      payload: ["shared state", "template behavior", "IS-A"]
      outcomes:
        - status: info
          text: "단순 코드 중복만으로 상속 관계를 만들지는 않는다."
    - title: "3. 상속 관계 점검"
      from: "Concrete Service"
      to: "Composition"
      route_label: "IS-A가 자연스럽지 않으면 인터페이스나 Composition을 검토한다."
      active_actors: [implementation, composition]
      description: "재사용이 필요해도 부모의 상태·생성자 규칙까지 떠안는 비용을 비교한다."
      payload: ["IS-A", "delegation", "coupling"]
      outcomes:
        - status: warning
          text: "상속은 기능 재사용보다 의미 있는 관계가 먼저다."

combined_payment_design:
  eyebrow: "Interactive flow"
  title: "인터페이스와 추상 클래스를 함께 쓰는 결제 구조"
  summary: "외부에는 PaymentService 계약을 제공하고 내부에서는 BasePaymentService로 공통 상태와 행동을 공유한다."
  actors:
    - id: controller
      kind: "호출부"
      name: "PaymentController"
      description: "결제 계약만 사용하는 웹 계층"
    - id: contract
      kind: "외부 계약"
      name: "PaymentService"
      description: "결제 기능을 노출하는 인터페이스"
    - id: base
      kind: "공통 기반"
      name: "BasePaymentService"
      description: "공통 검증·상태·행동을 가진 추상 클래스"
    - id: card
      kind: "구현체"
      name: "CardPaymentService"
      description: "카드 결제만의 세부 처리를 구현하는 클래스"
  steps:
    - title: "1. Controller 계약 사용"
      from: "PaymentController"
      to: "PaymentService"
      route_label: "Controller는 PaymentService만 알고 결제 구현체의 계층은 모른다."
      active_actors: [controller, contract]
      description: "호출부에 외부 기능의 계약만 노출한다."
      payload: ["PaymentService", "pay()", "dependency injection"]
      outcomes:
        - status: allow
          text: "구현체 교체가 호출부에 영향을 덜 준다."
    - title: "2. 공통 기반 상속"
      from: "PaymentService"
      to: "BasePaymentService"
      route_label: "공통 결제 검증과 상태는 BasePaymentService에 모은다."
      active_actors: [contract, base]
      description: "인터페이스 계약과 내부 재사용 기반은 서로 다른 책임으로 함께 존재할 수 있다."
      payload: ["validation", "shared state", "abstract"]
      outcomes:
        - status: info
          text: "외부 API와 내부 구현 재사용을 한 계층으로 합치지 않는다."
    - title: "3. 카드 세부 구현"
      from: "BasePaymentService"
      to: "CardPaymentService"
      route_label: "CardPaymentService가 공통 흐름을 재사용하고 카드 결제 단계만 구현한다."
      active_actors: [base, card]
      description: "공통 로직은 부모에 두되 구체 결제 방식의 변화를 자식이 담당한다."
      payload: ["extends", "card gateway", "override"]
      outcomes:
        - status: allow
          text: "계약·공통 기반·세부 구현의 책임이 분리된다."
    - title: "4. 런타임 연결"
      from: "CardPaymentService"
      to: "PaymentController"
      route_label: "컨테이너가 CardPaymentService를 PaymentService 타입으로 주입한다."
      active_actors: [card, contract, controller]
      description: "호출부는 실제 연결된 구현체를 몰라도 계약에 따라 결제를 호출한다."
      payload: ["bean wiring", "polymorphism", "runtime implementation"]
      outcomes:
        - status: info
          text: "인터페이스와 추상 클래스는 경쟁 도구가 아니라 다른 책임을 맡는다."

session_local_failure:
  eyebrow: "Interactive flow"
  title: "다중 서버의 로컬 세션 문제"
  summary: "서버별 메모리에 세션을 저장하면 다음 요청이 다른 서버로 갔을 때 로그인 상태를 찾지 못할 수 있다."
  actors:
    - id: client
      kind: "클라이언트"
      name: "Browser"
      description: "세션 ID 쿠키를 보내는 브라우저"
    - id: lb
      kind: "분산 장치"
      name: "Load Balancer"
      description: "요청을 여러 EC2 인스턴스로 분산하는 장치"
    - id: a
      kind: "서버 A"
      name: "EC2-A Session"
      description: "A의 로컬 메모리에만 저장된 세션"
    - id: b
      kind: "서버 B"
      name: "EC2-B Session"
      description: "A의 세션을 모르는 다른 서버"
  steps:
    - title: "1. 로그인 처리"
      from: "Browser"
      to: "EC2-A Session"
      route_label: "첫 로그인 요청이 EC2-A로 가고 세션이 A의 로컬 메모리에 저장된다."
      active_actors: [client, a, lb]
      description: "브라우저는 세션 ID를 받지만 세션 데이터는 A 프로세스 안에만 있다."
      payload: ["login", "session id", "local memory"]
      outcomes:
        - status: allow
          text: "같은 서버로 계속 가면 로컬 세션이 동작한다."
    - title: "2. 다음 요청 분산"
      from: "Browser"
      to: "EC2-B Session"
      route_label: "다음 요청이 로드 밸런서를 통해 EC2-B로 전달된다."
      active_actors: [client, lb, b]
      description: "B의 로컬 메모리에는 A가 만든 세션 데이터가 없다."
      payload: ["session cookie", "request", "different instance"]
      outcomes:
        - status: warning
          text: "서버가 로그인 상태를 찾지 못해 인증 실패처럼 보일 수 있다."
    - title: "3. 공유 상태로 이동"
      from: "EC2-A Session"
      to: "EC2-B Session"
      route_label: "세션을 공용 저장소에 두거나 요청 고정 전략을 선택한다."
      active_actors: [a, b, lb]
      description: "여러 서버가 같은 인증 상태를 보려면 상태 위치와 라우팅 정책을 함께 설계해야 한다."
      payload: ["shared store", "sticky session", "scaling"]
      outcomes:
        - status: info
          text: "서버 수를 늘리는 것과 세션 상태를 공유하는 것은 별도 문제다."

redis_session_sharing:
  eyebrow: "Interactive flow"
  title: "Redis 공유 세션 저장소"
  summary: "여러 애플리케이션 서버가 같은 Redis 세션 저장소를 참조하면 요청이 어느 서버로 가도 상태를 조회할 수 있다."
  actors:
    - id: client
      kind: "클라이언트"
      name: "Browser"
      description: "세션 ID 쿠키를 전송하는 브라우저"
    - id: servers
      kind: "애플리케이션 계층"
      name: "EC2-A · B · C"
      description: "요청을 나누어 처리하는 여러 서버"
    - id: redis
      kind: "공유 저장소"
      name: "Redis Session Store"
      description: "서버들이 함께 읽고 쓰는 세션 데이터 저장소"
    - id: response
      kind: "인증 결과"
      name: "Authenticated Request"
      description: "세션 조회 후 처리되는 요청"
  steps:
    - title: "1. 요청 분산"
      from: "Browser"
      to: "EC2-A · B · C"
      route_label: "로드 밸런서가 브라우저 요청을 여러 애플리케이션 서버에 전달한다."
      active_actors: [client, servers]
      description: "특정 서버의 로컬 메모리에 의존하지 않는 구조를 준비한다."
      payload: ["session cookie", "load balancing", "request"]
      outcomes:
        - status: info
          text: "같은 사용자의 요청이 매번 다른 서버에 도착할 수 있다."
    - title: "2. 공용 세션 조회"
      from: "EC2-A · B · C"
      to: "Redis Session Store"
      route_label: "어느 서버든 쿠키의 세션 ID로 Redis에서 인증 상태를 조회한다."
      active_actors: [servers, redis, client]
      description: "세션 상태의 기준이 특정 JVM이 아니라 공용 저장소로 이동한다."
      payload: ["session id", "GET session", "shared state"]
      outcomes:
        - status: allow
          text: "서버가 달라도 같은 세션 데이터를 확인할 수 있다."
    - title: "3. 요청 처리"
      from: "Redis Session Store"
      to: "Authenticated Request"
      route_label: "조회한 사용자 상태로 권한을 확인하고 요청을 처리한다."
      active_actors: [redis, servers, response]
      description: "공유 저장소도 네트워크 지연·장애·만료 정책을 함께 운영해야 한다."
      payload: ["user context", "TTL", "response"]
      outcomes:
        - status: info
          text: "세션 공유가 인증·인가 정책 전체를 자동으로 해결하는 것은 아니다."

basic_vs_session:
  eyebrow: "Interactive comparison"
  title: "Basic Auth와 세션 인증의 요청 흐름"
  summary: "Basic Auth는 매 요청 자격 증명을 보내고 세션 인증은 로그인 후 세션 ID로 서버 상태를 조회한다."
  actors:
    - id: client
      kind: "클라이언트"
      name: "Browser"
      description: "인증 요청을 보내는 브라우저"
    - id: basic
      kind: "무상태 인증"
      name: "Basic Auth"
      description: "매 요청 Authorization 헤더에 자격 증명을 담는 방식"
    - id: session
      kind: "상태 기반 인증"
      name: "Session Auth"
      description: "로그인 후 세션 ID 쿠키를 보내는 방식"
    - id: store
      kind: "서버 상태"
      name: "Session Store"
      description: "세션 ID와 사용자 상태를 저장하는 서버 측 저장소"
  steps:
    - title: "1. Basic 자격 증명"
      from: "Browser"
      to: "Basic Auth"
      route_label: "브라우저가 매 요청에 아이디와 비밀번호를 Authorization 헤더로 보낸다."
      active_actors: [client, basic]
      description: "서버가 세션 상태를 저장하지 않아도 요청마다 자격 증명을 검증할 수 있다."
      payload: ["Authorization", "username", "password"]
      outcomes:
        - status: warning
          text: "전송 보호와 자격 증명 노출 범위를 별도로 관리해야 한다."
    - title: "2. 세션 로그인"
      from: "Browser"
      to: "Session Auth"
      route_label: "최초 로그인 후 서버가 세션을 만들고 세션 ID 쿠키를 발급한다."
      active_actors: [client, session, store]
      description: "이후 요청은 비밀번호 대신 세션 ID를 전송한다."
      payload: ["login once", "Set-Cookie", "session id"]
      outcomes:
        - status: allow
          text: "서버가 인증 상태를 세션 저장소에서 관리한다."
    - title: "3. 세션 조회"
      from: "Session Auth"
      to: "Session Store"
      route_label: "서버가 쿠키의 세션 ID로 사용자 상태를 조회하고 요청을 처리한다."
      active_actors: [session, store, client]
      description: "세션 방식은 서버 상태를 관리하므로 여러 서버 배치에서 저장소 전략이 중요해진다."
      payload: ["Cookie", "lookup", "user state"]
      outcomes:
        - status: info
          text: "두 방식은 인증 상태를 어디에 둘지의 선택 문제다."

shared_session_store:
  eyebrow: "Interactive flow"
  title: "로드 밸런서와 공용 Redis 세션"
  summary: "여러 애플리케이션 서버가 로컬 세션 대신 공용 Redis를 참조해 같은 로그인 상태를 공유한다."
  actors:
    - id: lb
      kind: "분산"
      name: "Load Balancer"
      description: "들어온 요청을 서버 중 하나로 전달"
    - id: apps
      kind: "서버 묶음"
      name: "Application Servers"
      description: "서로 다른 인스턴스로 실행되는 서버들"
    - id: redis
      kind: "상태 저장소"
      name: "Shared Redis"
      description: "세션을 중앙에서 관리하는 저장소"
    - id: user
      kind: "사용자 상태"
      name: "Authenticated User"
      description: "세션 조회로 복원되는 사용자 정보"
  steps:
    - title: "1. 요청 분배"
      from: "Load Balancer"
      to: "Application Servers"
      route_label: "로드 밸런서가 요청을 서버 A·B·C 중 하나로 보낸다."
      active_actors: [lb, apps]
      description: "서버 선택이 바뀌어도 인증 상태를 잃지 않는 것이 목표다."
      payload: ["request", "server A/B/C", "distribution"]
      outcomes:
        - status: info
          text: "스티키 세션 없이도 공용 상태를 사용할 수 있다."
    - title: "2. Redis 조회"
      from: "Application Servers"
      to: "Shared Redis"
      route_label: "선택된 서버가 세션 ID로 공용 Redis를 조회한다."
      active_actors: [apps, redis]
      description: "인증 상태를 특정 서버의 로컬 메모리에서 분리한다."
      payload: ["session id", "GET", "TTL"]
      outcomes:
        - status: allow
          text: "어느 서버가 처리해도 같은 세션 데이터에 접근한다."
    - title: "3. 사용자 복원"
      from: "Shared Redis"
      to: "Authenticated User"
      route_label: "Redis 결과로 현재 요청의 사용자·권한 정보를 복원한다."
      active_actors: [redis, user, apps]
      description: "저장소 장애나 만료 시 인증 실패 처리를 별도로 정의해야 한다."
      payload: ["principal", "roles", "request context"]
      outcomes:
        - status: info
          text: "세션 저장소는 확장성과 함께 가용성 설계 대상이 된다."

deployment_runtime:
  eyebrow: "Interactive flow"
  title: "배포 성공과 런타임 실패의 경계"
  summary: "CI/CD가 서버에 아티팩트를 배포하는 데 성공해도 애플리케이션 시작·설정·의존성 단계에서 실패할 수 있다."
  actors:
    - id: pipeline
      kind: "배포 자동화"
      name: "GitHub Actions"
      description: "빌드와 배포 작업을 실행하는 파이프라인"
    - id: artifact
      kind: "배포 결과"
      name: "Artifact on Server"
      description: "서버에 업로드된 JAR 또는 이미지"
    - id: runtime
      kind: "실행 단계"
      name: "Application Runtime"
      description: "프로세스 시작과 의존성 로딩 단계"
    - id: health
      kind: "서비스 상태"
      name: "Health Check"
      description: "실제 요청 가능 여부를 확인하는 검증"
  steps:
    - title: "1. 빌드 성공"
      from: "GitHub Actions"
      to: "Artifact on Server"
      route_label: "파이프라인이 코드를 빌드하고 아티팩트를 서버에 배포한다."
      active_actors: [pipeline, artifact]
      description: "배포 작업의 성공은 파일 전달과 명령 실행 성공을 의미할 수 있다."
      payload: ["build", "upload", "deploy"]
      outcomes:
        - status: info
          text: "배포 성공 배지가 애플리케이션 정상 동작을 보장하지는 않는다."
    - title: "2. 런타임 시작"
      from: "Artifact on Server"
      to: "Application Runtime"
      route_label: "서버가 JAR·컨테이너를 실행하고 환경 설정과 의존성을 로드한다."
      active_actors: [artifact, runtime]
      description: "잘못된 설정, 포트, 권한, DB 연결은 배포 이후 시작 단계에서 드러날 수 있다."
      payload: ["start", "environment", "dependency"]
      outcomes:
        - status: warning
          text: "프로세스가 즉시 종료되거나 시작은 되어도 기능이 실패할 수 있다."
    - title: "3. 실제 상태 확인"
      from: "Application Runtime"
      to: "Health Check"
      route_label: "로그·헬스 체크·실제 요청으로 서비스가 정상 응답하는지 확인한다."
      active_actors: [runtime, health]
      description: "배포 결과와 운영 중인 애플리케이션 상태를 별도 단계로 검증한다."
      payload: ["startup log", "health endpoint", "smoke test"]
      outcomes:
        - status: allow
          text: "배포 성공과 서비스 준비 완료를 구분해서 기록한다."

code_config_mismatch:
  eyebrow: "Interactive comparison"
  title: "애플리케이션 코드와 Parameter Store 설정"
  summary: "코드가 기대하는 키·타입·환경과 실제 Parameter Store 값이 맞지 않으면 런타임에서 실패한다."
  actors:
    - id: code
      kind: "기대 계약"
      name: "Application Code"
      description: "환경 변수와 설정 키를 읽는 코드"
    - id: parameter
      kind: "외부 설정"
      name: "Parameter Store"
      description: "배포 환경별 값을 제공하는 설정 저장소"
    - id: binding
      kind: "바인딩"
      name: "Config Binding"
      description: "문자열 설정을 애플리케이션 타입으로 연결하는 과정"
    - id: runtime
      kind: "실행 결과"
      name: "Runtime"
      description: "정상 시작 또는 설정 오류로 실패하는 애플리케이션"
  steps:
    - title: "1. 코드 키 정의"
      from: "Application Code"
      to: "Config Binding"
      route_label: "코드가 필요한 키 이름과 타입, 필수 여부를 정의한다."
      active_actors: [code, binding]
      description: "코드가 기대하는 설정 계약을 배포 환경과 맞춰야 한다."
      payload: ["key", "type", "required"]
      outcomes:
        - status: info
          text: "환경별 값이 있어도 키 이름이 다르면 연결되지 않는다."
    - title: "2. 외부 값 조회"
      from: "Parameter Store"
      to: "Config Binding"
      route_label: "런타임이 Parameter Store에서 실제 환경의 값을 가져온다."
      active_actors: [parameter, binding]
      description: "권한·리전·경로와 값의 형식을 함께 확인해야 한다."
      payload: ["parameter path", "IAM", "environment value"]
      outcomes:
        - status: warning
          text: "설정 조회 권한이나 경로가 틀리면 코드까지 값이 도달하지 않는다."
    - title: "3. 일치 여부 확인"
      from: "Config Binding"
      to: "Application Code"
      route_label: "키·타입·필수값이 일치하면 애플리케이션 설정으로 바인딩한다."
      active_actors: [binding, code, parameter]
      description: "코드와 외부 설정의 계약이 어긋나면 시작 오류나 기능 오류가 발생한다."
      payload: ["name match", "type conversion", "value"]
      outcomes:
        - status: reject
          text: "배포 성공과 설정 계약 성공은 별도로 검증해야 한다."

cloudwatch_alarm:
  eyebrow: "Interactive flow"
  title: "CloudWatch 알람 원인 추적"
  summary: "알람 발생 시 지표·로그·배포 이력을 같은 시간 범위에 놓고 원인 후보를 좁힌다."
  actors:
    - id: alarm
      kind: "신호"
      name: "CloudWatch Alarm"
      description: "임계치를 넘은 메트릭 알람"
    - id: metric
      kind: "수치"
      name: "Metrics"
      description: "CPU·지연·오류율 같은 시간 series"
    - id: logs
      kind: "상세 사실"
      name: "Application Logs"
      description: "요청·예외·배포 이후의 상세 기록"
    - id: cause
      kind: "원인 후보"
      name: "Root Cause"
      description: "상관관계를 검증해 좁힌 원인"
  steps:
    - title: "1. 알람 발생"
      from: "Metrics"
      to: "CloudWatch Alarm"
      route_label: "메트릭이 설정한 임계치를 넘어 알람이 발생한다."
      active_actors: [metric, alarm]
      description: "알람은 이상 신호이지 원인을 직접 알려주는 진단 결과는 아니다."
      payload: ["threshold", "period", "breach"]
      outcomes:
        - status: warning
          text: "알람 메시지 하나만으로 원인을 단정하지 않는다."
    - title: "2. 시간 범위 맞추기"
      from: "CloudWatch Alarm"
      to: "Application Logs"
      route_label: "같은 시작·종료 시각의 로그에서 오류와 요청 변화를 확인한다."
      active_actors: [alarm, logs, metric]
      description: "메트릭 그래프와 로그의 시간축을 맞춰 실제 사건의 순서를 확인한다."
      payload: ["time window", "error log", "request id"]
      outcomes:
        - status: info
          text: "지연이 늘어난 시간과 오류가 기록된 시간이 다를 수 있다."
    - title: "3. 배포·외부 변화 대조"
      from: "Application Logs"
      to: "Root Cause"
      route_label: "배포 이력·설정 변경·외부 의존성 상태와 로그를 대조해 원인을 좁힌다."
      active_actors: [logs, cause, alarm]
      description: "상관관계를 원인으로 확정하기 전에 재현·추가 지표·롤백 결과를 확인한다."
      payload: ["deploy history", "config change", "dependency"]
      outcomes:
        - status: allow
          text: "알람은 조사 시작점이고 원인은 여러 증거를 연결해 확정한다."

metric_log_deploy:
  eyebrow: "Interactive comparison"
  title: "Metric·로그·배포 이력의 상관관계"
  summary: "수치 변화와 상세 로그, 변경 이력을 같은 타임라인에 겹쳐 원인 후보를 검증한다."
  actors:
    - id: metric
      kind: "수치"
      name: "Metric Timeline"
      description: "지연·오류율·처리량의 변화"
    - id: logs
      kind: "상세 기록"
      name: "Log Timeline"
      description: "예외·경고·요청의 시간순 기록"
    - id: deploy
      kind: "변경 이력"
      name: "Deploy Timeline"
      description: "배포와 설정 변경 시각"
    - id: hypothesis
      kind: "검증"
      name: "Incident Hypothesis"
      description: "세 신호를 대조해 만든 원인 가설"
  steps:
    - title: "1. 수치 이상 포착"
      from: "Metric Timeline"
      to: "Incident Hypothesis"
      route_label: "오류율이나 지연 시간이 변한 시점을 표시한다."
      active_actors: [metric, hypothesis]
      description: "메트릭은 언제 이상이 시작됐는지 알려주지만 무엇이 바뀌었는지는 말하지 않는다."
      payload: ["latency", "error rate", "timestamp"]
      outcomes:
        - status: info
          text: "변화 시작 시각을 조사 기준점으로 삼는다."
    - title: "2. 로그 대조"
      from: "Log Timeline"
      to: "Incident Hypothesis"
      route_label: "같은 시간대에 예외·경고·요청 패턴이 나타났는지 확인한다."
      active_actors: [logs, hypothesis]
      description: "로그의 상세 사실이 수치 변화와 같은 사건을 가리키는지 검증한다."
      payload: ["exception", "request path", "correlation id"]
      outcomes:
        - status: info
          text: "관련 없는 로그를 원인으로 연결하지 않도록 시간과 요청을 함께 본다."
    - title: "3. 배포 이력 대조"
      from: "Deploy Timeline"
      to: "Incident Hypothesis"
      route_label: "이상 시작 직전에 배포·설정 변경이 있었는지 확인한다."
      active_actors: [deploy, hypothesis, metric]
      description: "변경 시각과 증상 시각이 맞더라도 재현과 롤백으로 인과관계를 확인한다."
      payload: ["release", "config", "rollback"]
      outcomes:
        - status: allow
          text: "세 자료는 서로 대체하지 않고 함께 원인을 좁히는 증거가 된다."

good_bad_alarm:
  eyebrow: "Interactive comparison"
  title: "좋은 알람과 나쁜 알람"
  summary: "행동 가능한 조건과 명확한 책임이 있는 알람은 대응을 돕고 노이즈성 알람은 피로를 만든다."
  actors:
    - id: signal
      kind: "관측 신호"
      name: "Metric Signal"
      description: "서비스 상태를 나타내는 측정값"
    - id: good
      kind: "좋은 알람"
      name: "Actionable Alert"
      description: "임계치·지속 시간·담당자가 명확한 알람"
    - id: bad
      kind: "나쁜 알람"
      name: "Noisy Alert"
      description: "원인과 행동이 불명확한 반복 알람"
    - id: action
      kind: "대응"
      name: "Runbook Action"
      description: "알람 수신자가 수행할 조치"
  steps:
    - title: "1. 신호 정의"
      from: "Metric Signal"
      to: "Actionable Alert"
      route_label: "사용자 영향이나 운영 위험과 연결된 메트릭을 선택한다."
      active_actors: [signal, good]
      description: "단순히 숫자가 변했다는 이유보다 실제 대응 필요성을 기준으로 한다."
      payload: ["SLO", "error rate", "duration"]
      outcomes:
        - status: allow
          text: "측정값이 어떤 장애 위험을 의미하는지 설명할 수 있다."
    - title: "2. 행동 가능한 조건"
      from: "Actionable Alert"
      to: "Runbook Action"
      route_label: "지속 시간과 심각도를 정하고 알람 발생 시 실행할 대응을 연결한다."
      active_actors: [good, action]
      description: "좋은 알람은 수신자가 무엇을 확인하고 누구에게 알릴지 알 수 있다."
      payload: ["threshold", "for 5m", "runbook"]
      outcomes:
        - status: allow
          text: "알람이 실제 운영 행동으로 이어진다."
    - title: "3. 노이즈 제거"
      from: "Metric Signal"
      to: "Noisy Alert"
      route_label: "일시적 변화나 의미 없는 조건을 매번 알람으로 만들면 노이즈가 쌓인다."
      active_actors: [signal, bad, action]
      description: "반복되는 오탐은 중요한 알람의 신뢰도와 대응 속도를 떨어뜨린다."
      payload: ["flapping", "no owner", "false positive"]
      outcomes:
        - status: warning
          text: "알람 개수보다 행동 가능성과 신뢰도가 중요하다."

merge_commit_squash:
  eyebrow: "Interactive comparison"
  title: "Merge Commit과 Squash Merge"
  summary: "Merge는 브랜치의 여러 커밋을 그래프에 보존하고 Squash는 변경을 하나의 대표 커밋으로 묶어 반영한다."
  actors:
    - id: feature
      kind: "작업 브랜치"
      name: "Feature Commits"
      description: "기능 브랜치에 쌓인 여러 작업 커밋"
    - id: merge
      kind: "병합 방식"
      name: "Merge Commit"
      description: "두 부모를 가진 병합 커밋을 만드는 방식"
    - id: squash
      kind: "병합 방식"
      name: "Squash Merge"
      description: "여러 변경을 하나의 새 커밋으로 합치는 방식"
    - id: main
      kind: "기준 브랜치"
      name: "main"
      description: "최종 통합 커밋을 받는 브랜치"
  steps:
    - title: "1. 기능 커밋 축적"
      from: "Feature Commits"
      to: "main"
      route_label: "기능 브랜치에 여러 작업 커밋이 쌓이고 통합 시점을 기다린다."
      active_actors: [feature, main]
      description: "커밋 그래프의 세부 작업 기록을 어느 정도까지 보존할지 결정한다."
      payload: ["commit A", "commit B", "PR"]
      outcomes:
        - status: info
          text: "브랜치의 작업 기록과 최종 통합 기록은 서로 다른 관심사다."
    - title: "2. Merge Commit"
      from: "Feature Commits"
      to: "Merge Commit"
      route_label: "기능 브랜치의 커밋 흐름을 보존하고 main에 병합 커밋을 추가한다."
      active_actors: [feature, merge, main]
      description: "두 부모를 가진 커밋으로 브랜치가 언제 합쳐졌는지 그래프에 남는다."
      payload: ["two parents", "history preserved", "merge"]
      outcomes:
        - status: info
          text: "상세한 브랜치 그래프가 필요할 때 유용하다."
    - title: "3. Squash Merge"
      from: "Feature Commits"
      to: "Squash Merge"
      route_label: "여러 기능 커밋의 변경을 하나의 대표 커밋으로 만들어 main에 반영한다."
      active_actors: [feature, squash, main]
      description: "main의 히스토리는 단순해지지만 원래 커밋 단위는 대표 커밋 안으로 접힌다."
      payload: ["squash", "one commit", "linear history"]
      outcomes:
        - status: allow
          text: "최종 이력의 읽기 쉬움과 원본 작업 기록 보존을 기준으로 선택한다."

final_merge_strategy:
  eyebrow: "Interactive flow"
  title: "프로젝트의 최종 머지 전략"
  summary: "작업 브랜치의 리뷰와 검증을 거친 뒤 프로젝트가 정한 병합 방식으로 기준 브랜치에 반영한다."
  actors:
    - id: branch
      kind: "작업 단위"
      name: "Feature Branch"
      description: "작은 변경을 담은 작업 브랜치"
    - id: review
      kind: "검증"
      name: "Review + CI"
      description: "코드 리뷰와 자동 테스트·빌드"
    - id: strategy
      kind: "정책"
      name: "Merge Policy"
      description: "Merge, Squash, Rebase 중 프로젝트가 선택한 방식"
    - id: main
      kind: "통합 결과"
      name: "Main Branch"
      description: "배포 가능한 기준 브랜치"
  steps:
    - title: "1. 작업 브랜치 생성"
      from: "Main Branch"
      to: "Feature Branch"
      route_label: "기준 브랜치에서 목적이 분명한 작업 브랜치를 만든다."
      active_actors: [main, branch]
      description: "작업을 분리하면 리뷰 대상과 변경 범위를 명확하게 만들 수 있다."
      payload: ["branch", "small change", "isolated work"]
      outcomes:
        - status: info
          text: "작업 브랜치는 통합 전 변경을 격리하는 경계다."
    - title: "2. 리뷰와 CI"
      from: "Feature Branch"
      to: "Review + CI"
      route_label: "Pull Request에서 리뷰와 테스트·빌드 검증을 수행한다."
      active_actors: [branch, review]
      description: "병합 방식보다 먼저 변경 내용과 자동 검증이 통과해야 한다."
      payload: ["pull request", "review", "tests"]
      outcomes:
        - status: allow
          text: "검증 가능한 상태가 병합의 전제다."
    - title: "3. 정책에 따른 통합"
      from: "Review + CI"
      to: "Merge Policy"
      route_label: "프로젝트가 정한 이력 정책에 따라 Merge 또는 Squash로 통합한다."
      active_actors: [review, strategy, main]
      description: "팀의 릴리스·감사·히스토리 요구에 맞는 하나의 일관된 전략을 사용한다."
      payload: ["merge", "squash", "rebase policy"]
      outcomes:
        - status: allow
          text: "통합 이력이 프로젝트의 읽기·복구·배포 흐름과 맞는다."

tdd_edd:
  eyebrow: "Interactive comparison"
  title: "TDD와 EDD 개발 사이클"
  summary: "TDD는 코드 동작의 테스트를 먼저 만들고 EDD는 배포 후 평가와 운영 피드백까지 개발 사이클에 포함한다."
  actors:
    - id: intent
      kind: "기대 결과"
      name: "Expected Behavior"
      description: "코드가 만족해야 할 동작과 품질 기준"
    - id: test
      kind: "빠른 검증"
      name: "TDD Test"
      description: "구현 전 작성하는 자동 테스트"
    - id: deploy
      kind: "운영 반영"
      name: "Deploy"
      description: "검증된 기능을 실제 환경에 배포하는 단계"
    - id: eval
      kind: "운영 평가"
      name: "EDD Evaluation"
      description: "실제 결과를 측정하고 다음 개선으로 연결하는 평가"
  steps:
    - title: "1. 기대 행동 정의"
      from: "Expected Behavior"
      to: "TDD Test"
      route_label: "구현 전에 성공·실패 조건을 테스트로 표현한다."
      active_actors: [intent, test]
      description: "TDD는 코드를 먼저 쓰는 대신 검증 가능한 행동을 먼저 고정한다."
      payload: ["red", "expected result", "test"]
      outcomes:
        - status: info
          text: "테스트가 구현 방향과 회귀 기준을 제공한다."
    - title: "2. 구현과 통과"
      from: "TDD Test"
      to: "Deploy"
      route_label: "실패하는 테스트를 통과시키고 리팩터링한 뒤 배포 가능한 상태를 만든다."
      active_actors: [test, deploy]
      description: "TDD의 빠른 피드백 루프는 코드 수준 품질을 다룬다."
      payload: ["green", "refactor", "CI"]
      outcomes:
        - status: allow
          text: "자동 테스트가 배포 전 회귀를 줄인다."
    - title: "3. 운영 결과 평가"
      from: "Deploy"
      to: "EDD Evaluation"
      route_label: "실제 사용 결과와 품질 지표를 측정해 다음 개발 입력으로 삼는다."
      active_actors: [deploy, eval, intent]
      description: "EDD는 배포 성공만으로 끝내지 않고 실제 결과가 기대와 맞는지 확인한다."
      payload: ["production", "metric", "feedback"]
      outcomes:
        - status: info
          text: "테스트 통과와 제품 가치 달성은 서로 다른 평가다."

rag_agent_eval:
  eyebrow: "Interactive comparison"
  title: "RAG와 AI Agent의 단계별 평가"
  summary: "검색 품질과 생성 품질, 도구 사용과 최종 업무 결과를 단계별로 따로 평가한다."
  actors:
    - id: query
      kind: "입력"
      name: "User Query"
      description: "사용자가 해결하려는 질문이나 작업"
    - id: retrieval
      kind: "검색"
      name: "RAG Retrieval"
      description: "관련 문서와 근거를 찾는 단계"
    - id: generation
      kind: "응답 생성"
      name: "Generation"
      description: "검색 결과를 이용해 답변을 작성하는 단계"
    - id: agent
      kind: "행동 실행"
      name: "Agent Tools"
      description: "도구 호출과 작업 계획을 수행하는 단계"
  steps:
    - title: "1. 질문 해석"
      from: "User Query"
      to: "RAG Retrieval"
      route_label: "질문을 검색 쿼리로 바꾸고 관련 문서를 찾는다."
      active_actors: [query, retrieval]
      description: "검색 평가에서는 관련성·재현율·근거 포함 여부를 확인한다."
      payload: ["query", "embedding", "top-k"]
      outcomes:
        - status: info
          text: "검색 결과가 좋지 않으면 생성 모델만 바꿔도 근거 문제는 남는다."
    - title: "2. 근거 기반 생성"
      from: "RAG Retrieval"
      to: "Generation"
      route_label: "검색한 문서의 근거를 바탕으로 답변을 생성한다."
      active_actors: [retrieval, generation]
      description: "생성 평가는 정확성·충실성·인용과 검색 근거의 일치 여부를 본다."
      payload: ["context", "answer", "citation"]
      outcomes:
        - status: allow
          text: "검색 품질과 답변 품질을 분리해 진단할 수 있다."
    - title: "3. Agent 실행 평가"
      from: "User Query"
      to: "Agent Tools"
      route_label: "행동이 필요한 질문은 계획·도구 호출·최종 결과를 단계별로 평가한다."
      active_actors: [query, agent, generation]
      description: "Agent는 답변 텍스트뿐 아니라 올바른 도구 선택과 작업 완료 여부도 평가 대상이다."
      payload: ["plan", "tool call", "task success"]
      outcomes:
        - status: info
          text: "최종 응답 점수 하나만으로 전체 Agent 품질을 설명하지 않는다."

edd_feedback:
  eyebrow: "Interactive flow"
  title: "EDD 운영 피드백 루프"
  summary: "배포 후 실제 사용 데이터를 평가하고 개선 항목을 다시 요구사항과 테스트로 연결한다."
  actors:
    - id: release
      kind: "변경 반영"
      name: "Release"
      description: "검증된 기능을 운영 환경에 배포한 결과"
    - id: observe
      kind: "관측"
      name: "Production Signals"
      description: "사용자 행동·오류·품질·비용 지표"
    - id: evaluate
      kind: "판단"
      name: "Evaluation"
      description: "기대 결과와 실제 결과를 비교하는 과정"
    - id: backlog
      kind: "다음 작업"
      name: "Improvement Backlog"
      description: "검증된 개선 요구사항과 우선순위"
  steps:
    - title: "1. 운영 배포"
      from: "Release"
      to: "Production Signals"
      route_label: "기능을 실제 사용자와 트래픽이 있는 환경에 배포한다."
      active_actors: [release, observe]
      description: "배포 자체의 성공과 사용 중 품질은 별도의 관측 대상이다."
      payload: ["release", "traffic", "users"]
      outcomes:
        - status: info
          text: "운영 결과를 수집할 준비가 되어 있어야 한다."
    - title: "2. 기대와 실제 비교"
      from: "Production Signals"
      to: "Evaluation"
      route_label: "실제 지표와 사전에 정한 성공 기준을 비교한다."
      active_actors: [observe, evaluate]
      description: "EDD는 느낌이 아니라 측정 가능한 결과로 다음 의사결정을 만든다."
      payload: ["quality", "latency", "cost", "success rate"]
      outcomes:
        - status: allow
          text: "검증 결과가 개선의 근거가 된다."
    - title: "3. 다음 개선으로 환류"
      from: "Evaluation"
      to: "Improvement Backlog"
      route_label: "평가에서 확인한 문제와 기회를 다음 요구사항·테스트로 등록한다."
      active_actors: [evaluate, backlog, release]
      description: "운영 결과가 다음 개발 사이클의 입력으로 다시 들어간다."
      payload: ["feedback", "priority", "next experiment"]
      outcomes:
        - status: info
          text: "배포를 사이클의 끝이 아니라 학습의 시작으로 본다."

context_switching:
  eyebrow: "Interactive flow"
  title: "Thread Context Switching"
  summary: "CPU가 Thread A의 레지스터 상태를 저장하고 Thread B의 상태를 복원한 뒤 실행을 이어 간다."
  actors:
    - id: scheduler
      kind: "스케줄러"
      name: "Scheduler"
      description: "다음에 실행할 Runnable Thread를 선택하는 OS 구성요소"
    - id: a
      kind: "현재 실행"
      name: "Thread A"
      description: "CPU를 사용하던 Thread"
    - id: b
      kind: "다음 실행"
      name: "Thread B"
      description: "CPU를 이어받을 Thread"
    - id: context
      kind: "상태 저장"
      name: "Thread Context"
      description: "레지스터·PC 등 실행 재개에 필요한 상태"
  steps:
    - title: "1. A 실행"
      from: "Scheduler"
      to: "Thread A"
      route_label: "스케줄러가 A를 선택하고 CPU가 A의 명령을 실행한다."
      active_actors: [scheduler, a]
      description: "현재 실행 중인 Thread의 CPU 상태가 존재한다."
      payload: ["running", "registers", "program counter"]
      outcomes:
        - status: info
          text: "Thread 전환은 단순한 함수 호출과 다른 커널 수준 작업이다."
    - title: "2. A 상태 저장"
      from: "Thread A"
      to: "Thread Context"
      route_label: "A의 레지스터와 실행 위치를 컨텍스트에 저장한다."
      active_actors: [a, context]
      description: "나중에 A가 다시 선택되면 저장한 지점부터 실행을 재개할 수 있다."
      payload: ["save", "registers", "PC"]
      outcomes:
        - status: info
          text: "상태 저장 비용이 전환의 일부다."
    - title: "3. B 상태 복원"
      from: "Thread Context"
      to: "Thread B"
      route_label: "B의 저장된 컨텍스트를 복원하고 CPU를 B에 배정한다."
      active_actors: [context, b, scheduler]
      description: "복원 뒤 B는 이전 실행 위치에서 계속 진행한다."
      payload: ["restore", "dispatch", "resume"]
      outcomes:
        - status: allow
          text: "동시에 실행되는 것처럼 보여도 한 코어에서는 전환이 시간을 나눈다."

thread_switching_cost:
  eyebrow: "Interactive comparison"
  title: "Runnable Thread 수와 Context Switching 비용"
  summary: "CPU 코어보다 Runnable Thread가 많으면 대기와 전환이 늘어 실제 작업에 쓰는 시간이 줄 수 있다."
  actors:
    - id: cores
      kind: "실행 자원"
      name: "CPU Cores"
      description: "동시에 실행할 수 있는 코어 수"
    - id: runnable
      kind: "대기 작업"
      name: "Runnable Threads"
      description: "실행 가능 상태로 대기 중인 Thread 수"
    - id: scheduler
      kind: "선택"
      name: "Scheduler"
      description: "실행 순서와 시간을 나누는 스케줄러"
    - id: overhead
      kind: "부가 비용"
      name: "Switch Overhead"
      description: "컨텍스트 저장·복원과 캐시 영향"
  steps:
    - title: "1. 코어 수 확인"
      from: "CPU Cores"
      to: "Runnable Threads"
      route_label: "실행 가능한 Thread 수를 CPU 코어 수와 비교한다."
      active_actors: [cores, runnable]
      description: "Runnable Thread가 코어보다 적으면 모든 작업이 동시에 실행되지 않을 수 있다."
      payload: ["cores", "runnable", "ready queue"]
      outcomes:
        - status: info
          text: "Thread 수를 늘리는 것만으로 CPU 처리량이 늘지는 않는다."
    - title: "2. 스케줄링"
      from: "Runnable Threads"
      to: "Scheduler"
      route_label: "스케줄러가 실행할 Thread를 선택하고 시간을 배분한다."
      active_actors: [runnable, scheduler]
      description: "대기열의 Thread들은 차례로 CPU를 받기 위해 경쟁한다."
      payload: ["run queue", "time slice", "dispatch"]
      outcomes:
        - status: info
          text: "응답성과 공정성은 스케줄링 정책과 부하에 영향을 받는다."
    - title: "3. 전환 비용 증가"
      from: "Scheduler"
      to: "Switch Overhead"
      route_label: "실행할 Thread가 자주 바뀌면 저장·복원과 캐시 손실 비용이 누적된다."
      active_actors: [scheduler, overhead, runnable]
      description: "I/O 대기와 CPU 작업의 성격을 고려해 적절한 Thread 수와 풀 크기를 선택한다."
      payload: ["context switch", "cache miss", "overhead"]
      outcomes:
        - status: warning
          text: "Thread를 많이 만들면 병렬성이 아니라 전환 비용이 커질 수 있다."

pool_bottleneck:
  eyebrow: "Interactive flow"
  title: "Spring Thread Pool과 DB Connection Pool 병목"
  summary: "요청 Thread가 충분해도 DB Connection Pool이 부족하면 요청은 연결을 기다리며 병목이 생긴다."
  actors:
    - id: requests
      kind: "외부 부하"
      name: "HTTP Requests"
      description: "동시에 들어오는 웹 요청"
    - id: threads
      kind: "처리 풀"
      name: "Spring Thread Pool"
      description: "요청을 실행하는 Thread 집합"
    - id: connections
      kind: "DB 자원"
      name: "DB Connection Pool"
      description: "데이터베이스 연결을 재사용하는 풀"
    - id: db
      kind: "외부 시스템"
      name: "Database"
      description: "쿼리를 실행하는 데이터베이스"
  steps:
    - title: "1. 요청 수신"
      from: "HTTP Requests"
      to: "Spring Thread Pool"
      route_label: "HTTP 요청이 서버 Thread Pool의 작업으로 들어온다."
      active_actors: [requests, threads]
      description: "요청 수가 Thread Pool 크기를 넘으면 실행 전 대기열이 생긴다."
      payload: ["request", "worker thread", "queue"]
      outcomes:
        - status: info
          text: "Thread Pool 크기만으로 전체 처리 용량을 판단하지 않는다."
    - title: "2. 연결 대기"
      from: "Spring Thread Pool"
      to: "DB Connection Pool"
      route_label: "실행된 Thread가 DB 연결을 빌리기 위해 Connection Pool을 조회한다."
      active_actors: [threads, connections]
      description: "사용 가능한 연결이 없으면 Thread가 DB 작업 전부터 대기한다."
      payload: ["borrow", "connection limit", "wait time"]
      outcomes:
        - status: warning
          text: "Thread Pool을 키워도 DB 연결 부족으로 지연이 더 커질 수 있다."
    - title: "3. 쿼리 실행"
      from: "DB Connection Pool"
      to: "Database"
      route_label: "빌린 연결로 쿼리를 실행하고 반환한 뒤 다음 요청이 재사용한다."
      active_actors: [connections, db, threads]
      description: "병목 분석에서는 Thread 대기와 Connection 대기, 실제 쿼리 시간을 분리한다."
      payload: ["query", "execute", "release"]
      outcomes:
        - status: allow
          text: "풀 크기와 DB 처리 시간을 함께 조정해야 한다."

optimistic_lock:
  eyebrow: "Interactive flow"
  title: "낙관적 락의 버전 비교와 재시도"
  summary: "수정 시점에 읽은 version과 현재 version을 비교해 충돌을 감지하고 실패한 작업은 정책에 따라 재시도한다."
  actors:
    - id: tx
      kind: "트랜잭션"
      name: "Transaction"
      description: "엔티티를 읽고 수정하는 작업"
    - id: version
      kind: "검증 값"
      name: "Version"
      description: "마지막으로 읽은 엔티티 버전"
    - id: db
      kind: "저장 상태"
      name: "Database Row"
      description: "현재 데이터와 version을 가진 행"
    - id: retry
      kind: "충돌 처리"
      name: "Retry / Conflict"
      description: "충돌을 실패로 반환하거나 다시 시도하는 정책"
  steps:
    - title: "1. 버전 읽기"
      from: "Transaction"
      to: "Database Row"
      route_label: "트랜잭션이 현재 데이터와 version을 함께 읽는다."
      active_actors: [tx, db, version]
      description: "낙관적 락은 읽을 때 잠그기보다 수정할 때 충돌을 확인한다."
      payload: ["SELECT", "version = 3", "snapshot"]
      outcomes:
        - status: info
          text: "읽은 버전이 이후 UPDATE 조건의 기준이 된다."
    - title: "2. 조건부 수정"
      from: "Transaction"
      to: "Version"
      route_label: "UPDATE WHERE id와 version이 모두 일치할 때만 저장하고 version을 증가시킨다."
      active_actors: [tx, version, db]
      description: "다른 트랜잭션이 먼저 수정했다면 영향을 받은 행 수가 0이 된다."
      payload: ["WHERE version = 3", "UPDATE", "version + 1"]
      outcomes:
        - status: allow
          text: "버전이 그대로면 충돌 없이 커밋할 수 있다."
    - title: "3. 충돌 재시도"
      from: "Database Row"
      to: "Retry / Conflict"
      route_label: "버전이 다르면 충돌로 판단해 실패를 알리거나 최신 값을 읽고 재시도한다."
      active_actors: [db, retry, tx]
      description: "재시도 가능 여부는 작업의 멱등성·사용자 경험·최대 횟수 정책에 달려 있다."
      payload: ["affected rows = 0", "conflict", "retry"]
      outcomes:
        - status: reject
          text: "충돌을 무조건 조용히 덮어쓰지 않는다."

pessimistic_lock:
  eyebrow: "Interactive flow"
  title: "비관적 락의 Row Lock 대기"
  summary: "트랜잭션이 행을 잠그고 있는 동안 다른 트랜잭션은 락이 풀릴 때까지 기다린다."
  actors:
    - id: txa
      kind: "선점 트랜잭션"
      name: "Transaction A"
      description: "먼저 해당 행을 잠근 트랜잭션"
    - id: row
      kind: "공유 자원"
      name: "Database Row"
      description: "동시에 변경될 수 있는 하나의 행"
    - id: txb
      kind: "대기 트랜잭션"
      name: "Transaction B"
      description: "같은 행의 락을 기다리는 트랜잭션"
    - id: commit
      kind: "해제 시점"
      name: "Commit / Rollback"
      description: "락을 해제하고 다음 트랜잭션을 진행시키는 경계"
  steps:
    - title: "1. 행 잠금 획득"
      from: "Transaction A"
      to: "Database Row"
      route_label: "A가 SELECT FOR UPDATE 등으로 대상 행의 Row Lock을 획득한다."
      active_actors: [txa, row]
      description: "잠금이 유지되는 동안 다른 트랜잭션의 충돌 변경을 막는다."
      payload: ["FOR UPDATE", "row lock", "exclusive"]
      outcomes:
        - status: allow
          text: "A가 임계 구역을 먼저 확보한다."
    - title: "2. B 대기"
      from: "Transaction B"
      to: "Database Row"
      route_label: "B가 같은 행을 잠그려 하면 A의 락이 풀릴 때까지 대기한다."
      active_actors: [txb, row, txa]
      description: "대기는 일관성을 높이는 대신 연결 점유 시간과 데드락 위험을 만든다."
      payload: ["lock wait", "timeout", "same row"]
      outcomes:
        - status: warning
          text: "긴 트랜잭션은 다른 요청의 지연으로 이어질 수 있다."
    - title: "3. 락 해제"
      from: "Commit / Rollback"
      to: "Transaction B"
      route_label: "A가 커밋·롤백하면 락이 풀리고 B가 행을 다시 확인한다."
      active_actors: [commit, txa, txb, row]
      description: "비관적 락은 충돌 후 복구보다 충돌 자체를 줄이는 전략이다."
      payload: ["commit", "rollback", "unlock"]
      outcomes:
        - status: info
          text: "락 범위·대기 시간·데드락 정책을 함께 설계한다."

lock_selection:
  eyebrow: "Interactive comparison"
  title: "원자 업데이트·낙관적 락·비관적 락 선택"
  summary: "충돌 가능성과 작업 범위에 따라 짧은 원자 연산, 버전 검증, 선점 잠금 중 전략을 선택한다."
  actors:
    - id: operation
      kind: "변경 작업"
      name: "Update Request"
      description: "재고·포인트·예약처럼 공유 값을 변경하는 요청"
    - id: atomic
      kind: "짧은 연산"
      name: "Atomic UPDATE"
      description: "조건을 포함한 한 번의 원자 SQL"
    - id: optimistic
      kind: "버전 검증"
      name: "Optimistic Lock"
      description: "version 비교로 충돌을 감지하는 전략"
    - id: pessimistic
      kind: "선점 잠금"
      name: "Pessimistic Lock"
      description: "행을 먼저 잠그고 작업하는 전략"
  steps:
    - title: "1. 단순 조건 변경"
      from: "Update Request"
      to: "Atomic UPDATE"
      route_label: "한 번의 조건부 UPDATE로 재고 감소처럼 짧은 변경을 처리한다."
      active_actors: [operation, atomic]
      description: "상태를 읽고 복잡한 계산을 하지 않는다면 원자 SQL이 가장 간단할 수 있다."
      payload: ["WHERE stock > 0", "stock = stock - 1", "affected rows"]
      outcomes:
        - status: allow
          text: "잠금 객체를 애플리케이션에 노출하지 않고 경쟁을 줄인다."
    - title: "2. 충돌 감지 필요"
      from: "Update Request"
      to: "Optimistic Lock"
      route_label: "여러 단계를 읽고 계산하지만 충돌이 드물다면 version으로 변경을 검증한다."
      active_actors: [operation, optimistic]
      description: "충돌 시 사용자에게 알리거나 재시도할 수 있는 작업에 적합하다."
      payload: ["version", "conflict", "retry policy"]
      outcomes:
        - status: info
          text: "읽기 경쟁을 허용하고 수정 시점에 충돌을 판단한다."
    - title: "3. 선점 필요"
      from: "Update Request"
      to: "Pessimistic Lock"
      route_label: "동시에 처리되면 안 되는 임계 구역을 행 잠금으로 선점한다."
      active_actors: [operation, pessimistic]
      description: "충돌 비용이 크고 대기 허용 범위가 명확할 때 검토한다."
      payload: ["row lock", "wait", "deadlock"]
      outcomes:
        - status: warning
          text: "락 대기와 데드락·타임아웃 비용을 반드시 함께 평가한다."

interrupt_full:
  eyebrow: "Interactive flow"
  title: "Interrupt 전체 실행 흐름"
  summary: "장치나 프로그램의 인터럽트 요청을 CPU가 받아 현재 상태를 저장하고 핸들러 실행 후 원래 흐름으로 복귀한다."
  actors:
    - id: device
      kind: "발생 주체"
      name: "Device / Program"
      description: "처리가 필요하다는 인터럽트를 발생시키는 주체"
    - id: cpu
      kind: "현재 실행"
      name: "CPU"
      description: "현재 명령을 처리 중인 프로세서"
    - id: handler
      kind: "운영체제 처리"
      name: "Interrupt Handler"
      description: "인터럽트 원인을 확인하고 처리하는 코드"
    - id: resume
      kind: "복귀"
      name: "Resumed Program"
      description: "저장한 실행 위치로 돌아가는 원래 프로그램"
  steps:
    - title: "1. 인터럽트 요청"
      from: "Device / Program"
      to: "CPU"
      route_label: "장치나 프로그램이 CPU에 즉시 처리할 사건이 있음을 알린다."
      active_actors: [device, cpu]
      description: "인터럽트는 현재 실행 흐름과 별개로 처리 필요성을 전달한다."
      payload: ["interrupt request", "IRQ", "event"]
      outcomes:
        - status: info
          text: "인터럽트가 발생했다고 곧바로 모든 실행이 중단되는 것은 아니다."
    - title: "2. 현재 상태 저장"
      from: "CPU"
      to: "Interrupt Handler"
      route_label: "CPU가 복귀에 필요한 PC와 레지스터 상태를 저장하고 핸들러로 진입한다."
      active_actors: [cpu, handler]
      description: "중단된 프로그램을 나중에 이어가기 위해 실행 문맥을 보존한다."
      payload: ["save context", "PC", "vector"]
      outcomes:
        - status: allow
          text: "핸들러가 인터럽트 원인을 처리할 준비가 된다."
    - title: "3. 처리 후 복귀"
      from: "Interrupt Handler"
      to: "Resumed Program"
      route_label: "핸들러가 장치 상태를 처리한 뒤 저장한 문맥으로 원래 프로그램을 재개한다."
      active_actors: [handler, resume, cpu]
      description: "인터럽트 처리와 프로세스 전체의 문맥 전환은 범위가 다를 수 있다."
      payload: ["acknowledge", "restore context", "return"]
      outcomes:
        - status: info
          text: "중단된 흐름이 일관된 상태에서 다시 실행된다."

interrupt_context:
  eyebrow: "Interactive comparison"
  title: "Interrupt와 Context Switching"
  summary: "인터럽트는 CPU가 처리할 사건을 알리고, 스케줄러 판단이 더해지면 다른 Thread로 문맥 전환이 이어질 수 있다."
  actors:
    - id: current
      kind: "현재 Thread"
      name: "Running Thread"
      description: "인터럽트가 발생한 시점의 실행 흐름"
    - id: interrupt
      kind: "사건 신호"
      name: "Interrupt"
      description: "외부 장치나 내부 사건의 알림"
    - id: scheduler
      kind: "선택 정책"
      name: "Scheduler"
      description: "현재 Thread를 계속 실행할지 결정하는 구성요소"
    - id: next
      kind: "다음 실행"
      name: "Next Thread"
      description: "스케줄러가 새로 선택한 실행 흐름"
  steps:
    - title: "1. 현재 실행 중단 지점"
      from: "Running Thread"
      to: "Interrupt"
      route_label: "현재 Thread가 실행 중일 때 인터럽트 신호가 들어온다."
      active_actors: [current, interrupt]
      description: "인터럽트가 발생한 시점의 실행 상태를 보존해야 한다."
      payload: ["running", "IRQ", "preemption point"]
      outcomes:
        - status: info
          text: "인터럽트와 Thread 전환을 같은 개념으로 합치지 않는다."
    - title: "2. 스케줄러 판단"
      from: "Interrupt"
      to: "Scheduler"
      route_label: "인터럽트 처리 뒤 스케줄러가 현재 Thread를 계속 실행할지 확인한다."
      active_actors: [interrupt, scheduler, current]
      description: "스케줄링 정책과 우선순위에 따라 문맥 전환 여부가 결정된다."
      payload: ["handler return", "priority", "preemption"]
      outcomes:
        - status: info
          text: "모든 인터럽트가 다른 Thread 실행으로 이어지는 것은 아니다."
    - title: "3. 문맥 전환"
      from: "Scheduler"
      to: "Next Thread"
      route_label: "전환이 결정되면 현재 상태를 저장하고 다음 Thread 상태를 복원한다."
      active_actors: [scheduler, current, next]
      description: "인터럽트는 전환을 유발할 수 있는 계기이고 문맥 저장·복원은 별도 작업이다."
      payload: ["save", "restore", "dispatch"]
      outcomes:
        - status: allow
          text: "사건 처리와 CPU 실행 주체 변경을 시간 순서로 나누어 본다."

io_state_transition:
  eyebrow: "Interactive flow"
  title: "I/O 요청과 스레드 상태 전환"
  summary: "I/O를 기다리는 스레드는 Blocked 상태로 빠지고 완료 인터럽트 뒤 Runnable을 거쳐 다시 실행된다."
  actors:
    - id: thread
      kind: "실행 주체"
      name: "Application Thread"
      description: "I/O 작업을 요청한 스레드"
    - id: device
      kind: "외부 작업"
      name: "I/O Device"
      description: "디스크·네트워크처럼 완료 시간이 필요한 장치"
    - id: blocked
      kind: "대기 상태"
      name: "Blocked"
      description: "I/O 완료를 기다리는 스레드 상태"
    - id: runnable
      kind: "재실행 대기"
      name: "Runnable"
      description: "CPU를 다시 받을 수 있는 상태"
  steps:
    - title: "1. I/O 요청"
      from: "Application Thread"
      to: "I/O Device"
      route_label: "실행 중인 스레드가 디스크나 네트워크 I/O를 요청한다."
      active_actors: [thread, device]
      description: "장치 작업은 CPU 계산과 달리 완료까지 시간이 걸릴 수 있다."
      payload: ["read", "write", "I/O request"]
      outcomes:
        - status: info
          text: "요청을 보낸 뒤 스레드가 계속 실행 가능한지는 모델에 따라 달라진다."
    - title: "2. 대기 상태"
      from: "Application Thread"
      to: "Blocked"
      route_label: "완료를 기다리는 스레드는 Blocked 상태로 이동하고 CPU를 양보한다."
      active_actors: [thread, blocked, device]
      description: "대기 중인 스레드를 계속 실행하지 않으면 다른 작업이 CPU를 사용할 수 있다."
      payload: ["wait", "blocked", "CPU release"]
      outcomes:
        - status: allow
          text: "I/O 대기와 CPU 실행을 분리해 처리한다."
    - title: "3. 완료 후 재실행"
      from: "I/O Device"
      to: "Runnable"
      route_label: "장치 완료 신호가 오면 스레드를 Runnable 대기열로 되돌린다."
      active_actors: [device, blocked, runnable, thread]
      description: "Runnable은 즉시 실행 중이라는 뜻이 아니라 CPU를 받을 준비가 되었다는 뜻이다."
      payload: ["completion", "interrupt", "ready queue"]
      outcomes:
        - status: info
          text: "스케줄러가 선택한 뒤에야 실제 실행 상태가 된다."

encapsulation:
  eyebrow: "Interactive comparison"
  title: "Java 캡슐화 전후"
  summary: "필드를 외부에 직접 노출하지 않고 객체의 메서드가 상태 변경과 불변식을 관리한다."
  actors:
    - id: caller
      kind: "호출부"
      name: "External Caller"
      description: "객체의 상태를 사용하거나 변경하려는 코드"
    - id: field
      kind: "상태"
      name: "Private Field"
      description: "객체 내부에서만 직접 접근하는 값"
    - id: method
      kind: "행동 경계"
      name: "Domain Method"
      description: "검증과 상태 변경 정책을 함께 가진 메서드"
    - id: invariant
      kind: "규칙"
      name: "Invariant"
      description: "항상 지켜져야 하는 객체 상태 조건"
  steps:
    - title: "1. 직접 필드 노출"
      from: "External Caller"
      to: "Private Field"
      route_label: "호출부가 필드에 직접 값을 쓰면 객체 내부 규칙을 우회할 수 있다."
      active_actors: [caller, field]
      description: "공개 필드는 상태 변경 위치가 여러 곳으로 퍼지기 쉽다."
      payload: ["public field", "direct write", "coupling"]
      outcomes:
        - status: warning
          text: "잘못된 값이 검증 없이 저장될 수 있다."
    - title: "2. 메서드로 변경"
      from: "External Caller"
      to: "Domain Method"
      route_label: "호출부는 changeName 같은 행동 메서드를 호출하고 필드는 직접 만지지 않는다."
      active_actors: [caller, method, field]
      description: "변경 의도를 메서드 이름으로 드러내면 정책을 한 경계에 모을 수 있다."
      payload: ["changeName()", "validate", "encapsulation"]
      outcomes:
        - status: allow
          text: "상태 변경 책임이 객체 내부로 이동한다."
    - title: "3. 불변식 유지"
      from: "Domain Method"
      to: "Invariant"
      route_label: "메서드가 입력을 검증한 뒤 허용된 상태만 필드에 반영한다."
      active_actors: [method, field, invariant]
      description: "캡슐화는 private 키워드만이 아니라 상태 변경 규칙을 지키는 설계다."
      payload: ["validation", "valid state", "policy"]
      outcomes:
        - status: allow
          text: "변경 정책을 나중에 추가해도 호출부의 세부 수정이 줄어든다."

constructor_state:
  eyebrow: "Interactive flow"
  title: "Constructor와 객체 상태 관리"
  summary: "생성자는 객체가 유효한 초기 상태를 만들고 이후 행동 메서드가 상태 변경 규칙을 적용한다."
  actors:
    - id: input
      kind: "생성 입력"
      name: "Constructor Arguments"
      description: "객체 생성에 필요한 초기 값"
    - id: constructor
      kind: "초기화"
      name: "Constructor"
      description: "필수 상태를 검증하고 초기화하는 경계"
    - id: object
      kind: "도메인 객체"
      name: "Valid Object"
      description: "유효한 불변식으로 만들어진 객체"
    - id: behavior
      kind: "상태 변경"
      name: "Object Behavior"
      description: "객체가 제공하는 의도 중심의 행동 메서드"
  steps:
    - title: "1. 생성 입력 검증"
      from: "Constructor Arguments"
      to: "Constructor"
      route_label: "생성자가 필수 값과 초기 조건을 확인한다."
      active_actors: [input, constructor]
      description: "생성 시점에 만족해야 하는 규칙과 이후 변경 규칙을 구분한다."
      payload: ["required value", "validation", "initial state"]
      outcomes:
        - status: reject
          text: "유효하지 않은 객체를 먼저 만든 뒤 나중에 고치는 흐름을 피한다."
    - title: "2. 유효한 객체 생성"
      from: "Constructor"
      to: "Valid Object"
      route_label: "검증을 통과한 값으로 객체의 초기 상태를 만든다."
      active_actors: [constructor, object]
      description: "객체가 생성된 뒤에는 기본 불변식이 항상 성립한다고 기대할 수 있다."
      payload: ["fields", "invariant", "new object"]
      outcomes:
        - status: allow
          text: "호출부가 부분 초기화 상태를 다룰 필요가 줄어든다."
    - title: "3. 행동으로 변경"
      from: "Valid Object"
      to: "Object Behavior"
      route_label: "이후 변경은 setter 남발보다 객체의 의미 있는 행동으로 표현한다."
      active_actors: [object, behavior]
      description: "상태 변경 정책과 이력·검증을 도메인 메서드 안에서 함께 관리할 수 있다."
      payload: ["change state", "domain method", "policy"]
      outcomes:
        - status: info
          text: "Dirty Checking의 필수 조건과 좋은 객체 설계의 선택을 혼동하지 않는다."

short_circuit:
  eyebrow: "Interactive comparison"
  title: "Java &&와 &의 단락 평가"
  summary: "&&는 왼쪽 결과로 전체 결과가 정해지면 오른쪽을 건너뛰고 &는 두 피연산자를 모두 평가한다."
  actors:
    - id: left
      kind: "첫 조건"
      name: "Left Operand"
      description: "먼저 평가되는 boolean 조건"
    - id: right
      kind: "둘째 조건"
      name: "Right Operand"
      description: "두 번째로 평가될 수 있는 조건 또는 메서드 호출"
    - id: and
      kind: "단락 연산"
      name: "&&"
      description: "왼쪽이 false면 오른쪽을 평가하지 않는 연산자"
    - id: bit
      kind: "전체 평가"
      name: "&"
      description: "boolean에서도 양쪽 피연산자를 모두 평가하는 연산자"
  steps:
    - title: "1. 왼쪽 조건 평가"
      from: "Left Operand"
      to: "&&"
      route_label: "&& 표현식이 왼쪽 조건을 먼저 계산한다."
      active_actors: [left, and]
      description: "왼쪽 결과가 오른쪽 평가 여부를 결정할 수 있다."
      payload: ["left", "boolean", "short circuit"]
      outcomes:
        - status: info
          text: "평가 순서가 연산 결과와 부수 효과에 영향을 준다."
    - title: "2. false면 건너뜀"
      from: "&&"
      to: "Right Operand"
      route_label: "왼쪽이 false면 &&는 전체가 false이므로 오른쪽을 호출하지 않는다."
      active_actors: [and, right]
      description: "null 검사 뒤 메서드를 호출하는 패턴처럼 안전한 단락 평가에 활용한다."
      payload: ["left = false", "right skipped", "false"]
      outcomes:
        - status: allow
          text: "불필요한 계산과 위험한 호출을 줄일 수 있다."
    - title: "3. &는 모두 평가"
      from: "&"
      to: "Right Operand"
      route_label: "boolean 연산의 &는 왼쪽 결과와 관계없이 오른쪽까지 평가한다."
      active_actors: [left, right, bit]
      description: "부수 효과가 있는 조건에서 &&와 &를 바꾸면 실행 흐름이 달라진다."
      payload: ["left", "right", "both evaluated"]
      outcomes:
        - status: warning
          text: "의도한 단락 평가인지 비트 연산인지 문맥에 맞춰 선택한다."

primitive_reference:
  eyebrow: "Interactive comparison"
  title: "기본 타입과 참조 타입의 전달"
  summary: "기본 타입은 값이 복사되고 참조 타입은 참조값이 복사되어 같은 객체를 가리킬 수 있다."
  actors:
    - id: caller
      kind: "호출부"
      name: "Caller Variable"
      description: "메서드에 값을 전달하는 원래 변수"
    - id: primitive
      kind: "기본 값"
      name: "Primitive Copy"
      description: "int·boolean 같은 값 자체의 복사본"
    - id: reference
      kind: "참조 값"
      name: "Reference Copy"
      description: "객체를 가리키는 참조값의 복사본"
    - id: object
      kind: "객체"
      name: "Heap Object"
      description: "복사된 참조들이 함께 가리킬 수 있는 객체"
  steps:
    - title: "1. 기본 값 복사"
      from: "Caller Variable"
      to: "Primitive Copy"
      route_label: "메서드 호출 시 기본 타입의 값 자체가 매개변수에 복사된다."
      active_actors: [caller, primitive]
      description: "메서드 안에서 복사본을 바꿔도 호출부 변수는 바뀌지 않는다."
      payload: ["int x", "copy value", "local change"]
      outcomes:
        - status: info
          text: "Java의 매개변수 전달은 기본 타입에서도 값 복사다."
    - title: "2. 참조값 복사"
      from: "Caller Variable"
      to: "Reference Copy"
      route_label: "참조 타입에서는 객체를 가리키는 참조값이 매개변수에 복사된다."
      active_actors: [caller, reference, object]
      description: "참조 자체가 복사되지만 두 참조가 같은 Heap 객체를 가리킬 수 있다."
      payload: ["User user", "copy reference", "same object"]
      outcomes:
        - status: info
          text: "Java가 참조 자체를 call by reference로 전달한다는 뜻은 아니다."
    - title: "3. 객체 상태 변경"
      from: "Reference Copy"
      to: "Heap Object"
      route_label: "메서드가 복사된 참조로 객체 필드를 바꾸면 공유 객체 상태가 바뀐다."
      active_actors: [reference, object, caller]
      description: "참조값 복사와 객체 mutation을 분리해서 설명해야 전달 규칙이 선명해진다."
      payload: ["user.name = ...", "mutation", "caller observes"]
      outcomes:
        - status: allow
          text: "참조 타입도 매개변수 전달 자체는 값 복사지만 객체 변경은 공유된다."

pass_by_value:
  eyebrow: "Interactive flow"
  title: "참조 타입의 Pass by Value"
  summary: "메서드는 참조값의 복사본을 받으므로 지역 참조 재대입은 호출부에 영향을 주지 않지만 객체 변경은 공유된다."
  actors:
    - id: caller
      kind: "호출부 참조"
      name: "caller.user"
      description: "원래 객체를 가리키는 호출부 변수"
    - id: parameter
      kind: "매개변수 복사"
      name: "method user"
      description: "호출부 참조값을 복사한 지역 변수"
    - id: object
      kind: "공유 객체"
      name: "User Object"
      description: "두 참조가 같은 객체를 가리키는 상태"
    - id: reassigned
      kind: "지역 재대입"
      name: "Local Reassignment"
      description: "메서드 안에서만 바뀌는 매개변수 참조"
  steps:
    - title: "1. 참조값 전달"
      from: "caller.user"
      to: "method user"
      route_label: "호출부의 참조값이 매개변수 변수에 복사된다."
      active_actors: [caller, parameter, object]
      description: "두 변수는 같은 User 객체를 가리킬 수 있지만 변수 자체는 별개다."
      payload: ["copy reference", "same heap object", "pass by value"]
      outcomes:
        - status: info
          text: "참조를 전달해도 참조 변수 자체를 공유하는 것은 아니다."
    - title: "2. 지역 참조 재대입"
      from: "method user"
      to: "Local Reassignment"
      route_label: "메서드 안에서 parameter가 다른 객체를 가리키도록 재대입한다."
      active_actors: [parameter, reassigned, caller]
      description: "복사본인 매개변수만 바뀌므로 호출부의 caller.user는 그대로다."
      payload: ["user = new User()", "local only", "caller unchanged"]
      outcomes:
        - status: allow
          text: "참조 변수 재대입은 호출부까지 전파되지 않는다."
    - title: "3. 객체 mutation"
      from: "method user"
      to: "User Object"
      route_label: "재대입이 아니라 user.name 같은 필드를 바꾸면 같은 객체의 상태가 변경된다."
      active_actors: [parameter, object, caller]
      description: "호출부와 메서드가 같은 객체를 가리키는 동안 mutation은 공유된다."
      payload: ["field mutation", "shared state", "caller sees change"]
      outcomes:
        - status: warning
          text: "재대입과 객체 내부 변경을 같은 결과로 설명하지 않는다."

filesystem_layers:
  eyebrow: "Interactive flow"
  title: "Java 애플리케이션에서 저장장치까지"
  summary: "Java API 호출은 운영체제 파일 시스템과 장치 드라이버를 거쳐 저장장치의 블록에 도달한다."
  actors:
    - id: app
      kind: "응용 계층"
      name: "Java Application"
      description: "File·Stream API를 호출하는 애플리케이션"
    - id: os
      kind: "운영체제"
      name: "OS + File System"
      description: "파일 이름·권한·블록 매핑을 관리하는 계층"
    - id: driver
      kind: "장치 연결"
      name: "Device Driver"
      description: "운영체제 요청을 장치 명령으로 바꾸는 계층"
    - id: storage
      kind: "물리 저장"
      name: "Storage Device"
      description: "SSD·HDD의 실제 블록과 페이지"
  steps:
    - title: "1. 파일 API 호출"
      from: "Java Application"
      to: "OS + File System"
      route_label: "Java 애플리케이션이 파일 열기·읽기·쓰기 API를 호출한다."
      active_actors: [app, os]
      description: "애플리케이션은 저장장치의 물리 위치보다 파일 추상화를 사용한다."
      payload: ["Path", "read", "write"]
      outcomes:
        - status: info
          text: "Java 코드가 곧바로 디스크 블록을 조작하는 것은 아니다."
    - title: "2. 파일 시스템 매핑"
      from: "OS + File System"
      to: "Device Driver"
      route_label: "운영체제가 파일 위치와 권한을 해석해 장치 I/O 요청으로 만든다."
      active_actors: [os, driver]
      description: "파일 이름에서 실제 블록으로 내려가는 책임이 운영체제에 있다."
      payload: ["inode", "block mapping", "I/O request"]
      outcomes:
        - status: allow
          text: "파일 시스템과 장치 접근 계층이 연결된다."
    - title: "3. 저장장치 접근"
      from: "Device Driver"
      to: "Storage Device"
      route_label: "드라이버가 장치 명령을 보내 저장장치가 블록을 읽거나 쓴다."
      active_actors: [driver, storage]
      description: "지연 시간과 내구성은 파일 API보다 아래 계층의 특성에도 영향을 받는다."
      payload: ["block", "page", "read / write"]
      outcomes:
        - status: info
          text: "애플리케이션·OS·장치의 책임을 층별로 나누어 본다."

directory_structures:
  eyebrow: "Interactive comparison"
  title: "디렉터리 구조의 변화"
  summary: "단일 디렉터리에서 계층형 트리와 링크를 허용하는 그래프 구조로 갈수록 이름 충돌과 공유 요구를 다르게 해결한다."
  actors:
    - id: single
      kind: "초기 구조"
      name: "Single-Level"
      description: "모든 파일이 하나의 디렉터리에 있는 구조"
    - id: two
      kind: "분리 구조"
      name: "Two-Level"
      description: "사용자별 또는 그룹별로 분리된 디렉터리"
    - id: tree
      kind: "계층 구조"
      name: "Tree Directories"
      description: "하위 디렉터리를 중첩할 수 있는 구조"
    - id: graph
      kind: "공유 구조"
      name: "Acyclic / General Graph"
      description: "링크로 여러 경로에서 대상을 공유하는 구조"
  steps:
    - title: "1. 단일 공간"
      from: "Single-Level"
      to: "Two-Level"
      route_label: "파일이 많아지면 사용자·그룹별 디렉터리로 이름 공간을 나눈다."
      active_actors: [single, two]
      description: "단일 구조는 단순하지만 파일 이름 충돌과 관리 범위 문제가 커진다."
      payload: ["one directory", "name collision", "user scope"]
      outcomes:
        - status: info
          text: "이름 공간을 나누는 것이 첫 번째 확장 방향이다."
    - title: "2. 트리 확장"
      from: "Two-Level"
      to: "Tree Directories"
      route_label: "하위 디렉터리를 중첩해 프로젝트·기능·날짜별 계층을 만든다."
      active_actors: [two, tree]
      description: "트리 구조는 경로로 파일을 구분하고 관리 범위를 세분화한다."
      payload: ["path", "parent", "child directory"]
      outcomes:
        - status: allow
          text: "계층을 따라 탐색과 권한 관리를 구성할 수 있다."
    - title: "3. 링크와 공유"
      from: "Tree Directories"
      to: "Acyclic / General Graph"
      route_label: "같은 파일이나 디렉터리를 여러 경로에서 참조하려면 링크를 허용한다."
      active_actors: [tree, graph]
      description: "공유 링크는 유연하지만 순환 참조·삭제·권한 의미를 추가로 관리해야 한다."
      payload: ["link", "shared target", "cycle policy"]
      outcomes:
        - status: warning
          text: "표현력이 늘수록 탐색과 수명 관리 규칙도 복잡해진다."

paging_translation:
  eyebrow: "Interactive flow"
  title: "Paging 주소 변환"
  summary: "가상 주소를 page number와 offset으로 나누고 페이지 테이블에서 frame을 찾아 물리 주소를 만든다."
  actors:
    - id: virtual
      kind: "가상 주소"
      name: "Virtual Address"
      description: "프로세스가 사용하는 논리 주소"
    - id: page
      kind: "페이지 번호"
      name: "Page Number"
      description: "페이지 테이블을 조회할 인덱스"
    - id: table
      kind: "매핑 표"
      name: "Page Table"
      description: "페이지와 물리 프레임의 매핑 정보"
    - id: frame
      kind: "물리 주소"
      name: "Frame + Offset"
      description: "RAM에서 실제 위치를 구성하는 프레임과 offset"
  steps:
    - title: "1. 주소 분해"
      from: "Virtual Address"
      to: "Page Number"
      route_label: "가상 주소를 page number와 page offset으로 분리한다."
      active_actors: [virtual, page]
      description: "offset은 페이지 안의 위치이고 page number는 매핑 대상을 찾는 값이다."
      payload: ["virtual address", "page", "offset"]
      outcomes:
        - status: info
          text: "페이지 크기가 주소 분할 기준을 결정한다."
    - title: "2. 페이지 테이블 조회"
      from: "Page Number"
      to: "Page Table"
      route_label: "페이지 번호로 현재 페이지가 어느 frame에 있는지 조회한다."
      active_actors: [page, table]
      description: "매핑이 없거나 유효하지 않으면 page fault 처리가 필요하다."
      payload: ["PTE", "valid bit", "frame number"]
      outcomes:
        - status: allow
          text: "유효한 매핑이 있으면 주소 변환을 계속한다."
    - title: "3. 물리 주소 생성"
      from: "Page Table"
      to: "Frame + Offset"
      route_label: "frame 번호와 원래 offset을 합쳐 물리 주소를 만든다."
      active_actors: [table, frame, virtual]
      description: "Paging은 프로세스의 연속 가상 공간을 물리 프레임에 나누어 배치한다."
      payload: ["frame", "offset", "physical address"]
      outcomes:
        - status: allow
          text: "변환된 주소로 RAM 접근을 수행한다."

page_fault:
  eyebrow: "Interactive flow"
  title: "Page Fault와 Page Replacement"
  summary: "요청 페이지가 메모리에 없으면 트랩이 발생하고 운영체제가 페이지를 적재할 프레임을 확보한다."
  actors:
    - id: cpu
      kind: "접근 주체"
      name: "CPU Memory Access"
      description: "가상 주소를 읽거나 쓰는 CPU 접근"
    - id: table
      kind: "판정"
      name: "Page Table"
      description: "페이지가 현재 메모리에 있는지 나타내는 표"
    - id: disk
      kind: "보조 저장"
      name: "Backing Store"
      description: "메모리에 없는 페이지를 보관하는 디스크 영역"
    - id: memory
      kind: "물리 메모리"
      name: "Frame / Replacement"
      description: "페이지를 적재할 프레임과 교체 정책"
  steps:
    - title: "1. 유효 비트 확인"
      from: "CPU Memory Access"
      to: "Page Table"
      route_label: "CPU가 주소를 접근하고 페이지 테이블의 valid bit를 확인한다."
      active_actors: [cpu, table]
      description: "페이지가 메모리에 있으면 바로 변환하지만 없으면 예외 처리가 시작된다."
      payload: ["page number", "valid bit", "access"]
      outcomes:
        - status: warning
          text: "유효하지 않은 매핑은 단순한 캐시 미스와 다른 운영체제 사건이다."
    - title: "2. 페이지 폴트 처리"
      from: "Page Table"
      to: "Backing Store"
      route_label: "운영체제가 필요한 페이지를 디스크에서 찾고 적재를 요청한다."
      active_actors: [table, disk, cpu]
      description: "현재 프레임이 부족하면 교체할 victim page도 선택해야 한다."
      payload: ["page fault", "trap", "read page"]
      outcomes:
        - status: info
          text: "폴트 처리 동안 해당 접근은 장치 I/O를 기다릴 수 있다."
    - title: "3. 프레임 적재와 재개"
      from: "Backing Store"
      to: "Frame / Replacement"
      route_label: "필요 페이지를 프레임에 적재하고 페이지 테이블을 갱신한 뒤 명령을 재실행한다."
      active_actors: [disk, memory, table, cpu]
      description: "페이지 교체 정책은 어떤 프레임을 내보낼지 결정한다."
      payload: ["victim", "load frame", "retry access"]
      outcomes:
        - status: allow
          text: "매핑이 갱신되면 중단된 메모리 접근을 이어갈 수 있다."

replacement_algorithms:
  eyebrow: "Interactive comparison"
  title: "FIFO·OPT·LRU 페이지 교체"
  summary: "프레임이 가득 찼을 때 FIFO는 오래된 페이지, OPT는 미래 최적 페이지, LRU는 가장 오래 안 쓴 페이지를 선택한다."
  actors:
    - id: fault
      kind: "사건"
      name: "Page Fault"
      description: "새 페이지를 적재해야 하는 상황"
    - id: fifo
      kind: "순서 기준"
      name: "FIFO"
      description: "가장 먼저 들어온 페이지를 내보내는 정책"
    - id: opt
      kind: "이상 기준"
      name: "OPT"
      description: "미래에 가장 늦게 사용될 페이지를 고르는 이론적 정책"
    - id: lru
      kind: "사용 이력"
      name: "LRU"
      description: "가장 오랫동안 사용되지 않은 페이지를 고르는 정책"
  steps:
    - title: "1. 교체 필요"
      from: "Page Fault"
      to: "FIFO"
      route_label: "새 페이지를 넣을 빈 프레임이 없으면 victim 선택이 시작된다."
      active_actors: [fault, fifo, opt, lru]
      description: "교체 정책은 같은 참조열에서도 서로 다른 victim을 선택할 수 있다."
      payload: ["full frames", "victim", "reference string"]
      outcomes:
        - status: info
          text: "페이지 폴트 횟수는 참조열과 프레임 수, 정책에 함께 좌우된다."
    - title: "2. FIFO 기준"
      from: "FIFO"
      to: "Page Fault"
      route_label: "FIFO는 메모리에 가장 먼저 들어온 페이지를 교체 대상으로 고른다."
      active_actors: [fifo, fault]
      description: "최근 사용 여부보다 적재 순서만 기억하는 단순한 정책이다."
      payload: ["arrival order", "oldest page", "queue"]
      outcomes:
        - status: info
          text: "오래전에 들어왔어도 자주 쓰이는 페이지를 내보낼 수 있다."
    - title: "3. OPT와 LRU 비교"
      from: "OPT / LRU"
      to: "Page Fault"
