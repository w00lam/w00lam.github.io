      outcomes:
        - status: info
          text: "입력 전처리와 모델 추출 책임을 분리한다."
    - title: "2. 구조화 추출"
      from: "Vision / LLM Extraction"
      to: "Schema + Business Rules"
      route_label: "모델이 찾은 필드를 JSON 스키마와 업무 규칙으로 검증한다."
      active_actors: [extract, validate]
      description: "자유로운 텍스트 응답을 곧바로 데이터베이스에 저장하지 않는다."
      payload: ["merchant", "amount", "date", "items"]
      outcomes:
        - status: warning
          text: "누락·오인식·비정상 금액을 애플리케이션에서 다시 확인한다."
    - title: "3. 업무 적용"
      from: "Schema + Business Rules"
      to: "Domain Action"
      route_label: "검증을 통과한 구조화 결과만 저장·분류·정산 같은 도메인 동작에 사용한다."
      active_actors: [validate, action]
      description: "AI는 입력 해석을 돕지만 최종 상태 변경은 기존 업무 규칙을 따른다."
      payload: ["validated data", "persist", "classification"]
      outcomes:
        - status: allow
          text: "AI 기능을 작은 검증 가능한 단계로 나눌 수 있다."

tool_calling_workflow:
  eyebrow: "Interactive flow"
  title: "Spring AI Tool Calling"
  summary: "모델이 도구 호출을 요청하면 애플리케이션이 인자와 권한을 검증해 실행하고 결과를 다시 모델에 전달한다."
  actors:
    - id: user
      kind: "요청"
      name: "User Question"
      description: "외부 데이터나 동작이 필요한 사용자 질문"
    - id: model
      kind: "선택"
      name: "Chat Model"
      description: "도구가 필요한지와 호출 인자를 판단하는 모델"
    - id: tool
      kind: "실행"
      name: "Tool Handler"
      description: "실제 API·DB·검색을 호출하는 애플리케이션 함수"
    - id: result
      kind: "응답"
      name: "Final Answer"
      description: "도구 결과를 근거로 작성한 사용자 응답"
  steps:
    - title: "1. 도구 필요성 판단"
      from: "User Question"
      to: "Chat Model"
      route_label: "질문과 사용 가능한 도구 설명을 모델에 전달해 다음 행동을 선택하게 한다."
      active_actors: [user, model]
      description: "모델이 모든 동작을 직접 수행하는 것이 아니라 호출 계획을 제안한다."
      payload: ["question", "tool schema", "context"]
      outcomes:
        - status: info
          text: "도구 이름과 입력 스키마가 모델의 선택 기준이 된다."
    - title: "2. 검증된 도구 실행"
      from: "Chat Model"
      to: "Tool Handler"
      route_label: "애플리케이션이 도구 이름·인자·권한·범위를 검증한 뒤 실제 함수를 호출한다."
      active_actors: [model, tool]
      description: "모델 출력만으로 위험한 상태 변경을 실행하지 않도록 실행 경계를 둔다."
      payload: ["tool call", "arguments", "authorization"]
      outcomes:
        - status: allow
          text: "외부 상태 변경은 애플리케이션 정책 안에서 실행된다."
    - title: "3. 결과 기반 응답"
      from: "Tool Handler"
      to: "Final Answer"
      route_label: "도구 결과와 오류를 모델 컨텍스트에 넣어 최종 답변이나 다음 호출을 결정한다."
      active_actors: [tool, result, model]
      description: "도구 실패를 숨기지 않고 사용자 응답과 재시도 정책에 반영한다."
      payload: ["tool result", "error", "answer"]
      outcomes:
        - status: allow
          text: "생성 모델과 실제 시스템 데이터를 연결한다."

multi_model_strategy:
  eyebrow: "Interactive comparison"
  title: "멀티 모델 활용 전략"
  summary: "요청의 비용·지연·정확도·추론 난이도에 따라 모델을 선택하거나 단계별로 조합한다."
  actors:
    - id: request
      kind: "입력"
      name: "AI Request"
      description: "생성·분류·추출·요약 같은 업무 요청"
    - id: route
      kind: "라우팅"
      name: "Model Router"
      description: "업무 난이도와 운영 조건을 보고 모델을 선택"
    - id: fast
      kind: "효율 모델"
      name: "Fast / Small Model"
      description: "낮은 비용과 짧은 지연이 필요한 반복 작업"
    - id: strong
      kind: "고성능 모델"
      name: "Reasoning / Large Model"
      description: "복잡한 판단과 높은 품질이 필요한 작업"
  steps:
    - title: "1. 요청 분류"
      from: "AI Request"
      to: "Model Router"
      route_label: "질문의 난이도·민감도·지연·비용 조건을 평가한다."
      active_actors: [request, route]
      description: "모든 요청을 가장 큰 모델에 보내는 것이 최적은 아니다."
      payload: ["task type", "latency", "cost", "quality"]
      outcomes:
        - status: info
          text: "라우팅 기준을 측정 가능한 정책으로 만든다."
    - title: "2. 효율 모델 처리"
      from: "Model Router"
      to: "Fast / Small Model"
      route_label: "반복 분류·간단 추출·초안처럼 빠른 처리가 가능한 요청을 작은 모델에 보낸다."
      active_actors: [route, fast]
      description: "낮은 비용과 지연을 얻는 대신 품질 경계와 fallback을 정의한다."
      payload: ["classification", "draft", "low cost"]
      outcomes:
        - status: allow
          text: "단순 작업의 처리 비용을 낮춘다."
    - title: "3. 고성능 모델 처리"
      from: "Model Router"
      to: "Reasoning / Large Model"
      route_label: "복잡한 추론·긴 문맥·높은 정확도가 필요한 요청을 고성능 모델에 보낸다."
      active_actors: [route, strong, request]
      description: "품질 향상과 함께 비용·지연·제공자 의존성을 관찰한다."
      payload: ["reasoning", "long context", "fallback"]
      outcomes:
        - status: allow
          text: "업무 유형에 맞는 모델 선택으로 전체 시스템을 조정한다."

flyway_validate_sequence:
  eyebrow: "Interactive flow"
  title: "Flyway와 Hibernate Validate 실행 순서"
  summary: "Flyway가 스키마 마이그레이션을 먼저 적용하고 Hibernate Validate가 엔티티와 실제 스키마의 일치를 확인한다."
  actors:
    - id: app
      kind: "시작"
      name: "Spring Boot Startup"
      description: "애플리케이션 컨텍스트가 시작되는 과정"
    - id: flyway
      kind: "스키마 변경"
      name: "Flyway Migration"
      description: "버전 관리된 SQL을 순서대로 적용하는 도구"
    - id: validate
      kind: "검증"
      name: "Hibernate Validate"
      description: "엔티티 매핑과 데이터베이스 스키마를 비교하는 단계"
    - id: ready
      kind: "실행"
      name: "Application Ready"
      description: "검증을 통과해 요청을 받을 수 있는 상태"
  steps:
    - title: "1. 애플리케이션 시작"
      from: "Spring Boot Startup"
      to: "Flyway Migration"
      route_label: "Spring Boot가 시작되며 Flyway가 적용되지 않은 마이그레이션을 실행한다."
      active_actors: [app, flyway]
      description: "스키마 변경을 코드와 별도 버전 이력으로 관리한다."
      payload: ["startup", "version", "migration"]
      outcomes:
        - status: allow
          text: "운영 DB가 선언된 마이그레이션 이력에 맞춰진다."
    - title: "2. 매핑 검증"
      from: "Flyway Migration"
      to: "Hibernate Validate"
      route_label: "마이그레이션 이후 Hibernate가 엔티티 매핑과 현재 스키마를 검증한다."
      active_actors: [flyway, validate]
      description: "애플리케이션 모델과 DB 구조의 불일치를 시작 시점에 발견한다."
      payload: ["schema", "entity", "validate"]
      outcomes:
        - status: reject
          text: "검증 실패 시 애플리케이션을 정상 상태로 올리지 않는다."
    - title: "3. 요청 수락"
      from: "Hibernate Validate"
      to: "Application Ready"
      route_label: "마이그레이션과 검증을 모두 통과하면 애플리케이션이 요청을 받을 수 있다."
      active_actors: [validate, ready]
      description: "스키마 변경과 코드 배포의 호환성을 시작 단계에서 확인한다."
      payload: ["passed", "health", "ready"]
      outcomes:
        - status: allow
          text: "DB 변경과 애플리케이션 실행 순서가 명확하다."

flyway_defer_problem:
  eyebrow: "Interactive comparison"
  title: "defer-datasource-initialization=true의 순서 문제"
  summary: "초기화 스크립트가 Flyway 마이그레이션과 기대한 순서로 실행되지 않으면 없는 테이블을 참조할 수 있다."
  actors:
    - id: flyway
      kind: "마이그레이션"
      name: "Flyway"
      description: "테이블과 스키마를 버전별로 만드는 단계"
    - id: init
      kind: "초기화"
      name: "DataSource Initialization"
      description: "data.sql 같은 초기 데이터 스크립트"
    - id: schema
      kind: "대상"
      name: "Database Schema"
      description: "초기화 스크립트가 기대하는 테이블과 컬럼"
    - id: failure
      kind: "실패"
      name: "Startup Failure"
      description: "스키마 준비 전 스크립트가 실행되어 애플리케이션이 뜨지 않는 상태"
  steps:
    - title: "1. 초기화 실행"
      from: "DataSource Initialization"
      to: "Database Schema"
      route_label: "초기 데이터 스크립트가 필요한 테이블을 참조하려고 실행된다."
      active_actors: [init, schema]
      description: "스키마 생성보다 초기화가 먼저면 대상 테이블을 찾지 못할 수 있다."
      payload: ["data.sql", "insert", "table"]
      outcomes:
        - status: warning
          text: "초기화 스크립트의 실행 순서가 마이그레이션과 맞는지 확인한다."
    - title: "2. Flyway 순서 충돌"
      from: "DataSource Initialization"
      to: "Flyway"
      route_label: "defer 설정과 자동 구성 순서가 기대와 다르면 초기화 단계가 Flyway보다 앞설 수 있다."
      active_actors: [init, flyway]
      description: "설정 이름만 보고 실제 Spring Boot 자동 구성 순서를 추측하지 않는다."
      payload: ["auto configuration", "defer", "ordering"]
      outcomes:
        - status: reject
          text: "없는 스키마를 참조하면 시작 실패로 이어진다."
    - title: "3. 시작 실패"
      from: "Flyway"
      to: "Startup Failure"
      route_label: "마이그레이션·초기화·검증 순서가 어긋난 상태에서 컨텍스트가 종료된다."
      active_actors: [flyway, failure, schema]
      description: "로그에서 실제 실행 순서와 최초 SQL 오류를 확인해야 한다."
      payload: ["exception", "missing table", "context close"]
      outcomes:
        - status: reject
          text: "초기화 순서와 스키마 책임을 하나의 정책으로 정리해야 한다."

flyway_defer_solution:
  eyebrow: "Interactive flow"
  title: "Flyway 이후 데이터 초기화"
  summary: "Flyway가 스키마를 만든 뒤 초기화 스크립트와 Hibernate 검증이 실행되도록 순서를 명시한다."
  actors:
    - id: flyway
      kind: "1단계"
      name: "Flyway Migration"
      description: "버전 SQL로 테이블·컬럼을 준비"
    - id: init
      kind: "2단계"
      name: "Data Initialization"
      description: "준비된 스키마에 초기 데이터를 입력"
    - id: validate
      kind: "3단계"
      name: "Hibernate Validate"
      description: "엔티티와 변경된 스키마를 비교"
    - id: ready
      kind: "결과"
      name: "Ready Application"
      description: "초기 데이터와 매핑 검증을 통과한 애플리케이션"
  steps:
    - title: "1. 스키마 준비"
      from: "Flyway Migration"
      to: "Data Initialization"
      route_label: "Flyway가 필요한 테이블과 컬럼을 먼저 만든 뒤 초기화 단계로 넘긴다."
      active_actors: [flyway, init]
      description: "스키마의 생성·변경 이력은 Flyway가 단일 책임으로 맡는다."
      payload: ["V1", "V2", "table ready"]
      outcomes:
        - status: allow
          text: "초기화 스크립트가 참조할 구조가 존재한다."
    - title: "2. 초기 데이터 입력"
      from: "Data Initialization"
      to: "Hibernate Validate"
      route_label: "초기 데이터가 준비된 스키마에 입력되고 애플리케이션 매핑 검증으로 이어진다."
      active_actors: [init, validate]
      description: "개발용 초기화와 운영 마이그레이션을 같은 파일·책임으로 섞지 않는다."
      payload: ["seed", "data.sql", "schema"]
      outcomes:
        - status: info
          text: "환경별 초기 데이터 정책을 분리해 관리한다."
    - title: "3. 최종 검증"
      from: "Hibernate Validate"
      to: "Ready Application"
      route_label: "Hibernate가 스키마와 엔티티를 검증한 뒤 애플리케이션을 준비 상태로 전환한다."
      active_actors: [validate, ready, flyway]
      description: "변경 순서와 검증 실패를 시작 시점에 확인해 런타임 오류를 줄인다."
      payload: ["validate", "health", "ready"]
      outcomes:
        - status: allow
          text: "Flyway·초기화·Hibernate의 책임과 순서가 분리된다."

custom_agent_chain:
  eyebrow: "Interactive flow"
  title: "직접 구축한 AI 개발 Agent Chain"
  summary: "요청을 해석하고 계획·코드 변경·검증 에이전트를 연결해 개발 작업의 반복 흐름을 자동화한다."
  actors:
    - id: request
      kind: "입력"
      name: "Developer Request"
      description: "버그 수정·기능 추가·리뷰 같은 개발 요청"
    - id: plan
      kind: "계획"
      name: "Planner Agent"
      description: "작업 범위와 실행 순서를 정리하는 에이전트"
    - id: implement
      kind: "구현"
      name: "Coding Agent"
      description: "저장소를 읽고 코드·테스트를 변경하는 에이전트"
    - id: verify
      kind: "검증"
      name: "Review / Test Agent"
      description: "diff·테스트·정적 검사를 확인하고 피드백을 만드는 에이전트"
  steps:
    - title: "1. 요청 계획화"
      from: "Developer Request"
      to: "Planner Agent"
      route_label: "개발 요청을 완료 조건과 작은 작업 단계로 분해한다."
      active_actors: [request, plan]
      description: "에이전트 체인의 첫 단계에서 범위와 위험을 명확히 한다."
      payload: ["task", "scope", "acceptance"]
      outcomes:
        - status: allow
          text: "다음 에이전트가 실행할 기준이 생긴다."
    - title: "2. 코드 변경"
      from: "Planner Agent"
      to: "Coding Agent"
      route_label: "계획과 저장소 규칙을 바탕으로 필요한 파일과 테스트를 수정한다."
      active_actors: [plan, implement]
      description: "실행 에이전트는 계획 범위 안에서 도구와 변경을 수행한다."
      payload: ["files", "patch", "tests"]
      outcomes:
        - status: info
          text: "생성된 변경은 다음 검증 단계의 입력이다."
    - title: "3. 검증 피드백"
      from: "Coding Agent"
      to: "Review / Test Agent"
      route_label: "변경 diff와 테스트 결과를 검사하고 통과·수정·재실행을 판단한다."
      active_actors: [implement, verify, plan]
      description: "체인이 끝나는 조건과 실패 시 다시 어느 단계로 돌아갈지 정의한다."
      payload: ["diff", "test result", "feedback"]
      outcomes:
        - status: allow
          text: "계획·구현·검증이 반복 가능한 개발 루프로 이어진다."

agents_context_flow:
  eyebrow: "Interactive flow"
  title: "AGENTS.md 중심 컨텍스트 흐름"
  summary: "저장소 규칙을 먼저 읽고 작업 범위·도구·검증 기준을 정한 뒤 코드 변경을 수행한다."
  actors:
    - id: repo
      kind: "작업 공간"
      name: "Repository"
      description: "코드·문서·설정과 팀의 작업 규칙이 있는 저장소"
    - id: guide
      kind: "규칙"
      name: "AGENTS.md"
      description: "디렉터리별 운영·테스트·변경 범위를 설명하는 지침"
    - id: context
      kind: "컨텍스트"
      name: "Task Context"
      description: "현재 요청에 필요한 파일·의존성·검증 정보를 선별한 상태"
    - id: change
      kind: "실행"
      name: "Implementation + Validation"
      description: "지침을 지키며 변경하고 테스트·diff로 결과를 확인"
  steps:
    - title: "1. 저장소 규칙 탐색"
      from: "Repository"
