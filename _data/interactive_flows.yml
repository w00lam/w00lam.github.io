      outcomes:
        - status: warning
          text: "이벤트를 잃으면 내부 주문 상태가 외부 결제와 달라질 수 있다."
    - title: "3. 불일치 감지"
      from: "Message / Event"
      to: "Inconsistent State"
      route_label: "한쪽 변경만 반영되거나 보상 이벤트가 실패하면 불일치 상태가 남는다."
      active_actors: [event, mismatch, order, payment]
      description: "재conciliation·보상·운영 알림을 포함한 최종 복구 전략이 필요하다."
      payload: ["mismatch", "compensation", "reconciliation"]
      outcomes:
        - status: reject
          text: "분산 트랜잭션은 실패가 없다고 가정하지 않고 복구 경로를 설계한다."

transactional_outbox:
  eyebrow: "Interactive flow"
  title: "Transactional Outbox 패턴"
  summary: "업무 데이터와 발행할 이벤트를 같은 DB 트랜잭션에 저장한 뒤 별도 Publisher가 안전하게 전달한다."
  actors:
    - id: service
      kind: "업무 처리"
      name: "Order Service"
      description: "주문 상태를 변경하는 애플리케이션"
    - id: db
      kind: "원자 저장"
      name: "Business + Outbox Tables"
      description: "업무 행과 이벤트 행을 함께 저장하는 DB"
    - id: publisher
      kind: "발행"
      name: "Outbox Publisher"
      description: "미발행 이벤트를 읽어 메시지 브로커로 전달"
    - id: broker
      kind: "전달"
      name: "Kafka / Message Broker"
      description: "후속 소비자에게 이벤트를 전달하는 시스템"
  steps:
    - title: "1. 업무와 이벤트 저장"
      from: "Order Service"
      to: "Business + Outbox Tables"
      route_label: "주문 변경과 발행할 이벤트를 하나의 DB 트랜잭션으로 저장한다."
      active_actors: [service, db]
      description: "업무 커밋은 성공했는데 이벤트만 유실되는 간격을 줄인다."
      payload: ["order update", "outbox row", "transaction"]
      outcomes:
        - status: allow
          text: "업무 상태와 발행 의도가 같은 커밋으로 기록된다."
    - title: "2. 미발행 이벤트 조회"
      from: "Business + Outbox Tables"
      to: "Outbox Publisher"
      route_label: "Publisher가 아직 발행되지 않은 outbox 행을 읽고 재시도 가능한 상태로 관리한다."
      active_actors: [db, publisher]
      description: "Publisher 장애가 있어도 이벤트가 DB에 남아 복구 후 재발행할 수 있다."
      payload: ["pending", "claim", "retry"]
      outcomes:
        - status: info
          text: "중복 발행을 고려해 소비자 멱등성도 함께 설계한다."
    - title: "3. 브로커 발행"
      from: "Outbox Publisher"
      to: "Kafka / Message Broker"
      route_label: "읽은 이벤트를 브로커에 발행하고 성공 시 outbox 상태를 완료로 갱신한다."
      active_actors: [publisher, broker, db]
      description: "발행과 완료 표시 사이의 실패도 재시도·중복 정책으로 다룬다."
      payload: ["publish", "event id", "sent"]
      outcomes:
        - status: allow
          text: "DB 변경과 이벤트 전달 사이의 신뢰성을 높인다."

saga_orchestration:
  eyebrow: "Interactive flow"
  title: "Saga 오케스트레이션"
  summary: "중앙 Orchestrator가 분산된 서비스 작업을 순서대로 호출하고 실패 시 보상 작업을 지시한다."
  actors:
    - id: orchestrator
      kind: "조정자"
      name: "Saga Orchestrator"
      description: "전체 단계와 현재 상태를 관리하는 중앙 흐름"
    - id: order
      kind: "단계 1"
      name: "Order Service"
      description: "주문 생성·상태 변경을 담당"
    - id: inventory
      kind: "단계 2"
      name: "Inventory / Payment"
      description: "재고 예약·결제 승인 같은 후속 서비스"
    - id: compensate
      kind: "복구"
      name: "Compensation Commands"
      description: "예약 취소·결제 취소·주문 보류 같은 역방향 명령"
  steps:
    - title: "1. 첫 단계 실행"
      from: "Saga Orchestrator"
      to: "Order Service"
      route_label: "Orchestrator가 주문 생성 같은 첫 번째 로컬 트랜잭션을 호출한다."
      active_actors: [orchestrator, order]
      description: "각 서비스는 자신의 DB 트랜잭션만 커밋한다."
      payload: ["command", "order", "local commit"]
      outcomes:
        - status: allow
          text: "분산 흐름의 진행 상태가 중앙에 기록된다."
    - title: "2. 다음 단계 실행"
      from: "Order Service"
      to: "Inventory / Payment"
      route_label: "주문 성공 후 재고 예약·결제 승인 같은 다음 로컬 트랜잭션을 호출한다."
      active_actors: [order, inventory, orchestrator]
      description: "각 단계의 성공·실패와 재시도 가능성을 상태로 관리한다."
      payload: ["reserve", "authorize", "status"]
      outcomes:
        - status: info
          text: "전체 단계가 하나의 ACID 트랜잭션으로 묶이지 않는다."
    - title: "3. 실패 보상"
      from: "Inventory / Payment"
      to: "Compensation Commands"
      route_label: "후속 단계가 실패하면 이미 성공한 앞 단계에 대응하는 보상 명령을 실행한다."
      active_actors: [inventory, compensate, orchestrator, order]
      description: "보상 순서·멱등성·수동 개입을 포함해 최종 상태를 닫는다."
      payload: ["cancel", "refund", "compensate"]
      outcomes:
        - status: allow
          text: "분산 작업의 성공과 실패를 명시적인 상태 머신으로 운영한다."

querydsl_qtype:
  eyebrow: "Interactive flow"
  title: "QueryDSL Q-Type 생성과 동적 쿼리"
  summary: "엔티티 메타모델에서 Q-Type을 생성하고 타입 안전한 조건을 조합해 동적 조회를 만든다."
  actors:
    - id: entity
      kind: "모델"
      name: "JPA Entity"
      description: "조회 대상과 연관관계를 정의한 엔티티"
    - id: qtype
      kind: "메타모델"
      name: "Q-Type"
      description: "컴파일 타임 타입 정보를 가진 QueryDSL 경로 객체"
    - id: predicate
      kind: "조건 조합"
      name: "Predicate Builder"
      description: "검색어·기간·상태 조건을 선택적으로 조합"
    - id: query
      kind: "실행"
      name: "Repository Query"
      description: "조합된 조건으로 데이터베이스를 조회"
  steps:
    - title: "1. Q-Type 생성"
      from: "JPA Entity"
      to: "Q-Type"
      route_label: "빌드 시 엔티티 구조를 기준으로 Q-Type 메타모델을 생성한다."
      active_actors: [entity, qtype]
      description: "문자열 필드명 대신 타입이 있는 경로로 쿼리를 작성한다."
      payload: ["entity", "annotation processing", "QUser"]
      outcomes:
        - status: allow
          text: "필드명 변경을 컴파일 타임에 발견할 가능성이 높아진다."
    - title: "2. 조건 조합"
      from: "Q-Type"
      to: "Predicate Builder"
      route_label: "입력된 검색 조건이 있을 때만 BooleanExpression을 조합한다."
      active_actors: [qtype, predicate]
      description: "동적 검색 조건과 고정된 조회 구조를 분리한다."
      payload: ["where", "BooleanExpression", "optional filter"]
      outcomes:
        - status: info
          text: "빈 조건과 null 처리 정책도 쿼리 계약에 포함한다."
    - title: "3. 타입 안전 조회"
      from: "Predicate Builder"
      to: "Repository Query"
      route_label: "조합된 조건을 Repository 구현에서 실행해 원하는 결과를 조회한다."
      active_actors: [predicate, query]
      description: "조건 생성과 저장소 호출의 책임을 나눠 테스트와 재사용을 쉽게 한다."
      payload: ["select", "join", "order by"]
      outcomes:
        - status: allow
          text: "동적 쿼리의 의도와 타입 정보가 코드에 남는다."

repository_roles:
  eyebrow: "Interactive comparison"
  title: "Repository 역할 분담"
  summary: "Spring Data 기본 기능과 QueryDSL 동적 조회, 도메인 저장 책임을 서로 다른 경계로 나눈다."
  actors:
    - id: domain
      kind: "업무 호출"
      name: "Domain / UseCase"
      description: "업무 규칙과 필요한 조회를 요청하는 계층"
    - id: spring
      kind: "기본 저장"
      name: "Spring Data Repository"
      description: "단순 CRUD·메서드 쿼리를 제공하는 인터페이스"
    - id: querydsl
      kind: "동적 조회"
      name: "QueryDSL Custom Impl"
      description: "복잡한 조건·조인·정렬을 구현하는 사용자 정의 저장소"
    - id: db
      kind: "영속성"
      name: "Database"
      description: "실제 데이터를 저장하고 조회하는 시스템"
  steps:
    - title: "1. 단순 기능 위임"
      from: "Domain / UseCase"
      to: "Spring Data Repository"
      route_label: "단순 저장·조회는 Spring Data가 제공하는 계약으로 위임한다."
      active_actors: [domain, spring]
      description: "반복적인 CRUD 구현을 업무 계층에 노출하지 않는다."
      payload: ["save", "findById", "delete"]
      outcomes:
        - status: allow
          text: "기본 저장 책임을 작은 인터페이스로 유지한다."
    - title: "2. 복잡 조회 분리"
      from: "Domain / UseCase"
      to: "QueryDSL Custom Impl"
      route_label: "동적 조건·다중 조인·복잡한 정렬은 사용자 정의 구현으로 분리한다."
      active_actors: [domain, querydsl]
      description: "조회 구현 세부가 유스케이스와 엔티티 모델을 오염시키지 않도록 한다."
      payload: ["dynamic query", "join", "projection"]
      outcomes:
        - status: info
          text: "복잡도에 따라 Repository 구현을 확장한다."
    - title: "3. DB 실행"
      from: "Spring Data Repository"
      to: "Database"
      route_label: "기본 기능과 사용자 정의 조회가 각각 SQL로 변환되어 데이터베이스에서 실행된다."
      active_actors: [spring, querydsl, db]
      description: "저장소 역할을 나눠도 인덱스·실행 계획·트랜잭션 책임은 함께 확인한다."
      payload: ["SQL", "transaction", "index"]
      outcomes:
        - status: allow
          text: "호출부는 저장소 계약에 집중하고 조회 구현은 내부에 둔다."

redistemplate_workflow:
  eyebrow: "Interactive flow"
  title: "RedisTemplate 동작 흐름"
  summary: "Spring 애플리케이션이 RedisTemplate으로 키·직렬화·명령을 조합해 캐시·세션·분산 상태를 다룬다."
  actors:
    - id: service
      kind: "업무 계층"
      name: "Spring Service"
      description: "캐시 조회·저장이나 Redis 자료구조를 요청하는 서비스"
    - id: template
      kind: "접근 추상화"
      name: "RedisTemplate"
      description: "연결·직렬화·자료구조별 연산을 제공하는 Spring API"
    - id: connection
      kind: "연결"
      name: "Connection Factory"
      description: "Redis 연결 풀과 명령 실행을 관리하는 구성"
    - id: redis
      kind: "저장소"
      name: "Redis"
      description: "키·값과 Hash·List·Set·ZSet을 저장하는 서버"
  steps:
    - title: "1. 업무 요청"
      from: "Spring Service"
      to: "RedisTemplate"
      route_label: "서비스가 캐시 키와 값, 자료구조 연산을 RedisTemplate에 요청한다."
      active_actors: [service, template]
      description: "키 설계와 캐시 무효화 정책은 Template 밖의 도메인 책임이다."
      payload: ["key", "value", "opsForValue"]
      outcomes:
        - status: info
          text: "Redis 명령과 캐시 정책을 구분한다."
    - title: "2. 직렬화·연결"
      from: "RedisTemplate"
      to: "Connection Factory"
      route_label: "Template이 key·value serializer와 연결 설정으로 Redis 명령을 준비한다."
      active_actors: [template, connection]
      description: "직렬화 형식이 다른 클라이언트와 호환되는지 확인한다."
      payload: ["serializer", "connection", "command"]
      outcomes:
        - status: allow
          text: "애플리케이션 객체와 Redis 저장 형식이 명시적으로 연결된다."
    - title: "3. Redis 연산"
      from: "Connection Factory"
      to: "Redis"
      route_label: "준비된 명령이 Redis에 실행되고 결과가 서비스로 반환된다."
      active_actors: [connection, redis, service]
      description: "타임아웃·장애·캐시 미스·무효화 정책을 운영 흐름에 포함한다."
      payload: ["GET", "SET", "TTL", "result"]
      outcomes:
        - status: allow
          text: "Redis 접근의 기술 계층과 캐시 의미를 분리해 관리한다."

mysql_index_optimizer:
  eyebrow: "Interactive flow"
  title: "MySQL 인덱스와 옵티마이저"
  summary: "쿼리 조건과 인덱스 통계를 바탕으로 옵티마이저가 접근 경로를 선택하고 실행 계획을 만든다."
  actors:
    - id: query
      kind: "요청"
      name: "SQL Query"
      description: "WHERE·JOIN·ORDER BY가 포함된 조회 요청"
    - id: index
      kind: "접근 구조"
      name: "Index"
      description: "조건에 맞는 행을 빠르게 찾기 위한 자료구조"
    - id: optimizer
      kind: "선택"
      name: "Query Optimizer"
      description: "통계·비용·가능한 경로를 비교하는 DB 구성요소"
    - id: plan
      kind: "실행"
      name: "Execution Plan"
      description: "테이블 스캔·인덱스 스캔·조인 순서를 담은 계획"
  steps:
    - title: "1. 쿼리 분석"
      from: "SQL Query"
      to: "Query Optimizer"
      route_label: "옵티마이저가 조건·조인·정렬과 테이블 통계를 분석한다."
      active_actors: [query, optimizer]
      description: "인덱스가 존재한다는 사실만으로 항상 선택되는 것은 아니다."
      payload: ["WHERE", "JOIN", "statistics"]
      outcomes:
        - status: info
          text: "실행 계획은 쿼리와 데이터 분포의 조합으로 결정된다."
    - title: "2. 접근 경로 비교"
      from: "Query Optimizer"
      to: "Index"
      route_label: "옵티마이저가 인덱스 사용과 풀스캔의 비용을 비교한다."
      active_actors: [optimizer, index]
      description: "선택도·정렬·커버링 여부와 통계 최신성이 경로 선택에 영향을 준다."
      payload: ["selectivity", "index range", "full scan"]
      outcomes:
        - status: allow
          text: "조건에 맞는 인덱스 경로를 선택할 수 있다."
    - title: "3. 계획 실행"
      from: "Index"
      to: "Execution Plan"
      route_label: "선택된 스캔·조인·정렬 계획으로 실제 행을 읽고 결과를 만든다."
      active_actors: [index, plan, query]
      description: "EXPLAIN으로 예상·실제 행 수와 비용을 확인하며 인덱스를 조정한다."
      payload: ["EXPLAIN", "rows", "cost"]
      outcomes:
        - status: allow
          text: "인덱스 설계를 실행 계획과 측정 결과로 검증한다."

websocket_stomp_relation:
  eyebrow: "Interactive comparison"
  title: "WebSocket과 STOMP 관계"
  summary: "WebSocket은 지속 연결과 양방향 전송을 제공하고 STOMP는 그 위에 메시지·destination·구독 규칙을 얹는다."
  actors:
    - id: client
      kind: "클라이언트"
      name: "Browser Client"
      description: "실시간 메시지를 보내고 구독하는 브라우저"
    - id: ws
      kind: "전송 계층"
      name: "WebSocket"
      description: "서버와 클라이언트 사이의 지속적인 양방향 연결"
    - id: stomp
      kind: "메시지 규칙"
      name: "STOMP Frame"
      description: "CONNECT·SUBSCRIBE·SEND 같은 메시지 프로토콜"
    - id: broker
      kind: "라우팅"
      name: "Simple Broker / Handler"
      description: "destination과 구독자를 기준으로 메시지를 전달"
  steps:
    - title: "1. 연결 수립"
      from: "Browser Client"
      to: "WebSocket"
      route_label: "브라우저가 HTTP upgrade를 통해 지속적인 WebSocket 연결을 만든다."
      active_actors: [client, ws]
      description: "연결 수명과 인증·재연결 정책을 먼저 정의한다."
      payload: ["upgrade", "connection", "session"]
      outcomes:
        - status: allow
          text: "양방향 실시간 전송 경로가 열린다."
    - title: "2. STOMP 프레임"
      from: "WebSocket"
      to: "STOMP Frame"
      route_label: "WebSocket 프레임 안에 destination·구독·메시지 규칙을 담은 STOMP 프레임을 보낸다."
      active_actors: [ws, stomp, client]
      description: "전송 연결과 애플리케이션 메시지 모델을 분리한다."
      payload: ["CONNECT", "SUBSCRIBE", "SEND"]
      outcomes:
        - status: info
          text: "STOMP가 WebSocket 자체에 목적지·구독 의미를 추가한다."
    - title: "3. 브로커 라우팅"
      from: "STOMP Frame"
      to: "Simple Broker / Handler"
      route_label: "브로커나 메시지 핸들러가 destination과 구독자를 기준으로 메시지를 전달한다."
      active_actors: [stomp, broker, client]
      description: "브로커 구성과 서버 핸들러의 책임을 구분해 확장성을 설계한다."
      payload: ["destination", "subscription", "broadcast"]
      outcomes:
        - status: allow
          text: "실시간 메시지의 전송과 라우팅 규칙이 명시된다."

vector_db_ingestion:
  eyebrow: "Interactive flow"
  title: "Vector DB Ingestion Pipeline"
  summary: "문서를 청크로 나누고 임베딩을 계산해 메타데이터와 함께 Vector DB에 저장한다."
  actors:
    - id: docs
      kind: "원문"
      name: "Documents"
      description: "PDF·마크다운·웹 문서 같은 색인 대상"
    - id: chunk
      kind: "분할"
      name: "Chunker"
      description: "문서를 검색 가능한 의미 단위로 나누는 구성"
    - id: embed
      kind: "변환"
      name: "Embedding Model"
      description: "각 청크를 벡터로 변환하는 모델"
    - id: db
      kind: "저장"
      name: "Vector DB"
      description: "벡터·원문·메타데이터를 저장하고 유사 검색을 제공"
  steps:
    - title: "1. 문서 분할"
      from: "Documents"
      to: "Chunker"
      route_label: "원문을 제목·문단·토큰 경계를 고려한 검색 청크로 나눈다."
      active_actors: [docs, chunk]
      description: "청크 크기와 overlap이 나중의 검색 문맥과 비용을 좌우한다."
      payload: ["document", "chunk", "metadata"]
      outcomes:
        - status: info
          text: "청크가 너무 작거나 크지 않도록 실제 질문으로 검증한다."
    - title: "2. 임베딩 생성"
      from: "Chunker"
      to: "Embedding Model"
      route_label: "각 청크의 의미를 벡터로 변환한다."
      active_actors: [chunk, embed]
      description: "모델 버전과 전처리를 색인·검색에서 일치시켜야 한다."
      payload: ["chunk text", "embedding", "model version"]
      outcomes:
        - status: allow
          text: "문서 청크가 의미 검색 가능한 표현으로 변환된다."
    - title: "3. Vector DB 저장"
      from: "Embedding Model"
      to: "Vector DB"
      route_label: "벡터와 원문·출처·권한·날짜 메타데이터를 함께 저장한다."
      active_actors: [embed, db, docs]
      description: "벡터만 저장하면 답변 출처와 필터 조건을 복원하기 어렵다."
      payload: ["vector", "source", "metadata", "upsert"]
      outcomes:
        - status: allow
          text: "질의 시 유사 청크와 원문 근거를 함께 회수할 수 있다."

vector_db_rag_role:
  eyebrow: "Interactive flow"
  title: "RAG에서 Vector DB의 역할"
  summary: "질문을 벡터로 바꾸고 Vector DB에서 관련 청크를 찾아 LLM의 컨텍스트로 전달한다."
  actors:
    - id: query
      kind: "질문"
      name: "User Query"
      description: "사용자가 입력한 자연어 질문"
    - id: embed
      kind: "질의 변환"
      name: "Query Embedding"
      description: "질문을 문서 색인과 같은 벡터 공간으로 변환"
    - id: db
      kind: "검색"
      name: "Vector DB Retrieval"
      description: "유사도와 메타데이터 조건으로 관련 청크를 검색"
    - id: llm
      kind: "생성"
      name: "LLM with Context"
      description: "검색 근거를 컨텍스트로 받아 답변을 생성"
  steps:
    - title: "1. 질문 임베딩"
      from: "User Query"
      to: "Query Embedding"
      route_label: "사용자 질문을 문서 임베딩과 같은 벡터 표현으로 변환한다."
      active_actors: [query, embed]
      description: "질문 표현과 문서 표현의 공간이 맞아야 유사 검색이 의미 있다."
      payload: ["query", "embedding", "dimension"]
      outcomes:
        - status: allow
          text: "질문이 검색 가능한 좌표로 바뀐다."
    - title: "2. 근거 검색"
      from: "Query Embedding"
      to: "Vector DB Retrieval"
      route_label: "질문 벡터와 가까운 청크를 top-k와 필터 조건으로 회수한다."
      active_actors: [embed, db]
      description: "Vector DB는 답변을 생성하지 않고 검색 근거를 제공한다."
      payload: ["similarity", "top-k", "metadata filter"]
      outcomes:
        - status: info
          text: "검색 품질이 낮으면 생성 모델만 바꿔도 근거 문제는 남는다."
    - title: "3. 근거 기반 생성"
      from: "Vector DB Retrieval"
      to: "LLM with Context"
      route_label: "검색된 청크와 출처를 프롬프트 컨텍스트로 넣어 답변을 생성한다."
      active_actors: [db, llm, query]
      description: "검색 결과의 출처와 답변의 충실성을 함께 검증한다."
      payload: ["context", "citation", "answer"]
      outcomes:
        - status: allow
          text: "Vector DB가 원문 근거와 생성 모델 사이의 검색 계층이 된다."

jpa_cascade_orphan:
  eyebrow: "Interactive comparison"
  title: "JPA Cascade와 orphanRemoval"
  summary: "Cascade는 부모 작업을 자식에 전파하고 orphanRemoval은 관계에서 분리된 자식의 삭제 정책을 표현한다."
  actors:
    - id: parent
      kind: "부모 엔티티"
      name: "Parent Entity"
      description: "자식 컬렉션의 생명주기를 관리하는 엔티티"
    - id: cascade
      kind: "전파"
      name: "Cascade"
      description: "persist·remove 같은 부모 작업을 자식에 전달하는 설정"
    - id: child
      kind: "자식 엔티티"
      name: "Child Entity"
      description: "부모와 연관된 자식 데이터"
    - id: orphan
      kind: "삭제 정책"
      name: "orphanRemoval"
      description: "관계에서 제거된 자식을 삭제할지 결정하는 정책"
  steps:
    - title: "1. 부모 작업"
      from: "Parent Entity"
      to: "Cascade"
      route_label: "부모 저장·삭제 작업에 cascade 설정이 적용되는지 확인한다."
      active_actors: [parent, cascade]
      description: "전파 범위가 도메인 소유권과 실제 생명주기에 맞아야 한다."
      payload: ["persist", "remove", "cascade type"]
      outcomes:
        - status: info
          text: "Cascade는 모든 연관관계에 무조건 켜는 옵션이 아니다."
    - title: "2. 자식 작업 전파"
      from: "Cascade"
      to: "Child Entity"
      route_label: "부모 작업이 설정된 cascade 종류에 따라 자식 엔티티에도 전파된다."
      active_actors: [cascade, child, parent]
      description: "자식이 부모에 완전히 소유되는지와 공유되는지 구분한다."
      payload: ["child persist", "child remove", "ownership"]
      outcomes:
        - status: allow
          text: "부모와 자식의 저장 생명주기를 함께 조정할 수 있다."
    - title: "3. 관계 분리"
      from: "Parent Entity"
      to: "orphanRemoval"
      route_label: "컬렉션에서 자식을 제거했을 때 orphanRemoval 정책에 따라 DB 삭제를 수행한다."
      active_actors: [parent, orphan, child]
      description: "관계에서 분리된 자식을 실제로 삭제해도 되는지 도메인 의미를 확인한다."
      payload: ["remove from collection", "orphan", "DELETE"]
      outcomes:
        - status: warning
          text: "단순 연관관계 해제가 실제 데이터 삭제가 될 수 있다."

requires_new_audit:
  eyebrow: "Interactive flow"
  title: "REQUIRES_NEW 감사 로그"
  summary: "업무 트랜잭션과 감사 로그를 별도 트랜잭션으로 분리해 원래 작업이 롤백돼도 기록을 남길 수 있다."
  actors:
    - id: business
      kind: "업무 트랜잭션"
      name: "Business Transaction"
      description: "주문·설정 변경 같은 원래 업무 트랜잭션"
    - id: suspend
      kind: "경계 전환"
      name: "Suspend Outer TX"
      description: "바깥 트랜잭션을 잠시 중단하는 Spring 전파 동작"
    - id: audit
      kind: "감사 기록"
      name: "Audit Transaction"
      description: "감사 이력을 별도로 커밋하는 새 트랜잭션"
    - id: result
      kind: "최종 상태"
      name: "Commit / Rollback"
      description: "업무와 감사 로그의 독립적인 커밋 결과"
  steps:
    - title: "1. 업무 변경"
      from: "Business Transaction"
      to: "Suspend Outer TX"
      route_label: "업무 트랜잭션 안에서 상태 변경을 수행한 뒤 감사 로깅 호출에 진입한다."
      active_actors: [business, suspend]
      description: "감사 로그를 같은 트랜잭션으로 묶을지 별도로 남길지 요구사항을 확인한다."
      payload: ["business change", "outer transaction", "audit call"]
      outcomes:
        - status: info
          text: "트랜잭션 전파 설정이 기록의 생존 범위를 바꾼다."
    - title: "2. 감사 커밋"
      from: "Suspend Outer TX"
      to: "Audit Transaction"
      route_label: "REQUIRES_NEW가 새 트랜잭션을 시작해 감사 로그를 별도로 저장한다."
      active_actors: [suspend, audit]
      description: "새 트랜잭션은 별도 커밋과 연결 자원을 사용한다."
      payload: ["REQUIRES_NEW", "audit row", "commit"]
      outcomes:
        - status: allow
          text: "바깥 업무 트랜잭션과 감사 기록의 커밋을 분리한다."
    - title: "3. 업무 결과 결정"
      from: "Audit Transaction"
      to: "Commit / Rollback"
      route_label: "감사 커밋 후 바깥 업무가 커밋되거나 실패해 롤백된다."
      active_actors: [audit, result, business]
      description: "감사 로그가 남았다는 사실과 업무 변경 성공은 별개의 결과다."
      payload: ["audit committed", "business commit", "business rollback"]
      outcomes:
        - status: warning
          text: "감사 로그와 실제 상태의 해석 규칙을 운영자가 알아야 한다."

websocket_broker_flow:
  eyebrow: "Interactive flow"
  title: "WebSocket STOMP 브로커 흐름"
  summary: "클라이언트가 destination을 구독하고 서버가 메시지를 발행하면 Simple Broker가 구독자에게 전달한다."
  actors:
    - id: client
      kind: "구독자"
      name: "STOMP Client"
      description: "destination을 구독하고 메시지를 받는 클라이언트"
    - id: handler
      kind: "서버 핸들러"
      name: "Message Handler"
      description: "클라이언트 메시지를 처리하거나 서버 이벤트를 발행"
    - id: broker
      kind: "라우터"
      name: "Simple Broker"
      description: "destination과 구독 목록을 관리하는 메시지 브로커"
    - id: topic
      kind: "목적지"
      name: "Topic / Queue"
      description: "구독·전달 대상이 되는 논리적 메시지 주소"
  steps:
    - title: "1. destination 구독"
      from: "STOMP Client"
      to: "Simple Broker"
      route_label: "클라이언트가 SUBSCRIBE 프레임으로 topic이나 queue를 구독한다."
      active_actors: [client, broker, topic]
      description: "브로커가 현재 연결과 destination의 관계를 기록한다."
      payload: ["SUBSCRIBE", "destination", "session"]
      outcomes:
        - status: allow
          text: "실시간 전달 대상이 등록된다."
    - title: "2. 서버 메시지 발행"
      from: "Message Handler"
      to: "Topic / Queue"
      route_label: "서버 핸들러가 destination으로 메시지를 발행한다."
      active_actors: [handler, topic, broker]
      description: "업무 이벤트와 전송 메시지 변환을 서버 경계에서 관리한다."
      payload: ["SEND", "payload", "destination"]
      outcomes:
        - status: info
          text: "메시지 발행 방식과 브로커 라우팅을 분리한다."
    - title: "3. 구독자 전달"
      from: "Topic / Queue"
      to: "STOMP Client"
      route_label: "브로커가 해당 destination을 구독한 클라이언트에 메시지를 전달한다."
      active_actors: [broker, topic, client]
      description: "연결 종료·재구독·중복 수신과 권한 정책도 함께 운영한다."
      payload: ["MESSAGE", "broadcast", "subscription"]
      outcomes:
        - status: allow
          text: "서버 이벤트가 실시간 구독자에게 fan-out된다."

sendto_template_compare:
  eyebrow: "Interactive comparison"
  title: "@SendTo와 SimpMessagingTemplate"
  summary: "@SendTo는 핸들러 반환값을 목적지로 보내고 Template은 코드가 원하는 시점과 조건에 직접 메시지를 발행한다."
  actors:
    - id: handler
      kind: "메시지 처리"
      name: "Message Handler"
      description: "클라이언트 메시지나 서버 이벤트를 처리하는 메서드"
    - id: sendto
      kind: "선언형 발행"
      name: "@SendTo"
      description: "메서드 반환값을 지정 destination에 보내는 어노테이션"
    - id: template
      kind: "명시적 발행"
      name: "SimpMessagingTemplate"
      description: "임의의 서비스·조건·시점에서 메시지를 보내는 API"
    - id: client
      kind: "수신"
      name: "Subscribers"
      description: "destination을 구독한 실시간 클라이언트"
  steps:
    - title: "1. 핸들러 반환"
      from: "Message Handler"
      to: "@SendTo"
      route_label: "핸들러가 반환한 값을 어노테이션의 destination으로 보낸다."
      active_actors: [handler, sendto]
      description: "요청-응답형 메시지 흐름과 목적지가 단순할 때 읽기 쉽다."
      payload: ["return value", "destination", "declarative"]
      outcomes:
        - status: allow
          text: "메서드 결과와 발행 위치가 한눈에 연결된다."
    - title: "2. 조건부 발행"
      from: "Message Handler"
      to: "SimpMessagingTemplate"
      route_label: "서비스나 이벤트 처리 코드가 필요한 destination과 payload를 직접 지정한다."
      active_actors: [handler, template]
      description: "요청 처리 밖의 이벤트·조건·여러 대상 발행에 유연하다."
      payload: ["convertAndSend", "event", "dynamic destination"]
      outcomes:
        - status: info
          text: "명시적인 발행 책임과 테스트 범위를 관리한다."
    - title: "3. 구독자 전달"
      from: "@SendTo"
      to: "Subscribers"
      route_label: "두 방식 모두 최종적으로 브로커가 destination 구독자에게 메시지를 전달한다."
      active_actors: [sendto, template, client]
      description: "선택 기준은 메시지 발생 위치와 제어 필요성이다."
      payload: ["destination", "payload", "subscriber"]
      outcomes:
        - status: allow
          text: "선언형·명시적 발행을 상황에 맞게 선택한다."

dependency_inversion:
  eyebrow: "Interactive flow"
  title: "의존성 역전과 인터페이스"
  summary: "고수준 정책이 구체 구현을 직접 바라보지 않고 추상 계약을 통해 세부 구현을 교체한다."
  actors:
    - id: policy
      kind: "고수준 정책"
      name: "UseCase / Policy"
      description: "업무 규칙과 유스케이스를 결정하는 코드"
    - id: port
      kind: "추상 계약"
      name: "Port / Interface"
      description: "필요한 동작을 표현한 추상 경계"
    - id: adapter
      kind: "세부 구현"
      name: "Adapter / Repository"
      description: "DB·외부 API·구체 라이브러리를 연결하는 구현"
    - id: test
      kind: "대체 구현"
      name: "Test Double"
      description: "테스트를 위해 계약을 구현한 가짜 객체"
  steps:
    - title: "1. 정책 요구"
      from: "UseCase / Policy"
      to: "Port / Interface"
      route_label: "고수준 정책이 필요한 동작을 추상 계약으로 정의한다."
      active_actors: [policy, port]
      description: "정책 코드가 DB·HTTP 클라이언트의 세부 API를 직접 알지 않게 한다."
      payload: ["use case", "port", "contract"]
      outcomes:
        - status: allow
          text: "정책과 세부 기술의 변경 이유가 분리된다."
    - title: "2. 운영 구현 연결"
      from: "Port / Interface"
      to: "Adapter / Repository"
      route_label: "운영 환경에서는 DB·외부 API 구현이 포트 계약을 제공한다."
      active_actors: [port, adapter]
      description: "구체 기술은 계약을 만족하는 한 교체될 수 있다."
      payload: ["implementation", "database", "HTTP"]
      outcomes:
        - status: info
          text: "의존성 방향이 고수준 정책 쪽으로 향한다."
    - title: "3. 테스트 대역 연결"
      from: "Port / Interface"
      to: "Test Double"
      route_label: "테스트에서는 같은 계약을 구현한 메모리·목 대역을 주입한다."
      active_actors: [port, test, policy]
      description: "정책 테스트가 외부 DB나 네트워크 없이도 실행될 수 있다."
      payload: ["mock", "fake", "contract test"]
      outcomes:
        - status: allow
          text: "구현 교체와 테스트 격리가 쉬워진다."

api_versioning:
  eyebrow: "Interactive flow"
  title: "API 버전 관리"
  summary: "변경 영향이 큰 계약은 기존 클라이언트를 보호하면서 새 버전을 병행하고 이전 버전을 폐기한다."
  actors:
    - id: client
      kind: "소비자"
      name: "Existing Client"
      description: "현재 API 계약을 사용 중인 앱·파트너"
    - id: v1
      kind: "기존 계약"
      name: "API v1"
      description: "호환성을 유지해야 하는 기존 응답·요청 형식"
    - id: v2
      kind: "새 계약"
      name: "API v2"
      description: "변경된 모델·필드·행동을 제공하는 새 버전"
    - id: retire
      kind: "운영 정책"
      name: "Migration / Deprecation"
      description: "사용자 전환·공지·사용량 관찰·폐기 절차"
  steps:
    - title: "1. 기존 계약 보호"
      from: "Existing Client"
      to: "API v1"
      route_label: "기존 클라이언트가 현재 계약으로 계속 요청할 수 있게 호환 경로를 유지한다."
      active_actors: [client, v1]
      description: "서버 내부 리팩터링과 외부 계약 변경을 분리한다."
      payload: ["request", "response", "compatibility"]
      outcomes:
        - status: allow
          text: "기존 소비자의 갑작스러운 장애를 막는다."
    - title: "2. 새 버전 병행"
      from: "Existing Client"
      to: "API v2"
      route_label: "새 클라이언트를 v2로 점진적으로 전환하고 변경된 계약을 검증한다."
      active_actors: [client, v2, v1]
      description: "버전 전환 기간 동안 두 계약의 데이터·문서·모니터링을 관리한다."
      payload: ["new client", "version", "migration"]
      outcomes:
        - status: info
          text: "새 계약을 빠르게 도입하되 전환 상태를 관찰한다."
    - title: "3. 폐기 판단"
      from: "API v2"
      to: "Migration / Deprecation"
      route_label: "v1 사용량과 전환 완료를 확인한 뒤 공지·유예 기간 후 이전 버전을 폐기한다."
      active_actors: [v2, retire, v1]
      description: "버전 삭제도 기술 변경이 아니라 소비자와 조율하는 운영 작업이다."
      payload: ["usage", "deprecation", "sunset"]
      outcomes:
        - status: allow
          text: "계약 변경과 고객 전환을 단계적으로 관리한다."

browser_agent:
  eyebrow: "Interactive flow"
  title: "AI 브라우저 에이전트"
  summary: "브라우저 상태를 관찰하고 클릭·입력·탐색 도구를 실행한 뒤 결과를 확인하며 목표를 수행한다."
  actors:
    - id: goal
      kind: "목표"
      name: "User Goal"
      description: "웹사이트에서 완료하려는 작업"
    - id: observe
      kind: "관찰"
      name: "Browser State"
      description: "현재 URL·DOM·화면·접근성 정보를 읽은 상태"
    - id: action
      kind: "행동"
      name: "Click / Type / Navigate"
      description: "브라우저에 실제 입력과 이동을 수행하는 도구"
    - id: verify
      kind: "확인"
      name: "Result Check"
      description: "행동 결과와 목표 달성 여부를 확인하는 단계"
  steps:
    - title: "1. 목표와 화면 읽기"
      from: "User Goal"
      to: "Browser State"
      route_label: "목표를 현재 URL·화면·DOM 상태와 연결해 다음 행동을 결정한다."
      active_actors: [goal, observe]
      description: "화면의 현재 상태를 읽지 않고 좌표만 추측해 행동하지 않는다."
      payload: ["goal", "URL", "DOM", "screenshot"]
      outcomes:
        - status: info
          text: "관찰 결과가 행동 계획의 근거가 된다."
    - title: "2. 브라우저 행동"
      from: "Browser State"
      to: "Click / Type / Navigate"
      route_label: "필요한 버튼 클릭·입력·탐색을 실행해 웹 상태를 바꾼다."
      active_actors: [observe, action]
      description: "로그인·결제·삭제처럼 위험한 행동은 별도 승인과 확인이 필요하다."
      payload: ["click", "type", "navigate"]
      outcomes:
        - status: warning
          text: "도구 실행 권한과 외부 상태 변경의 범위를 제한한다."
    - title: "3. 결과 확인과 반복"
      from: "Click / Type / Navigate"
      to: "Result Check"
      route_label: "행동 후 화면과 요청 결과를 다시 읽고 목표 완료 또는 다음 행동을 판단한다."
      active_actors: [action, verify, observe]
      description: "브라우저 자동화는 한 번의 클릭이 아니라 관찰·행동·검증 루프다."
      payload: ["new state", "success", "next action"]
      outcomes:
        - status: allow
          text: "실제 화면 결과를 확인한 뒤 작업을 종료한다."

spec_kit_workflow:
  eyebrow: "Interactive flow"
  title: "Spec Kit 기반 개발 흐름"
  summary: "아이디어를 명세로 구체화하고 계획·구현·검증을 순서대로 진행해 AI 협업의 기준을 만든다."
  actors:
    - id: idea
      kind: "입력"
      name: "Idea / Problem"
      description: "해결하려는 사용자 문제와 초기 아이디어"
    - id: spec
      kind: "명세"
      name: "Specification"
      description: "행동·범위·예외·수용 기준을 정리한 문서"
    - id: plan
      kind: "계획"
      name: "Implementation Plan"
      description: "파일·단계·테스트를 정리한 구현 계획"
    - id: verify
      kind: "완료"
      name: "Implementation + Verify"
      description: "코드·테스트·리뷰로 명세를 확인하는 단계"
  steps:
    - title: "1. 아이디어 구체화"
      from: "Idea / Problem"
      to: "Specification"
      route_label: "문제와 사용자의 기대 행동을 명세와 수용 기준으로 바꾼다."
      active_actors: [idea, spec]
      description: "모호한 요청을 구현 전에 검증 가능한 문서로 만든다."
      payload: ["problem", "user story", "acceptance"]
      outcomes:
        - status: allow
          text: "무엇을 만들지와 완료 조건이 고정된다."
    - title: "2. 구현 계획"
      from: "Specification"
      to: "Implementation Plan"
      route_label: "명세를 저장소 구조·변경 파일·테스트 단계가 있는 계획으로 변환한다."
      active_actors: [spec, plan]
      description: "AI가 구현하더라도 변경 범위와 검증 전략은 계획에 남긴다."
      payload: ["files", "steps", "tests"]
      outcomes:
        - status: info
          text: "계획이 구현 작업을 작고 추적 가능하게 만든다."
    - title: "3. 구현·검증"
      from: "Implementation Plan"
      to: "Implementation + Verify"
      route_label: "계획대로 코드를 수정하고 테스트·리뷰로 명세 충족 여부를 확인한다."
      active_actors: [plan, verify, spec]
      description: "계획과 실제 결과의 차이를 다시 명세에 반영한다."
      payload: ["code", "test", "review"]
      outcomes:
        - status: allow
          text: "명세 중심의 반복 가능한 개발 흐름이 완성된다."

ai_verification:
  eyebrow: "Interactive flow"
  title: "AI 시대의 개발자 검증 구조"
  summary: "AI가 만든 결과를 테스트·실행·리뷰·제품 기준으로 여러 층에서 검증한다."
  actors:
    - id: generated
      kind: "생성 결과"
      name: "AI-generated Code"
      description: "모델이 제안하거나 수정한 코드·문서·설정"
    - id: static
      kind: "정적 검증"
      name: "Lint / Type / Review"
      description: "형식·타입·보안·diff를 확인하는 단계"
    - id: runtime
      kind: "실행 검증"
      name: "Tests / Build / Runtime"
      description: "실제 실행과 회귀·통합·성능 결과"
    - id: human
      kind: "제품 판단"
      name: "Developer Judgment"
      description: "요구사항·설계·운영 위험·사용자 가치에 대한 최종 판단"
  steps:
    - title: "1. 생성 결과 수집"
      from: "AI-generated Code"
      to: "Lint / Type / Review"
      route_label: "AI 변경을 diff로 보고 정적 검사와 코드 리뷰를 수행한다."
      active_actors: [generated, static]
      description: "생성된 코드의 범위·의존성·보안 위험을 먼저 확인한다."
      payload: ["diff", "lint", "type check"]
      outcomes:
        - status: info
          text: "코드가 생성됐다는 사실은 검증을 대신하지 않는다."
    - title: "2. 실제 실행"
      from: "Lint / Type / Review"
      to: "Tests / Build / Runtime"
      route_label: "테스트·빌드·실행으로 정적 검사만으로 보이지 않는 동작을 확인한다."
      active_actors: [static, runtime]
      description: "통합 경계·실제 데이터·성능·장애 처리까지 검증 범위를 확장한다."
      payload: ["unit", "integration", "build", "runtime"]
      outcomes:
        - status: allow
          text: "실행 가능한 증거가 남는다."
    - title: "3. 사람의 최종 판단"
      from: "Tests / Build / Runtime"
      to: "Developer Judgment"
      route_label: "기술 검증 결과를 요구사항·설계·운영 위험과 함께 해석해 병합·수정·거부를 결정한다."
      active_actors: [runtime, human, generated]
      description: "테스트 통과와 제품 가치·안전성 달성은 같은 의미가 아니다."
      payload: ["requirements", "trade-off", "approval"]
      outcomes:
        - status: allow
          text: "AI 활용의 속도와 개발자의 책임 있는 검증을 함께 유지한다."

functional_performance_test:
  eyebrow: "Interactive comparison"
  title: "기능 테스트와 성능 테스트"
  summary: "기능 테스트는 정답 동작을 확인하고 성능 테스트는 부하 속도·지연·자원·안정성을 측정한다."
  actors:
    - id: behavior
      kind: "기능 기준"
      name: "Expected Behavior"
      description: "정상·오류 입력에 대한 기대 결과"
    - id: functional
      kind: "기능 검증"
      name: "Functional Test"
      description: "기능이 요구사항대로 동작하는지 확인"
    - id: load
      kind: "부하 조건"
      name: "Load Profile"
      description: "동시 사용자·요청률·데이터 조건을 만드는 시나리오"
    - id: performance
      kind: "성능 지표"
      name: "Performance Metrics"
      description: "지연·처리량·실패율·자원 사용량"
  steps:
    - title: "1. 기능 정답 확인"
      from: "Expected Behavior"
      to: "Functional Test"
      route_label: "정해진 입력과 기대 결과로 기능의 정확성과 오류 처리를 검증한다."
      active_actors: [behavior, functional]
      description: "사용자 수를 늘리지 않아도 동작의 정답 여부를 확인할 수 있다."
      payload: ["input", "expected output", "assertion"]
      outcomes:
        - status: allow
          text: "기능 계약이 코드와 테스트에 남는다."
    - title: "2. 부하 시나리오"
      from: "Load Profile"
      to: "Performance Metrics"
      route_label: "동시 요청과 데이터 크기를 늘려 시스템이 실제 부하에서 어떻게 동작하는지 측정한다."
      active_actors: [load, performance]
      description: "성능은 단일 성공 응답이 아니라 시간과 자원의 분포로 판단한다."
      payload: ["VU", "request rate", "p95", "CPU"]
      outcomes:
        - status: info
          text: "평균만 보지 않고 상위 지연과 실패율을 함께 본다."
    - title: "3. 두 결과 해석"
      from: "Functional Test"
      to: "Performance Metrics"
      route_label: "기능이 맞는지와 부하에서 안정적인지를 별도 증거로 판단한다."
      active_actors: [functional, performance, behavior]
      description: "기능 테스트 통과가 높은 트래픽에서의 안정성을 보장하지는 않는다."
      payload: ["correctness", "latency", "throughput"]
      outcomes:
        - status: allow
          text: "정확성과 성능을 서로 다른 테스트 목적으로 관리한다."

k6_load_test:
  eyebrow: "Interactive flow"
  title: "k6 API 부하 테스트"
  summary: "k6 시나리오가 가상 사용자를 만들고 API를 호출해 응답·실패·임계값을 측정한다."
  actors:
    - id: script
      kind: "정의"
      name: "k6 Script"
      description: "요청 순서·VU·duration·threshold를 코드로 정의"
    - id: vu
      kind: "부하"
      name: "Virtual Users"
      description: "동시에 API를 호출하는 가상 사용자"
    - id: api
      kind: "대상"
      name: "Application API"
      description: "측정하려는 HTTP 엔드포인트와 의존성"
    - id: result
      kind: "측정"
      name: "k6 Metrics"
      description: "요청 시간·처리량·실패율·threshold 결과"
  steps:
    - title: "1. 시나리오 정의"
      from: "k6 Script"
      to: "Virtual Users"
      route_label: "VU 수·요청 단계·데이터·threshold를 코드로 설정한다."
      active_actors: [script, vu]
      description: "같은 조건을 다시 실행할 수 있도록 부하 모델을 버전 관리한다."
      payload: ["stages", "VU", "threshold"]
      outcomes:
        - status: allow
          text: "측정 조건이 재현 가능한 테스트 자산이 된다."
    - title: "2. API 호출"
      from: "Virtual Users"
      to: "Application API"
      route_label: "가상 사용자가 로그인·조회·쓰기 같은 실제 API 흐름을 호출한다."
      active_actors: [vu, api]
      description: "단일 엔드포인트뿐 아니라 사용자 행동에 가까운 시나리오를 구성한다."
      payload: ["HTTP", "payload", "scenario"]
      outcomes:
        - status: info
          text: "테스트 트래픽이 운영 데이터와 격리되는지 확인한다."
    - title: "3. 지표 수집"
      from: "Application API"
      to: "k6 Metrics"
      route_label: "응답 시간·처리량·실패율과 threshold 충족 여부를 기록한다."
      active_actors: [api, result, script]
      description: "결과 지표를 CPU·메모리·DB·외부 API 관측과 함께 해석한다."
      payload: ["duration", "rate", "errors", "threshold"]
      outcomes:
        - status: allow
          text: "성능 결과가 다음 병목 분석의 증거가 된다."

k6_bottleneck:
  eyebrow: "Interactive flow"
  title: "k6 결과로 병목 찾기"
  summary: "지연·실패·처리량 지표와 서버 관측을 연결해 가장 먼저 개선할 병목을 찾는다."
  actors:
    - id: metrics
      kind: "테스트 결과"
      name: "k6 Metrics"
      description: "p95·p99·실패율·처리량 등 부하 결과"
    - id: observe
      kind: "시스템 관측"
      name: "App / DB / Infra Signals"
      description: "CPU·Pool·쿼리·네트워크·Lag 관측값"
    - id: cause
      kind: "원인"
      name: "Bottleneck Hypothesis"
      description: "느린 구간과 원인에 대한 검증 가설"
    - id: change
      kind: "개선"
      name: "One Change + Rerun"
      description: "한 가지 변경을 적용하고 같은 조건으로 재측정"
  steps:
    - title: "1. 지연 신호 확인"
      from: "k6 Metrics"
      to: "App / DB / Infra Signals"
      route_label: "느린 요청과 실패율을 서버·DB·인프라 지표의 시간대와 맞춰 본다."
      active_actors: [metrics, observe]
      description: "k6 결과만으로 원인을 단정하지 않고 내부 관측과 연결한다."
      payload: ["p95", "error", "CPU", "pool"]
      outcomes:
        - status: info
          text: "증상과 원인 후보를 같은 시간축에서 비교한다."
    - title: "2. 병목 가설"
      from: "App / DB / Infra Signals"
      to: "Bottleneck Hypothesis"
      route_label: "DB 쿼리·Connection Pool·외부 API·파티션 등 하나의 원인 가설을 세운다."
      active_actors: [observe, cause]
      description: "여러 요소를 동시에 바꾸지 않아야 개선 효과를 해석할 수 있다."
      payload: ["query", "pool", "network", "lag"]
      outcomes:
        - status: warning
          text: "서버 수 증가가 실제 병목을 숨길 수 있다."
    - title: "3. 재측정"
      from: "Bottleneck Hypothesis"
      to: "One Change + Rerun"
      route_label: "한 가지 변경 후 같은 k6 조건을 다시 실행해 지표와 부작용을 비교한다."
      active_actors: [cause, change, metrics]
      description: "변경 전후의 테스트 결과와 운영 지표를 함께 기록한다."
      payload: ["one change", "same load", "before/after"]
      outcomes:
        - status: allow
          text: "성능 개선이 측정 가능한 반복 루프로 이어진다."

jwt_validation:
  eyebrow: "Interactive flow"
  title: "JWT 검증 책임 분리"
  summary: "필터는 토큰의 형식·서명·만료를 검증하고 인증 객체를 만든 뒤 Controller는 인가와 업무 처리에 집중한다."
  actors:
    - id: request
      kind: "요청"
      name: "HTTP + JWT"
      description: "Authorization 헤더와 업무 요청"
    - id: filter
      kind: "인증"
      name: "JWT Authentication Filter"
      description: "토큰 추출·서명·만료·claims 검증과 SecurityContext 설정"
    - id: context
      kind: "보안 상태"
      name: "SecurityContext"
      description: "검증된 사용자 인증 정보를 담는 현재 요청 상태"
    - id: controller
      kind: "인가·업무"
      name: "Controller / Authorization"
      description: "권한을 확인하고 실제 업무 요청을 처리"
  steps:
    - title: "1. 토큰 추출"
      from: "HTTP + JWT"
      to: "JWT Authentication Filter"
      route_label: "필터가 Authorization 헤더에서 Bearer Token을 추출한다."
      active_actors: [request, filter]
      description: "토큰이 없거나 형식이 잘못된 요청의 처리 정책을 구분한다."
      payload: ["Authorization", "Bearer", "token"]
      outcomes:
        - status: reject
          text: "인증 필터가 요청 전처리 경계를 맡는다."
    - title: "2. 검증·인증 생성"
      from: "JWT Authentication Filter"
      to: "SecurityContext"
      route_label: "서명·만료·claims를 검증하고 인증 객체를 SecurityContext에 저장한다."
      active_actors: [filter, context]
      description: "토큰 검증과 사용자 권한 판단을 한 메서드에 섞지 않는다."
      payload: ["signature", "expiration", "claims", "Authentication"]
      outcomes:
        - status: allow
          text: "검증된 인증 정보만 다음 계층으로 전달된다."
    - title: "3. 인가·업무 처리"
      from: "SecurityContext"
      to: "Controller / Authorization"
      route_label: "Controller와 인가 계층이 현재 사용자와 권한을 확인해 업무 요청을 처리한다."
      active_actors: [context, controller, request]
      description: "Controller가 JWT 문자열과 서명 알고리즘을 직접 알 필요가 없어진다."
      payload: ["principal", "authority", "business request"]
      outcomes:
        - status: allow
          text: "인증과 인가·업무 책임이 분리된다."

pr_actions_ci:
  eyebrow: "Interactive flow"
  title: "Pull Request와 GitHub Actions CI"
  summary: "PR이 열리면 Actions가 빌드·테스트·검사를 수행하고 통과한 변경만 리뷰·병합 단계로 넘어간다."
  actors:
    - id: branch
      kind: "변경"
      name: "Feature Branch"
      description: "새 기능과 수정이 커밋된 작업 브랜치"
    - id: pr
      kind: "검토 요청"
      name: "Pull Request"
      description: "변경 diff와 리뷰 대화를 모으는 병합 요청"
    - id: actions
      kind: "자동 검증"
      name: "GitHub Actions"
      description: "빌드·테스트·린트·배포 검사를 실행하는 CI"
    - id: main
      kind: "통합"
      name: "Protected Branch"
      description: "필수 검사를 통과한 변경만 병합되는 기본 브랜치"
  steps:
    - title: "1. PR 생성"
      from: "Feature Branch"
      to: "Pull Request"
      route_label: "작업 브랜치의 diff와 완료 조건을 PR로 올려 리뷰를 요청한다."
      active_actors: [branch, pr]
      description: "변경 목적과 검토 범위를 사람이 확인할 수 있는 단위로 만든다."
      payload: ["commit", "diff", "reviewers"]
      outcomes:
        - status: allow
          text: "코드 변경이 협업 검토의 흐름에 들어간다."
    - title: "2. 자동 검증"
      from: "Pull Request"
      to: "GitHub Actions"
      route_label: "PR 이벤트를 트리거로 Actions가 의존성 설치·빌드·테스트·정적 검사를 실행한다."
      active_actors: [pr, actions]
      description: "사람이 반복 확인할 내용을 자동화하고 결과를 PR 상태에 붙인다."
      payload: ["trigger", "build", "test", "status"]
      outcomes:
        - status: reject
          text: "검증 실패 상태에서는 보호 브랜치 병합을 막는다."
    - title: "3. 병합·배포"
      from: "GitHub Actions"
      to: "Protected Branch"
      route_label: "필수 CI와 리뷰를 통과하면 보호된 기본 브랜치에 병합하고 후속 배포를 진행한다."
      active_actors: [actions, main, pr]
      description: "CI 통과와 제품·설계 검토를 함께 병합 조건으로 둔다."
      payload: ["required check", "approval", "merge"]
      outcomes:
        - status: allow
          text: "검증된 변경만 기본 브랜치와 배포 흐름에 들어간다."
