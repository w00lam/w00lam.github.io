spring_security:
  eyebrow: "Interactive flow"
  title: "Spring Security 인증 처리 흐름"
  summary: "인증 결과를 검증하는 단계와 SecurityContext에 반영하는 단계를 나누어 본다."
  layout: six
  actors:
    - id: client
      kind: "요청 주체"
      name: "Client"
      description: "로그인 정보 또는 Bearer Token을 보냄"
    - id: filter
      kind: "인증 경계"
      name: "Security Filter"
      description: "인증 요청을 읽고 인증 객체를 생성함"
    - id: manager
      kind: "위임 조정"
      name: "AuthenticationManager"
      description: "사용할 인증 Provider를 선택함"
    - id: provider
      kind: "자격 증명"
      name: "AuthenticationProvider"
      description: "자격 증명을 검증함"
    - id: context
      kind: "현재 요청"
      name: "SecurityContext"
      description: "인증 결과와 현재 사용자 정보를 보관함"
    - id: controller
      kind: "애플리케이션"
      name: "Controller"
      description: "인가된 요청을 처리함"
  steps:
    - title: "1. 인증 요청"
      from: "Client"
      to: "Security Filter"
      route_label: "Filter가 로그인 정보나 Bearer Token을 읽는다."
      active_actors: [client, filter]
      description: "인증 필터가 요청에서 인증에 필요한 값을 읽고 인증 전 Authentication을 만든다."
      payload: ["로그인 정보", "Bearer Token"]
      outcomes:
        - status: info
          text: "아직 인증이 끝난 상태가 아닌 Authentication이 만들어진다."
    - title: "2. 인증 위임"
      from: "Security Filter"
      to: "AuthenticationManager"
      route_label: "Filter가 인증 전 Authentication을 Manager에 전달한다."
      active_actors: [filter, manager]
      description: "AuthenticationManager는 직접 모든 방식을 검증하지 않고 적절한 Provider에 처리를 위임한다."
      payload: ["인증 전 Authentication"]
      outcomes:
        - status: info
          text: "인증 방식에 따른 Provider 선택이 Manager의 책임이다."
    - title: "3. 자격 증명 검증"
      from: "AuthenticationManager"
      to: "AuthenticationProvider"
      route_label: "Manager가 선택한 Provider가 자격 증명을 검증한다."
      active_actors: [manager, provider]
      description: "Provider는 자신이 지원하는 인증 방식으로 자격 증명을 확인하고 인증된 Authentication을 반환한다."
      payload: ["검증할 자격 증명", "인증된 Authentication"]
      outcomes:
        - status: allow
          text: "검증에 성공하면 인증된 Authentication이 반환된다."
    - title: "4. 인증 결과 반환"
      from: "AuthenticationProvider"
      to: "Security Filter"
      route_label: "Provider의 인증 결과가 Filter로 돌아온다."
      active_actors: [provider, filter]
      description: "Provider가 결과를 반환하는 것과 SecurityContext에 저장하는 것은 서로 다른 단계다."
      payload: ["인증된 Authentication"]
      outcomes:
        - status: info
          text: "Provider가 SecurityContext에 직접 저장한다고 단정하지 않는다."
    - title: "5. SecurityContext 설정"
      from: "Security Filter"
      to: "SecurityContext"
      route_label: "인증 필터가 반환된 인증 결과를 현재 보안 컨텍스트에 설정한다."
      active_actors: [filter, context]
      description: "인증 필터가 인증된 결과를 SecurityContext에 반영해 현재 요청의 인증 정보를 준비한다."
      payload: ["인증된 Authentication", "SecurityContext"]
      outcomes:
        - status: allow
          text: "현재 요청에서 인증 정보를 사용할 수 있는 상태가 된다."
    - title: "6. 인가 후 요청 처리"
      from: "SecurityContext"
      to: "Controller"
      route_label: "인가 단계가 권한을 확인한 뒤 Controller로 요청을 이어 보낸다."
      active_actors: [context, controller]
      description: "인증 정보의 권한을 확인한 뒤 허용된 요청만 애플리케이션 Controller로 전달된다."
      payload: ["현재 사용자 정보", "권한 확인 결과"]
      outcomes:
        - status: allow
          text: "인가를 통과한 요청이 Controller 처리로 이어진다."

slf4j_logback:
  eyebrow: "Interactive structure"
  title: "SLF4J와 Logback의 관계"
  summary: "애플리케이션 코드는 API를 호출하고, 구현체가 실제 로그를 출력한다."
  actors:
    - id: application
      kind: "호출자"
      name: "Application"
      description: "Logger API를 사용해 로그를 호출함"
    - id: slf4j
      kind: "추상화 계층"
      name: "SLF4J"
      description: "로깅 API와 호출 규약을 제공함"
    - id: logback
      kind: "구현체"
      name: "Logback"
      description: "로그 출력과 관리를 수행함"
    - id: appender
      kind: "출력 구성"
      name: "Appender / Layout"
      description: "로그의 출력 대상과 형식을 결정함"
  steps:
    - title: "1. Logger 호출"
      from: "Application"
      to: "SLF4J"
      route_label: "애플리케이션이 SLF4J Logger API를 호출한다."
      active_actors: [application, slf4j]
      description: "애플리케이션 코드는 log.info() 같은 SLF4J API를 사용하고 특정 구현체의 API를 직접 호출하지 않는다."
      payload: ["Logger 호출", "log.info()"]
      outcomes:
        - status: info
          text: "호출 규약과 실제 출력 구현을 분리할 수 있다."
    - title: "2. 추상화 계층"
      from: "SLF4J"
      to: "Logback"
      route_label: "SLF4J 호출이 연결된 로깅 구현체로 전달된다."
      active_actors: [slf4j, logback]
      description: "SLF4J는 애플리케이션 코드와 실제 로깅 구현체 사이의 추상화 계층으로 동작한다."
      payload: ["로깅 API", "구현체 연결"]
      outcomes:
        - status: info
          text: "실제 연결은 의존성과 설정에 따라 결정된다."
    - title: "3. 출력과 관리"
      from: "Logback"
      to: "Appender / Layout"
      route_label: "Logback이 Appender와 Layout을 사용해 로그를 처리한다."
      active_actors: [logback, appender]
      description: "Logback은 Logger, Appender, Layout을 조합해 로그 출력과 관리, 형식 구성을 담당한다."
      payload: ["Logger", "Appender", "Layout"]
      outcomes:
        - status: allow
          text: "구현체가 실제 로그 출력과 관리 책임을 맡는다."
    - title: "4. 구현체 교체 기준"
      from: "Application"
      to: "Logback"
      route_label: "구현체를 바꾸더라도 애플리케이션 호출부 변경을 줄일 수 있다."
      active_actors: [application, slf4j, logback]
      description: "SLF4J를 사이에 두면 애플리케이션이 구현체에 직접 묶이지 않지만 실제 동작은 의존성과 설정을 확인해야 한다."
      payload: ["추상화", "의존성", "설정"]
      outcomes:
        - status: info
          text: "SLF4J 사용만으로 항상 같은 출력 방식이 보장되는 것은 아니다."

csrf:
  eyebrow: "Interactive flow"
  title: "CSRF 공격과 토큰 검증 흐름"
  summary: "공격자는 Cookie 값을 읽지 않아도 피해자의 브라우저가 대상 서버에 요청하도록 유도할 수 있다."
  actors:
    - id: user
      kind: "주체"
      name: "User"
      description: "대상 서버에 로그인한 사용자"
    - id: browser
      kind: "클라이언트"
      name: "Browser"
      description: "인증 Cookie를 보관하고 요청을 보냄"
    - id: attacker
      kind: "외부 사이트"
      name: "Attacker Site"
      description: "피해자의 브라우저가 요청하도록 유도"
    - id: server
      kind: "서버"
      name: "Target Server"
      description: "Cookie와 CSRF Token을 검증"
  steps:
    - title: "1. 로그인"
      from: "User"
      to: "Browser"
      route_label: "로그인 정보가 Browser로 전달된다."
      active_actors: [user, browser]
      description: "사용자가 대상 서버에 로그인하고 Browser가 인증 상태를 맡는다."
      payload: ["로그인 정보"]
      outcomes:
        - status: allow
          text: "Browser가 인증 Cookie를 저장한다."
    - title: "2. 인증 상태 유지"
      from: "Browser"
      to: "Target Server"
      route_label: "정상 요청에는 인증 Cookie가 포함될 수 있다."
      active_actors: [browser, server]
      description: "Browser는 대상 서버와 통신할 때 조건에 맞는 인증 Cookie를 전송할 수 있다."
      payload: ["인증 Cookie"]
      outcomes:
        - status: info
          text: "공격자가 Cookie 값을 직접 읽어야 하는 것은 아니다."
    - title: "3. 공격 페이지 방문"
      from: "Attacker Site"
      to: "Browser"
      route_label: "공격 페이지가 Browser에 대상 서버 요청을 유도한다."
      active_actors: [attacker, browser]
      description: "로그인 상태의 사용자가 공격자가 준비한 페이지를 방문한다."
      payload: ["상태 변경 요청 유도"]
      outcomes:
        - status: warning
          text: "피해자의 Browser가 요청을 시작하도록 이용된다."
    - title: "4. 대상 서버 요청"
      from: "Browser"
      to: "Target Server"
      route_label: "Browser가 대상 서버로 상태 변경 요청을 보낸다."
      active_actors: [browser, server]
      description: "Cookie 전송 조건이 충족되면 공격자가 만든 요청에도 인증 Cookie가 포함될 수 있다."
      payload: ["상태 변경 요청", "Cookie는 요청 조건에 따라 포함"]
      outcomes:
        - status: warning
          text: "SameSite 정책과 요청 조건에 따라 Cookie 전송 여부가 달라진다."
    - title: "5. CSRF Token 검증"
      from: "Browser"
      to: "Target Server"
      route_label: "Target Server가 CSRF Token을 검증한다."
      active_actors: [browser, server]
      description: "보호 대상 요청은 유효한 CSRF Token이 있는지 확인한 뒤 처리 여부를 결정한다."
      payload: ["CSRF Token"]
      outcomes:
        - status: reject
          text: "Token 없음·불일치 → 보호 대상 요청 거부"
        - status: allow
          text: "유효한 Token → 애플리케이션 정책에 따라 처리"

xss:
  eyebrow: "Interactive comparison"
  title: "Stored XSS와 Reflected XSS"
  summary: "저장 여부와 악성 입력이 응답에 들어오는 경로가 다르다."
  actors:
    - id: attacker
      kind: "입력 주체"
      name: "Attacker Input"
      description: "악성 문자열이나 준비된 요청을 전달함"
    - id: application
      kind: "처리 경계"
      name: "Application"
      description: "입력을 저장하거나 응답에 반영함"
    - id: storage
      kind: "저장 경로"
      name: "Server / DB"
      description: "Stored XSS 입력을 보관함"
    - id: browser
      kind: "실행 환경"
      name: "Victim Browser"
      description: "응답을 문맥에 따라 해석함"
  steps:
    - title: "1. Stored XSS: 저장"
      from: "Attacker Input"
      to: "Server / DB"
      route_label: "악성 입력이 게시글이나 댓글처럼 서버에 저장된다."
      active_actors: [attacker, application, storage]
      description: "Stored XSS에서는 공격자 입력이 서버나 데이터베이스에 저장된 뒤 나중에 조회된다."
      payload: ["악성 입력", "게시글·댓글"]
      outcomes:
        - status: warning
          text: "저장된 콘텐츠를 여러 사용자의 응답에 포함할 수 있다."
    - title: "2. Stored XSS: 조회 응답"
      from: "Server / DB"
      to: "Victim Browser"
      route_label: "저장된 입력이 다른 사용자의 조회 응답에 포함된다."
      active_actors: [storage, application, browser]
      description: "출력 처리가 취약하면 브라우저가 저장된 입력을 실행 가능한 문맥으로 해석할 수 있다."
      payload: ["조회 응답", "저장된 입력"]
      outcomes:
        - status: reject
          text: "안전한 출력 처리를 사용하면 실행 가능한 문맥을 만들지 않는다."
    - title: "3. Reflected XSS: 준비된 요청"
      from: "Attacker Input"
      to: "Application"
      route_label: "공격자가 준비한 요청의 입력이 서버로 전달된다."
      active_actors: [attacker, application]
      description: "Reflected XSS에서는 입력이 저장되지 않고 현재 요청의 파라미터나 오류 메시지 등에 들어온다."
      payload: ["준비된 요청", "검색어·오류 입력"]
      outcomes:
        - status: info
          text: "저장되지 않았다는 이유만으로 안전하다고 판단할 수 없다."
    - title: "4. Reflected XSS: 현재 응답"
      from: "Application"
      to: "Victim Browser"
      route_label: "서버가 요청 입력을 현재 응답에 반영한다."
      active_actors: [application, browser]
      description: "두 유형 모두 브라우저가 입력을 실행 가능한 출력 문맥으로 해석하고 방어가 부족할 때 문제가 된다."
      payload: ["현재 응답", "출력 문맥"]
      outcomes:
        - status: reject
          text: "단순 텍스트는 textContent 같은 안전한 DOM API로 출력한다."
        - status: info
          text: "HTML을 허용해야 한다면 Sanitization과 CSP를 함께 검토한다."

oauth_code:
  eyebrow: "Interactive flow"
  title: "OAuth Authorization Code Grant 흐름"
  summary: "브라우저 리다이렉트와 서버 간 토큰 교환을 분리해 인가 코드의 역할을 확인한다."
  layout: six
  actors:
    - id: user
      kind: "Resource Owner"
      name: "User"
      description: "로그인하고 애플리케이션의 권한 요청에 동의함"
    - id: client
      kind: "애플리케이션"
      name: "Client"
      description: "인가 요청을 만들고 코드를 토큰으로 교환함"
    - id: auth_server
      kind: "인가 서버"
      name: "Authorization Server"
      description: "로그인·동의를 처리하고 토큰을 발급함"
    - id: resource_server
      kind: "보호된 API"
      name: "Resource Server"
      description: "Access Token을 검증하고 사용자 정보를 제공함"
  steps:
    - title: "1. 인가 요청 준비"
      from: "User"
      to: "Client"
      route_label: "Client가 사용자 대신 인가 요청을 시작한다."
      active_actors: [user, client]
      description: "Client는 state와 code_challenge를 포함해 Authorization Server로 보낼 요청을 준비한다."
      payload: ["state", "code_challenge", "Redirect URI"]
      outcomes:
        - status: info
          text: "사용자의 비밀번호는 Client에 전달하지 않는다."
    - title: "2. 브라우저 리다이렉트"
      from: "Client"
      to: "Authorization Server"
      route_label: "브라우저가 인가 요청을 Authorization Server로 전달한다."
      active_actors: [client, auth_server]
      description: "Authorization Server는 등록된 Redirect URI와 요청의 state·PKCE 값을 기준으로 로그인과 동의를 진행한다."
      payload: ["인가 요청", "state", "code_challenge"]
      outcomes:
        - status: info
          text: "State는 시작한 요청과 돌아온 응답을 연결한다."
    - title: "3. Authorization Code 반환"
      from: "Authorization Server"
      to: "Client"
      route_label: "동의가 끝나면 Redirect URI로 일회성에 가까운 Code를 돌려준다."
      active_actors: [user, auth_server, client]
      description: "브라우저가 받은 Authorization Code는 보호된 API를 호출하는 Access Token이 아니라 토큰 교환을 위한 중간 자격 증명이다."
      payload: ["Redirect URI", "Authorization Code"]
      outcomes:
        - status: allow
          text: "Client가 Code를 받았지만 아직 Resource Server를 호출할 수는 없다."
    - title: "4. 서버 간 Code 교환"
      from: "Client"
      to: "Authorization Server"
      route_label: "Client가 Code와 code_verifier를 서버 간 요청으로 교환한다."
      active_actors: [client, auth_server]
      description: "Authorization Server는 PKCE의 code_verifier를 비교하고 Code의 유효성과 Redirect URI를 확인한다."
      payload: ["Authorization Code", "code_verifier"]
      outcomes:
        - status: reject
          text: "검증에 실패하면 토큰을 발급하지 않는다."
    - title: "5. Access Token 발급"
      from: "Authorization Server"
      to: "Client"
      route_label: "검증을 통과한 Client에 Access Token을 발급한다."
      active_actors: [auth_server, client]
      description: "Code 교환이 끝나면 Client는 보호된 API를 호출할 수 있는 Access Token을 받는다."
      payload: ["Access Token"]
      outcomes:
        - status: allow
          text: "Authorization Code와 API 호출용 Access Token의 역할을 구분한다."
    - title: "6. 보호된 API 요청"
      from: "Client"
      to: "Resource Server"
      route_label: "Client가 Access Token을 Bearer 요청에 담아 보낸다."
      active_actors: [client, resource_server]
      description: "Resource Server는 토큰을 검증한 뒤 허용된 범위의 리소스만 제공한다."
      payload: ["Bearer Access Token"]
      outcomes:
        - status: info
          text: "Access Token은 보호된 API를 호출하는 자격 증명이다."
    - title: "7. 사용자 정보 응답"
      from: "Resource Server"
      to: "Client"
      route_label: "검증된 토큰의 범위에 맞는 사용자 정보를 반환한다."
      active_actors: [client, resource_server]
      description: "Client는 Resource Server가 반환한 리소스 표현을 사용해 사용자 화면이나 기능을 구성한다."
      payload: ["사용자 정보", "리소스 표현"]
      outcomes:
        - status: allow
          text: "허용된 범위의 리소스만 Client에 전달된다."

jwt_structure:
  eyebrow: "Interactive structure"
  title: "JWT Header·Payload·Signature 구조"
  summary: "디코딩할 수 있는 정보와 신뢰성을 확인해야 하는 정보를 나눠 본다."
  actors:
    - id: header
      kind: "첫 번째 부분"
      name: "Header"
      description: "서명 알고리즘과 토큰 유형 같은 메타데이터를 담음"
    - id: payload
      kind: "두 번째 부분"
      name: "Payload"
      description: "sub·iss·exp 같은 Claim을 담음"
    - id: signature
      kind: "세 번째 부분"
      name: "Signature"
      description: "Header와 Payload의 무결성과 서명을 검증함"
    - id: verifier
      kind: "검증 경계"
      name: "API Verifier"
      description: "서명과 Claim, API 권한을 확인한 뒤 토큰을 신뢰함"
  steps:
    - title: "1. Header 확인"
      from: "JWT"
      to: "Header"
      route_label: "첫 번째 점 앞의 부분에서 메타데이터를 읽는다."
      active_actors: [header]
      description: "Header에는 alg와 typ이 들어가며 서버는 허용할 알고리즘과 검증 키를 관리한다."
      payload: ["alg: HS256", "typ: JWT"]
      outcomes:
        - status: info
          text: "Header를 읽을 수 있다는 사실만으로 토큰을 신뢰할 수는 없다."
    - title: "2. Payload 디코딩"
      from: "JWT"
      to: "Payload"
      route_label: "두 번째 부분을 Base64URL로 디코딩해 Claim을 확인한다."
      active_actors: [payload]
      description: "Payload는 일반적인 서명 JWT에서 암호화되지 않으므로 외부에서 읽을 수 있고 민감정보를 넣지 않아야 한다."
      payload: ["sub", "iss", "exp", "Base64URL"]
      outcomes:
        - status: warning
          text: "Base64URL 인코딩은 암호화가 아니며 기밀성을 제공하지 않는다."
    - title: "3. Signature 검증"
      from: "Header + Payload"
      to: "Signature"
      route_label: "서버가 Header와 Payload에 대한 서명 또는 MAC을 검증한다."
      active_actors: [header, payload, signature]
      description: "Signature는 내용이 바뀌지 않았는지와 신뢰할 수 있는 발급자가 서명했는지를 확인하는 값이다."
      payload: ["Header + Payload", "검증 키"]
      outcomes:
        - status: reject
          text: "서명 검증 실패 → 토큰을 인증 정보로 사용하지 않는다."
        - status: allow
          text: "서명 검증 성공 → 다음 Claim 검증으로 진행한다."
    - title: "4. Claim과 권한 검증"
      from: "Signature"
      to: "API Verifier"
      route_label: "서명 뒤 iss·aud·exp와 API 권한을 순서대로 확인한다."
      active_actors: [signature, verifier]
      description: "서명만 맞는지 보지 않고 발급자·대상·만료 시각과 요청 권한까지 확인해야 토큰을 신뢰할 수 있다."
      payload: ["iss", "aud", "exp", "API 권한"]
      outcomes:
        - status: allow
          text: "모든 검증을 통과한 경우에만 보호된 요청을 처리한다."

refresh_rotation:
  eyebrow: "Interactive flow"
  title: "Refresh Token Rotation과 재사용 거부"
  summary: "R1을 사용해 R2를 발급한 뒤 폐기된 R1의 재제출을 탐지하는 흐름이다."
  actors:
    - id: client
      kind: "토큰 보유자"
      name: "Client"
      description: "만료된 Access Token과 Refresh Token을 제출함"
    - id: auth_server
      kind: "검증 주체"
      name: "Auth Server"
      description: "Refresh Token의 만료·폐기·재사용을 확인함"
    - id: token_pair
      kind: "새 자격 증명"
      name: "A2 + R2"
      description: "정상 재발급으로 만들어지는 새 토큰 쌍"
    - id: reuse_policy
      kind: "보호 정책"
      name: "Reuse Detection"
      description: "이미 폐기된 Refresh Token의 재사용을 탐지함"
  steps:
    - title: "1. 만료와 R1 제출"
      from: "Client"
      to: "Auth Server"
      route_label: "Access Token이 만료되면 Client가 Refresh Token R1을 제출한다."
      active_actors: [client, auth_server]
      description: "Refresh Token은 새 Access Token을 발급받기 위한 자격 증명이며 존재만으로 재발급이 허용되지는 않는다."
      payload: ["Access Token 만료", "Refresh Token R1"]
      outcomes:
        - status: info
          text: "서버는 R1의 유효 기간과 상태를 확인해야 한다."
    - title: "2. R1 검증"
      from: "Auth Server"
      to: "Reuse Detection"
      route_label: "서버가 만료·폐기·재사용 여부를 확인한다."
      active_actors: [auth_server, reuse_policy]
      description: "Rotation을 적용하려면 Refresh Token 상태와 현재 클라이언트에 연결된 토큰인지 서버가 관리해야 한다."
      payload: ["만료 확인", "폐기 확인", "재사용 확인"]
      outcomes:
        - status: reject
          text: "유효하지 않거나 이미 사용된 R1이면 발급을 중단한다."
        - status: allow
          text: "정상 R1이면 새 토큰 발급으로 진행한다."
    - title: "3. 새 토큰 발급과 R1 폐기"
      from: "Auth Server"
      to: "A2 + R2"
      route_label: "정상 R1에 대해 A2와 R2를 발급하고 기존 R1을 무효화한다."
      active_actors: [auth_server, token_pair, reuse_policy]
      description: "새 토큰을 발급하는 순간 기존 R1의 사용 가능 상태를 명시적으로 폐기해야 Rotation이 성립한다."
      payload: ["Access Token A2", "Refresh Token R2", "R1 폐기"]
      outcomes:
        - status: allow
          text: "정상 재발급 뒤 다음 Refresh Token은 R2가 된다."
    - title: "4. 폐기된 R1 재사용"
      from: "Client"
      to: "Auth Server"
      route_label: "공격자나 오래된 Client가 이미 폐기된 R1을 다시 제출한다."
      active_actors: [client, auth_server, reuse_policy]
      description: "R2를 발급받은 뒤 R1이 다시 제출되면 단순한 만료 여부가 아니라 토큰 재사용 사건으로 볼 수 있다."
      payload: ["Refresh Token R1", "재사용 요청"]
      outcomes:
        - status: warning
          text: "새 토큰을 발급했다는 사실만으로 이전 토큰이 자동 무효화되지는 않는다."
    - title: "5. 재사용 거부와 세션 폐기"
      from: "Reuse Detection"
      to: "Client"
      route_label: "서버가 재사용을 탐지하고 요청과 관련 토큰군을 거부한다."
      active_actors: [auth_server, reuse_policy, client]
      description: "정책에 따라 관련 토큰군이나 세션을 폐기해 탈취된 Refresh Token의 확산을 막는다."
      payload: ["요청 거부", "토큰군 폐기", "세션 폐기"]
      outcomes:
        - status: reject
          text: "폐기된 R1 재사용 → 재발급 거부"

rest_resource:
  eyebrow: "Interactive flow"
  title: "REST API의 Resource·URI·Representation"
  summary: "URI가 대상을 식별하고 HTTP Method가 의도를 나타내며 Representation이 현재 상태를 전달한다."
  actors:
    - id: client
      kind: "요청 주체"
      name: "Client"
      description: "HTTP Method와 URI로 리소스 표현을 요청함"
    - id: uri
      kind: "식별자"
      name: "URI"
      description: "대상 Resource를 식별함"
    - id: server
      kind: "처리 주체"
      name: "Server"
      description: "요청 의미에 따라 Resource를 처리함"
    - id: representation
      kind: "응답 데이터"
      name: "Representation"
      description: "특정 시점의 Resource 상태를 표현함"
  steps:
    - title: "1. HTTP 요청 작성"
      from: "Client"
      to: "URI"
      route_label: "Client가 GET /orders/123처럼 Method와 URI를 함께 보낸다."
      active_actors: [client, uri]
      description: "HTTP Method는 리소스에 어떤 동작을 요청하는지, URI는 어떤 대상을 가리키는지 나타낸다."
      payload: ["GET", "/orders/123"]
      outcomes:
        - status: info
          text: "Client가 서버 내부 클래스나 DB 구조를 알 필요는 없다."
    - title: "2. Resource 식별"
      from: "URI"
      to: "Server"
      route_label: "서버가 URI를 보고 123번 Order Resource를 식별한다."
      active_actors: [uri, server]
      description: "URI는 리소스 자체와 동일한 데이터가 아니라 요청 대상의 식별자 역할을 한다."
      payload: ["Order Resource", "ID: 123"]
      outcomes:
        - status: allow
          text: "요청 대상이 일관된 URI 규칙으로 식별된다."
    - title: "3. Representation 생성"
      from: "Server"
      to: "Representation"
      route_label: "서버가 리소스의 현재 상태를 JSON Representation으로 만든다."
      active_actors: [server, representation]
      description: "Representation은 Resource 그 자체가 아니라 특정 시점의 상태를 전달하는 데이터다."
      payload: ["HTTP 200 OK", "JSON", "status: PAID"]
      outcomes:
        - status: info
          text: "응답 표현과 서버 내부 저장 구조를 분리할 수 있다."
    - title: "4. 응답 전달"
      from: "Representation"
      to: "Client"
      route_label: "Client가 상태 표현을 받아 다음 동작을 결정한다."
      active_actors: [representation, client]
      description: "응답은 리소스의 현재 상태와 요청 처리 결과를 Client가 이해할 수 있는 형태로 전달한다."
      payload: ["HTTP 200 OK", "JSON Representation"]
      outcomes:
        - status: allow
          text: "Method·URI·Representation을 한 요청 흐름에서 함께 읽는다."

nginx_spring:
  eyebrow: "Interactive flow"
  title: "Nginx와 Spring Boot 요청 처리 흐름"
  summary: "Nginx는 전달을 담당하고 Tomcat과 Spring MVC는 애플리케이션 요청을 실행한다."
  layout: six
  actors:
    - id: client
      kind: "외부 요청"
      name: "Client"
      description: "HTTPS 요청을 보냄"
    - id: nginx
      kind: "Reverse Proxy"
      name: "Nginx"
      description: "TLS 종료·라우팅·전달을 담당함"
    - id: tomcat
      kind: "Servlet Container"
      name: "Embedded Tomcat"
      description: "HTTP 요청을 받을 실행 환경을 제공함"
    - id: mvc
      kind: "Front Controller"
      name: "DispatcherServlet"
      description: "Spring MVC의 요청 진입점으로 동작함"
    - id: controller
      kind: "웹 계층"
      name: "Controller"
      description: "요청을 매핑하고 응답 조합을 시작함"
    - id: domain
      kind: "애플리케이션 계층"
      name: "Service → Repository → DB"
      description: "비즈니스 규칙을 처리하고 저장소와 데이터베이스에 접근함"
  steps:
    - title: "1. 외부 HTTPS 요청"
      from: "Client"
      to: "Nginx"
      route_label: "Client가 Nginx로 HTTPS Request를 보낸다."
      active_actors: [client, nginx]
      description: "앞단에 Nginx를 두는 구성에서는 외부 연결과 애플리케이션 전달을 분리할 수 있다."
      payload: ["HTTPS Request"]
      outcomes:
        - status: info
          text: "Nginx 없이 Embedded Tomcat이 직접 외부 요청을 받을 수도 있다."
    - title: "2. Reverse Proxy 전달"
      from: "Nginx"
      to: "Embedded Tomcat"
      route_label: "Nginx가 라우팅한 요청을 Spring Boot의 Tomcat으로 전달한다."
      active_actors: [nginx, tomcat]
      description: "Nginx는 TLS·정적 파일·라우팅·부하 분산을 담당할 수 있지만 비즈니스 규칙을 실행하지는 않는다."
      payload: ["Reverse Proxy", "Routing"]
      outcomes:
        - status: info
          text: "프록시 계층은 선택 가능한 구성 요소다."
    - title: "3. Servlet 요청 진입"
      from: "Embedded Tomcat"
      to: "DispatcherServlet"
      route_label: "Tomcat이 HTTP 요청을 DispatcherServlet에 연결한다."
      active_actors: [tomcat, mvc]
      description: "Tomcat은 Servlet Container로서 HTTP 처리 환경을 제공하고 Spring MVC 진입점으로 요청을 넘긴다."
      payload: ["Servlet Request", "Spring MVC"]
      outcomes:
        - status: info
          text: "컨테이너 처리와 애플리케이션 라우팅을 구분한다."
    - title: "4. Controller 매핑"
      from: "DispatcherServlet"
      to: "Controller"
      route_label: "DispatcherServlet이 요청을 매핑된 Controller로 전달한다."
      active_actors: [mvc, controller]
      description: "Controller는 요청을 받아 애플리케이션 계층에 필요한 작업을 요청하고 응답을 조합한다."
      payload: ["요청 매핑", "Controller"]
      outcomes:
        - status: allow
          text: "Spring MVC Front Controller 뒤에서 구체적인 Controller가 선택된다."
    - title: "5. 비즈니스 처리와 저장"
      from: "Controller"
      to: "Service → Repository → DB"
      route_label: "Controller가 Service를 거쳐 Repository와 Database 작업을 수행한다."
      active_actors: [controller, domain]
      description: "주문 조회나 권한 판단처럼 애플리케이션 의미를 이해해야 하는 로직은 이 계층에서 실행된다."
      payload: ["비즈니스 규칙", "Repository", "Database"]
      outcomes:
        - status: allow
          text: "요청 처리의 핵심은 Spring 애플리케이션 계층에서 수행된다."
    - title: "6. 응답 역방향 전달"
      from: "Controller"
      to: "Client"
      route_label: "처리 결과가 같은 경로를 거꾸로 지나 Client에 응답된다."
      active_actors: [client, nginx, tomcat, mvc, controller]
      description: "Controller가 만든 응답은 Tomcat과 필요하면 Nginx를 거쳐 외부 Client로 돌아간다."
      payload: ["Response"]
      outcomes:
        - status: allow
          text: "Nginx와 Spring Boot를 반드시 함께 사용해야 한다는 뜻은 아니다."

http_methods:
  eyebrow: "Interactive comparison"
  title: "HTTP 메서드의 안전성과 멱등성"
  summary: "안전성은 상태 변경 요청 여부이고, 멱등성은 의도한 효과를 반복해도 같은지의 기준이다."
  layout: six
  actors:
    - id: get
      kind: "조회"
      name: "GET"
      description: "리소스 표현 조회 · 안전 예 · 멱등 예"
    - id: head
      kind: "메타데이터"
      name: "HEAD"
      description: "GET과 같은 대상 · 본문 없음 · 안전 예"
    - id: post
      kind: "제출·처리"
      name: "POST"
      description: "데이터 제출 · 안전 아니오 · 멱등 아니오"
    - id: put
      kind: "생성·교체"
      name: "PUT"
      description: "지정한 상태로 맞춤 · 안전 아니오 · 멱등 예"
    - id: patch
      kind: "부분 변경"
      name: "PATCH"
      description: "변경 방식에 따라 멱등성이 조건부"
    - id: delete
      kind: "연결 제거"
      name: "DELETE"
      description: "리소스와 연결 제거 · 안전 아니오 · 멱등 예"
  steps:
    - title: "1. GET"
      from: "GET"
      to: "GET"
      route_label: "리소스 표현을 조회한다."
      active_actors: [get]
      description: "GET은 서버 상태 변경을 요청하지 않으며 같은 요청을 반복해도 의도된 상태 효과가 같다."
      payload: ["안전: 예", "멱등: 예"]
      outcomes:
        - status: allow
          text: "조회 메서드"
    - title: "2. HEAD"
      from: "HEAD"
      to: "HEAD"
      route_label: "GET과 같은 대상의 메타데이터를 확인한다."
      active_actors: [head]
      description: "HEAD는 응답 본문 없이 GET과 같은 대상의 메타데이터를 확인하는 안전하고 멱등적인 요청이다."
      payload: ["안전: 예", "멱등: 예", "본문 없음"]
      outcomes:
        - status: allow
          text: "메타데이터 확인"
    - title: "3. POST"
      from: "POST"
      to: "POST"
      route_label: "데이터 제출이나 처리를 요청한다."
      active_actors: [post]
      description: "POST는 일반적으로 서버 상태를 변경하고 같은 요청을 반복했을 때 동일한 결과를 보장하지 않는다."
      payload: ["안전: 아니오", "멱등: 아니오"]
      outcomes:
        - status: warning
          text: "반복 요청의 효과를 API 설계에서 별도로 다뤄야 한다."
    - title: "4. PUT"
      from: "PUT"
      to: "PUT"
      route_label: "리소스 표현을 지정한 상태로 생성하거나 교체한다."
      active_actors: [put]
      description: "PUT은 안전하지 않지만 같은 표현을 반복해도 의도한 상태에 도달하는 멱등 요청으로 설계된다."
      payload: ["안전: 아니오", "멱등: 예"]
      outcomes:
        - status: allow
          text: "지정 상태로 맞추는 요청"
    - title: "5. PATCH"
      from: "PATCH"
      to: "PATCH"
      route_label: "리소스의 일부 변경을 적용한다."
      active_actors: [patch]
      description: "PATCH 자체는 멱등성을 보장하지 않으며 특정 값 설정인지 1씩 증가인지 구현한 변경 방식에 따라 결과가 달라진다."
      payload: ["안전: 아니오", "멱등: 조건부"]
      outcomes:
        - status: warning
          text: "메서드 이름만으로 멱등성을 판단하지 않는다."
    - title: "6. DELETE"
      from: "DELETE"
      to: "DELETE"
      route_label: "리소스와의 연결 제거를 요청한다."
      active_actors: [delete]
      description: "DELETE는 안전하지 않지만 첫 요청 뒤 의도한 리소스가 없는 상태가 유지된다면 멱등으로 볼 수 있다."
      payload: ["안전: 아니오", "멱등: 예"]
      outcomes:
        - status: allow
          text: "응답 코드가 같아야 한다는 뜻은 아니다."

http_5xx:
  eyebrow: "Interactive diagnosis"
  title: "5xx 오류가 발생한 위치"
  summary: "Client·Gateway·Application Server의 요청 경로에서 실패 지점과 의미를 함께 확인한다."
  actors:
    - id: client
      kind: "요청 주체"
      name: "Client"
      description: "요청을 보내고 응답을 받음"
    - id: gateway
      kind: "전달 경계"
      name: "Gateway"
      description: "Reverse Proxy로 상위 서버에 요청을 전달함"
    - id: application
      kind: "처리 주체"
      name: "Application Server"
      description: "요청 처리와 응답 생성을 담당함"
    - id: status
      kind: "실패 결과"
      name: "5xx Status"
      description: "실패 지점에 따라 다른 처리 결과를 표현함"
  steps:
    - title: "1. 500 Internal Server Error"
      from: "Application Server"
      to: "5xx Status"
      route_label: "애플리케이션 서버 내부의 예상하지 못한 처리 실패를 500으로 표현한다."
      active_actors: [application, status]
      description: "더 적절한 5xx가 없는 경우 애플리케이션 내부 처리 실패를 500으로 반환할 수 있다."
      payload: ["500", "Internal Server Error"]
      outcomes:
        - status: reject
          text: "애플리케이션 처리 실패"
    - title: "2. 502 Bad Gateway"
      from: "Gateway"
      to: "5xx Status"
      route_label: "Gateway가 상위 서버에서 유효하지 않은 응답을 받으면 502를 반환한다."
      active_actors: [gateway, application, status]
      description: "502는 게이트웨이가 응답을 받았지만 프로토콜이나 내용상 유효하게 해석하지 못한 상황이다."
      payload: ["502", "유효하지 않은 상위 응답"]
      outcomes:
        - status: reject
          text: "응답은 받았지만 해석할 수 없음"
    - title: "3. 504 Gateway Timeout"
      from: "Gateway"
      to: "5xx Status"
      route_label: "Gateway가 상위 서버의 응답을 제한 시간 안에 받지 못하면 504를 반환한다."
      active_actors: [gateway, application, status]
      description: "504는 502와 달리 상위 서버의 응답을 제때 받지 못해 기다림이 시간 제한을 넘은 상황이다."
      payload: ["504", "Gateway Timeout"]
      outcomes:
        - status: warning
          text: "응답을 받지 못함"
    - title: "4. 503 Service Unavailable"
      from: "Gateway"
      to: "5xx Status"
      route_label: "현재 요청을 처리할 준비가 되지 않은 상태를 503으로 표현한다."
      active_actors: [client, gateway, application, status]
      description: "503은 특정 구성 요소에 고정된 코드가 아니라 유지보수나 과부하처럼 일시적인 처리 불가 상태를 나타낸다."
      payload: ["503", "Service Unavailable", "Retry-After"]
      outcomes:
        - status: warning
          text: "게이트웨이에서도 반환될 수 있다."

browser_rendering:
  eyebrow: "Interactive flow"
  title: "브라우저가 응답을 픽셀로 바꾸는 흐름"
  summary: "자원 요청부터 DOM·스타일 계산, Layout·Paint를 거쳐 화면이 만들어지는 과정을 본다."
  layout: six
  actors:
    - id: input
      kind: "시작"
      name: "URL Input"
      description: "주소와 경로를 입력함"
    - id: network
      kind: "자원 확보"
      name: "Request / Response"
      description: "HTML·CSS·이미지 같은 자원을 주고받음"
    - id: dom
      kind: "문서 구조"
      name: "HTML → DOM"
      description: "HTML을 파싱해 문서 구조를 만듦"
    - id: style
      kind: "스타일 계산"
      name: "CSS → Style"
      description: "CSS를 파싱하고 계산된 스타일을 만듦"
    - id: layout
      kind: "표시 모델"
      name: "Render → Layout"
      description: "표시 대상의 크기와 위치를 계산함"
    - id: paint
      kind: "화면 출력"
      name: "Paint → Pixels"
      description: "색·글자·테두리를 그려 픽셀로 표시함"
  steps:
    - title: "1. URL 입력"
      from: "URL Input"
      to: "Request / Response"
      route_label: "브라우저가 URL에 필요한 자원을 요청한다."
      active_actors: [input, network]
      description: "HTML뿐 아니라 CSS와 이미지·글꼴처럼 화면에 필요한 자원도 요청과 응답 흐름에 포함된다."
      payload: ["URL", "HTML", "CSS", "이미지"]
      outcomes:
        - status: info
          text: "HTML 전체 도착을 기다리지 않고 도착한 부분부터 파싱될 수 있다."
    - title: "2. HTML 파싱"
      from: "Request / Response"
      to: "HTML → DOM"
      route_label: "받은 HTML을 파싱해 DOM을 만든다."
      active_actors: [network, dom]
      description: "브라우저는 HTML을 그대로 화면에 올리는 대신 문서 구조로 해석한다."
      payload: ["받은 HTML", "DOM"]
      outcomes:
        - status: info
          text: "자원 응답과 문서 구조 생성을 구분한다."
    - title: "3. CSS 계산"
      from: "Request / Response"
      to: "CSS → Style"
      route_label: "CSS 규칙을 파싱해 계산된 스타일을 만든다."
      active_actors: [network, style]
      description: "CSS 파싱 결과는 각 표시 대상에 적용할 색·크기·배치 관련 스타일을 결정하는 입력이 된다."
      payload: ["CSS", "계산된 스타일"]
      outcomes:
        - status: info
          text: "DOM과 스타일 계산은 화면 표시를 위한 서로 다른 입력이다."
    - title: "4. 렌더 트리와 Layout"
      from: "HTML → DOM"
      to: "Render → Layout"
      route_label: "DOM과 계산된 스타일을 바탕으로 표시 대상과 크기·위치를 계산한다."
      active_actors: [dom, style, layout]
      description: "렌더 트리는 표시할 요소를 구성하고 Layout 단계는 화면에서 차지할 위치와 크기를 계산한다."
      payload: ["Render Tree", "크기", "위치"]
      outcomes:
        - status: info
          text: "브라우저 내부 단계는 이해를 돕기 위한 단순화된 모델이다."
    - title: "5. Paint와 픽셀 표시"
      from: "Render → Layout"
      to: "Paint → Pixels"
      route_label: "계산된 모델을 색·글자·테두리로 그려 화면에 표시한다."
      active_actors: [layout, paint]
      description: "Paint는 준비된 표시 대상에 시각적 표현을 적용하고 최종 화면 픽셀을 만든다."
      payload: ["Layout", "Paint", "Pixels"]
      outcomes:
        - status: allow
          text: "응답이 해석과 계산을 거쳐 화면으로 바뀐다."

cookie_session:
  eyebrow: "Interactive flow"
  title: "Cookie와 Session으로 로그인 상태 유지"
  summary: "브라우저는 세션 ID를 전달하고 서버는 그 ID로 사용자 상태를 조회한다."
  actors:
    - id: browser
      kind: "클라이언트"
      name: "Browser"
      description: "로그인 요청과 이후 Cookie를 보냄"
    - id: cookie
      kind: "브라우저 저장소"
      name: "Cookie"
      description: "sessionId 같은 식별자를 저장함"
    - id: server
      kind: "상태 처리"
      name: "Server"
      description: "자격 증명을 확인하고 Session을 조회함"
    - id: session
      kind: "서버 저장소"
      name: "Session Store"
      description: "사용자별 로그인 상태를 보관함"
  steps:
    - title: "1. 로그인 요청"
      from: "Browser"
      to: "Server"
      route_label: "Browser가 로그인 정보를 서버에 보낸다."
      active_actors: [browser, server]
      description: "HTTP 요청 자체는 이전 요청의 사용자 상태를 자동으로 포함하지 않으므로 로그인 절차가 필요하다."
      payload: ["로그인 정보"]
      outcomes:
        - status: info
          text: "서버가 자격 증명을 확인한다."
    - title: "2. Session 상태 저장"
      from: "Server"
      to: "Session Store"
      route_label: "서버가 로그인 상태와 사용자 식별 정보를 Session에 저장한다."
      active_actors: [server, session]
      description: "Session은 여러 요청에 걸친 사용자 상태를 서버가 관리하는 저장 방식이다."
      payload: ["로그인 상태", "사용자 식별 정보"]
      outcomes:
        - status: allow
          text: "Session ID와 연결할 서버 측 상태가 만들어진다."
    - title: "3. Set-Cookie 응답"
      from: "Server"
      to: "Cookie"
      route_label: "서버가 세션 ID를 Set-Cookie로 Browser에 저장하게 한다."
      active_actors: [server, browser, cookie]
      description: "일반적인 세션 로그인에서는 로그인 정보 전체가 아니라 Session을 찾을 식별자를 Cookie에 담는다."
      payload: ["Set-Cookie", "sessionId=abc..."]
      outcomes:
        - status: info
          text: "브라우저에는 세션 ID만 저장된다."
    - title: "4. 이후 요청에 Cookie 전송"
      from: "Cookie"
      to: "Server"
      route_label: "조건에 맞는 이후 요청에 Browser가 sessionId Cookie를 포함한다."
      active_actors: [browser, cookie, server]
      description: "Cookie는 브라우저가 저장했다가 조건에 맞는 요청에 다시 보내는 데이터다."
      payload: ["Cookie: sessionId=abc..."]
      outcomes:
        - status: info
          text: "Cookie와 Session은 같은 저장 방식이 아니다."
    - title: "5. Session ID 조회"
      from: "Server"
      to: "Session Store"
      route_label: "서버가 받은 세션 ID로 사용자 상태를 찾아 요청을 처리한다."
      active_actors: [server, session]
      description: "서버는 Cookie의 식별자를 Session Store의 상태와 연결해 여러 요청을 한 로그인 흐름으로 묶는다."
      payload: ["sessionId", "로그인 상태"]
      outcomes:
        - status: allow
          text: "세션 ID로 확인된 사용자 상태를 요청 처리에 사용한다."

observability:
  eyebrow: "Interactive comparison"
  title: "관측 도구가 답하는 운영 질문"
  summary: "Health·Metrics·Trace ID·로그는 서로 다른 운영 질문에 답하며 함께 읽어야 흐름이 연결된다."
  actors:
    - id: health
      kind: "현재 상태"
      name: "Health"
      description: "지금 요청을 받을 수 있는지 확인함"
    - id: metrics
      kind: "시간에 따른 수치"
      name: "Metrics"
      description: "지연과 사용량의 변화를 보여 줌"
    - id: trace
      kind: "요청 흐름 식별자"
      name: "Trace ID"
      description: "하나의 요청이 거친 경로를 연결함"
    - id: logs
      kind: "이벤트 기록"
      name: "Logs"
      description: "무슨 일이 언제 발생했는지 기록함"
  steps:
    - title: "1. Health 확인"
      from: "Health"
      to: "Health"
      route_label: "현재 서비스가 요청을 받을 준비가 되었는지 확인한다."
      active_actors: [health]
      description: "Health는 특정 시점의 현재 상태를 확인하는 질문에 답한다."
      payload: ["현재 상태", "Ready 여부"]
      outcomes:
        - status: info
          text: "지금 요청을 받을 수 있는가?"
    - title: "2. Metrics 확인"
      from: "Metrics"
      to: "Metrics"
      route_label: "시간에 따른 지연과 사용량의 변화를 확인한다."
      active_actors: [metrics]
      description: "Metrics는 p95처럼 여러 요청의 지연 분포나 사용량 변화를 요약한다."
      payload: ["p95", "사용량", "시간 변화"]
      outcomes:
        - status: info
          text: "지연과 사용량은 어떻게 변했는가?"
    - title: "3. Trace ID 연결"
      from: "Trace ID"
      to: "Trace ID"
      route_label: "같은 Trace ID로 서비스와 DB 호출을 한 요청으로 묶는다."
      active_actors: [trace]
      description: "Trace ID는 요청이 어느 컴포넌트를 거쳤는지 찾는 식별자이며 지연 분포 자체를 대신하지 않는다."
      payload: ["Trace ID", "서비스 호출", "DB 호출"]
      outcomes:
        - status: info
          text: "이 요청은 어디를 거쳤는가?"
    - title: "4. 로그 사건 확인"
      from: "Logs"
      to: "Logs"
      route_label: "오류·상태 변화·처리 결과를 이벤트 기록으로 확인한다."
      active_actors: [logs]
      description: "로그는 특정 시점의 사건을 남기며 여러 인스턴스의 기록을 모아 Trace ID와 함께 검색할 수 있다."
      payload: ["오류 메시지", "상태 변화", "처리 결과"]
      outcomes:
        - status: info
          text: "무슨 일이 언제 기록되었는가?"

db_redis_lock:
  eyebrow: "Interactive structure"
  title: "수평 확장과 DB 연결 상한·공유 Redis 락"
  summary: "DB 연결 수는 인스턴스별 풀이 합산되고 분산 락 상태는 공통 Redis에서 공유된다."
  actors:
    - id: app_a
      kind: "애플리케이션"
      name: "App Instance A"
      description: "커넥션 풀 최대 N을 보유함"
    - id: app_b
      kind: "애플리케이션"
      name: "App Instance B"
      description: "독립된 커넥션 풀 최대 N을 보유함"
    - id: db
      kind: "데이터베이스"
      name: "DB"
      description: "모든 인스턴스 연결 상한을 함께 부담함"
    - id: redis
      kind: "공유 자원"
      name: "Common Redis"
      description: "모든 인스턴스가 확인하는 분산 락 상태를 저장함"
  steps:
    - title: "1. Instance A의 DB 연결"
      from: "App Instance A"
      to: "DB"
      route_label: "Instance A의 커넥션 풀이 DB 연결 상한을 사용한다."
      active_actors: [app_a, db]
      description: "인스턴스 하나의 풀 최대가 N이면 해당 인스턴스가 사용할 수 있는 연결 수의 상한이 된다."
      payload: ["Pool max N"]
      outcomes:
        - status: info
          text: "인스턴스별 풀이 따로 존재한다."
    - title: "2. Instance B의 DB 연결"
      from: "App Instance B"
      to: "DB"
      route_label: "Instance B의 풀도 같은 DB의 전체 연결 상한에 더해진다."
      active_actors: [app_b, db]
      description: "앱을 수평 확장하면 DB가 부담하는 연결 수는 대략 N × 인스턴스 수로 합산된다."
      payload: ["Pool max N", "N × instance count"]
      outcomes:
        - status: warning
          text: "인스턴스 증설은 DB 연결 비용도 함께 바꾼다."
    - title: "3. 공통 Redis에 락 저장"
      from: "App Instance A"
      to: "Common Redis"
      route_label: "여러 인스턴스가 같은 키의 분산 락 상태를 Redis에 기록한다."
      active_actors: [app_a, app_b, redis]
      description: "로컬 메모리가 아니라 공통 Redis에 락을 두어 Instance A와 B가 같은 상태를 확인하게 한다."
      payload: ["공유 Lock Key", "분산 락 상태"]
      outcomes:
        - status: allow
          text: "모든 인스턴스가 같은 락 상태를 볼 수 있다."
    - title: "4. 락 획득 여부 확인"
      from: "Common Redis"
      to: "App Instance B"
      route_label: "각 인스턴스가 Redis의 같은 키를 확인하고 획득 여부를 판단한다."
      active_actors: [app_a, app_b, redis]
      description: "Redis를 공통으로 사용한다고 모든 상태가 자동 공유되는 것은 아니며 공유해야 할 상태만 공통 자원에 둬야 한다."
      payload: ["같은 키 확인", "획득 성공·실패"]
      outcomes:
        - status: info
          text: "공유 범위와 보관 위치를 먼저 정한다."

functional_pipeline:
  eyebrow: "Interactive flow"
  title: "filter·map·reduce 데이터 처리 흐름"
  summary: "여러 항목을 선택하고 변환한 뒤 하나의 결과로 누적한다."
  actors:
    - id: input
      kind: "입력"
      name: "Input Data"
      description: "여러 항목의 목록을 제공함"
    - id: filter
      kind: "선택"
      name: "filter"
      description: "조건에 맞는 항목만 남김"
    - id: map
      kind: "변환"
      name: "map"
      description: "각 항목을 다른 값으로 바꿈"
    - id: reduce
      kind: "누적"
      name: "reduce"
      description: "여러 항목을 하나의 결과로 모음"
  steps:
    - title: "1. 입력 목록"
      from: "Input Data"
      to: "filter"
      route_label: "여러 항목의 목록을 조건 선택 단계로 넘긴다."
      active_actors: [input, filter]
      description: "전체 데이터에서 먼저 어떤 항목을 처리할지 선택한다."
      payload: ["여러 항목", "목록"]
      outcomes:
        - status: info
          text: "다음 단계는 선택된 항목만 받는다."
    - title: "2. 조건에 맞게 선택"
      from: "filter"
      to: "map"
      route_label: "filter가 조건에 맞는 항목만 map으로 전달한다."
      active_actors: [filter, map]
      description: "filter는 값을 변환하지 않고 처리 대상의 범위를 줄이는 역할을 한다."
      payload: ["조건", "선택된 목록"]
      outcomes:
        - status: allow
          text: "예시 결과: [5, 7]"
    - title: "3. 각 항목 변환"
      from: "map"
      to: "reduce"
      route_label: "map이 선택된 항목을 각각 다른 값으로 바꾼다."
      active_actors: [map, reduce]
      description: "map은 여러 항목 각각에 같은 변환 함수를 적용해 새로운 목록을 만든다."
      payload: ["변환 함수", "변환된 목록"]
      outcomes:
        - status: allow
          text: "예시 결과: [9, 16]"
    - title: "4. 하나의 결과로 누적"
      from: "reduce"
      to: "Result"
      route_label: "reduce가 여러 값을 하나의 결과로 합친다."
      active_actors: [reduce]
      description: "reduce는 누적 규칙에 따라 목록을 하나의 값으로 접어 전체 처리 흐름을 마무리한다."
      payload: ["누적 규칙", "결과: 10"]
      outcomes:
        - status: allow
          text: "선택·변환·누적의 역할이 분리된다."

devops_feedback:
  eyebrow: "Interactive structure"
  title: "Agile·지속적 통합·DevOps의 피드백"
  summary: "개발과 운영은 한쪽이 끝난 뒤 넘겨받는 순서가 아니라 양방향 피드백으로 연결된다."
  actors:
    - id: development
      kind: "변경 생성"
      name: "Development"
      description: "기능과 변경을 만듦"
    - id: operations
      kind: "운영 관점"
      name: "Operations"
      description: "운영 중 문제와 요구를 공유함"
    - id: agile
      kind: "연관 실천"
      name: "Agile"
      description: "짧은 주기와 피드백으로 다음 작업을 조정함"
    - id: ci
      kind: "연관 실천"
      name: "Continuous Integration"
      description: "초기부터 반복 통합하고 품질을 확인함"
  steps:
    - title: "1. 개발 변경"
      from: "Development"
      to: "Operations"
      route_label: "개발에서 만든 변경과 배포가 운영으로 이어진다."
      active_actors: [development, operations]
      description: "DevOps는 개발과 운영을 별도의 인수인계 단계로 나누기보다 변경과 운영을 연결한다."
      payload: ["기능", "변경", "배포"]
      outcomes:
        - status: info
          text: "운영은 개발이 끝난 뒤 시작되는 별도 단계가 아니다."
    - title: "2. 운영 피드백"
      from: "Operations"
      to: "Development"
      route_label: "운영 중 발견한 문제와 요구를 다음 개발에 전달한다."
      active_actors: [operations, development]
      description: "양방향 피드백은 실제 운영 조건을 다음 구현과 배포 판단에 반영하게 한다."
      payload: ["운영 문제", "요구", "피드백"]
      outcomes:
        - status: allow
          text: "개발과 운영의 협업이 반복된다."
    - title: "3. Agile과 연결"
      from: "Agile"
      to: "Development"
      route_label: "짧은 개발 주기와 피드백으로 다음 작업을 조정한다."
      active_actors: [agile, development]
      description: "Agile은 DevOps와 연관되지만 DevOps 전체와 같은 개념이거나 먼저 끝나는 단계는 아니다."
      payload: ["짧은 주기", "피드백", "우선순위 조정"]
      outcomes:
        - status: info
          text: "관련은 있지만 동일한 개념은 아니다."
    - title: "4. 지속적 통합과 연결"
      from: "Continuous Integration"
      to: "Development"
      route_label: "초기부터 반복 통합하고 품질을 확인해 빠른 피드백을 얻는다."
      active_actors: [ci, development]
      description: "지속적 통합은 DevOps와 연결되는 실천이지만 DevOps 전체를 뜻하지는 않는다."
      payload: ["반복 통합", "품질 확인", "빠른 피드백"]
      outcomes:
        - status: info
          text: "서로 연결되지만 순차적으로 한 번씩 밟는 단계는 아니다."

agile_scrum:
  eyebrow: "Interactive flow"
  title: "Agile과 Scrum의 반복 흐름"
  summary: "Product Backlog에서 Sprint와 피드백을 거쳐 다음 작업을 조정한다."
  actors:
    - id: product_backlog
      kind: "제품 전체"
      name: "Product Backlog"
      description: "제품 요구사항과 우선순위를 담음"
    - id: sprint_backlog
      kind: "이번 주기"
      name: "Sprint Backlog"
      description: "이번 Sprint에 진행할 작업을 담음"
    - id: sprint
      kind: "반복 개발"
      name: "Sprint"
      description: "짧은 주기 동안 실행 가능한 결과물을 만듦"
    - id: review
      kind: "검토"
      name: "Review"
      description: "결과물을 보고 고객 피드백을 확인함"
    - id: next_work
      kind: "조정"
      name: "Next Work"
      description: "피드백을 반영해 다음 작업 우선순위를 정함"
  steps:
    - title: "1. Product Backlog 정리"
      from: "Product Backlog"
      to: "Sprint Backlog"
      route_label: "제품 전체 요구사항 중 이번 Sprint 작업을 선택한다."
      active_actors: [product_backlog, sprint_backlog]
      description: "Product Backlog는 제품 전체의 요구사항과 우선순위를 담고 Sprint Backlog는 이번 주기에 실제 진행할 일을 담는다."
      payload: ["요구사항", "우선순위", "Sprint 목표"]
      outcomes:
        - status: info
          text: "두 Backlog의 범위를 구분한다."
    - title: "2. Sprint 실행"
      from: "Sprint Backlog"
      to: "Sprint"
      route_label: "선택한 작업으로 짧은 반복 개발 주기를 진행한다."
      active_actors: [sprint_backlog, sprint]
      description: "팀은 Sprint 목표에 필요한 작업을 진행하고 실행 가능한 결과물을 만든다."
      payload: ["Sprint 목표", "진행 작업", "결과물"]
      outcomes:
        - status: allow
          text: "짧은 주기 안에서 결과물을 만든다."
    - title: "3. 결과물 검토"
      from: "Sprint"
      to: "Review"
      route_label: "Sprint 결과물을 고객과 함께 검토한다."
      active_actors: [sprint, review]
      description: "검토는 모든 요구를 즉시 바꾸는 단계가 아니라 실제 결과에 대한 피드백을 확인하는 단계다."
      payload: ["실행 가능한 결과물", "고객 피드백"]
      outcomes:
        - status: info
          text: "Burn Down Chart는 시간과 남은 작업량을 확인하는 보조 도구다."
    - title: "4. 다음 작업 조정"
      from: "Review"
      to: "Next Work"
      route_label: "검토한 피드백으로 다음 작업의 우선순위를 조정한다."
      active_actors: [review, next_work]
      description: "피드백을 Product Backlog에 반영하고 다음 Sprint에서 진행할 작업을 다시 정한다."
      payload: ["피드백 반영", "우선순위 조정"]
      outcomes:
        - status: allow
          text: "다음 반복 주기로 이어진다."
    - title: "5. 다음 Sprint로 반복"
      from: "Next Work"
      to: "Product Backlog"
      route_label: "조정한 다음 작업을 다시 제품 Backlog와 Sprint 계획에 반영한다."
      active_actors: [next_work, product_backlog, sprint_backlog]
      description: "Agile과 Scrum의 핵심은 짧은 결과물과 피드백을 기준으로 다음 작업을 조정하는 반복이다."
      payload: ["다음 Sprint", "새 우선순위"]
      outcomes:
        - status: allow
          text: "계획을 한 번 고정하는 대신 학습 결과를 다음 주기에 반영한다."

object_dependency:
  eyebrow: "Interactive structure"
  title: "객체에 모은 책임과 추상 타입 의존성"
  summary: "관련 데이터와 기능은 객체에 모으고 고수준 정책은 추상 타입을 바라보게 한다."
  actors:
    - id: book
      kind: "응집된 객체"
      name: "Book"
      description: "제목·저자·페이지와 읽기·예약 책임을 함께 관리함"
    - id: service
      kind: "고수준 정책"
      name: "LibraryService"
      description: "도서 처리 정책을 수행함"
    - id: abstraction
      kind: "추상 타입"
      name: "BookReader"
      description: "read() 메시지로 구현체와 정책 사이를 분리함"
    - id: implementation
      kind: "구현체"
      name: "Memory / File"
      description: "같은 추상 메시지에 저장 방식별로 응답함"
  steps:
    - title: "1. 책임을 Book에 모으기"
      from: "Book"
      to: "Book"
      route_label: "상태와 그 상태를 다루는 기능을 같은 객체 경계에 둔다."
      active_actors: [book]
      description: "관련 데이터와 기능을 함께 관리하면 변경될 책임과 객체 사이의 관계를 따라 코드를 읽기 쉬워진다."
      payload: ["제목·저자·페이지", "읽기", "예약"]
      outcomes:
        - status: allow
          text: "응집도를 높이고 관련 변경을 가까이 둔다."
    - title: "2. 고수준 정책의 추상 의존"
      from: "LibraryService"
      to: "BookReader"
      route_label: "LibraryService가 구체 클래스 대신 BookReader 추상 타입에 의존한다."
      active_actors: [service, abstraction]
      description: "고수준 정책과 저수준 구현 사이에 추상 타입을 두면 구현 교체가 정책 코드로 번지는 범위를 줄일 수 있다."
      payload: ["고수준 정책", "read()", "추상 타입"]
      outcomes:
        - status: info
          text: "의존성의 방향을 구체 구현에서 추상 계약 쪽으로 둔다."
    - title: "3. 구현체 선택"
      from: "BookReader"
      to: "Memory / File"
      route_label: "같은 read() 메시지를 Memory와 File 구현체가 각 방식으로 처리한다."
      active_actors: [abstraction, implementation]
      description: "구현체가 바뀌어도 고수준 정책은 BookReader라는 같은 메시지와 계약을 사용할 수 있다."
      payload: ["Memory", "File", "같은 메시지"]
      outcomes:
        - status: allow
          text: "구체 구현에 대한 결합도를 낮춘다."

tdd_cycle:
  eyebrow: "Interactive flow"
  title: "TDD의 테스트·구현·리팩토링·재검증"
  summary: "기대 동작을 먼저 표현하고 구현한 뒤 내부 구조를 개선하고 다시 검증한다."
  actors:
    - id: test
      kind: "기대 표현"
      name: "Test"
      description: "기대 입력과 결과를 코드로 표현함"
    - id: implementation
      kind: "동작 구현"
      name: "Implementation"
      description: "테스트를 통과하도록 기능을 작성함"
    - id: refactoring
      kind: "구조 개선"
      name: "Refactoring"
      description: "외부 동작을 유지하며 내부 구조를 개선함"
    - id: verification
      kind: "회귀 확인"
      name: "Re-verification"
      description: "기존 기대 동작이 계속 유지되는지 확인함"
  steps:
    - title: "1. 테스트 작성"
      from: "Test"
      to: "Test"
      route_label: "기대 입력과 결과를 테스트로 먼저 표현한다."
      active_actors: [test]
      description: "테스트는 단순한 오류 검출을 넘어 다른 개발자가 기대 동작을 파악하는 문서 역할도 한다."
      payload: ["입력", "기대 결과"]
      outcomes:
        - status: info
          text: "개발의 기준을 코드로 남긴다."
    - title: "2. 구현"
      from: "Test"
      to: "Implementation"
      route_label: "테스트를 통과하도록 필요한 동작을 구현한다."
      active_actors: [test, implementation]
      description: "구현은 테스트가 표현한 기대 결과를 만족하도록 작성하며 새 동작의 기준을 명확히 한다."
      payload: ["기능 코드", "테스트 통과"]
      outcomes:
        - status: allow
          text: "기대 동작이 실행 가능한 코드가 된다."
    - title: "3. 리팩토링"
      from: "Implementation"
      to: "Refactoring"
      route_label: "외부 동작을 바꾸지 않고 내부 구조를 개선한다."
      active_actors: [implementation, refactoring]
      description: "리팩토링은 TDD와 같은 개념이 아니라 TDD 사이클 안에서 수행되는 구조 개선 단계다."
      payload: ["중복 제거", "구조 개선", "동작 유지"]
      outcomes:
        - status: info
          text: "새 동작 추가와 내부 구조 개선을 구분한다."
    - title: "4. 재검증"
      from: "Refactoring"
      to: "Re-verification"
      route_label: "같은 테스트를 다시 실행해 기존 기대 동작을 확인한다."
      active_actors: [refactoring, verification, test]
      description: "리팩토링 후에도 테스트가 같은 결과를 요구하므로 변경 전후의 외부 동작을 비교할 수 있다."
      payload: ["회귀 테스트", "기존 기대 동작"]
      outcomes:
        - status: allow
          text: "검증이 끝나면 다음 동작의 테스트 작성으로 다시 이어진다."

blocking_io:
  eyebrow: "Interactive comparison"
  title: "Blocking I/O와 Selector 기반 Non-Blocking I/O"
  summary: "호출 스레드가 데이터를 기다리는 방식과 준비된 채널을 처리하는 방식을 비교한다."
  actors:
    - id: caller
      kind: "호출 주체"
      name: "Application Thread"
      description: "read() 또는 채널 처리를 실행함"
    - id: blocking
      kind: "대기 방식"
      name: "Blocking I/O"
      description: "데이터가 도착할 때까지 같은 호출 스레드를 멈춤"
    - id: selector
      kind: "준비 상태 감시"
      name: "Selector"
      description: "여러 Non-Blocking 채널의 준비 상태를 확인함"
    - id: channels
      kind: "입출력 대상"
      name: "Selectable Channels"
      description: "읽기·쓰기 준비 상태를 애플리케이션에 알림"
  steps:
    - title: "1. Blocking read 호출"
      from: "Application Thread"
      to: "Blocking I/O"
      route_label: "호출 스레드가 InputStream.read()를 호출한다."
      active_actors: [caller, blocking]
      description: "Blocking I/O에서는 호출한 스레드가 데이터 도착·스트림 종료·예외 중 하나가 될 때까지 반환을 기다린다."
      payload: ["InputStream.read()"]
      outcomes:
        - status: warning
          text: "같은 스레드는 대기 중 다음 줄을 실행하지 못한다."
    - title: "2. Blocking 대기"
      from: "Blocking I/O"
      to: "Application Thread"
      route_label: "데이터가 준비될 때까지 read() 호출이 돌아오지 않는다."
      active_actors: [caller, blocking]
      description: "Blocking이라는 이름은 호출한 흐름이 I/O 완료를 기다리는 호출 방식에 초점을 둔다."
      payload: ["데이터 대기", "호출 스레드 정지"]
      outcomes:
        - status: info
          text: "대기 시간 동안 같은 호출 흐름의 다음 처리가 멈춘다."
    - title: "3. Blocking read 반환"
      from: "Blocking I/O"
      to: "Application Thread"
      route_label: "데이터가 준비되면 read()가 반환되고 다음 처리가 실행된다."
      active_actors: [caller, blocking]
      description: "읽기 결과가 반환된 뒤에야 호출 스레드가 다음 줄의 애플리케이션 작업을 진행한다."
      payload: ["read() 반환", "입력 데이터"]
      outcomes:
        - status: allow
          text: "한 채널의 대기와 처리가 호출 흐름에 직접 묶인다."
    - title: "4. 채널 등록"
      from: "Application Thread"
      to: "Selector"
      route_label: "여러 SelectableChannel을 Non-Blocking 모드로 등록한다."
      active_actors: [caller, selector, channels]
      description: "Selector 기반 방식에서는 채널을 감시 대상으로 등록하고 애플리케이션이 준비된 채널을 나중에 처리한다."
      payload: ["SelectableChannel", "Non-Blocking"]
      outcomes:
        - status: info
          text: "여러 채널의 준비 상태를 한 Selector에서 확인할 수 있다."
    - title: "5. 준비 상태 확인"
      from: "Selector"
      to: "Selectable Channels"
      route_label: "Selector.select()가 읽기·쓰기 준비 상태를 확인한다."
      active_actors: [selector, channels]
      description: "Selector.select() 자체는 기다릴 수 있지만 각 채널의 실제 I/O 완료를 대신하는 것은 아니다."
      payload: ["Selector.select()", "읽기 준비", "쓰기 준비"]
      outcomes:
        - status: info
          text: "준비 상태 알림과 I/O 완료는 구분해야 한다."
    - title: "6. 준비된 채널 처리"
      from: "Selectable Channels"
      to: "Application Thread"
      route_label: "애플리케이션이 준비된 채널을 얻어 실제 read()·write()를 수행한다."
      active_actors: [caller, channels, selector]
      description: "준비된 채널만 골라 처리하므로 여러 채널의 대기를 하나의 이벤트 감시 흐름으로 묶을 수 있다."
      payload: ["준비된 채널", "read()", "write()"]
      outcomes:
        - status: allow
          text: "Non-Blocking은 모든 대기를 없애는 말이 아니라 호출과 준비 상태 처리를 분리하는 방식이다."

tls_handshake:
  eyebrow: "Interactive comparison"
  title: "TLS 1.2 ECDHE와 TLS 1.3 핸드셰이크"
  summary: "버전에 따라 메시지와 키 파생 흐름은 달라도 인증과 통신 키 설정 뒤 애플리케이션 데이터를 보호한다."
  actors:
    - id: client
      kind: "통신 주체"
      name: "Client"
      description: "ClientHello와 암호화된 데이터 교환을 시작함"
    - id: server
      kind: "통신 주체"
      name: "Server"
      description: "인증서와 ServerHello를 보내고 핸드셰이크를 완료함"
    - id: certificate
      kind: "서버 인증"
      name: "Certificate"
      description: "서버 공개키와 신원을 증명하는 자료"
    - id: keys
      kind: "키 파생"
      name: "Traffic Keys"
      description: "공유 비밀과 HKDF 등으로 파생된 통신 키"
  steps:
    - title: "1. ClientHello"
      from: "Client"
      to: "Server"
      route_label: "Client가 random 또는 key_share를 포함한 ClientHello를 보낸다."
      active_actors: [client, server]
      description: "TLS 1.2 ECDHE 예시와 TLS 1.3 모두 클라이언트가 핸드셰이크를 시작하지만 키 교환 메시지 구성은 다르다."
      payload: ["ClientHello", "client_random", "key_share"]
      outcomes:
        - status: info
          text: "버전에 따라 같은 이름의 단계가 같은 세부 흐름을 뜻하지는 않는다."
    - title: "2. ServerHello와 인증서"
      from: "Server"
      to: "Client"
      route_label: "Server가 선택 결과와 인증에 필요한 Certificate를 보낸다."
      active_actors: [server, certificate, client]
      description: "TLS 1.2에서는 ServerHello·Certificate·ServerKeyExchange 등이 이어지고 TLS 1.3에서는 메시지와 암호화 시점이 달라진다."
      payload: ["ServerHello", "Certificate", "server_random"]
      outcomes:
        - status: info
          text: "인증서가 서버 신원과 키 교환 검증의 한 축이 된다."
    - title: "3. 공유 비밀과 키 파생"
      from: "Client + Server"
      to: "Traffic Keys"
      route_label: "양쪽이 공유 비밀에서 방향별 핸드셰이크·애플리케이션 키를 파생한다."
      active_actors: [client, server, keys]
      description: "TLS 1.2 자료에서는 pre_master_secret과 master_secret을, TLS 1.3에서는 HKDF 기반 파생 흐름을 사용한다."
      payload: ["공유 비밀", "master_secret", "HKDF"]
      outcomes:
        - status: info
          text: "서로 같은 비밀을 계산하되 네트워크로 비밀값 자체를 보내지 않는다."
    - title: "4. 인증서 검증"
      from: "Certificate"
      to: "Client"
      route_label: "Client가 인증서와 CertificateVerify 등 서버 인증 자료를 검증한다."
      active_actors: [certificate, client, server]
      description: "TLS 1.3의 CertificateVerify는 인증서 개인키를 보유했다는 증명과 연결되며 버전별 메시지 위치를 구분해 봐야 한다."
      payload: ["CertificateVerify", "서버 신원", "서명 검증"]
      outcomes:
        - status: reject
          text: "인증 검증 실패 → 보호된 통신으로 진행하지 않는다."
        - status: allow
          text: "인증 검증 성공 → Finished 확인으로 진행한다."
    - title: "5. Finished 교환"
      from: "Client"
      to: "Server"
      route_label: "양쪽이 Finished로 핸드셰이크 무결성과 키 설정을 확인한다."
      active_actors: [client, server, keys]
      description: "Finished 확인이 끝나면 애플리케이션 데이터에 사용할 대칭키 설정이 합의된 상태가 된다."
      payload: ["Finished", "핸드셰이크 무결성"]
      outcomes:
        - status: allow
          text: "TLS 핸드셰이크가 완료된다."
    - title: "6. 애플리케이션 데이터 보호"
      from: "Traffic Keys"
      to: "Client + Server"
      route_label: "파생된 통신 키로 애플리케이션 데이터를 보호한다."
      active_actors: [client, server, keys]
      description: "핸드셰이크 뒤에는 합의한 대칭키로 애플리케이션 데이터를 암호화하고 무결성을 확인한다."
      payload: ["Application Traffic Key", "암호화된 데이터"]
      outcomes:
        - status: allow
          text: "통신 내용 보호가 시작된다."

load_balancing:
  eyebrow: "Interactive flow"
  title: "로드 밸런서의 요청 분산과 헬스 체크"
  summary: "L4·L7 판단과 헬스 체크 결과에 따라 정상 인스턴스에만 요청을 분배한다."
  actors:
    - id: client
      kind: "요청 주체"
      name: "Client"
      description: "여러 사용자의 HTTP 요청을 보냄"
    - id: load_balancer
      kind: "분산 경계"
      name: "Load Balancer"
      description: "L4·L7 기준으로 전달 대상을 선택함"
    - id: health
      kind: "상태 검사"
      name: "Health Check"
      description: "인스턴스가 요청을 받을 수 있는지 주기적으로 확인함"
    - id: instances
      kind: "백엔드"
      name: "Spring Boot Instances"
      description: "정상 인스턴스는 받고 비정상 인스턴스는 새 요청에서 제외됨"
  steps:
    - title: "1. 요청 도착"
      from: "Client"
      to: "Load Balancer"
      route_label: "Client가 Host·Path·Header를 포함한 HTTP 요청을 보낸다."
      active_actors: [client, load_balancer]
      description: "로드 밸런서는 여러 사용자의 요청을 받아 백엔드 선택 기준을 적용할 경계가 된다."
      payload: ["HTTP Request", "Host", "Path", "Header"]
      outcomes:
        - status: info
          text: "분산 판단을 요청 처리와 분리한다."
    - title: "2. 전달 기준 판단"
      from: "Load Balancer"
      to: "Spring Boot Instances"
      route_label: "L4는 IP·Port, L7은 Host·Path·Header 같은 기준으로 대상을 고른다."
      active_actors: [load_balancer, instances]
      description: "어떤 계층의 정보를 볼 수 있는지에 따라 선택 가능한 분산 기준이 달라진다."
      payload: ["L4: IP·Port", "L7: Host·Path·Header"]
      outcomes:
        - status: info
          text: "Round Robin·Weighted·Least Connections·IP Hash 등을 선택할 수 있다."
    - title: "3. 헬스 체크"
      from: "Load Balancer"
      to: "Health Check"
      route_label: "로드 밸런서가 인스턴스의 상태를 주기적으로 확인한다."
      active_actors: [load_balancer, health, instances]
      description: "헬스 체크 결과는 새 요청을 어느 인스턴스에 보낼 수 있는지 판단하는 입력이 된다."
      payload: ["주기적 검사", "정상", "비정상"]
      outcomes:
        - status: allow
          text: "정상 → 분배 대상에 포함"
        - status: reject
          text: "비정상 → 새 요청에서 제외"
    - title: "4. 정상 인스턴스로 분산"
      from: "Load Balancer"
      to: "Spring Boot Instances"
      route_label: "정상으로 확인된 A·B·C에 새 요청을 분산한다."
      active_actors: [client, load_balancer, health, instances]
      description: "비정상 D를 새 분배에서 제외하고 정상 인스턴스가 요청을 처리하도록 한다."
      payload: ["Spring Boot A·B·C", "요청 처리"]
      outcomes:
        - status: allow
          text: "회복이 확인되면 다시 분배 대상에 포함할 수 있다."

tcp_control:
  eyebrow: "Interactive comparison"
  title: "TCP 흐름 제어와 혼잡 제어"
  summary: "흐름 제어는 수신 버퍼를, 혼잡 제어는 네트워크 경로를 보호한다."
  actors:
    - id: sender
      kind: "송신 주체"
      name: "Sender"
      description: "데이터를 네트워크로 전송함"
    - id: receiver
      kind: "수신 자원"
      name: "Receiver Buffer"
      description: "받은 데이터를 보관할 버퍼와 남은 공간을 가짐"
    - id: flow
      kind: "흐름 제어"
      name: "rwnd"
      description: "수신자가 감당할 수 있는 전송 범위를 알림"
    - id: network
      kind: "혼잡 제어"
      name: "Network Path / cwnd"
      description: "경로에 주입할 데이터 양과 혼잡 상태를 조절함"
  steps:
    - title: "1. 수신 버퍼 상태"
      from: "Receiver Buffer"
      to: "rwnd"
      route_label: "수신 버퍼의 남은 공간을 rwnd로 알린다."
      active_actors: [receiver, flow]
      description: "흐름 제어는 송신자가 수신자가 처리할 수 있는 양보다 많이 보내 버퍼를 넘치게 하지 않도록 한다."
      payload: ["수신 버퍼", "남은 공간", "rwnd"]
      outcomes:
        - status: info
          text: "보호 대상은 수신 측 버퍼다."
    - title: "2. 흐름 제어 적용"
      from: "rwnd"
      to: "Sender"
      route_label: "송신자가 수신 윈도우에 맞춰 보낼 수 있는 범위를 줄이거나 늘린다."
      active_actors: [sender, receiver, flow]
      description: "수신 버퍼가 가득 차면 송신 가능한 데이터 범위를 줄여 수신 측 처리 속도와 균형을 맞춘다."
      payload: ["rwnd", "송신 범위"]
      outcomes:
        - status: warning
          text: "수신 버퍼가 흐름 제어의 기준이다."
    - title: "3. 네트워크 혼잡 확인"
      from: "Network Path / cwnd"
      to: "Sender"
      route_label: "송신자가 네트워크 경로의 혼잡에 맞춰 cwnd를 조절한다."
      active_actors: [sender, network]
      description: "혼잡 제어는 특정 수신 버퍼가 아니라 병목과 손실이 발생할 수 있는 네트워크 경로를 보호한다."
      payload: ["cwnd", "병목", "혼잡 신호"]
      outcomes:
        - status: warning
          text: "혼잡하면 증가 폭을 완만하게 하거나 전송량을 줄인다."
    - title: "4. 두 제어를 함께 적용"
      from: "Sender"
      to: "Receiver Buffer"
      route_label: "실제 전송량은 수신 버퍼와 네트워크 경로 양쪽의 제한을 함께 고려한다."
      active_actors: [sender, receiver, flow, network]
      description: "rwnd와 cwnd는 이름이 비슷한 전송량 제한이지만 각각 수신 측과 네트워크 경로라는 다른 대상을 보호한다."
      payload: ["rwnd", "cwnd", "실제 전송 범위"]
      outcomes:
        - status: allow
          text: "보호 대상이 다르므로 두 제어를 같은 개념으로 합치지 않는다."

udp_header:
  eyebrow: "Interactive structure"
  title: "UDP 데이터그램 헤더와 데이터"
  summary: "UDP 헤더는 네 개의 16비트 필드로 구성되고 길이는 헤더와 데이터를 모두 포함한다."
  actors:
    - id: datagram
      kind: "전송 단위"
      name: "UDP Datagram"
      description: "헤더와 애플리케이션 데이터를 함께 담음"
    - id: ports
      kind: "주소 식별"
      name: "Source / Destination Port"
      description: "송신·수신 애플리케이션 포트를 표현함"
    - id: length
      kind: "크기 정보"
      name: "Length"
      description: "UDP 헤더 8바이트와 데이터 길이의 합을 나타냄"
    - id: checksum
      kind: "검사 정보"
      name: "Checksum"
      description: "데이터그램 오류 검사를 위한 필드"
  steps:
    - title: "1. 포트 필드"
      from: "UDP Datagram"
      to: "Source / Destination Port"
      route_label: "출발지와 목적지 애플리케이션 포트를 헤더에 기록한다."
      active_actors: [datagram, ports]
      description: "UDP 헤더의 앞 두 필드는 송신 측과 수신 측 포트를 각각 16비트로 담는다."
      payload: ["출발지 포트", "목적지 포트", "각 16비트"]
      outcomes:
        - status: info
          text: "포트는 데이터그램을 애플리케이션과 연결하는 식별 정보다."
    - title: "2. Length 필드"
      from: "UDP Datagram"
      to: "Length"
      route_label: "헤더와 데이터 전체 길이를 Length에 기록한다."
      active_actors: [datagram, length]
      description: "UDP Length는 헤더 8바이트만이 아니라 UDP 데이터그램 전체 크기를 포함한다."
      payload: ["UDP Header: 8 bytes", "Data length", "전체 길이"]
      outcomes:
        - status: allow
          text: "Length = 헤더 길이 + 데이터 길이"
    - title: "3. Checksum 필드"
      from: "UDP Datagram"
      to: "Checksum"
      route_label: "데이터그램의 검사 값을 헤더에 포함한다."
      active_actors: [datagram, checksum]
      description: "Checksum은 UDP 데이터그램의 전송 중 오류를 확인하는 헤더 필드다."
      payload: ["Checksum", "16비트"]
      outcomes:
        - status: info
          text: "헤더 필드 자체와 애플리케이션 데이터의 역할을 구분한다."
    - title: "4. 데이터그램 완성"
      from: "Source / Destination Port"
      to: "UDP Datagram"
      route_label: "네 개의 헤더 필드와 데이터를 하나의 UDP 데이터그램으로 전송한다."
      active_actors: [datagram, ports, length, checksum]
      description: "UDP 데이터그램은 출발지 포트·목적지 포트·길이·체크섬 헤더와 애플리케이션 데이터를 함께 가진다."
      payload: ["4 × 16비트 헤더 필드", "Application Data"]
      outcomes:
        - status: allow
          text: "UDP 헤더의 기본 구조를 완성한다."

osi_layers:
  eyebrow: "Interactive flow"
  title: "OSI 7계층과 데이터 단위"
  summary: "송신 측은 상위에서 하위로 캡슐화하고 수신 측은 하위에서 상위로 해석한다."
  actors:
    - id: application
      kind: "7~5계층"
      name: "Application Data"
      description: "응용·표현·세션 계층의 애플리케이션 데이터"
    - id: transport
      kind: "4계층"
      name: "Transport"
      description: "TCP 세그먼트 또는 UDP 데이터그램으로 전달함"
    - id: network
      kind: "3계층"
      name: "Network"
      description: "패킷 단위로 다음 네트워크를 선택함"
    - id: link
      kind: "2계층"
      name: "Data Link"
      description: "프레임 단위로 인접 노드에 전달함"
    - id: physical
      kind: "1계층"
      name: "Physical"
      description: "비트 신호로 실제 전송함"
  steps:
    - title: "1. 응용 데이터"
      from: "Application Data"
      to: "Transport"
      route_label: "응용 데이터가 전송 계층으로 내려간다."
      active_actors: [application, transport]
      description: "응용·표현·세션 계층에서 다루는 데이터가 아래 계층으로 전달될 준비를 한다."
      payload: ["데이터"]
      outcomes:
        - status: info
          text: "송신 측에서는 위에서 아래로 흐름을 본다."
    - title: "2. 전송 계층 캡슐화"
      from: "Transport"
      to: "Network"
      route_label: "TCP 세그먼트 또는 UDP 데이터그램으로 포장해 전달한다."
      active_actors: [transport, network]
      description: "전송 계층은 애플리케이션 데이터에 전송 계층 정보를 붙여 세그먼트나 데이터그램으로 만든다."
      payload: ["TCP Segment", "UDP Datagram"]
      outcomes:
        - status: info
          text: "전송 계층 데이터 단위가 만들어진다."
    - title: "3. 네트워크 계층"
      from: "Transport"
      to: "Network"
      route_label: "전송 단위를 패킷으로 감싸 목적지 네트워크를 향하게 한다."
      active_actors: [transport, network]
      description: "네트워크 계층은 상위 전송 단위를 패킷에 담아 다음 경로를 따라 전달할 수 있게 한다."
      payload: ["Packet"]
      outcomes:
        - status: info
          text: "데이터 → 세그먼트·데이터그램 → 패킷"
    - title: "4. 데이터 링크 계층"
      from: "Network"
      to: "Data Link"
      route_label: "패킷을 프레임에 담아 인접 네트워크 장치로 전달한다."
      active_actors: [network, link]
      description: "데이터 링크 계층은 현재 링크에서 전달할 프레임 단위와 관련 정보를 다룬다."
      payload: ["Frame"]
      outcomes:
        - status: info
          text: "패킷이 프레임으로 캡슐화된다."
    - title: "5. 물리 전송과 역캡슐화"
      from: "Data Link"
      to: "Physical"
      route_label: "프레임을 비트 신호로 전송하고 수신 측은 아래에서 위로 해석한다."
      active_actors: [link, physical, application]
      description: "물리 계층에서 비트가 전송된 뒤 수신 측은 하위 계층에서 상위 계층으로 각 데이터 단위를 벗겨낸다."
      payload: ["Bits", "Frame", "Packet", "Data"]
      outcomes:
        - status: allow
          text: "수신 측에서는 아래에서 위로 흐름을 이해한다."

tcp_handshake:
  eyebrow: "Interactive flow"
  title: "TCP 연결 수립과 정상 종료"
  summary: "3-Way Handshake로 연결을 수립하고 FIN·ACK 교환으로 양방향 송신을 종료한다."
  actors:
    - id: host_a
      kind: "연결 주체"
      name: "Host A"
      description: "연결을 시작하고 종료를 요청할 수 있음"
    - id: host_b
      kind: "연결 상대"
      name: "Host B"
      description: "요청을 확인하고 자신의 송신 종료를 알림"
    - id: connection
      kind: "연결 상태"
      name: "TCP Connection"
      description: "양쪽의 순서 번호와 확인 응답을 관리함"
    - id: time_wait
      kind: "종료 상태"
      name: "TIME-WAIT"
      description: "마지막 ACK와 지연 세그먼트를 고려하는 상태"
  steps:
    - title: "1. SYN"
      from: "Host A"
      to: "Host B"
      route_label: "Host A가 연결 요청과 초기 순서 번호를 보낸다."
      active_actors: [host_a, host_b, connection]
      description: "3-Way Handshake의 첫 메시지는 연결을 시작하고 Host A의 순서 번호를 알린다."
      payload: ["SYN", "초기 순서 번호"]
      outcomes:
        - status: info
          text: "아직 양쪽의 연결 확인이 모두 끝난 상태는 아니다."
    - title: "2. SYN-ACK"
      from: "Host B"
      to: "Host A"
      route_label: "Host B가 요청을 확인하고 자신의 연결 요청을 함께 보낸다."
      active_actors: [host_a, host_b, connection]
      description: "Host B는 Host A의 SYN을 확인하는 ACK와 자신의 SYN을 하나의 응답으로 보낸다."
      payload: ["SYN-ACK", "요청 확인", "서버의 요청"]
      outcomes:
        - status: info
          text: "양쪽이 서로의 요청을 확인할 준비를 한다."
    - title: "3. ACK와 연결 수립"
      from: "Host A"
      to: "Host B"
      route_label: "Host A가 Host B의 SYN을 확인하는 ACK를 보낸다."
      active_actors: [host_a, host_b, connection]
      description: "세 번째 ACK까지 확인하면 양쪽의 요청과 응답을 바탕으로 통신을 시작할 수 있다."
      payload: ["ACK", "연결 수립"]
      outcomes:
        - status: allow
          text: "3-Way Handshake 완료"
    - title: "4. 첫 번째 FIN"
      from: "Host A"
      to: "Host B"
      route_label: "Host A가 자신의 송신 방향을 끝내겠다고 알린다."
      active_actors: [host_a, host_b, connection]
      description: "TCP 종료는 한 번에 양방향을 모두 끊는 것이 아니라 각 방향의 송신 종료를 따로 확인한다."
      payload: ["FIN", "A 방향 송신 종료"]
      outcomes:
        - status: info
          text: "Host B의 송신 방향은 아직 열려 있을 수 있다."
    - title: "5. 첫 번째 FIN 확인"
      from: "Host B"
      to: "Host A"
      route_label: "Host B가 첫 번째 FIN을 ACK로 확인한다."
      active_actors: [host_a, host_b, connection]
      description: "첫 번째 FIN에 대한 ACK는 Host A의 종료 요청을 받았다는 뜻이며 Host B의 송신 종료와는 별개다."
      payload: ["ACK", "첫 FIN 확인"]
      outcomes:
        - status: info
          text: "종료가 양방향에서 동시에 끝나는 것은 아니다."
    - title: "6. 두 번째 FIN과 ACK"
      from: "Host B"
      to: "Host A"
      route_label: "Host B가 자신의 FIN을 보내고 Host A가 마지막 ACK를 보낸다."
      active_actors: [host_a, host_b, connection, time_wait]
      description: "B의 FIN 뒤 A가 ACK를 보내면 정상 종료의 네 메시지 흐름이 완성된다."
      payload: ["FIN", "ACK", "두 번째 송신 종료"]
      outcomes:
        - status: allow
          text: "정상 종료 메시지 교환 완료"
    - title: "7. TIME-WAIT 고려"
      from: "Host A"
      to: "TIME-WAIT"
      route_label: "마지막 ACK 손실에 대비해 Host A가 TIME-WAIT 상태를 고려한다."
      active_actors: [host_a, host_b, time_wait]
      description: "마지막 ACK를 받지 못하면 B가 FIN을 재전송할 수 있으므로 종료 직후의 지연 세그먼트를 고려한다."
      payload: ["TIME-WAIT", "FIN 재전송", "ACK 재전송"]
      outcomes:
        - status: info
          text: "연결 종료 뒤에도 재전송 가능성을 고려한다."

procedure_call:
  eyebrow: "Interactive flow"
  title: "저장 프로시저의 정의와 호출"
  summary: "정의할 때 본문을 DB에 저장하고 호출할 때는 이름과 인수를 전달한다."
  actors:
    - id: deploy
      kind: "정의 주체"
      name: "DB Admin / Deploy"
      description: "CREATE PROCEDURE로 본문과 매개변수를 정의함"
    - id: database
      kind: "실행 장소"
      name: "Database"
      description: "저장된 프로시저 본문을 보관하고 실행함"
    - id: application
      kind: "호출자"
      name: "Application"
      description: "프로시저 이름과 인수를 전달함"
    - id: result
      kind: "반환 값"
      name: "Result"
      description: "실행 결과 행이나 OUT 값을 호출자에게 반환함"
  steps:
    - title: "1. 프로시저 정의"
      from: "DB Admin / Deploy"
      to: "Database"
      route_label: "정의 시점에 CREATE PROCEDURE와 본문을 DB에 저장한다."
      active_actors: [deploy, database]
      description: "프로시저 전체 본문은 호출할 때마다 다시 보내는 것이 아니라 정의 단계에서 DB에 보관된다."
      payload: ["CREATE PROCEDURE", "본문", "매개변수"]
      outcomes:
        - status: allow
          text: "DB 내부에 add_amount 같은 저장 작업이 생긴다."
    - title: "2. 이름과 인수로 호출"
      from: "Application"
      to: "Database"
      route_label: "애플리케이션이 CALL 이름과 입력값만 전달한다."
      active_actors: [application, database]
      description: "호출자는 저장된 프로시저 본문 전체가 아니라 add_amount(5, 10, NULL)처럼 이름과 인수를 보낸다."
      payload: ["CALL add_amount", "입력 인수"]
      outcomes:
        - status: info
          text: "정의와 호출에서 전달되는 값의 범위를 구분한다."
    - title: "3. DB 내부 실행"
      from: "Database"
      to: "Result"
      route_label: "DB가 저장된 본문을 찾아 실행하고 결과를 만든다."
      active_actors: [database, result]
      description: "프로시저는 DB 내부에서 실행되며 예시에서는 p_total과 p_added 같은 결과를 계산한다."
      payload: ["저장된 본문", "p_total: 15", "p_added: 5"]
      outcomes:
        - status: allow
          text: "실행 위치는 DB 내부다."
    - title: "4. 결과 반환"
      from: "Result"
      to: "Application"
      route_label: "출력 결과 행이나 OUT 값을 호출자에게 반환한다."
      active_actors: [result, application]
      description: "호출자는 DB가 실행한 작업의 결과만 받아 다음 애플리케이션 흐름에 사용한다."
      payload: ["결과 행", "15", "5"]
      outcomes:
        - status: allow
          text: "호출마다 본문 전체를 전송하지 않는다."

cache_invalidation:
  eyebrow: "Interactive flow"
  title: "DB 변경과 Redis 캐시 무효화"
  summary: "TTL 만료와 원본 변경에 따른 캐시 무효화는 서로 다른 흐름이다."
  actors:
    - id: database
      kind: "원본 상태"
      name: "Relational DB"
      description: "변경 내용을 커밋해 기준 상태를 확정함"
    - id: cache
      kind: "캐시 상태"
      name: "Redis"
      description: "조회 결과와 TTL을 보관함"
    - id: invalidation
      kind: "무효화"
      name: "Cache Invalidation"
      description: "원본 변경과 관련된 오래된 결과를 삭제함"
    - id: reader
      kind: "조회 경로"
      name: "Next Read"
      description: "캐시 미스 뒤 DB에서 새 결과를 읽음"
  steps:
    - title: "1. DB 변경 커밋"
      from: "Relational DB"
      to: "Redis"
      route_label: "DB에는 새 주소가 커밋됐지만 Redis에는 이전 조회 결과가 남을 수 있다."
      active_actors: [database, cache]
      description: "DB와 Redis가 하나의 트랜잭션으로 자동 처리된다고 가정하지 않고 두 상태를 따로 확인한다."
      payload: ["새 주소", "이전 캐시", "TTL 남음"]
      outcomes:
        - status: warning
          text: "다음 요청이 만료 전 오래된 결과를 받을 수 있다."
    - title: "2. 관련 캐시 삭제"
      from: "Relational DB"
      to: "Cache Invalidation"
      route_label: "DB 변경을 확정한 뒤 관련 키의 오래된 캐시를 무효화한다."
      active_actors: [database, invalidation, cache]
      description: "캐시 무효화는 원본 변경으로 더 이상 사용할 수 없는 결과를 제거하는 대응이다."
      payload: ["DB 변경 커밋", "관련 키 삭제"]
      outcomes:
        - status: allow
          text: "오래된 조회 결과를 다음 요청에서 사용하지 않는다."
    - title: "3. 다음 조회의 Cache Miss"
      from: "Next Read"
      to: "Relational DB"
      route_label: "다음 조회가 캐시 미스를 만나 DB에서 새 결과를 읽는다."
      active_actors: [reader, cache, database]
      description: "삭제된 캐시가 없으므로 조회 경로는 원본 DB를 읽어 최신 결과를 얻는다."
      payload: ["Cache Miss", "DB 조회", "새 결과"]
      outcomes:
        - status: info
          text: "캐시 삭제와 DB 조회를 한 단계로 뭉치지 않는다."
    - title: "4. 새 결과 재저장"
      from: "Relational DB"
      to: "Redis"
      route_label: "새 조회 결과를 Redis에 저장하고 필요한 TTL을 다시 설정한다."
      active_actors: [database, cache, reader]
      description: "TTL은 시간이 지나면 키를 만료시키고 무효화는 원본 변경으로 오래된 결과를 제거한다."
      payload: ["새 조회 결과", "TTL 재설정"]
      outcomes:
        - status: allow
          text: "다음 요청부터 새 결과를 사용할 수 있다."

snapshot_timing:
  eyebrow: "Interactive comparison"
  title: "READ COMMITTED와 REPEATABLE READ의 스냅샷 기준"
  summary: "BEGIN 시점과 실제 스냅샷 기준 문장을 구분해 재조회 결과를 비교한다."
  actors:
    - id: t1
      kind: "첫 트랜잭션"
      name: "T1"
      description: "BEGIN 뒤 같은 행을 다시 조회함"
    - id: t2
      kind: "동시 변경"
      name: "T2"
      description: "이름을 변경하고 커밋함"
    - id: read_committed
      kind: "문장 기준"
      name: "READ COMMITTED"
      description: "각 문장이 시작할 때의 스냅샷을 사용함"
    - id: repeatable_read
      kind: "트랜잭션 기준"
      name: "REPEATABLE READ"
      description: "첫 조회·변경 문장의 스냅샷을 유지함"
  steps:
    - title: "1. T1 BEGIN"
      from: "T1"
      to: "READ COMMITTED"
      route_label: "T1이 시작되지만 BEGIN만으로 REPEATABLE READ 스냅샷이 확정되지는 않는다."
      active_actors: [t1, read_committed, repeatable_read]
      description: "트랜잭션 시작 시점과 실제 첫 조회 또는 첫 변경 문장의 시점을 나누어 본다."
      payload: ["BEGIN", "아직 조회 없음"]
      outcomes:
        - status: info
          text: "BEGIN과 스냅샷 확정은 같은 사건이 아니다."
    - title: "2. T1 첫 SELECT"
      from: "T1"
      to: "REPEATABLE READ"
      route_label: "첫 조회가 REPEATABLE READ에서 유지할 스냅샷의 기준이 된다."
      active_actors: [t1, repeatable_read]
      description: "첫 SELECT에서 달빛국수를 읽은 시점의 스냅샷을 이후 재조회가 참조하게 된다."
      payload: ["첫 SELECT", "달빛국수", "스냅샷 확정"]
      outcomes:
        - status: info
          text: "첫 조회 또는 첫 변경 문장이 기준이다."
    - title: "3. T2 UPDATE와 COMMIT"
      from: "T2"
      to: "T1"
      route_label: "T2가 이름을 달빛면옥으로 바꾸고 커밋한다."
      active_actors: [t1, t2, read_committed, repeatable_read]
      description: "동시 트랜잭션이 뒤에서 변경을 확정해도 격리 수준에 따라 T1의 다음 조회가 보는 스냅샷이 달라진다."
      payload: ["UPDATE", "COMMIT", "달빛면옥"]
      outcomes:
        - status: info
          text: "T2의 커밋이 T1의 모든 조회에 같은 방식으로 보이는 것은 아니다."
    - title: "4. T1 재조회 결과"
      from: "T1"
      to: "READ COMMITTED / REPEATABLE READ"
      route_label: "READ COMMITTED는 새 문장 스냅샷, REPEATABLE READ는 기존 스냅샷을 참조한다."
      active_actors: [t1, read_committed, repeatable_read]
      description: "READ COMMITTED에서는 달빛면옥을 읽을 수 있지만 REPEATABLE READ에서는 첫 조회 때의 달빛국수가 유지된다."
      payload: ["READ COMMITTED: 달빛면옥", "REPEATABLE READ: 달빛국수"]
      outcomes:
        - status: allow
          text: "격리 수준 이름보다 스냅샷 기준 시점을 확인한다."

serializable_rule:
  eyebrow: "Interactive comparison"
  title: "REPEATABLE READ와 SERIALIZABLE의 결과 보장"
  summary: "같은 값을 반복해 읽는 보장과 업무 규칙을 깨지 않는 직렬 실행 결과 보장은 다르다."
  actors:
    - id: t1
      kind: "동시 트랜잭션"
      name: "T1"
      description: "활성 운영자 A를 비활성화하려 함"
    - id: t2
      kind: "동시 트랜잭션"
      name: "T2"
      description: "활성 운영자 B를 비활성화하려 함"
    - id: repeatable
      kind: "스냅샷 보장"
      name: "REPEATABLE READ"
      description: "각 트랜잭션이 안정적인 스냅샷을 읽음"
    - id: serializable
      kind: "결과 보장"
      name: "SERIALIZABLE"
      description: "성공한 결과가 어떤 직렬 실행과 같아야 함"
  steps:
    - title: "1. 공통 초기 상태"
      from: "T1"
      to: "T2"
      route_label: "T1과 T2가 활성 운영자 A와 B 두 명을 확인한다."
      active_actors: [t1, t2]
      description: "업무 규칙은 활성 운영자가 최소 한 명 남아야 한다는 것이며 두 트랜잭션은 같은 초기 상태를 읽는다."
      payload: ["A: 활성", "B: 활성", "최소 1명"]
      outcomes:
        - status: info
          text: "각자 확인한 상태가 최종 업무 규칙을 자동 보장하지는 않는다."
    - title: "2. 서로 다른 운영자 변경"
      from: "T1"
      to: "T2"
      route_label: "T1은 A를, T2는 B를 비활성화한다."
      active_actors: [t1, t2, repeatable, serializable]
      description: "두 변경이 서로 다른 행을 건드리면 일반적인 행 충돌만으로 업무 규칙 위반을 발견하기 어려울 수 있다."
      payload: ["A 비활성화", "B 비활성화"]
      outcomes:
        - status: warning
          text: "각 트랜잭션의 안정적인 스냅샷과 전체 결과의 직렬성은 별개다."
    - title: "3. REPEATABLE READ 결과"
      from: "REPEATABLE READ"
      to: "T1 + T2 COMMIT"
      route_label: "두 트랜잭션이 모두 커밋하면 활성 운영자 0명이 될 수 있다."
      active_actors: [repeatable, t1, t2]
      description: "REPEATABLE READ는 같은 트랜잭션에서 같은 값을 읽는 성질을 제공해도 애플리케이션 업무 규칙을 자동으로 지키게 하지는 않는다."
      payload: ["T1 COMMIT", "T2 COMMIT", "활성 운영자 0명"]
      outcomes:
        - status: reject
          text: "스냅샷 안정성이 업무 규칙 보장을 의미하지 않는다."
    - title: "4. SERIALIZABLE 결과"
      from: "SERIALIZABLE"
      to: "T1 또는 T2 실패"
      route_label: "직렬 실행으로 설명할 수 없는 결과를 만들지 않도록 한 트랜잭션이 실패할 수 있다."
      active_actors: [serializable, t1, t2]
      description: "SERIALIZABLE은 모든 작업을 실제로 한 줄로 실행하는 것이 아니라 성공 결과가 어떤 직렬 실행과 같도록 조정한다."
      payload: ["직렬화 실패", "40001 가능", "재시도 고려"]
      outcomes:
        - status: allow
          text: "두 작업이 모두 커밋해 업무 규칙을 깨는 결과를 허용하지 않는다."

transaction_boundary:
  eyebrow: "Interactive comparison"
  title: "자동 커밋과 트랜잭션 경계"
  summary: "같은 실패라도 여러 SQL을 하나로 묶었는지에 따라 남는 결과가 달라진다."
  actors:
    - id: restaurant
      kind: "첫 작업"
      name: "Restaurant INSERT"
      description: "음식점 101 저장을 수행함"
    - id: relation
      kind: "두 번째 작업"
      name: "RestaurantVideo INSERT"
      description: "존재하지 않는 video_id 999 연결을 시도함"
    - id: autocommit
      kind: "분리된 확정"
      name: "Auto Commit"
      description: "각 문장을 별도 트랜잭션으로 확정함"
    - id: transaction
      kind: "업무 단위"
      name: "Explicit Transaction"
      description: "BEGIN부터 COMMIT·ROLLBACK까지 묶음"
  steps:
    - title: "1. 음식점 저장"
      from: "Restaurant INSERT"
      to: "Auto Commit"
      route_label: "자동 커밋에서는 음식점 101 저장이 즉시 확정된다."
      active_actors: [restaurant, autocommit]
      description: "첫 SQL이 성공하면 다음 SQL의 성공 여부와 분리된 커밋으로 남을 수 있다."
      payload: ["restaurant 101", "COMMIT"]
      outcomes:
        - status: allow
          text: "첫 문장의 변경이 이미 확정된다."
    - title: "2. 영상 연결 실패"
      from: "RestaurantVideo INSERT"
      to: "Auto Commit"
      route_label: "존재하지 않는 video_id 999 외래키 오류가 발생한다."
      active_actors: [relation, autocommit]
      description: "자동 커밋에서는 두 번째 문장의 실패가 앞선 커밋을 자동으로 취소하지 않는다."
      payload: ["video_id 999", "Foreign Key Error"]
      outcomes:
        - status: reject
          text: "음식점 101은 남고 영상 연결은 없다."
    - title: "3. 명시적 트랜잭션 시작"
      from: "Explicit Transaction"
      to: "Restaurant INSERT"
      route_label: "BEGIN 뒤 음식점 저장과 영상 연결을 하나의 성공 단위로 실행한다."
      active_actors: [transaction, restaurant, relation]
      description: "두 작업이 함께 성공해야 하는지는 SQL 개수가 아니라 업무의 성공 조건으로 정한다."
      payload: ["BEGIN", "음식점 저장", "영상 연결"]
      outcomes:
        - status: info
          text: "첫 작업이 성공해도 아직 최종 확정 전이다."
    - title: "4. 오류 시 ROLLBACK"
      from: "RestaurantVideo INSERT"
      to: "Explicit Transaction"
      route_label: "영상 연결이 실패하면 전체 트랜잭션을 ROLLBACK한다."
      active_actors: [transaction, relation, restaurant]
      description: "명시적 경계에서는 앞선 음식점 저장까지 함께 취소해 업무 단위의 부분 성공을 막을 수 있다."
      payload: ["외래키 오류", "ROLLBACK", "전체 취소"]
      outcomes:
        - status: reject
          text: "음식점 저장도 함께 취소된다."

wal_mvcc:
  eyebrow: "Interactive structure"
  title: "WAL·데이터 페이지·MVCC의 역할 구분"
  summary: "WAL은 장애 복구 기록이고 MVCC는 동시 실행 중 어떤 행 버전을 볼지 결정한다."
  actors:
    - id: query
      kind: "변경 실행"
      name: "SQL / Query Processor"
      description: "데이터 변경을 수행함"
    - id: buffer
      kind: "메모리 페이지"
      name: "Buffer Manager"
      description: "변경된 데이터 페이지를 메모리에 유지함"
    - id: wal
      kind: "영속 로그"
      name: "Persistent WAL"
      description: "데이터 페이지보다 먼저 변경 기록을 flush함"
    - id: data_file
      kind: "영속 데이터"
      name: "Data File / MVCC"
      description: "페이지를 기록하고 스냅샷에 따른 행 가시성을 관리함"
  steps:
    - title: "1. SQL 변경"
      from: "SQL / Query Processor"
      to: "Buffer Manager"
      route_label: "SQL 실행이 데이터 페이지의 메모리 변경을 만든다."
      active_actors: [query, buffer]
      description: "변경된 페이지는 즉시 데이터 파일에 기록되지 않고 Buffer Manager 메모리에 남아 있을 수 있다."
      payload: ["UPDATE", "변경 페이지", "메모리"]
      outcomes:
        - status: info
          text: "커밋과 데이터 페이지 기록은 같은 사건이 아니다."
    - title: "2. WAL 먼저 영속화"
      from: "Buffer Manager"
      to: "Persistent WAL"
      route_label: "데이터 페이지보다 변경 기록을 먼저 WAL에 flush한다."
      active_actors: [buffer, wal]
      description: "WAL은 커밋 내구성과 장애 뒤 복구에 필요한 변경 기록을 보관하는 층위다."
      payload: ["변경 기록", "WAL flush", "커밋 내구성"]
      outcomes:
        - status: allow
          text: "먼저 기록된 WAL이 REDO의 근거가 된다."
    - title: "3. 데이터 파일 반영"
      from: "Buffer Manager"
      to: "Data File / MVCC"
      route_label: "변경된 페이지는 나중에 데이터 파일에 기록될 수 있다."
      active_actors: [buffer, data_file]
      description: "장애로 메모리를 잃으면 WAL을 읽어 데이터 파일에 REDO할 수 있으므로 두 기록 시점을 분리한다."
      payload: ["최신 페이지", "데이터 파일", "REDO"]
      outcomes:
        - status: info
          text: "데이터 파일 쓰기가 WAL보다 늦을 수 있다."
    - title: "4. MVCC 가시성 판단"
      from: "Data File / MVCC"
      to: "Data File / MVCC"
      route_label: "트랜잭션 스냅샷에 따라 v1·v2 중 보이는 행 버전을 선택한다."
      active_actors: [data_file]
      description: "MVCC는 WAL 기록 순서의 단계가 아니라 동시 실행 중 트랜잭션이 어떤 행 버전을 읽을지 관리하는 별도의 축이다."
      payload: ["v1 이전 값", "v2 변경 값", "스냅샷"]
      outcomes:
        - status: info
          text: "WAL과 MVCC를 하나의 저장 순서로 합치지 않는다."

normalization:
  eyebrow: "Interactive structure"
  title: "함수 종속성에 따른 정규화 분해"
  summary: "사실을 결정하는 키가 있는 테이블에 두고 관계는 연결 테이블로 분리한다."
  actors:
    - id: raw
      kind: "분해 전"
      name: "RestaurantVideoDetail"
      description: "음식점·영상·유튜버 사실이 한 행에 함께 반복됨"
    - id: dependency
      kind: "분석 기준"
      name: "Functional Dependencies"
      description: "키가 어떤 사실을 결정하는지 확인함"
    - id: entities
      kind: "대상 테이블"
      name: "Restaurant / Video / YouTuber"
      description: "각 대상의 사실을 식별 키와 함께 관리함"
    - id: relation
      kind: "연결 테이블"
      name: "RestaurantVideo"
      description: "음식점과 영상의 관계와 복합 PK를 관리함"
  steps:
    - title: "1. 통합 구조 확인"
      from: "RestaurantVideoDetail"
      to: "Functional Dependencies"
      route_label: "한 행에 반복된 음식점·영상·유튜버 정보를 함수 종속성으로 분석한다."
      active_actors: [raw, dependency]
      description: "restaurant_id가 이름을, video_id가 제목과 youtuber_id를, youtuber_id가 이름을 결정하는 관계를 찾는다."
      payload: ["restaurant_name", "video_title", "youtuber_name"]
      outcomes:
        - status: warning
          text: "서로 다른 사실이 한 행에 반복되면 갱신 이상이 생길 수 있다."
    - title: "2. 결정 키별 테이블 분리"
      from: "Functional Dependencies"
      to: "Restaurant / Video / YouTuber"
      route_label: "각 사실을 결정하는 키가 있는 대상 테이블로 옮긴다."
      active_actors: [dependency, entities]
      description: "Restaurant·Video·YouTuber 각각의 고유 사실을 해당 PK가 있는 곳에서 한 번 관리한다."
      payload: ["PK", "restaurant_id", "video_id", "youtuber_id"]
      outcomes:
        - status: allow
          text: "이름과 제목의 중복 저장을 줄인다."
    - title: "3. 관계를 연결 테이블로 이동"
      from: "Restaurant / Video / YouTuber"
      to: "RestaurantVideo"
      route_label: "음식점과 영상의 연결은 FK와 복합 PK를 가진 연결 테이블에 둔다."
      active_actors: [entities, relation]
      description: "대상의 사실과 대상 사이 관계를 분리하면 각 책임과 중복 방지 규칙을 구분해 관리할 수 있다."
      payload: ["restaurant_id FK", "video_id FK", "PK (restaurant_id, video_id)"]
      outcomes:
        - status: allow
          text: "연결 관계의 중복을 복합 PK로 제한한다."

lossless_dependency:
  eyebrow: "Interactive comparison"
  title: "무손실 복원과 종속성 보존"
  summary: "JOIN으로 원래 정보를 복원할 수 있는지와 업무 규칙을 강제할 수 있는지는 별도로 확인한다."
  actors:
    - id: original
      kind: "분해 전 관계"
      name: "Featured Video Relation"
      description: "음식점·유튜버 조합마다 대표 영상 하나라는 규칙을 가짐"
    - id: video
      kind: "대상 테이블"
      name: "Video"
      description: "video_id와 youtuber_id를 관리함"
    - id: join_table
      kind: "연결 테이블"
      name: "RestaurantFeaturedVideo"
      description: "restaurant_id와 video_id를 연결함"
    - id: rule
      kind: "추가 업무 규칙"
      name: "Dependency Check"
      description: "음식점·유튜버 조합의 대표 영상 개수를 검증함"
  steps:
    - title: "1. 분해와 FK 연결"
      from: "Featured Video Relation"
      to: "Video"
      route_label: "Video와 연결 테이블로 정보를 나누고 video_id FK로 연결한다."
      active_actors: [original, video, join_table]
      description: "개별 PK·FK를 두어도 원래 대상과 관계를 참조할 수 있는 구조를 만들 수 있다."
      payload: ["video_id PK", "video_id FK", "restaurant_id"]
      outcomes:
        - status: allow
          text: "참조 대상이 존재하는지 확인할 수 있다."
    - title: "2. 무손실 JOIN 복원"
      from: "RestaurantFeaturedVideo"
      to: "Video"
      route_label: "연결 테이블과 Video를 JOIN해 원래 관계의 속성을 복원한다."
      active_actors: [join_table, video, original]
      description: "공통 속성 video_id가 연결되므로 restaurant_id와 youtuber_id를 포함한 관계를 복원할 수 있다."
      payload: ["JOIN ON video_id", "원래 관계 복원"]
      outcomes:
        - status: allow
          text: "무손실 복원은 가능하다."
    - title: "3. 종속성 규칙 별도 검증"
      from: "RestaurantFeaturedVideo"
      to: "Dependency Check"
      route_label: "PK·FK만으로 음식점·유튜버 조합의 대표 영상 하나 규칙을 보장할 수 있는지 확인한다."
      active_actors: [join_table, video, rule]
      description: "같은 조합에 V101과 V103이 모두 연결되면 JOIN은 되지만 대표 영상 하나라는 업무 규칙은 깨질 수 있다."
      payload: ["(restaurant_id, youtuber_id)", "→ video_id", "추가 검증"]
      outcomes:
        - status: reject
          text: "무손실 복원과 종속성 보존은 같은 보장이 아니다."

anomaly_index:
  eyebrow: "Interactive comparison"
  title: "정규화와 복합 인덱스 설계 기준"
  summary: "중복된 사실은 책임별로 나누고 복합 인덱스는 앞 컬럼 조건이 만드는 구간을 기준으로 읽는다."
  actors:
    - id: duplicated
      kind: "갱신 이상"
      name: "Duplicated Rows"
      description: "같은 음식점 이름이 여러 연결 행에 반복됨"
    - id: normalized
      kind: "분리된 책임"
      name: "Restaurant + RestaurantVideo"
      description: "이름과 연결을 서로 다른 책임으로 관리함"
    - id: index
      kind: "정렬 키"
      name: "Composite Index"
      description: "region_id·category_id·created_at DESC 순으로 정렬함"
    - id: query
      kind: "조회 조건"
      name: "Query Predicate"
      description: "앞 컬럼을 얼마나 고정하는지에 따라 읽을 구간이 달라짐"
  steps:
    - title: "1. 중복 행의 갱신 이상"
      from: "Duplicated Rows"
      to: "Duplicated Rows"
      route_label: "연결 행 일부만 음식점 이름을 바꾸면 서로 다른 이름이 함께 남는다."
      active_actors: [duplicated]
      description: "음식점의 사실과 영상 연결을 한 테이블에 반복 저장하면 일부 행만 수정되는 갱신 이상이 생길 수 있다."
      payload: ["달빛국수", "달빛면옥", "부분 수정"]
      outcomes:
        - status: warning
          text: "한 사실을 여러 행에서 관리하는 비용이 드러난다."
    - title: "2. 책임별 분리"
      from: "Duplicated Rows"
      to: "Restaurant + RestaurantVideo"
      route_label: "Restaurant에는 이름을 한 번 두고 RestaurantVideo에는 연결만 둔다."
      active_actors: [duplicated, normalized]
      description: "이름 변경 대상은 Restaurant 한 행으로 좁히고 영상 관계는 별도 연결 테이블에서 관리한다."
      payload: ["Restaurant", "RestaurantVideo", "책임 분리"]
      outcomes:
        - status: allow
          text: "사실과 관계의 변경 범위를 구분한다."
    - title: "3. 복합 인덱스 정렬"
      from: "Composite Index"
      to: "Query Predicate"
      route_label: "region_id → category_id → created_at DESC 순으로 구간과 정렬이 이어진다."
      active_actors: [index, query]
      description: "앞의 컬럼으로 범위를 좁힌 뒤 같은 조합 안에서 뒤 컬럼의 정렬 순서를 활용한다."
      payload: ["region_id", "category_id", "created_at DESC"]
      outcomes:
        - status: info
          text: "인덱스는 각 컬럼의 독립 목록이 아니다."
    - title: "4. 조건에 따른 활용 범위"
      from: "Query Predicate"
      to: "Composite Index"
      route_label: "지역과 카테고리를 모두 고정하면 해당 구간에서 최신순으로 읽기 쉽다."
      active_actors: [index, query]
      description: "category_id 조건이 빠지면 지역 전체가 created_at 순으로 바로 이어진다고 단정할 수 없어 실행계획을 확인해야 한다."
      payload: ["region_id = 17", "category_id = 3", "LIMIT 20"]
      outcomes:
        - status: info
          text: "복합 인덱스 선택 여부는 데이터 분포와 실행계획으로 확인한다."

composite_index:
  eyebrow: "Interactive comparison"
  title: "복합 인덱스의 컬럼 순서와 조회 조건"
  summary: "앞의 컬럼을 고정한 구간 안에서 뒤 컬럼의 정렬 순서를 활용한다."
  actors:
    - id: index
      kind: "정렬 키"
      name: "region_id → category_id → created_at DESC"
      description: "지역·카테고리·최신순으로 이어지는 복합 인덱스"
    - id: full_match
      kind: "조건이 충분함"
      name: "지역 + 카테고리"
      description: "앞의 두 컬럼이 동등 조건으로 고정됨"
    - id: partial_match
      kind: "조건이 부족함"
      name: "지역만"
      description: "category_id가 고정되지 않음"
    - id: plan
      kind: "검증 기준"
      name: "Execution Plan"
      description: "옵티마이저가 실제 인덱스 활용을 판단함"
  steps:
    - title: "1. 인덱스 순서"
      from: "region_id → category_id → created_at DESC"
      to: "지역 + 카테고리"
      route_label: "먼저 지역으로 묶고 같은 지역 안에서 카테고리, 그 안에서 최신순이 이어진다."
      active_actors: [index, full_match]
      description: "복합 인덱스는 각 컬럼이 독립된 정렬 목록이 아니라 앞 컬럼으로 만든 구간 안에서 다음 순서를 갖는다."
      payload: ["region_id", "category_id", "created_at DESC"]
      outcomes:
        - status: info
          text: "컬럼 순서가 조회 가능한 구간의 기준이 된다."
    - title: "2. 앞의 두 조건 고정"
      from: "지역 + 카테고리"
      to: "Execution Plan"
      route_label: "region_id = 17 AND category_id = 3이면 해당 조합 구간을 최신순으로 읽기 쉽다."
      active_actors: [index, full_match, plan]
      description: "앞의 두 컬럼이 동등 조건으로 고정되면 created_at DESC 순서를 LIMIT 조회에 활용할 가능성이 있다."
      payload: ["region_id = 17", "category_id = 3", "LIMIT 20"]
      outcomes:
        - status: allow
          text: "필요한 구간에서 최신순 읽기를 기대할 수 있다."
    - title: "3. 카테고리 조건 누락"
      from: "지역만"
      to: "Execution Plan"
      route_label: "region_id만 고정하면 지역 전체가 created_at 순이라고 바로 볼 수 없다."
      active_actors: [index, partial_match, plan]
      description: "category_id가 빠지면 여러 카테고리 구간이 섞여 뒤 컬럼의 전역 순서를 직접 보장하지 못할 수 있다."
      payload: ["region_id = 17", "category_id 조건 없음"]
      outcomes:
        - status: warning
          text: "인덱스 순서만 보고 정렬을 단정하지 않는다."
    - title: "4. 실행계획 확인"
      from: "Execution Plan"
      to: "지역 + 카테고리"
      route_label: "데이터 분포와 비용을 포함한 실행계획으로 실제 선택을 확인한다."
      active_actors: [plan, index, full_match, partial_match]
      description: "복합 인덱스를 만들었다는 사실만으로 사용이 보장되지는 않으므로 실제 조회 패턴과 실행계획을 함께 확인한다."
      payload: ["데이터 분포", "옵티마이저 비용", "실행계획"]
      outcomes:
        - status: info
          text: "자주 쓰는 조회가 다르면 다른 인덱스 후보도 검토한다."

replica_consistency:
  eyebrow: "Interactive flow"
  title: "PostgreSQL Primary·Read Replica 읽기 일관성"
  summary: "쓰기 경로와 읽기 분산을 나누되, 수정 직후 최신 값이 필요한지는 별도로 판단한다."
  actors:
    - id: request
      kind: "요청 유형"
      name: "Application Request"
      description: "관리자 수정·일반 검색·수정 직후 조회를 구분함"
    - id: primary
      kind: "쓰기 원본"
      name: "PostgreSQL Primary"
      description: "쓰기와 최신 상태 확인을 처리함"
    - id: wal
      kind: "복제 경로"
      name: "WAL / Standby"
      description: "Primary 변경 기록을 Replica로 전달하고 적용함"
    - id: replica
      kind: "읽기 분산"
      name: "Read Replica"
      description: "복제 지연을 허용할 수 있는 일반 검색을 처리함"
  steps:
    - title: "1. 관리자 수정은 Primary"
      from: "Application Request"
      to: "PostgreSQL Primary"
      route_label: "관리자 음식점 수정은 Primary로 보내 최신 상태를 기록한다."
      active_actors: [request, primary]
      description: "INSERT·UPDATE는 Primary에 먼저 반영되고 커밋 응답의 기준도 Primary가 된다."
      payload: ["관리자 수정", "INSERT·UPDATE"]
      outcomes:
        - status: allow
          text: "쓰기 요청은 자동으로 여러 Replica에 분산되는 것이 아니다."
    - title: "2. WAL 비동기 전달"
      from: "PostgreSQL Primary"
      to: "WAL / Standby"
      route_label: "Primary가 변경 기록을 WAL로 만들고 Standby에 전달한다."
      active_actors: [primary, wal, replica]
      description: "비동기 복제에서는 Primary 커밋 시점과 Replica 적용 시점 사이에 지연이 생길 수 있다."
      payload: ["WAL", "비동기 적용", "복제 지연"]
      outcomes:
        - status: warning
          text: "Replica에는 이전 값이 잠시 남을 수 있다."
    - title: "3. 일반 검색 분산"
      from: "Application Request"
      to: "Read Replica"
      route_label: "짧은 지연을 허용하는 일반 검색을 Read Replica로 보낸다."
      active_actors: [request, replica]
      description: "Read Replica는 읽기 요청을 나누는 데 도움을 주지만 쓰기 확장을 자동으로 해결하는 구성은 아니다."
      payload: ["일반 검색", "읽기 전용 쿼리"]
      outcomes:
        - status: info
          text: "읽기 분산과 쓰기 확장은 다른 문제다."
    - title: "4. 수정 직후 최신 값 확인"
      from: "Application Request"
      to: "PostgreSQL Primary"
      route_label: "최신 값이 즉시 필요하면 Primary를 읽거나 복제 적용을 확인한다."
      active_actors: [request, primary, replica, wal]
      description: "수정 직후 화면은 Replica 지연을 허용하지 않을 수 있으므로 읽기 대상을 최신성 요구에 맞춰 선택한다."
      payload: ["최신 값 필요", "Primary 읽기", "복제 적용 확인"]
      outcomes:
        - status: allow
          text: "동기 복제도 응답 지연과 보장 범위를 함께 검토해야 한다."

floating_point_repr:
  eyebrow: "Interactive comparison"
  title: "고정 소수점과 부동 소수점 표현"
  summary: "고정 소수점은 자릿수를 약속하고 부동 소수점은 부호·지수·가수로 범위와 정밀도를 나눈다."
  actors:
    - id: input
      kind: "입력 값"
      name: "Decimal Value"
      description: "십진수로 표현한 원래 값"
    - id: fixed
      kind: "고정 위치"
      name: "Fixed Point"
      description: "소수점 위치를 미리 정한 표현"
    - id: floating
      kind: "분해 표현"
      name: "Floating Point"
      description: "부호·지수·가수로 나눈 표현"
    - id: precision
      kind: "저장 한계"
      name: "Finite Precision"
      description: "제한된 비트 수에 맞춰 반올림되는 정밀도"
  steps:
    - title: "1. 소수점 위치 약속"
      from: "Decimal Value"
      to: "Fixed Point"
      route_label: "정해 둔 자릿수에 정수부와 소수부를 배치한다."
      active_actors: [input, fixed]
      description: "고정 소수점은 소수점이 움직이지 않으므로 표현 범위와 정밀도 배분을 먼저 정해야 한다."
      payload: ["정수부", "소수부", "고정 위치"]
      outcomes:
        - status: info
          text: "구조가 단순하지만 큰 범위와 세밀한 정밀도를 동시에 얻기 어렵다."
    - title: "2. 이진 분수 변환"
      from: "Decimal Value"
      to: "Floating Point"
      route_label: "십진 값을 이진수의 부호와 정규화된 형태로 바꾼다."
      active_actors: [input, floating]
      description: "부동 소수점은 값의 크기와 세밀함을 서로 다른 필드로 나누어 표현한다."
      payload: ["부호", "지수", "가수"]
      outcomes:
        - status: info
          text: "지수는 범위를, 가수는 유효한 정밀도를 좌우한다."
    - title: "3. 반복되는 0.1"
      from: "Decimal Value"
      to: "Floating Point"
      route_label: "0.1의 이진 분수는 끝나지 않아 저장 가능한 비트에서 잘린다."
      active_actors: [input, floating, precision]
      description: "십진수의 유한한 표기가 이진수에서도 유한하다는 보장은 없으므로 근삿값이 저장될 수 있다."
      payload: ["0.1₁₀", "반복 이진 분수", "근삿값"]
      outcomes:
        - status: warning
          text: "저장값과 수학적으로 정확한 0.1을 구분해야 한다."
    - title: "4. 연산 후 오차"
      from: "Floating Point"
      to: "Finite Precision"
      route_label: "제한된 비트 수가 중간 계산과 비교 결과에 영향을 줄 수 있다."
      active_actors: [floating, precision]
      description: "부동 소수점 비교에서는 표현 오차와 허용 오차를 함께 고려해야 한다."
      payload: ["반올림", "표현 오차", "허용 오차"]
      outcomes:
        - status: warning
          text: "실수 비교를 단순한 동등 비교로만 처리하지 않는다."

hamming_syndrome:
  eyebrow: "Interactive flow"
  title: "Hamming(7,4) 오류 검출과 수정"
  summary: "패리티 검사 결과를 신드롬으로 합치면 한 비트 오류의 위치를 가리킬 수 있다."
  actors:
    - id: data
      kind: "원본 데이터"
      name: "Data Bits"
      description: "패리티를 제외한 네 개의 데이터 비트"
    - id: parity
      kind: "검사 비트"
      name: "P1 · P2 · P4"
      description: "각 위치 묶음의 홀짝을 확인하는 비트"
    - id: syndrome
      kind: "오류 위치"
      name: "S4 · S2 · S1"
      description: "검사 결과를 이진 위치 번호로 합친 값"
    - id: decoder
      kind: "수정기"
      name: "Decoder"
      description: "신드롬이 가리킨 비트를 반전하는 처리"
  steps:
    - title: "1. 데이터 배치"
      from: "Data Bits"
      to: "P1 · P2 · P4"
      route_label: "데이터 비트 사이에 위치 1·2·4의 패리티 자리를 둔다."
      active_actors: [data, parity]
      description: "Hamming(7,4)은 일곱 위치 중 네 곳에 데이터를 배치하고 세 곳을 검사 비트로 사용한다."
      payload: ["0110", "위치 1·2·4", "7비트 코드워드"]
      outcomes:
        - status: info
          text: "위치 번호와 패리티 묶음을 먼저 분리해 읽는다."
    - title: "2. 수신 코드워드 검사"
      from: "P1 · P2 · P4"
      to: "S4 · S2 · S1"
      route_label: "각 패리티 묶음의 홀짝 결과를 S1·S2·S4로 계산한다."
      active_actors: [parity, syndrome]
      description: "검사 결과가 모두 0이면 오류가 없거나 검출 범위를 벗어난 상황으로 해석한다."
      payload: ["S1", "S2", "S4", "홀짝 검사"]
      outcomes:
        - status: info
          text: "검사 비트 자체가 오류 위치 계산에도 참여한다."
    - title: "3. 신드롬 101"
      from: "S4 · S2 · S1"
      to: "Decoder"
      route_label: "S4·S2·S1을 위치 번호 101₂로 읽어 5번 비트를 찾는다."
      active_actors: [syndrome, decoder]
      description: "신드롬은 오류가 의심되는 코드워드 위치를 이진수로 표현한다."
      payload: ["101₂", "5번 위치", "오류 검출"]
      outcomes:
        - status: warning
          text: "신드롬 비트의 읽는 순서를 바꾸면 다른 위치가 된다."
    - title: "4. 한 비트 반전"
      from: "Decoder"
      to: "Data Bits"
      route_label: "가리킨 위치의 비트를 반전한 뒤 데이터 위치를 다시 읽는다."
      active_actors: [decoder, data]
      description: "기본 Hamming(7,4)은 한 비트 오류를 전제로 위치를 찾아 수정한다."
      payload: ["5번 비트 반전", "0110 복원", "단일 오류"]
      outcomes:
        - status: allow
          text: "여러 비트 오류에는 기본 코드의 보장 범위를 벗어날 수 있다."

bytecode_jvm:
  eyebrow: "Interactive flow"
  title: "Java 바이트코드와 플랫폼별 JVM"
  summary: "JAR의 바이트코드는 재사용할 수 있지만 JVM과 네이티브 라이브러리는 대상 환경에 맞아야 한다."
  actors:
    - id: app
      kind: "애플리케이션"
      name: "Java JAR"
      description: "공통 Java 바이트코드를 담은 패키지"
    - id: jvm
      kind: "실행기"
      name: "Target JVM"
      description: "클래스 파일과 API를 해석하는 환경별 JVM"
    - id: platform
      kind: "플랫폼"
      name: "OS + CPU"
      description: "Linux x86-64 또는 Linux ARM64 같은 실행 환경"
    - id: native
      kind: "추가 의존성"
      name: "Native Library"
      description: "JNI 등으로 연결되는 플랫폼별 바이너리"
  steps:
    - title: "1. 공통 바이트코드"
      from: "Java JAR"
      to: "Target JVM"
      route_label: "같은 JAR의 클래스 파일을 대상 JVM이 읽는다."
      active_actors: [app, jvm]
      description: "Java 소스에서 빌드한 바이트코드는 JVM이 제공하는 실행 추상화에 올라간다."
      payload: [".class", "JAR", "Java 버전"]
      outcomes:
        - status: info
          text: "JAR이 같다는 사실만으로 실행 환경 호환성이 완성되지는 않는다."
    - title: "2. JVM 선택"
      from: "OS + CPU"
      to: "Target JVM"
      route_label: "Linux x86-64와 Linux ARM64에 맞는 JVM 구현을 선택한다."
      active_actors: [platform, jvm]
      description: "JVM 자체가 대상 OS와 CPU에서 동작하고 클래스 파일 버전과 API를 지원해야 한다."
      payload: ["Linux x86-64", "Linux ARM64", "JVM 배포판"]
      outcomes:
        - status: allow
          text: "플랫폼에 맞는 JVM이 있으면 같은 바이트코드를 실행할 수 있다."
    - title: "3. 네이티브 의존성 확인"
      from: "Java JAR"
      to: "Native Library"
      route_label: "JNI 라이브러리가 있으면 OS와 CPU용 바이너리를 별도로 확인한다."
      active_actors: [app, native, platform]
      description: "네이티브 코드는 바이트코드처럼 JVM이 자동으로 이식해 주지 않는다."
      payload: ["JNI", "x86-64 바이너리", "ARM64 바이너리"]
      outcomes:
        - status: warning
          text: "CPU가 같아도 운영체제가 다르면 라이브러리가 호환되지 않을 수 있다."
    - title: "4. 실제 실행 검증"
      from: "Target JVM"
      to: "OS + CPU"
      route_label: "대상 환경에서 클래스 파일·API·네이티브 의존성을 함께 실행해 확인한다."
      active_actors: [jvm, platform, native]
      description: "버전 숫자만 비교하지 말고 실제 배포 환경에서 시작과 주요 기능을 검증한다."
      payload: ["클래스 파일 버전", "API 지원", "실행 테스트"]
      outcomes:
        - status: info
          text: "호환성 판단은 구성 요소별 조건을 확인한 뒤 실행으로 마무리한다."

multiplatform_image:
  eyebrow: "Interactive flow"
  title: "Docker 멀티 플랫폼 이미지 선택"
  summary: "하나의 이미지 이름 아래 매니페스트가 플랫폼별 이미지를 연결하고 런타임이 맞는 변형을 고른다."
  actors:
    - id: tag
      kind: "이미지 이름"
      name: "One Image Tag"
      description: "사용자가 pull·run에 지정하는 공통 이름"
    - id: manifest
      kind: "선택 목록"
      name: "Manifest List"
      description: "linux/amd64와 linux/arm64 변형을 연결하는 목록"
    - id: platform
      kind: "실행 환경"
      name: "Host Platform"
      description: "현재 호스트의 OS와 CPU 조합"
    - id: image
      kind: "실제 이미지"
      name: "Platform Image"
      description: "선택된 플랫폼 전용 레이어 묶음"
  steps:
    - title: "1. 공통 태그 요청"
      from: "One Image Tag"
      to: "Manifest List"
      route_label: "런타임이 하나의 이미지 이름으로 매니페스트 목록을 조회한다."
      active_actors: [tag, manifest]
      description: "사용자는 플랫폼별 태그를 직접 고르지 않고 공통 이미지 이름을 요청할 수 있다."
      payload: ["image:latest", "pull", "run"]
      outcomes:
        - status: info
          text: "공통 태그는 여러 플랫폼 변형을 가리킬 수 있다."
    - title: "2. 호스트 플랫폼 판별"
      from: "Host Platform"
      to: "Manifest List"
      route_label: "매니페스트에서 현재 OS와 CPU에 맞는 항목을 찾는다."
      active_actors: [platform, manifest]
      description: "linux/amd64와 linux/arm64처럼 플랫폼 식별자가 선택 기준이 된다."
      payload: ["os", "architecture", "variant"]
      outcomes:
        - status: allow
          text: "호스트와 일치하는 이미지 변형을 선택할 수 있다."
    - title: "3. 플랫폼 이미지 선택"
      from: "Manifest List"
      to: "Platform Image"
      route_label: "선택된 매니페스트 항목이 해당 플랫폼의 이미지 레이어를 가리킨다."
      active_actors: [manifest, image]
      description: "매니페스트는 실제 실행에 사용할 플랫폼 전용 이미지의 위치를 연결한다."
      payload: ["linux/amd64", "linux/arm64", "digest"]
      outcomes:
        - status: info
          text: "같은 애플리케이션 버전이어도 플랫폼별 레이어가 다를 수 있다."
    - title: "4. 컨테이너 실행"
      from: "Platform Image"
      to: "Host Platform"
      route_label: "선택된 이미지가 현재 OS와 CPU에서 실행된다."
      active_actors: [image, platform]
      description: "네이티브 라이브러리나 실행 환경의 추가 제약은 이미지 선택 뒤에도 확인해야 한다."
      payload: ["컨테이너", "CPU 명령어", "실행 환경"]
      outcomes:
        - status: warning
          text: "플랫폼 이미지가 있어도 내부 네이티브 의존성의 호환성은 별도 문제다."

array_memory:
  eyebrow: "Interactive comparison"
  title: "기본형 배열과 참조형 배열의 메모리 구조"
  summary: "기본형 배열은 값 슬롯을 담고 참조형 배열은 객체를 가리키는 참조 슬롯과 별도 객체를 가진다."
  actors:
    - id: array
      kind: "배열"
      name: "Array Slots"
      description: "인덱스로 접근하는 연속된 슬롯"
    - id: value
      kind: "기본형"
      name: "Primitive Values"
      description: "슬롯 안에 직접 저장되는 값"
    - id: reference
      kind: "참조형"
      name: "References"
      description: "별도 객체를 가리키는 참조 값"
    - id: object
      kind: "객체"
      name: "Heap Objects"
      description: "참조가 가리키는 실제 객체 데이터"
  steps:
    - title: "1. 기본형 값 저장"
      from: "Array Slots"
      to: "Primitive Values"
      route_label: "배열 슬롯에 int·double 같은 기본형 값이 직접 놓인다."
      active_actors: [array, value]
      description: "기본형 배열은 인덱스가 가리키는 위치에서 값을 바로 읽는 구조로 생각할 수 있다."
      payload: ["int[]", "값 슬롯", "index"]
      outcomes:
        - status: info
          text: "배열 길이와 요소 타입이 저장 구조를 결정한다."
    - title: "2. 참조 저장"
      from: "Array Slots"
      to: "References"
      route_label: "참조형 배열의 슬롯에는 객체 자체가 아니라 참조가 저장된다."
      active_actors: [array, reference]
      description: "각 슬롯의 참조는 같은 객체를 가리킬 수도 있고 null일 수도 있다."
      payload: ["String[]", "참조 슬롯", "null"]
      outcomes:
        - status: info
          text: "슬롯의 값과 객체의 실제 데이터 위치를 구분한다."
    - title: "3. 객체 접근"
      from: "References"
      to: "Heap Objects"
      route_label: "슬롯의 참조를 따라 힙에 있는 객체의 필드와 값을 읽는다."
      active_actors: [reference, object]
      description: "참조형 배열은 배열 영역과 각 객체 영역을 함께 생각해야 한다."
      payload: ["reference → object", "필드", "객체 수명"]
      outcomes:
        - status: info
          text: "배열의 요소 접근과 객체 내부 접근은 서로 다른 단계다."

linked_list_traversal:
  eyebrow: "Interactive flow"
  title: "연결 리스트의 인덱스 탐색"
  summary: "이중 연결 리스트는 인덱스와 head·tail의 거리를 비교해 가까운 끝에서 노드를 따라간다."
  actors:
    - id: index
      kind: "조회 요청"
      name: "Index 7"
      description: "찾으려는 논리적 위치"
    - id: head
      kind: "앞 포인터"
      name: "Head"
      description: "첫 노드를 가리키는 시작점"
    - id: tail
      kind: "뒤 포인터"
      name: "Tail"
      description: "마지막 노드를 가리키는 시작점"
    - id: node
      kind: "연결 노드"
      name: "Linked Nodes"
      description: "prev·next로 이웃과 연결된 노드"
  steps:
    - title: "1. 인덱스 거리 비교"
      from: "Index 7"
      to: "Head / Tail"
      route_label: "인덱스 7이 head와 tail 중 어느 쪽에 가까운지 계산한다."
      active_actors: [index, head, tail]
      description: "이중 연결 리스트는 양쪽 끝을 모두 알고 있어 탐색 시작점을 선택할 수 있다."
      payload: ["index = 7", "head 거리", "tail 거리"]
      outcomes:
        - status: allow
          text: "가까운 끝에서 시작하면 불필요한 이동을 줄인다."
    - title: "2. Tail에서 시작"
      from: "Tail"
      to: "Linked Nodes"
      route_label: "tail에서 prev 포인터를 따라 9, 8, 7 순서로 이동한다."
      active_actors: [tail, node, index]
      description: "뒤에서 접근하는 편이 가까운 예시에서는 tail이 인덱스 탐색의 시작점이 된다."
      payload: ["tail", "prev", "9 → 8 → 7"]
      outcomes:
        - status: info
          text: "노드 수를 세는 것이 아니라 링크를 따라 이동한다."
    - title: "3. 대상 노드 도착"
      from: "Linked Nodes"
      to: "Index 7"
      route_label: "일곱 번째 위치의 노드에 도착해 값을 반환한다."
      active_actors: [node, index]
      description: "연결 리스트의 인덱스 접근은 배열처럼 즉시 주소를 계산하는 연산이 아니다."
      payload: ["target node", "value", "반환"]
      outcomes:
        - status: info
          text: "탐색 비용은 시작점과 대상 위치 사이의 이동 거리와 연결된다."
    - title: "4. 비용 해석"
      from: "Head / Tail"
      to: "Index 7"
      route_label: "가까운 끝에서 이동한 노드 수가 최종 접근 비용이 된다."
      active_actors: [head, tail, index]
      description: "이중 연결 리스트도 임의 인덱스 접근이 배열의 O(1)과 같아지는 것은 아니다."
      payload: ["탐색 거리", "O(min(i, n-i))", "연결 추적"]
      outcomes:
        - status: warning
          text: "빈번한 인덱스 접근에는 배열이 더 적합할 수 있다."

array_list_insertion:
  eyebrow: "Interactive comparison"
  title: "배열과 연결 리스트의 중간 삽입"
  summary: "배열은 뒤 요소를 이동하고 연결 리스트는 주변 노드의 링크를 바꾼다."
  actors:
    - id: position
      kind: "삽입 위치"
      name: "Insert Position"
      description: "새 요소 X가 들어갈 위치"
    - id: array
      kind: "연속 저장"
      name: "Array"
      description: "인덱스 순서대로 붙어 있는 요소들"
    - id: linked
      kind: "연결 저장"
      name: "Linked List"
      description: "노드의 next 링크로 이어진 요소들"
    - id: element
      kind: "새 요소"
      name: "Element X"
      description: "중간에 추가할 값 또는 노드"
  steps:
    - title: "1. 배열 위치 확보"
      from: "Insert Position"
      to: "Array"
      route_label: "삽입 위치 뒤의 요소를 한 칸씩 뒤로 옮겨 빈 슬롯을 만든다."
      active_actors: [position, array]
      description: "연속 저장 구조에서는 중간 공간을 만들기 위해 여러 요소의 위치가 바뀐다."
      payload: ["index", "shift right", "빈 슬롯"]
      outcomes:
        - status: warning
          text: "이동해야 하는 요소 수가 많으면 삽입 비용이 커진다."
    - title: "2. 배열에 X 저장"
      from: "Element X"
      to: "Array"
      route_label: "확보한 슬롯에 새 요소 X를 기록한다."
      active_actors: [element, array]
      description: "배열 삽입은 공간 확보와 값 기록을 나누어 생각할 수 있다."
      payload: ["X", "index", "연속 슬롯"]
      outcomes:
        - status: allow
          text: "인덱스 접근은 빠르지만 중간 삽입은 이동 비용을 부담한다."
    - title: "3. 연결 리스트 위치 찾기"
      from: "Insert Position"
      to: "Linked List"
      route_label: "삽입 지점의 앞 노드와 뒤 노드를 찾는다."
      active_actors: [position, linked]
      description: "링크를 바꾸기 전에 대상 위치까지 노드를 따라가야 한다."
      payload: ["prev", "next", "탐색"]
      outcomes:
        - status: info
          text: "연결 리스트도 위치 탐색 비용은 별도로 발생한다."
    - title: "4. 링크 재연결"
      from: "Element X"
      to: "Linked List"
      route_label: "앞 노드와 X, 뒤 노드의 링크를 새 순서로 연결한다."
      active_actors: [element, linked]
      description: "노드 위치를 모두 이동시키는 대신 제한된 포인터를 수정해 삽입을 마무리한다."
      payload: ["prev.next = X", "X.next = next", "링크 변경"]
      outcomes:
        - status: allow
          text: "위치를 이미 알고 있다면 연결 변경 자체는 일정한 작업이다."

arraylist_capacity:
  eyebrow: "Interactive flow"
  title: "ArrayList의 size와 capacity"
  summary: "size는 실제 요소 수이고 capacity는 현재 내부 배열이 담을 수 있는 슬롯 수다."
  actors:
    - id: list
      kind: "컬렉션"
      name: "ArrayList"
      description: "동적 배열을 감싸는 리스트"
    - id: size
      kind: "사용량"
      name: "size = 3"
      description: "현재 실제로 들어 있는 요소 개수"
    - id: capacity
      kind: "저장 공간"
      name: "capacity = 6"
      description: "내부 배열이 수용할 수 있는 슬롯 개수"
    - id: resize
      kind: "확장 처리"
      name: "Resize"
      description: "더 큰 배열을 만들고 기존 요소를 복사하는 작업"
  steps:
    - title: "1. 실제 요소 세기"
      from: "ArrayList"
      to: "size = 3"
      route_label: "리스트가 현재 보유한 A·B·C 세 요소를 size로 센다."
      active_actors: [list, size]
      description: "size는 사용 중인 요소의 개수이지 내부 배열의 전체 슬롯 수가 아니다."
      payload: ["A", "B", "C", "size = 3"]
      outcomes:
        - status: info
          text: "요소를 제거하면 size가 줄어든다."
    - title: "2. 여유 슬롯 확인"
      from: "ArrayList"
      to: "capacity = 6"
      route_label: "내부 배열에 세 개의 사용 중 슬롯과 세 개의 여유 슬롯이 남아 있다."
      active_actors: [list, capacity]
      description: "capacity는 추가 삽입을 즉시 수용할 수 있는 현재 공간의 크기다."
      payload: ["capacity = 6", "사용 3", "여유 3"]
      outcomes:
        - status: allow
          text: "여유가 있으면 내부 배열을 다시 만들지 않고 삽입할 수 있다."
    - title: "3. 공간 부족"
      from: "size = 3"
      to: "Resize"
      route_label: "요소를 계속 추가해 size가 capacity에 도달하면 확장이 필요하다."
      active_actors: [size, capacity, resize]
      description: "capacity가 가득 찬 순간 다음 삽입을 위해 더 큰 저장 공간을 준비한다."
      payload: ["size == capacity", "다음 삽입", "확장"]
      outcomes:
        - status: warning
          text: "확장 시 기존 요소를 새 배열로 복사하는 비용이 발생한다."
    - title: "4. 새 배열로 복사"
      from: "Resize"
      to: "ArrayList"
      route_label: "더 큰 내부 배열로 기존 요소를 복사한 뒤 새 요소를 추가한다."
      active_actors: [resize, list, capacity]
      description: "동적 배열은 매번 한 칸씩 늘리기보다 여유를 포함해 확장해 평균 삽입 비용을 낮춘다."
      payload: ["copy", "larger array", "새 capacity"]
      outcomes:
        - status: info
          text: "개별 확장은 비싸지만 전체 삽입 비용은 분산될 수 있다."

stack_queue_deque:
  eyebrow: "Interactive comparison"
  title: "Stack·Queue·Deque의 처리 순서"
  summary: "같은 입력도 자료구조가 허용하는 삽입·삭제 위치에 따라 LIFO, FIFO, 양방향 결과가 달라진다."
  actors:
    - id: input
      kind: "입력"
      name: "A → B → C"
      description: "차례로 들어오는 세 요소"
    - id: stack
      kind: "한쪽 끝"
      name: "Stack"
      description: "마지막에 넣은 요소를 먼저 꺼내는 구조"
    - id: queue
      kind: "양 끝 역할 분리"
      name: "Queue"
      description: "먼저 들어온 요소를 먼저 꺼내는 구조"
    - id: deque
      kind: "양쪽 끝"
      name: "Deque"
      description: "앞과 뒤에서 삽입·삭제할 수 있는 구조"
  steps:
    - title: "1. 입력 순서"
      from: "A → B → C"
      to: "Stack / Queue / Deque"
      route_label: "A, B, C를 같은 순서로 세 자료구조에 넣는다."
      active_actors: [input, stack, queue, deque]
      description: "처리 결과를 비교하려면 입력 순서를 먼저 고정해야 한다."
      payload: ["A", "B", "C", "push / offer"]
      outcomes:
        - status: info
          text: "차이는 입력 자체가 아니라 꺼내는 규칙에서 생긴다."
    - title: "2. Stack LIFO"
      from: "Stack"
      to: "A → B → C"
      route_label: "마지막에 들어온 C부터 B, A 순서로 꺼낸다."
      active_actors: [stack, input]
      description: "Stack은 한쪽 끝에서 넣고 빼므로 후입선출 순서가 된다."
      payload: ["push", "pop", "C → B → A"]
      outcomes:
        - status: info
          text: "호출 스택과 되돌리기 기능 같은 흐름을 설명할 때 유용하다."
    - title: "3. Queue FIFO"
      from: "Queue"
      to: "A → B → C"
      route_label: "먼저 들어온 A부터 B, C 순서로 꺼낸다."
      active_actors: [queue, input]
      description: "Queue는 한쪽에서 넣고 반대쪽에서 빼므로 선입선출 순서가 된다."
      payload: ["offer", "poll", "A → B → C"]
      outcomes:
        - status: info
          text: "작업 대기열처럼 도착 순서를 보존해야 하는 흐름에 맞다."
    - title: "4. Deque 양방향"
      from: "Deque"
      to: "A → B → C"
      route_label: "앞과 뒤 어느 쪽에서도 삽입·삭제해 순서를 정책으로 선택한다."
      active_actors: [deque, input]
      description: "Deque는 Stack과 Queue 동작을 모두 표현할 수 있는 양방향 구조다."
      payload: ["addFirst", "addLast", "removeFirst / removeLast"]
      outcomes:
        - status: allow
          text: "양쪽 연산을 허용하는 만큼 사용 규칙을 코드로 분명히 해야 한다."

heap_mapping:
  eyebrow: "Interactive comparison"
  title: "Min Heap의 트리와 배열 매핑"
  summary: "완전 이진 트리는 빈 슬롯 없이 채워지므로 부모·자식 관계를 인덱스 계산으로 표현할 수 있다."
  actors:
    - id: heap
      kind: "우선순위 구조"
      name: "Min Heap"
      description: "부모가 자식보다 작거나 같은 완전 이진 트리"
    - id: tree
      kind: "논리 구조"
      name: "Complete Tree"
      description: "레벨 순서로 채워지는 트리 표현"
    - id: array
      kind: "물리 표현"
      name: "Index Array"
      description: "0번 인덱스부터 노드를 담는 배열"
    - id: relation
      kind: "인덱스 규칙"
      name: "Parent / Child Index"
      description: "부모와 자식 위치를 계산하는 관계"
  steps:
    - title: "1. 힙 조건"
      from: "Min Heap"
      to: "Complete Tree"
      route_label: "각 부모의 값이 자식보다 작거나 같도록 트리를 유지한다."
      active_actors: [heap, tree]
      description: "Min Heap의 루트에는 전체 원소 중 가장 작은 값이 온다."
      payload: ["2", "4", "7", "9", "8"]
      outcomes:
        - status: info
          text: "힙은 전체 정렬이 아니라 부모·자식 사이의 부분 순서다."
    - title: "2. 레벨 순서 저장"
      from: "Complete Tree"
      to: "Index Array"
      route_label: "트리 노드를 위에서 아래, 왼쪽에서 오른쪽 순서로 배열에 담는다."
      active_actors: [tree, array]
      description: "완전 이진 트리는 배열에 빈 슬롯을 거의 두지 않고 표현할 수 있다."
      payload: ["index 0", "level order", "[2, 4, 7, 9, 8]"]
      outcomes:
        - status: allow
          text: "노드마다 별도 left·right 포인터를 저장하지 않아도 된다."
    - title: "3. 부모·자식 계산"
      from: "Index Array"
      to: "Parent / Child Index"
      route_label: "0번 기준으로 parent=(i-1)/2, left=2i+1, right=2i+2를 계산한다."
      active_actors: [array, relation]
      description: "배열 인덱스만으로 트리의 이웃 위치를 찾을 수 있다."
      payload: ["parent(i)", "left(i)", "right(i)"]
      outcomes:
        - status: info
          text: "인덱스 계산 규칙은 배열이 완전 이진 트리라는 전제에 기대고 있다."
    - title: "4. 최소값 접근"
      from: "Parent / Child Index"
      to: "Min Heap"
      route_label: "루트 인덱스 0의 값을 읽어 최솟값을 확인한다."
      active_actors: [relation, heap]
      description: "Min Heap은 루트 최소값 접근을 빠르게 제공하지만 임의 값 전체 순서를 보장하지 않는다."
      payload: ["root = array[0]", "min = 2", "부분 순서"]
      outcomes:
        - status: allow
          text: "우선순위 큐의 최솟값 확인과 제거에 적합하다."

heap_sift:
  eyebrow: "Interactive flow"
  title: "Min Heap의 Sift Up과 Sift Down"
  summary: "삽입은 부모 방향으로, 루트 제거는 더 작은 자식 방향으로 이동하며 힙 조건을 복구한다."
  actors:
    - id: heap
      kind: "힙"
      name: "Min Heap"
      description: "부모가 자식보다 작거나 같은 구조"
    - id: inserted
      kind: "삽입 값"
      name: "Inserted 1"
      description: "새로 추가되어 위치를 찾아야 하는 값"
    - id: root
      kind: "제거 대상"
      name: "Root 2"
      description: "최솟값이라 먼저 제거되는 루트"
    - id: child
      kind: "비교 후보"
      name: "Smaller Child"
      description: "아래로 내려갈 때 선택하는 더 작은 자식"
  steps:
    - title: "1. 1 삽입"
      from: "Inserted 1"
      to: "Min Heap"
      route_label: "새 값 1을 배열의 마지막 빈 위치에 넣는다."
      active_actors: [inserted, heap]
      description: "완전 이진 트리 모양을 유지하기 위해 새 노드는 마지막 위치에서 시작한다."
      payload: ["insert 1", "last slot", "힙 조건 위반"]
      outcomes:
        - status: warning
          text: "부모보다 작다면 현재 위치에서 바로 멈출 수 없다."
    - title: "2. Sift Up"
      from: "Inserted 1"
      to: "Min Heap"
      route_label: "부모와 비교하며 1이 더 작으면 위로 교환한다."
      active_actors: [inserted, heap]
      description: "삽입 후에는 부모 방향으로 이동해 루트까지 힙 조건을 확인한다."
      payload: ["compare parent", "swap", "sift up"]
      outcomes:
        - status: allow
          text: "조건을 만족하는 위치에 도달하면 삽입 복구가 끝난다."
    - title: "3. 루트 제거"
      from: "Root 2"
      to: "Min Heap"
      route_label: "루트 2를 제거하고 마지막 원소를 루트 자리로 옮긴다."
      active_actors: [root, heap]
      description: "최솟값을 꺼낸 뒤 빈 루트를 채우는 과정에서 아래쪽 조건이 깨질 수 있다."
      payload: ["remove min", "move last", "root replacement"]
      outcomes:
        - status: warning
          text: "루트 교체만으로는 자식과의 순서가 보장되지 않는다."
    - title: "4. Sift Down"
      from: "Min Heap"
      to: "Smaller Child"
      route_label: "더 작은 자식과 비교하며 조건이 맞을 때까지 아래로 교환한다."
      active_actors: [heap, child]
      description: "두 자식 중 작은 값을 선택해야 다음 단계에서도 부모·자식 조건을 유지할 수 있다."
      payload: ["left child", "right child", "smaller child"]
      outcomes:
        - status: allow
          text: "삽입은 Sift Up, 루트 제거는 Sift Down으로 구분한다."

tree_types:
  eyebrow: "Interactive comparison"
  title: "이진 트리의 형태 조건"
  summary: "자식 수와 레벨을 얼마나 채우는지에 따라 일반·정·완전·포화 이진 트리를 구분한다."
  actors:
    - id: tree
      kind: "트리"
      name: "Binary Tree"
      description: "각 노드가 최대 두 자식을 가지는 구조"
    - id: children
      kind: "자식 조건"
      name: "Children Count"
      description: "노드마다 자식이 몇 개인지 보는 기준"
    - id: level
      kind: "레벨 조건"
      name: "Level Filling"
      description: "마지막 레벨까지 노드를 채우는 방식"
    - id: shape
      kind: "형태 분류"
      name: "Tree Shape"
      description: "조건을 만족하는 트리 유형"
  steps:
    - title: "1. 최대 두 자식"
      from: "Binary Tree"
      to: "Children Count"
      route_label: "각 노드가 자식을 0·1·2개까지 가질 수 있는지 확인한다."
      active_actors: [tree, children]
      description: "이진 트리는 자식 수의 상한만 정하고 모든 레벨을 채우라는 규칙은 없다."
      payload: ["0 children", "1 child", "2 children"]
      outcomes:
        - status: info
          text: "자식 수 조건만으로 정·완전·포화 여부를 결정할 수 없다."
    - title: "2. 정이진 트리"
      from: "Children Count"
      to: "Tree Shape"
      route_label: "모든 내부 노드가 자식 2개를 가지는지 확인한다."
      active_actors: [children, shape]
      description: "정이진 트리는 한쪽 자식만 있는 내부 노드를 허용하지 않는다."
      payload: ["0 or 2", "한쪽 자식 없음", "Full Binary Tree"]
      outcomes:
        - status: info
          text: "레벨이 모두 채워졌다는 뜻은 아니다."
    - title: "3. 완전 이진 트리"
      from: "Level Filling"
      to: "Tree Shape"
      route_label: "마지막 레벨 전까지 채우고 마지막 레벨은 왼쪽부터 채우는지 본다."
      active_actors: [level, shape]
      description: "완전 이진 트리는 배열 기반 힙처럼 레벨 순서 표현과 잘 맞는다."
      payload: ["앞 레벨 완성", "마지막 레벨 왼쪽부터", "Complete"]
      outcomes:
        - status: allow
          text: "마지막 레벨이 일부만 차도 왼쪽 정렬이면 완전할 수 있다."
    - title: "4. 포화 이진 트리"
      from: "Level Filling"
      to: "Tree Shape"
      route_label: "모든 내부 노드가 두 자식이고 모든 잎이 같은 레벨인지 확인한다."
      active_actors: [children, level, shape]
      description: "포화 이진 트리는 각 레벨이 빠짐없이 채워진 가장 엄격한 형태다."
      payload: ["2 children", "same leaf level", "Perfect"]
      outcomes:
        - status: info
          text: "포화 조건은 정이진·완전 조건을 함께 강하게 만족시킨다."

tree_representation:
  eyebrow: "Interactive comparison"
  title: "트리의 배열 표현과 연결 표현"
  summary: "같은 트리도 배열은 위치와 빈 슬롯을 보존하고 연결 표현은 실제 자식 관계만 참조한다."
  actors:
    - id: tree
      kind: "논리 구조"
      name: "Tree A–F"
      description: "A부터 F까지의 동일한 트리 관계"
    - id: array
      kind: "순차 표현"
      name: "Array Slots"
      description: "인덱스 위치에 노드를 저장하는 표현"
    - id: linked
      kind: "포인터 표현"
      name: "Child References"
      description: "왼쪽·오른쪽 자식 참조로 관계를 저장하는 표현"
    - id: slot
      kind: "빈 위치"
      name: "Empty Slots"
      description: "배열에서 존재하지 않는 위치를 표시하는 자리"
  steps:
    - title: "1. 같은 트리 고정"
      from: "Tree A–F"
      to: "Array Slots"
      route_label: "A부터 F까지 같은 논리 관계를 두 표현으로 옮길 준비를 한다."
      active_actors: [tree, array]
      description: "표현 방법을 비교하려면 값과 부모·자식 관계가 같은 트리를 사용해야 한다."
      payload: ["A", "B", "C", "D", "E", "F"]
      outcomes:
        - status: info
          text: "자료구조의 논리와 저장 표현을 분리해 본다."
    - title: "2. 배열 위치 보존"
      from: "Tree A–F"
      to: "Array Slots"
      route_label: "레벨 순서 인덱스에 노드를 두고 없는 자리는 빈 슬롯으로 남긴다."
      active_actors: [tree, array, slot]
      description: "배열은 부모와 자식의 위치 계산을 쉽게 하지만 희소한 트리에서는 공간을 낭비할 수 있다."
      payload: ["index", "빈 슬롯", "level order"]
      outcomes:
        - status: warning
          text: "트리 모양이 치우치면 빈 슬롯이 늘어날 수 있다."
    - title: "3. 연결 관계만 저장"
      from: "Tree A–F"
      to: "Child References"
      route_label: "각 노드가 실제로 가진 왼쪽·오른쪽 자식만 참조한다."
      active_actors: [tree, linked]
      description: "연결 표현은 빈 위치를 저장하지 않고 존재하는 관계를 포인터로 나타낸다."
      payload: ["left", "right", "null reference"]
      outcomes:
        - status: allow
          text: "모양이 불규칙한 트리도 빈 슬롯 없이 표현할 수 있다."

tree_traversal:
  eyebrow: "Interactive comparison"
  title: "이진 트리 순회 순서"
  summary: "같은 트리라도 현재 노드를 처리하는 시점과 레벨 처리 방식에 따라 방문 결과가 달라진다."
  actors:
    - id: tree
      kind: "대상 구조"
      name: "Tree A–F"
      description: "모든 순회가 공유하는 동일한 이진 트리"
    - id: preorder
      kind: "현재 노드 먼저"
      name: "Preorder"
      description: "현재 → 왼쪽 → 오른쪽"
    - id: inorder
      kind: "왼쪽 뒤 현재"
      name: "Inorder"
      description: "왼쪽 → 현재 → 오른쪽"
    - id: postorder
      kind: "자식 뒤 현재"
      name: "Postorder"
      description: "왼쪽 → 오른쪽 → 현재"
    - id: level
      kind: "레벨 순서"
      name: "Level Order"
      description: "같은 깊이를 왼쪽부터 처리"
  steps:
    - title: "1. 전위 순회"
      from: "Tree A–F"
      to: "Preorder"
      route_label: "현재 노드를 처리한 뒤 왼쪽, 오른쪽 서브트리로 내려간다."
      active_actors: [tree, preorder]
      description: "전위 순회는 부모를 자식보다 먼저 방문한다."
      payload: ["현재", "왼쪽", "오른쪽", "A B D E C F"]
      outcomes:
        - status: info
          text: "방문 결과는 트리 구조와 현재 노드 처리 시점에 의해 결정된다."
    - title: "2. 중위 순회"
      from: "Tree A–F"
      to: "Inorder"
      route_label: "왼쪽 서브트리를 처리한 뒤 현재 노드와 오른쪽을 처리한다."
      active_actors: [tree, inorder]
      description: "중위 순회는 이진 탐색 트리의 정렬 순서와 연결해 설명할 수 있지만 모든 이진 트리에서 정렬되지는 않는다."
      payload: ["왼쪽", "현재", "오른쪽", "D B E A C F"]
      outcomes:
        - status: info
          text: "정렬 결과라는 해석에는 이진 탐색 트리의 추가 규칙이 필요하다."
    - title: "3. 후위 순회"
      from: "Tree A–F"
      to: "Postorder"
      route_label: "두 서브트리를 모두 처리한 뒤 현재 노드를 방문한다."
      active_actors: [tree, postorder]
      description: "후위 순회는 자식 결과를 모은 뒤 부모를 처리하는 흐름을 표현한다."
      payload: ["왼쪽", "오른쪽", "현재", "D E B F C A"]
      outcomes:
        - status: info
          text: "서브트리 삭제나 계산 결과 조합을 설명할 때 자주 사용한다."
    - title: "4. 레벨 순회"
      from: "Tree A–F"
      to: "Level Order"
      route_label: "깊이로 내려가기보다 같은 레벨의 노드를 왼쪽부터 처리한다."
      active_actors: [tree, level]
      description: "레벨 순회는 큐를 사용해 현재 깊이의 노드를 다음 깊이보다 먼저 방문한다."
      payload: ["level 0", "level 1", "level 2", "A B C D E F"]
      outcomes:
        - status: allow
          text: "전체 순회는 노드 수에 비례해 O(n)으로 처리한다."

btree_split_merge:
  eyebrow: "Interactive flow"
  title: "B-Tree 노드 분할·재분배·병합"
  summary: "삽입은 가득 찬 노드를 나누고 삭제는 형제 여유에 따라 재분배하거나 부모 경계 키와 병합한다."
  actors:
    - id: node
      kind: "현재 노드"
      name: "Target Node"
      description: "삽입 또는 삭제가 발생한 B-Tree 노드"
    - id: parent
      kind: "상위 경계"
      name: "Parent Separator"
      description: "자식 범위를 나누는 부모 키"
    - id: sibling
      kind: "형제 노드"
      name: "Sibling"
      description: "키를 빌려주거나 병합하는 이웃 노드"
    - id: root
      kind: "루트"
      name: "Root"
      description: "높이 증가와 감소가 시작되는 최상위 노드"
  steps:
    - title: "1. 가득 찬 노드 분할"
      from: "Target Node"
      to: "Parent Separator"
      route_label: "삽입으로 가득 찬 노드를 둘로 나누고 가운데 키를 부모로 올린다."
      active_actors: [node, parent]
      description: "분할 뒤에도 각 자식 노드의 키 범위와 최소 조건을 유지한다."
      payload: ["split", "middle key", "promote"]
      outcomes:
        - status: allow
          text: "루트가 분할되면 트리 높이가 증가할 수 있다."
    - title: "2. 삭제 후 형제 확인"
      from: "Target Node"
      to: "Sibling"
      route_label: "삭제로 노드가 부족해지면 먼저 형제에게 빌릴 여유가 있는지 본다."
      active_actors: [node, sibling, parent]
      description: "재분배는 부모의 경계 키와 형제 키를 함께 조정하는 작업이다."
      payload: ["underflow", "borrow", "redistribute"]
      outcomes:
        - status: info
          text: "형제 키 하나를 단순 복사하는 것과는 다르다."
    - title: "3. 형제와 병합"
      from: "Sibling"
      to: "Parent Separator"
      route_label: "빌릴 키가 없으면 부모 경계 키와 두 노드를 하나로 합친다."
      active_actors: [sibling, node, parent]
      description: "병합 후 부모의 키와 자식 포인터가 줄어 상위 노드에서도 부족이 이어질 수 있다."
      payload: ["merge", "parent key", "child pointer 감소"]
      outcomes:
        - status: warning
          text: "부족 조건이 부모 방향으로 전파될 수 있다."
    - title: "4. 루트 높이 조정"
      from: "Parent Separator"
      to: "Root"
      route_label: "루트가 분할되면 높이가 늘고 루트 병합으로 하나의 자식만 남으면 높이가 줄어든다."
      active_actors: [parent, root]
      description: "삽입과 삭제의 루트 처리는 트리 높이를 바꾸는 특별한 경계 사례다."
      payload: ["root split", "root merge", "height ± 1"]
      outcomes:
        - status: info
          text: "높이 변화도 각 노드의 최소·최대 조건을 지키는 결과다."

btree_vs_bplus:
  eyebrow: "Interactive comparison"
  title: "B-Tree와 B+Tree의 검색 경로"
  summary: "B-Tree는 내부 노드에도 데이터가 있을 수 있고 B+Tree는 인덱스 키를 따라 리프와 리프 연결로 접근한다."
  actors:
    - id: query
      kind: "검색 요청"
      name: "Search Key"
      description: "정확한 일치 또는 범위를 찾는 키"
    - id: btree
      kind: "혼합 저장"
      name: "B-Tree"
      description: "내부 노드와 리프에 데이터가 있을 수 있는 구조"
    - id: bplus
      kind: "리프 집중"
      name: "B+Tree"
      description: "내부는 안내 키, 실제 데이터는 리프에 모이는 구조"
    - id: leaf
      kind: "데이터 페이지"
      name: "Linked Leaves"
      description: "범위 검색을 이어 가는 연결된 리프 페이지"
  steps:
    - title: "1. B-Tree 내부 확인"
      from: "Search Key"
      to: "B-Tree"
      route_label: "검색 키가 내부 노드에서 데이터와 일치하면 그 자리에서 도달할 수 있다."
      active_actors: [query, btree]
      description: "B-Tree는 내부 키가 데이터 또는 데이터 접근 정보를 함께 가질 수 있다."
      payload: ["internal key", "data", "검색 종료 가능"]
      outcomes:
        - status: info
          text: "모든 검색이 리프까지 내려간다고 단정하지 않는다."
    - title: "2. B+Tree 리프 도달"
      from: "Search Key"
      to: "B+Tree"
      route_label: "내부 키는 방향을 안내하고 실제 항목은 리프까지 내려가 확인한다."
      active_actors: [query, bplus]
      description: "B+Tree에서는 내부 키와 같은 값을 만나도 리프의 실제 데이터를 확인한다."
      payload: ["separator key", "child pointer", "leaf data"]
      outcomes:
        - status: info
          text: "내부 노드와 데이터 페이지의 책임이 분리된다."
    - title: "3. 리프 연결 따라가기"
      from: "B+Tree"
      to: "Linked Leaves"
      route_label: "시작 리프를 찾은 뒤 다음 리프 포인터를 따라 범위를 읽는다."
      active_actors: [bplus, leaf]
      description: "리프 연결은 범위 검색에서 다음 페이지로 이동하는 통로가 된다."
      payload: ["start leaf", "next leaf", "range scan"]
      outcomes:
        - status: allow
          text: "범위 검색을 리프 순서로 이어가기 쉽다."
    - title: "4. 페이지 I/O 분리"
      from: "Search Key"
      to: "Linked Leaves"
      route_label: "논리적 페이지 방문과 버퍼에 없는 페이지의 실제 디스크 읽기를 따로 센다."
      active_actors: [query, btree, bplus, leaf]
      description: "검색 경로의 페이지 수와 저장 장치 I/O 수는 캐시 상태에 따라 달라질 수 있다."
      payload: ["logical page", "buffer hit", "disk I/O"]
      outcomes:
        - status: info
          text: "페이지 방문 횟수와 실제 디스크 읽기 횟수를 같은 값으로 보지 않는다."

database_key:
  eyebrow: "Interactive flow"
  title: "외래키와 복합 UNIQUE 제약조건"
  summary: "외래키는 참조 대상의 존재를 확인하고 복합 UNIQUE는 같은 관계의 중복 저장을 막는다."
  actors:
    - id: member
      kind: "참조 대상"
      name: "Members"
      description: "찜을 저장한 회원 테이블"
    - id: restaurant
      kind: "참조 대상"
      name: "Restaurants"
      description: "찜 대상 음식점 테이블"
    - id: relation
      kind: "관계 행"
      name: "MemberRestaurants"
      description: "회원과 음식점을 연결하는 자식 테이블"
    - id: constraint
      kind: "무결성 규칙"
      name: "FK + UNIQUE"
      description: "존재·필수·중복을 검증하는 제약조건 묶음"
  steps:
    - title: "1. 회원 참조"
      from: "MemberRestaurants"
      to: "Members"
      route_label: "member_id FK가 members.id에 존재하는지 확인한다."
      active_actors: [relation, member, constraint]
      description: "존재하지 않는 회원을 가리키는 찜 행은 외래키 검사에서 거부된다."
      payload: ["member_id", "members.id", "FK"]
      outcomes:
        - status: allow
          text: "참조 대상의 존재를 보장한다."
    - title: "2. 음식점 참조"
      from: "MemberRestaurants"
      to: "Restaurants"
      route_label: "restaurant_id FK가 restaurants.id에 존재하는지 확인한다."
      active_actors: [relation, restaurant, constraint]
      description: "외래키는 음식점 참조도 검증하지만 같은 조합의 중복까지 판단하지는 않는다."
      payload: ["restaurant_id", "restaurants.id", "FK"]
      outcomes:
        - status: allow
          text: "두 참조 대상이 모두 존재해야 관계를 저장할 수 있다."
    - title: "3. 필수 관계 확인"
      from: "MemberRestaurants"
      to: "FK + UNIQUE"
      route_label: "필수 관계라면 member_id와 restaurant_id에 NOT NULL도 적용한다."
      active_actors: [relation, constraint]
      description: "FK와 NULL 허용 여부는 서로 다른 질문이므로 필요한 규칙을 각각 둔다."
      payload: ["NOT NULL", "필수 관계", "참조 무결성"]
      outcomes:
        - status: info
          text: "외래키가 있다고 모든 컬럼 값이 반드시 존재하는 것은 아니다."
    - title: "4. 중복 관계 차단"
      from: "MemberRestaurants"
      to: "FK + UNIQUE"
      route_label: "UNIQUE(member_id, restaurant_id)로 같은 찜 관계의 두 번째 행을 막는다."
      active_actors: [relation, constraint]
      description: "외래키는 대상 존재를, 복합 UNIQUE는 관계 조합의 중복을 담당한다."
      payload: ["(member_id, restaurant_id)", "UNIQUE", "중복 거부"]
      outcomes:
        - status: reject
          text: "같은 회원과 음식점 조합을 두 번 저장할 수 없다."

join_results:
  eyebrow: "Interactive comparison"
  title: "JOIN 종류와 결과 행 수"
  summary: "JOIN은 어떤 쪽 행을 보존할지 정하고 결과 행 수는 매칭되는 행 조합으로 결정된다."
  actors:
    - id: restaurant
      kind: "왼쪽 테이블"
      name: "Restaurant"
      description: "음식점 세 행을 가진 기준 테이블"
    - id: visit
      kind: "오른쪽 테이블"
      name: "Visit"
      description: "음식점별 방문 기록 테이블"
    - id: join
      kind: "연결 조건"
      name: "ON restaurant_id"
      description: "두 테이블을 연결하는 매칭 조건"
    - id: result
      kind: "결과 집합"
      name: "Joined Rows"
      description: "매칭 조합과 보존 규칙으로 만들어진 행들"
  steps:
    - title: "1. 매칭 조합 만들기"
      from: "Restaurant"
      to: "ON restaurant_id"
      route_label: "각 음식점 행과 같은 restaurant_id를 가진 방문 기록을 찾는다."
      active_actors: [restaurant, visit, join]
      description: "한 음식점에 방문 기록이 여러 개면 하나의 왼쪽 행이 여러 결과 조합으로 늘어난다."
      payload: ["restaurant.id", "visit.restaurant_id", "매칭"]
      outcomes:
        - status: info
          text: "결과 행 수를 왼쪽 테이블 행 수만으로 예측하지 않는다."
    - title: "2. INNER JOIN"
      from: "ON restaurant_id"
      to: "Joined Rows"
      route_label: "양쪽에 매칭되는 음식점과 방문 기록 조합만 결과에 남긴다."
      active_actors: [restaurant, visit, join, result]
      description: "매칭되지 않는 왼쪽 또는 오른쪽 행은 INNER JOIN 결과에서 제외된다."
      payload: ["INNER", "matched pairs", "NULL 행 없음"]
      outcomes:
        - status: info
          text: "보존 규칙은 양쪽 매칭 행만 남기는 것이다."
    - title: "3. LEFT JOIN"
      from: "Restaurant"
      to: "Joined Rows"
      route_label: "모든 음식점을 남기고 방문 기록이 없으면 오른쪽 컬럼을 NULL로 채운다."
      active_actors: [restaurant, visit, result]
      description: "방문 기록이 없는 파스타집도 LEFT JOIN 결과에서는 보존된다."
      payload: ["LEFT", "all restaurants", "NULL visit"]
      outcomes:
        - status: allow
          text: "왼쪽 행 보존과 오른쪽 매칭 개수에 따라 결과 행 수가 달라진다."
    - title: "4. FULL OUTER JOIN"
      from: "Restaurant + Visit"
      to: "Joined Rows"
      route_label: "양쪽 행을 모두 보존하고 반대편이 없으면 해당 컬럼을 NULL로 채운다."
      active_actors: [restaurant, visit, result]
      description: "외래키가 없는 방문 기록까지 있다면 음식점 쪽 컬럼이 NULL인 행도 남을 수 있다."
      payload: ["FULL OUTER", "양쪽 보존", "NULL"]
      outcomes:
        - status: info
          text: "JOIN 종류는 보존할 행의 기준을 선택하는 문법이다."

on_where_join:
  eyebrow: "Interactive comparison"
  title: "LEFT JOIN에서 ON과 WHERE의 차이"
  summary: "ON 조건은 매칭 대상을 줄이면서 왼쪽 행을 보존하고 WHERE 조건은 JOIN 결과 행 자체를 걸러낸다."
  actors:
    - id: left
      kind: "보존 대상"
      name: "Restaurant"
      description: "LEFT JOIN에서 항상 남겨야 하는 왼쪽 행"
    - id: on
      kind: "매칭 조건"
      name: "ON visit.youtuber = '철수'"
      description: "오른쪽에서 연결할 행을 제한하는 조건"
    - id: where
      kind: "후처리 조건"
      name: "WHERE visit.youtuber = '철수'"
      description: "JOIN 결과 전체에 적용되는 필터"
    - id: result
      kind: "결과 집합"
      name: "Joined Result"
      description: "조건 위치에 따라 달라지는 결과 행"
  steps:
    - title: "1. LEFT JOIN 시작"
      from: "Restaurant"
      to: "Joined Result"
      route_label: "모든 음식점 행을 기준으로 방문 기록을 붙일 준비를 한다."
      active_actors: [left, result]
      description: "LEFT JOIN의 기본 약속은 왼쪽 테이블의 행을 보존하는 것이다."
      payload: ["LEFT JOIN", "all left rows", "매칭 준비"]
      outcomes:
        - status: info
          text: "보존 규칙과 필터 적용 시점을 분리해 읽는다."
    - title: "2. ON에서 철수 제한"
      from: "ON visit.youtuber = '철수'"
      to: "Joined Result"
      route_label: "철수 방문 기록만 매칭하고 방문 기록이 없는 음식점은 NULL로 남긴다."
      active_actors: [left, on, result]
      description: "ON 조건은 오른쪽 매칭 후보를 줄이지만 LEFT JOIN의 왼쪽 행 보존은 유지한다."
      payload: ["ON", "철수", "NULL 보존"]
      outcomes:
        - status: allow
          text: "왼쪽 행을 유지한 채 연결할 오른쪽 행만 제한한다."
    - title: "3. WHERE에서 철수 제한"
      from: "Joined Result"
      to: "WHERE visit.youtuber = '철수'"
      route_label: "JOIN 후 오른쪽 컬럼이 NULL인 행까지 WHERE 조건으로 다시 검사한다."
      active_actors: [result, where]
      description: "NULL은 철수와 같지 않으므로 방문 기록이 없는 음식점 행이 제거될 수 있다."
      payload: ["WHERE", "NULL 비교", "후처리 필터"]
      outcomes:
        - status: warning
          text: "WHERE에 오른쪽 조건을 두면 LEFT JOIN이 INNER JOIN처럼 보일 수 있다."
    - title: "4. 조건 위치 선택"
      from: "ON / WHERE"
      to: "Joined Result"
      route_label: "왼쪽 행을 보존할지, 매칭된 결과만 남길지 의도에 맞춰 조건 위치를 정한다."
      active_actors: [on, where, result, left]
      description: "조건 자체보다 JOIN 전 매칭 제한인지 JOIN 후 행 제거인지가 결과를 바꾼다."
      payload: ["보존 필요", "매칭 제한", "결과 필터"]
      outcomes:
        - status: info
          text: "SQL을 읽을 때 ON과 WHERE를 처리 순서와 함께 확인한다."

cache_hierarchy:
  eyebrow: "Interactive flow"
  title: "CPU 캐시 계층의 히트와 미스"
  summary: "가까운 캐시부터 블록을 찾고 없으면 더 느린 하위 계층으로 내려간다."
  actors:
    - id: cpu
      kind: "요청 주체"
      name: "CPU"
      description: "명령어 또는 데이터 블록을 요청하는 프로세서"
    - id: l1
      kind: "가장 가까운 캐시"
      name: "L1 Cache"
      description: "작고 빠른 1차 캐시"
    - id: l2
      kind: "중간 캐시"
      name: "L2 / L3 Cache"
      description: "더 큰 하위 캐시 계층"
    - id: ram
      kind: "주기억장치"
      name: "RAM"
      description: "캐시에 없는 블록을 제공하는 메모리"
  steps:
    - title: "1. L1 조회"
      from: "CPU"
      to: "L1 Cache"
      route_label: "CPU가 먼저 가장 가까운 L1 캐시에서 요청 블록을 찾는다."
      active_actors: [cpu, l1]
      description: "L1에 블록이 있으면 하위 계층까지 이동하지 않고 빠르게 결과를 얻는다."
      payload: ["주소", "캐시 라인", "태그 비교"]
      outcomes:
        - status: allow
          text: "L1 hit이면 접근 비용을 가장 작게 유지한다."
    - title: "2. 하위 캐시 확인"
      from: "L1 Cache"
      to: "L2 / L3 Cache"
      route_label: "L1 miss이면 L2와 L3에서 같은 블록을 차례로 찾는다."
      active_actors: [l1, l2]
      description: "각 계층의 용량과 지연 시간은 다르지만 가까운 곳부터 확인한다는 원리는 같다."
      payload: ["L1 miss", "L2 hit", "L3 hit"]
      outcomes:
        - status: info
          text: "캐시 계층의 이름보다 탐색 순서와 비용 차이가 핵심이다."
    - title: "3. RAM 접근"
      from: "L2 / L3 Cache"
      to: "RAM"
      route_label: "모든 캐시에서 찾지 못하면 RAM에서 블록을 가져온다."
      active_actors: [l2, ram, cpu]
      description: "RAM 접근은 캐시 hit보다 느리므로 가져온 블록을 캐시에 채우는 과정이 뒤따를 수 있다."
      payload: ["cache miss", "메모리 블록", "fill line"]
      outcomes:
        - status: warning
          text: "하위 계층까지 내려갈수록 지연 시간이 커진다."

cache_conflict:
  eyebrow: "Interactive flow"
  title: "Direct Mapped 캐시의 충돌 미스"
  summary: "서로 다른 블록이 같은 인덱스에 매핑되면 한 라인이 반복해서 교체될 수 있다."
  actors:
    - id: request
      kind: "메모리 요청"
      name: "Address 0 · 1 · 16"
      description: "서로 다른 주소에서 발생한 접근"
    - id: index
      kind: "캐시 위치"
      name: "Index 0"
      description: "블록을 배치할 Direct Mapped 라인"
    - id: block0
      kind: "기존 블록"
      name: "Block 0"
      description: "처음 Index 0에 들어온 블록"
    - id: block4
      kind: "새 블록"
      name: "Block 4"
      description: "같은 Index 0을 차지하려는 블록"
  steps:
    - title: "1. 블록 0 적재"
      from: "Address 0 · 1 · 16"
      to: "Block 0"
      route_label: "주소 0이 처음 요청되어 블록 0이 Index 0에 적재된다."
      active_actors: [request, block0, index]
      description: "처음 요청한 블록이 캐시에 없으면 콜드 미스가 발생한다."
      payload: ["address 0", "block 0", "index 0"]
      outcomes:
        - status: info
          text: "블록 안의 주소 1은 같은 블록에 있으면 hit가 될 수 있다."
    - title: "2. 같은 블록 hit"
      from: "Address 0 · 1 · 16"
      to: "Block 0"
      route_label: "주소 1은 같은 블록 0의 다른 offset을 읽어 hit가 된다."
      active_actors: [request, block0, index]
      description: "주소가 달라도 블록 번호와 인덱스가 현재 캐시 라인과 맞으면 RAM까지 내려가지 않는다."
      payload: ["address 1", "same block", "hit"]
      outcomes:
        - status: allow
          text: "공간적 지역성이 캐시 hit로 이어지는 예다."
    - title: "3. 블록 4 교체"
      from: "Address 0 · 1 · 16"
      to: "Block 4"
      route_label: "주소 16의 블록 4도 4 % 4 = 0이어서 Index 0의 블록 0을 교체한다."
      active_actors: [request, block0, block4, index]
      description: "서로 다른 태그를 가진 블록이 같은 인덱스를 쓰면 충돌 미스가 발생한다."
      payload: ["address 16", "block 4", "tag 1", "replace"]
      outcomes:
        - status: warning
          text: "같은 라인을 번갈아 쓰는 접근 패턴은 캐시 효율을 떨어뜨린다."

cpu_bus:
  eyebrow: "Interactive flow"
  title: "CPU와 RAM 사이의 주소·제어·데이터 흐름"
  summary: "CPU는 주소와 읽기·쓰기 제어 신호를 보내고 RAM은 읽기 값 또는 저장 결과를 데이터 버스로 교환한다."
  actors:
    - id: cpu
      kind: "처리 장치"
      name: "CPU"
      description: "레지스터·제어장치·ALU를 가진 프로세서"
    - id: control
      kind: "제어"
      name: "Control Unit"
      description: "명령어를 해석하고 버스 동작을 지시함"
    - id: alu
      kind: "연산"
      name: "ALU / Registers"
      description: "값을 계산하고 주소·중간 결과를 보관함"
    - id: ram
      kind: "메모리"
      name: "RAM"
      description: "주소별 명령어와 데이터를 저장함"
  steps:
    - title: "1. 명령어 인출"
      from: "Control Unit"
      to: "RAM"
      route_label: "제어장치가 PC의 주소와 읽기 신호를 RAM으로 보낸다."
      active_actors: [cpu, control, ram]
      description: "RAM은 해당 주소의 명령어를 CPU 쪽 데이터 버스로 돌려준다."
      payload: ["PC address", "read", "instruction"]
      outcomes:
        - status: allow
          text: "CPU는 인출한 명령어를 해석할 수 있다."
    - title: "2. 피연산자 읽기"
      from: "ALU / Registers"
      to: "RAM"
      route_label: "ADD 등에 필요한 데이터 주소와 읽기 신호를 RAM으로 보낸다."
      active_actors: [alu, ram]
      description: "주소·제어 신호와 실제 값이 서로 다른 방향으로 흐를 수 있음을 구분한다."
      payload: ["data address", "read", "operand"]
      outcomes:
        - status: info
          text: "읽기에서는 주소와 제어는 CPU에서, 값은 RAM에서 온다."
    - title: "3. 연산 수행"
      from: "RAM"
      to: "ALU / Registers"
      route_label: "RAM이 보낸 실제 값을 레지스터와 ALU가 계산에 사용한다."
      active_actors: [ram, alu]
      description: "제어장치가 명령어 순서를 조정하고 ALU가 산술·논리 연산을 수행한다."
      payload: ["data bus", "ADD", "result"]
      outcomes:
        - status: info
          text: "메모리 접근과 CPU 내부 연산은 서로 다른 책임이다."
    - title: "4. STORE"
      from: "ALU / Registers"
      to: "RAM"
      route_label: "저장 주소와 쓰기 신호, 레지스터의 값을 RAM으로 보낸다."
      active_actors: [alu, control, ram]
      description: "쓰기에서는 저장할 실제 값도 CPU에서 메모리로 이동한다."
      payload: ["address 502", "write", "value 13"]
      outcomes:
        - status: allow
          text: "RAM[502]에 새로운 값이 기록된다."

jpa_dirty_check:
  eyebrow: "Interactive flow"
  title: "JPA Dirty Checking과 테스트 트랜잭션 경계"
  summary: "영속 상태의 엔티티 변경을 트랜잭션 종료 시점에 감지해 UPDATE하고, 별도 트랜잭션에서 커밋 결과를 확인한다."
  actors:
    - id: service
      kind: "업무 흐름"
      name: "Service Transaction"
      description: "User를 조회하고 도메인 메서드를 호출하는 트랜잭션"
    - id: entity
      kind: "영속 객체"
      name: "Managed User"
      description: "영속성 컨텍스트가 스냅샷과 함께 추적하는 엔티티"
    - id: flush
      kind: "변경 감지"
      name: "Flush / UPDATE"
      description: "스냅샷과 현재 상태를 비교해 SQL을 준비하는 단계"
    - id: test
      kind: "검증 경계"
      name: "Separate Read Transaction"
      description: "커밋된 결과를 별도 트랜잭션에서 읽는 검증"
  steps:
    - title: "1. 엔티티 조회"
      from: "Service Transaction"
      to: "Managed User"
      route_label: "서비스 트랜잭션 안에서 User를 영속 상태로 조회한다."
      active_actors: [service, entity]
      description: "영속성 컨텍스트는 조회 시점의 상태를 스냅샷으로 기억한다."
      payload: ["find User", "managed", "snapshot"]
      outcomes:
        - status: info
          text: "변경 감지는 영속 상태 엔티티를 기준으로 동작한다."
    - title: "2. 도메인 변경"
      from: "Managed User"
      to: "Service Transaction"
      route_label: "setter 또는 changeName 같은 도메인 메서드로 엔티티 상태를 변경한다."
      active_actors: [entity, service]
      description: "변경 문법보다 영속성 컨텍스트가 추적하는 상태가 바뀌었는지가 중요하다."
      payload: ["changeName()", "현재 상태", "dirty"]
      outcomes:
        - status: info
          text: "엔티티 안에 변경 책임을 두면 정책을 함께 관리하기 쉽다."
    - title: "3. Flush와 커밋"
      from: "Managed User"
      to: "Flush / UPDATE"
      route_label: "flush 시점에 스냅샷과 현재 상태를 비교해 UPDATE SQL을 준비한다."
      active_actors: [entity, flush, service]
      description: "flush가 SQL을 보낸 시점과 트랜잭션이 최종 커밋된 시점은 구분해서 본다."
      payload: ["dirty checking", "UPDATE", "commit"]
      outcomes:
        - status: allow
          text: "커밋이 성공해야 다른 트랜잭션에서 변경 결과를 읽을 수 있다."
    - title: "4. 별도 조회 검증"
      from: "Separate Read Transaction"
      to: "Managed User"
      route_label: "서비스 트랜잭션이 끝난 뒤 별도 트랜잭션으로 변경된 User를 조회한다."
      active_actors: [test, entity]
      description: "테스트가 같은 트랜잭션 안에서만 동작하면 커밋과 격리 경계를 검증하지 못할 수 있다."
      payload: ["new transaction", "committed value", "assert"]
      outcomes:
        - status: info
          text: "검증하려는 사실에 맞춰 트랜잭션 경계를 설계한다."

boot_startup:
  eyebrow: "Interactive flow"
  title: "Spring Boot 애플리케이션 시작"
  summary: "Spring Boot가 설정과 클래스패스를 바탕으로 컨테이너와 웹 인프라를 준비한 뒤 애플리케이션을 실행한다."
  actors:
    - id: app
      kind: "시작점"
      name: "SpringApplication"
      description: "main에서 부트스트랩을 시작하는 진입점"
    - id: config
      kind: "환경 설정"
      name: "Auto Configuration"
      description: "클래스패스와 설정에 맞는 자동 구성 후보"
    - id: container
      kind: "객체 관리"
      name: "Spring Container"
      description: "BeanDefinition으로 객체와 의존성을 관리하는 컨테이너"
    - id: web
      kind: "웹 인프라"
      name: "Embedded Web Server"
      description: "HTTP 요청을 받을 서버와 Servlet 환경"
  steps:
    - title: "1. 애플리케이션 시작"
      from: "SpringApplication"
      to: "Auto Configuration"
      route_label: "SpringApplication이 환경과 클래스패스를 읽어 시작 구성을 결정한다."
      active_actors: [app, config]
      description: "Boot는 반복적인 초기화 코드를 줄이고 애플리케이션 구성 후보를 준비한다."
      payload: ["main", "classpath", "application.yml"]
      outcomes:
        - status: info
          text: "자동 구성은 조건에 따라 적용되므로 모든 애플리케이션의 결과가 동일하지 않다."
    - title: "2. 컨테이너 준비"
      from: "Auto Configuration"
      to: "Spring Container"
      route_label: "설정과 컴포넌트 스캔 결과로 BeanDefinition을 등록한다."
      active_actors: [config, container]
      description: "컨테이너는 Bean을 만들고 의존 관계를 연결할 준비를 한다."
      payload: ["BeanDefinition", "component scan", "dependency graph"]
      outcomes:
        - status: allow
          text: "객체 생성과 연결의 책임이 컨테이너로 모인다."
    - title: "3. 웹 인프라 준비"
      from: "Spring Container"
      to: "Embedded Web Server"
      route_label: "웹 관련 Bean과 내장 서버·Servlet 환경을 함께 준비한다."
      active_actors: [container, web]
      description: "웹 애플리케이션은 컨테이너 초기화와 HTTP 진입점 준비가 함께 완료되어야 한다."
      payload: ["DispatcherServlet", "embedded server", "port"]
      outcomes:
        - status: allow
          text: "서버가 뜬 뒤에야 외부 HTTP 요청을 받을 수 있다."
    - title: "4. 요청 대기"
      from: "Embedded Web Server"
      to: "SpringApplication"
      route_label: "초기화가 끝난 애플리케이션이 포트에서 HTTP 요청을 기다린다."
      active_actors: [web, app, container]
      description: "실제 Boot 내부 이벤트 순서 전체가 아니라 핵심 책임 연결을 단순화한 흐름이다."
      payload: ["started", "listening", "ready"]
      outcomes:
        - status: info
          text: "시작 성공과 요청 처리 흐름을 별개의 단계로 구분한다."

security_mvc:
  eyebrow: "Interactive flow"
  title: "Spring Security에서 Spring MVC까지"
  summary: "HTTP 요청은 Security Filter에서 인증·인가를 거친 뒤 DispatcherServlet과 Controller로 이어진다."
  actors:
    - id: client
      kind: "요청"
      name: "Client Request"
      description: "브라우저나 API 클라이언트의 HTTP 요청"
    - id: security
      kind: "보안 경계"
      name: "Security Filter"
      description: "인증 정보와 접근 권한을 확인하는 필터 체인"
    - id: mvc
      kind: "웹 분배"
      name: "DispatcherServlet"
      description: "Spring MVC의 Front Controller"
    - id: controller
      kind: "업무 진입점"
      name: "Controller"
      description: "매핑된 요청을 처리하는 컨트롤러"
  steps:
    - title: "1. 요청 진입"
      from: "Client Request"
      to: "Security Filter"
      route_label: "HTTP 요청이 애플리케이션 앞단의 Security Filter Chain으로 들어온다."
      active_actors: [client, security]
      description: "보안 검증은 MVC Controller보다 앞선 요청 경계에서 실행된다."
      payload: ["HTTP request", "Cookie / Bearer", "filter chain"]
      outcomes:
        - status: info
          text: "인증 정보가 없거나 유효하지 않으면 MVC로 내려가지 않을 수 있다."
    - title: "2. 인증·인가 확인"
      from: "Security Filter"
      to: "DispatcherServlet"
      route_label: "인증 결과와 권한 정책을 확인한 뒤 통과한 요청만 MVC로 넘긴다."
      active_actors: [security, mvc]
      description: "SecurityContext에 현재 요청의 인증 정보가 설정되는 시점과 Controller 호출을 구분한다."
      payload: ["Authentication", "Authorization", "SecurityContext"]
      outcomes:
        - status: allow
          text: "검증을 통과한 요청만 다음 계층에서 처리된다."
    - title: "3. 핸들러 매핑"
      from: "DispatcherServlet"
      to: "Controller"
      route_label: "DispatcherServlet이 URL과 HTTP 메서드에 맞는 Controller 핸들러를 찾는다."
      active_actors: [mvc, controller]
      description: "Spring MVC는 요청을 적절한 컨트롤러 메서드로 분배한다."
      payload: ["handler mapping", "path", "method"]
      outcomes:
        - status: allow
          text: "컨트롤러가 실제 비즈니스 요청 처리를 시작한다."
    - title: "4. 응답 반환"
      from: "Controller"
      to: "Client Request"
      route_label: "Controller의 결과가 MVC와 보안 계층을 거쳐 HTTP 응답으로 돌아간다."
      active_actors: [controller, mvc, client]
      description: "요청이 내려가는 경로와 응답이 올라오는 경로를 하나의 왕복으로 이해한다."
      payload: ["response body", "status", "HTTP response"]
      outcomes:
        - status: info
          text: "보안 필터와 MVC는 서로 다른 책임을 가진 요청 처리 계층이다."

mvc_http:
  eyebrow: "Interactive flow"
  title: "Spring MVC의 JSON 요청과 응답"
  summary: "Servlet Container가 요청을 받고 DispatcherServlet·Controller·MessageConverter를 거쳐 JSON 응답을 만든다."
  actors:
    - id: client
      kind: "HTTP 클라이언트"
      name: "Client"
      description: "JSON 요청을 보내고 응답을 받는 쪽"
    - id: servlet
      kind: "서블릿 환경"
      name: "Servlet Container"
      description: "네트워크 요청과 Servlet 실행을 담당하는 런타임"
    - id: dispatcher
      kind: "분배기"
      name: "DispatcherServlet"
      description: "핸들러를 찾고 MVC 처리를 조정하는 Front Controller"
    - id: converter
      kind: "변환기"
      name: "HttpMessageConverter"
      description: "객체와 JSON Body를 변환하는 계층"
  steps:
    - title: "1. JSON 요청 수신"
      from: "Client"
      to: "Servlet Container"
      route_label: "클라이언트가 JSON Body를 포함한 HTTP 요청을 보낸다."
      active_actors: [client, servlet]
      description: "URL 파라미터 요청과 JSON Body 요청은 필요한 변환 경로가 다를 수 있다."
      payload: ["POST /users", "Content-Type: application/json", "JSON"]
      outcomes:
        - status: info
          text: "모든 HTTP 요청이 JSON 변환을 필요로 하지는 않는다."
    - title: "2. MVC 분배"
      from: "Servlet Container"
      to: "DispatcherServlet"
      route_label: "Servlet Container가 요청을 DispatcherServlet에 전달한다."
      active_actors: [servlet, dispatcher]
      description: "DispatcherServlet이 Spring MVC 내부의 요청 처리를 시작한다."
      payload: ["servlet request", "handler mapping", "controller"]
      outcomes:
        - status: allow
          text: "적절한 컨트롤러 메서드가 선택된다."
    - title: "3. JSON 역직렬화"
      from: "HttpMessageConverter"
      to: "DispatcherServlet"
      route_label: "Jackson 같은 변환기가 Request Body를 Java 객체로 만든다."
      active_actors: [converter, dispatcher]
      description: "객체로 바꾸는 단계는 들어오는 JSON Body에 대한 역직렬화다."
      payload: ["JSON", "CreateUserRequest", "deserialize"]
      outcomes:
        - status: info
          text: "객체 변환과 비즈니스 로직 수행을 하나의 단계로 합치지 않는다."
    - title: "4. JSON 응답 직렬화"
      from: "DispatcherServlet"
      to: "Client"
      route_label: "Controller 결과 객체를 JSON으로 직렬화해 HTTP 응답으로 보낸다."
      active_actors: [dispatcher, converter, client]
      description: "응답 객체를 JSON으로 바꾸는 과정은 들어올 때와 반대 방향의 변환이다."
      payload: ["UserResponse", "serialize", "HTTP response"]
      outcomes:
        - status: allow
          text: "네트워크 I/O와 객체 직렬화 책임을 분리해 설명할 수 있다."

bean_lifecycle:
  eyebrow: "Interactive flow"
  title: "Annotation에서 Spring Bean 생명주기까지"
  summary: "Spring이 어노테이션 메타데이터를 읽어 BeanDefinition을 만들고 객체를 생성·주입·초기화한다."
  actors:
    - id: annotation
      kind: "메타데이터"
      name: "@Service / @Component"
      description: "클래스가 Bean 후보임을 나타내는 어노테이션"
    - id: reflection
      kind: "해석"
      name: "Reflection / Scan"
      description: "클래스패스의 메타데이터를 읽는 과정"
    - id: definition
      kind: "설계 정보"
      name: "BeanDefinition"
      description: "생성·주입·스코프 정보를 담은 정의"
    - id: bean
      kind: "관리 객체"
      name: "Spring Bean"
      description: "컨테이너가 생성하고 생명주기를 관리하는 객체"
  steps:
    - title: "1. 후보 표시"
      from: "@Service / @Component"
      to: "Reflection / Scan"
      route_label: "컴포넌트 스캔이 직접 또는 메타 어노테이션을 가진 클래스를 찾는다."
      active_actors: [annotation, reflection]
      description: "@Service 자체가 객체를 만드는 것이 아니라 Bean 후보라는 메타데이터를 제공한다."
      payload: ["@Service", "@Component", "classpath"]
      outcomes:
        - status: info
          text: "어노테이션과 객체 생성 주체를 구분한다."
    - title: "2. 정의 등록"
      from: "Reflection / Scan"
      to: "BeanDefinition"
      route_label: "Spring이 클래스 정보와 설정을 BeanDefinition으로 등록한다."
      active_actors: [reflection, definition]
      description: "컨테이너가 이후 어떤 방식으로 Bean을 만들지 설명하는 내부 정의가 준비된다."
      payload: ["class metadata", "scope", "constructor"]
      outcomes:
        - status: allow
          text: "객체 생성 계획과 의존성 정보가 컨테이너에 모인다."
    - title: "3. 객체 생성과 주입"
      from: "BeanDefinition"
      to: "Spring Bean"
      route_label: "컨테이너가 객체를 만들고 필요한 의존성을 연결한다."
      active_actors: [definition, bean]
      description: "생성자 주입 등 구성 규칙에 따라 Bean 그래프가 완성된다."
      payload: ["instantiate", "dependency injection", "proxy 후보"]
      outcomes:
        - status: allow
          text: "애플리케이션 코드가 구현체를 직접 생성하지 않아도 된다."
    - title: "4. 생명주기 관리"
      from: "Spring Bean"
      to: "Spring Container"
      route_label: "초기화 콜백과 스코프 규칙에 따라 컨테이너가 Bean을 관리한다."
      active_actors: [bean, definition]
      description: "Bean 등록은 생성 한 번으로 끝나지 않고 초기화·사용·종료까지 이어진다."
      payload: ["init", "scope", "destroy"]
      outcomes:
        - status: info
          text: "생명주기 책임이 컨테이너에 있다는 점이 핵심이다."

ioc_di:
  eyebrow: "Interactive comparison"
  title: "직접 생성과 Spring IoC·DI"
  summary: "직접 생성은 서비스가 구현체를 선택하지만 IoC·DI에서는 컨테이너가 객체 생성과 의존성 연결을 맡는다."
  actors:
    - id: service
      kind: "사용자"
      name: "OrderService"
      description: "OrderRepository 계약을 필요로 하는 서비스"
    - id: impl
      kind: "구현체"
      name: "JdbcOrderRepository"
      description: "Repository 계약의 구체 구현"
    - id: container
      kind: "외부 조정자"
      name: "Spring IoC Container"
      description: "객체를 만들고 의존성을 주입하는 관리 주체"
    - id: contract
      kind: "추상화"
      name: "OrderRepository"
      description: "서비스와 구현체 사이의 계약"
  steps:
    - title: "1. 직접 생성"
      from: "OrderService"
      to: "JdbcOrderRepository"
      route_label: "서비스가 new JdbcOrderRepository()로 구체 구현체를 직접 만든다."
      active_actors: [service, impl]
      description: "호출부가 구현체 선택과 생성 방법을 함께 알아야 하는 구조다."
      payload: ["new", "구체 클래스", "강한 결합"]
      outcomes:
        - status: warning
          text: "구현체 교체와 테스트 대체 범위가 서비스에 퍼질 수 있다."
    - title: "2. 계약 의존"
      from: "OrderService"
      to: "OrderRepository"
      route_label: "서비스는 필요한 기능의 계약만 알고 구체 구현체는 직접 만들지 않는다."
      active_actors: [service, contract]
      description: "인터페이스 타입에 의존하면 구현의 세부 사항과 호출부를 분리할 수 있다."
      payload: ["constructor parameter", "interface", "역할"]
      outcomes:
        - status: allow
          text: "서비스의 책임이 의존성 생성에서 업무 처리로 좁혀진다."
    - title: "3. 컨테이너 주입"
      from: "Spring IoC Container"
      to: "OrderService"
      route_label: "컨테이너가 OrderRepository 구현체를 선택해 생성자에 전달한다."
      active_actors: [container, contract, service, impl]
      description: "IoC는 객체 관리의 제어권을 외부로 넘기는 더 큰 개념이고 DI는 그 전달 방식이다."
      payload: ["bean creation", "constructor injection", "wiring"]
      outcomes:
        - status: allow
          text: "구현체 선택과 연결 책임이 바깥 구성으로 이동한다."

modern_java_selection:
  eyebrow: "Interactive flow"
  title: "코드 의도에서 Modern Java 기능 선택"
  summary: "최신 문법을 무조건 적용하지 않고 코드가 표현하려는 의도와 기능의 책임을 맞춰 선택한다."
  actors:
    - id: intent
      kind: "문제 의도"
      name: "Code Intent"
      description: "데이터 전달·부재·분기·타입 계층 같은 코드의 목적"
    - id: data
      kind: "데이터 전달"
      name: "record"
      description: "값 중심 DTO를 간결하게 표현하는 기능"
    - id: absence
      kind: "부재 표현"
      name: "Optional / orElseGet"
      description: "값의 부재와 기본값 계산 시점을 표현함"
    - id: type
      kind: "타입·분기"
      name: "sealed / pattern / switch"
      description: "허용 타입과 분기 의도를 드러내는 기능들"
  steps:
    - title: "1. 의도 확인"
      from: "Code Intent"
      to: "record"
      route_label: "주된 책임이 데이터 전달인지 먼저 확인한다."
      active_actors: [intent, data]
      description: "DTO처럼 값 전달이 중심이면 record가 후보가 될 수 있다."
      payload: ["DTO", "불변 값", "record"]
      outcomes:
        - status: info
          text: "Entity까지 같은 방식으로 바꾸는 것은 도메인 책임을 다시 확인해야 한다."
    - title: "2. 부재와 비용"
      from: "Code Intent"
      to: "Optional / orElseGet"
      route_label: "값이 없을 수 있는지와 기본값 계산 비용이 큰지를 구분한다."
      active_actors: [intent, absence]
      description: "Optional은 부재를, orElseGet은 기본값 계산 시점 지연을 표현한다."
      payload: ["empty result", "Optional", "lazy default"]
      outcomes:
        - status: allow
          text: "기능 이름보다 코드가 전달하려는 사실을 먼저 드러낸다."
    - title: "3. 타입 계층과 분기"
      from: "Code Intent"
      to: "sealed / pattern / switch"
      route_label: "허용 타입을 닫거나 분기 결과를 표현해야 하는지 판단한다."
      active_actors: [intent, type]
      description: "sealed, pattern matching, switch expression은 서로 다른 의도를 위한 도구다."
      payload: ["sealed", "instanceof pattern", "switch expression"]
      outcomes:
        - status: info
          text: "최신 문법 사용 자체가 리팩터링의 목적은 아니다."

spring_http_io:
  eyebrow: "Interactive flow"
  title: "Spring HTTP 요청의 직렬화와 I/O"
  summary: "클라이언트 JSON은 Java 객체로 역직렬화되고 비즈니스 로직 뒤 응답 객체가 다시 JSON으로 직렬화된다."
  actors:
    - id: client
      kind: "네트워크 입력"
      name: "HTTP Client"
      description: "JSON Request를 보내고 JSON Response를 받는 클라이언트"
    - id: converter
      kind: "변환 계층"
      name: "Jackson Converter"
      description: "JSON과 Java 객체 사이를 변환하는 계층"
    - id: service
      kind: "업무 로직"
      name: "Spring Service"
      description: "변환된 요청을 처리하는 비즈니스 계층"
    - id: response
      kind: "네트워크 출력"
      name: "HTTP Response"
      description: "직렬화된 JSON을 담은 응답"
  steps:
    - title: "1. JSON 수신"
      from: "HTTP Client"
      to: "Jackson Converter"
      route_label: "클라이언트가 JSON Request Body를 네트워크로 보낸다."
      active_actors: [client, converter]
      description: "HTTP 네트워크 입력과 JSON 형식 자체를 구분한다."
      payload: ["HTTP request", "JSON", "Request Body"]
      outcomes:
        - status: info
          text: "JSON이 들어온다는 사실과 객체 변환은 서로 다른 단계다."
    - title: "2. 역직렬화"
      from: "Jackson Converter"
      to: "Spring Service"
      route_label: "Request Body를 CreateUserRequest 같은 Java 객체로 변환한다."
      active_actors: [converter, service]
      description: "외부 표현을 애플리케이션 내부 타입으로 바꾸는 과정이다."
      payload: ["deserialize", "CreateUserRequest", "Java object"]
      outcomes:
        - status: allow
          text: "서비스는 JSON 문법보다 객체의 의미를 다룬다."
    - title: "3. 비즈니스 처리"
      from: "Spring Service"
      to: "Jackson Converter"
      route_label: "서비스가 처리 결과를 UserResponse 같은 객체로 만든다."
      active_actors: [service, converter]
      description: "업무 로직 수행과 결과 객체 생성은 직렬화 전의 별도 책임이다."
      payload: ["business logic", "UserResponse", "result object"]
      outcomes:
        - status: info
          text: "객체가 만들어졌다고 네트워크 응답이 바로 되는 것은 아니다."
    - title: "4. 직렬화와 응답"
      from: "Jackson Converter"
      to: "HTTP Response"
      route_label: "응답 객체를 JSON으로 바꾸고 HTTP Response로 전송한다."
      active_actors: [converter, response, client]
      description: "내부 객체를 외부 전송 형식으로 바꾸는 과정이 직렬화다."
      payload: ["serialize", "JSON response", "network output"]
      outcomes:
        - status: allow
          text: "입력의 역직렬화와 출력의 직렬화를 왕복 흐름으로 구분한다."

race_condition:
  eyebrow: "Interactive flow"
  title: "count++에서 발생하는 Race Condition"
  summary: "두 Thread가 같은 값을 읽고 각각 계산한 뒤 덮어쓰면 기대한 2가 아니라 1이 남을 수 있다."
  actors:
    - id: thread_a
      kind: "실행 흐름 A"
      name: "Thread A"
      description: "공유 count를 읽고 증가시키는 스레드"
    - id: thread_b
      kind: "실행 흐름 B"
      name: "Thread B"
      description: "같은 공유 상태에 동시에 접근하는 스레드"
    - id: shared
      kind: "공유 상태"
      name: "count = 0"
      description: "두 Thread가 함께 읽고 쓰는 값"
    - id: result
      kind: "최종 결과"
      name: "count = 1"
      description: "쓰기 충돌로 한 증가가 사라진 결과"
  steps:
    - title: "1. 같은 값 읽기"
      from: "count = 0"
      to: "Thread A / Thread B"
      route_label: "두 Thread가 거의 동시에 공유 count의 0을 읽는다."
      active_actors: [shared, thread_a, thread_b]
      description: "count++는 한 번에 끝나는 원자 연산이 아니라 읽기·수정·쓰기의 묶음이다."
      payload: ["read 0", "read 0", "shared state"]
      outcomes:
        - status: warning
          text: "둘 다 같은 이전 값을 기반으로 계산할 수 있다."
    - title: "2. 각각 1 계산"
      from: "Thread A / Thread B"
      to: "count = 0"
      route_label: "각 Thread가 로컬 계산 결과 1을 만든다."
      active_actors: [thread_a, thread_b, shared]
      description: "각자 한 번 증가시켰다는 사실과 공유 메모리에 반영된 횟수는 다를 수 있다."
      payload: ["0 + 1", "local result 1", "overlap"]
      outcomes:
        - status: warning
          text: "두 계산 사이에 다른 Thread의 쓰기가 끼어들 수 있다."
    - title: "3. 마지막 쓰기"
      from: "Thread A / Thread B"
      to: "count = 1"
      route_label: "마지막으로 기록된 1이 앞선 Thread의 결과를 덮어쓴다."
      active_actors: [thread_a, thread_b, result]
      description: "실행 순서에 따라 결과가 달라지는 것이 Race Condition이다."
      payload: ["write 1", "write 1", "lost update"]
      outcomes:
        - status: reject
          text: "두 번의 증가가 모두 반영될 것이라는 보장이 깨진다."
    - title: "4. 제어 범위 선택"
      from: "count = 1"
      to: "count = 0"
      route_label: "락·원자 연산·불변 구조 등 공유 상태에 맞는 제어 방식을 선택한다."
      active_actors: [result, shared]
      description: "동기화 여부보다 어떤 상태를 어느 범위에서 보호해야 하는지 먼저 판단한다."
      payload: ["lock", "atomic", "critical section"]
      outcomes:
        - status: info
          text: "문제의 원인은 Thread 수가 아니라 공유 상태의 경쟁이다."

singleton_shared_state:
  eyebrow: "Interactive flow"
  title: "Spring Singleton Bean과 공유 mutable 상태"
  summary: "여러 HTTP 요청이 하나의 Singleton Bean 인스턴스에 동시에 들어오면 mutable field가 요청 간 공유될 수 있다."
  actors:
    - id: requests
      kind: "동시 요청"
      name: "HTTP Requests"
      description: "서로 다른 요청 Thread에서 들어오는 호출들"
    - id: threads
      kind: "실행 흐름"
      name: "Request Threads"
      description: "각 요청을 처리하는 독립 실행 흐름"
    - id: bean
      kind: "공유 객체"
      name: "Singleton Bean"
      description: "컨테이너가 기본적으로 하나만 만드는 Bean"
    - id: state
      kind: "변경 가능 필드"
      name: "Mutable Field"
      description: "요청별 값이 섞일 수 있는 인스턴스 상태"
  steps:
    - title: "1. 요청 분리"
      from: "HTTP Requests"
      to: "Request Threads"
      route_label: "여러 HTTP 요청이 서로 다른 Thread에서 동시에 실행된다."
      active_actors: [requests, threads]
      description: "요청별 로컬 변수는 Thread마다 분리되지만 Bean 인스턴스는 별도 문제다."
      payload: ["request A", "request B", "thread"]
      outcomes:
        - status: info
          text: "Thread가 다르다는 사실만으로 객체 상태가 분리되지는 않는다."
    - title: "2. 하나의 Bean 공유"
      from: "Request Threads"
      to: "Singleton Bean"
      route_label: "여러 Thread가 컨테이너의 같은 Singleton Bean을 호출한다."
      active_actors: [threads, bean]
      description: "Singleton은 인스턴스 수를 줄이는 스코프이지 자동으로 Thread-safe하게 만드는 장치가 아니다."
      payload: ["same instance", "DI", "concurrent call"]
      outcomes:
        - status: warning
          text: "인스턴스 필드가 요청별 작업 공간으로 사용되면 경쟁이 생긴다."
    - title: "3. mutable field 충돌"
      from: "Singleton Bean"
      to: "Mutable Field"
      route_label: "동시 요청이 같은 mutable field를 읽고 쓰면서 값이 섞일 수 있다."
      active_actors: [bean, state, threads]
      description: "요청 데이터는 메서드 로컬 변수나 불변 값으로 두고 공유 상태는 별도 보호가 필요하다."
      payload: ["field write", "request data", "race"]
      outcomes:
        - status: reject
          text: "Singleton이라는 이유만으로 공유 필드가 안전해지지 않는다."

distributed_jvm_lock:
  eyebrow: "Interactive comparison"
  title: "여러 서버에서 JVM Lock이 충분하지 않은 이유"
  summary: "각 서버의 JVM Lock은 자기 프로세스 안에서만 유효하므로 같은 DB를 향한 전역 경쟁을 막지 못한다."
  actors:
    - id: request_a
      kind: "요청 경로 A"
      name: "Server A"
      description: "첫 번째 JVM에서 요청을 처리하는 서버"
    - id: request_b
      kind: "요청 경로 B"
      name: "Server B"
      description: "두 번째 JVM에서 요청을 처리하는 서버"
    - id: lock
      kind: "프로세스 잠금"
      name: "JVM Locks"
      description: "각 JVM 내부 객체에 걸린 독립된 락"
    - id: db
      kind: "공유 자원"
      name: "Shared Database"
      description: "두 서버가 함께 변경하는 외부 상태"
  steps:
    - title: "1. 요청 분산"
      from: "Server A / Server B"
      to: "JVM Locks"
      route_label: "로드 밸런서가 같은 자원 요청을 서로 다른 서버로 보낼 수 있다."
      active_actors: [request_a, request_b]
      description: "서버가 여러 대가 되면 요청이 한 프로세스에만 머문다는 보장이 없다."
      payload: ["request 1", "request 2", "load balancing"]
      outcomes:
        - status: warning
          text: "분산 배치에서는 서버별 메모리 상태가 서로 다르다."
    - title: "2. 독립 Lock 획득"
      from: "JVM Locks"
      to: "Shared Database"
      route_label: "Server A와 B가 서로 다른 JVM Lock을 획득하고 DB에 접근한다."
      active_actors: [request_a, request_b, lock, db]
      description: "객체 주소와 락 모니터가 JVM마다 다르므로 한쪽 락이 다른 서버를 멈추지 않는다."
      payload: ["lock A", "lock B", "same row"]
      outcomes:
        - status: reject
          text: "프로세스 내부 락만으로 전역 상호 배제를 만들 수 없다."
    - title: "3. 공유 제어 선택"
      from: "Shared Database"
      to: "JVM Locks"
      route_label: "DB Lock·분산 Lock·원자 연산처럼 공유 자원에 도달하는 제어를 선택한다."
      active_actors: [db, request_a, request_b]
      description: "락의 위치는 보호하려는 상태가 실제로 어디에 있는지에 맞춰야 한다."
      payload: ["DB row lock", "distributed lock", "atomic update"]
      outcomes:
        - status: info
          text: "단일 JVM 문제와 여러 서버의 공유 상태 문제를 구분한다."

jvm_memory:
  eyebrow: "Interactive flow"
  title: "JVM Stack·Heap·Method Area와 객체 생명주기"
  summary: "Stack의 여러 참조가 Heap의 같은 객체를 가리킬 수 있고 Method Area는 클래스 수준 정보를 관리한다."
  actors:
    - id: stack
      kind: "호출 프레임"
      name: "JVM Stack"
      description: "메서드별 지역 변수와 객체 참조를 담는 영역"
    - id: heap
      kind: "객체 저장"
      name: "Heap"
      description: "new로 생성된 객체가 놓이는 영역"
    - id: method
      kind: "클래스 정보"
      name: "Method Area"
      description: "클래스 메타데이터와 정적 수준 정보를 관리하는 영역"
    - id: gc
      kind: "회수 판단"
      name: "Garbage Collector"
      description: "더 이상 도달할 수 없는 객체를 회수하는 런타임"
  steps:
    - title: "1. 객체 생성"
      from: "JVM Stack"
      to: "Heap"
      route_label: "메서드 안의 참조 변수 user1·user2가 Heap의 User 객체를 가리킨다."
      active_actors: [stack, heap]
      description: "변수 두 개가 있어도 new를 한 번만 했다면 같은 객체를 함께 가리킬 수 있다."
      payload: ["user1", "user2", "new User()"]
      outcomes:
        - status: info
          text: "참조 변수 수와 Heap 객체 수를 같은 숫자로 세지 않는다."
    - title: "2. 클래스 정보 사용"
      from: "Method Area"
      to: "Heap"
      route_label: "User 클래스의 메타데이터와 메서드 정보가 객체 동작을 뒷받침한다."
      active_actors: [method, heap]
      description: "객체 인스턴스 데이터와 클래스 수준 정보는 다른 메모리 책임으로 나누어 본다."
      payload: ["class metadata", "method", "static info"]
      outcomes:
        - status: info
          text: "Method Area의 구현 세부는 JVM 버전에 따라 달라질 수 있다."
    - title: "3. 프레임 종료"
      from: "JVM Stack"
      to: "Garbage Collector"
      route_label: "메서드가 끝나면 Stack의 지역 참조는 사라지고 Heap 객체의 도달 가능성을 다시 판단한다."
      active_actors: [stack, heap, gc]
      description: "참조가 모두 끊겼다고 해서 즉시 객체가 삭제되는 것은 아니며 GC가 회수 시점을 결정한다."
      payload: ["frame pop", "reachability", "GC candidate"]
      outcomes:
        - status: info
          text: "메서드 종료와 객체 즉시 소멸을 같은 사건으로 보지 않는다."

collection_framework:
  eyebrow: "Interactive comparison"
  title: "Java Collection Framework의 구조"
  summary: "공통 인터페이스 아래 List·Set과 별도 Map 계층이 저장과 조회 방식에 맞는 구현체를 제공한다."
  actors:
    - id: collection
      kind: "공통 계약"
      name: "Collection"
      description: "여러 요소를 다루는 공통 인터페이스"
    - id: list
      kind: "순서·중복"
      name: "List"
      description: "인덱스와 입력 순서를 다루는 계층"
    - id: set
      kind: "중복 없음"
      name: "Set"
      description: "논리적 중복을 허용하지 않는 계층"
    - id: map
      kind: "키·값"
      name: "Map"
      description: "Key와 Value 관계를 관리하는 별도 계층"
  steps:
    - title: "1. 공통 컬렉션 계약"
      from: "Collection"
      to: "List / Set"
      route_label: "List와 Set이 Collection의 공통 연산 계약을 확장한다."
      active_actors: [collection, list, set]
      description: "Collection은 단순히 크기가 변하는 배열이 아니라 여러 구조를 공통 방식으로 다루는 틀이다."
      payload: ["add", "remove", "iterate"]
      outcomes:
        - status: info
          text: "공통 인터페이스와 저장 구조 구현체를 구분한다."
    - title: "2. List 선택"
      from: "List"
      to: "Collection"
      route_label: "순서와 인덱스 접근이 중요하면 List 계열을 선택한다."
      active_actors: [list, collection]
      description: "ArrayList와 LinkedList는 같은 List 계약을 서로 다른 저장 구조로 구현한다."
      payload: ["order", "duplicates", "index"]
      outcomes:
        - status: allow
          text: "사용 패턴이 구현체 선택의 기준이 된다."
    - title: "3. Set 선택"
      from: "Set"
      to: "Collection"
      route_label: "중복을 허용하지 않는 값 집합이 필요하면 Set 계열을 선택한다."
      active_actors: [set, collection]
      description: "Set의 중복 판단은 구현체의 해시·동등성 계약과 연결된다."
      payload: ["unique", "equals", "hashCode"]
      outcomes:
        - status: info
          text: "중복 없음은 값의 의미를 어떻게 정의하는지에 달려 있다."
    - title: "4. Map 분리"
      from: "Map"
      to: "Collection"
      route_label: "키와 값의 관계를 저장해야 하면 Collection과 별도인 Map 계층을 사용한다."
      active_actors: [map, collection]
      description: "Map은 요소 하나씩의 순서보다 키로 값을 찾는 관계를 모델링한다."
      payload: ["key", "value", "lookup"]
      outcomes:
        - status: info
          text: "List·Set·Map을 하나의 배열 대체품으로 묶어 선택하지 않는다."

arraylist_linkedlist:
  eyebrow: "Interactive comparison"
  title: "ArrayList와 LinkedList 저장 구조"
  summary: "ArrayList는 배열 인덱스로 접근하고 LinkedList는 노드 링크를 따라가므로 접근과 삽입 비용이 다르다."
  actors:
    - id: operation
      kind: "사용 패턴"
      name: "Access / Insert"
      description: "인덱스 조회와 중간 삽입·삭제 같은 작업"
    - id: array
      kind: "연속 저장"
      name: "ArrayList"
      description: "내부 배열과 인덱스로 요소를 저장"
    - id: linked
      kind: "노드 연결"
      name: "LinkedList"
      description: "노드와 next·prev 링크로 요소를 저장"
    - id: cost
      kind: "비용 판단"
      name: "Actual Workload"
      description: "탐색과 이동을 함께 포함한 실제 비용"
  steps:
    - title: "1. 인덱스 조회"
      from: "Access / Insert"
      to: "ArrayList"
      route_label: "ArrayList는 인덱스로 내부 배열 위치를 계산해 요소를 읽는다."
      active_actors: [operation, array]
      description: "연속 저장 덕분에 임의 인덱스 접근이 일정한 비용에 가깝다."
      payload: ["get(i)", "array index", "O(1)"]
      outcomes:
        - status: allow
          text: "인덱스 조회와 순회가 많은 코드에서 기본 선택이 될 수 있다."
    - title: "2. 링크 탐색"
      from: "Access / Insert"
      to: "LinkedList"
      route_label: "LinkedList는 시작점에서 노드를 따라가 대상 위치를 찾는다."
      active_actors: [operation, linked]
      description: "삽입 위치를 이미 알고 있지 않다면 탐색 비용이 먼저 발생한다."
      payload: ["node", "next / prev", "traversal"]
      outcomes:
        - status: warning
          text: "중간 삽입이 항상 전체 작업에서 빠르다고 단정하지 않는다."
    - title: "3. 구현체 선택"
      from: "Actual Workload"
      to: "ArrayList"
      route_label: "조회·순회·삽입 빈도와 위치 지식까지 포함해 구현체를 선택한다."
      active_actors: [cost, array, linked]
      description: "Big-O 하나만 보지 말고 실제 호출 패턴과 메모리 비용을 함께 비교한다."
      payload: ["access frequency", "known position", "node overhead"]
      outcomes:
        - status: info
          text: "자료구조 선택은 작업 패턴에 대한 설계 결정이다."

hashset_equals:
  eyebrow: "Interactive flow"
  title: "HashSet의 hashCode와 equals"
  summary: "HashSet은 hashCode로 후보 버킷을 찾은 뒤 equals로 논리적 중복을 최종 판단한다."
  actors:
    - id: object
      kind: "입력 객체"
      name: "User Object"
      description: "Set에 추가하거나 이미 존재하는지 확인할 객체"
    - id: hash
      kind: "1차 탐색"
      name: "hashCode()"
      description: "객체가 들어갈 후보 버킷을 계산하는 값"
    - id: bucket
      kind: "후보 영역"
      name: "Hash Bucket"
      description: "같은 해시 후보가 모이는 저장 영역"
    - id: equals
      kind: "최종 비교"
      name: "equals()"
      description: "논리적으로 같은 객체인지 확인하는 비교"
  steps:
    - title: "1. 해시 계산"
      from: "User Object"
      to: "hashCode()"
      route_label: "입력 객체의 hashCode를 계산해 후보 버킷을 찾는다."
      active_actors: [object, hash]
      description: "해시값은 탐색 범위를 좁히는 기준이지 동등성의 최종 증거는 아니다."
      payload: ["hashCode", "bucket index", "candidate"]
      outcomes:
        - status: info
          text: "서로 다른 객체도 같은 해시값을 가질 수 있다."
    - title: "2. 버킷 진입"
      from: "hashCode()"
      to: "Hash Bucket"
      route_label: "계산된 해시 위치의 후보 요소만 비교 대상으로 좁힌다."
      active_actors: [hash, bucket]
      description: "해시 테이블은 전체 요소를 모두 비교하지 않도록 후보를 줄인다."
      payload: ["bucket", "collision", "candidate set"]
      outcomes:
        - status: info
          text: "충돌이 있어도 다음 equals 단계로 판단할 수 있다."
    - title: "3. 논리적 동등성"
      from: "Hash Bucket"
      to: "equals()"
      route_label: "후보 객체와 equals를 호출해 논리적으로 같은지 확인한다."
      active_actors: [bucket, equals, object]
      description: "equals가 true인 두 객체는 같은 hashCode를 반환해야 계약이 유지된다."
      payload: ["equals", "same identity by rule", "duplicate"]
      outcomes:
        - status: reject
          text: "equals와 hashCode 계약을 어기면 Set의 중복 판단이 깨질 수 있다."

generic_pecs:
  eyebrow: "Interactive comparison"
  title: "Generic Wildcard와 PECS"
  summary: "extends는 생산자에서 안전하게 읽는 방향이고 super는 소비자에 값을 넣는 방향을 표현한다."
  actors:
    - id: producer
      kind: "상한 타입"
      name: "? extends T"
      description: "T의 하위 타입을 생산하는 컬렉션"
    - id: consumer
      kind: "하한 타입"
      name: "? super T"
      description: "T 또는 상위 타입을 소비하는 컬렉션"
    - id: read
      kind: "읽기"
      name: "Read as T"
      description: "상한을 알고 읽을 수 있는 방향"
    - id: write
      kind: "쓰기"
      name: "Write T"
      description: "하한이 보장되어 넣을 수 있는 방향"
  steps:
    - title: "1. extends 생산자"
      from: "? extends T"
      to: "Read as T"
      route_label: "T의 하위 타입을 담은 컬렉션에서 값을 T로 읽는다."
      active_actors: [producer, read]
      description: "정확한 실제 하위 타입은 몰라도 T라는 상한은 보장된다."
      payload: ["Producer", "? extends T", "get"]
      outcomes:
        - status: allow
          text: "값을 읽는 용도에 적합하다."
    - title: "2. extends 쓰기 제한"
      from: "Read as T"
      to: "? extends T"
      route_label: "어떤 구체 하위 타입인지 모르므로 임의의 T 값을 넣기 어렵다."
      active_actors: [producer, read]
      description: "하위 타입 전용 컬렉션일 수 있어 안전한 추가 타입을 확정할 수 없다."
      payload: ["unknown subtype", "add 제한", "type safety"]
      outcomes:
        - status: warning
          text: "extends를 읽기와 쓰기 모두 가능하다고 외우지 않는다."
    - title: "3. super 소비자"
      from: "? super T"
      to: "Write T"
      route_label: "T 또는 T의 상위 타입 컬렉션에는 T 값을 안전하게 넣을 수 있다."
      active_actors: [consumer, write]
      description: "실제 타입이 T의 부모여도 T는 그 안에 들어갈 수 있다."
      payload: ["Consumer", "? super T", "add(T)"]
      outcomes:
        - status: allow
          text: "값을 소비하는 메서드의 매개변수에 적합하다."
    - title: "4. PECS 적용"
      from: "Producer / Consumer"
      to: "Read as T"
      route_label: "데이터를 꺼내는 쪽은 extends, 넣는 쪽은 super를 후보로 삼는다."
      active_actors: [producer, consumer, read, write]
      description: "PECS는 암기보다 컴파일러가 확정할 수 있는 타입 범위를 묻는 규칙이다."
      payload: ["Producer Extends", "Consumer Super", "generic API"]
      outcomes:
        - status: info
          text: "실제 API의 반환·입력 역할에 맞춰 wildcard를 선택한다."

string_pool:
  eyebrow: "Interactive flow"
  title: "String Pool과 new String"
  summary: "문자열 리터럴은 String Pool의 객체를 공유할 수 있지만 new String은 별도 객체를 만든다."
  actors:
    - id: literal
      kind: "리터럴"
      name: '"hello"'
      description: "String Pool에 intern되는 문자열 리터럴"
    - id: pool
      kind: "공유 영역"
      name: "String Pool"
      description: "같은 리터럴 객체를 재사용하는 풀"
    - id: reference
      kind: "참조 변수"
      name: "a · b · c"
      description: "문자열 객체를 가리키는 변수들"
    - id: fresh
      kind: "새 객체"
      name: "new String()"
      description: "내용은 같지만 별도로 생성된 객체"
  steps:
    - title: "1. 리터럴 조회"
      from: '"hello"'
      to: "String Pool"
      route_label: "문자열 리터럴은 Pool에서 같은 내용의 객체를 재사용할 수 있다."
      active_actors: [literal, pool]
      description: "리터럴 표현과 객체 생성 표현은 같은 참조 동작을 보장하지 않는다."
      payload: ["literal", "intern", "shared object"]
      outcomes:
        - status: info
          text: "내용이 같다는 사실과 참조가 같다는 사실은 분리해서 확인한다."
    - title: "2. a와 b 공유"
      from: "String Pool"
      to: "a · b · c"
      route_label: "같은 리터럴을 사용한 a와 b가 Pool의 동일 객체를 가리킬 수 있다."
      active_actors: [pool, reference]
      description: "참조 동일성은 리터럴 풀링 규칙과 연결된다."
      payload: ["a", "b", "same reference"]
      outcomes:
        - status: allow
          text: "a == b가 true가 될 수 있는 구조다."
    - title: "3. c는 별도 객체"
      from: "new String()"
      to: "a · b · c"
      route_label: "new String(\"hello\")는 같은 내용을 가진 새 객체를 만든다."
      active_actors: [fresh, reference]
      description: "c의 문자열 내용은 같아도 Pool 객체와 참조는 다를 수 있다."
      payload: ["c", "new", "different reference"]
      outcomes:
        - status: warning
          text: "문자열 내용 비교에는 equals를 사용한다."

string_immutable_assignment:
  eyebrow: "Interactive flow"
  title: "String 불변성과 재대입"
  summary: "문자열 연산은 기존 객체를 바꾸지 않고 새로운 결과 객체를 만들어 변수의 참조를 바꾼다."
  actors:
    - id: variable
      kind: "변수"
      name: "value"
      description: "현재 문자열 객체를 가리키는 참조 변수"
    - id: old
      kind: "기존 객체"
      name: '"hello"'
      description: "연산 전부터 존재하는 불변 String 객체"
    - id: operation
      kind: "연산"
      name: 'value + " world"'
      description: "새로운 문자열 내용을 계산하는 표현"
    - id: fresh
      kind: "새 객체"
      name: '"hello world"'
      description: "연산 결과로 만들어진 String 객체"
  steps:
    - title: "1. 기존 참조"
      from: "value"
      to: '"hello"'
      route_label: "value가 기존 hello 객체를 가리킨다."
      active_actors: [variable, old]
      description: "String 객체의 내부 문자를 직접 바꾸는 것이 아니라 참조 관계를 관찰한다."
      payload: ["value", "hello", "reference"]
      outcomes:
        - status: info
          text: "현재 객체는 연산 전후에도 내용이 바뀌지 않는다."
    - title: "2. 새 내용 계산"
      from: 'value + " world"'
      to: '"hello world"'
      route_label: "문자열 결합 결과로 새로운 String 객체가 만들어진다."
      active_actors: [operation, fresh, old]
      description: "불변성 때문에 기존 hello 객체를 수정하는 대신 결과 객체를 생성한다."
      payload: ["concat", "new object", "hello world"]
      outcomes:
        - status: allow
          text: "기존 문자열 객체의 상태는 유지된다."
    - title: "3. 참조 재대입"
      from: "value"
      to: '"hello world"'
      route_label: "value가 새 결과 객체를 가리키도록 참조를 재대입한다."
      active_actors: [variable, fresh]
      description: "겉으로 값이 바뀐 것처럼 보이지만 실제로는 변수가 다른 객체를 참조하게 된 것이다."
      payload: ["assignment", "new reference", "old object remains"]
      outcomes:
        - status: info
          text: "String 불변성과 변수 재대입을 하나의 개념으로 혼동하지 않는다."

defensive_copy:
  eyebrow: "Interactive comparison"
  title: "컬렉션 참조 공유와 방어적 복사"
  summary: "생성자와 getter에서 같은 컬렉션 참조를 공유하면 외부 변경이 객체 내부 상태를 바꿀 수 있다."
  actors:
    - id: caller
      kind: "외부 코드"
      name: "Caller List"
      description: "객체 생성자에 전달하거나 getter 결과를 받는 컬렉션"
    - id: user
      kind: "도메인 객체"
      name: "User.roles"
      description: "사용자 내부 역할 목록"
    - id: shared
      kind: "공유 참조"
      name: "Same List Object"
      description: "외부와 내부가 함께 가리키는 가변 컬렉션"
    - id: copy
      kind: "경계 보호"
      name: "Defensive Copy"
      description: "복사·불변 뷰로 외부 변경을 차단하는 경계"
  steps:
    - title: "1. 같은 List 전달"
      from: "Caller List"
      to: "User.roles"
      route_label: "생성자가 전달받은 List를 그대로 roles 필드에 저장한다."
      active_actors: [caller, user, shared]
      description: "caller와 User가 같은 컬렉션 객체를 가리키면 한쪽 변경이 다른 쪽에 보인다."
      payload: ["constructor", "roles", "same reference"]
      outcomes:
        - status: warning
          text: "객체 생성 뒤에도 외부가 내부 상태를 바꿀 수 있다."
    - title: "2. 외부 변경 전파"
      from: "Caller List"
      to: "User.roles"
      route_label: "caller가 roles에 ADMIN을 추가하면 User 내부 목록에도 즉시 반영된다."
      active_actors: [caller, shared, user]
      description: "참조 공유는 메서드를 호출하지 않아도 상태가 바뀌는 경계를 만든다."
      payload: ["add ADMIN", "mutation", "unexpected state"]
      outcomes:
        - status: reject
          text: "불변 객체 설계의 캡슐화 경계가 무너진다."
    - title: "3. 방어적 복사"
      from: "Caller List"
      to: "Defensive Copy"
      route_label: "생성 시 복사하고 getter에서는 수정할 수 없는 값이나 복사본을 반환한다."
      active_actors: [caller, copy, user]
      description: "내부 컬렉션과 외부 컬렉션의 객체 identity를 분리한다."
      payload: ["List.copyOf", "copy", "unmodifiable view"]
      outcomes:
        - status: allow
          text: "외부 변경이 내부 상태로 전파되지 않는다."

identity_equality:
  eyebrow: "Interactive comparison"
  title: "참조 동일성과 논리적 동등성"
  summary: "==는 같은 객체를 가리키는지 보고 equals는 도메인 규칙상 같은 값인지 판단한다."
  actors:
    - id: a
      kind: "객체 A"
      name: "User A"
      description: "비슷한 상태를 가진 첫 번째 객체"
    - id: b
      kind: "객체 B"
      name: "User B"
      description: "별도로 생성됐지만 같은 ID를 가질 수 있는 객체"
    - id: identity
      kind: "참조 비교"
      name: "=="
      description: "두 참조가 같은 객체를 가리키는지 비교"
    - id: logical
      kind: "값 비교"
      name: "equals()"
      description: "개발자가 정의한 논리적 동등성 비교"
  steps:
    - title: "1. 객체 참조 준비"
      from: "User A"
      to: "User B"
      route_label: "내용이 비슷한 두 객체라도 별도로 new하면 참조는 다를 수 있다."
      active_actors: [a, b]
      description: "객체의 상태와 메모리 identity를 같은 질문으로 취급하지 않는다."
      payload: ["id = 1", "same name", "different object"]
      outcomes:
        - status: info
          text: "값이 같아 보여도 == 결과는 false일 수 있다."
    - title: "2. == 비교"
      from: "User A"
      to: "=="
      route_label: "두 변수의 참조가 같은 객체를 가리키는지 비교한다."
      active_actors: [a, b, identity]
      description: "==는 객체의 필드 값을 해석하지 않고 참조 동일성만 확인한다."
      payload: ["a == b", "reference", "identity"]
      outcomes:
        - status: reject
          text: "논리적 사용자 동일성을 표현하는 비교로는 부족할 수 있다."
    - title: "3. equals 비교"
      from: "User A"
      to: "equals()"
      route_label: "User가 정의한 equals 규칙에 따라 ID나 상태를 비교한다."
      active_actors: [a, b, logical]
      description: "도메인이 같은 사용자라고 보는 기준을 equals에 일관되게 구현해야 한다."
      payload: ["a.equals(b)", "business key", "logical equality"]
      outcomes:
        - status: allow
          text: "참조가 달라도 논리적 동등성을 true로 표현할 수 있다."

hashset_lookup:
  eyebrow: "Interactive flow"
  title: "HashSet 조회의 해시와 동등성"
  summary: "HashSet은 먼저 hashCode로 버킷을 좁히고 같은 버킷 후보에 equals를 적용한다."
  actors:
    - id: query
      kind: "조회 객체"
      name: "Target User"
      description: "contains 또는 add를 수행할 객체"
    - id: hash
      kind: "해시 단계"
      name: "hashCode()"
      description: "버킷 위치를 계산하는 단계"
    - id: bucket
      kind: "후보 버킷"
      name: "Bucket"
      description: "같은 위치에 모인 후보 객체들"
    - id: equals
      kind: "동등성 단계"
      name: "equals()"
      description: "최종 동일 여부를 판정하는 단계"
  steps:
    - title: "1. 해시 위치 계산"
      from: "Target User"
      to: "hashCode()"
      route_label: "조회 객체의 hashCode로 찾아갈 버킷 위치를 계산한다."
      active_actors: [query, hash]
      description: "해시는 빠른 후보 선택을 위한 1차 필터다."
      payload: ["hash", "index", "contains"]
      outcomes:
        - status: info
          text: "해시가 다르면 같은 버킷에서 비교할 필요가 줄어든다."
    - title: "2. 후보 확인"
      from: "hashCode()"
      to: "Bucket"
      route_label: "계산한 위치의 버킷에서 후보 객체를 읽는다."
      active_actors: [hash, bucket]
      description: "해시 충돌이 있으면 한 버킷에 여러 후보가 남을 수 있다."
      payload: ["bucket", "collision", "candidate list"]
      outcomes:
        - status: info
          text: "후보가 있다는 사실이 곧 논리적 동등성을 뜻하지 않는다."
    - title: "3. equals 최종 판정"
      from: "Bucket"
      to: "equals()"
      route_label: "후보마다 equals를 적용해 같은 사용자 여부를 최종 확인한다."
      active_actors: [bucket, equals, query]
      description: "hashCode와 equals 계약이 함께 맞아야 HashSet의 조회·중복 제거가 올바르게 동작한다."
      payload: ["equals", "match", "duplicate check"]
      outcomes:
        - status: allow
          text: "해시 탐색과 논리 비교는 서로 다른 단계다."

payment_contract:
  eyebrow: "Interactive flow"
  title: "PaymentService 인터페이스 계약"
  summary: "PaymentController는 구현체가 아니라 PaymentService 계약에 의존하고 구현체가 그 계약을 제공한다."
  actors:
    - id: controller
      kind: "호출부"
      name: "PaymentController"
      description: "결제 기능을 요청하는 웹 계층"
    - id: contract
      kind: "계약"
      name: "PaymentService"
      description: "pay() 같은 결제 기능의 인터페이스"
    - id: card
      kind: "구현체"
      name: "CardPaymentService"
      description: "카드 결제를 구현하는 클래스"
    - id: other
      kind: "대체 구현"
      name: "Other Payment Service"
      description: "계약을 구현하는 다른 결제 방식"
  steps:
    - title: "1. Controller 의존"
      from: "PaymentController"
      to: "PaymentService"
      route_label: "Controller가 구체 클래스가 아니라 PaymentService 계약을 주입받는다."
      active_actors: [controller, contract]
      description: "호출부는 결제 기능의 사용법만 알고 구현 세부 내용은 알지 않는다."
      payload: ["constructor injection", "pay()", "interface"]
      outcomes:
        - status: allow
          text: "구현체 변경이 Controller까지 퍼지는 것을 줄인다."
    - title: "2. 카드 구현"
      from: "PaymentService"
      to: "CardPaymentService"
      route_label: "CardPaymentService가 PaymentService의 계약을 구현한다."
      active_actors: [contract, card]
      description: "실제 객체의 pay() 구현은 런타임 다형성으로 선택된다."
      payload: ["implements", "pay()", "card gateway"]
      outcomes:
        - status: info
          text: "변수 타입과 실제 객체 타입은 다를 수 있다."
    - title: "3. 대체 구현 교체"
      from: "PaymentService"
      to: "Other Payment Service"
      route_label: "같은 계약을 구현한 다른 결제 서비스를 구성에서 선택할 수 있다."
      active_actors: [contract, other, controller]
      description: "호출부가 계약만 사용하면 구현체 교체 시 수정 범위가 좁아진다."
      payload: ["mock", "bank payment", "implementation swap"]
      outcomes:
        - status: allow
          text: "테스트 대역과 운영 구현을 같은 계약으로 연결할 수 있다."

interface_vs_abstract:
  eyebrow: "Interactive comparison"
  title: "인터페이스와 추상 클래스의 책임"
  summary: "인터페이스는 무엇을 제공하는지 계약하고 추상 클래스는 같은 계열 구현체의 상태와 공통 행동을 공유한다."
  actors:
    - id: contract
      kind: "계약"
      name: "Interface"
      description: "외부에 제공할 메서드와 역할"
    - id: abstract
      kind: "공통 기반"
      name: "Abstract Class"
      description: "공통 상태와 구현을 공유하는 부모 클래스"
    - id: implementation
      kind: "구현체"
      name: "Concrete Service"
      description: "계약을 구현하고 필요하면 공통 기반을 상속하는 클래스"
    - id: composition
      kind: "대안"
      name: "Composition"
      description: "상속 대신 필요한 객체를 내부에 두고 위임하는 구조"
  steps:
    - title: "1. 계약 표현"
      from: "Interface"
      to: "Concrete Service"
      route_label: "인터페이스가 외부에 제공할 기능의 이름과 계약을 정의한다."
      active_actors: [contract, implementation]
      description: "구현체가 달라도 호출부는 같은 계약을 사용할 수 있다."
      payload: ["what", "method contract", "polymorphism"]
      outcomes:
        - status: allow
          text: "역할과 구현을 분리한다."
    - title: "2. 공통 상태 공유"
      from: "Abstract Class"
      to: "Concrete Service"
      route_label: "추상 클래스가 같은 계열 서비스의 필드와 검증·공통 행동을 제공한다."
      active_actors: [abstract, implementation]
      description: "상속받은 구현체가 공통 상태와 알고리즘 일부를 재사용한다."
      payload: ["shared state", "template behavior", "IS-A"]
      outcomes:
        - status: info
          text: "단순 코드 중복만으로 상속 관계를 만들지는 않는다."
    - title: "3. 상속 관계 점검"
      from: "Concrete Service"
      to: "Composition"
      route_label: "IS-A가 자연스럽지 않으면 인터페이스나 Composition을 검토한다."
      active_actors: [implementation, composition]
      description: "재사용이 필요해도 부모의 상태·생성자 규칙까지 떠안는 비용을 비교한다."
      payload: ["IS-A", "delegation", "coupling"]
      outcomes:
        - status: warning
          text: "상속은 기능 재사용보다 의미 있는 관계가 먼저다."

combined_payment_design:
  eyebrow: "Interactive flow"
  title: "인터페이스와 추상 클래스를 함께 쓰는 결제 구조"
  summary: "외부에는 PaymentService 계약을 제공하고 내부에서는 BasePaymentService로 공통 상태와 행동을 공유한다."
  actors:
    - id: controller
      kind: "호출부"
      name: "PaymentController"
      description: "결제 계약만 사용하는 웹 계층"
    - id: contract
      kind: "외부 계약"
      name: "PaymentService"
      description: "결제 기능을 노출하는 인터페이스"
    - id: base
      kind: "공통 기반"
      name: "BasePaymentService"
      description: "공통 검증·상태·행동을 가진 추상 클래스"
    - id: card
      kind: "구현체"
      name: "CardPaymentService"
      description: "카드 결제만의 세부 처리를 구현하는 클래스"
  steps:
    - title: "1. Controller 계약 사용"
      from: "PaymentController"
      to: "PaymentService"
      route_label: "Controller는 PaymentService만 알고 결제 구현체의 계층은 모른다."
      active_actors: [controller, contract]
      description: "호출부에 외부 기능의 계약만 노출한다."
      payload: ["PaymentService", "pay()", "dependency injection"]
      outcomes:
        - status: allow
          text: "구현체 교체가 호출부에 영향을 덜 준다."
    - title: "2. 공통 기반 상속"
      from: "PaymentService"
      to: "BasePaymentService"
      route_label: "공통 결제 검증과 상태는 BasePaymentService에 모은다."
      active_actors: [contract, base]
      description: "인터페이스 계약과 내부 재사용 기반은 서로 다른 책임으로 함께 존재할 수 있다."
      payload: ["validation", "shared state", "abstract"]
      outcomes:
        - status: info
          text: "외부 API와 내부 구현 재사용을 한 계층으로 합치지 않는다."
    - title: "3. 카드 세부 구현"
      from: "BasePaymentService"
      to: "CardPaymentService"
      route_label: "CardPaymentService가 공통 흐름을 재사용하고 카드 결제 단계만 구현한다."
      active_actors: [base, card]
      description: "공통 로직은 부모에 두되 구체 결제 방식의 변화를 자식이 담당한다."
      payload: ["extends", "card gateway", "override"]
      outcomes:
        - status: allow
          text: "계약·공통 기반·세부 구현의 책임이 분리된다."
    - title: "4. 런타임 연결"
      from: "CardPaymentService"
      to: "PaymentController"
      route_label: "컨테이너가 CardPaymentService를 PaymentService 타입으로 주입한다."
      active_actors: [card, contract, controller]
      description: "호출부는 실제 연결된 구현체를 몰라도 계약에 따라 결제를 호출한다."
      payload: ["bean wiring", "polymorphism", "runtime implementation"]
      outcomes:
        - status: info
          text: "인터페이스와 추상 클래스는 경쟁 도구가 아니라 다른 책임을 맡는다."

session_local_failure:
  eyebrow: "Interactive flow"
  title: "다중 서버의 로컬 세션 문제"
  summary: "서버별 메모리에 세션을 저장하면 다음 요청이 다른 서버로 갔을 때 로그인 상태를 찾지 못할 수 있다."
  actors:
    - id: client
      kind: "클라이언트"
      name: "Browser"
      description: "세션 ID 쿠키를 보내는 브라우저"
    - id: lb
      kind: "분산 장치"
      name: "Load Balancer"
      description: "요청을 여러 EC2 인스턴스로 분산하는 장치"
    - id: a
      kind: "서버 A"
      name: "EC2-A Session"
      description: "A의 로컬 메모리에만 저장된 세션"
    - id: b
      kind: "서버 B"
      name: "EC2-B Session"
      description: "A의 세션을 모르는 다른 서버"
  steps:
    - title: "1. 로그인 처리"
      from: "Browser"
      to: "EC2-A Session"
      route_label: "첫 로그인 요청이 EC2-A로 가고 세션이 A의 로컬 메모리에 저장된다."
      active_actors: [client, a, lb]
      description: "브라우저는 세션 ID를 받지만 세션 데이터는 A 프로세스 안에만 있다."
      payload: ["login", "session id", "local memory"]
      outcomes:
        - status: allow
          text: "같은 서버로 계속 가면 로컬 세션이 동작한다."
    - title: "2. 다음 요청 분산"
      from: "Browser"
      to: "EC2-B Session"
      route_label: "다음 요청이 로드 밸런서를 통해 EC2-B로 전달된다."
      active_actors: [client, lb, b]
      description: "B의 로컬 메모리에는 A가 만든 세션 데이터가 없다."
      payload: ["session cookie", "request", "different instance"]
      outcomes:
        - status: warning
          text: "서버가 로그인 상태를 찾지 못해 인증 실패처럼 보일 수 있다."
    - title: "3. 공유 상태로 이동"
      from: "EC2-A Session"
      to: "EC2-B Session"
      route_label: "세션을 공용 저장소에 두거나 요청 고정 전략을 선택한다."
      active_actors: [a, b, lb]
      description: "여러 서버가 같은 인증 상태를 보려면 상태 위치와 라우팅 정책을 함께 설계해야 한다."
      payload: ["shared store", "sticky session", "scaling"]
      outcomes:
        - status: info
          text: "서버 수를 늘리는 것과 세션 상태를 공유하는 것은 별도 문제다."

redis_session_sharing:
  eyebrow: "Interactive flow"
  title: "Redis 공유 세션 저장소"
  summary: "여러 애플리케이션 서버가 같은 Redis 세션 저장소를 참조하면 요청이 어느 서버로 가도 상태를 조회할 수 있다."
  actors:
    - id: client
      kind: "클라이언트"
      name: "Browser"
      description: "세션 ID 쿠키를 전송하는 브라우저"
    - id: servers
      kind: "애플리케이션 계층"
      name: "EC2-A · B · C"
      description: "요청을 나누어 처리하는 여러 서버"
    - id: redis
      kind: "공유 저장소"
      name: "Redis Session Store"
      description: "서버들이 함께 읽고 쓰는 세션 데이터 저장소"
    - id: response
      kind: "인증 결과"
      name: "Authenticated Request"
      description: "세션 조회 후 처리되는 요청"
  steps:
    - title: "1. 요청 분산"
      from: "Browser"
      to: "EC2-A · B · C"
      route_label: "로드 밸런서가 브라우저 요청을 여러 애플리케이션 서버에 전달한다."
      active_actors: [client, servers]
      description: "특정 서버의 로컬 메모리에 의존하지 않는 구조를 준비한다."
      payload: ["session cookie", "load balancing", "request"]
      outcomes:
        - status: info
          text: "같은 사용자의 요청이 매번 다른 서버에 도착할 수 있다."
    - title: "2. 공용 세션 조회"
      from: "EC2-A · B · C"
      to: "Redis Session Store"
      route_label: "어느 서버든 쿠키의 세션 ID로 Redis에서 인증 상태를 조회한다."
      active_actors: [servers, redis, client]
      description: "세션 상태의 기준이 특정 JVM이 아니라 공용 저장소로 이동한다."
      payload: ["session id", "GET session", "shared state"]
      outcomes:
        - status: allow
          text: "서버가 달라도 같은 세션 데이터를 확인할 수 있다."
    - title: "3. 요청 처리"
      from: "Redis Session Store"
      to: "Authenticated Request"
      route_label: "조회한 사용자 상태로 권한을 확인하고 요청을 처리한다."
      active_actors: [redis, servers, response]
      description: "공유 저장소도 네트워크 지연·장애·만료 정책을 함께 운영해야 한다."
      payload: ["user context", "TTL", "response"]
      outcomes:
        - status: info
          text: "세션 공유가 인증·인가 정책 전체를 자동으로 해결하는 것은 아니다."

basic_vs_session:
  eyebrow: "Interactive comparison"
  title: "Basic Auth와 세션 인증의 요청 흐름"
  summary: "Basic Auth는 매 요청 자격 증명을 보내고 세션 인증은 로그인 후 세션 ID로 서버 상태를 조회한다."
  actors:
    - id: client
      kind: "클라이언트"
      name: "Browser"
      description: "인증 요청을 보내는 브라우저"
    - id: basic
      kind: "무상태 인증"
      name: "Basic Auth"
      description: "매 요청 Authorization 헤더에 자격 증명을 담는 방식"
    - id: session
      kind: "상태 기반 인증"
      name: "Session Auth"
      description: "로그인 후 세션 ID 쿠키를 보내는 방식"
    - id: store
      kind: "서버 상태"
      name: "Session Store"
      description: "세션 ID와 사용자 상태를 저장하는 서버 측 저장소"
  steps:
    - title: "1. Basic 자격 증명"
      from: "Browser"
      to: "Basic Auth"
      route_label: "브라우저가 매 요청에 아이디와 비밀번호를 Authorization 헤더로 보낸다."
      active_actors: [client, basic]
      description: "서버가 세션 상태를 저장하지 않아도 요청마다 자격 증명을 검증할 수 있다."
      payload: ["Authorization", "username", "password"]
      outcomes:
        - status: warning
          text: "전송 보호와 자격 증명 노출 범위를 별도로 관리해야 한다."
    - title: "2. 세션 로그인"
      from: "Browser"
      to: "Session Auth"
      route_label: "최초 로그인 후 서버가 세션을 만들고 세션 ID 쿠키를 발급한다."
      active_actors: [client, session, store]
      description: "이후 요청은 비밀번호 대신 세션 ID를 전송한다."
      payload: ["login once", "Set-Cookie", "session id"]
      outcomes:
        - status: allow
          text: "서버가 인증 상태를 세션 저장소에서 관리한다."
    - title: "3. 세션 조회"
      from: "Session Auth"
      to: "Session Store"
      route_label: "서버가 쿠키의 세션 ID로 사용자 상태를 조회하고 요청을 처리한다."
      active_actors: [session, store, client]
      description: "세션 방식은 서버 상태를 관리하므로 여러 서버 배치에서 저장소 전략이 중요해진다."
      payload: ["Cookie", "lookup", "user state"]
      outcomes:
        - status: info
          text: "두 방식은 인증 상태를 어디에 둘지의 선택 문제다."

shared_session_store:
  eyebrow: "Interactive flow"
  title: "로드 밸런서와 공용 Redis 세션"
  summary: "여러 애플리케이션 서버가 로컬 세션 대신 공용 Redis를 참조해 같은 로그인 상태를 공유한다."
  actors:
    - id: lb
      kind: "분산"
      name: "Load Balancer"
      description: "들어온 요청을 서버 중 하나로 전달"
    - id: apps
      kind: "서버 묶음"
      name: "Application Servers"
      description: "서로 다른 인스턴스로 실행되는 서버들"
    - id: redis
      kind: "상태 저장소"
      name: "Shared Redis"
      description: "세션을 중앙에서 관리하는 저장소"
    - id: user
      kind: "사용자 상태"
      name: "Authenticated User"
      description: "세션 조회로 복원되는 사용자 정보"
  steps:
    - title: "1. 요청 분배"
      from: "Load Balancer"
      to: "Application Servers"
      route_label: "로드 밸런서가 요청을 서버 A·B·C 중 하나로 보낸다."
      active_actors: [lb, apps]
      description: "서버 선택이 바뀌어도 인증 상태를 잃지 않는 것이 목표다."
      payload: ["request", "server A/B/C", "distribution"]
      outcomes:
        - status: info
          text: "스티키 세션 없이도 공용 상태를 사용할 수 있다."
    - title: "2. Redis 조회"
      from: "Application Servers"
      to: "Shared Redis"
      route_label: "선택된 서버가 세션 ID로 공용 Redis를 조회한다."
      active_actors: [apps, redis]
      description: "인증 상태를 특정 서버의 로컬 메모리에서 분리한다."
      payload: ["session id", "GET", "TTL"]
      outcomes:
        - status: allow
          text: "어느 서버가 처리해도 같은 세션 데이터에 접근한다."
    - title: "3. 사용자 복원"
      from: "Shared Redis"
      to: "Authenticated User"
      route_label: "Redis 결과로 현재 요청의 사용자·권한 정보를 복원한다."
      active_actors: [redis, user, apps]
      description: "저장소 장애나 만료 시 인증 실패 처리를 별도로 정의해야 한다."
      payload: ["principal", "roles", "request context"]
      outcomes:
        - status: info
          text: "세션 저장소는 확장성과 함께 가용성 설계 대상이 된다."

deployment_runtime:
  eyebrow: "Interactive flow"
  title: "배포 성공과 런타임 실패의 경계"
  summary: "CI/CD가 서버에 아티팩트를 배포하는 데 성공해도 애플리케이션 시작·설정·의존성 단계에서 실패할 수 있다."
  actors:
    - id: pipeline
      kind: "배포 자동화"
      name: "GitHub Actions"
      description: "빌드와 배포 작업을 실행하는 파이프라인"
    - id: artifact
      kind: "배포 결과"
      name: "Artifact on Server"
      description: "서버에 업로드된 JAR 또는 이미지"
    - id: runtime
      kind: "실행 단계"
      name: "Application Runtime"
      description: "프로세스 시작과 의존성 로딩 단계"
    - id: health
      kind: "서비스 상태"
      name: "Health Check"
      description: "실제 요청 가능 여부를 확인하는 검증"
  steps:
    - title: "1. 빌드 성공"
      from: "GitHub Actions"
      to: "Artifact on Server"
      route_label: "파이프라인이 코드를 빌드하고 아티팩트를 서버에 배포한다."
      active_actors: [pipeline, artifact]
      description: "배포 작업의 성공은 파일 전달과 명령 실행 성공을 의미할 수 있다."
      payload: ["build", "upload", "deploy"]
      outcomes:
        - status: info
          text: "배포 성공 배지가 애플리케이션 정상 동작을 보장하지는 않는다."
    - title: "2. 런타임 시작"
      from: "Artifact on Server"
      to: "Application Runtime"
      route_label: "서버가 JAR·컨테이너를 실행하고 환경 설정과 의존성을 로드한다."
      active_actors: [artifact, runtime]
      description: "잘못된 설정, 포트, 권한, DB 연결은 배포 이후 시작 단계에서 드러날 수 있다."
      payload: ["start", "environment", "dependency"]
      outcomes:
        - status: warning
          text: "프로세스가 즉시 종료되거나 시작은 되어도 기능이 실패할 수 있다."
    - title: "3. 실제 상태 확인"
      from: "Application Runtime"
      to: "Health Check"
      route_label: "로그·헬스 체크·실제 요청으로 서비스가 정상 응답하는지 확인한다."
      active_actors: [runtime, health]
      description: "배포 결과와 운영 중인 애플리케이션 상태를 별도 단계로 검증한다."
      payload: ["startup log", "health endpoint", "smoke test"]
      outcomes:
        - status: allow
          text: "배포 성공과 서비스 준비 완료를 구분해서 기록한다."

code_config_mismatch:
  eyebrow: "Interactive comparison"
  title: "애플리케이션 코드와 Parameter Store 설정"
  summary: "코드가 기대하는 키·타입·환경과 실제 Parameter Store 값이 맞지 않으면 런타임에서 실패한다."
  actors:
    - id: code
      kind: "기대 계약"
      name: "Application Code"
      description: "환경 변수와 설정 키를 읽는 코드"
    - id: parameter
      kind: "외부 설정"
      name: "Parameter Store"
      description: "배포 환경별 값을 제공하는 설정 저장소"
    - id: binding
      kind: "바인딩"
      name: "Config Binding"
      description: "문자열 설정을 애플리케이션 타입으로 연결하는 과정"
    - id: runtime
      kind: "실행 결과"
      name: "Runtime"
      description: "정상 시작 또는 설정 오류로 실패하는 애플리케이션"
  steps:
    - title: "1. 코드 키 정의"
      from: "Application Code"
      to: "Config Binding"
      route_label: "코드가 필요한 키 이름과 타입, 필수 여부를 정의한다."
      active_actors: [code, binding]
      description: "코드가 기대하는 설정 계약을 배포 환경과 맞춰야 한다."
      payload: ["key", "type", "required"]
      outcomes:
        - status: info
          text: "환경별 값이 있어도 키 이름이 다르면 연결되지 않는다."
    - title: "2. 외부 값 조회"
      from: "Parameter Store"
      to: "Config Binding"
      route_label: "런타임이 Parameter Store에서 실제 환경의 값을 가져온다."
      active_actors: [parameter, binding]
      description: "권한·리전·경로와 값의 형식을 함께 확인해야 한다."
      payload: ["parameter path", "IAM", "environment value"]
      outcomes:
        - status: warning
          text: "설정 조회 권한이나 경로가 틀리면 코드까지 값이 도달하지 않는다."
    - title: "3. 일치 여부 확인"
      from: "Config Binding"
      to: "Application Code"
      route_label: "키·타입·필수값이 일치하면 애플리케이션 설정으로 바인딩한다."
      active_actors: [binding, code, parameter]
      description: "코드와 외부 설정의 계약이 어긋나면 시작 오류나 기능 오류가 발생한다."
      payload: ["name match", "type conversion", "value"]
      outcomes:
        - status: reject
          text: "배포 성공과 설정 계약 성공은 별도로 검증해야 한다."

cloudwatch_alarm:
  eyebrow: "Interactive flow"
  title: "CloudWatch 알람 원인 추적"
  summary: "알람 발생 시 지표·로그·배포 이력을 같은 시간 범위에 놓고 원인 후보를 좁힌다."
  actors:
    - id: alarm
      kind: "신호"
      name: "CloudWatch Alarm"
      description: "임계치를 넘은 메트릭 알람"
    - id: metric
      kind: "수치"
      name: "Metrics"
      description: "CPU·지연·오류율 같은 시간 series"
    - id: logs
      kind: "상세 사실"
      name: "Application Logs"
      description: "요청·예외·배포 이후의 상세 기록"
    - id: cause
      kind: "원인 후보"
      name: "Root Cause"
      description: "상관관계를 검증해 좁힌 원인"
  steps:
    - title: "1. 알람 발생"
      from: "Metrics"
      to: "CloudWatch Alarm"
      route_label: "메트릭이 설정한 임계치를 넘어 알람이 발생한다."
      active_actors: [metric, alarm]
      description: "알람은 이상 신호이지 원인을 직접 알려주는 진단 결과는 아니다."
      payload: ["threshold", "period", "breach"]
      outcomes:
        - status: warning
          text: "알람 메시지 하나만으로 원인을 단정하지 않는다."
    - title: "2. 시간 범위 맞추기"
      from: "CloudWatch Alarm"
      to: "Application Logs"
      route_label: "같은 시작·종료 시각의 로그에서 오류와 요청 변화를 확인한다."
      active_actors: [alarm, logs, metric]
      description: "메트릭 그래프와 로그의 시간축을 맞춰 실제 사건의 순서를 확인한다."
      payload: ["time window", "error log", "request id"]
      outcomes:
        - status: info
          text: "지연이 늘어난 시간과 오류가 기록된 시간이 다를 수 있다."
    - title: "3. 배포·외부 변화 대조"
      from: "Application Logs"
      to: "Root Cause"
      route_label: "배포 이력·설정 변경·외부 의존성 상태와 로그를 대조해 원인을 좁힌다."
      active_actors: [logs, cause, alarm]
      description: "상관관계를 원인으로 확정하기 전에 재현·추가 지표·롤백 결과를 확인한다."
      payload: ["deploy history", "config change", "dependency"]
      outcomes:
        - status: allow
          text: "알람은 조사 시작점이고 원인은 여러 증거를 연결해 확정한다."

metric_log_deploy:
  eyebrow: "Interactive comparison"
  title: "Metric·로그·배포 이력의 상관관계"
  summary: "수치 변화와 상세 로그, 변경 이력을 같은 타임라인에 겹쳐 원인 후보를 검증한다."
  actors:
    - id: metric
      kind: "수치"
      name: "Metric Timeline"
      description: "지연·오류율·처리량의 변화"
    - id: logs
      kind: "상세 기록"
      name: "Log Timeline"
      description: "예외·경고·요청의 시간순 기록"
    - id: deploy
      kind: "변경 이력"
      name: "Deploy Timeline"
      description: "배포와 설정 변경 시각"
    - id: hypothesis
      kind: "검증"
      name: "Incident Hypothesis"
      description: "세 신호를 대조해 만든 원인 가설"
  steps:
    - title: "1. 수치 이상 포착"
      from: "Metric Timeline"
      to: "Incident Hypothesis"
      route_label: "오류율이나 지연 시간이 변한 시점을 표시한다."
      active_actors: [metric, hypothesis]
      description: "메트릭은 언제 이상이 시작됐는지 알려주지만 무엇이 바뀌었는지는 말하지 않는다."
      payload: ["latency", "error rate", "timestamp"]
      outcomes:
        - status: info
          text: "변화 시작 시각을 조사 기준점으로 삼는다."
    - title: "2. 로그 대조"
      from: "Log Timeline"
      to: "Incident Hypothesis"
      route_label: "같은 시간대에 예외·경고·요청 패턴이 나타났는지 확인한다."
      active_actors: [logs, hypothesis]
      description: "로그의 상세 사실이 수치 변화와 같은 사건을 가리키는지 검증한다."
      payload: ["exception", "request path", "correlation id"]
      outcomes:
        - status: info
          text: "관련 없는 로그를 원인으로 연결하지 않도록 시간과 요청을 함께 본다."
    - title: "3. 배포 이력 대조"
      from: "Deploy Timeline"
      to: "Incident Hypothesis"
      route_label: "이상 시작 직전에 배포·설정 변경이 있었는지 확인한다."
      active_actors: [deploy, hypothesis, metric]
      description: "변경 시각과 증상 시각이 맞더라도 재현과 롤백으로 인과관계를 확인한다."
      payload: ["release", "config", "rollback"]
      outcomes:
        - status: allow
          text: "세 자료는 서로 대체하지 않고 함께 원인을 좁히는 증거가 된다."

good_bad_alarm:
  eyebrow: "Interactive comparison"
  title: "좋은 알람과 나쁜 알람"
  summary: "행동 가능한 조건과 명확한 책임이 있는 알람은 대응을 돕고 노이즈성 알람은 피로를 만든다."
  actors:
    - id: signal
      kind: "관측 신호"
      name: "Metric Signal"
      description: "서비스 상태를 나타내는 측정값"
    - id: good
      kind: "좋은 알람"
      name: "Actionable Alert"
      description: "임계치·지속 시간·담당자가 명확한 알람"
    - id: bad
      kind: "나쁜 알람"
      name: "Noisy Alert"
      description: "원인과 행동이 불명확한 반복 알람"
    - id: action
      kind: "대응"
      name: "Runbook Action"
      description: "알람 수신자가 수행할 조치"
  steps:
    - title: "1. 신호 정의"
      from: "Metric Signal"
      to: "Actionable Alert"
      route_label: "사용자 영향이나 운영 위험과 연결된 메트릭을 선택한다."
      active_actors: [signal, good]
      description: "단순히 숫자가 변했다는 이유보다 실제 대응 필요성을 기준으로 한다."
      payload: ["SLO", "error rate", "duration"]
      outcomes:
        - status: allow
          text: "측정값이 어떤 장애 위험을 의미하는지 설명할 수 있다."
    - title: "2. 행동 가능한 조건"
      from: "Actionable Alert"
      to: "Runbook Action"
      route_label: "지속 시간과 심각도를 정하고 알람 발생 시 실행할 대응을 연결한다."
      active_actors: [good, action]
      description: "좋은 알람은 수신자가 무엇을 확인하고 누구에게 알릴지 알 수 있다."
      payload: ["threshold", "for 5m", "runbook"]
      outcomes:
        - status: allow
          text: "알람이 실제 운영 행동으로 이어진다."
    - title: "3. 노이즈 제거"
      from: "Metric Signal"
      to: "Noisy Alert"
      route_label: "일시적 변화나 의미 없는 조건을 매번 알람으로 만들면 노이즈가 쌓인다."
      active_actors: [signal, bad, action]
      description: "반복되는 오탐은 중요한 알람의 신뢰도와 대응 속도를 떨어뜨린다."
      payload: ["flapping", "no owner", "false positive"]
      outcomes:
        - status: warning
          text: "알람 개수보다 행동 가능성과 신뢰도가 중요하다."

merge_commit_squash:
  eyebrow: "Interactive comparison"
  title: "Merge Commit과 Squash Merge"
  summary: "Merge는 브랜치의 여러 커밋을 그래프에 보존하고 Squash는 변경을 하나의 대표 커밋으로 묶어 반영한다."
  actors:
    - id: feature
      kind: "작업 브랜치"
      name: "Feature Commits"
      description: "기능 브랜치에 쌓인 여러 작업 커밋"
    - id: merge
      kind: "병합 방식"
      name: "Merge Commit"
      description: "두 부모를 가진 병합 커밋을 만드는 방식"
    - id: squash
      kind: "병합 방식"
      name: "Squash Merge"
      description: "여러 변경을 하나의 새 커밋으로 합치는 방식"
    - id: main
      kind: "기준 브랜치"
      name: "main"
      description: "최종 통합 커밋을 받는 브랜치"
  steps:
    - title: "1. 기능 커밋 축적"
      from: "Feature Commits"
      to: "main"
      route_label: "기능 브랜치에 여러 작업 커밋이 쌓이고 통합 시점을 기다린다."
      active_actors: [feature, main]
      description: "커밋 그래프의 세부 작업 기록을 어느 정도까지 보존할지 결정한다."
      payload: ["commit A", "commit B", "PR"]
      outcomes:
        - status: info
          text: "브랜치의 작업 기록과 최종 통합 기록은 서로 다른 관심사다."
    - title: "2. Merge Commit"
      from: "Feature Commits"
      to: "Merge Commit"
      route_label: "기능 브랜치의 커밋 흐름을 보존하고 main에 병합 커밋을 추가한다."
      active_actors: [feature, merge, main]
      description: "두 부모를 가진 커밋으로 브랜치가 언제 합쳐졌는지 그래프에 남는다."
      payload: ["two parents", "history preserved", "merge"]
      outcomes:
        - status: info
          text: "상세한 브랜치 그래프가 필요할 때 유용하다."
    - title: "3. Squash Merge"
      from: "Feature Commits"
      to: "Squash Merge"
      route_label: "여러 기능 커밋의 변경을 하나의 대표 커밋으로 만들어 main에 반영한다."
      active_actors: [feature, squash, main]
      description: "main의 히스토리는 단순해지지만 원래 커밋 단위는 대표 커밋 안으로 접힌다."
      payload: ["squash", "one commit", "linear history"]
      outcomes:
        - status: allow
          text: "최종 이력의 읽기 쉬움과 원본 작업 기록 보존을 기준으로 선택한다."

final_merge_strategy:
  eyebrow: "Interactive flow"
  title: "프로젝트의 최종 머지 전략"
  summary: "작업 브랜치의 리뷰와 검증을 거친 뒤 프로젝트가 정한 병합 방식으로 기준 브랜치에 반영한다."
  actors:
    - id: branch
      kind: "작업 단위"
      name: "Feature Branch"
      description: "작은 변경을 담은 작업 브랜치"
    - id: review
      kind: "검증"
      name: "Review + CI"
      description: "코드 리뷰와 자동 테스트·빌드"
    - id: strategy
      kind: "정책"
      name: "Merge Policy"
      description: "Merge, Squash, Rebase 중 프로젝트가 선택한 방식"
    - id: main
      kind: "통합 결과"
      name: "Main Branch"
      description: "배포 가능한 기준 브랜치"
  steps:
    - title: "1. 작업 브랜치 생성"
      from: "Main Branch"
      to: "Feature Branch"
      route_label: "기준 브랜치에서 목적이 분명한 작업 브랜치를 만든다."
      active_actors: [main, branch]
      description: "작업을 분리하면 리뷰 대상과 변경 범위를 명확하게 만들 수 있다."
      payload: ["branch", "small change", "isolated work"]
      outcomes:
        - status: info
          text: "작업 브랜치는 통합 전 변경을 격리하는 경계다."
    - title: "2. 리뷰와 CI"
      from: "Feature Branch"
      to: "Review + CI"
      route_label: "Pull Request에서 리뷰와 테스트·빌드 검증을 수행한다."
      active_actors: [branch, review]
      description: "병합 방식보다 먼저 변경 내용과 자동 검증이 통과해야 한다."
      payload: ["pull request", "review", "tests"]
      outcomes:
        - status: allow
          text: "검증 가능한 상태가 병합의 전제다."
    - title: "3. 정책에 따른 통합"
      from: "Review + CI"
      to: "Merge Policy"
      route_label: "프로젝트가 정한 이력 정책에 따라 Merge 또는 Squash로 통합한다."
      active_actors: [review, strategy, main]
      description: "팀의 릴리스·감사·히스토리 요구에 맞는 하나의 일관된 전략을 사용한다."
      payload: ["merge", "squash", "rebase policy"]
      outcomes:
        - status: allow
          text: "통합 이력이 프로젝트의 읽기·복구·배포 흐름과 맞는다."

tdd_edd:
  eyebrow: "Interactive comparison"
  title: "TDD와 EDD 개발 사이클"
  summary: "TDD는 코드 동작의 테스트를 먼저 만들고 EDD는 배포 후 평가와 운영 피드백까지 개발 사이클에 포함한다."
  actors:
    - id: intent
      kind: "기대 결과"
      name: "Expected Behavior"
      description: "코드가 만족해야 할 동작과 품질 기준"
    - id: test
      kind: "빠른 검증"
      name: "TDD Test"
      description: "구현 전 작성하는 자동 테스트"
    - id: deploy
      kind: "운영 반영"
      name: "Deploy"
      description: "검증된 기능을 실제 환경에 배포하는 단계"
    - id: eval
      kind: "운영 평가"
      name: "EDD Evaluation"
      description: "실제 결과를 측정하고 다음 개선으로 연결하는 평가"
  steps:
    - title: "1. 기대 행동 정의"
      from: "Expected Behavior"
      to: "TDD Test"
      route_label: "구현 전에 성공·실패 조건을 테스트로 표현한다."
      active_actors: [intent, test]
      description: "TDD는 코드를 먼저 쓰는 대신 검증 가능한 행동을 먼저 고정한다."
      payload: ["red", "expected result", "test"]
      outcomes:
        - status: info
          text: "테스트가 구현 방향과 회귀 기준을 제공한다."
    - title: "2. 구현과 통과"
      from: "TDD Test"
      to: "Deploy"
      route_label: "실패하는 테스트를 통과시키고 리팩터링한 뒤 배포 가능한 상태를 만든다."
      active_actors: [test, deploy]
      description: "TDD의 빠른 피드백 루프는 코드 수준 품질을 다룬다."
      payload: ["green", "refactor", "CI"]
      outcomes:
        - status: allow
          text: "자동 테스트가 배포 전 회귀를 줄인다."
    - title: "3. 운영 결과 평가"
      from: "Deploy"
      to: "EDD Evaluation"
      route_label: "실제 사용 결과와 품질 지표를 측정해 다음 개발 입력으로 삼는다."
      active_actors: [deploy, eval, intent]
      description: "EDD는 배포 성공만으로 끝내지 않고 실제 결과가 기대와 맞는지 확인한다."
      payload: ["production", "metric", "feedback"]
      outcomes:
        - status: info
          text: "테스트 통과와 제품 가치 달성은 서로 다른 평가다."

rag_agent_eval:
  eyebrow: "Interactive comparison"
  title: "RAG와 AI Agent의 단계별 평가"
  summary: "검색 품질과 생성 품질, 도구 사용과 최종 업무 결과를 단계별로 따로 평가한다."
  actors:
    - id: query
      kind: "입력"
      name: "User Query"
      description: "사용자가 해결하려는 질문이나 작업"
    - id: retrieval
      kind: "검색"
      name: "RAG Retrieval"
      description: "관련 문서와 근거를 찾는 단계"
    - id: generation
      kind: "응답 생성"
      name: "Generation"
      description: "검색 결과를 이용해 답변을 작성하는 단계"
    - id: agent
      kind: "행동 실행"
      name: "Agent Tools"
      description: "도구 호출과 작업 계획을 수행하는 단계"
  steps:
    - title: "1. 질문 해석"
      from: "User Query"
      to: "RAG Retrieval"
      route_label: "질문을 검색 쿼리로 바꾸고 관련 문서를 찾는다."
      active_actors: [query, retrieval]
      description: "검색 평가에서는 관련성·재현율·근거 포함 여부를 확인한다."
      payload: ["query", "embedding", "top-k"]
      outcomes:
        - status: info
          text: "검색 결과가 좋지 않으면 생성 모델만 바꿔도 근거 문제는 남는다."
    - title: "2. 근거 기반 생성"
      from: "RAG Retrieval"
      to: "Generation"
      route_label: "검색한 문서의 근거를 바탕으로 답변을 생성한다."
      active_actors: [retrieval, generation]
      description: "생성 평가는 정확성·충실성·인용과 검색 근거의 일치 여부를 본다."
      payload: ["context", "answer", "citation"]
      outcomes:
        - status: allow
          text: "검색 품질과 답변 품질을 분리해 진단할 수 있다."
    - title: "3. Agent 실행 평가"
      from: "User Query"
      to: "Agent Tools"
      route_label: "행동이 필요한 질문은 계획·도구 호출·최종 결과를 단계별로 평가한다."
      active_actors: [query, agent, generation]
      description: "Agent는 답변 텍스트뿐 아니라 올바른 도구 선택과 작업 완료 여부도 평가 대상이다."
      payload: ["plan", "tool call", "task success"]
      outcomes:
        - status: info
          text: "최종 응답 점수 하나만으로 전체 Agent 품질을 설명하지 않는다."

edd_feedback:
  eyebrow: "Interactive flow"
  title: "EDD 운영 피드백 루프"
  summary: "배포 후 실제 사용 데이터를 평가하고 개선 항목을 다시 요구사항과 테스트로 연결한다."
  actors:
    - id: release
      kind: "변경 반영"
      name: "Release"
      description: "검증된 기능을 운영 환경에 배포한 결과"
    - id: observe
      kind: "관측"
      name: "Production Signals"
      description: "사용자 행동·오류·품질·비용 지표"
    - id: evaluate
      kind: "판단"
      name: "Evaluation"
      description: "기대 결과와 실제 결과를 비교하는 과정"
    - id: backlog
      kind: "다음 작업"
      name: "Improvement Backlog"
      description: "검증된 개선 요구사항과 우선순위"
  steps:
    - title: "1. 운영 배포"
      from: "Release"
      to: "Production Signals"
      route_label: "기능을 실제 사용자와 트래픽이 있는 환경에 배포한다."
      active_actors: [release, observe]
      description: "배포 자체의 성공과 사용 중 품질은 별도의 관측 대상이다."
      payload: ["release", "traffic", "users"]
      outcomes:
        - status: info
          text: "운영 결과를 수집할 준비가 되어 있어야 한다."
    - title: "2. 기대와 실제 비교"
      from: "Production Signals"
      to: "Evaluation"
      route_label: "실제 지표와 사전에 정한 성공 기준을 비교한다."
      active_actors: [observe, evaluate]
      description: "EDD는 느낌이 아니라 측정 가능한 결과로 다음 의사결정을 만든다."
      payload: ["quality", "latency", "cost", "success rate"]
      outcomes:
        - status: allow
          text: "검증 결과가 개선의 근거가 된다."
    - title: "3. 다음 개선으로 환류"
      from: "Evaluation"
      to: "Improvement Backlog"
      route_label: "평가에서 확인한 문제와 기회를 다음 요구사항·테스트로 등록한다."
      active_actors: [evaluate, backlog, release]
      description: "운영 결과가 다음 개발 사이클의 입력으로 다시 들어간다."
      payload: ["feedback", "priority", "next experiment"]
      outcomes:
        - status: info
          text: "배포를 사이클의 끝이 아니라 학습의 시작으로 본다."

context_switching:
  eyebrow: "Interactive flow"
  title: "Thread Context Switching"
  summary: "CPU가 Thread A의 레지스터 상태를 저장하고 Thread B의 상태를 복원한 뒤 실행을 이어 간다."
  actors:
    - id: scheduler
      kind: "스케줄러"
      name: "Scheduler"
      description: "다음에 실행할 Runnable Thread를 선택하는 OS 구성요소"
    - id: a
      kind: "현재 실행"
      name: "Thread A"
      description: "CPU를 사용하던 Thread"
    - id: b
      kind: "다음 실행"
      name: "Thread B"
      description: "CPU를 이어받을 Thread"
    - id: context
      kind: "상태 저장"
      name: "Thread Context"
      description: "레지스터·PC 등 실행 재개에 필요한 상태"
  steps:
    - title: "1. A 실행"
      from: "Scheduler"
      to: "Thread A"
      route_label: "스케줄러가 A를 선택하고 CPU가 A의 명령을 실행한다."
      active_actors: [scheduler, a]
      description: "현재 실행 중인 Thread의 CPU 상태가 존재한다."
      payload: ["running", "registers", "program counter"]
      outcomes:
        - status: info
          text: "Thread 전환은 단순한 함수 호출과 다른 커널 수준 작업이다."
    - title: "2. A 상태 저장"
      from: "Thread A"
      to: "Thread Context"
      route_label: "A의 레지스터와 실행 위치를 컨텍스트에 저장한다."
      active_actors: [a, context]
      description: "나중에 A가 다시 선택되면 저장한 지점부터 실행을 재개할 수 있다."
      payload: ["save", "registers", "PC"]
      outcomes:
        - status: info
          text: "상태 저장 비용이 전환의 일부다."
    - title: "3. B 상태 복원"
      from: "Thread Context"
      to: "Thread B"
      route_label: "B의 저장된 컨텍스트를 복원하고 CPU를 B에 배정한다."
      active_actors: [context, b, scheduler]
      description: "복원 뒤 B는 이전 실행 위치에서 계속 진행한다."
      payload: ["restore", "dispatch", "resume"]
      outcomes:
        - status: allow
          text: "동시에 실행되는 것처럼 보여도 한 코어에서는 전환이 시간을 나눈다."

thread_switching_cost:
  eyebrow: "Interactive comparison"
  title: "Runnable Thread 수와 Context Switching 비용"
  summary: "CPU 코어보다 Runnable Thread가 많으면 대기와 전환이 늘어 실제 작업에 쓰는 시간이 줄 수 있다."
  actors:
    - id: cores
      kind: "실행 자원"
      name: "CPU Cores"
      description: "동시에 실행할 수 있는 코어 수"
    - id: runnable
      kind: "대기 작업"
      name: "Runnable Threads"
      description: "실행 가능 상태로 대기 중인 Thread 수"
    - id: scheduler
      kind: "선택"
      name: "Scheduler"
      description: "실행 순서와 시간을 나누는 스케줄러"
    - id: overhead
      kind: "부가 비용"
      name: "Switch Overhead"
      description: "컨텍스트 저장·복원과 캐시 영향"
  steps:
    - title: "1. 코어 수 확인"
      from: "CPU Cores"
      to: "Runnable Threads"
      route_label: "실행 가능한 Thread 수를 CPU 코어 수와 비교한다."
      active_actors: [cores, runnable]
      description: "Runnable Thread가 코어보다 적으면 모든 작업이 동시에 실행되지 않을 수 있다."
      payload: ["cores", "runnable", "ready queue"]
      outcomes:
        - status: info
          text: "Thread 수를 늘리는 것만으로 CPU 처리량이 늘지는 않는다."
    - title: "2. 스케줄링"
      from: "Runnable Threads"
      to: "Scheduler"
      route_label: "스케줄러가 실행할 Thread를 선택하고 시간을 배분한다."
      active_actors: [runnable, scheduler]
      description: "대기열의 Thread들은 차례로 CPU를 받기 위해 경쟁한다."
      payload: ["run queue", "time slice", "dispatch"]
      outcomes:
        - status: info
          text: "응답성과 공정성은 스케줄링 정책과 부하에 영향을 받는다."
    - title: "3. 전환 비용 증가"
      from: "Scheduler"
      to: "Switch Overhead"
      route_label: "실행할 Thread가 자주 바뀌면 저장·복원과 캐시 손실 비용이 누적된다."
      active_actors: [scheduler, overhead, runnable]
      description: "I/O 대기와 CPU 작업의 성격을 고려해 적절한 Thread 수와 풀 크기를 선택한다."
      payload: ["context switch", "cache miss", "overhead"]
      outcomes:
        - status: warning
          text: "Thread를 많이 만들면 병렬성이 아니라 전환 비용이 커질 수 있다."

pool_bottleneck:
  eyebrow: "Interactive flow"
  title: "Spring Thread Pool과 DB Connection Pool 병목"
  summary: "요청 Thread가 충분해도 DB Connection Pool이 부족하면 요청은 연결을 기다리며 병목이 생긴다."
  actors:
    - id: requests
      kind: "외부 부하"
      name: "HTTP Requests"
      description: "동시에 들어오는 웹 요청"
    - id: threads
      kind: "처리 풀"
      name: "Spring Thread Pool"
      description: "요청을 실행하는 Thread 집합"
    - id: connections
      kind: "DB 자원"
      name: "DB Connection Pool"
      description: "데이터베이스 연결을 재사용하는 풀"
    - id: db
      kind: "외부 시스템"
      name: "Database"
      description: "쿼리를 실행하는 데이터베이스"
  steps:
    - title: "1. 요청 수신"
      from: "HTTP Requests"
      to: "Spring Thread Pool"
      route_label: "HTTP 요청이 서버 Thread Pool의 작업으로 들어온다."
      active_actors: [requests, threads]
      description: "요청 수가 Thread Pool 크기를 넘으면 실행 전 대기열이 생긴다."
      payload: ["request", "worker thread", "queue"]
      outcomes:
        - status: info
          text: "Thread Pool 크기만으로 전체 처리 용량을 판단하지 않는다."
    - title: "2. 연결 대기"
      from: "Spring Thread Pool"
      to: "DB Connection Pool"
      route_label: "실행된 Thread가 DB 연결을 빌리기 위해 Connection Pool을 조회한다."
      active_actors: [threads, connections]
      description: "사용 가능한 연결이 없으면 Thread가 DB 작업 전부터 대기한다."
      payload: ["borrow", "connection limit", "wait time"]
      outcomes:
        - status: warning
          text: "Thread Pool을 키워도 DB 연결 부족으로 지연이 더 커질 수 있다."
    - title: "3. 쿼리 실행"
      from: "DB Connection Pool"
      to: "Database"
      route_label: "빌린 연결로 쿼리를 실행하고 반환한 뒤 다음 요청이 재사용한다."
      active_actors: [connections, db, threads]
      description: "병목 분석에서는 Thread 대기와 Connection 대기, 실제 쿼리 시간을 분리한다."
      payload: ["query", "execute", "release"]
      outcomes:
        - status: allow
          text: "풀 크기와 DB 처리 시간을 함께 조정해야 한다."

optimistic_lock:
  eyebrow: "Interactive flow"
  title: "낙관적 락의 버전 비교와 재시도"
  summary: "수정 시점에 읽은 version과 현재 version을 비교해 충돌을 감지하고 실패한 작업은 정책에 따라 재시도한다."
  actors:
    - id: tx
      kind: "트랜잭션"
      name: "Transaction"
      description: "엔티티를 읽고 수정하는 작업"
    - id: version
      kind: "검증 값"
      name: "Version"
      description: "마지막으로 읽은 엔티티 버전"
    - id: db
      kind: "저장 상태"
      name: "Database Row"
      description: "현재 데이터와 version을 가진 행"
    - id: retry
      kind: "충돌 처리"
      name: "Retry / Conflict"
      description: "충돌을 실패로 반환하거나 다시 시도하는 정책"
  steps:
    - title: "1. 버전 읽기"
      from: "Transaction"
      to: "Database Row"
      route_label: "트랜잭션이 현재 데이터와 version을 함께 읽는다."
      active_actors: [tx, db, version]
      description: "낙관적 락은 읽을 때 잠그기보다 수정할 때 충돌을 확인한다."
      payload: ["SELECT", "version = 3", "snapshot"]
      outcomes:
        - status: info
          text: "읽은 버전이 이후 UPDATE 조건의 기준이 된다."
    - title: "2. 조건부 수정"
      from: "Transaction"
      to: "Version"
      route_label: "UPDATE WHERE id와 version이 모두 일치할 때만 저장하고 version을 증가시킨다."
      active_actors: [tx, version, db]
      description: "다른 트랜잭션이 먼저 수정했다면 영향을 받은 행 수가 0이 된다."
      payload: ["WHERE version = 3", "UPDATE", "version + 1"]
      outcomes:
        - status: allow
          text: "버전이 그대로면 충돌 없이 커밋할 수 있다."
    - title: "3. 충돌 재시도"
      from: "Database Row"
      to: "Retry / Conflict"
      route_label: "버전이 다르면 충돌로 판단해 실패를 알리거나 최신 값을 읽고 재시도한다."
      active_actors: [db, retry, tx]
      description: "재시도 가능 여부는 작업의 멱등성·사용자 경험·최대 횟수 정책에 달려 있다."
      payload: ["affected rows = 0", "conflict", "retry"]
      outcomes:
        - status: reject
          text: "충돌을 무조건 조용히 덮어쓰지 않는다."

pessimistic_lock:
  eyebrow: "Interactive flow"
  title: "비관적 락의 Row Lock 대기"
  summary: "트랜잭션이 행을 잠그고 있는 동안 다른 트랜잭션은 락이 풀릴 때까지 기다린다."
  actors:
    - id: txa
      kind: "선점 트랜잭션"
      name: "Transaction A"
      description: "먼저 해당 행을 잠근 트랜잭션"
    - id: row
      kind: "공유 자원"
      name: "Database Row"
      description: "동시에 변경될 수 있는 하나의 행"
    - id: txb
      kind: "대기 트랜잭션"
      name: "Transaction B"
      description: "같은 행의 락을 기다리는 트랜잭션"
    - id: commit
      kind: "해제 시점"
      name: "Commit / Rollback"
      description: "락을 해제하고 다음 트랜잭션을 진행시키는 경계"
  steps:
    - title: "1. 행 잠금 획득"
      from: "Transaction A"
      to: "Database Row"
      route_label: "A가 SELECT FOR UPDATE 등으로 대상 행의 Row Lock을 획득한다."
      active_actors: [txa, row]
      description: "잠금이 유지되는 동안 다른 트랜잭션의 충돌 변경을 막는다."
      payload: ["FOR UPDATE", "row lock", "exclusive"]
      outcomes:
        - status: allow
          text: "A가 임계 구역을 먼저 확보한다."
    - title: "2. B 대기"
      from: "Transaction B"
      to: "Database Row"
      route_label: "B가 같은 행을 잠그려 하면 A의 락이 풀릴 때까지 대기한다."
      active_actors: [txb, row, txa]
      description: "대기는 일관성을 높이는 대신 연결 점유 시간과 데드락 위험을 만든다."
      payload: ["lock wait", "timeout", "same row"]
      outcomes:
        - status: warning
          text: "긴 트랜잭션은 다른 요청의 지연으로 이어질 수 있다."
    - title: "3. 락 해제"
      from: "Commit / Rollback"
      to: "Transaction B"
      route_label: "A가 커밋·롤백하면 락이 풀리고 B가 행을 다시 확인한다."
      active_actors: [commit, txa, txb, row]
      description: "비관적 락은 충돌 후 복구보다 충돌 자체를 줄이는 전략이다."
      payload: ["commit", "rollback", "unlock"]
      outcomes:
        - status: info
          text: "락 범위·대기 시간·데드락 정책을 함께 설계한다."

lock_selection:
  eyebrow: "Interactive comparison"
  title: "원자 업데이트·낙관적 락·비관적 락 선택"
  summary: "충돌 가능성과 작업 범위에 따라 짧은 원자 연산, 버전 검증, 선점 잠금 중 전략을 선택한다."
  actors:
    - id: operation
      kind: "변경 작업"
      name: "Update Request"
      description: "재고·포인트·예약처럼 공유 값을 변경하는 요청"
    - id: atomic
      kind: "짧은 연산"
      name: "Atomic UPDATE"
      description: "조건을 포함한 한 번의 원자 SQL"
    - id: optimistic
      kind: "버전 검증"
      name: "Optimistic Lock"
      description: "version 비교로 충돌을 감지하는 전략"
    - id: pessimistic
      kind: "선점 잠금"
      name: "Pessimistic Lock"
      description: "행을 먼저 잠그고 작업하는 전략"
  steps:
    - title: "1. 단순 조건 변경"
      from: "Update Request"
      to: "Atomic UPDATE"
      route_label: "한 번의 조건부 UPDATE로 재고 감소처럼 짧은 변경을 처리한다."
      active_actors: [operation, atomic]
      description: "상태를 읽고 복잡한 계산을 하지 않는다면 원자 SQL이 가장 간단할 수 있다."
      payload: ["WHERE stock > 0", "stock = stock - 1", "affected rows"]
      outcomes:
        - status: allow
          text: "잠금 객체를 애플리케이션에 노출하지 않고 경쟁을 줄인다."
    - title: "2. 충돌 감지 필요"
      from: "Update Request"
      to: "Optimistic Lock"
      route_label: "여러 단계를 읽고 계산하지만 충돌이 드물다면 version으로 변경을 검증한다."
      active_actors: [operation, optimistic]
      description: "충돌 시 사용자에게 알리거나 재시도할 수 있는 작업에 적합하다."
      payload: ["version", "conflict", "retry policy"]
      outcomes:
        - status: info
          text: "읽기 경쟁을 허용하고 수정 시점에 충돌을 판단한다."
    - title: "3. 선점 필요"
      from: "Update Request"
      to: "Pessimistic Lock"
      route_label: "동시에 처리되면 안 되는 임계 구역을 행 잠금으로 선점한다."
      active_actors: [operation, pessimistic]
      description: "충돌 비용이 크고 대기 허용 범위가 명확할 때 검토한다."
      payload: ["row lock", "wait", "deadlock"]
      outcomes:
        - status: warning
          text: "락 대기와 데드락·타임아웃 비용을 반드시 함께 평가한다."

interrupt_full:
  eyebrow: "Interactive flow"
  title: "Interrupt 전체 실행 흐름"
  summary: "장치나 프로그램의 인터럽트 요청을 CPU가 받아 현재 상태를 저장하고 핸들러 실행 후 원래 흐름으로 복귀한다."
  actors:
    - id: device
      kind: "발생 주체"
      name: "Device / Program"
      description: "처리가 필요하다는 인터럽트를 발생시키는 주체"
    - id: cpu
      kind: "현재 실행"
      name: "CPU"
      description: "현재 명령을 처리 중인 프로세서"
    - id: handler
      kind: "운영체제 처리"
      name: "Interrupt Handler"
      description: "인터럽트 원인을 확인하고 처리하는 코드"
    - id: resume
      kind: "복귀"
      name: "Resumed Program"
      description: "저장한 실행 위치로 돌아가는 원래 프로그램"
  steps:
    - title: "1. 인터럽트 요청"
      from: "Device / Program"
      to: "CPU"
      route_label: "장치나 프로그램이 CPU에 즉시 처리할 사건이 있음을 알린다."
      active_actors: [device, cpu]
      description: "인터럽트는 현재 실행 흐름과 별개로 처리 필요성을 전달한다."
      payload: ["interrupt request", "IRQ", "event"]
      outcomes:
        - status: info
          text: "인터럽트가 발생했다고 곧바로 모든 실행이 중단되는 것은 아니다."
    - title: "2. 현재 상태 저장"
      from: "CPU"
      to: "Interrupt Handler"
      route_label: "CPU가 복귀에 필요한 PC와 레지스터 상태를 저장하고 핸들러로 진입한다."
      active_actors: [cpu, handler]
      description: "중단된 프로그램을 나중에 이어가기 위해 실행 문맥을 보존한다."
      payload: ["save context", "PC", "vector"]
      outcomes:
        - status: allow
          text: "핸들러가 인터럽트 원인을 처리할 준비가 된다."
    - title: "3. 처리 후 복귀"
      from: "Interrupt Handler"
      to: "Resumed Program"
      route_label: "핸들러가 장치 상태를 처리한 뒤 저장한 문맥으로 원래 프로그램을 재개한다."
      active_actors: [handler, resume, cpu]
      description: "인터럽트 처리와 프로세스 전체의 문맥 전환은 범위가 다를 수 있다."
      payload: ["acknowledge", "restore context", "return"]
      outcomes:
        - status: info
          text: "중단된 흐름이 일관된 상태에서 다시 실행된다."

interrupt_context:
  eyebrow: "Interactive comparison"
  title: "Interrupt와 Context Switching"
  summary: "인터럽트는 CPU가 처리할 사건을 알리고, 스케줄러 판단이 더해지면 다른 Thread로 문맥 전환이 이어질 수 있다."
  actors:
    - id: current
      kind: "현재 Thread"
      name: "Running Thread"
      description: "인터럽트가 발생한 시점의 실행 흐름"
    - id: interrupt
      kind: "사건 신호"
      name: "Interrupt"
      description: "외부 장치나 내부 사건의 알림"
    - id: scheduler
      kind: "선택 정책"
      name: "Scheduler"
      description: "현재 Thread를 계속 실행할지 결정하는 구성요소"
    - id: next
      kind: "다음 실행"
      name: "Next Thread"
      description: "스케줄러가 새로 선택한 실행 흐름"
  steps:
    - title: "1. 현재 실행 중단 지점"
      from: "Running Thread"
      to: "Interrupt"
      route_label: "현재 Thread가 실행 중일 때 인터럽트 신호가 들어온다."
      active_actors: [current, interrupt]
      description: "인터럽트가 발생한 시점의 실행 상태를 보존해야 한다."
      payload: ["running", "IRQ", "preemption point"]
      outcomes:
        - status: info
          text: "인터럽트와 Thread 전환을 같은 개념으로 합치지 않는다."
    - title: "2. 스케줄러 판단"
      from: "Interrupt"
      to: "Scheduler"
      route_label: "인터럽트 처리 뒤 스케줄러가 현재 Thread를 계속 실행할지 확인한다."
      active_actors: [interrupt, scheduler, current]
      description: "스케줄링 정책과 우선순위에 따라 문맥 전환 여부가 결정된다."
      payload: ["handler return", "priority", "preemption"]
      outcomes:
        - status: info
          text: "모든 인터럽트가 다른 Thread 실행으로 이어지는 것은 아니다."
    - title: "3. 문맥 전환"
      from: "Scheduler"
      to: "Next Thread"
      route_label: "전환이 결정되면 현재 상태를 저장하고 다음 Thread 상태를 복원한다."
      active_actors: [scheduler, current, next]
      description: "인터럽트는 전환을 유발할 수 있는 계기이고 문맥 저장·복원은 별도 작업이다."
      payload: ["save", "restore", "dispatch"]
      outcomes:
        - status: allow
          text: "사건 처리와 CPU 실행 주체 변경을 시간 순서로 나누어 본다."

io_state_transition:
  eyebrow: "Interactive flow"
  title: "I/O 요청과 스레드 상태 전환"
  summary: "I/O를 기다리는 스레드는 Blocked 상태로 빠지고 완료 인터럽트 뒤 Runnable을 거쳐 다시 실행된다."
  actors:
    - id: thread
      kind: "실행 주체"
      name: "Application Thread"
      description: "I/O 작업을 요청한 스레드"
    - id: device
      kind: "외부 작업"
      name: "I/O Device"
      description: "디스크·네트워크처럼 완료 시간이 필요한 장치"
    - id: blocked
      kind: "대기 상태"
      name: "Blocked"
      description: "I/O 완료를 기다리는 스레드 상태"
    - id: runnable
      kind: "재실행 대기"
      name: "Runnable"
      description: "CPU를 다시 받을 수 있는 상태"
  steps:
    - title: "1. I/O 요청"
      from: "Application Thread"
      to: "I/O Device"
      route_label: "실행 중인 스레드가 디스크나 네트워크 I/O를 요청한다."
      active_actors: [thread, device]
      description: "장치 작업은 CPU 계산과 달리 완료까지 시간이 걸릴 수 있다."
      payload: ["read", "write", "I/O request"]
      outcomes:
        - status: info
          text: "요청을 보낸 뒤 스레드가 계속 실행 가능한지는 모델에 따라 달라진다."
    - title: "2. 대기 상태"
      from: "Application Thread"
      to: "Blocked"
      route_label: "완료를 기다리는 스레드는 Blocked 상태로 이동하고 CPU를 양보한다."
      active_actors: [thread, blocked, device]
      description: "대기 중인 스레드를 계속 실행하지 않으면 다른 작업이 CPU를 사용할 수 있다."
      payload: ["wait", "blocked", "CPU release"]
      outcomes:
        - status: allow
          text: "I/O 대기와 CPU 실행을 분리해 처리한다."
    - title: "3. 완료 후 재실행"
      from: "I/O Device"
      to: "Runnable"
      route_label: "장치 완료 신호가 오면 스레드를 Runnable 대기열로 되돌린다."
      active_actors: [device, blocked, runnable, thread]
      description: "Runnable은 즉시 실행 중이라는 뜻이 아니라 CPU를 받을 준비가 되었다는 뜻이다."
      payload: ["completion", "interrupt", "ready queue"]
      outcomes:
        - status: info
          text: "스케줄러가 선택한 뒤에야 실제 실행 상태가 된다."

encapsulation:
  eyebrow: "Interactive comparison"
  title: "Java 캡슐화 전후"
  summary: "필드를 외부에 직접 노출하지 않고 객체의 메서드가 상태 변경과 불변식을 관리한다."
  actors:
    - id: caller
      kind: "호출부"
      name: "External Caller"
      description: "객체의 상태를 사용하거나 변경하려는 코드"
    - id: field
      kind: "상태"
      name: "Private Field"
      description: "객체 내부에서만 직접 접근하는 값"
    - id: method
      kind: "행동 경계"
      name: "Domain Method"
      description: "검증과 상태 변경 정책을 함께 가진 메서드"
    - id: invariant
      kind: "규칙"
      name: "Invariant"
      description: "항상 지켜져야 하는 객체 상태 조건"
  steps:
    - title: "1. 직접 필드 노출"
      from: "External Caller"
      to: "Private Field"
      route_label: "호출부가 필드에 직접 값을 쓰면 객체 내부 규칙을 우회할 수 있다."
      active_actors: [caller, field]
      description: "공개 필드는 상태 변경 위치가 여러 곳으로 퍼지기 쉽다."
      payload: ["public field", "direct write", "coupling"]
      outcomes:
        - status: warning
          text: "잘못된 값이 검증 없이 저장될 수 있다."
    - title: "2. 메서드로 변경"
      from: "External Caller"
      to: "Domain Method"
      route_label: "호출부는 changeName 같은 행동 메서드를 호출하고 필드는 직접 만지지 않는다."
      active_actors: [caller, method, field]
      description: "변경 의도를 메서드 이름으로 드러내면 정책을 한 경계에 모을 수 있다."
      payload: ["changeName()", "validate", "encapsulation"]
      outcomes:
        - status: allow
          text: "상태 변경 책임이 객체 내부로 이동한다."
    - title: "3. 불변식 유지"
      from: "Domain Method"
      to: "Invariant"
      route_label: "메서드가 입력을 검증한 뒤 허용된 상태만 필드에 반영한다."
      active_actors: [method, field, invariant]
      description: "캡슐화는 private 키워드만이 아니라 상태 변경 규칙을 지키는 설계다."
      payload: ["validation", "valid state", "policy"]
      outcomes:
        - status: allow
          text: "변경 정책을 나중에 추가해도 호출부의 세부 수정이 줄어든다."

constructor_state:
  eyebrow: "Interactive flow"
  title: "Constructor와 객체 상태 관리"
  summary: "생성자는 객체가 유효한 초기 상태를 만들고 이후 행동 메서드가 상태 변경 규칙을 적용한다."
  actors:
    - id: input
      kind: "생성 입력"
      name: "Constructor Arguments"
      description: "객체 생성에 필요한 초기 값"
    - id: constructor
      kind: "초기화"
      name: "Constructor"
      description: "필수 상태를 검증하고 초기화하는 경계"
    - id: object
      kind: "도메인 객체"
      name: "Valid Object"
      description: "유효한 불변식으로 만들어진 객체"
    - id: behavior
      kind: "상태 변경"
      name: "Object Behavior"
      description: "객체가 제공하는 의도 중심의 행동 메서드"
  steps:
    - title: "1. 생성 입력 검증"
      from: "Constructor Arguments"
      to: "Constructor"
      route_label: "생성자가 필수 값과 초기 조건을 확인한다."
      active_actors: [input, constructor]
      description: "생성 시점에 만족해야 하는 규칙과 이후 변경 규칙을 구분한다."
      payload: ["required value", "validation", "initial state"]
      outcomes:
        - status: reject
          text: "유효하지 않은 객체를 먼저 만든 뒤 나중에 고치는 흐름을 피한다."
    - title: "2. 유효한 객체 생성"
      from: "Constructor"
      to: "Valid Object"
      route_label: "검증을 통과한 값으로 객체의 초기 상태를 만든다."
      active_actors: [constructor, object]
      description: "객체가 생성된 뒤에는 기본 불변식이 항상 성립한다고 기대할 수 있다."
      payload: ["fields", "invariant", "new object"]
      outcomes:
        - status: allow
          text: "호출부가 부분 초기화 상태를 다룰 필요가 줄어든다."
    - title: "3. 행동으로 변경"
      from: "Valid Object"
      to: "Object Behavior"
      route_label: "이후 변경은 setter 남발보다 객체의 의미 있는 행동으로 표현한다."
      active_actors: [object, behavior]
      description: "상태 변경 정책과 이력·검증을 도메인 메서드 안에서 함께 관리할 수 있다."
      payload: ["change state", "domain method", "policy"]
      outcomes:
        - status: info
          text: "Dirty Checking의 필수 조건과 좋은 객체 설계의 선택을 혼동하지 않는다."

short_circuit:
  eyebrow: "Interactive comparison"
  title: "Java &&와 &의 단락 평가"
  summary: "&&는 왼쪽 결과로 전체 결과가 정해지면 오른쪽을 건너뛰고 &는 두 피연산자를 모두 평가한다."
  actors:
    - id: left
      kind: "첫 조건"
      name: "Left Operand"
      description: "먼저 평가되는 boolean 조건"
    - id: right
      kind: "둘째 조건"
      name: "Right Operand"
      description: "두 번째로 평가될 수 있는 조건 또는 메서드 호출"
    - id: and
      kind: "단락 연산"
      name: "&&"
      description: "왼쪽이 false면 오른쪽을 평가하지 않는 연산자"
    - id: bit
      kind: "전체 평가"
      name: "&"
      description: "boolean에서도 양쪽 피연산자를 모두 평가하는 연산자"
  steps:
    - title: "1. 왼쪽 조건 평가"
      from: "Left Operand"
      to: "&&"
      route_label: "&& 표현식이 왼쪽 조건을 먼저 계산한다."
      active_actors: [left, and]
      description: "왼쪽 결과가 오른쪽 평가 여부를 결정할 수 있다."
      payload: ["left", "boolean", "short circuit"]
      outcomes:
        - status: info
          text: "평가 순서가 연산 결과와 부수 효과에 영향을 준다."
    - title: "2. false면 건너뜀"
      from: "&&"
      to: "Right Operand"
      route_label: "왼쪽이 false면 &&는 전체가 false이므로 오른쪽을 호출하지 않는다."
      active_actors: [and, right]
      description: "null 검사 뒤 메서드를 호출하는 패턴처럼 안전한 단락 평가에 활용한다."
      payload: ["left = false", "right skipped", "false"]
      outcomes:
        - status: allow
          text: "불필요한 계산과 위험한 호출을 줄일 수 있다."
    - title: "3. &는 모두 평가"
      from: "&"
      to: "Right Operand"
      route_label: "boolean 연산의 &는 왼쪽 결과와 관계없이 오른쪽까지 평가한다."
      active_actors: [left, right, bit]
      description: "부수 효과가 있는 조건에서 &&와 &를 바꾸면 실행 흐름이 달라진다."
      payload: ["left", "right", "both evaluated"]
      outcomes:
        - status: warning
          text: "의도한 단락 평가인지 비트 연산인지 문맥에 맞춰 선택한다."

primitive_reference:
  eyebrow: "Interactive comparison"
  title: "기본 타입과 참조 타입의 전달"
  summary: "기본 타입은 값이 복사되고 참조 타입은 참조값이 복사되어 같은 객체를 가리킬 수 있다."
  actors:
    - id: caller
      kind: "호출부"
      name: "Caller Variable"
      description: "메서드에 값을 전달하는 원래 변수"
    - id: primitive
      kind: "기본 값"
      name: "Primitive Copy"
      description: "int·boolean 같은 값 자체의 복사본"
    - id: reference
      kind: "참조 값"
      name: "Reference Copy"
      description: "객체를 가리키는 참조값의 복사본"
    - id: object
      kind: "객체"
      name: "Heap Object"
      description: "복사된 참조들이 함께 가리킬 수 있는 객체"
  steps:
    - title: "1. 기본 값 복사"
      from: "Caller Variable"
      to: "Primitive Copy"
      route_label: "메서드 호출 시 기본 타입의 값 자체가 매개변수에 복사된다."
      active_actors: [caller, primitive]
      description: "메서드 안에서 복사본을 바꿔도 호출부 변수는 바뀌지 않는다."
      payload: ["int x", "copy value", "local change"]
      outcomes:
        - status: info
          text: "Java의 매개변수 전달은 기본 타입에서도 값 복사다."
    - title: "2. 참조값 복사"
      from: "Caller Variable"
      to: "Reference Copy"
      route_label: "참조 타입에서는 객체를 가리키는 참조값이 매개변수에 복사된다."
      active_actors: [caller, reference, object]
      description: "참조 자체가 복사되지만 두 참조가 같은 Heap 객체를 가리킬 수 있다."
      payload: ["User user", "copy reference", "same object"]
      outcomes:
        - status: info
          text: "Java가 참조 자체를 call by reference로 전달한다는 뜻은 아니다."
    - title: "3. 객체 상태 변경"
      from: "Reference Copy"
      to: "Heap Object"
      route_label: "메서드가 복사된 참조로 객체 필드를 바꾸면 공유 객체 상태가 바뀐다."
      active_actors: [reference, object, caller]
      description: "참조값 복사와 객체 mutation을 분리해서 설명해야 전달 규칙이 선명해진다."
      payload: ["user.name = ...", "mutation", "caller observes"]
      outcomes:
        - status: allow
          text: "참조 타입도 매개변수 전달 자체는 값 복사지만 객체 변경은 공유된다."

pass_by_value:
  eyebrow: "Interactive flow"
  title: "참조 타입의 Pass by Value"
  summary: "메서드는 참조값의 복사본을 받으므로 지역 참조 재대입은 호출부에 영향을 주지 않지만 객체 변경은 공유된다."
  actors:
    - id: caller
      kind: "호출부 참조"
      name: "caller.user"
      description: "원래 객체를 가리키는 호출부 변수"
    - id: parameter
      kind: "매개변수 복사"
      name: "method user"
      description: "호출부 참조값을 복사한 지역 변수"
    - id: object
      kind: "공유 객체"
      name: "User Object"
      description: "두 참조가 같은 객체를 가리키는 상태"
    - id: reassigned
      kind: "지역 재대입"
      name: "Local Reassignment"
      description: "메서드 안에서만 바뀌는 매개변수 참조"
  steps:
    - title: "1. 참조값 전달"
      from: "caller.user"
      to: "method user"
      route_label: "호출부의 참조값이 매개변수 변수에 복사된다."
      active_actors: [caller, parameter, object]
      description: "두 변수는 같은 User 객체를 가리킬 수 있지만 변수 자체는 별개다."
      payload: ["copy reference", "same heap object", "pass by value"]
      outcomes:
        - status: info
          text: "참조를 전달해도 참조 변수 자체를 공유하는 것은 아니다."
    - title: "2. 지역 참조 재대입"
      from: "method user"
      to: "Local Reassignment"
      route_label: "메서드 안에서 parameter가 다른 객체를 가리키도록 재대입한다."
      active_actors: [parameter, reassigned, caller]
      description: "복사본인 매개변수만 바뀌므로 호출부의 caller.user는 그대로다."
      payload: ["user = new User()", "local only", "caller unchanged"]
      outcomes:
        - status: allow
          text: "참조 변수 재대입은 호출부까지 전파되지 않는다."
    - title: "3. 객체 mutation"
      from: "method user"
      to: "User Object"
      route_label: "재대입이 아니라 user.name 같은 필드를 바꾸면 같은 객체의 상태가 변경된다."
      active_actors: [parameter, object, caller]
      description: "호출부와 메서드가 같은 객체를 가리키는 동안 mutation은 공유된다."
      payload: ["field mutation", "shared state", "caller sees change"]
      outcomes:
        - status: warning
          text: "재대입과 객체 내부 변경을 같은 결과로 설명하지 않는다."

filesystem_layers:
  eyebrow: "Interactive flow"
  title: "Java 애플리케이션에서 저장장치까지"
  summary: "Java API 호출은 운영체제 파일 시스템과 장치 드라이버를 거쳐 저장장치의 블록에 도달한다."
  actors:
    - id: app
      kind: "응용 계층"
      name: "Java Application"
      description: "File·Stream API를 호출하는 애플리케이션"
    - id: os
      kind: "운영체제"
      name: "OS + File System"
      description: "파일 이름·권한·블록 매핑을 관리하는 계층"
    - id: driver
      kind: "장치 연결"
      name: "Device Driver"
      description: "운영체제 요청을 장치 명령으로 바꾸는 계층"
    - id: storage
      kind: "물리 저장"
      name: "Storage Device"
      description: "SSD·HDD의 실제 블록과 페이지"
  steps:
    - title: "1. 파일 API 호출"
      from: "Java Application"
      to: "OS + File System"
      route_label: "Java 애플리케이션이 파일 열기·읽기·쓰기 API를 호출한다."
      active_actors: [app, os]
      description: "애플리케이션은 저장장치의 물리 위치보다 파일 추상화를 사용한다."
      payload: ["Path", "read", "write"]
      outcomes:
        - status: info
          text: "Java 코드가 곧바로 디스크 블록을 조작하는 것은 아니다."
    - title: "2. 파일 시스템 매핑"
      from: "OS + File System"
      to: "Device Driver"
      route_label: "운영체제가 파일 위치와 권한을 해석해 장치 I/O 요청으로 만든다."
      active_actors: [os, driver]
      description: "파일 이름에서 실제 블록으로 내려가는 책임이 운영체제에 있다."
      payload: ["inode", "block mapping", "I/O request"]
      outcomes:
        - status: allow
          text: "파일 시스템과 장치 접근 계층이 연결된다."
    - title: "3. 저장장치 접근"
      from: "Device Driver"
      to: "Storage Device"
      route_label: "드라이버가 장치 명령을 보내 저장장치가 블록을 읽거나 쓴다."
      active_actors: [driver, storage]
      description: "지연 시간과 내구성은 파일 API보다 아래 계층의 특성에도 영향을 받는다."
      payload: ["block", "page", "read / write"]
      outcomes:
        - status: info
          text: "애플리케이션·OS·장치의 책임을 층별로 나누어 본다."

directory_structures:
  eyebrow: "Interactive comparison"
  title: "디렉터리 구조의 변화"
  summary: "단일 디렉터리에서 계층형 트리와 링크를 허용하는 그래프 구조로 갈수록 이름 충돌과 공유 요구를 다르게 해결한다."
  actors:
    - id: single
      kind: "초기 구조"
      name: "Single-Level"
      description: "모든 파일이 하나의 디렉터리에 있는 구조"
    - id: two
      kind: "분리 구조"
      name: "Two-Level"
      description: "사용자별 또는 그룹별로 분리된 디렉터리"
    - id: tree
      kind: "계층 구조"
      name: "Tree Directories"
      description: "하위 디렉터리를 중첩할 수 있는 구조"
    - id: graph
      kind: "공유 구조"
      name: "Acyclic / General Graph"
      description: "링크로 여러 경로에서 대상을 공유하는 구조"
  steps:
    - title: "1. 단일 공간"
      from: "Single-Level"
      to: "Two-Level"
      route_label: "파일이 많아지면 사용자·그룹별 디렉터리로 이름 공간을 나눈다."
      active_actors: [single, two]
      description: "단일 구조는 단순하지만 파일 이름 충돌과 관리 범위 문제가 커진다."
      payload: ["one directory", "name collision", "user scope"]
      outcomes:
        - status: info
          text: "이름 공간을 나누는 것이 첫 번째 확장 방향이다."
    - title: "2. 트리 확장"
      from: "Two-Level"
      to: "Tree Directories"
      route_label: "하위 디렉터리를 중첩해 프로젝트·기능·날짜별 계층을 만든다."
      active_actors: [two, tree]
      description: "트리 구조는 경로로 파일을 구분하고 관리 범위를 세분화한다."
      payload: ["path", "parent", "child directory"]
      outcomes:
        - status: allow
          text: "계층을 따라 탐색과 권한 관리를 구성할 수 있다."
    - title: "3. 링크와 공유"
      from: "Tree Directories"
      to: "Acyclic / General Graph"
      route_label: "같은 파일이나 디렉터리를 여러 경로에서 참조하려면 링크를 허용한다."
      active_actors: [tree, graph]
      description: "공유 링크는 유연하지만 순환 참조·삭제·권한 의미를 추가로 관리해야 한다."
      payload: ["link", "shared target", "cycle policy"]
      outcomes:
        - status: warning
          text: "표현력이 늘수록 탐색과 수명 관리 규칙도 복잡해진다."

paging_translation:
  eyebrow: "Interactive flow"
  title: "Paging 주소 변환"
  summary: "가상 주소를 page number와 offset으로 나누고 페이지 테이블에서 frame을 찾아 물리 주소를 만든다."
  actors:
    - id: virtual
      kind: "가상 주소"
      name: "Virtual Address"
      description: "프로세스가 사용하는 논리 주소"
    - id: page
      kind: "페이지 번호"
      name: "Page Number"
      description: "페이지 테이블을 조회할 인덱스"
    - id: table
      kind: "매핑 표"
      name: "Page Table"
      description: "페이지와 물리 프레임의 매핑 정보"
    - id: frame
      kind: "물리 주소"
      name: "Frame + Offset"
      description: "RAM에서 실제 위치를 구성하는 프레임과 offset"
  steps:
    - title: "1. 주소 분해"
      from: "Virtual Address"
      to: "Page Number"
      route_label: "가상 주소를 page number와 page offset으로 분리한다."
      active_actors: [virtual, page]
      description: "offset은 페이지 안의 위치이고 page number는 매핑 대상을 찾는 값이다."
      payload: ["virtual address", "page", "offset"]
      outcomes:
        - status: info
          text: "페이지 크기가 주소 분할 기준을 결정한다."
    - title: "2. 페이지 테이블 조회"
      from: "Page Number"
      to: "Page Table"
      route_label: "페이지 번호로 현재 페이지가 어느 frame에 있는지 조회한다."
      active_actors: [page, table]
      description: "매핑이 없거나 유효하지 않으면 page fault 처리가 필요하다."
      payload: ["PTE", "valid bit", "frame number"]
      outcomes:
        - status: allow
          text: "유효한 매핑이 있으면 주소 변환을 계속한다."
    - title: "3. 물리 주소 생성"
      from: "Page Table"
      to: "Frame + Offset"
      route_label: "frame 번호와 원래 offset을 합쳐 물리 주소를 만든다."
      active_actors: [table, frame, virtual]
      description: "Paging은 프로세스의 연속 가상 공간을 물리 프레임에 나누어 배치한다."
      payload: ["frame", "offset", "physical address"]
      outcomes:
        - status: allow
          text: "변환된 주소로 RAM 접근을 수행한다."

page_fault:
  eyebrow: "Interactive flow"
  title: "Page Fault와 Page Replacement"
  summary: "요청 페이지가 메모리에 없으면 트랩이 발생하고 운영체제가 페이지를 적재할 프레임을 확보한다."
  actors:
    - id: cpu
      kind: "접근 주체"
      name: "CPU Memory Access"
      description: "가상 주소를 읽거나 쓰는 CPU 접근"
    - id: table
      kind: "판정"
      name: "Page Table"
      description: "페이지가 현재 메모리에 있는지 나타내는 표"
    - id: disk
      kind: "보조 저장"
      name: "Backing Store"
      description: "메모리에 없는 페이지를 보관하는 디스크 영역"
    - id: memory
      kind: "물리 메모리"
      name: "Frame / Replacement"
      description: "페이지를 적재할 프레임과 교체 정책"
  steps:
    - title: "1. 유효 비트 확인"
      from: "CPU Memory Access"
      to: "Page Table"
      route_label: "CPU가 주소를 접근하고 페이지 테이블의 valid bit를 확인한다."
      active_actors: [cpu, table]
      description: "페이지가 메모리에 있으면 바로 변환하지만 없으면 예외 처리가 시작된다."
      payload: ["page number", "valid bit", "access"]
      outcomes:
        - status: warning
          text: "유효하지 않은 매핑은 단순한 캐시 미스와 다른 운영체제 사건이다."
    - title: "2. 페이지 폴트 처리"
      from: "Page Table"
      to: "Backing Store"
      route_label: "운영체제가 필요한 페이지를 디스크에서 찾고 적재를 요청한다."
      active_actors: [table, disk, cpu]
      description: "현재 프레임이 부족하면 교체할 victim page도 선택해야 한다."
      payload: ["page fault", "trap", "read page"]
      outcomes:
        - status: info
          text: "폴트 처리 동안 해당 접근은 장치 I/O를 기다릴 수 있다."
    - title: "3. 프레임 적재와 재개"
      from: "Backing Store"
      to: "Frame / Replacement"
      route_label: "필요 페이지를 프레임에 적재하고 페이지 테이블을 갱신한 뒤 명령을 재실행한다."
      active_actors: [disk, memory, table, cpu]
      description: "페이지 교체 정책은 어떤 프레임을 내보낼지 결정한다."
      payload: ["victim", "load frame", "retry access"]
      outcomes:
        - status: allow
          text: "매핑이 갱신되면 중단된 메모리 접근을 이어갈 수 있다."

replacement_algorithms:
  eyebrow: "Interactive comparison"
  title: "FIFO·OPT·LRU 페이지 교체"
  summary: "프레임이 가득 찼을 때 FIFO는 오래된 페이지, OPT는 미래 최적 페이지, LRU는 가장 오래 안 쓴 페이지를 선택한다."
  actors:
    - id: fault
      kind: "사건"
      name: "Page Fault"
      description: "새 페이지를 적재해야 하는 상황"
    - id: fifo
      kind: "순서 기준"
      name: "FIFO"
      description: "가장 먼저 들어온 페이지를 내보내는 정책"
    - id: opt
      kind: "이상 기준"
      name: "OPT"
      description: "미래에 가장 늦게 사용될 페이지를 고르는 이론적 정책"
    - id: lru
      kind: "사용 이력"
      name: "LRU"
      description: "가장 오랫동안 사용되지 않은 페이지를 고르는 정책"
  steps:
    - title: "1. 교체 필요"
      from: "Page Fault"
      to: "FIFO"
      route_label: "새 페이지를 넣을 빈 프레임이 없으면 victim 선택이 시작된다."
      active_actors: [fault, fifo, opt, lru]
      description: "교체 정책은 같은 참조열에서도 서로 다른 victim을 선택할 수 있다."
      payload: ["full frames", "victim", "reference string"]
      outcomes:
        - status: info
          text: "페이지 폴트 횟수는 참조열과 프레임 수, 정책에 함께 좌우된다."
    - title: "2. FIFO 기준"
      from: "FIFO"
      to: "Page Fault"
      route_label: "FIFO는 메모리에 가장 먼저 들어온 페이지를 교체 대상으로 고른다."
      active_actors: [fifo, fault]
      description: "최근 사용 여부보다 적재 순서만 기억하는 단순한 정책이다."
      payload: ["arrival order", "oldest page", "queue"]
      outcomes:
        - status: info
          text: "오래전에 들어왔어도 자주 쓰이는 페이지를 내보낼 수 있다."
    - title: "3. OPT와 LRU 비교"
      from: "OPT / LRU"
      to: "Page Fault"
      route_label: "OPT는 미래 참조를 알고 선택하고 LRU는 과거 사용 이력으로 근사한다."
      active_actors: [opt, lru, fault]
      description: "OPT는 비교 기준이고 실제 시스템은 미래를 알 수 없어 LRU 같은 정책을 사용한다."
      payload: ["future use", "recent use", "victim choice"]
      outcomes:
        - status: allow
          text: "정책의 가정과 실제 구현 가능성을 함께 비교한다."

ontology_layers:
  eyebrow: "Interactive comparison"
  title: "택소노미·온톨로지·지식 그래프"
  summary: "분류 체계에서 관계와 의미를 표현하는 온톨로지, 실제 연결을 저장하는 그래프로 확장한다."
  actors:
    - id: taxonomy
      kind: "분류"
      name: "Taxonomy"
      description: "대상을 계층과 범주로 나누는 체계"
    - id: ontology
      kind: "의미"
      name: "Ontology"
      description: "개념·속성·관계와 제약을 정의하는 모델"
    - id: graph
      kind: "연결 데이터"
      name: "Knowledge Graph"
      description: "개체와 관계 인스턴스를 저장하는 그래프"
    - id: query
      kind: "활용"
      name: "Reasoning / Query"
      description: "관계와 의미를 이용해 검색·추론하는 단계"
  steps:
    - title: "1. 범주 나누기"
      from: "Taxonomy"
      to: "Ontology"
      route_label: "문서를 주제와 하위 범주로 분류해 탐색 가능한 구조를 만든다."
      active_actors: [taxonomy, ontology]
      description: "택소노미는 무엇이 어느 범주에 속하는지 정리하는 출발점이다."
      payload: ["category", "hierarchy", "classification"]
      outcomes:
        - status: info
          text: "분류만으로 모든 의미 관계가 표현되지는 않는다."
    - title: "2. 관계와 제약 정의"
      from: "Ontology"
      to: "Knowledge Graph"
      route_label: "개념 사이의 is-a·part-of·depends-on 관계와 속성을 정의한다."
      active_actors: [ontology, graph]
      description: "온톨로지는 그래프에 어떤 관계가 의미 있는지 설명하는 모델이다."
      payload: ["concept", "relation", "constraint"]
      outcomes:
        - status: allow
          text: "같은 단어라도 도메인 의미와 연결 규칙을 공유할 수 있다."
    - title: "3. 검색과 추론"
      from: "Knowledge Graph"
      to: "Reasoning / Query"
      route_label: "개체와 관계를 따라 관련 정보와 연결된 근거를 조회한다."
      active_actors: [graph, query, ontology]
      description: "그래프는 단순 문서 목록보다 관계 기반 질문에 활용할 수 있다."
      payload: ["entity", "edge", "query path"]
      outcomes:
        - status: info
          text: "온톨로지의 의미 규칙과 그래프의 실제 데이터는 함께 관리한다."

rag_second_brain:
  eyebrow: "Interactive flow"
  title: "RAG 기반 AI 세컨드 브레인"
  summary: "개인 지식을 수집·검색하고 질문과 관련된 근거를 모델에 제공해 답변을 생성한다."
  actors:
    - id: source
      kind: "지식 원천"
      name: "Notes / Documents"
      description: "사용자가 축적한 메모와 문서"
    - id: index
      kind: "검색 준비"
      name: "Chunk + Embedding"
      description: "문서를 청크로 나누고 검색 표현을 만드는 단계"
    - id: retrieval
      kind: "관련 검색"
      name: "Retriever"
      description: "질문과 가까운 근거를 찾는 구성요소"
    - id: model
      kind: "생성"
      name: "LLM Answer"
      description: "검색 근거를 바탕으로 답변을 작성하는 모델"
  steps:
    - title: "1. 지식 수집"
      from: "Notes / Documents"
      to: "Chunk + Embedding"
      route_label: "문서에서 의미 단위 청크를 만들고 검색 가능한 표현을 저장한다."
      active_actors: [source, index]
      description: "원문을 그대로 프롬프트에 넣는 대신 검색 준비 단계를 둔다."
      payload: ["document", "chunk", "embedding"]
      outcomes:
        - status: info
          text: "청크 경계와 메타데이터가 이후 검색 품질에 영향을 준다."
    - title: "2. 관련 근거 검색"
      from: "Chunk + Embedding"
      to: "Retriever"
      route_label: "사용자 질문과 가까운 문서 청크와 메타데이터를 검색한다."
      active_actors: [index, retrieval]
      description: "세컨드 브레인의 핵심은 모델 기억이 아니라 필요한 순간 근거를 찾아 주는 것이다."
      payload: ["query", "top-k", "relevant chunks"]
      outcomes:
        - status: allow
          text: "관련 문서가 답변 컨텍스트로 좁혀진다."
    - title: "3. 근거 기반 답변"
      from: "Retriever"
      to: "LLM Answer"
      route_label: "검색 결과를 컨텍스트로 넣어 질문에 대한 답변을 생성한다."
      active_actors: [retrieval, model, source]
      description: "답변과 근거가 맞는지 확인하고 모르는 내용은 추측하지 않도록 정책을 둔다."
      payload: ["context", "answer", "citation"]
      outcomes:
        - status: info
          text: "검색 실패와 생성 실패를 분리해 진단할 수 있다."

rag_ontology:
  eyebrow: "Interactive comparison"
  title: "RAG와 온톨로지의 역할"
  summary: "RAG는 관련 문서를 찾아 근거를 공급하고 온톨로지는 개념과 관계의 의미를 안정적으로 표현한다."
  actors:
    - id: question
      kind: "질문"
      name: "User Question"
      description: "도메인 지식에 대해 묻는 입력"
    - id: rag
      kind: "근거 검색"
      name: "RAG Retrieval"
      description: "관련 원문과 청크를 찾는 구성"
    - id: ontology
      kind: "의미 모델"
      name: "Ontology"
      description: "개념과 관계를 정의한 구조"
    - id: answer
      kind: "결과"
      name: "Grounded Answer"
      description: "근거와 관계를 반영한 답변"
  steps:
    - title: "1. 원문 근거 찾기"
      from: "User Question"
      to: "RAG Retrieval"
      route_label: "질문과 관련된 실제 문서·메모를 검색한다."
      active_actors: [question, rag]
      description: "RAG는 최신 원문과 구체적인 문장을 답변 컨텍스트로 가져오는 데 강점이 있다."
      payload: ["query", "chunks", "source text"]
      outcomes:
        - status: allow
          text: "답변이 참고할 원문 범위를 좁힌다."
    - title: "2. 관계 의미 해석"
      from: "Ontology"
      to: "Grounded Answer"
      route_label: "개념·관계·제약을 이용해 검색 결과의 의미와 연결을 해석한다."
      active_actors: [ontology, answer, question]
      description: "온톨로지는 같은 표현의 의미와 도메인 관계를 일관되게 유지하는 역할을 한다."
      payload: ["entity", "relation", "constraint"]
      outcomes:
        - status: info
          text: "관계 기반 질문에는 원문 검색만으로 부족할 수 있다."
    - title: "3. 조합된 답변"
      from: "RAG Retrieval"
      to: "Grounded Answer"
      route_label: "원문 근거와 의미 모델을 함께 사용해 설명 가능한 답변을 만든다."
      active_actors: [rag, ontology, answer]
      description: "RAG와 온톨로지는 대체 관계가 아니라 원문과 의미를 보완하는 조합이 될 수 있다."
      payload: ["evidence", "semantic link", "answer"]
      outcomes:
        - status: info
          text: "각 단계가 실패했을 때 검색·모델·관계 정의를 따로 점검한다."

kafka_topics:
  eyebrow: "Interactive flow"
  title: "Kafka 이벤트 토픽 분리"
  summary: "이벤트의 도메인과 소비 목적에 따라 토픽을 나누고 생산자와 소비자가 비동기로 연결된다."
  actors:
    - id: producer
      kind: "발행자"
      name: "Producer Service"
      description: "도메인 이벤트를 Kafka에 발행하는 서비스"
    - id: topic
      kind: "이벤트 채널"
      name: "Kafka Topic"
      description: "이벤트를 순서와 파티션 단위로 저장하는 로그"
    - id: consumer_a
      kind: "소비자 A"
      name: "Notification Consumer"
      description: "알림 같은 한 목적의 이벤트 소비자"
    - id: consumer_b
      kind: "소비자 B"
      name: "Analytics Consumer"
      description: "분석·집계 목적의 독립 소비자"
  steps:
    - title: "1. 이벤트 발행"
      from: "Producer Service"
      to: "Kafka Topic"
      route_label: "서비스가 주문 생성 같은 도메인 이벤트를 토픽에 기록한다."
      active_actors: [producer, topic]
      description: "생산자는 소비자가 언제 처리할지 직접 기다리지 않는다."
      payload: ["event", "key", "value"]
      outcomes:
        - status: allow
          text: "이벤트가 내구성 있는 로그에 쌓인다."
    - title: "2. 알림 소비"
      from: "Kafka Topic"
      to: "Notification Consumer"
      route_label: "알림 서비스가 자신의 consumer group으로 이벤트를 읽는다."
      active_actors: [topic, consumer_a]
      description: "한 소비자의 처리 속도가 다른 소비자의 처리와 반드시 같을 필요는 없다."
      payload: ["consumer group", "notification", "offset"]
      outcomes:
        - status: info
          text: "소비자별 처리 책임을 분리할 수 있다."
    - title: "3. 분석 소비"
      from: "Kafka Topic"
      to: "Analytics Consumer"
      route_label: "분석 서비스도 같은 이벤트를 별도 그룹으로 읽어 집계한다."
      active_actors: [topic, consumer_b]
      description: "토픽을 공유해도 consumer group이 다르면 각 목적이 독립적으로 소비할 수 있다."
      payload: ["analytics", "independent group", "replay"]
      outcomes:
        - status: allow
          text: "이벤트 발행과 여러 소비 목적을 느슨하게 연결한다."

kafka_retry:
  eyebrow: "Interactive flow"
  title: "Kafka 재처리 흐름"
  summary: "소비 실패를 즉시 무한 재시도하지 않고 재시도 토픽과 지연·횟수 정책을 거쳐 처리한다."
  actors:
    - id: consumer
      kind: "소비자"
      name: "Consumer"
      description: "Kafka 레코드를 읽고 업무 처리를 실행하는 서비스"
    - id: retry
      kind: "재시도 경로"
      name: "Retry Topic"
      description: "지연 후 다시 처리할 이벤트를 담는 토픽"
    - id: policy
      kind: "재시도 정책"
      name: "Backoff + Count"
      description: "대기 시간과 최대 재시도 횟수"
    - id: dlt
      kind: "격리 경로"
      name: "DLT"
      description: "자동 처리에 실패한 이벤트를 보관하는 토픽"
  steps:
    - title: "1. 처리 실패"
      from: "Consumer"
      to: "Retry Topic"
      route_label: "일시적인 외부 장애나 일시 오류로 이벤트 처리가 실패한다."
      active_actors: [consumer, retry]
      description: "실패 원인에 따라 재시도 가능한 오류와 즉시 격리할 오류를 구분한다."
      payload: ["record", "exception", "retryable"]
      outcomes:
        - status: warning
          text: "같은 파티션을 무한히 막지 않도록 실패 경로를 설계한다."
    - title: "2. 지연 재시도"
      from: "Retry Topic"
      to: "Backoff + Count"
      route_label: "정한 지연 시간 뒤 횟수 제한 안에서 이벤트를 다시 소비한다."
      active_actors: [retry, policy, consumer]
      description: "Backoff는 장애가 회복할 시간을 주고 최대 횟수는 무한 반복을 막는다."
      payload: ["delay", "attempt", "backoff"]
      outcomes:
        - status: allow
          text: "일시 오류가 회복되면 정상 처리로 돌아갈 수 있다."
    - title: "3. DLT 격리"
      from: "Backoff + Count"
      to: "DLT"
      route_label: "재시도 횟수를 넘기거나 비재시도 오류면 DLT로 보내 운영자가 조사한다."
      active_actors: [policy, dlt, consumer]
      description: "DLT는 실패를 숨기는 장소가 아니라 재처리·수동 복구를 위한 관찰 지점이다."
      payload: ["max attempts", "dead letter", "manual replay"]
      outcomes:
        - status: info
          text: "원본 이벤트와 실패 원인, 시도 횟수를 함께 보존한다."

kafka_dlt:
  eyebrow: "Interactive flow"
  title: "Kafka DLT 운영 프로세스"
  summary: "처리 불가 이벤트를 DLT에 격리하고 원인 분석·수정·선별 재처리로 운영 흐름을 닫는다."
  actors:
    - id: failed
      kind: "실패 이벤트"
      name: "Failed Record"
      description: "자동 소비에 실패한 Kafka 레코드"
    - id: dlt
      kind: "격리 저장"
      name: "Dead Letter Topic"
      description: "실패 이벤트와 메타데이터를 보관하는 토픽"
    - id: operator
      kind: "운영자"
      name: "Operator / Runbook"
      description: "실패 원인을 분석하고 조치를 선택하는 역할"
    - id: replay
      kind: "복구"
      name: "Selective Replay"
      description: "조건을 확인한 이벤트만 원래 처리 경로에 재투입"
  steps:
    - title: "1. 실패 격리"
      from: "Failed Record"
      to: "Dead Letter Topic"
      route_label: "처리할 수 없는 레코드를 원본 메타데이터와 함께 DLT로 보낸다."
      active_actors: [failed, dlt]
      description: "메인 소비 흐름을 막지 않으면서 실패 기록을 잃지 않는다."
      payload: ["record", "error", "headers"]
      outcomes:
        - status: allow
          text: "실패가 관찰 가능한 운영 데이터로 남는다."
    - title: "2. 원인 분석"
      from: "Dead Letter Topic"
      to: "Operator / Runbook"
      route_label: "운영자가 스키마·코드·외부 의존성 오류인지 분류한다."
      active_actors: [dlt, operator]
      description: "재시도 전에 데이터 수정이 필요한지, 버그 수정이 필요한지 확인한다."
      payload: ["root cause", "schema", "runbook"]
      outcomes:
        - status: info
          text: "DLT에 쌓였다는 사실만으로 재처리하면 같은 실패를 반복할 수 있다."
    - title: "3. 선별 재처리"
      from: "Operator / Runbook"
      to: "Selective Replay"
      route_label: "복구 조건을 만족하는 이벤트만 원래 토픽이나 재처리 경로로 돌린다."
      active_actors: [operator, replay, dlt]
      description: "중복 처리와 순서·멱등성 영향을 고려해 재투입 범위를 선택한다."
      payload: ["filter", "replay", "idempotency"]
      outcomes:
        - status: info
          text: "운영 복구는 자동 재시도 횟수와 다른 통제된 작업이다."

kafka_partition:
  eyebrow: "Interactive flow"
  title: "Kafka 파티션 key와 순서 보장"
  summary: "같은 key를 같은 파티션으로 보내면 해당 파티션 안에서 이벤트 순서를 유지할 수 있다."
  actors:
    - id: event
      kind: "이벤트"
      name: "Order Events"
      description: "같은 주문이나 사용자의 상태 변화 이벤트"
    - id: key
      kind: "분배 기준"
      name: "Partition Key"
      description: "파티션을 선택하는 안정적인 식별자"
    - id: partition
      kind: "로그 단위"
      name: "Kafka Partition"
      description: "순서와 offset이 독립적으로 유지되는 파티션"
    - id: consumer
      kind: "소비자"
      name: "Consumer"
      description: "파티션의 offset 순서로 레코드를 읽는 소비자"
  steps:
    - title: "1. key 선택"
      from: "Order Events"
      to: "Partition Key"
      route_label: "순서를 보장해야 하는 엔티티의 ID를 이벤트 key로 정한다."
      active_actors: [event, key]
      description: "어떤 이벤트들이 같은 순서 그룹이어야 하는지 먼저 정의한다."
      payload: ["orderId", "event type", "key"]
      outcomes:
        - status: info
          text: "전체 토픽의 전역 순서와 key별 순서는 다른 보장이다."
    - title: "2. 파티션 매핑"
      from: "Partition Key"
      to: "Kafka Partition"
      route_label: "key의 해시 결과로 같은 식별자의 이벤트를 같은 파티션에 보낸다."
      active_actors: [key, partition]
      description: "같은 파티션 안에서 offset 순서가 이벤트 처리 순서의 기준이 된다."
      payload: ["hash(key)", "partition 2", "offset"]
      outcomes:
        - status: allow
          text: "같은 key의 이벤트 순서를 유지할 수 있다."
    - title: "3. 순서 소비"
      from: "Kafka Partition"
      to: "Consumer"
      route_label: "소비자가 파티션의 offset을 따라 이벤트를 순서대로 읽는다."
      active_actors: [partition, consumer, event]
      description: "파티션 수·consumer group·재시도 방식이 실제 처리 순서에 함께 영향을 준다."
      payload: ["offset 10", "offset 11", "ordered consume"]
      outcomes:
        - status: info
          text: "파티션 간 전역 순서까지 자동으로 보장되는 것은 아니다."

docker_k8s:
  eyebrow: "Interactive comparison"
  title: "Docker에서 Kubernetes로 확장하는 이유"
  summary: "컨테이너 실행을 넘어 여러 인스턴스의 배포·복구·스케줄링을 선언적으로 관리한다."
  actors:
    - id: image
      kind: "패키지"
      name: "Docker Image"
      description: "애플리케이션과 의존성을 묶은 실행 단위"
    - id: compose
      kind: "로컬 오케스트레이션"
      name: "Docker Compose"
      description: "한 환경에서 여러 컨테이너를 묶어 실행하는 도구"
    - id: cluster
      kind: "클러스터 관리"
      name: "Kubernetes"
      description: "여러 노드에서 원하는 상태를 유지하는 오케스트레이터"
    - id: workload
      kind: "운영 상태"
      name: "Replicas + Service"
      description: "복제본·네트워크·배포를 관리하는 리소스 묶음"
  steps:
    - title: "1. 컨테이너 패키징"
      from: "Docker Image"
      to: "Docker Compose"
      route_label: "이미지를 서비스와 네트워크 설정으로 묶어 여러 컨테이너를 실행한다."
      active_actors: [image, compose]
      description: "Compose는 개발·작은 환경에서 재현 가능한 실행 구성을 제공한다."
      payload: ["image", "service", "compose.yml"]
      outcomes:
        - status: info
          text: "컨테이너를 실행하는 것과 클러스터 운영은 다른 범위의 문제다."
    - title: "2. 클러스터 선언"
      from: "Docker Image"
      to: "Kubernetes"
      route_label: "이미지와 원하는 복제본·서비스 상태를 Kubernetes 리소스로 선언한다."
      active_actors: [image, cluster]
      description: "Kubernetes는 여러 노드에서 선언한 desired state를 유지하려 한다."
      payload: ["Deployment", "Service", "desired state"]
      outcomes:
        - status: allow
          text: "노드 장애와 배포 변경을 자동화할 기반이 생긴다."
    - title: "3. 운영 자동화"
      from: "Kubernetes"
      to: "Replicas + Service"
      route_label: "컨트롤러가 Replica와 네트워크 라우팅을 현재 상태에 맞춰 조정한다."
      active_actors: [cluster, workload]
      description: "스케줄링·롤링 업데이트·자가 복구가 컨테이너 실행 위에 추가된다."
      payload: ["replicas", "rolling update", "self-healing"]
      outcomes:
        - status: info
          text: "Kubernetes를 도입할지는 운영 복잡성과 자동화 이득을 함께 비교한다."

reconciliation_loop:
  eyebrow: "Interactive flow"
  title: "Kubernetes Reconciliation Loop"
  summary: "사용자가 원하는 상태를 선언하면 컨트롤러가 실제 상태를 관찰하고 차이를 줄이는 작업을 반복한다."
  actors:
    - id: desired
      kind: "선언 상태"
      name: "Desired State"
      description: "Deployment YAML 등에 적은 원하는 복제본과 설정"
    - id: api
      kind: "상태 저장"
      name: "Kubernetes API"
      description: "리소스와 현재 상태를 조회·저장하는 API"
    - id: controller
      kind: "조정자"
      name: "Controller"
      description: "desired와 actual의 차이를 계산하는 구성요소"
    - id: actual
      kind: "실행 상태"
      name: "Actual Pods"
      description: "노드에서 실제 실행 중인 Pod 상태"
  steps:
    - title: "1. 원하는 상태 선언"
      from: "Desired State"
      to: "Kubernetes API"
      route_label: "사용자가 필요한 replica 수와 이미지 버전을 리소스로 선언한다."
      active_actors: [desired, api]
      description: "명령을 순서대로 실행하기보다 최종 상태를 시스템에 기록한다."
      payload: ["replicas = 3", "image tag", "manifest"]
      outcomes:
        - status: info
          text: "선언은 실행 절차가 아니라 목표 상태다."
    - title: "2. 차이 관찰"
      from: "Kubernetes API"
      to: "Controller"
      route_label: "컨트롤러가 API의 desired와 노드의 actual 상태를 비교한다."
      active_actors: [api, controller, actual]
      description: "Pod가 하나 죽었거나 버전이 다르면 조정이 필요한 차이가 생긴다."
      payload: ["desired", "actual", "diff"]
      outcomes:
        - status: warning
          text: "컨트롤러는 상태를 한 번 바꾸고 끝나지 않는다."
    - title: "3. 상태 조정"
      from: "Controller"
      to: "Actual Pods"
      route_label: "컨트롤러가 새 Pod 생성·삭제·교체로 actual을 desired에 맞춘다."
      active_actors: [controller, actual, api]
      description: "조정 뒤 다시 상태를 관찰하며 이벤트가 안정될 때까지 루프를 반복한다."
      payload: ["create", "replace", "reconcile"]
      outcomes:
        - status: allow
          text: "자가 복구와 롤링 업데이트가 같은 조정 원리 위에서 동작한다."

k8s_architecture:
  eyebrow: "Interactive flow"
  title: "Kubernetes 아키텍처"
  summary: "Control Plane이 클러스터 상태를 관리하고 Worker Node의 Kubelet이 Pod 실행을 담당한다."
  actors:
    - id: user
      kind: "사용자"
      name: "kubectl / Manifest"
      description: "클러스터에 원하는 상태를 전달하는 주체"
    - id: control
      kind: "관리 평면"
      name: "Control Plane"
      description: "API·스케줄러·컨트롤러로 상태를 관리하는 영역"
    - id: scheduler
      kind: "배치 결정"
      name: "Scheduler"
      description: "Pod를 어느 노드에 배치할지 결정"
    - id: worker
      kind: "실행 노드"
      name: "Worker Node / Kubelet"
      description: "선택된 Pod를 실제로 실행하고 상태를 보고하는 노드"
  steps:
    - title: "1. API 요청"
      from: "kubectl / Manifest"
      to: "Control Plane"
      route_label: "사용자가 매니페스트를 API Server에 제출한다."
      active_actors: [user, control]
      description: "클러스터의 리소스 상태가 중앙 API를 통해 기록된다."
      payload: ["manifest", "API Server", "desired state"]
      outcomes:
        - status: allow
          text: "컨트롤러와 스케줄러가 변경을 관찰할 수 있다."
    - title: "2. 노드 선택"
      from: "Control Plane"
      to: "Scheduler"
      route_label: "스케줄러가 리소스와 제약 조건을 보고 적절한 Worker Node를 고른다."
      active_actors: [control, scheduler, worker]
      description: "Pod는 임의로 실행되는 것이 아니라 클러스터 조건에 따라 배치된다."
      payload: ["resources", "taint", "node affinity"]
      outcomes:
        - status: info
          text: "스케줄링과 컨테이너 실행은 서로 다른 책임이다."
    - title: "3. Pod 실행"
      from: "Scheduler"
      to: "Worker Node / Kubelet"
      route_label: "Kubelet이 선택된 노드에서 Pod와 컨테이너를 실행하고 상태를 보고한다."
      active_actors: [scheduler, worker, control]
      description: "실행 결과가 다시 Control Plane에 반영되어 reconciliation의 입력이 된다."
      payload: ["Pod", "container runtime", "status report"]
      outcomes:
        - status: allow
          text: "관리 평면과 실행 노드가 상태 보고로 연결된다."

k8s_workload_hierarchy:
  eyebrow: "Interactive flow"
  title: "Deployment·ReplicaSet·Pod·Container 계층"
  summary: "Deployment가 배포 의도를 관리하고 ReplicaSet이 복제본 수를 유지하며 Pod 안에서 컨테이너가 실행된다."
  actors:
    - id: deployment
      kind: "배포 의도"
      name: "Deployment"
      description: "버전과 롤링 업데이트를 관리하는 상위 리소스"
    - id: replica
      kind: "복제 관리"
      name: "ReplicaSet"
      description: "원하는 Pod 복제본 수를 유지하는 리소스"
    - id: pod
      kind: "실행 단위"
      name: "Pod"
      description: "하나 이상의 컨테이너를 묶는 Kubernetes 단위"
    - id: container
      kind: "프로세스"
      name: "Container"
      description: "실제 애플리케이션 프로세스"
  steps:
    - title: "1. 배포 선언"
      from: "Deployment"
      to: "ReplicaSet"
      route_label: "Deployment가 이미지 버전과 원하는 Pod 수를 ReplicaSet에 반영한다."
      active_actors: [deployment, replica]
      description: "Deployment는 버전 변경과 롤링 전략 같은 상위 배포 의도를 가진다."
      payload: ["image tag", "replicas", "rollout"]
      outcomes:
        - status: info
          text: "Deployment가 컨테이너 프로세스를 직접 실행하는 것은 아니다."
    - title: "2. 복제본 유지"
      from: "ReplicaSet"
      to: "Pod"
      route_label: "ReplicaSet이 원하는 수만큼 같은 템플릿의 Pod를 유지한다."
      active_actors: [replica, pod]
      description: "Pod가 사라지면 ReplicaSet이 차이를 감지하고 새 Pod 생성을 요청한다."
      payload: ["desired replicas", "selector", "create Pod"]
      outcomes:
        - status: allow
          text: "복제본 수가 선언 상태에 맞춰진다."
    - title: "3. 컨테이너 실행"
      from: "Pod"
      to: "Container"
      route_label: "Pod가 스케줄된 노드에서 컨테이너 프로세스를 실행한다."
      active_actors: [pod, container, replica]
      description: "Pod는 컨테이너를 감싸는 네트워크·볼륨·생명주기 단위다."
      payload: ["container image", "network", "process"]
      outcomes:
        - status: info
          text: "Deployment·ReplicaSet·Pod·Container의 책임을 층별로 나눈다."

k8s_service_pod:
  eyebrow: "Interactive flow"
  title: "Kubernetes Service와 Pod 관계"
  summary: "Service가 안정적인 네트워크 진입점을 제공하고 label selector로 현재 준비된 Pod에 트래픽을 보낸다."
  actors:
    - id: client
      kind: "요청자"
      name: "Client"
      description: "서비스 이름이나 ClusterIP로 요청하는 클라이언트"
    - id: service
      kind: "진입점"
      name: "Service"
      description: "Pod 집합을 노출하는 안정적인 가상 엔드포인트"
    - id: selector
      kind: "선택 규칙"
      name: "Label Selector"
      description: "어떤 Pod를 backend로 묶을지 결정하는 규칙"
    - id: pods
      kind: "백엔드"
      name: "Ready Pods"
      description: "현재 준비 상태인 여러 Pod 인스턴스"
  steps:
    - title: "1. 서비스 요청"
      from: "Client"
      to: "Service"
      route_label: "클라이언트가 Pod IP가 아니라 Service의 안정적인 주소로 요청한다."
      active_actors: [client, service]
      description: "Pod는 교체될 수 있으므로 클라이언트가 개별 Pod 주소를 직접 알지 않게 한다."
      payload: ["ClusterIP", "DNS", "request"]
      outcomes:
        - status: allow
          text: "Pod 교체에도 서비스 진입점은 유지된다."
    - title: "2. label 선택"
      from: "Service"
      to: "Label Selector"
      route_label: "Service가 selector로 연결할 Pod의 label을 찾는다."
      active_actors: [service, selector, pods]
      description: "리소스 이름보다 label 관계가 실제 backend 집합을 결정한다."
      payload: ["app = api", "selector", "Endpoints"]
      outcomes:
        - status: info
          text: "label이 맞지 않으면 Service에 backend가 없을 수 있다."
    - title: "3. 준비된 Pod 전달"
      from: "Label Selector"
      to: "Ready Pods"
      route_label: "Service가 readiness 조건을 만족하는 Pod 중 하나로 요청을 전달한다."
      active_actors: [selector, pods, service]
      description: "실행 중인 것과 트래픽을 받을 준비가 된 것은 별도 상태다."
      payload: ["endpoint", "readiness", "load balance"]
      outcomes:
        - status: allow
          text: "Service는 현재 준비된 backend 집합을 기준으로 요청을 분산한다."

operator_gitops:
  eyebrow: "Interactive comparison"
  title: "Kubernetes CRD·Operator·GitOps 확장"
  summary: "CRD로 도메인 리소스를 정의하고 Operator가 조정하며 GitOps가 선언 상태의 변경 이력을 관리한다."
  actors:
    - id: git
      kind: "원본 선언"
      name: "Git Repository"
      description: "매니페스트와 운영 설정의 변경 이력"
    - id: crd
      kind: "확장 API"
      name: "CRD"
      description: "Kubernetes API에 추가한 도메인 리소스 종류"
    - id: operator
      kind: "도메인 조정"
      name: "Operator"
      description: "CRD의 desired state를 실제 리소스로 조정하는 컨트롤러"
    - id: cluster
      kind: "실행 결과"
      name: "Cluster Resources"
      description: "Pod·Service·외부 시스템에 반영된 상태"
  steps:
    - title: "1. Git 선언"
      from: "Git Repository"
      to: "CRD"
      route_label: "운영자가 Git에 사용자 정의 리소스와 원하는 설정을 선언한다."
      active_actors: [git, crd]
      description: "Git은 변경 검토·이력·복구의 기준이 되는 선언 원본이다."
      payload: ["manifest", "review", "desired state"]
      outcomes:
        - status: info
          text: "Git 파일이 곧 클러스터의 현재 상태라는 뜻은 아니다."
    - title: "2. Operator 조정"
      from: "CRD"
      to: "Operator"
      route_label: "Operator가 CRD를 관찰하고 도메인 규칙에 맞는 리소스를 계산한다."
      active_actors: [crd, operator]
      description: "단순 YAML 적용을 넘어 데이터베이스·메시지·외부 시스템 같은 도메인 작업을 자동화한다."
      payload: ["watch", "reconcile", "domain logic"]
      outcomes:
        - status: allow
          text: "도메인 운영 규칙이 컨트롤러로 캡슐화된다."
    - title: "3. 클러스터 반영"
      from: "Operator"
      to: "Cluster Resources"
      route_label: "Operator가 생성·변경·삭제를 수행해 클러스터 실제 상태를 원하는 상태에 맞춘다."
      active_actors: [operator, cluster, git]
      description: "반영 결과를 다시 관찰하고 drift가 생기면 조정을 반복한다."
      payload: ["resources", "status", "drift correction"]
      outcomes:
        - status: info
          text: "CRD·Operator·GitOps는 선언·조정·변경 관리의 책임을 나눈다."

rag_openbook:
  eyebrow: "Interactive comparison"
  title: "RAG를 오픈북 시험으로 이해하기"
  summary: "모델이 모든 사실을 암기한다고 가정하지 않고 질문마다 관련 자료를 찾아 근거를 펼쳐 본다."
  actors:
    - id: question
      kind: "질문"
      name: "Question"
      description: "답을 알고 싶은 사용자의 질문"
    - id: search
      kind: "자료 찾기"
      name: "Retrieve Notes"
      description: "관련 페이지와 문단을 찾는 단계"
    - id: context
      kind: "오픈북 자료"
      name: "Context"
      description: "답변 전에 모델에 제공하는 근거 묶음"
    - id: answer
      kind: "답안"
      name: "Generated Answer"
      description: "근거를 사용해 작성한 답변"
  steps:
    - title: "1. 질문 접수"
      from: "Question"
      to: "Retrieve Notes"
      route_label: "사용자의 질문을 검색 요청으로 바꾼다."
      active_actors: [question, search]
      description: "모델 파라미터 기억만으로 답하지 않고 필요한 자료를 먼저 찾는다."
      payload: ["question", "query", "intent"]
      outcomes:
        - status: info
          text: "검색 질의가 원래 질문의 의도를 잃지 않게 한다."
    - title: "2. 근거 펼치기"
      from: "Retrieve Notes"
      to: "Context"
      route_label: "질문과 관련된 문서와 문단을 컨텍스트로 모은다."
      active_actors: [search, context]
      description: "오픈북의 펼친 페이지가 답변의 근거 범위를 정한다."
      payload: ["top-k", "chunks", "metadata"]
      outcomes:
        - status: allow
          text: "답변에 사용할 자료가 명시적인 입력으로 들어간다."
    - title: "3. 근거로 답하기"
      from: "Context"
      to: "Generated Answer"
      route_label: "모델이 컨텍스트를 참고해 답변과 필요한 출처를 작성한다."
      active_actors: [context, answer, question]
      description: "검색된 자료와 답변이 실제로 일치하는지 평가한다."
      payload: ["context", "grounded answer", "source"]
      outcomes:
        - status: info
          text: "검색 결과가 부정확하면 생성 단계 이전에 문제를 수정한다."

rag_pipeline:
  eyebrow: "Interactive flow"
  title: "RAG 전체 파이프라인"
  summary: "문서를 수집·청킹·임베딩해 저장하고 질문 시 검색 결과를 LLM 컨텍스트로 넣는다."
  actors:
    - id: ingest
      kind: "수집"
      name: "Documents"
      description: "원문 문서와 메타데이터"
    - id: index
      kind: "인덱싱"
      name: "Chunk / Vector DB"
      description: "검색을 위해 분할·벡터화한 저장소"
    - id: retrieve
      kind: "질의 검색"
      name: "Retriever"
      description: "질문과 가까운 청크를 찾는 구성요소"
    - id: llm
      kind: "생성"
      name: "LLM"
      description: "검색 근거를 이용해 답변을 생성하는 모델"
  steps:
    - title: "1. 문서 인덱싱"
      from: "Documents"
      to: "Chunk / Vector DB"
      route_label: "문서를 청크로 나누고 embedding과 메타데이터를 저장한다."
      active_actors: [ingest, index]
      description: "질문이 들어오기 전에 검색 가능한 지식 색인을 준비한다."
      payload: ["chunk", "embedding", "metadata"]
      outcomes:
        - status: allow
          text: "원문이 검색 단계에서 빠르게 접근할 수 있는 형태가 된다."
    - title: "2. 관련 청크 검색"
      from: "Chunk / Vector DB"
      to: "Retriever"
      route_label: "질문 embedding과 가까운 청크를 top-k로 검색한다."
      active_actors: [index, retrieve]
      description: "벡터 유사도·키워드·필터를 조합해 관련 근거를 좁힌다."
      payload: ["query vector", "similarity", "top-k"]
      outcomes:
        - status: info
          text: "검색 품질이 낮으면 생성 모델보다 색인과 청크를 먼저 점검한다."
    - title: "3. 컨텍스트 생성"
      from: "Retriever"
      to: "LLM"
      route_label: "검색 결과를 프롬프트 컨텍스트로 넣어 답변을 만든다."
      active_actors: [retrieve, llm, ingest]
      description: "RAG는 검색과 생성을 연결해 최신·도메인 근거를 제공한다."
      payload: ["context window", "prompt", "answer"]
      outcomes:
        - status: info
          text: "컨텍스트 길이와 출처 전달 방식도 품질 요소다."

chunk_size:
  eyebrow: "Interactive comparison"
  title: "RAG 청크 크기 선택"
  summary: "너무 작은 청크는 맥락을 잃고 너무 큰 청크는 검색 정밀도와 컨텍스트 비용을 높일 수 있다."
  actors:
    - id: document
      kind: "원문"
      name: "Document"
      description: "섹션과 문단으로 구성된 원본 자료"
    - id: small
      kind: "작은 청크"
      name: "Small Chunks"
      description: "짧고 정밀하지만 주변 맥락이 적은 조각"
    - id: large
      kind: "큰 청크"
      name: "Large Chunks"
      description: "맥락은 풍부하지만 관련 없는 내용이 섞일 수 있는 조각"
    - id: retrieval
      kind: "검색 품질"
      name: "Retrieval Quality"
      description: "관련성·완결성·비용의 균형"
  steps:
    - title: "1. 원문 분할"
      from: "Document"
      to: "Small Chunks"
      route_label: "문서를 의미 단위와 길이 기준으로 나누어 청크 후보를 만든다."
      active_actors: [document, small, large]
      description: "문장 중간을 무작정 자르기보다 제목·문단·코드 경계를 고려한다."
      payload: ["section", "paragraph", "overlap"]
      outcomes:
        - status: info
          text: "청크 크기는 문서 형식과 질문 유형에 맞춰 조정한다."
    - title: "2. 작은 청크"
      from: "Small Chunks"
      to: "Retrieval Quality"
      route_label: "작은 청크는 검색 후보를 정밀하게 좁히지만 필요한 앞뒤 설명을 잃을 수 있다."
      active_actors: [small, retrieval]
      description: "정밀한 검색과 낮은 컨텍스트 비용의 장점이 있다."
      payload: ["precision", "less context", "lower tokens"]
      outcomes:
        - status: warning
          text: "질문에 필요한 정의와 예시가 서로 다른 청크로 갈라질 수 있다."
    - title: "3. 큰 청크"
      from: "Large Chunks"
      to: "Retrieval Quality"
      route_label: "큰 청크는 맥락을 보존하지만 관련 없는 문장과 토큰 비용도 함께 늘어난다."
      active_actors: [large, retrieval]
      description: "검색 결과의 완결성과 컨텍스트 비용 사이에서 균형을 잡는다."
      payload: ["context", "recall", "token cost"]
      outcomes:
        - status: info
          text: "고정된 정답 크기보다 평가 데이터로 청크 전략을 검증한다."

search_quality:
  eyebrow: "Interactive flow"
  title: "RAG 검색 품질 보강 스택"
  summary: "임베딩 검색 위에 메타데이터 필터·키워드 검색·재순위화·평가를 더해 근거 품질을 높인다."
  actors:
    - id: query
      kind: "질의"
      name: "User Query"
      description: "답을 찾기 위한 질문"
    - id: vector
      kind: "1차 검색"
      name: "Vector Search"
      description: "의미 유사도로 후보를 찾는 단계"
    - id: hybrid
      kind: "보강 검색"
      name: "Hybrid + Filter"
      description: "키워드·메타데이터 조건을 결합하는 단계"
    - id: rerank
      kind: "정밀화"
      name: "Reranker / Eval"
      description: "후보 순서를 다시 정하고 품질을 평가하는 단계"
  steps:
    - title: "1. 의미 후보 검색"
      from: "User Query"
      to: "Vector Search"
      route_label: "질문 embedding으로 의미적으로 가까운 문서 후보를 찾는다."
      active_actors: [query, vector]
      description: "표현이 달라도 같은 의미의 문서를 후보에 포함할 수 있다."
      payload: ["embedding", "similarity", "top-k"]
      outcomes:
        - status: info
          text: "벡터 검색만으로 고유명사·날짜·정확한 조건이 충분하지 않을 수 있다."
    - title: "2. 조건 결합"
      from: "Vector Search"
      to: "Hybrid + Filter"
      route_label: "키워드와 날짜·권한·문서 유형 필터를 후보 검색에 더한다."
      active_actors: [vector, hybrid, query]
      description: "의미 유사도와 정확한 조건을 함께 사용해 검색 범위를 다듬는다."
      payload: ["keyword", "metadata", "hybrid"]
      outcomes:
        - status: allow
          text: "업무 질문의 정확한 조건을 놓칠 가능성을 줄인다."
    - title: "3. 재순위화와 평가"
      from: "Hybrid + Filter"
      to: "Reranker / Eval"
      route_label: "후보를 다시 순위화하고 질문별 정답·근거 데이터로 검색 품질을 평가한다."
      active_actors: [hybrid, rerank, query]
      description: "검색 파이프라인의 변경은 생성 답변이 아니라 검색 지표로도 검증한다."
      payload: ["rerank", "recall", "precision", "ground truth"]
      outcomes:
        - status: info
          text: "검색 품질을 정량화하면 청크·모델·필터 변경을 비교할 수 있다."

rag_evaluation:
  eyebrow: "Interactive comparison"
  title: "RAG 평가 구조"
  summary: "검색된 근거의 관련성과 답변의 충실성·정확성을 서로 다른 단계로 평가한다."
  actors:
    - id: dataset
      kind: "평가 데이터"
      name: "Question Set"
      description: "질문·정답·근거가 준비된 평가 사례"
    - id: retrieval
      kind: "검색 평가"
      name: "Retrieval Metrics"
      description: "관련 문서가 후보에 들어왔는지 측정하는 지표"
    - id: generation
      kind: "생성 평가"
      name: "Answer Metrics"
      description: "답변 정확성·충실성·인용을 평가하는 지표"
    - id: improvement
      kind: "개선"
      name: "Pipeline Changes"
      description: "청크·검색·프롬프트를 바꾸는 작업"
  steps:
    - title: "1. 질문 세트 준비"
      from: "Question Set"
      to: "Retrieval Metrics"
      route_label: "대표 질문과 기대 근거를 평가 데이터로 고정한다."
      active_actors: [dataset, retrieval]
      description: "같은 질문 세트가 검색 전략 변경의 비교 기준이 된다."
      payload: ["query", "relevant docs", "ground truth"]
      outcomes:
        - status: info
          text: "평가 질문이 실제 사용 패턴을 대표하는지 확인한다."
    - title: "2. 검색 평가"
      from: "Retrieval Metrics"
      to: "Answer Metrics"
      route_label: "관련 근거가 top-k 안에 들어왔는지와 검색 순서를 측정한다."
      active_actors: [retrieval, generation]
      description: "검색에 근거가 없으면 답변 평가에서 생성 모델을 탓하기 전에 파이프라인을 고친다."
      payload: ["recall", "precision", "rank"]
      outcomes:
        - status: allow
          text: "검색 실패와 생성 실패를 분리해서 볼 수 있다."
    - title: "3. 답변 평가와 개선"
      from: "Answer Metrics"
      to: "Pipeline Changes"
      route_label: "정확성·충실성·인용 결과를 보고 청크·검색·프롬프트를 개선한다."
      active_actors: [generation, improvement, dataset]
      description: "한 단계의 점수만 올리기보다 전체 질의 흐름을 다시 평가한다."
      payload: ["faithfulness", "correctness", "iteration"]
      outcomes:
        - status: info
          text: "변경 후 같은 평가 세트로 회귀를 확인한다."

rag_ops:
  eyebrow: "Interactive flow"
  title: "RAG 운영 루프"
  summary: "문서 변화와 질의 품질을 관찰하고 실패한 답변을 분석해 색인·검색·프롬프트를 갱신한다."
  actors:
    - id: ingest
      kind: "지식 갱신"
      name: "Document Ingestion"
      description: "새 문서와 변경된 문서를 색인하는 과정"
    - id: query
      kind: "사용 요청"
      name: "Production Queries"
      description: "실제 사용자의 질문과 응답"
    - id: observe
      kind: "운영 관측"
      name: "Quality / Cost Signals"
      description: "검색·응답 품질, 지연, 토큰 비용 지표"
    - id: improve
      kind: "개선"
      name: "Index / Prompt Update"
      description: "청크·모델·프롬프트를 조정하는 변경"
  steps:
    - title: "1. 지식 갱신"
      from: "Document Ingestion"
      to: "Production Queries"
      route_label: "새 문서와 변경 문서를 청크·임베딩해 최신 지식으로 반영한다."
      active_actors: [ingest, query]
      description: "오래된 색인은 답변의 최신성을 떨어뜨릴 수 있다."
      payload: ["new docs", "re-index", "version"]
      outcomes:
        - status: allow
          text: "운영 검색이 최신 원문을 참조할 수 있다."
    - title: "2. 질의 관찰"
      from: "Production Queries"
      to: "Quality / Cost Signals"
      route_label: "검색 근거·답변 평가·지연·비용과 사용자 피드백을 수집한다."
      active_actors: [query, observe]
      description: "운영 품질은 모델 응답만이 아니라 검색과 비용까지 포함한다."
      payload: ["feedback", "latency", "token cost", "no answer"]
      outcomes:
        - status: info
          text: "실패 질의를 모아 재현 가능한 평가 사례로 만든다."
    - title: "3. 파이프라인 개선"
      from: "Quality / Cost Signals"
      to: "Index / Prompt Update"
      route_label: "관찰된 문제를 청크·검색·프롬프트·모델 변경으로 연결하고 다시 배포한다."
      active_actors: [observe, improve, ingest]
      description: "변경 후 같은 운영 지표와 평가 세트로 효과와 회귀를 확인한다."
      payload: ["chunking", "retrieval", "prompt", "A/B"]
      outcomes:
        - status: info
          text: "RAG 운영은 한 번 만든 색인으로 끝나는 기능이 아니라 반복 루프다."

localhost_service:
  eyebrow: "Interactive comparison"
  title: "Docker Compose의 localhost와 service name"
  summary: "컨테이너 안에서 localhost는 자기 컨테이너를 가리키고 다른 서비스는 Compose 네트워크의 서비스 이름으로 찾는다."
  actors:
    - id: app
      kind: "호출 서비스"
      name: "Spring App Container"
      description: "다른 컨테이너에 연결하려는 애플리케이션"
    - id: local
      kind: "자기 자신"
      name: "localhost"
      description: "현재 컨테이너의 네트워크 네임스페이스"
    - id: dns
      kind: "서비스 발견"
      name: "Compose DNS"
      description: "서비스 이름을 컨테이너 주소로 해석하는 네트워크"
    - id: db
      kind: "대상 서비스"
      name: "Database Service"
      description: "Compose에 정의된 DB 컨테이너"
  steps:
    - title: "1. localhost 해석"
      from: "Spring App Container"
      to: "localhost"
      route_label: "앱 컨테이너에서 localhost는 앱 컨테이너 자신을 가리킨다."
      active_actors: [app, local]
      description: "호스트 머신의 DB나 다른 컨테이너를 자동으로 의미하지 않는다."
      payload: ["127.0.0.1", "same container", "port"]
      outcomes:
        - status: warning
          text: "컨테이너 간 연결에 localhost를 쓰면 대상 서비스를 찾지 못할 수 있다."
    - title: "2. 서비스 이름 조회"
      from: "Spring App Container"
      to: "Compose DNS"
      route_label: "앱이 DB 컨테이너의 Compose 서비스 이름으로 주소를 조회한다."
      active_actors: [app, dns]
      description: "Compose 네트워크가 서비스 이름을 내부 주소로 해석한다."
      payload: ["db", "DNS", "compose network"]
      outcomes:
        - status: allow
          text: "컨테이너가 재생성되어 IP가 바뀌어도 이름 기반 연결을 유지한다."
    - title: "3. DB 연결"
      from: "Compose DNS"
      to: "Database Service"
      route_label: "해석된 서비스 주소와 포트로 DB 컨테이너에 연결한다."
      active_actors: [dns, db, app]
      description: "환경별 호스트명과 포트 설정을 실행 위치에 맞춰 관리한다."
      payload: ["db:5432", "connection", "service-to-service"]
      outcomes:
        - status: info
          text: "호스트 실행과 컨테이너 실행의 네트워크 주소는 다를 수 있다."

blue_green_lb:
  eyebrow: "Interactive comparison"
  title: "Nginx 로드 밸런싱과 Blue-Green 배포"
  summary: "로드 밸런싱은 여러 인스턴스에 요청을 나누고 Blue-Green은 트래픽 대상을 통째로 전환해 릴리스를 바꾼다."
  actors:
    - id: nginx
      kind: "진입점"
      name: "Nginx Upstream"
      description: "백엔드 그룹으로 요청을 전달하는 프록시"
    - id: blue
      kind: "기존 버전"
      name: "Blue Environment"
      description: "현재 서비스 중인 버전"
    - id: green
      kind: "새 버전"
      name: "Green Environment"
      description: "검증 후 트래픽을 받을 새 버전"
    - id: client
      kind: "사용자"
      name: "Client Traffic"
      description: "외부에서 들어오는 요청"
  steps:
    - title: "1. 업스트림 분산"
      from: "Client Traffic"
      to: "Nginx Upstream"
      route_label: "Nginx가 요청을 upstream에 등록된 여러 백엔드로 전달한다."
      active_actors: [client, nginx]
      description: "로드 밸런싱은 같은 버전의 여러 인스턴스에 부하를 나누는 문제다."
      payload: ["proxy_pass", "upstream", "health"]
      outcomes:
        - status: allow
          text: "인스턴스 수와 상태에 따라 요청을 분산할 수 있다."
    - title: "2. Blue 운영"
      from: "Nginx Upstream"
      to: "Blue Environment"
      route_label: "현재 upstream이 Blue 버전으로 요청을 전달한다."
      active_actors: [nginx, blue, client]
      description: "사용자는 현재 배포 버전의 서비스 응답을 받는다."
      payload: ["Blue", "active traffic", "current release"]
      outcomes:
        - status: info
          text: "새 버전을 준비하는 동안 기존 버전은 계속 서비스할 수 있다."
    - title: "3. Green 전환"
      from: "Nginx Upstream"
      to: "Green Environment"
      route_label: "Green 검증이 끝나면 upstream 대상과 트래픽을 새 버전으로 전환한다."
      active_actors: [nginx, green, blue, client]
      description: "Blue-Green은 인스턴스별 분산보다 버전 단위 전환과 롤백을 강조한다."
      payload: ["switch", "Green", "rollback target"]
      outcomes:
        - status: allow
          text: "문제가 있으면 Nginx 대상을 Blue로 되돌리는 롤백이 가능하다."

compose_k8s:
  eyebrow: "Interactive flow"
  title: "Docker Compose에서 Kubernetes로"
  summary: "Compose의 서비스 묶음을 클러스터 리소스와 선언 상태로 확장해 복제·복구·배포를 관리한다."
  actors:
    - id: compose
      kind: "개발 구성"
      name: "Docker Compose"
      description: "여러 컨테이너를 함께 실행하는 구성 파일"
    - id: manifest
      kind: "선언 리소스"
      name: "K8s Manifests"
      description: "Deployment·Service 등 클러스터 리소스 선언"
    - id: cluster
      kind: "관리 영역"
      name: "Kubernetes Cluster"
      description: "노드와 컨트롤러가 있는 실행 환경"
    - id: app
      kind: "운영 서비스"
      name: "Replicated Application"
      description: "여러 Pod로 실행되고 복구되는 애플리케이션"
  steps:
    - title: "1. 로컬 서비스 묶기"
      from: "Docker Compose"
      to: "K8s Manifests"
      route_label: "Compose의 이미지·환경·네트워크 구성을 Kubernetes 리소스로 재구성한다."
      active_actors: [compose, manifest]
      description: "실행 명령을 그대로 옮기기보다 운영 중 원하는 상태를 정의한다."
      payload: ["services", "image", "env"]
      outcomes:
        - status: info
          text: "Compose와 Kubernetes는 같은 추상화 수준의 도구가 아니다."
    - title: "2. 클러스터 적용"
      from: "K8s Manifests"
      to: "Kubernetes Cluster"
      route_label: "매니페스트를 API에 적용해 Deployment와 Service를 만든다."
      active_actors: [manifest, cluster]
      description: "클러스터가 원하는 상태를 저장하고 컨트롤러가 실행을 조정한다."
      payload: ["apply", "Deployment", "Service"]
      outcomes:
        - status: allow
          text: "노드 단위 실행에서 클러스터 단위 관리로 범위가 넓어진다."
    - title: "3. 운영 상태 유지"
      from: "Kubernetes Cluster"
      to: "Replicated Application"
      route_label: "컨트롤러가 복제본·스케줄링·롤링 업데이트·복구를 수행한다."
      active_actors: [cluster, app, manifest]
      description: "Kubernetes를 도입하는 목적은 컨테이너 생성 자체보다 운영 자동화에 있다."
      payload: ["replicas", "self-healing", "rollout"]
      outcomes:
        - status: info
          text: "필요한 자동화 수준과 운영 복잡성을 함께 비교한다."

nginx_reverse:
  eyebrow: "Interactive flow"
  title: "Nginx Reverse Proxy 구조"
  summary: "클라이언트는 Nginx에 접속하고 Nginx가 정적 파일과 Spring Boot 백엔드 요청을 적절한 대상으로 전달한다."
  actors:
    - id: client
      kind: "외부 요청"
      name: "Client"
      description: "브라우저와 API 클라이언트"
    - id: nginx
      kind: "앞단 프록시"
      name: "Nginx"
      description: "TLS·정적 파일·reverse proxy를 담당하는 진입점"
    - id: static
      kind: "정적 응답"
      name: "Static Assets"
      description: "이미지·CSS·JS처럼 Nginx가 직접 제공하는 파일"
    - id: app
      kind: "애플리케이션"
      name: "Spring Boot"
      description: "동적 API와 비즈니스 로직을 처리하는 서버"
  steps:
    - title: "1. 단일 진입점"
      from: "Client"
      to: "Nginx"
      route_label: "클라이언트의 HTTP·HTTPS 요청이 먼저 Nginx로 들어온다."
      active_actors: [client, nginx]
      description: "외부 요청과 내부 애플리케이션을 분리하는 앞단 경계다."
      payload: ["HTTP", "TLS", "host/path"]
      outcomes:
        - status: info
          text: "클라이언트가 Spring Boot의 내부 포트와 직접 결합하지 않는다."
    - title: "2. 정적 파일 처리"
      from: "Nginx"
      to: "Static Assets"
      route_label: "파일 요청은 Nginx가 직접 캐시·압축해 응답한다."
      active_actors: [nginx, static, client]
      description: "정적 응답과 동적 처리를 나누면 애플리케이션 서버의 부담을 줄일 수 있다."
      payload: ["CSS", "JS", "image"]
      outcomes:
        - status: allow
          text: "정적 콘텐츠가 애플리케이션 로직을 거치지 않는다."
    - title: "3. 동적 프록시"
      from: "Nginx"
      to: "Spring Boot"
      route_label: "API 요청은 내부 upstream으로 전달되어 Spring Boot가 처리한다."
      active_actors: [nginx, app, client]
      description: "Nginx는 외부 TLS·라우팅과 애플리케이션의 비즈니스 처리를 분리한다."
      payload: ["proxy_pass", "upstream", "API"]
      outcomes:
        - status: allow
          text: "앞단과 앱 서버의 책임이 나뉜다."

nginx_comparison:
  eyebrow: "Interactive comparison"
  title: "Nginx가 없는 구조와 있는 구조"
  summary: "Nginx를 앞에 두면 외부 TLS·정적 파일·라우팅과 Spring Boot의 동적 처리를 분리할 수 있다."
  actors:
    - id: client
      kind: "클라이언트"
      name: "Client"
      description: "서비스에 접속하는 외부 요청"
    - id: direct
      kind: "직접 연결"
      name: "Spring Boot Direct"
      description: "애플리케이션 서버가 외부 요청을 직접 받는 구조"
    - id: proxy
      kind: "프록시 구조"
      name: "Nginx"
      description: "외부 진입점과 라우팅을 맡는 앞단"
    - id: backend
      kind: "내부 처리"
      name: "Backend App"
      description: "내부 네트워크에서 동적 요청을 처리하는 앱"
  steps:
    - title: "1. 직접 연결"
      from: "Client"
      to: "Spring Boot Direct"
      route_label: "클라이언트가 애플리케이션 서버의 외부 포트에 직접 연결한다."
      active_actors: [client, direct]
      description: "TLS·정적 파일·외부 라우팅과 비즈니스 처리의 책임이 한 서버에 모일 수 있다."
      payload: ["public port", "app server", "direct"]
      outcomes:
        - status: warning
          text: "확장과 변경 시 외부 계약이 애플리케이션에 더 강하게 묶인다."
    - title: "2. Nginx 경계 추가"
      from: "Client"
      to: "Nginx"
      route_label: "클라이언트가 Nginx에 연결하고 Nginx가 내부 서버를 추상화한다."
      active_actors: [client, proxy]
      description: "TLS 종료·정적 파일·접근 제어·라우팅을 앞단에서 처리할 수 있다."
      payload: ["TLS termination", "static", "routing"]
      outcomes:
        - status: allow
          text: "외부 진입점과 내부 앱을 분리한다."
    - title: "3. 내부 앱 전달"
      from: "Nginx"
      to: "Backend App"
      route_label: "동적 요청만 내부 네트워크의 Backend App으로 전달한다."
      active_actors: [proxy, backend, client]
      description: "프록시를 두는 이유는 계층을 늘리는 것이 아니라 책임과 운영 경계를 나누는 데 있다."
      payload: ["reverse proxy", "private network", "API"]
      outcomes:
        - status: info
          text: "서비스 요구사항에 맞을 때만 앞단 계층의 복잡성을 추가한다."

cicd_initial:
  eyebrow: "Interactive comparison"
  title: "처음 이해한 CI/CD 흐름"
  summary: "코드 변경을 감지해 빌드·테스트·이미지 생성·배포를 자동으로 이어 붙인다."
  actors:
    - id: commit
      kind: "변경"
      name: "Git Commit"
      description: "개발자가 저장소에 푸시한 코드 변경"
    - id: ci
      kind: "검증"
      name: "CI Pipeline"
      description: "빌드·테스트·정적 검사를 수행하는 단계"
    - id: artifact
      kind: "패키지"
      name: "Artifact / Image"
      description: "배포할 JAR·Docker 이미지·패키지"
    - id: cd
      kind: "전달"
      name: "CD Deploy"
      description: "대상 환경에 아티팩트를 반영하는 단계"
  steps:
    - title: "1. 코드 변경"
      from: "Git Commit"
      to: "CI Pipeline"
      route_label: "저장소 변경 이벤트가 CI 파이프라인을 시작한다."
      active_actors: [commit, ci]
      description: "자동화는 사람이 하던 반복적인 검증을 변경 이벤트에 연결한다."
      payload: ["push", "pull request", "trigger"]
      outcomes:
        - status: info
          text: "파이프라인 시작과 검증 성공은 별도 상태다."
    - title: "2. 빌드와 테스트"
      from: "CI Pipeline"
      to: "Artifact / Image"
      route_label: "코드를 빌드하고 테스트를 통과한 결과를 패키징한다."
      active_actors: [ci, artifact]
      description: "배포할 수 있는 동일한 아티팩트를 만드는 것이 다음 단계의 기준이다."
      payload: ["build", "test", "package"]
      outcomes:
        - status: allow
          text: "검증되지 않은 코드가 배포 단계로 넘어가지 않는다."
    - title: "3. 배포 전달"
      from: "Artifact / Image"
      to: "CD Deploy"
      route_label: "검증된 아티팩트를 스테이징이나 운영 환경에 배포한다."
      active_actors: [artifact, cd]
      description: "배포 뒤 실제 서비스 준비 상태는 헬스 체크와 스모크 테스트로 확인한다."
      payload: ["registry", "environment", "release"]
      outcomes:
        - status: info
          text: "CI 성공과 서비스 정상 응답을 같은 결과로 취급하지 않는다."

container_health:
  eyebrow: "Interactive comparison"
  title: "컨테이너 실행과 서비스 정상 응답"
  summary: "컨테이너 프로세스가 떠 있는 것과 애플리케이션이 요청을 처리할 준비가 된 것은 다르다."
  actors:
    - id: runtime
      kind: "프로세스"
      name: "Container Running"
      description: "컨테이너 프로세스가 종료되지 않은 상태"
    - id: app
      kind: "애플리케이션"
      name: "Application Startup"
      description: "설정·DB·의존성을 로드하는 시작 단계"
    - id: health
      kind: "준비 판정"
      name: "Health Check"
      description: "실제로 요청 가능한지를 확인하는 검사"
    - id: traffic
      kind: "사용자 요청"
      name: "Service Traffic"
      description: "로드 밸런서가 전달하는 실제 트래픽"
  steps:
    - title: "1. 컨테이너 실행"
      from: "Container Running"
      to: "Application Startup"
      route_label: "컨테이너 런타임이 애플리케이션 프로세스를 시작한다."
      active_actors: [runtime, app]
      description: "프로세스가 살아 있다는 사실만으로 내부 초기화가 끝난 것은 아니다."
      payload: ["process", "PID", "container status"]
      outcomes:
        - status: info
          text: "실행 상태와 준비 상태를 구분한다."
    - title: "2. 헬스 확인"
      from: "Application Startup"
      to: "Health Check"
      route_label: "헬스 엔드포인트가 의존성 연결과 요청 처리 가능 여부를 확인한다."
      active_actors: [app, health]
      description: "DB 연결 실패나 설정 오류가 있으면 프로세스가 떠도 준비 실패일 수 있다."
      payload: ["readiness", "dependency", "HTTP 200"]
      outcomes:
        - status: allow
          text: "검사 통과 후에만 트래픽을 받도록 연결한다."
    - title: "3. 트래픽 전달"
      from: "Health Check"
      to: "Service Traffic"
      route_label: "준비된 인스턴스에 실제 서비스 요청을 보낸다."
      active_actors: [health, traffic, runtime]
      description: "배포 검증은 실행·준비·실제 응답의 세 층위를 확인해야 한다."
      payload: ["load balancer", "smoke test", "response"]
      outcomes:
        - status: info
          text: "컨테이너가 실행되었다는 로그만으로 배포를 완료하지 않는다."

single_ec2:
  eyebrow: "Interactive flow"
  title: "단일 EC2 배포 구조"
  summary: "외부 요청이 하나의 EC2에서 Nginx와 애플리케이션을 거쳐 처리되는 단순한 배포 구조다."
  actors:
    - id: client
      kind: "외부 요청"
      name: "Client"
      description: "서비스를 사용하는 브라우저·API 클라이언트"
    - id: nginx
      kind: "진입점"
      name: "Nginx"
      description: "EC2 앞단의 reverse proxy"
    - id: ec2
      kind: "서버"
      name: "Single EC2"
      description: "애플리케이션이 실행되는 단일 인스턴스"
    - id: app
      kind: "실행 프로세스"
      name: "Spring Boot"
      description: "동적 요청을 처리하는 애플리케이션"
  steps:
    - title: "1. 외부 진입"
      from: "Client"
      to: "Nginx"
      route_label: "클라이언트 요청이 EC2의 Nginx 포트로 들어온다."
      active_actors: [client, nginx]
      description: "Nginx가 TLS와 외부 요청 경계를 담당한다."
      payload: ["HTTPS", "domain", "request"]
      outcomes:
        - status: allow
          text: "외부 요청이 단일 서버의 앞단에 도착한다."
    - title: "2. 내부 프록시"
      from: "Nginx"
      to: "Spring Boot"
      route_label: "Nginx가 내부 포트의 Spring Boot 프로세스로 동적 요청을 전달한다."
      active_actors: [nginx, ec2, app]
      description: "한 EC2 안에서도 프록시와 애플리케이션의 역할을 나눌 수 있다."
      payload: ["proxy_pass", "localhost port", "API"]
      outcomes:
        - status: info
          text: "구조는 단순하지만 서버 장애 시 전체 서비스 영향이 커진다."
    - title: "3. 단일 장애 경계"
      from: "Single EC2"
      to: "Client"
      route_label: "EC2가 정상인 동안 응답을 제공하고 인스턴스 장애 시 복구가 필요하다."
      active_actors: [ec2, app, client]
      description: "단일 인스턴스는 초기 비용이 낮지만 고가용성과 확장에는 한계가 있다."
      payload: ["single instance", "availability", "recovery"]
      outcomes:
        - status: warning
          text: "다음 단계에서 Auto Scaling과 다중 인스턴스를 검토할 이유가 생긴다."

asg_rolling:
  eyebrow: "Interactive flow"
  title: "ASG 롤링 배포"
  summary: "Auto Scaling Group에서 새 버전을 일부씩 교체하고 헬스 체크를 통과한 인스턴스만 트래픽에 남긴다."
  actors:
    - id: release
      kind: "새 버전"
      name: "New AMI / Image"
      description: "배포할 새로운 애플리케이션 버전"
    - id: asg
      kind: "인스턴스 관리"
      name: "Auto Scaling Group"
      description: "원하는 인스턴스 수와 교체 정책을 관리"
    - id: health
      kind: "검증"
      name: "Health Check"
      description: "새 인스턴스가 요청을 처리할 수 있는지 확인"
    - id: traffic
      kind: "트래픽"
      name: "Load Balancer"
      description: "정상 인스턴스에만 요청을 전달하는 계층"
  steps:
    - title: "1. 교체 시작"
      from: "New AMI / Image"
      to: "Auto Scaling Group"
      route_label: "새 이미지로 일부 인스턴스를 순차적으로 생성·교체한다."
      active_actors: [release, asg]
      description: "한 번에 전체를 내리지 않고 배포 중 서비스 여유를 유지한다."
      payload: ["new version", "batch", "desired capacity"]
      outcomes:
        - status: info
          text: "교체 속도와 동시에 유지할 용량을 정책으로 정한다."
    - title: "2. 새 인스턴스 검증"
      from: "Auto Scaling Group"
      to: "Health Check"
      route_label: "새 인스턴스가 애플리케이션 시작과 헬스 체크를 통과하는지 확인한다."
      active_actors: [asg, health]
      description: "검증 전 인스턴스에 트래픽을 보내면 배포 중 오류가 노출될 수 있다."
      payload: ["startup", "readiness", "instance status"]
      outcomes:
        - status: allow
          text: "정상 상태의 인스턴스만 다음 단계로 승격된다."
    - title: "3. 트래픽 유지"
      from: "Health Check"
      to: "Load Balancer"
      route_label: "정상 인스턴스에 트래픽을 연결하고 기존 인스턴스를 순차적으로 내린다."
      active_actors: [health, traffic, asg]
      description: "실패하면 교체를 멈추거나 이전 버전으로 되돌리는 전략이 필요하다."
      payload: ["target group", "drain", "rollback"]
      outcomes:
        - status: info
          text: "롤링 배포는 용량과 복구 시간을 함께 고려한다."

blue_green_deployment:
  eyebrow: "Interactive flow"
  title: "Blue-Green 배포"
  summary: "기존 Blue를 서비스하는 동안 Green을 별도로 준비·검증한 뒤 트래픽을 한 번에 전환한다."
  actors:
    - id: router
      kind: "트래픽 제어"
      name: "Nginx / Load Balancer"
      description: "현재 요청 대상을 결정하는 진입점"
    - id: blue
      kind: "현재 버전"
      name: "Blue"
      description: "기존 운영 환경"
    - id: green
      kind: "대기 버전"
      name: "Green"
      description: "새 버전을 배포하고 검증하는 별도 환경"
    - id: switch
      kind: "전환 판단"
      name: "Smoke Test / Switch"
      description: "전환 전 검증과 즉시 롤백 판단"
  steps:
    - title: "1. Blue 운영"
      from: "Nginx / Load Balancer"
      to: "Blue"
      route_label: "현재 트래픽은 기존 Blue 환경으로 전달된다."
      active_actors: [router, blue]
      description: "사용자 서비스를 유지한 채 새 환경을 별도로 준비할 수 있다."
      payload: ["active", "current version", "traffic"]
      outcomes:
        - status: allow
          text: "배포 준비가 기존 사용자 트래픽을 직접 흔들지 않는다."
    - title: "2. Green 검증"
      from: "Green"
      to: "Smoke Test / Switch"
      route_label: "Green에 새 버전을 배포하고 헬스·스모크 테스트를 수행한다."
      active_actors: [green, switch]
      description: "실제 전환 전에 주요 경로와 설정·DB 연결을 확인한다."
      payload: ["new release", "health", "smoke test"]
      outcomes:
        - status: info
          text: "검증 실패 시 Blue를 계속 서비스할 수 있다."
    - title: "3. 트래픽 전환"
      from: "Smoke Test / Switch"
      to: "Green"
      route_label: "검증을 통과하면 라우터 대상을 Green으로 바꾸고 문제 시 Blue로 되돌린다."
      active_actors: [switch, router, green, blue]
      description: "버전 단위 전환은 빠른 롤백을 제공하지만 두 환경의 비용과 데이터 호환성을 고려해야 한다."
      payload: ["switch", "100% Green", "rollback Blue"]
      outcomes:
        - status: allow
          text: "트래픽 전환과 롤백 대상이 명확하다."

payment_event_flow:
  eyebrow: "Interactive flow"
  title: "결제 완료 이벤트의 후속 처리"
  summary: "결제 원본을 저장한 뒤 하나의 이벤트를 여러 Consumer Group이 각자의 목적에 맞게 처리한다."
  actors:
    - id: payment
      kind: "원본 처리"
      name: "Payment Service"
      description: "결제 거래를 확정하고 완료 이벤트를 발행하는 서비스"
    - id: kafka
      kind: "이벤트 전달"
      name: "Kafka Topic"
      description: "결제 완료 이벤트를 보관하고 소비자에게 전달하는 로그"
    - id: ranking
      kind: "파생 집계"
      name: "Ranking Consumer"
      description: "상품 판매량을 Redis 같은 빠른 조회 저장소에 반영"
    - id: history
      kind: "기록·후속 작업"
      name: "History / Delivery / Notification"
      description: "결제 이력·배송·알림을 독립적으로 처리하는 소비자들"
  steps:
    - title: "1. 결제 확정"
      from: "Payment Service"
      to: "Kafka Topic"
      route_label: "결제 거래를 RDB에 반영한 뒤 PaymentCompletedEvent를 발행한다."
      active_actors: [payment, kafka]
      description: "결제 서비스는 후속 작업을 직접 기다리는 대신 결제 완료라는 사실을 전달한다."
      payload: ["payment", "orderId", "event key"]
      outcomes:
        - status: allow
          text: "거래 원본과 이벤트 발행의 경계를 확인한다."
    - title: "2. 랭킹 집계"
      from: "Kafka Topic"
      to: "Ranking Consumer"
      route_label: "랭킹 Consumer가 결제 완료 이벤트를 읽어 판매 점수를 갱신한다."
      active_actors: [kafka, ranking]
      description: "Redis는 결제 원본이 아니라 빠른 조회를 위한 파생 결과를 맡는다."
      payload: ["consumer group", "productId", "ZINCRBY"]
      outcomes:
        - status: info
          text: "집계 Consumer의 장애가 결제 트랜잭션 자체를 되돌리지는 않는다."
    - title: "3. 후속 작업 분리"
      from: "Kafka Topic"
      to: "History / Delivery / Notification"
      route_label: "결제 이력·배송·알림 Consumer가 서로 다른 그룹으로 같은 이벤트를 처리한다."
      active_actors: [kafka, history, payment]
      description: "후속 작업마다 속도와 실패 범위를 분리해 결합도를 낮춘다."
      payload: ["history", "delivery", "notification"]
      outcomes:
        - status: allow
          text: "한 Consumer의 일시 장애가 다른 후속 작업까지 멈추게 하지 않는다."

load_test_cycle:
  eyebrow: "Interactive flow"
  title: "부하 테스트 기반 성능 개선"
  summary: "같은 조건에서 기준 지표를 측정하고 병목을 하나씩 바꾼 뒤 다시 검증한다."
  actors:
    - id: scenario
      kind: "테스트 정의"
      name: "Load Scenario"
      description: "사용자 수·요청 비율·데이터 조건을 고정한 부하 테스트"
    - id: metrics
      kind: "관측"
      name: "Latency / Error / Lag"
      description: "응답 지연·실패율·Consumer Lag·자원 사용량 지표"
    - id: bottleneck
      kind: "원인 분석"
      name: "Bottleneck"
      description: "DB·외부 API·Pool·파티션 등 실제 병목 구간"
    - id: change
      kind: "개선"
      name: "One Change"
      description: "한 번에 하나만 적용하는 구조·설정 변경"
  steps:
    - title: "1. 기준 측정"
      from: "Load Scenario"
      to: "Latency / Error / Lag"
      route_label: "동일한 조건에서 p95·p99·실패율·처리량과 시스템 지표를 기록한다."
      active_actors: [scenario, metrics]
      description: "평균 응답 시간만 보면 일부 사용자의 긴 지연을 놓칠 수 있다."
      payload: ["VU", "p95", "p99", "error rate"]
      outcomes:
        - status: info
          text: "비교 가능한 기준선이 있어야 개선 여부를 판단할 수 있다."
    - title: "2. 병목 확인"
      from: "Latency / Error / Lag"
      to: "Bottleneck"
      route_label: "느린 구간과 자원 고갈·Lag 증가가 어디서 시작되는지 추적한다."
      active_actors: [metrics, bottleneck]
      description: "서버 수를 먼저 늘리기보다 DB·네트워크·Consumer 처리 원인을 분리한다."
      payload: ["DB query", "pool", "consumer lag"]
      outcomes:
        - status: warning
          text: "원인을 모른 채 여러 요소를 동시에 바꾸면 효과를 설명하기 어렵다."
    - title: "3. 단일 변경 재측정"
      from: "Bottleneck"
      to: "One Change"
      route_label: "변경 하나를 적용하고 같은 조건으로 다시 측정해 효과와 부작용을 확인한다."
      active_actors: [bottleneck, change, scenario, metrics]
      description: "개선 사이클은 측정 가능한 가설을 작은 단위로 검증하는 과정이다."
      payload: ["one change", "same condition", "regression"]
      outcomes:
        - status: allow
          text: "수치와 관측 결과가 다음 개선의 입력으로 남는다."

redis_spof:
  eyebrow: "Interactive comparison"
  title: "단일 Redis의 SPOF"
  summary: "애플리케이션이 하나의 Redis에만 의존하면 Redis 장애가 캐시·세션·락 기능으로 전파될 수 있다."
  actors:
    - id: app
      kind: "애플리케이션"
      name: "Spring Boot"
      description: "캐시·세션·분산 락을 사용하는 서비스"
    - id: redis
      kind: "단일 저장소"
      name: "Single Redis"
      description: "모든 Redis 의존 기능이 연결된 하나의 노드"
    - id: cache
      kind: "기능 A"
      name: "Cache / Session"
      description: "Redis 응답에 의존하는 애플리케이션 기능"
    - id: failure
      kind: "장애 영향"
      name: "Cascading Failure"
      description: "연결 실패와 지연이 요청 경로로 퍼지는 상태"
  steps:
    - title: "1. 기능 연결"
      from: "Spring Boot"
      to: "Single Redis"
      route_label: "애플리케이션이 캐시·세션·락 요청을 하나의 Redis 노드로 보낸다."
      active_actors: [app, redis]
      description: "기능은 편리하지만 저장소 장애의 영향 범위가 넓어진다."
      payload: ["cache", "session", "lock"]
      outcomes:
        - status: warning
          text: "단일 노드가 여러 기능의 공통 의존성이 된다."
    - title: "2. Redis 장애"
      from: "Single Redis"
      to: "Cascading Failure"
      route_label: "노드 장애·네트워크 단절·과부하로 연결 요청이 실패하거나 지연된다."
      active_actors: [redis, failure, cache]
      description: "장애 자체보다 Redis를 기다리는 요청과 재시도 정책이 영향 범위를 키울 수 있다."
      payload: ["timeout", "connection error", "retry"]
      outcomes:
        - status: reject
          text: "Redis 장애가 곧바로 전체 서비스 장애가 되지 않도록 경계를 둬야 한다."
    - title: "3. 복구 정책"
      from: "Cascading Failure"
      to: "Spring Boot"
      route_label: "타임아웃·fallback·재연결·데이터 복구 정책으로 기능별 영향을 제한한다."
      active_actors: [failure, app, redis]
      description: "고가용성 구성은 장애를 없애기보다 감지와 복구 시간을 줄이는 방향으로 설계한다."
      payload: ["timeout", "fallback", "reconnect"]
      outcomes:
        - status: info
          text: "캐시와 원본 데이터의 복구 우선순위를 분리한다."

redis_sentinel_connection:
  eyebrow: "Interactive flow"
  title: "Spring Boot와 Redis Sentinel 연결"
  summary: "애플리케이션은 Sentinel에 현재 Primary를 묻고 실제 데이터 요청은 선택된 Redis 노드로 보낸다."
  actors:
    - id: app
      kind: "클라이언트"
      name: "Spring Boot"
      description: "Redis 클라이언트 설정을 가진 애플리케이션"
    - id: sentinel
      kind: "감시·조회"
      name: "Sentinel"
      description: "현재 Primary와 장애 상태를 알려주는 감시 노드"
    - id: primary
      kind: "쓰기 대상"
      name: "Current Primary"
      description: "현재 쓰기 요청을 처리하는 Redis 노드"
    - id: replica
      kind: "복제본"
      name: "Replica"
      description: "Primary 데이터를 비동기로 복제하는 노드"
  steps:
    - title: "1. Primary 조회"
      from: "Spring Boot"
      to: "Sentinel"
      route_label: "클라이언트가 모니터링 이름으로 현재 Primary 정보를 조회한다."
      active_actors: [app, sentinel]
      description: "애플리케이션은 고정 IP보다 역할 기반 Redis 위치를 확인한다."
      payload: ["master name", "host", "port"]
      outcomes:
        - status: info
          text: "Sentinel 연결과 Redis 데이터 연결은 별도 단계다."
    - title: "2. 데이터 연결"
      from: "Sentinel"
      to: "Current Primary"
      route_label: "조회한 주소로 실제 Redis 명령을 처리할 Primary에 연결한다."
      active_actors: [sentinel, primary, app]
      description: "Sentinel이 모든 데이터를 대신 처리하는 것이 아니라 역할 변경 정보를 제공한다."
      payload: ["connection", "read", "write"]
      outcomes:
        - status: allow
          text: "현재 Primary에 쓰기 요청을 전달할 수 있다."
    - title: "3. Replica 복제"
      from: "Current Primary"
      to: "Replica"
      route_label: "Primary의 변경 사항을 Replica가 비동기로 받아 장애 대비 복제본을 유지한다."
      active_actors: [primary, replica, sentinel]
      description: "복제 지연과 승격 조건을 운영 정책으로 함께 관리해야 한다."
      payload: ["replication", "lag", "role"]
      outcomes:
        - status: info
          text: "Failover 때 노드의 역할과 클라이언트 연결 대상이 바뀔 수 있다."

sentinel_failover:
  eyebrow: "Interactive flow"
  title: "Redis Sentinel Failover"
  summary: "Sentinel이 Primary 장애를 감지하고 Replica를 새 Primary로 승격한 뒤 클라이언트가 재접속한다."
  actors:
    - id: primary
      kind: "기존 역할"
      name: "Primary"
      description: "장애 전 쓰기 요청을 받던 Redis 노드"
    - id: sentinel
      kind: "판단"
      name: "Sentinel Quorum"
      description: "장애 상태를 감지하고 승격을 조정하는 Sentinel 집합"
    - id: replica
      kind: "승격 후보"
      name: "Replica"
      description: "새 Primary가 될 복제본"
    - id: app
      kind: "재연결"
      name: "Spring Boot Client"
      description: "변경된 Primary 정보를 받아 연결을 갱신하는 클라이언트"
  steps:
    - title: "1. 장애 감지"
      from: "Primary"
      to: "Sentinel Quorum"
      route_label: "Sentinel이 응답 실패와 다른 감시 노드의 판단으로 장애를 확인한다."
      active_actors: [primary, sentinel]
      description: "단일 감시 신호만으로 오판하지 않도록 quorum과 타임아웃을 설정한다."
      payload: ["ping", "timeout", "quorum"]
      outcomes:
        - status: warning
          text: "장애 감지 시간은 서비스 복구 시간에 직접 영향을 준다."
    - title: "2. Replica 승격"
      from: "Sentinel Quorum"
      to: "Replica"
      route_label: "Sentinel이 조건에 맞는 Replica의 역할을 새 Primary로 변경한다."
      active_actors: [sentinel, replica, primary]
      description: "승격 후보의 복제 상태와 우선순위를 고려해야 한다."
      payload: ["promote", "role change", "replication offset"]
      outcomes:
        - status: allow
          text: "새 쓰기 대상이 정해지지만 이미 유실된 데이터가 복구되는 것은 아니다."
    - title: "3. 클라이언트 재접속"
      from: "Replica"
      to: "Spring Boot Client"
      route_label: "클라이언트가 Sentinel에서 새 Primary를 확인하고 연결을 재수립한다."
      active_actors: [replica, app, sentinel]
      description: "Lettuce·Jedis 설정과 재연결 동작이 Failover 체감 시간을 결정한다."
      payload: ["new primary", "reconnect", "retry policy"]
      outcomes:
        - status: info
          text: "Failover는 무중단 보장이 아니라 자동 복구 절차의 단축이다."

async_replication_loss:
  eyebrow: "Interactive flow"
  title: "Redis 비동기 복제와 데이터 유실 가능성"
  summary: "Primary의 쓰기가 Replica에 도달하기 전에 장애가 나면 최근 변경 일부가 새 Primary에 없을 수 있다."
  actors:
    - id: client
      kind: "요청"
      name: "Client Write"
      description: "애플리케이션이 보낸 최신 쓰기 요청"
    - id: primary
      kind: "원본 역할"
      name: "Primary"
      description: "먼저 쓰기를 수락하는 Redis 노드"
    - id: replica
      kind: "복제 지연"
      name: "Replica Buffer"
      description: "아직 최신 변경을 받지 못한 복제본"
    - id: failover
      kind: "승격"
      name: "Failover"
      description: "Replica를 새 Primary로 바꾸는 절차"
  steps:
    - title: "1. Primary 쓰기 수락"
      from: "Client Write"
      to: "Primary"
      route_label: "클라이언트가 쓰기 성공 응답을 받지만 복제가 끝났다는 뜻은 아니다."
      active_actors: [client, primary]
      description: "비동기 복제에서는 Primary 수락과 Replica 반영 사이에 시간 차이가 있다."
      payload: ["write", "ack", "primary"]
      outcomes:
        - status: info
          text: "성공 응답과 다중 노드 보존을 동일하게 가정하면 안 된다."
    - title: "2. 복제 지연"
      from: "Primary"
      to: "Replica Buffer"
      route_label: "네트워크·부하로 최신 변경이 Replica에 도착하기 전 지연이 발생한다."
      active_actors: [primary, replica]
      description: "Replication Lag은 Failover 시점의 데이터 손실 가능성을 보여주는 신호다."
      payload: ["replication stream", "lag", "latest write"]
      outcomes:
        - status: warning
          text: "Replica가 최신 상태라는 보장은 복제 방식과 지연에 달려 있다."
    - title: "3. 지연된 Replica 승격"
      from: "Replica Buffer"
      to: "Failover"
      route_label: "장애 시점에 Replica가 승격되며 아직 복제되지 않은 최신 변경은 사라질 수 있다."
      active_actors: [replica, failover, client]
      description: "캐시라면 재생성으로 복구할 수 있지만 원본 데이터라면 요구사항이 달라진다."
      payload: ["promotion", "data loss window", "rebuild"]
      outcomes:
        - status: reject
          text: "Sentinel은 복제되지 않은 쓰기를 되살리지 않는다."

replica_read_lag:
  eyebrow: "Interactive comparison"
  title: "Primary와 Replica 읽기 선택"
  summary: "최신성이 필요한 읽기와 약간의 지연을 허용하는 읽기를 분리해 라우팅한다."
  actors:
    - id: request
      kind: "읽기 요청"
      name: "Read Request"
      description: "결제 직후 조회나 일반 목록 조회 같은 읽기 요청"
    - id: policy
      kind: "최신성 정책"
      name: "Consistency Policy"
      description: "요청별로 허용할 replication lag을 정하는 기준"
    - id: primary
      kind: "최신 읽기"
      name: "Primary"
      description: "가장 최신 상태를 읽을 수 있는 노드"
    - id: replica
      kind: "확장 읽기"
      name: "Replica"
      description: "지연 가능성이 있지만 읽기 부하를 나눌 수 있는 노드"
  steps:
    - title: "1. 최신성 판단"
      from: "Read Request"
      to: "Consistency Policy"
      route_label: "요청이 방금 쓴 값을 반드시 봐야 하는지 먼저 판단한다."
      active_actors: [request, policy]
      description: "모든 읽기를 Replica로 보내는 것은 일관성 요구를 무시하는 선택이 될 수 있다."
      payload: ["read type", "freshness", "lag budget"]
      outcomes:
        - status: info
          text: "라우팅 기준은 저장소 이름보다 도메인 요구사항에서 시작한다."
    - title: "2. 최신 데이터 읽기"
      from: "Consistency Policy"
      to: "Primary"
      route_label: "강한 최신성이 필요한 요청은 Primary에서 읽는다."
      active_actors: [policy, primary, request]
      description: "쓰기 직후 조회·잔액 확인처럼 지연을 허용하기 어려운 경로다."
      payload: ["read-after-write", "fresh data", "primary read"]
      outcomes:
        - status: allow
          text: "최신 상태를 우선하지만 Primary 읽기 부하가 커질 수 있다."
    - title: "3. 지연 허용 읽기"
      from: "Consistency Policy"
      to: "Replica"
      route_label: "일반 목록·통계처럼 지연을 허용할 수 있는 요청은 Replica로 분산한다."
      active_actors: [policy, replica, request]
      description: "읽기 확장과 최신성 사이의 트레이드오프를 명시적으로 선택한다."
      payload: ["eventual consistency", "read scale", "replication lag"]
      outcomes:
        - status: warning
          text: "사용자 경험과 데이터 의미에 맞지 않으면 오래된 값이 노출될 수 있다."

sentinel_cluster:
  eyebrow: "Interactive comparison"
  title: "Redis Sentinel과 Cluster"
  summary: "Sentinel은 주로 복제본 승격과 장애 감지를 다루고 Cluster는 데이터를 여러 슬롯으로 샤딩한다."
  actors:
    - id: data
      kind: "데이터셋"
      name: "Redis Data"
      description: "캐시·세션·파생 데이터를 저장하는 논리적 데이터셋"
    - id: sentinel
      kind: "고가용성"
      name: "Sentinel"
      description: "Primary 장애 감지와 Replica 승격을 담당하는 구성"
    - id: cluster
      kind: "수평 분할"
      name: "Redis Cluster"
      description: "해시 슬롯으로 키를 여러 노드에 분산하는 구성"
    - id: decision
      kind: "선택 기준"
      name: "Requirement"
      description: "데이터 규모·복구 시간·운영 복잡도를 비교하는 판단"
  steps:
    - title: "1. 장애 복구 요구"
      from: "Redis Data"
      to: "Sentinel"
      route_label: "데이터를 모든 노드에 복제하고 Primary 장애 뒤 자동 승격을 원하면 Sentinel을 검토한다."
      active_actors: [data, sentinel]
      description: "데이터 규모가 작고 핵심 문제가 수동 복구 시간이라면 단순한 출발점이 될 수 있다."
      payload: ["replication", "failover", "same dataset"]
      outcomes:
        - status: info
          text: "Sentinel은 샤딩을 제공하지 않는다."
    - title: "2. 데이터 분산 요구"
      from: "Redis Data"
      to: "Redis Cluster"
      route_label: "데이터가 한 노드 용량을 넘거나 처리량을 분산해야 하면 해시 슬롯을 사용한다."
      active_actors: [data, cluster]
      description: "Cluster는 수평 확장과 함께 멀티키 연산·운영 제약을 추가한다."
      payload: ["hash slots", "sharding", "scale out"]
      outcomes:
        - status: allow
          text: "대규모 데이터와 처리량을 여러 노드로 나눌 수 있다."
    - title: "3. 요구사항으로 선택"
      from: "Sentinel"
      to: "Requirement"
      route_label: "복구 시간·데이터 규모·샤딩 필요성·운영 역량을 함께 비교해 구성을 선택한다."
      active_actors: [sentinel, cluster, decision]
      description: "더 복잡한 구성이 항상 더 나은 것은 아니다."
      payload: ["RTO", "dataset size", "operations"]
      outcomes:
        - status: info
          text: "현재 실패 문제를 해결하는 최소 복잡도부터 시작한다."

redis_roadmap:
  eyebrow: "Interactive flow"
  title: "Redis 고가용성 운영 로드맵"
  summary: "단일 Redis의 장애 정책을 정리한 뒤 실제 복구 시간과 규모 요구에 따라 Sentinel·Cluster로 확장한다."
  actors:
    - id: single
      kind: "현재 상태"
      name: "Single Redis"
      description: "단순하지만 장애 시 수동 복구가 필요한 구성"
    - id: policy
      kind: "운영 기준"
      name: "Failure Policy"
      description: "타임아웃·백업·복구 절차와 데이터 분류"
    - id: sentinel
      kind: "자동 복구"
      name: "Sentinel / Managed HA"
      description: "장애 감지와 역할 승격으로 MTTR을 줄이는 구성"
    - id: cluster
      kind: "수평 확장"
      name: "Redis Cluster"
      description: "샤딩이 필요한 규모에서 선택하는 구성"
  steps:
    - title: "1. 단일 구성 점검"
      from: "Single Redis"
      to: "Failure Policy"
      route_label: "캐시·세션·락·원본 여부와 장애 시 fallback·복구 절차를 문서화한다."
      active_actors: [single, policy]
      description: "구성을 바꾸기 전에 현재 장애 영향과 복구 목표를 먼저 정의한다."
      payload: ["data role", "backup", "RTO"]
      outcomes:
        - status: info
          text: "캐시와 원본 데이터는 같은 복구 정책으로 다루지 않는다."
    - title: "2. 장애 복구 자동화"
      from: "Failure Policy"
      to: "Sentinel / Managed HA"
      route_label: "수동 복구 시간이 요구사항을 넘으면 Sentinel이나 관리형 고가용성으로 확장한다."
      active_actors: [policy, sentinel]
      description: "자동 승격과 재접속을 도입해 복구 절차를 줄이되 복제 지연을 관찰한다."
      payload: ["sentinel", "failover", "reconnect"]
      outcomes:
        - status: allow
          text: "장애 감지와 역할 전환이 운영 절차에 포함된다."
    - title: "3. 규모 확장"
      from: "Sentinel / Managed HA"
      to: "Redis Cluster"
      route_label: "한 노드 용량·처리량·키 분산 요구가 커지면 샤딩 구성을 검토한다."
      active_actors: [sentinel, cluster, policy]
      description: "Cluster는 용량 문제를 다루지만 애플리케이션과 운영의 제약도 늘린다."
      payload: ["sharding", "slots", "operational complexity"]
      outcomes:
        - status: info
          text: "복구 요구와 확장 요구를 같은 문제로 보지 않는다."

payment_lost_update:
  eyebrow: "Interactive comparison"
  title: "포인트 결제의 Lost Update"
  summary: "두 요청이 같은 잔액을 읽고 각자의 결과를 저장하면 나중에 저장한 값이 앞선 변경을 덮어쓸 수 있다."
  actors:
    - id: request_a
      kind: "동시 요청 A"
      name: "Payment A"
      description: "잔액을 읽고 포인트를 차감하려는 첫 요청"
    - id: request_b
      kind: "동시 요청 B"
      name: "Payment B"
      description: "같은 시점에 잔액을 읽고 차감하려는 두 번째 요청"
    - id: balance
      kind: "공유 상태"
      name: "Point Balance"
      description: "두 요청이 함께 읽고 쓰는 현재 포인트 잔액"
    - id: overwrite
      kind: "실패 결과"
      name: "Lost Update"
      description: "한 요청의 차감 결과가 다른 저장으로 덮인 상태"
  steps:
    - title: "1. 같은 잔액 읽기"
      from: "Payment A"
      to: "Point Balance"
      route_label: "두 결제 요청이 모두 같은 시점의 잔액 10,000원을 읽는다."
      active_actors: [request_a, request_b, balance]
      description: "읽기와 저장 사이에 다른 요청이 변경할 수 있다는 점이 문제의 출발점이다."
      payload: ["balance 10,000", "read", "concurrent"]
      outcomes:
        - status: warning
          text: "두 요청이 서로의 변경을 아직 보지 못한다."
    - title: "2. 각자 차감 계산"
      from: "Point Balance"
      to: "Payment B"
      route_label: "각 요청이 자신의 결제 금액을 뺀 새로운 잔액을 계산한다."
      active_actors: [balance, request_a, request_b]
      description: "애플리케이션 메모리의 계산만으로는 공유 행의 동시 변경을 막지 못한다."
      payload: ["10,000 - 7,000", "3,000", "stale read"]
      outcomes:
        - status: warning
          text: "실제 사용 금액과 저장될 잔액이 어긋날 수 있다."
    - title: "3. 나중 저장이 덮어쓰기"
      from: "Payment B"
      to: "Lost Update"
      route_label: "두 요청이 각각 3,000원을 저장해 한 차감이 사라진다."
      active_actors: [request_a, request_b, overwrite, balance]
      description: "최종 잔액만 보면 두 요청이 모두 성공한 것처럼 보일 수 있다."
      payload: ["last write wins", "missing deduction", "wrong balance"]
      outcomes:
        - status: reject
          text: "공유 잔액 갱신에는 원자적 조건과 동시성 제어가 필요하다."

payment_conditional_update:
  eyebrow: "Interactive flow"
  title: "조건부 UPDATE 포인트 차감"
  summary: "잔액 조건과 차감을 하나의 DB 연산으로 묶고 수정 행 수로 성공·실패를 판단한다."
  actors:
    - id: request
      kind: "결제 요청"
      name: "Payment Request"
      description: "사용자와 결제 금액을 담은 요청"
    - id: db
      kind: "원자 연산"
      name: "Database UPDATE"
      description: "잔액 조건과 차감을 동시에 수행하는 SQL 연산"
    - id: row
      kind: "판정 기준"
      name: "Affected Rows"
      description: "조건을 만족해 실제로 수정된 행의 수"
    - id: result
      kind: "결과"
      name: "Success / Reject"
      description: "차감 성공 또는 잔액 부족·사용자 없음 결과"
  steps:
    - title: "1. 조건 포함 요청"
      from: "Payment Request"
      to: "Database UPDATE"
      route_label: "잔액이 결제 금액 이상일 때만 잔액을 차감하도록 WHERE 조건을 함께 보낸다."
      active_actors: [request, db]
      description: "별도의 조회와 저장 사이에 다른 요청이 끼어들 틈을 줄인다."
      payload: ["userId", "amount", "balance >= amount"]
      outcomes:
        - status: allow
          text: "판정과 변경이 하나의 DB 연산에 들어간다."
    - title: "2. 행 수정"
      from: "Database UPDATE"
      to: "Affected Rows"
      route_label: "DB는 조건을 만족한 행만 차감하고 실제 수정 행 수를 반환한다."
      active_actors: [db, row]
      description: "동시 요청이 있어도 DB가 행 단위 조건을 기준으로 갱신을 직렬화한다."
      payload: ["UPDATE", "affected rows", "atomicity"]
      outcomes:
        - status: info
          text: "수정 행 수가 비즈니스 결과를 판단하는 직접 근거가 된다."
    - title: "3. 결과 분기"
      from: "Affected Rows"
      to: "Success / Reject"
      route_label: "수정 행이 1이면 성공, 0이면 잔액 부족이나 사용자 없음으로 처리한다."
      active_actors: [row, result, request]
      description: "실패를 예외 문자열이 아니라 명확한 도메인 결과로 변환한다."
      payload: ["1 = success", "0 = reject", "domain result"]
      outcomes:
        - status: allow
          text: "초과 차감과 Lost Update 가능성을 DB 조건으로 방어한다."

payment_lock_transaction:
  eyebrow: "Interactive comparison"
  title: "Redis 락과 DB 트랜잭션 경계"
  summary: "Redis 락을 획득한 뒤 DB 커밋이 끝날 때까지 자원을 보호하고, 조기 해제하지 않는다."
  actors:
    - id: request
      kind: "요청"
      name: "Payment Request"
      description: "같은 사용자 포인트를 차감하려는 요청"
    - id: lock
      kind: "직렬화"
      name: "Redis Lock"
      description: "동일 자원에 대한 동시 진입을 제한하는 분산 락"
    - id: tx
      kind: "원자 처리"
      name: "DB Transaction"
      description: "포인트 변경과 커밋을 담당하는 트랜잭션 경계"
    - id: release
      kind: "해제"
      name: "Unlock"
      description: "커밋 이후 락을 반환하는 단계"
  steps:
    - title: "1. 락 획득"
      from: "Payment Request"
      to: "Redis Lock"
      route_label: "요청이 lock:point:userId를 획득할 때까지 같은 자원의 다른 요청을 기다리게 한다."
      active_actors: [request, lock]
      description: "락 키와 TTL·소유자 검증을 함께 설계해야 한다."
      payload: ["resource key", "owner token", "TTL"]
      outcomes:
        - status: allow
          text: "같은 사용자 포인트에 대한 진입 순서를 제한한다."
    - title: "2. DB 변경·커밋"
      from: "Redis Lock"
      to: "DB Transaction"
      route_label: "락을 유지한 채 조건부 UPDATE와 트랜잭션 커밋을 완료한다."
      active_actors: [lock, tx, request]
      description: "메서드 본문이 끝난 시점과 Spring 프록시의 실제 커밋 시점은 다를 수 있다."
      payload: ["conditional update", "commit", "rollback"]
      outcomes:
        - status: info
          text: "커밋 전 락 해제는 아직 확정되지 않은 상태를 다른 요청에 노출할 수 있다."
    - title: "3. 커밋 후 해제"
      from: "DB Transaction"
      to: "Unlock"
      route_label: "DB 커밋이 성공한 뒤 소유자 토큰을 확인하고 락을 해제한다."
      active_actors: [tx, release, lock]
      description: "실패 시 롤백과 락 해제도 같은 전체 흐름의 일부다."
      payload: ["committed", "owner check", "unlock"]
      outcomes:
        - status: allow
          text: "다음 요청은 확정된 DB 상태를 기준으로 처리한다."

payment_consistency_layers:
  eyebrow: "Interactive flow"
  title: "포인트 결제 정합성 방어 계층"
  summary: "분산 락·조건부 UPDATE·DB 트랜잭션·멱등성 키가 서로 다른 실패를 나눠 방어한다."
  actors:
    - id: idempotency
      kind: "중복 방지"
      name: "Idempotency Key"
      description: "같은 결제 요청을 한 번만 처리하기 위한 식별자"
    - id: lock
      kind: "동시성"
      name: "Redis Distributed Lock"
      description: "같은 사용자 자원에 대한 동시 진입을 제한"
    - id: update
      kind: "조건 검증"
      name: "Conditional UPDATE"
      description: "잔액 조건과 차감을 하나의 DB 연산으로 처리"
    - id: tx
      kind: "영속성"
      name: "DB Transaction"
      description: "변경의 원자성과 커밋·롤백을 보장하는 경계"
  steps:
    - title: "1. 중복 요청 식별"
      from: "Idempotency Key"
      to: "Redis Distributed Lock"
      route_label: "요청 ID를 확인하고 같은 자원의 동시 실행을 제한한다."
      active_actors: [idempotency, lock]
      description: "중복과 동시성은 겹치지만 동일한 문제는 아니므로 방어 수단도 분리한다."
      payload: ["request key", "duplicate", "lock key"]
      outcomes:
        - status: info
          text: "재시도 요청과 동시에 들어온 서로 다른 요청을 구분한다."
    - title: "2. 잔액 조건 처리"
      from: "Redis Distributed Lock"
      to: "Conditional UPDATE"
      route_label: "락 안에서 잔액 부족 조건과 차감 연산을 DB에 위임한다."
      active_actors: [lock, update]
      description: "Redis 락만으로 데이터베이스의 최종 정합성을 대신할 수는 없다."
      payload: ["balance condition", "UPDATE", "affected rows"]
      outcomes:
        - status: allow
          text: "DB가 저장 상태를 최종적으로 판정한다."
    - title: "3. 트랜잭션 확정"
      from: "Conditional UPDATE"
      to: "DB Transaction"
      route_label: "변경과 결제 기록을 하나의 트랜잭션으로 커밋하거나 함께 롤백한다."
      active_actors: [update, tx, idempotency]
      description: "각 계층이 맡는 실패 범위를 분리해야 복구 전략도 명확해진다."
      payload: ["commit", "rollback", "payment record"]
      outcomes:
        - status: allow
          text: "중복·동시성·초과 차감·부분 저장을 서로 다른 계층에서 방어한다."

postgres_dual_validation:
  eyebrow: "Interactive flow"
  title: "애플리케이션과 PostgreSQL의 이중 검증"
  summary: "애플리케이션은 친절한 오류를 만들고 PostgreSQL 제약조건은 어떤 쓰기 경로에서도 저장 상태를 지킨다."
  actors:
    - id: request
      kind: "입력"
      name: "User Request"
      description: "API·관리자·배치에서 들어오는 데이터"
    - id: app
      kind: "빠른 검증"
      name: "Application Validation"
      description: "형식과 사용자 경험을 위한 애플리케이션 검증"
    - id: db
      kind: "최종 방어"
      name: "PostgreSQL Constraint"
      description: "NOT NULL·CHECK·UNIQUE·FK 같은 데이터베이스 제약"
    - id: stored
      kind: "저장 상태"
      name: "Valid Row"
      description: "제약을 모두 통과한 데이터 행"
  steps:
    - title: "1. 요청 검증"
      from: "User Request"
      to: "Application Validation"
      route_label: "애플리케이션이 입력 형식과 도메인 규칙을 빠르게 검사한다."
      active_actors: [request, app]
      description: "사용자에게 어떤 값이 잘못됐는지 구체적으로 알려주는 단계다."
      payload: ["format", "required", "domain rule"]
      outcomes:
        - status: info
          text: "빠른 실패는 불필요한 DB 요청과 모호한 오류를 줄인다."
    - title: "2. DB 제약 검증"
      from: "Application Validation"
      to: "PostgreSQL Constraint"
      route_label: "API 밖의 배치·관리자 도구·마이그레이션까지 DB 제약조건으로 다시 방어한다."
      active_actors: [app, db, request]
      description: "애플리케이션 검증을 우회한 쓰기도 저장 경계를 통과해야 한다."
      payload: ["CHECK", "UNIQUE", "FOREIGN KEY"]
      outcomes:
        - status: reject
          text: "잘못된 행은 데이터베이스가 최종적으로 거절한다."
    - title: "3. 유효 행 저장"
      from: "PostgreSQL Constraint"
      to: "Valid Row"
      route_label: "모든 제약을 통과한 데이터만 트랜잭션으로 저장된다."
      active_actors: [db, stored]
      description: "두 검증 계층은 중복이 아니라 서로 다른 진입 경로와 책임을 방어한다."
      payload: ["valid row", "transaction", "invariant"]
      outcomes:
        - status: allow
          text: "사용자 경험과 데이터 무결성을 동시에 지킨다."

postgres_operational_architecture:
  eyebrow: "Interactive flow"
  title: "PostgreSQL 운영 구조"
  summary: "Spring Boot의 원본 데이터 요청을 Primary가 처리하고 Replica·백업·모니터링이 운영 안정성을 보완한다."
  actors:
    - id: app
      kind: "애플리케이션"
      name: "Spring Boot"
      description: "트랜잭션과 조회를 요청하는 서비스"
    - id: primary
      kind: "쓰기 원본"
      name: "PostgreSQL Primary"
      description: "쓰기와 강한 일관성이 필요한 읽기를 처리하는 DB"
    - id: replica
      kind: "읽기 확장"
      name: "Read Replica"
      description: "복제 지연을 감수하고 읽기 부하를 나누는 복제본"
    - id: ops
      kind: "운영 보호"
      name: "Backup / Monitoring"
      description: "복구와 이상 감지를 담당하는 운영 계층"
  steps:
    - title: "1. 원본 쓰기"
      from: "Spring Boot"
      to: "PostgreSQL Primary"
      route_label: "트랜잭션 쓰기와 최신 상태가 필요한 요청을 Primary로 보낸다."
      active_actors: [app, primary]
      description: "원본 데이터와 커밋의 기준은 하나의 Primary에 둔다."
      payload: ["transaction", "write", "constraint"]
      outcomes:
        - status: allow
          text: "쓰기의 최종 원본 위치가 명확하다."
    - title: "2. 읽기 복제"
      from: "PostgreSQL Primary"
      to: "Read Replica"
      route_label: "Primary 변경을 Replica로 복제해 허용 가능한 조회 부하를 분산한다."
      active_actors: [primary, replica, app]
      description: "Replica는 원본을 대체하지 않으며 지연을 가진 읽기 경로다."
      payload: ["WAL", "replication lag", "read routing"]
      outcomes:
        - status: info
          text: "최신성이 필요한 조회를 Replica로 보내지 않도록 정책이 필요하다."
    - title: "3. 백업과 감시"
      from: "PostgreSQL Primary"
      to: "Backup / Monitoring"
      route_label: "백업·지연·용량·오류 지표를 관찰하고 장애 시 복구 절차를 실행한다."
      active_actors: [primary, ops, replica]
      description: "안정성은 DB 제품 하나가 아니라 예방·감지·전환·복구의 연결에서 나온다."
      payload: ["backup", "alert", "restore"]
      outcomes:
        - status: allow
          text: "장애 전후의 운영 행동과 검증 기준이 남는다."

postgres_jsonb_attributes:
  eyebrow: "Interactive comparison"
  title: "PostgreSQL 컬럼과 JSONB의 경계"
  summary: "트랜잭션과 제약조건의 중심이 되는 공통 필드는 컬럼에, 카테고리별 가변 속성은 JSONB에 둔다."
  actors:
    - id: product
      kind: "도메인 데이터"
      name: "Product"
      description: "가격·재고·판매 상태와 카테고리별 상품 속성"
    - id: column
      kind: "고정 구조"
      name: "Relational Columns"
      description: "검색·정렬·제약과 트랜잭션의 중심이 되는 필드"
    - id: jsonb
      kind: "가변 구조"
      name: "JSONB Attributes"
      description: "상품마다 달라지는 설명형·카테고리별 속성"
    - id: query
      kind: "조회·검증"
      name: "Query / Constraint"
      description: "필드별 검색과 무결성 정책을 적용하는 계층"
  steps:
    - title: "1. 공통 필드 식별"
      from: "Product"
      to: "Relational Columns"
      route_label: "가격·재고·판매 상태처럼 모든 상품에 공통이고 제약이 필요한 값을 컬럼으로 정한다."
      active_actors: [product, column]
      description: "자주 검색·정렬하고 트랜잭션으로 함께 바꿀 값은 고정 구조가 유리하다."
      payload: ["price", "stock", "status"]
      outcomes:
        - status: allow
          text: "핵심 불변식을 컬럼과 제약으로 명시할 수 있다."
    - title: "2. 가변 속성 분리"
      from: "Product"
      to: "JSONB Attributes"
      route_label: "카테고리마다 다른 화면·설명 속성을 JSONB 문서로 보완한다."
      active_actors: [product, jsonb]
      description: "가변성을 얻는 대신 JSON 구조·인덱스·검증 정책을 별도로 관리한다."
      payload: ["size", "material", "specifications"]
      outcomes:
        - status: info
          text: "JSONB가 관계형 모델의 모든 책임을 대체하는 것은 아니다."
    - title: "3. 조회와 제약 설계"
      from: "Relational Columns"
      to: "Query / Constraint"
      route_label: "컬럼과 JSONB 각각의 조회 패턴·인덱스·검증 수준을 맞춰 설계한다."
      active_actors: [column, jsonb, query]
      description: "저장 편의보다 실제 질의와 무결성 요구를 기준으로 경계를 조정한다."
      payload: ["index", "json path", "constraint"]
      outcomes:
        - status: info
          text: "공통 데이터와 가변 데이터의 책임이 분리된다."

mysql_postgres_decision:
  eyebrow: "Interactive flow"
  title: "MySQL과 PostgreSQL 선택 흐름"
  summary: "요구사항·운영 경험·도입 비용·학습 목적을 함께 보고 현재 팀의 위험이 작은 선택을 한다."
  actors:
    - id: requirement
      kind: "요구사항"
      name: "Data Requirements"
      description: "JSONB·제약·검색·트랜잭션 같은 실제 기능 요구"
    - id: operation
      kind: "운영 기준"
      name: "Operations Experience"
      description: "팀의 운영 경험과 장애 대응 역량"
    - id: mysql
      kind: "기존 선택"
      name: "Keep MySQL"
      description: "현재 운영 안정성과 익숙함을 우선하는 경로"
    - id: postgres
      kind: "도입 선택"
      name: "Adopt PostgreSQL"
      description: "요구사항과 팀 역량이 도입 비용을 감당하는 경로"
  steps:
    - title: "1. 요구사항 확인"
      from: "Data Requirements"
      to: "Operations Experience"
      route_label: "필요한 기능이 현재 DB로 충분한지와 운영상 새 기능이 필요한지 확인한다."
      active_actors: [requirement, operation]
      description: "제품 이름보다 실제 쿼리·제약·복구 요구를 먼저 적는다."
      payload: ["query", "constraint", "JSONB", "RTO"]
      outcomes:
        - status: info
          text: "기술 선택을 유행이나 단일 기능으로 결정하지 않는다."
    - title: "2. 비용과 경험 비교"
      from: "Operations Experience"
      to: "Keep MySQL"
      route_label: "팀의 경험과 기존 운영 자산이 충분하면 MySQL을 유지하는 편이 위험이 작을 수 있다."
      active_actors: [operation, mysql]
      description: "현재 안정성을 지키는 선택도 요구사항을 만족한다면 합리적이다."
      payload: ["familiarity", "migration cost", "stable ops"]
      outcomes:
        - status: allow
          text: "변경 자체가 목적이 되지 않도록 한다."
    - title: "3. 도입 판단"
      from: "Operations Experience"
      to: "Adopt PostgreSQL"
      route_label: "필요 기능과 팀의 학습·운영 계획이 도입 비용을 넘는다면 PostgreSQL을 선택한다."
      active_actors: [requirement, operation, postgres]
      description: "도입 후 백업·모니터링·마이그레이션·팀 학습까지 함께 계획한다."
      payload: ["benefit", "migration", "learning plan"]
      outcomes:
        - status: info
          text: "선택 기준은 현재 팀과 서비스의 총 위험을 줄이는 방향이다."

clean_code_compare:
  eyebrow: "Interactive comparison"
  title: "짧은 코드와 읽히는 코드"
  summary: "코드 길이보다 역할·이름·추상화 수준이 다음 동작을 예상하게 만드는지가 중요하다."
  actors:
    - id: compact
      kind: "표면적 기준"
      name: "Short Code"
      description: "줄 수는 짧지만 의도와 책임이 한눈에 드러나지 않는 코드"
    - id: name
      kind: "의도 표현"
      name: "Meaningful Names"
      description: "메서드와 변수 이름으로 작업 단위를 설명하는 규칙"
    - id: role
      kind: "책임 분리"
      name: "Focused Methods"
      description: "한 메서드가 하나의 역할과 추상화 수준을 유지하는 구조"
    - id: readable
      kind: "결과"
      name: "Readable Flow"
      description: "호출부를 위에서 아래로 읽으며 동작을 이해할 수 있는 코드"
  steps:
    - title: "1. 짧음 확인"
      from: "Short Code"
      to: "Meaningful Names"
      route_label: "줄 수가 짧다는 사실만으로 코드의 품질을 판단하지 않는다."
      active_actors: [compact, name]
      description: "축약된 조건문과 일반적인 이름은 읽는 사람이 구현 세부를 다시 추적하게 만든다."
      payload: ["line count", "implicit intent", "generic name"]
      outcomes:
        - status: warning
          text: "짧은 코드와 읽기 쉬운 코드는 같은 기준이 아니다."
    - title: "2. 역할 분리"
      from: "Meaningful Names"
      to: "Focused Methods"
      route_label: "메서드 이름이 실제 작업 단위를 설명하도록 책임과 추상화 수준을 나눈다."
      active_actors: [name, role]
      description: "이름만 바꾸는 것이 아니라 각 메서드가 한 가지 이유로 변경되도록 정리한다."
      payload: ["intent", "single responsibility", "abstraction level"]
      outcomes:
        - status: allow
          text: "호출부에서 다음 동작을 이름만 보고 예상할 수 있다."
    - title: "3. 흐름 읽기"
      from: "Focused Methods"
      to: "Readable Flow"
      route_label: "작업 단위가 위에서 아래로 자연스럽게 이어져 코드를 읽는 경로가 짧아진다."
      active_actors: [role, readable, name]
      description: "조금 길어져도 의도와 책임이 보이면 유지보수 비용을 줄일 수 있다."
      payload: ["top-down", "readability", "maintenance"]
      outcomes:
        - status: allow
          text: "코드의 구조가 도메인 흐름을 설명한다."

clean_code_principles:
  eyebrow: "Interactive flow"
  title: "클린 코드 원칙의 연결"
  summary: "명확한 이름·작은 책임·일관된 추상화가 가독성을 만들고 변경 비용을 낮춘다."
  actors:
    - id: naming
      kind: "표현"
      name: "Clear Naming"
      description: "변수와 메서드가 의도와 도메인 의미를 드러내는 상태"
    - id: responsibility
      kind: "구조"
      name: "Focused Responsibility"
      description: "한 구성요소가 하나의 역할에 집중하는 구조"
    - id: consistency
      kind: "규칙"
      name: "Consistent Abstraction"
      description: "한 코드 블록 안에서 비슷한 수준의 개념을 다루는 규칙"
    - id: maintain
      kind: "결과"
      name: "Maintainability"
      description: "변경 영향과 이해 비용이 낮은 코드 상태"
  steps:
    - title: "1. 이름으로 의도 표현"
      from: "Clear Naming"
      to: "Focused Responsibility"
      route_label: "작업을 설명하는 이름을 사용해 메서드가 맡은 책임을 구분한다."
      active_actors: [naming, responsibility]
      description: "이름은 호출부가 구현을 열어보지 않고도 다음 동작을 이해하게 하는 경계다."
      payload: ["domain term", "intent", "method name"]
      outcomes:
        - status: info
          text: "이름이 모호하면 책임도 쉽게 섞인다."
    - title: "2. 책임과 추상화 정렬"
      from: "Focused Responsibility"
      to: "Consistent Abstraction"
      route_label: "메서드 내부의 단계들이 비슷한 추상화 수준을 유지하도록 구성한다."
      active_actors: [responsibility, consistency]
      description: "고수준 정책과 저수준 구현이 한 블록에 뒤섞이면 흐름을 읽기 어려워진다."
      payload: ["single role", "abstraction", "cohesion"]
      outcomes:
        - status: allow
          text: "변경 이유가 다른 코드가 서로 다른 위치에 놓인다."
    - title: "3. 유지보수성 확보"
      from: "Consistent Abstraction"
      to: "Maintainability"
      route_label: "일관된 구조를 바탕으로 읽기·테스트·변경의 비용을 낮춘다."
      active_actors: [consistency, maintain, naming]
      description: "클린 코드는 규칙을 외우는 것보다 다음 사람이 코드를 이해할 경로를 줄이는 데 있다."
      payload: ["readability", "testability", "change cost"]
      outcomes:
        - status: info
          text: "모든 메서드를 무조건 잘게 나누는 것이 목표는 아니다."

mvp_hypothesis_validation:
  eyebrow: "Interactive flow"
  title: "문제·가설·기능·검증"
  summary: "문제를 관찰하고 가설을 세운 뒤 필요한 기능만 구현해 결과로 다음 판단을 내린다."
  actors:
    - id: problem
      kind: "출발점"
      name: "User Problem"
      description: "사용자에게 반복적으로 나타나는 불편이나 비용"
    - id: hypothesis
      kind: "검증 주장"
      name: "Hypothesis"
      description: "어떤 변화가 문제를 줄일지 표현한 가설"
    - id: feature
      kind: "검증 수단"
      name: "MVP Feature"
      description: "가설을 검증하는 데 필요한 최소 기능"
    - id: result
      kind: "판단"
      name: "Evidence / Next Decision"
      description: "사용 결과와 지표를 바탕으로 한 다음 행동"
  steps:
    - title: "1. 문제 구체화"
      from: "User Problem"
      to: "Hypothesis"
      route_label: "누가 언제 어떤 비용을 겪는지 관찰하고 검증 가능한 가설로 바꾼다."
      active_actors: [problem, hypothesis]
      description: "기능 목록보다 먼저 해결하려는 사용자 문제를 명확히 한다."
      payload: ["user", "context", "pain"]
      outcomes:
        - status: info
          text: "문제가 흐리면 기능을 만든 뒤에도 무엇을 검증했는지 알기 어렵다."
    - title: "2. 최소 기능 구현"
      from: "Hypothesis"
      to: "MVP Feature"
      route_label: "가설의 핵심 부분을 검증하는 데 필요한 가장 작은 기능 범위를 정한다."
      active_actors: [hypothesis, feature]
      description: "완성된 서비스의 축소판이 아니라 하나의 질문에 답하는 실험에 가깝다."
      payload: ["scope", "feature", "experiment"]
      outcomes:
        - status: allow
          text: "구현 범위와 검증 질문이 연결된다."
    - title: "3. 결과로 판단"
      from: "MVP Feature"
      to: "Evidence / Next Decision"
      route_label: "사용 행동과 결과를 측정해 가설 유지·수정·폐기와 다음 실험을 결정한다."
      active_actors: [feature, result, hypothesis]
      description: "기능을 배포한 사실만으로 문제 해결이나 제품 가치를 증명할 수 없다."
      payload: ["usage", "metric", "learned evidence"]
      outcomes:
        - status: allow
          text: "검증 결과가 다음 개발의 입력이 된다."

mvp_scope_focus:
  eyebrow: "Interactive comparison"
  title: "넓은 초기 아이디어와 집중된 MVP"
  summary: "많은 기능을 동시에 만드는 대신 하나의 핵심 가설을 답할 수 있도록 범위를 제한한다."
  actors:
    - id: idea
      kind: "초기 아이디어"
      name: "Large Feature Set"
      description: "검색·추천·예약·결제를 한 번에 포함한 넓은 구상"
    - id: question
      kind: "핵심 질문"
      name: "One Hypothesis"
      description: "이번 실험에서 답하려는 하나의 사용자·제품 질문"
    - id: focused
      kind: "작은 범위"
      name: "Focused MVP"
      description: "핵심 질문에 필요한 최소 행동과 데이터만 포함한 실험"
    - id: learning
      kind: "학습 결과"
      name: "Interpretable Learning"
      description: "무엇이 가설에 영향을 줬는지 해석할 수 있는 결과"
  steps:
    - title: "1. 기능 나열"
      from: "Large Feature Set"
      to: "One Hypothesis"
      route_label: "초기 아이디어의 기능을 사용자 문제와 검증 질문으로 다시 정리한다."
      active_actors: [idea, question]
      description: "기능이 많아질수록 한 번의 결과를 어떤 가설과 연결할지 어려워진다."
      payload: ["map", "recommendation", "booking", "payment"]
      outcomes:
        - status: warning
          text: "넓은 범위는 구현보다 결과 해석의 비용을 키울 수 있다."
    - title: "2. 범위 제한"
      from: "One Hypothesis"
      to: "Focused MVP"
      route_label: "핵심 질문에 직접 필요한 사용자 흐름만 남기고 나머지는 다음 실험으로 미룬다."
      active_actors: [question, focused]
      description: "작은 MVP는 기능 수가 아니라 질문과 결과의 연결이 선명한 범위다."
      payload: ["one question", "minimum path", "scope cut"]
      outcomes:
        - status: allow
          text: "실험의 성공·실패 조건을 사전에 정의할 수 있다."
    - title: "3. 해석 가능한 학습"
      from: "Focused MVP"
      to: "Interpretable Learning"
      route_label: "작은 실험의 결과로 가설을 판단하고 다음 범위를 결정한다."
      active_actors: [focused, learning, question]
      description: "구현된 기능의 양보다 질문에 대한 학습의 질을 우선한다."
      payload: ["signal", "hypothesis result", "next iteration"]
      outcomes:
        - status: info
          text: "MVP의 목적은 빠른 학습이지 기능 목록의 완성 자체가 아니다."

keyword_vector_search:
  eyebrow: "Interactive comparison"
  title: "키워드 검색과 벡터 검색"
  summary: "키워드 검색은 정확한 용어에 강하고 벡터 검색은 표현이 달라도 의미가 가까운 문서를 찾는다."
  actors:
    - id: query
      kind: "질문"
      name: "User Query"
      description: "사용자가 입력한 자연어 질문"
    - id: keyword
      kind: "정확 매칭"
      name: "Keyword Search"
      description: "단어·구문·필드 일치를 기준으로 후보를 찾는 검색"
    - id: vector
      kind: "의미 매칭"
      name: "Vector Search"
      description: "문장 의미를 벡터 거리로 비교하는 검색"
    - id: result
      kind: "검색 결과"
      name: "Relevant Context"
      description: "답변이나 후속 처리에 사용할 문서 후보"
  steps:
    - title: "1. 정확한 표현 찾기"
      from: "User Query"
      to: "Keyword Search"
      route_label: "고유명사·에러 코드·날짜처럼 정확한 표현이 중요한 조건을 먼저 매칭한다."
      active_actors: [query, keyword]
      description: "검색어가 문서에 그대로 있어야 강점을 발휘하는 방식이다."
      payload: ["term", "exact match", "filter"]
      outcomes:
        - status: allow
          text: "정확한 용어와 조건을 놓치지 않는다."
    - title: "2. 의미가 가까운 문서 찾기"
      from: "User Query"
      to: "Vector Search"
      route_label: "단어가 달라도 의미가 유사한 문서를 임베딩 거리로 후보에 포함한다."
      active_actors: [query, vector]
      description: "표현의 차이를 넘어 질문과 문서의 의미적 근접성을 본다."
      payload: ["embedding", "similarity", "semantic match"]
      outcomes:
        - status: info
          text: "고유명사와 정확한 숫자는 별도 키워드·메타데이터 보강이 필요할 수 있다."
    - title: "3. 검색 결과 조합"
      from: "Keyword Search"
      to: "Relevant Context"
      route_label: "정확 매칭과 의미 매칭의 후보를 결합해 답변에 사용할 근거를 정리한다."
      active_actors: [keyword, vector, result]
      description: "실제 RAG에서는 두 검색 방식을 함께 사용해 서로의 약점을 보완할 수 있다."
      payload: ["hybrid", "rerank", "context"]
      outcomes:
        - status: allow
          text: "질문 유형에 따라 검색 전략을 조정할 수 있다."

developer_history_rag:
  eyebrow: "Interactive flow"
  title: "개인 개발 기록 RAG"
  summary: "TIL·트러블슈팅·ADR·커밋 기록을 색인하고 자연어 질문에 관련 근거와 출처를 반환한다."
  actors:
    - id: docs
      kind: "원문"
      name: "TIL / ADR / Commits"
      description: "개발 과정에서 축적된 문서와 변경 기록"
    - id: index
      kind: "색인"
      name: "Parser + Vector Index"
      description: "마크다운을 파싱해 청크·메타데이터·임베딩을 저장"
    - id: search
      kind: "검색"
      name: "Retrieval + Reranking"
      description: "질문과 관련된 기록을 찾고 순위를 조정하는 계층"
    - id: answer
      kind: "답변"
      name: "Answer + Sources"
      description: "검색 근거와 원문 출처를 포함한 설명형 답변"
  steps:
    - title: "1. 기록 색인"
      from: "TIL / ADR / Commits"
      to: "Parser + Vector Index"
      route_label: "문서를 파싱하고 프로젝트·기술·날짜·문제 같은 메타데이터와 함께 색인한다."
      active_actors: [docs, index]
      description: "원문과 구조화된 메타데이터를 함께 보존하면 검색 범위를 조절할 수 있다."
      payload: ["markdown", "chunk", "metadata", "embedding"]
      outcomes:
        - status: allow
          text: "과거 개발 기록이 검색 가능한 지식 기반이 된다."
    - title: "2. 관련 기록 검색"
      from: "Parser + Vector Index"
      to: "Retrieval + Reranking"
      route_label: "자연어 질문으로 관련 청크를 찾고 기술·프로젝트·시점 조건을 반영해 재정렬한다."
      active_actors: [index, search]
      description: "비슷한 문장뿐 아니라 질문의 도메인과 시간 맥락을 함께 본다."
      payload: ["query", "metadata filter", "rerank"]
      outcomes:
        - status: info
          text: "검색 실패와 생성 실패를 분리해 개선할 수 있다."
    - title: "3. 출처 포함 답변"
      from: "Retrieval + Reranking"
      to: "Answer + Sources"
      route_label: "검색 결과를 근거로 답변하고 원문 포스트·커밋·ADR 출처를 함께 반환한다."
      active_actors: [search, answer, docs]
      description: "개발 기록 검색에서는 결론뿐 아니라 왜 그렇게 판단했는지 근거가 중요하다."
      payload: ["context", "answer", "citation"]
      outcomes:
        - status: allow
          text: "답변을 원문으로 검증하고 과거 결정의 맥락을 다시 찾을 수 있다."

chunking_strategy:
  eyebrow: "Interactive comparison"
  title: "길이 기반과 의미 기반 청킹"
  summary: "길이 기반 청킹은 단순하고 예측 가능하며 의미 기반 청킹은 주제 경계를 보존하는 데 유리하다."
  actors:
    - id: document
      kind: "원문"
      name: "Document"
      description: "검색 대상이 되는 서술형 기술 문서"
    - id: length
      kind: "규칙 A"
      name: "Length-based Chunking"
      description: "토큰·문자·문장 수로 일정한 크기를 만드는 방식"
    - id: semantic
      kind: "규칙 B"
      name: "Semantic Chunking"
      description: "주제와 문단 의미의 경계를 따라 나누는 방식"
    - id: retrieval
      kind: "검색 품질"
      name: "Retrieval Context"
      description: "검색 결과가 답변에 제공하는 문맥의 단위"
  steps:
    - title: "1. 일정한 크기로 분할"
      from: "Document"
      to: "Length-based Chunking"
      route_label: "문서를 일정한 토큰·문자 길이로 나눠 구현과 운영을 단순하게 만든다."
      active_actors: [document, length]
      description: "크기와 비용을 예측하기 쉽지만 문장이 경계에서 끊길 수 있다."
      payload: ["token limit", "overlap", "fixed size"]
      outcomes:
        - status: info
          text: "단순한 문서와 초기 MVP에 적용하기 쉽다."
    - title: "2. 주제 경계로 분할"
      from: "Document"
      to: "Semantic Chunking"
      route_label: "문단·제목·주제 전환을 기준으로 같은 의미 단위를 하나의 청크로 묶는다."
      active_actors: [document, semantic]
      description: "문맥을 보존하는 대신 청크 크기와 처리 비용이 들쭉날쭉해질 수 있다."
      payload: ["topic boundary", "paragraph", "semantic shift"]
      outcomes:
        - status: allow
          text: "서술형 문서의 의미 단위를 보존하기 쉽다."
    - title: "3. 문서 특성에 맞춰 선택"
      from: "Length-based Chunking"
      to: "Retrieval Context"
      route_label: "문서 구조·질문 유형·비용을 평가해 청킹 전략과 overlap을 선택한다."
      active_actors: [length, semantic, retrieval]
      description: "항상 한 전략이 우월한 것이 아니라 검색 품질과 운영 비용의 균형을 찾는다."
      payload: ["recall", "context", "cost"]
      outcomes:
        - status: info
          text: "실제 질의 세트로 청크 전략을 비교해야 한다."

sdd_document_structure:
  eyebrow: "Interactive comparison"
  title: "단일 PRD와 분리된 SDD"
  summary: "제품 요구사항과 기술 설계를 한 문서에 섞지 않고 각 문서의 책임과 연결점을 분리한다."
  actors:
    - id: product
      kind: "제품 문서"
      name: "PRD"
      description: "문제·사용자·범위·성공 기준을 설명하는 문서"
    - id: design
      kind: "설계 문서"
      name: "SDD"
      description: "도메인·API·데이터·배포 구조를 설명하는 문서"
    - id: domain
      kind: "구현 경계"
      name: "Domain Ownership"
      description: "팀과 도메인의 책임·소유 데이터를 정의하는 구조"
    - id: team
      kind: "협업 결과"
      name: "Independent Implementation"
      description: "각 팀이 경계 안에서 독립적으로 구현할 수 있는 상태"
  steps:
    - title: "1. 제품 질문 정리"
      from: "PRD"
      to: "SDD"
      route_label: "문제·사용자·범위와 성공 기준을 기술 설계가 해결해야 할 입력으로 전달한다."
      active_actors: [product, design]
      description: "PRD는 무엇을 왜 만드는지, SDD는 어떻게 구성할지에 집중한다."
      payload: ["problem", "scope", "acceptance"]
      outcomes:
        - status: info
          text: "문서 한 장에 서로 다른 질문을 모두 넣지 않는다."
    - title: "2. 도메인 경계 설계"
      from: "SDD"
      to: "Domain Ownership"
      route_label: "도메인의 책임·소유 데이터·Internal API를 문서화한다."
      active_actors: [design, domain]
      description: "다른 도메인의 DB와 엔티티를 직접 참조하지 않도록 경계를 만든다."
      payload: ["domain", "data owner", "internal API"]
      outcomes:
        - status: allow
          text: "설계 문서가 구현 팀의 작업 경계를 제공한다."
    - title: "3. 독립 구현"
      from: "Domain Ownership"
      to: "Independent Implementation"
      route_label: "각 팀이 자신의 도메인 범위에서 엔티티와 비즈니스 로직을 구현한다."
      active_actors: [domain, team, design]
      description: "공유 규칙과 명시적 인터페이스가 병렬 개발의 기준이 된다."
      payload: ["implementation", "contract", "parallel work"]
      outcomes:
        - status: allow
          text: "문서 구조가 코드 소유권과 협업 방식을 뒷받침한다."

sdd_document_relationship:
  eyebrow: "Interactive flow"
  title: "SDD 문서 관계"
  summary: "상위 요구사항에서 도메인·API·데이터·배포 설계로 내려가고 각 문서는 서로의 결정을 참조한다."
  actors:
    - id: requirement
      kind: "상위 기준"
      name: "Requirements"
      description: "서비스 목표와 사용자 요구를 정리한 기준"
    - id: domain
      kind: "구조"
      name: "Domain Design"
      description: "도메인 책임과 소유 데이터를 나누는 설계"
    - id: api
      kind: "계약"
      name: "API / Interface"
      description: "도메인 간 통신과 외부 계약을 정의하는 설계"
    - id: delivery
      kind: "실행"
      name: "Data + Deployment"
      description: "저장 구조와 운영·배포 방식을 구체화하는 설계"
  steps:
    - title: "1. 요구사항 연결"
      from: "Requirements"
      to: "Domain Design"
      route_label: "제품 요구를 도메인 책임과 사용자 흐름으로 나눈다."
      active_actors: [requirement, domain]
      description: "기술 문서의 각 결정은 상위 요구사항을 추적할 수 있어야 한다."
      payload: ["use case", "domain", "responsibility"]
      outcomes:
        - status: info
          text: "도메인 경계가 문서 전체의 기준점이 된다."
    - title: "2. 계약 구체화"
      from: "Domain Design"
      to: "API / Interface"
      route_label: "도메인 사이의 데이터와 동작을 내부 API·인터페이스 계약으로 고정한다."
      active_actors: [domain, api]
      description: "직접 엔티티 참조 대신 명시적인 계약을 통해 변경 영향을 줄인다."
      payload: ["request", "response", "error contract"]
      outcomes:
        - status: allow
          text: "구현 팀이 서로의 내부 구조에 덜 의존한다."
    - title: "3. 저장과 운영 연결"
      from: "API / Interface"
      to: "Data + Deployment"
      route_label: "계약을 만족하는 데이터 모델과 배포·관찰·복구 방식을 설계한다."
      active_actors: [api, delivery, domain]
      description: "문서 관계는 구현 순서와 운영 책임까지 이어져야 한다."
      payload: ["schema", "deployment", "observability"]
      outcomes:
        - status: info
          text: "문서가 따로 있어도 결정과 참조 관계는 연결되어 있다."

agent_architecture:
  eyebrow: "Interactive flow"
  title: "AI Agent 전체 구조"
  summary: "에이전트는 목표를 해석하고 계획·도구 호출·관찰을 반복해 작업 결과를 만든다."
  actors:
    - id: goal
      kind: "입력"
      name: "User Goal"
      description: "사용자가 달성하려는 질문이나 작업 목표"
    - id: planner
      kind: "판단"
      name: "Planner / LLM"
      description: "현재 상태를 보고 다음 행동과 도구를 선택하는 모델"
    - id: tools
      kind: "실행"
      name: "Tools / Environment"
      description: "검색·코드·API·파일 시스템처럼 외부 상태를 바꾸거나 읽는 도구"
    - id: observe
      kind: "피드백"
      name: "Observation / Memory"
      description: "도구 결과와 작업 상태를 다음 판단의 입력으로 보존"
  steps:
    - title: "1. 목표 해석"
      from: "User Goal"
      to: "Planner / LLM"
      route_label: "사용자 목표를 성공 조건과 작업 단위로 해석해 다음 행동을 정한다."
      active_actors: [goal, planner]
      description: "단순 답변과 달리 목표를 달성하기 위한 여러 단계의 판단이 필요할 수 있다."
      payload: ["goal", "constraints", "context"]
      outcomes:
        - status: info
          text: "목표·제약·현재 상태가 계획의 기준이 된다."
    - title: "2. 도구 호출"
      from: "Planner / LLM"
      to: "Tools / Environment"
      route_label: "계획에 따라 검색·코드 실행·파일 수정·외부 API 같은 도구를 호출한다."
      active_actors: [planner, tools]
      description: "에이전트의 능력은 모델 응답뿐 아니라 도구의 범위와 권한에도 달려 있다."
      payload: ["tool call", "arguments", "permission"]
      outcomes:
        - status: allow
          text: "계획이 실제 환경의 변화나 정보 획득으로 이어진다."
    - title: "3. 관찰과 반복"
      from: "Tools / Environment"
      to: "Observation / Memory"
      route_label: "도구 결과와 오류를 관찰해 상태를 갱신하고 목표 달성 여부를 다시 판단한다."
      active_actors: [tools, observe, planner]
      description: "작업이 끝날 때까지 계획·행동·관찰 루프를 반복하며 필요하면 전략을 바꾼다."
      payload: ["result", "error", "next step"]
      outcomes:
        - status: info
          text: "반복 횟수·권한·중단 조건을 두지 않으면 비용과 위험이 커질 수 있다."

code_agent_loop:
  eyebrow: "Interactive flow"
  title: "코드 에이전트의 반복 루프"
  summary: "코드베이스를 탐색하고 수정한 뒤 테스트 결과를 읽어 다음 변경을 결정한다."
  actors:
    - id: task
      kind: "작업"
      name: "Coding Task"
      description: "버그 수정·기능 추가·리팩터링 목표"
    - id: explore
      kind: "탐색"
      name: "Repository Search"
      description: "파일·심볼·테스트·설정과 기존 구현을 찾는 단계"
    - id: edit
      kind: "변경"
      name: "Code Edit"
      description: "작은 범위의 코드와 테스트를 수정하는 단계"
    - id: test
      kind: "검증"
      name: "Tests / Feedback"
      description: "테스트·린트·빌드·실행 결과와 실패 원인"
  steps:
    - title: "1. 코드베이스 탐색"
      from: "Coding Task"
      to: "Repository Search"
      route_label: "요청과 관련된 구현·테스트·설정·문서를 찾아 현재 구조를 파악한다."
      active_actors: [task, explore]
      description: "파일을 바로 고치기보다 기존 규칙과 영향 범위를 먼저 확인한다."
      payload: ["task", "files", "symbols", "tests"]
      outcomes:
        - status: info
          text: "탐색 품질이 잘못된 파일 수정과 범위 누락을 줄인다."
    - title: "2. 작은 변경"
      from: "Repository Search"
      to: "Code Edit"
      route_label: "확인한 책임 범위 안에서 코드와 회귀 테스트를 함께 수정한다."
      active_actors: [explore, edit]
      description: "변경을 작게 유지하면 실패 원인을 되짚고 되돌리기 쉽다."
      payload: ["patch", "test case", "scope"]
      outcomes:
        - status: allow
          text: "작업 목표와 변경 파일의 관계가 추적 가능하다."
    - title: "3. 테스트 피드백"
      from: "Code Edit"
      to: "Tests / Feedback"
      route_label: "테스트와 정적 검사를 실행하고 실패 결과를 다음 탐색·수정의 입력으로 사용한다."
      active_actors: [edit, test, explore]
      description: "에이전트는 첫 수정으로 끝나는 것이 아니라 결과를 관찰하며 루프를 반복한다."
      payload: ["test", "lint", "build", "failure"]
      outcomes:
        - status: allow
          text: "통과하면 완료하고 실패하면 원인에 맞춰 다음 루프를 시작한다."

workflow_vs_agent:
  eyebrow: "Interactive comparison"
  title: "고정 워크플로우와 AI Agent"
  summary: "워크플로우는 미리 정한 순서를 실행하고 에이전트는 상태와 결과에 따라 다음 행동을 동적으로 선택한다."
  actors:
    - id: input
      kind: "요청"
      name: "Task Input"
      description: "처리해야 할 입력과 목표"
    - id: workflow
      kind: "고정 경로"
      name: "Deterministic Workflow"
      description: "정해진 단계와 분기 규칙을 실행하는 자동화"
    - id: agent
      kind: "동적 판단"
      name: "AI Agent"
      description: "도구 결과와 상태에 따라 다음 행동을 선택하는 실행 시스템"
    - id: result
      kind: "완료 기준"
      name: "Task Result"
      description: "업무 성공 여부와 검증 결과"
  steps:
    - title: "1. 정해진 단계 실행"
      from: "Task Input"
      to: "Deterministic Workflow"
      route_label: "입력이 알려진 구조라면 정해진 순서와 조건으로 빠르게 처리한다."
      active_actors: [input, workflow]
      description: "예측 가능한 반복 업무는 고정 워크플로우가 관찰과 비용 면에서 유리하다."
      payload: ["trigger", "step 1", "step 2"]
      outcomes:
        - status: allow
          text: "같은 입력 조건에서 같은 경로를 재현하기 쉽다."
    - title: "2. 상황별 다음 행동"
      from: "Task Input"
      to: "AI Agent"
      route_label: "목표와 현재 관찰 결과를 바탕으로 다음 도구와 순서를 동적으로 선택한다."
      active_actors: [input, agent]
      description: "예상하지 못한 코드·문서·오류를 다루는 작업에서 유연성을 얻는다."
      payload: ["plan", "tool choice", "observation"]
      outcomes:
        - status: info
          text: "유연성이 커지는 만큼 권한·비용·중단 조건이 필요하다."
    - title: "3. 결과 검증"
      from: "AI Agent"
      to: "Task Result"
      route_label: "워크플로우나 에이전트가 만든 결과를 테스트·승인·업무 지표로 검증한다."
      active_actors: [workflow, agent, result]
      description: "자동으로 실행됐다는 사실과 실제 업무 성공은 별도의 판단이다."
      payload: ["verification", "approval", "success"]
      outcomes:
        - status: allow
          text: "문제의 불확실성과 위험 수준에 맞는 자동화 방식을 선택한다."

unsafe_secret_sharing:
  eyebrow: "Interactive comparison"
  title: "안전하지 않은 Secret 공유"
  summary: "Slack·커밋·개인 .env로 비밀값을 전달하면 노출 범위와 폐기 경로를 통제하기 어렵다."
  actors:
    - id: secret
      kind: "민감 정보"
      name: "Production Secret"
      description: "API 키·DB 비밀번호·JWT 서명 키 같은 비밀값"
    - id: chat
      kind: "비공식 채널"
      name: "Slack / DM"
      description: "검색·전달·스크린샷이 가능한 사람 중심 채널"
    - id: env
      kind: "로컬 파일"
      name: "Personal .env"
      description: "사람의 노트북에 복사된 운영 비밀값"
    - id: exposure
      kind: "위험"
      name: "Uncontrolled Exposure"
      description: "누가 언제 접근했는지와 폐기 여부를 추적하기 어려운 상태"
  steps:
    - title: "1. 채팅으로 전달"
      from: "Production Secret"
      to: "Slack / DM"
      route_label: "긴급한 이유로 비밀값을 메신저에 직접 붙여 넣는다."
      active_actors: [secret, chat]
      description: "채널 보관·검색·재전달·알림이 비밀값의 새로운 복제본을 만든다."
      payload: ["token", "message", "copy"]
      outcomes:
        - status: warning
          text: "채팅 삭제만으로 이미 복사된 비밀값을 회수할 수 없다."
    - title: "2. 로컬 복사"
      from: "Slack / DM"
      to: "Personal .env"
      route_label: "개발자가 개인 로컬 파일에 운영 Secret을 복사해 사용한다."
      active_actors: [chat, env, secret]
      description: "백업·동기화·화면 공유·악성 프로그램 등 추가 노출 경로가 생긴다."
      payload: [".env", "local copy", "no rotation"]
      outcomes:
        - status: warning
          text: "환경별 값과 접근 권한이 사람별 파일에 흩어진다."
    - title: "3. 노출 통제 상실"
      from: "Personal .env"
      to: "Uncontrolled Exposure"
      route_label: "사용자·수명·접근 기록을 일관되게 관리하지 못해 폐기와 회수가 어려워진다."
      active_actors: [env, exposure, secret]
      description: "안전한 흐름은 비밀값을 전달하는 대신 권한이 있는 시스템이 주입하도록 만든다."
      payload: ["unknown copies", "no audit", "hard revoke"]
      outcomes:
        - status: reject
          text: "Secret은 코드·채팅·개인 파일 밖에서 수명과 접근을 관리해야 한다."

secret_lifecycle:
  eyebrow: "Interactive flow"
  title: "Secret 수명주기"
  summary: "Secret은 생성·저장·주입·회전·폐기까지 하나의 운영 흐름으로 관리한다."
  actors:
    - id: create
      kind: "생성"
      name: "Generate Secret"
      description: "예측하기 어려운 비밀값과 환경별 식별자를 만드는 단계"
    - id: vault
      kind: "보관"
      name: "Secret Manager"
      description: "접근 정책과 감사 기록을 가진 중앙 보관소"
    - id: runtime
      kind: "사용"
      name: "Runtime Injection"
      description: "권한 있는 애플리케이션과 배포 작업에만 Secret을 주입"
    - id: rotate
      kind: "폐기"
      name: "Rotate / Revoke"
      description: "주기·사고·담당자 변경에 따른 교체와 기존 값 폐기"
  steps:
    - title: "1. 안전한 생성"
      from: "Generate Secret"
      to: "Secret Manager"
      route_label: "환경과 용도를 구분한 Secret을 생성해 중앙 보관소에 저장한다."
      active_actors: [create, vault]
      description: "사람이 비밀값을 직접 만들고 복사하는 경로를 줄인다."
      payload: ["random value", "environment", "owner"]
      outcomes:
        - status: allow
          text: "값과 메타데이터가 관리 가능한 시스템에 들어간다."
    - title: "2. 권한 기반 주입"
      from: "Secret Manager"
      to: "Runtime Injection"
      route_label: "로컬·CI/CD·운영 런타임이 각자의 최소 권한으로 필요한 Secret만 읽는다."
      active_actors: [vault, runtime]
      description: "코드와 로그에 값을 남기지 않고 실행 시점에 주입한다."
      payload: ["least privilege", "runtime", "audit"]
      outcomes:
        - status: info
          text: "환경별 접근 주체와 허용 범위를 분리할 수 있다."
    - title: "3. 회전·폐기"
      from: "Runtime Injection"
      to: "Rotate / Revoke"
      route_label: "주기·사고·담당자 변경 시 새 값을 발급하고 이전 값을 폐기한다."
      active_actors: [runtime, rotate, vault]
      description: "수명 종료가 자동화되지 않으면 유출된 값이 오래 살아남을 수 있다."
      payload: ["rotation", "revoke", "grace period"]
      outcomes:
        - status: allow
          text: "Secret의 사용 기간과 복구 절차를 운영 정책으로 관리한다."

secure_secret_architecture:
  eyebrow: "Interactive flow"
  title: "환경별 Secret 관리 구조"
  summary: "로컬 개발·CI/CD·운영 런타임을 분리하고 각 주체에 필요한 최소 권한만 부여한다."
  actors:
    - id: local
      kind: "개발 환경"
      name: "Local Development"
      description: "개발자가 로컬에서 사용하는 환경별 Secret 접근"
    - id: cicd
      kind: "배포 환경"
      name: "CI/CD"
      description: "빌드·배포에 필요한 제한된 Secret 접근"
    - id: manager
      kind: "중앙 보관"
      name: "1Password / Bitwarden / AWS"
      description: "Secret을 저장하고 접근 정책·감사를 제공하는 시스템"
    - id: prod
      kind: "운영 런타임"
      name: "Application Role"
      description: "실행 중 필요한 값만 읽는 애플리케이션 IAM Role"
  steps:
    - title: "1. 개발자 접근"
      from: "Local Development"
      to: "1Password / Bitwarden / AWS"
      route_label: "개발자는 개인 권한으로 개발 환경 Secret을 가져오고 운영 값은 분리한다."
      active_actors: [local, manager]
      description: "로컬 편의성과 운영 Secret의 접근 범위를 같은 것으로 만들지 않는다."
      payload: ["developer", "dev secret", "audit"]
      outcomes:
        - status: info
          text: "사람의 접근과 애플리케이션의 접근을 분리한다."
    - title: "2. 배포 주입"
      from: "CI/CD"
      to: "1Password / Bitwarden / AWS"
      route_label: "배포 파이프라인은 제한된 서비스 계정으로 필요한 빌드·배포 값만 읽는다."
      active_actors: [cicd, manager]
      description: "CI 로그와 아티팩트에 Secret이 노출되지 않도록 마스킹·권한을 관리한다."
      payload: ["service account", "deploy secret", "masked log"]
      outcomes:
        - status: allow
          text: "배포 권한과 운영 데이터 접근을 구분할 수 있다."
    - title: "3. 런타임 최소 권한"
      from: "1Password / Bitwarden / AWS"
      to: "Application Role"
      route_label: "운영 애플리케이션은 자신의 역할에 허용된 경로와 Secret만 실행 시점에 읽는다."
      active_actors: [manager, prod, cicd]
      description: "코드에 값을 넣지 않고 IAM Role과 Secret 정책으로 접근을 제한한다."
      payload: ["IAM role", "path policy", "runtime injection"]
      outcomes:
        - status: allow
          text: "환경·주체·권한이 분리되어 유출과 회수 범위를 줄인다."

branch_split_strategy:
  eyebrow: "Interactive comparison"
  title: "develop와 배포 브랜치 분리"
  summary: "배포 대상이 계속 바뀌는 하나의 develop 흐름 대신 배포 검증 기준과 다음 개발 기준을 분리한다."
  actors:
    - id: develop
      kind: "개발 기준"
      name: "develop"
      description: "다음 기능 개발과 통합이 계속 진행되는 브랜치"
    - id: deploy
      kind: "배포 기준"
      name: "deploy/m2"
      description: "이번 릴리스에 들어갈 코드와 안정화 수정만 담는 브랜치"
    - id: verify
      kind: "검증"
      name: "Release Verification"
      description: "고정된 배포 대상에 대한 테스트와 운영 점검"
    - id: main
      kind: "운영"
      name: "main"
      description: "검증된 릴리스를 운영에 반영하는 기준"
  steps:
    - title: "1. 개발 흐름 유지"
      from: "develop"
      to: "deploy/m2"
      route_label: "배포 시점의 develop을 배포 브랜치로 고정해 검증 대상을 만든다."
      active_actors: [develop, deploy]
      description: "이후 develop에는 다음 기능이 들어가도 이번 배포 기준은 흔들리지 않는다."
      payload: ["snapshot", "release scope", "feature work"]
      outcomes:
        - status: allow
          text: "배포 대상과 다음 개발 대상을 분리한다."
    - title: "2. 배포 안정화"
      from: "deploy/m2"
      to: "Release Verification"
      route_label: "배포 브랜치에는 안정화에 필요한 최소 수정만 넣고 반복 검증한다."
      active_actors: [deploy, verify]
      description: "대규모 리팩터링과 다음 기능을 섞지 않아 검증 범위를 통제한다."
      payload: ["bug fix", "config", "test"]
      outcomes:
        - status: info
          text: "무엇을 배포하는지 고정되어 검증을 처음부터 반복하는 비용을 줄인다."
    - title: "3. 운영 반영"
      from: "Release Verification"
      to: "main"
      route_label: "검증된 배포 브랜치를 main에 병합하고 수정사항을 develop에도 반영한다."
      active_actors: [verify, main, deploy, develop]
      description: "배포 수정이 다음 개발 기준에서 사라지지 않도록 두 흐름을 동기화한다."
      payload: ["merge", "release", "backport"]
      outcomes:
        - status: allow
          text: "안정화와 다음 기능 개발을 병렬로 운영할 수 있다."

branch_parallel_workflow:
  eyebrow: "Interactive flow"
  title: "배포와 다음 개발의 병렬 흐름"
  summary: "deploy 브랜치는 현재 릴리스를 안정화하고 develop은 다음 기능을 이어 가며, 배포 결과는 두 기준에 반영한다."
  actors:
    - id: snapshot
      kind: "분기점"
      name: "Release Snapshot"
      description: "배포 시점의 코드 기준점"
    - id: release
      kind: "배포 트랙"
      name: "deploy/m2"
      description: "설정·버그 수정·검증을 진행하는 배포 작업"
    - id: feature
      kind: "개발 트랙"
      name: "develop / feature"
      description: "다음 기능을 개발하고 통합하는 작업"
    - id: sync
      kind: "동기화"
      name: "Merge Back"
      description: "배포 수정과 릴리스 결과를 개발 기준에 반영"
  steps:
    - title: "1. 기준점 생성"
      from: "Release Snapshot"
      to: "deploy/m2"
      route_label: "배포할 코드를 스냅샷으로 고정하고 배포 트랙을 만든다."
      active_actors: [snapshot, release]
      description: "배포 중 새 기능이 들어와 검증 기준이 변하는 것을 막는다."
      payload: ["snapshot", "release branch", "scope"]
      outcomes:
        - status: allow
          text: "현재 릴리스의 변경 범위가 고정된다."
    - title: "2. 두 트랙 병렬 작업"
      from: "deploy/m2"
      to: "develop / feature"
      route_label: "배포 트랙은 안정화하고 개발 트랙은 다음 기능을 계속 구현한다."
      active_actors: [release, feature]
      description: "각 트랙의 목적과 허용 변경을 다르게 유지한다."
      payload: ["stabilize", "new feature", "parallel"]
      outcomes:
        - status: info
          text: "릴리스 안정화가 다음 개발의 진행을 막지 않는다."
    - title: "3. 수정사항 동기화"
      from: "deploy/m2"
      to: "Merge Back"
      route_label: "운영에 반영한 안정화 수정과 결정사항을 develop에 병합해 기준을 맞춘다."
      active_actors: [release, sync, feature]
      description: "동기화를 빼먹으면 다음 릴리스에서 같은 버그가 되살아날 수 있다."
      payload: ["merge", "backport", "shared fix"]
      outcomes:
        - status: allow
          text: "두 작업 흐름이 다음 릴리스 기준에서 다시 합쳐진다."

memory_tree_compare:
  eyebrow: "Interactive comparison"
  title: "RAG와 Memory Tree 검색"
  summary: "일반 RAG는 원문 청크 유사도를 중심으로 찾고 Memory Tree는 압축된 계층에서 관련 가지를 좁혀 내려간다."
  actors:
    - id: query
      kind: "질문"
      name: "Memory Query"
      description: "과거 결정·경험·맥락을 찾으려는 질문"
    - id: rag
      kind: "평면 검색"
      name: "RAG Chunks"
      description: "원문을 나눈 청크와 벡터 유사도 기반 검색"
    - id: tree
      kind: "계층 검색"
      name: "Memory Tree"
      description: "요약·프로젝트·주제 계층을 따라 가지를 좁히는 구조"
    - id: context
      kind: "회수 결과"
      name: "Relevant Memory"
      description: "답변에 사용할 원문과 계층 맥락"
  steps:
    - title: "1. 원문 청크 검색"
      from: "Memory Query"
      to: "RAG Chunks"
      route_label: "질문과 의미적으로 가까운 원문 청크를 벡터 검색으로 찾는다."
      active_actors: [query, rag]
      description: "구현이 단순하고 비정형 문서에 적용하기 쉽지만 상하위 관계가 약할 수 있다."
      payload: ["embedding", "chunk", "similarity"]
      outcomes:
        - status: info
          text: "가까운 문장이 반드시 필요한 기억의 전체 맥락은 아닐 수 있다."
    - title: "2. 계층 가지 좁히기"
      from: "Memory Query"
      to: "Memory Tree"
      route_label: "프로젝트·기술·결정 같은 상위 요약에서 관련 가지를 단계적으로 좁힌다."
      active_actors: [query, tree]
      description: "계층이 기억의 상하위 관계와 요약된 맥락을 검색 경로에 포함한다."
      payload: ["hierarchy", "summary", "branch"]
      outcomes:
        - status: allow
          text: "검색 범위를 구조적으로 줄이고 관련 맥락을 함께 회수할 수 있다."
    - title: "3. 원문과 맥락 결합"
      from: "Memory Tree"
      to: "Relevant Memory"
      route_label: "선택한 가지의 요약·메타데이터와 원문 근거를 함께 답변 컨텍스트로 만든다."
      active_actors: [tree, rag, context]
      description: "계층 요약만으로 결론을 만들지 않고 원문 근거로 검증한다."
      payload: ["summary", "source", "context"]
      outcomes:
        - status: allow
          text: "검색 정확도와 기억의 관계·맥락을 함께 고려한다."

developer_memory_tree:
  eyebrow: "Interactive flow"
  title: "개인 개발 기록 Memory Tree"
  summary: "프로젝트·기술·학습의 계층 아래에 결정과 원문 기록을 연결하고 메타데이터·벡터 검색을 보완한다."
  actors:
    - id: record
      kind: "원본 기록"
      name: "TIL / Incident / ADR"
      description: "학습·장애·기술 선택·요구사항을 담은 원문"
    - id: metadata
      kind: "분류"
      name: "Project / Topic / Time"
      description: "기록의 프로젝트·기술·시점·상태 메타데이터"
    - id: tree
      kind: "계층"
      name: "Developer Memory Tree"
      description: "상위 맥락에서 세부 결정과 원문으로 내려가는 구조"
    - id: search
      kind: "검색"
      name: "Vector + Source Retrieval"
      description: "계층 조건과 의미 검색으로 근거를 찾는 검색 계층"
  steps:
    - title: "1. 기록 수집"
      from: "TIL / Incident / ADR"
      to: "Project / Topic / Time"
      route_label: "원문 기록에 프로젝트·기술·시점·문제 유형 같은 메타데이터를 붙인다."
      active_actors: [record, metadata]
      description: "기록의 내용뿐 아니라 언제·어떤 맥락에서 만들어졌는지를 보존한다."
      payload: ["source", "project", "topic", "date"]
      outcomes:
        - status: info
          text: "같은 단어라도 프로젝트와 시점에 따라 의미를 구분할 수 있다."
    - title: "2. 계층 연결"
      from: "Project / Topic / Time"
      to: "Developer Memory Tree"
      route_label: "상위 프로젝트·기술 아래에 결정·문제·해결 과정을 연결해 기억 구조를 만든다."
      active_actors: [metadata, tree, record]
      description: "원문을 단순 목록으로 두지 않고 상하위 관계와 반복되는 맥락을 표현한다."
      payload: ["project", "decision", "incident", "relation"]
      outcomes:
        - status: allow
          text: "과거 기록을 현재 질문의 맥락으로 좁혀갈 수 있다."
    - title: "3. 근거 검색"
      from: "Developer Memory Tree"
      to: "Vector + Source Retrieval"
      route_label: "계층 조건으로 범위를 좁힌 뒤 벡터 검색과 원문 출처로 답변 근거를 회수한다."
      active_actors: [tree, search, record]
      description: "요약된 기억이 원문과 분리되지 않도록 항상 출처를 따라갈 수 있게 한다."
      payload: ["branch filter", "embedding", "source link"]
      outcomes:
        - status: allow
          text: "과거 구현과 결정의 이유를 다시 확인할 수 있다."

spark_agent_transition:
  eyebrow: "Interactive flow"
  title: "챗봇에서 상시 실행 Agent로"
  summary: "요청마다 답하는 챗봇에서 상태를 보존하고 조건을 기다리며 행동하는 실행 시스템으로 확장한다."
  actors:
    - id: chat
      kind: "기존 모델"
      name: "Interactive Chatbot"
      description: "사용자 요청에 즉시 텍스트 답변을 반환하는 시스템"
    - id: state
      kind: "상태"
      name: "Persistent State"
      description: "작업·사용자·예약·실행 결과를 장기간 보존하는 상태"
    - id: scheduler
      kind: "대기·계획"
      name: "Scheduler / Trigger"
      description: "시간·이벤트·조건을 기다렸다가 작업을 시작하는 계층"
    - id: agent
      kind: "실행"
      name: "Cloud Agent"
      description: "도구를 호출하고 결과를 관찰하며 목표까지 작업하는 실행 시스템"
  steps:
    - title: "1. 즉시 답변"
      from: "Interactive Chatbot"
      to: "Persistent State"
      route_label: "대화 요청과 중요한 작업 상태를 사용자·세션·작업 단위로 저장한다."
      active_actors: [chat, state]
      description: "상시 실행으로 가려면 한 번의 응답을 넘어 상태와 재개 지점을 관리해야 한다."
      payload: ["conversation", "task", "user context"]
      outcomes:
        - status: info
          text: "대화 기록과 실행 상태를 구분해 보존한다."
    - title: "2. 조건 대기"
      from: "Persistent State"
      to: "Scheduler / Trigger"
      route_label: "예약 시간·외부 이벤트·조건 충족을 기다렸다가 다음 실행을 트리거한다."
      active_actors: [state, scheduler]
      description: "사용자가 매번 다시 요청하지 않아도 작업이 재개되는 구조다."
      payload: ["schedule", "event", "condition"]
      outcomes:
        - status: allow
          text: "상태와 트리거가 결합해 지속적인 작업을 만들 수 있다."
    - title: "3. 도구 실행"
      from: "Scheduler / Trigger"
      to: "Cloud Agent"
      route_label: "에이전트가 필요한 도구를 호출하고 결과를 저장하며 다음 행동을 선택한다."
      active_actors: [scheduler, agent, state]
      description: "24시간 실행 시스템은 모델 품질뿐 아니라 권한·재시도·관찰·비용 정책이 핵심이다."
      payload: ["tool call", "execution", "observation"]
      outcomes:
        - status: info
          text: "챗봇과 상시 에이전트의 차이는 답변 생성보다 상태·시간·행동의 운영에 있다."

jvm_runtime_flow:
  eyebrow: "Interactive flow"
  title: "Java 프로그램의 JVM 실행 흐름"
  summary: "소스 코드를 바이트코드로 빌드하고 JVM이 로드·검증·실행하며 런타임 메모리를 관리한다."
  actors:
    - id: source
      kind: "입력"
      name: "Java Source"
      description: "개발자가 작성한 .java 소스 코드"
    - id: compiler
      kind: "변환"
      name: "javac / Bytecode"
      description: "소스를 플랫폼 중립적인 .class 바이트코드로 변환"
    - id: jvm
      kind: "실행 환경"
      name: "JVM"
      description: "클래스 로딩·검증·실행과 메모리 관리를 담당"
    - id: os
      kind: "호스트"
      name: "OS / CPU"
      description: "JVM이 네이티브 자원과 시스템 호출을 사용하는 환경"
  steps:
    - title: "1. 바이트코드 생성"
      from: "Java Source"
      to: "javac / Bytecode"
      route_label: "javac가 소스 코드를 클래스 파일과 JAR로 변환한다."
      active_actors: [source, compiler]
      description: "소스와 실행 환경 사이에 JVM이 이해하는 중간 표현을 둔다."
      payload: [".java", ".class", "JAR"]
      outcomes:
        - status: allow
          text: "같은 바이트코드를 여러 JVM 환경에서 재사용할 수 있다."
    - title: "2. 클래스 로딩·실행"
      from: "javac / Bytecode"
      to: "JVM"
      route_label: "JVM이 클래스를 로드하고 검증한 뒤 인터프리터·JIT로 실행한다."
      active_actors: [compiler, jvm]
      description: "JVM은 클래스 로딩과 실행뿐 아니라 런타임 메모리 상태도 관리한다."
      payload: ["ClassLoader", "verification", "JIT"]
      outcomes:
        - status: info
          text: "바이트코드 실행과 네이티브 라이브러리 호환성은 별도 조건이다."
    - title: "3. 호스트 자원 사용"
      from: "JVM"
      to: "OS / CPU"
      route_label: "JVM이 스레드·메모리·파일·네트워크 같은 호스트 자원을 사용한다."
      active_actors: [jvm, os]
      description: "플랫폼별 JVM 구현이 같은 Java 프로그램을 대상 OS·CPU에 연결한다."
      payload: ["thread", "heap", "system call"]
      outcomes:
        - status: allow
          text: "실제 실행 검증은 JVM·API·네이티브 의존성을 함께 확인한다."

gc_generations:
  eyebrow: "Interactive flow"
  title: "JVM 세대별 Heap 구조"
  summary: "새 객체는 Young 영역에서 시작하고 오래 살아남은 객체는 Old 영역으로 승격되며 각 세대의 수집 비용을 나눈다."
  actors:
    - id: object
      kind: "할당"
      name: "New Object"
      description: "실행 중 새로 생성된 객체"
    - id: eden
      kind: "Young"
      name: "Eden / Survivor"
      description: "짧게 살아가는 객체를 모으는 영역"
    - id: old
      kind: "Old"
      name: "Old Generation"
      description: "여러 번 살아남은 객체가 이동하는 영역"
    - id: gc
      kind: "수집"
      name: "GC Collector"
      description: "도달 가능성을 확인하고 영역별로 회수·압축하는 구성요소"
  steps:
    - title: "1. Young 할당"
      from: "New Object"
      to: "Eden / Survivor"
      route_label: "새 객체를 Eden에 할당하고 Minor GC 때 살아남은 객체를 Survivor로 옮긴다."
      active_actors: [object, eden]
      description: "대부분의 객체가 짧게 살아간다는 가정을 이용해 수집 범위를 작게 시작한다."
      payload: ["allocation", "Eden", "Minor GC"]
      outcomes:
        - status: info
          text: "Young 영역의 수집은 비교적 짧은 작업을 목표로 한다."
    - title: "2. 생존 객체 승격"
      from: "Eden / Survivor"
      to: "Old Generation"
      route_label: "여러 번의 수집에서 살아남은 객체를 Old 영역으로 승격한다."
      active_actors: [eden, old]
      description: "장수 객체를 매번 Young에서 다시 검사하는 비용을 줄인다."
      payload: ["survivor", "age", "promotion"]
      outcomes:
        - status: allow
          text: "세대별 생존 기간에 맞춰 수집 정책을 나눌 수 있다."
    - title: "3. 영역별 수집"
      from: "Old Generation"
      to: "GC Collector"
      route_label: "수집기가 Young·Old 영역의 도달 가능 객체와 회수 대상을 판단한다."
      active_actors: [old, gc, eden]
      description: "Heap 구조와 수집기 알고리즘에 따라 pause와 처리량의 균형이 달라진다."
      payload: ["reachability", "mark", "compact"]
      outcomes:
        - status: info
          text: "GC는 메모리 부족을 해결하는 동시에 애플리케이션 지연에 영향을 준다."

gc_mark_sweep:
  eyebrow: "Interactive flow"
  title: "Mark-Sweep GC"
  summary: "GC Root에서 도달 가능한 객체를 표시하고 표시되지 않은 객체의 공간을 회수한다."
  actors:
    - id: heap
      kind: "대상"
      name: "Heap Objects"
      description: "현재 Heap에 할당된 객체 그래프"
    - id: root
      kind: "시작점"
      name: "GC Roots"
      description: "스레드 스택·정적 필드 등 객체 그래프를 시작하는 참조"
    - id: mark
      kind: "표시"
      name: "Mark Reachable"
      description: "Root에서 도달 가능한 객체를 살아 있음으로 표시"
    - id: sweep
      kind: "회수"
      name: "Sweep Unmarked"
      description: "표시되지 않은 객체의 메모리를 회수하는 단계"
  steps:
    - title: "1. Root에서 탐색"
      from: "GC Roots"
      to: "Heap Objects"
      route_label: "GC Root가 참조를 따라 Heap 객체 그래프를 순회한다."
      active_actors: [root, heap]
      description: "도달 가능 여부가 객체 생존 판단의 기준이 된다."
      payload: ["stack", "static", "reference graph"]
      outcomes:
        - status: info
          text: "참조가 끊긴 객체는 애플리케이션에서 더 이상 사용할 수 없다."
    - title: "2. 생존 객체 표시"
      from: "Heap Objects"
      to: "Mark Reachable"
      route_label: "Root에서 도달한 객체를 살아 있는 객체로 표시한다."
      active_actors: [heap, mark, root]
      description: "표시 단계는 회수하면 안 되는 객체를 구분하기 위한 준비다."
      payload: ["reachable", "mark bit", "live object"]
      outcomes:
        - status: allow
          text: "사용 중인 객체가 회수 대상에서 제외된다."
    - title: "3. 미표시 공간 회수"
      from: "Mark Reachable"
      to: "Sweep Unmarked"
      route_label: "표시되지 않은 객체의 공간을 free list로 돌려 다음 할당에 재사용한다."
      active_actors: [mark, sweep, heap]
      description: "Sweep 뒤 단편화가 남을 수 있어 수집기에 따라 압축 단계를 추가한다."
      payload: ["unmarked", "free space", "fragmentation"]
      outcomes:
        - status: allow
          text: "도달 불가능한 객체의 메모리를 회수한다."

gc_collection_cycle:
  eyebrow: "Interactive flow"
  title: "GC 수집 사이클"
  summary: "객체 할당이 늘고 임계치를 넘으면 GC가 살아 있는 객체를 확인하고 공간을 회수한 뒤 실행을 재개한다."
  actors:
    - id: app
      kind: "실행"
      name: "Application Threads"
      description: "객체를 생성하고 참조를 변경하는 애플리케이션 스레드"
    - id: heap
      kind: "메모리"
      name: "Heap Pressure"
      description: "할당 증가와 가용 공간 부족을 나타내는 Heap 상태"
    - id: collector
      kind: "수집기"
      name: "GC Phase"
      description: "Mark·Sweep·Copy·Compact 같은 수집 단계"
    - id: resume
      kind: "재개"
      name: "Application Resume"
      description: "수집이 끝난 뒤 애플리케이션이 다시 실행되는 상태"
  steps:
    - title: "1. 객체 할당"
      from: "Application Threads"
      to: "Heap Pressure"
      route_label: "애플리케이션이 새 객체를 만들며 Heap 사용량을 높인다."
      active_actors: [app, heap]
      description: "짧은 객체와 오래 살아남는 객체가 함께 Heap에 쌓인다."
      payload: ["new object", "reference", "allocation"]
      outcomes:
        - status: info
          text: "할당 속도와 객체 수명이 GC 빈도에 영향을 준다."
    - title: "2. 수집 실행"
      from: "Heap Pressure"
      to: "GC Phase"
      route_label: "임계치와 수집 정책에 따라 살아 있는 객체를 식별하고 회수한다."
      active_actors: [heap, collector, app]
      description: "수집 중 애플리케이션이 멈추는 범위와 시간은 알고리즘마다 다르다."
      payload: ["threshold", "mark", "sweep/compact"]
      outcomes:
        - status: warning
          text: "긴 pause는 애플리케이션 응답 지연으로 관찰될 수 있다."
    - title: "3. 메모리 재사용"
      from: "GC Phase"
      to: "Application Resume"
      route_label: "회수된 공간을 재사용할 수 있게 만들고 애플리케이션 실행을 이어 간다."
      active_actors: [collector, resume, heap]
      description: "GC 성능은 단순히 회수량보다 지연·처리량·메모리 여유를 함께 봐야 한다."
      payload: ["free space", "resume", "pause time"]
      outcomes:
        - status: allow
          text: "수집 후 애플리케이션이 다시 객체를 할당한다."

josephus_rotation:
  eyebrow: "Interactive flow"
  title: "Josephus 문제와 큐 회전"
  summary: "현재 큐의 앞 원소를 뒤로 보내는 회전을 반복해 K번째 사람을 제거한다."
  actors:
    - id: queue
      kind: "자료구조"
      name: "Queue"
      description: "원형 순서를 큐의 앞·뒤 연산으로 표현"
    - id: rotate
      kind: "이동"
      name: "Rotate K - 1"
      description: "제거 대상 전까지 앞 원소를 뒤로 이동"
    - id: remove
      kind: "제거"
      name: "Poll / Eliminate"
      description: "K번째가 된 현재 앞 원소를 큐에서 제거"
    - id: result
      kind: "결과"
      name: "Survivor Order"
      description: "제거 순서와 마지막 생존자"
  steps:
    - title: "1. 원형 순서 시작"
      from: "Queue"
      to: "Rotate K - 1"
      route_label: "큐의 앞에서 시작해 제거 대상 직전까지 원소를 뒤로 보낸다."
      active_actors: [queue, rotate]
      description: "인덱스를 계산하지 않고 큐의 순환 연산으로 원형 이동을 표현한다."
      payload: ["front", "K", "rotation"]
      outcomes:
        - status: info
          text: "현재 큐의 순서가 다음 제거 위치를 결정한다."
    - title: "2. K번째 제거"
      from: "Rotate K - 1"
      to: "Poll / Eliminate"
      route_label: "K번째 원소가 큐의 앞에 오면 poll해 제거한다."
      active_actors: [rotate, remove, queue]
      description: "제거 후 남은 큐가 다음 라운드의 새로운 원형 순서가 된다."
      payload: ["Kth item", "poll", "removed"]
      outcomes:
        - status: allow
          text: "제거 인덱스를 직접 계산하지 않고 자료구조 연산으로 해결한다."
    - title: "3. 반복과 생존자"
      from: "Poll / Eliminate"
      to: "Survivor Order"
      route_label: "큐에 한 명이 남을 때까지 회전과 제거를 반복해 순서를 기록한다."
      active_actors: [remove, result, queue]
      description: "반복 조건과 K의 범위를 명확히 하면 구현과 검증이 단순해진다."
      payload: ["remaining", "elimination order", "survivor"]
      outcomes:
        - status: allow
          text: "문제의 원형 규칙이 큐의 FIFO 연산으로 변환된다."

josephus_solution:
  eyebrow: "Interactive flow"
  title: "Josephus 큐 구현"
  summary: "초기 큐를 만들고 K-1회 회전·제거를 반복하며 마지막 원소를 결과로 반환한다."
  actors:
    - id: input
      kind: "입력"
      name: "N, K"
      description: "사람 수와 몇 번째마다 제거할지 나타내는 값"
    - id: init
      kind: "초기화"
      name: "Initialize Queue"
      description: "1부터 N까지 사람을 큐에 넣는 단계"
    - id: loop
      kind: "반복"
      name: "Rotate + Poll Loop"
      description: "K-1회 이동하고 한 명을 제거하는 반복"
    - id: output
      kind: "출력"
      name: "Survivor"
      description: "마지막까지 남은 사람과 제거 순서"
  steps:
    - title: "1. 입력과 큐 생성"
      from: "N, K"
      to: "Initialize Queue"
      route_label: "N명의 순서와 K를 읽고 1부터 N까지 큐에 삽입한다."
      active_actors: [input, init]
      description: "자료구조 상태를 문제의 원형 순서와 동일하게 초기화한다."
      payload: ["N", "K", "1..N"]
      outcomes:
        - status: allow
          text: "초기 순서가 큐의 앞에서 뒤로 표현된다."
    - title: "2. 제거 반복"
      from: "Initialize Queue"
      to: "Rotate + Poll Loop"
      route_label: "큐 크기가 1보다 큰 동안 K-1회 회전 후 poll을 수행한다."
      active_actors: [init, loop]
      description: "각 반복의 큐 상태를 출력하면 원형 제거 순서를 검증할 수 있다."
      payload: ["while size > 1", "K-1 rotate", "poll"]
      outcomes:
        - status: info
          text: "큐가 비어 있거나 K가 유효하지 않은 입력도 별도로 검증한다."
    - title: "3. 결과 반환"
      from: "Rotate + Poll Loop"
      to: "Survivor"
      route_label: "반복이 끝나면 큐의 마지막 원소를 생존자로 반환한다."
      active_actors: [loop, output]
      description: "제거 순서와 마지막 값이 문제의 요구 출력과 일치하는지 확인한다."
      payload: ["last item", "result", "complexity"]
      outcomes:
        - status: allow
          text: "인덱스 수식 없이 큐의 회전으로 문제를 해결한다."

interceptor_request_flow:
  eyebrow: "Interactive flow"
  title: "Spring MVC Interceptor 요청 흐름"
  summary: "DispatcherServlet이 컨트롤러를 호출하기 전·후에 Interceptor가 공통 요청 처리를 끼워 넣는다."
  actors:
    - id: request
      kind: "입력"
      name: "HTTP Request"
      description: "클라이언트에서 들어온 웹 요청"
    - id: dispatcher
      kind: "중앙 조정"
      name: "DispatcherServlet"
      description: "핸들러를 찾고 MVC 호출 흐름을 조정하는 서블릿"
    - id: interceptor
      kind: "공통 처리"
      name: "HandlerInterceptor"
      description: "preHandle·postHandle·afterCompletion으로 요청 주변을 관찰"
    - id: controller
      kind: "업무 처리"
      name: "Controller"
      description: "요청에 대한 애플리케이션 기능을 실행"
  steps:
    - title: "1. 요청 진입"
      from: "HTTP Request"
      to: "DispatcherServlet"
      route_label: "요청이 Spring MVC의 중앙 DispatcherServlet로 들어온다."
      active_actors: [request, dispatcher]
      description: "DispatcherServlet이 매핑과 인터셉터 체인을 구성한다."
      payload: ["path", "method", "headers"]
      outcomes:
        - status: info
          text: "Interceptor는 서블릿 필터와 다른 MVC 호출 경계에 있다."
    - title: "2. 전처리"
      from: "DispatcherServlet"
      to: "HandlerInterceptor"
      route_label: "preHandle에서 인증·로깅·권한 같은 공통 요청 전처리를 수행한다."
      active_actors: [dispatcher, interceptor]
      description: "false를 반환하면 컨트롤러 호출을 중단할 수도 있다."
      payload: ["preHandle", "auth", "logging"]
      outcomes:
        - status: reject
          text: "전처리 실패 시 업무 컨트롤러까지 요청을 전달하지 않는다."
    - title: "3. 컨트롤러 호출과 후처리"
      from: "HandlerInterceptor"
      to: "Controller"
      route_label: "전처리를 통과하면 컨트롤러를 호출하고 postHandle·afterCompletion을 실행한다."
      active_actors: [interceptor, controller, dispatcher]
      description: "응답 생성 전후와 완료 시점을 나눠 공통 책임을 배치한다."
      payload: ["controller", "postHandle", "afterCompletion"]
      outcomes:
        - status: allow
          text: "요청 흐름의 MVC 경계에 공통 로직을 둘 수 있다."

filter_interceptor_compare:
  eyebrow: "Interactive comparison"
  title: "Filter와 Interceptor의 위치"
  summary: "Filter는 서블릿 컨테이너 경계에서 동작하고 Interceptor는 Spring MVC 핸들러 호출 경계에서 동작한다."
  actors:
    - id: client
      kind: "요청"
      name: "HTTP Request"
      description: "웹 애플리케이션으로 들어오는 요청"
    - id: filter
      kind: "서블릿 경계"
      name: "Servlet Filter"
      description: "DispatcherServlet 전후의 넓은 서블릿 요청 처리"
    - id: interceptor
      kind: "MVC 경계"
      name: "Spring Interceptor"
      description: "HandlerMapping과 Controller 주변의 MVC 처리"
    - id: handler
      kind: "핸들러"
      name: "Controller / Handler"
      description: "Spring MVC가 선택한 실제 요청 처리 메서드"
  steps:
    - title: "1. 컨테이너 진입"
      from: "HTTP Request"
      to: "Servlet Filter"
      route_label: "요청이 DispatcherServlet에 도달하기 전 Filter 체인을 통과한다."
      active_actors: [client, filter]
      description: "인코딩·CORS·보안처럼 Spring MVC 밖에서도 필요한 책임에 적합하다."
      payload: ["container", "filter chain", "request wrapper"]
      outcomes:
        - status: info
          text: "Filter는 MVC 핸들러를 모르는 요청에도 적용할 수 있다."
    - title: "2. MVC 핸들러 전후"
      from: "Servlet Filter"
      to: "Spring Interceptor"
      route_label: "DispatcherServlet이 핸들러를 찾은 뒤 Interceptor의 MVC 콜백을 실행한다."
      active_actors: [filter, interceptor]
      description: "preHandle·postHandle·afterCompletion은 핸들러 실행 맥락을 사용할 수 있다."
      payload: ["handler", "preHandle", "afterCompletion"]
      outcomes:
        - status: allow
          text: "컨트롤러 단위 인증·권한·로깅 정책을 표현하기 쉽다."
    - title: "3. 업무 처리"
      from: "Spring Interceptor"
      to: "Controller / Handler"
      route_label: "공통 처리를 통과한 요청이 실제 Controller 메서드로 전달된다."
      active_actors: [interceptor, handler]
      description: "공통 로직의 적용 범위와 실행 시점을 기준으로 Filter와 Interceptor를 선택한다."
      payload: ["handler mapping", "controller", "response"]
      outcomes:
        - status: allow
          text: "각 계층의 경계에 맞는 책임 배치가 가능하다."

aop_proxy_flow:
  eyebrow: "Interactive flow"
  title: "Spring AOP 프록시 흐름"
  summary: "호출부는 프록시를 호출하고 프록시가 공통 관심사를 실행한 뒤 실제 대상 객체의 메서드로 위임한다."
  actors:
    - id: caller
      kind: "호출부"
      name: "Client / Service Caller"
      description: "업무 메서드를 호출하는 코드"
    - id: proxy
      kind: "횡단 관심사"
      name: "AOP Proxy"
      description: "트랜잭션·로깅·보안 advice를 감싸는 프록시 객체"
    - id: advice
      kind: "공통 로직"
      name: "Advice / Pointcut"
      description: "어떤 호출에 어떤 공통 동작을 적용할지 정하는 구성"
    - id: target
      kind: "업무 객체"
      name: "Target Object"
      description: "실제 비즈니스 메서드를 구현한 대상 객체"
  steps:
    - title: "1. 프록시 호출"
      from: "Client / Service Caller"
      to: "AOP Proxy"
      route_label: "호출부가 컨테이너가 주입한 프록시 객체의 메서드를 호출한다."
      active_actors: [caller, proxy]
      description: "호출부는 프록시가 어떤 부가 처리를 하는지 몰라도 계약을 사용할 수 있다."
      payload: ["method call", "bean", "proxy"]
      outcomes:
        - status: info
          text: "프록시를 거치지 않는 자기 호출은 기대한 advice가 실행되지 않을 수 있다."
    - title: "2. Advice 실행"
      from: "AOP Proxy"
      to: "Advice / Pointcut"
      route_label: "Pointcut에 맞는 호출이면 트랜잭션·로깅·권한 같은 advice를 실행한다."
      active_actors: [proxy, advice]
      description: "공통 관심사를 업무 코드에서 분리하되 적용 범위는 명시적으로 관리한다."
      payload: ["pointcut", "before", "around"]
      outcomes:
        - status: allow
          text: "반복되는 공통 처리를 한 곳에서 정책화할 수 있다."
    - title: "3. 대상 위임"
      from: "Advice / Pointcut"
      to: "Target Object"
      route_label: "공통 처리를 마친 프록시가 실제 대상 객체의 업무 메서드로 위임한다."
      active_actors: [advice, target, proxy]
      description: "응답 이후 after 동작과 예외 처리는 advice 설정에 따라 이어진다."
      payload: ["proceed", "business logic", "after"]
      outcomes:
        - status: allow
          text: "업무 객체는 공통 인프라 코드와 느슨하게 결합된다."

fetch_join_rows:
  eyebrow: "Interactive comparison"
  title: "Collection Fetch Join의 행 증가"
  summary: "부모와 여러 자식을 한 번에 조인하면 관계형 결과 행이 자식 수만큼 늘어나 페이징이 흔들릴 수 있다."
  actors:
    - id: parent
      kind: "부모 엔티티"
      name: "Order / Parent"
      description: "페이지 단위로 조회하려는 부모 엔티티"
    - id: child
      kind: "컬렉션"
      name: "Order Items"
      description: "한 부모에 여러 개 연결된 자식 컬렉션"
    - id: join
      kind: "SQL 결과"
      name: "Join Result Rows"
      description: "부모·자식 조인으로 생성된 실제 DB 결과 행"
    - id: page
      kind: "페이징"
      name: "Page Boundary"
      description: "offset·limit가 적용되는 결과 범위"
  steps:
    - title: "1. 부모-자식 조인"
      from: "Order / Parent"
      to: "Order Items"
      route_label: "부모 한 건과 여러 자식 행을 컬렉션 fetch join으로 함께 조회한다."
      active_actors: [parent, child]
      description: "객체 관점의 한 부모가 SQL 결과에서는 자식 수만큼 반복된다."
      payload: ["one-to-many", "fetch join", "collection"]
      outcomes:
        - status: warning
          text: "부모 개수와 결과 행 개수가 같다고 가정하면 안 된다."
    - title: "2. 결과 행 증가"
      from: "Order Items"
      to: "Join Result Rows"
      route_label: "자식 컬렉션의 각 행이 부모 정보와 결합되어 결과 행을 만든다."
      active_actors: [child, join, parent]
      description: "중복처럼 보이는 부모 행은 조인 결과의 자연스러운 형태다."
      payload: ["row multiplication", "duplicate parent", "SQL result"]
      outcomes:
        - status: info
          text: "ORM이 객체로 합쳐도 DB 결과 자체의 크기는 줄지 않는다."
    - title: "3. 페이징 영향"
      from: "Join Result Rows"
      to: "Page Boundary"
      route_label: "증가한 SQL 결과에 limit·offset을 적용하면 부모 페이지가 예상과 달라질 수 있다."
      active_actors: [join, page]
      description: "컬렉션 fetch join과 페이징은 별도 조회·batch 전략을 검토해야 한다."
      payload: ["limit", "offset", "parent page"]
      outcomes:
        - status: reject
          text: "컬렉션 fetch join에 무조건 DB 페이징을 붙이는 방식은 위험하다."

pagination_toone_tomany:
  eyebrow: "Interactive comparison"
  title: "ToOne과 ToMany 페이징"
  summary: "ToOne 조인은 행 증가가 제한적이지만 ToMany 컬렉션 조인은 부모 페이지를 왜곡할 수 있어 조회 전략을 나눈다."
  actors:
    - id: page
      kind: "기준"
      name: "Parent Page"
      description: "부모 엔티티를 페이지로 나누려는 요구"
    - id: toone
      kind: "단일 관계"
      name: "ToOne Join"
      description: "각 부모에 최대 하나가 연결되는 관계"
    - id: tomany
      kind: "컬렉션 관계"
      name: "ToMany Join"
      description: "부모 하나에 여러 자식이 연결되는 관계"
    - id: strategy
      kind: "조회 전략"
      name: "Two-step / Batch Query"
      description: "부모 페이지와 자식 조회를 분리하는 전략"
  steps:
    - title: "1. ToOne 함께 조회"
      from: "Parent Page"
      to: "ToOne Join"
      route_label: "부모 페이지를 기준으로 ToOne 관계를 함께 조인해도 행 증가가 제한적이다."
      active_actors: [page, toone]
      description: "ToOne은 페이지 대상의 행 수를 크게 늘리지 않는 경우가 많다."
      payload: ["many-to-one", "one-to-one", "join"]
      outcomes:
        - status: allow
          text: "페이지 기준과 조인 결과의 관계가 비교적 예측 가능하다."
    - title: "2. ToMany 위험 확인"
      from: "Parent Page"
      to: "ToMany Join"
      route_label: "컬렉션을 함께 조인하면 자식 수만큼 결과 행이 늘어 페이지 경계가 깨질 수 있다."
      active_actors: [page, tomany]
      description: "ORM 중복 제거와 DB limit·offset 적용 시점이 서로 다르다."
      payload: ["one-to-many", "row increase", "pagination"]
      outcomes:
        - status: warning
          text: "컬렉션 fetch join과 페이징을 같은 쿼리로 해결하려 하지 않는다."
    - title: "3. 조회 분리"
      from: "ToMany Join"
      to: "Two-step / Batch Query"
      route_label: "부모 ID를 먼저 페이지 조회한 뒤 자식은 batch·별도 쿼리로 가져온다."
      active_actors: [tomany, strategy, page]
      description: "정확한 부모 페이지와 연관 데이터 로딩을 각자의 쿼리로 통제한다."
      payload: ["parent IDs", "batch size", "secondary query"]
      outcomes:
        - status: allow
          text: "페이지 정확성과 N+1 방지를 함께 고려할 수 있다."

mdc_logging_flow:
  eyebrow: "Interactive flow"
  title: "MDC 기반 요청 로깅"
  summary: "요청 식별자와 사용자·트레이스 정보를 MDC에 넣고 로그 이벤트 전체에 문맥을 붙인다."
  actors:
    - id: request
      kind: "입력"
      name: "HTTP Request"
      description: "요청 ID·사용자·경로를 가진 요청"
    - id: mdc
      kind: "문맥"
      name: "MDC Context"
      description: "현재 스레드 로그에 공통 필드를 공급하는 진단 문맥"
    - id: service
      kind: "업무 처리"
      name: "Service / AOP"
      description: "업무 메서드와 공통 로깅 advice"
    - id: sink
      kind: "저장·검색"
      name: "Structured Log Sink"
      description: "JSON 로그를 수집하고 requestId로 추적하는 시스템"
  steps:
    - title: "1. 요청 문맥 설정"
      from: "HTTP Request"
      to: "MDC Context"
      route_label: "요청 진입점에서 requestId·userId·path 같은 필드를 MDC에 넣는다."
      active_actors: [request, mdc]
      description: "요청 단위 식별자가 있어야 여러 서비스 로그를 다시 연결할 수 있다."
      payload: ["requestId", "userId", "traceId"]
      outcomes:
        - status: allow
          text: "공통 로그 문맥이 요청 시작부터 유지된다."
    - title: "2. 업무 로그 생성"
      from: "MDC Context"
      to: "Service / AOP"
      route_label: "서비스와 AOP advice가 같은 MDC 문맥으로 시작·종료·예외 로그를 기록한다."
      active_actors: [mdc, service]
      description: "업무 코드가 식별자 전달을 매번 직접 구현하지 않도록 공통 계층이 보완한다."
      payload: ["start", "end", "exception"]
      outcomes:
        - status: info
          text: "비동기 전환 시 MDC 전파와 정리 정책을 별도로 확인한다."
    - title: "3. 구조화 수집"
      from: "Service / AOP"
      to: "Structured Log Sink"
      route_label: "구조화된 로그를 수집 시스템에 보내 requestId와 필드로 검색한다."
      active_actors: [service, sink, mdc]
      description: "로그를 단순 문자열이 아닌 후속 분석 가능한 이벤트로 설계한다."
      payload: ["JSON log", "requestId", "search"]
      outcomes:
        - status: allow
          text: "요청 한 건의 흐름과 실패 지점을 추적할 수 있다."

logging_pipeline:
  eyebrow: "Interactive flow"
  title: "로깅 데이터 파이프라인"
  summary: "애플리케이션 로그를 구조화·수집·전달·저장하고 검색과 알림으로 운영에 활용한다."
  actors:
    - id: app
      kind: "생성"
      name: "Application Logs"
      description: "업무 이벤트·오류·성능을 담은 구조화 로그"
    - id: collector
      kind: "수집"
      name: "Collector / Agent"
      description: "호스트와 컨테이너의 로그를 모아 전달하는 수집기"
    - id: store
      kind: "저장·검색"
      name: "Log Store"
      description: "기간·필드·requestId로 로그를 검색하는 저장소"
    - id: ops
      kind: "활용"
      name: "Dashboard / Alert"
      description: "지표·대시보드·알림과 장애 분석을 수행하는 운영 계층"
  steps:
    - title: "1. 구조화 로그 생성"
      from: "Application Logs"
      to: "Collector / Agent"
      route_label: "애플리케이션이 이벤트와 오류를 구조화된 형식으로 기록한다."
      active_actors: [app, collector]
      description: "requestId·서비스·레벨·시간 같은 필드를 처음부터 일관되게 남긴다."
      payload: ["JSON", "level", "requestId"]
      outcomes:
        - status: allow
          text: "후속 파이프라인이 문자열 파싱에 덜 의존한다."
    - title: "2. 수집·저장"
      from: "Collector / Agent"
      to: "Log Store"
      route_label: "수집기가 로그를 전달하고 보존 기간·인덱스·접근 정책에 따라 저장한다."
      active_actors: [collector, store]
      description: "수집 장애와 로그 폭증도 운영 비용과 유실 가능성에 포함된다."
      payload: ["ship", "index", "retention"]
      outcomes:
        - status: info
          text: "로그 저장소가 원본 데이터베이스의 대체재가 되지 않도록 경계를 둔다."
    - title: "3. 검색·알림"
      from: "Log Store"
      to: "Dashboard / Alert"
      route_label: "운영자가 필드와 시간 범위로 검색하고 임계치·패턴에 따라 알림을 받는다."
      active_actors: [store, ops]
      description: "기록만 쌓는 것이 아니라 장애 감지와 원인 분석까지 연결해야 한다."
      payload: ["query", "dashboard", "alert"]
      outcomes:
        - status: allow
          text: "로그 이벤트가 운영 의사결정의 근거가 된다."

vm_container_compare:
  eyebrow: "Interactive comparison"
  title: "VM과 컨테이너 격리"
  summary: "VM은 게스트 커널까지 가상화하고 컨테이너는 호스트 커널을 공유하면서 프로세스·자원 경계를 만든다."
  actors:
    - id: app
      kind: "실행 단위"
      name: "Application"
      description: "실행할 애플리케이션과 의존성"
    - id: vm
      kind: "가상화"
      name: "Virtual Machine"
      description: "게스트 OS와 커널을 포함한 가상 실행 환경"
    - id: container
      kind: "프로세스 격리"
      name: "Container"
      description: "호스트 커널을 공유하면서 네임스페이스·cgroup으로 격리된 프로세스"
    - id: host
      kind: "호스트"
      name: "Host Kernel / Hardware"
      description: "시스템 콜과 CPU·메모리·디스크를 제공하는 호스트"
  steps:
    - title: "1. VM 실행"
      from: "Application"
      to: "Virtual Machine"
      route_label: "애플리케이션이 게스트 OS와 커널을 포함한 VM 안에서 실행된다."
      active_actors: [app, vm]
      description: "강한 경계와 독립된 커널을 얻지만 이미지와 부팅 비용이 커진다."
      payload: ["guest OS", "kernel", "virtual hardware"]
      outcomes:
        - status: info
          text: "VM은 하드웨어 수준에 가까운 격리를 제공한다."
    - title: "2. 컨테이너 실행"
      from: "Application"
      to: "Container"
      route_label: "애플리케이션을 이미지로 묶고 호스트 커널 위의 격리된 프로세스로 실행한다."
      active_actors: [app, container]
      description: "컨테이너는 빠르고 가볍지만 호스트 커널과 런타임의 영향을 받는다."
      payload: ["image", "namespace", "cgroup"]
      outcomes:
        - status: allow
          text: "프로세스·파일 시스템·자원 사용량을 논리적으로 분리한다."
    - title: "3. 시스템 콜 경계"
      from: "Container"
      to: "Host Kernel / Hardware"
      route_label: "컨테이너 프로세스가 호스트 커널의 시스템 콜과 하드웨어 자원을 사용한다."
      active_actors: [container, host, vm]
      description: "격리 수준과 호환성 요구에 따라 VM과 컨테이너의 선택이 달라진다."
      payload: ["system call", "CPU", "memory"]
      outcomes:
        - status: info
          text: "컨테이너는 작은 VM이 아니라 커널을 공유하는 격리 방식이다."

container_isolation:
  eyebrow: "Interactive flow"
  title: "컨테이너 Namespace와 Cgroup"
  summary: "Namespace는 무엇을 볼 수 있는지 나누고 Cgroup은 얼마나 사용할 수 있는지 제한한다."
  actors:
    - id: process
      kind: "프로세스"
      name: "Container Process"
      description: "컨테이너 안에서 실행되는 애플리케이션 프로세스"
    - id: namespace
      kind: "가시성 격리"
      name: "Linux Namespace"
      description: "PID·네트워크·마운트·사용자 공간을 분리하는 기능"
    - id: cgroup
      kind: "자원 제한"
      name: "Control Group"
      description: "CPU·메모리·I/O 사용량을 제한하고 집계하는 기능"
    - id: host
      kind: "공유 기반"
      name: "Host Kernel"
      description: "격리 기능과 실제 자원을 제공하는 호스트 커널"
  steps:
    - title: "1. 보이는 세계 분리"
      from: "Container Process"
      to: "Linux Namespace"
      route_label: "프로세스가 자신의 PID·네트워크·마운트 공간만 보도록 네임스페이스를 적용한다."
      active_actors: [process, namespace]
      description: "컨테이너 프로세스가 호스트의 모든 프로세스와 인터페이스를 보지 않게 한다."
      payload: ["PID", "network", "mount", "user"]
      outcomes:
        - status: allow
          text: "프로세스 관점의 가시성이 분리된다."
    - title: "2. 자원 사용량 제한"
      from: "Container Process"
      to: "Control Group"
      route_label: "컨테이너별 CPU·메모리·I/O 한도와 사용량을 cgroup으로 관리한다."
      active_actors: [process, cgroup]
      description: "한 컨테이너의 폭주가 호스트와 다른 컨테이너 자원을 모두 소진하지 않도록 한다."
      payload: ["CPU quota", "memory limit", "usage"]
      outcomes:
        - status: info
          text: "격리와 제한은 별개이므로 두 기능을 함께 설계한다."
    - title: "3. 호스트 커널 사용"
      from: "Linux Namespace"
      to: "Host Kernel"
      route_label: "Namespace와 Cgroup이 호스트 커널의 기능으로 프로세스와 자원을 분리한다."
      active_actors: [namespace, cgroup, host]
      description: "컨테이너는 호스트 커널과 런타임의 보안 설정에 의존한다."
      payload: ["kernel", "isolation", "security"]
      outcomes:
        - status: info
          text: "컨테이너 보안은 이미지·권한·커널 설정까지 포함한다."

docker_image_layers:
  eyebrow: "Interactive flow"
  title: "Docker 이미지와 RootFS"
  summary: "Dockerfile 명령이 읽기 전용 레이어를 만들고 실행 시 컨테이너의 writable layer와 RootFS를 구성한다."
  actors:
    - id: dockerfile
      kind: "정의"
      name: "Dockerfile"
      description: "베이스 이미지와 설치·복사 명령을 선언한 파일"
    - id: layers
      kind: "불변 레이어"
      name: "Image Layers"
      description: "명령별로 쌓이고 공유·캐시되는 읽기 전용 레이어"
    - id: rootfs
      kind: "실행 파일 시스템"
      name: "Merged RootFS"
      description: "레이어를 합쳐 컨테이너에 보이는 파일 시스템"
    - id: writable
      kind: "실행 변경"
      name: "Writable Layer"
      description: "실행 중 파일 변경이 기록되는 컨테이너 전용 영역"
  steps:
    - title: "1. 이미지 빌드"
      from: "Dockerfile"
      to: "Image Layers"
      route_label: "베이스 이미지와 각 명령을 레이어로 빌드해 이미지 저장소에 저장한다."
      active_actors: [dockerfile, layers]
      description: "변경이 적은 명령을 앞에 두면 빌드 캐시와 레이어 공유를 활용할 수 있다."
      payload: ["FROM", "RUN", "COPY", "layer"]
      outcomes:
        - status: allow
          text: "이미지는 여러 불변 레이어의 조합으로 만들어진다."
    - title: "2. RootFS 조합"
      from: "Image Layers"
      to: "Merged RootFS"
      route_label: "런타임이 이미지 레이어를 합쳐 컨테이너에 보이는 RootFS를 만든다."
      active_actors: [layers, rootfs]
      description: "레이어를 공유하면서도 컨테이너마다 독립적인 실행 뷰를 제공한다."
      payload: ["overlay", "rootfs", "read-only"]
      outcomes:
        - status: info
          text: "이미지 레이어와 실행 파일 시스템을 같은 개념으로 보지 않는다."
    - title: "3. 실행 중 쓰기"
      from: "Merged RootFS"
      to: "Writable Layer"
      route_label: "컨테이너 실행 중 변경은 별도의 writable layer에 기록된다."
      active_actors: [rootfs, writable]
      description: "컨테이너를 삭제하면 이 실행 변경도 사라질 수 있어 영속 데이터는 볼륨으로 분리한다."
      payload: ["copy-on-write", "runtime write", "volume"]
      outcomes:
        - status: warning
          text: "이미지에 포함된 파일과 컨테이너 실행 데이터를 분리해야 한다."

cloud_troubleshooting:
  eyebrow: "Interactive flow"
  title: "클라우드 배포 장애 진단"
  summary: "배포 결과를 애플리케이션·네트워크·인프라·관찰 지표로 나눠 원인 범위를 좁힌다."
  actors:
    - id: deploy
      kind: "변경"
      name: "Deployment"
      description: "새 이미지·설정·인프라를 반영한 배포 작업"
    - id: app
      kind: "애플리케이션"
      name: "Application Health"
      description: "시작 로그·헬스 엔드포인트·의존성 연결 상태"
    - id: infra
      kind: "인프라"
      name: "Network / IAM / Compute"
      description: "보안 그룹·라우팅·권한·인스턴스 자원"
    - id: observe
      kind: "관찰"
      name: "Logs / Metrics / Alerts"
      description: "실패 시점과 영향 범위를 확인하는 운영 신호"
  steps:
    - title: "1. 배포 시점 고정"
      from: "Deployment"
      to: "Logs / Metrics / Alerts"
      route_label: "배포 버전·설정·실패 시간과 영향 범위를 먼저 고정한다."
      active_actors: [deploy, observe]
      description: "재현 가능한 사건 단위가 있어야 이전 정상 상태와 비교할 수 있다."
      payload: ["release", "timestamp", "impact"]
      outcomes:
        - status: info
          text: "증상과 배포 변경을 동일한 시간축에서 본다."
    - title: "2. 앱 상태 확인"
      from: "Logs / Metrics / Alerts"
      to: "Application Health"
      route_label: "시작 로그·헬스 체크·환경 변수·의존성 연결을 확인한다."
      active_actors: [observe, app]
      description: "애플리케이션이 시작하지 못했는지, 시작 후 요청만 실패하는지 나눈다."
      payload: ["startup", "health", "config", "dependency"]
      outcomes:
        - status: allow
          text: "애플리케이션 자체 문제의 범위를 좁힌다."
    - title: "3. 인프라 경계 확인"
      from: "Application Health"
      to: "Network / IAM / Compute"
      route_label: "앱이 정상이어도 네트워크 경로·권한·인스턴스 자원·로드밸런서 상태를 확인한다."
      active_actors: [app, infra, observe]
      description: "클라우드 장애는 코드·설정·권한·네트워크의 경계에서 생길 수 있다."
      payload: ["security group", "route", "IAM", "capacity"]
      outcomes:
        - status: info
          text: "관찰 가능한 증거를 기준으로 하나씩 범위를 줄인다."

aws_request_flow:
  eyebrow: "Interactive flow"
  title: "AWS 요청과 VPC 내부 흐름"
  summary: "사용자 요청이 진입점과 애플리케이션을 거쳐 VPC의 RDS PostgreSQL에 도달하고 응답으로 돌아온다."
  actors:
    - id: client
      kind: "외부 요청"
      name: "Client / DNS"
      description: "도메인으로 서비스를 요청하는 클라이언트"
    - id: edge
      kind: "진입점"
      name: "Load Balancer / Public Subnet"
      description: "외부 요청을 VPC 내부 애플리케이션으로 전달하는 계층"
    - id: app
      kind: "업무 처리"
      name: "Spring EC2 / Private Subnet"
      description: "비즈니스 로직을 실행하는 애플리케이션 인스턴스"
    - id: db
      kind: "데이터"
      name: "RDS PostgreSQL"
      description: "VPC 내부에서 원본 데이터를 저장하는 관리형 DB"
  steps:
    - title: "1. 외부 진입"
      from: "Client / DNS"
      to: "Load Balancer / Public Subnet"
      route_label: "DNS가 요청을 AWS 진입점으로 연결하고 로드밸런서가 대상 그룹을 선택한다."
      active_actors: [client, edge]
      description: "공개 서브넷과 보안 규칙은 외부에서 접근할 경계를 정의한다."
      payload: ["DNS", "HTTP", "target group"]
      outcomes:
        - status: allow
          text: "외부 요청이 애플리케이션 진입점에 도착한다."
    - title: "2. 애플리케이션 처리"
      from: "Load Balancer / Public Subnet"
      to: "Spring EC2 / Private Subnet"
      route_label: "로드밸런서가 사설 서브넷의 Spring 애플리케이션으로 요청을 전달한다."
      active_actors: [edge, app]
      description: "앱 인스턴스를 외부에 직접 노출하지 않고 네트워크 경계를 둔다."
      payload: ["private subnet", "security group", "request"]
      outcomes:
        - status: info
          text: "진입점과 업무 서버의 역할을 분리한다."
    - title: "3. DB 조회·응답"
      from: "Spring EC2 / Private Subnet"
      to: "RDS PostgreSQL"
      route_label: "애플리케이션이 내부 라우팅과 권한을 거쳐 RDS에서 데이터를 읽고 응답을 반환한다."
      active_actors: [app, db, edge]
      description: "DB는 퍼블릭 접근을 열기보다 애플리케이션 경계 안에서 연결한다."
      payload: ["SQL", "RDS", "response"]
      outcomes:
        - status: allow
          text: "요청·네트워크·애플리케이션·데이터 경계가 이어진다."

deployment_automation:
  eyebrow: "Interactive flow"
  title: "CI/CD와 Auto Scaling 배포"
  summary: "코드를 빌드해 이미지를 ECR에 저장하고 배포 신호가 ASG 인스턴스 교체로 이어진다."
  actors:
    - id: ci
      kind: "검증·빌드"
      name: "CI/CD Pipeline"
      description: "테스트·빌드·배포 명령을 실행하는 파이프라인"
    - id: ecr
      kind: "이미지 저장"
      name: "Amazon ECR"
      description: "컨테이너 이미지를 버전별로 저장하는 레지스트리"
    - id: asg
      kind: "배포 대상"
      name: "Auto Scaling Group"
      description: "정상 인스턴스 수와 교체 정책을 관리하는 그룹"
    - id: health
      kind: "검증"
      name: "Health Check / Load Balancer"
      description: "새 인스턴스가 트래픽을 받을 수 있는지 확인"
  steps:
    - title: "1. 이미지 빌드·저장"
      from: "CI/CD Pipeline"
      to: "Amazon ECR"
      route_label: "테스트를 통과한 코드를 이미지로 빌드하고 태그를 붙여 ECR에 푸시한다."
      active_actors: [ci, ecr]
      description: "배포 대상은 재현 가능한 이미지 버전으로 고정한다."
      payload: ["test", "image", "tag"]
      outcomes:
        - status: allow
          text: "배포 파이프라인과 실행 아티팩트가 연결된다."
    - title: "2. 인스턴스 교체"
      from: "Amazon ECR"
      to: "Auto Scaling Group"
      route_label: "ASG가 새 이미지로 인스턴스를 생성하거나 기존 인스턴스를 교체한다."
      active_actors: [ecr, asg]
      description: "교체 방식과 desired capacity가 배포 중 가용 용량을 결정한다."
      payload: ["image tag", "instance", "desired capacity"]
      outcomes:
        - status: info
          text: "한 번에 전체를 내리지 않는 배포 전략을 선택할 수 있다."
    - title: "3. 헬스 확인"
      from: "Auto Scaling Group"
      to: "Health Check / Load Balancer"
      route_label: "새 인스턴스가 시작·헬스 체크를 통과하면 트래픽 대상에 포함한다."
      active_actors: [asg, health, ci]
      description: "검증 실패 시 교체를 멈추고 롤백할 수 있는 기준이 필요하다."
      payload: ["startup", "readiness", "traffic"]
      outcomes:
        - status: allow
          text: "자동 배포가 검증과 롤백 정책까지 포함한다."

harness_instructions:
  eyebrow: "Interactive comparison"
  title: "AI Harness와 Instructions"
  summary: "Instructions는 무엇을 해야 하는지 설명하고 Harness는 실제 도구·상태·검증 루프를 실행한다."
  actors:
    - id: goal
      kind: "규칙·목표"
      name: "Instructions"
      description: "프로젝트 규칙·목표·제약·작업 지침"
    - id: harness
      kind: "실행 환경"
      name: "Harness"
      description: "도구 호출·컨텍스트 로딩·권한·실행 상태를 조정하는 시스템"
    - id: model
      kind: "판단"
      name: "AI Model"
      description: "현재 목표와 관찰 결과를 바탕으로 다음 행동을 선택"
    - id: feedback
      kind: "검증"
      name: "Tools / Tests"
      description: "파일·셸·테스트·외부 시스템의 실제 결과"
  steps:
    - title: "1. 지침 제공"
      from: "Instructions"
      to: "AI Model"
      route_label: "프로젝트 규칙과 작업 목표를 모델이 이해할 수 있는 컨텍스트로 제공한다."
      active_actors: [goal, model]
      description: "지침은 방향과 제약을 표현하지만 파일을 직접 수정하거나 테스트를 실행하지 않는다."
      payload: ["goal", "rules", "constraints"]
      outcomes:
        - status: info
          text: "무엇을 해야 하는지와 실제 실행 방법을 구분한다."
    - title: "2. Harness 실행"
      from: "AI Model"
      to: "Harness"
      route_label: "Harness가 모델의 계획을 도구 호출·파일 접근·실행 권한과 연결한다."
      active_actors: [model, harness]
      description: "에이전트의 재현성과 안전성은 Harness의 실행 경계에 크게 의존한다."
      payload: ["tool call", "workspace", "permission"]
      outcomes:
        - status: allow
          text: "계획이 실제 작업으로 변환된다."
    - title: "3. 결과 피드백"
      from: "Harness"
      to: "Tools / Tests"
      route_label: "도구와 테스트 결과를 다시 모델에 전달해 다음 행동이나 완료 여부를 판단한다."
      active_actors: [harness, feedback, model]
      description: "정답 지침만으로는 충분하지 않고 관찰 가능한 실행 결과가 필요하다."
      payload: ["stdout", "test result", "error"]
      outcomes:
        - status: allow
          text: "Instructions와 Harness가 목표·실행·검증 루프를 이룬다."

agent_harness:
  eyebrow: "Interactive flow"
  title: "AI Agent Harness 구조"
  summary: "에이전트 모델을 도구·컨텍스트·권한·검증·상태 관리와 연결하는 실행 기반을 구성한다."
  actors:
    - id: task
      kind: "입력"
      name: "Task + Context"
      description: "사용자 요청과 프로젝트 규칙·현재 상태"
    - id: planner
      kind: "판단"
      name: "Agent Model"
      description: "다음 단계와 도구 사용을 계획하는 모델"
    - id: runtime
      kind: "실행 기반"
      name: "Harness Runtime"
      description: "도구 호출·권한·파일·실행 상태를 중재하는 런타임"
    - id: verify
      kind: "검증"
      name: "Observation / Tests"
      description: "실행 결과와 검증 결과를 다음 루프에 공급"
  steps:
    - title: "1. 컨텍스트 로딩"
      from: "Task + Context"
      to: "Agent Model"
      route_label: "작업 요청에 필요한 규칙·파일·이전 결과를 선별해 모델에 제공한다."
      active_actors: [task, planner]
      description: "모든 정보를 무작정 넣기보다 현재 단계에 필요한 컨텍스트를 관리한다."
      payload: ["task", "AGENTS", "files"]
      outcomes:
        - status: info
          text: "컨텍스트 품질이 계획과 변경 범위에 영향을 준다."
    - title: "2. 안전한 도구 실행"
      from: "Agent Model"
      to: "Harness Runtime"
      route_label: "모델의 도구 계획을 권한·작업 디렉터리·승인 정책 안에서 실행한다."
      active_actors: [planner, runtime]
      description: "Harness가 모델과 운영 환경 사이의 안전 경계와 재현성 기준을 제공한다."
      payload: ["tool", "sandbox", "approval"]
      outcomes:
        - status: allow
          text: "모델이 직접 무제한 환경에 접근하지 않는다."
    - title: "3. 관찰·재계획"
      from: "Harness Runtime"
      to: "Observation / Tests"
      route_label: "도구 결과·테스트·오류를 관찰하고 필요하면 모델의 다음 계획을 갱신한다."
      active_actors: [runtime, verify, planner]
      description: "완료 기준과 중단 조건이 있어야 반복 실행이 통제된다."
      payload: ["result", "test", "next plan"]
      outcomes:
        - status: allow
          text: "계획·실행·검증 루프가 작업 결과로 수렴한다."

dependency_reproducibility:
  eyebrow: "Interactive comparison"
  title: "GitHub Pages 의존성 재현성"
  summary: "느슨한 버전 범위는 환경별 다른 의존성을 만들 수 있어 lock·Ruby·Jekyll 버전을 함께 고정한다."
  actors:
    - id: config
      kind: "요구 정의"
      name: "Gemfile / Config"
      description: "Jekyll·테마·플러그인 버전 요구"
    - id: resolver
      kind: "해결"
      name: "Bundler"
      description: "Gemfile.lock 기준으로 실제 설치 버전을 결정"
    - id: build
      kind: "빌드"
      name: "GitHub Actions"
      description: "CI에서 의존성을 설치하고 Pages 결과물을 생성"
    - id: pages
      kind: "배포 결과"
      name: "GitHub Pages"
      description: "빌드 결과를 호스팅하는 배포 환경"
  steps:
    - title: "1. 버전 요구 정의"
      from: "Gemfile / Config"
      to: "Bundler"
      route_label: "Jekyll·테마·플러그인과 Ruby 호환 범위를 프로젝트 설정으로 선언한다."
      active_actors: [config, resolver]
      description: "범위가 너무 넓으면 로컬과 CI가 서로 다른 버전을 선택할 수 있다."
      payload: ["Gemfile", "version range", "Ruby"]
      outcomes:
        - status: warning
          text: "의존성 요구와 실제 설치 버전을 분리해서 확인해야 한다."
    - title: "2. lock 기반 설치"
      from: "Bundler"
      to: "GitHub Actions"
      route_label: "lock 파일에 기록된 정확한 버전으로 CI 의존성을 설치하고 빌드한다."
      active_actors: [resolver, build]
      description: "빌드 환경이 달라도 같은 의존성 그래프를 재현하는 것이 목표다."
      payload: ["Gemfile.lock", "bundle install", "cache"]
      outcomes:
        - status: allow
          text: "로컬·CI 사이의 버전 드리프트를 줄인다."
    - title: "3. 배포 검증"
      from: "GitHub Actions"
      to: "GitHub Pages"
      route_label: "CI 빌드 결과와 링크·자산·페이지 렌더링을 검증한 뒤 Pages에 배포한다."
      active_actors: [build, pages, config]
      description: "의존성 재현성은 설치 성공뿐 아니라 실제 사이트 결과까지 확인해야 한다."
      payload: ["build", "artifact", "deploy"]
      outcomes:
        - status: allow
          text: "배포 환경에서 다시 만들 수 있는 사이트 결과를 얻는다."

embedding_representation:
  eyebrow: "Interactive flow"
  title: "텍스트 임베딩 표현"
  summary: "텍스트를 의미를 반영한 고차원 벡터로 변환하고 가까운 위치를 유사한 의미의 근거로 활용한다."
  actors:
    - id: text
      kind: "입력"
      name: "Text / Sentence"
      description: "문서나 질문의 자연어 문장"
    - id: model
      kind: "변환"
      name: "Embedding Model"
      description: "문장의 의미를 수치 벡터로 변환하는 모델"
    - id: space
      kind: "표현 공간"
      name: "Vector Space"
      description: "문장 벡터 사이의 거리·각도로 의미 근접성을 표현"
    - id: search
      kind: "활용"
      name: "Semantic Search"
      description: "질문과 가까운 문서 벡터를 찾는 검색"
  steps:
    - title: "1. 문장 입력"
      from: "Text / Sentence"
      to: "Embedding Model"
      route_label: "문서와 질문을 임베딩 모델의 입력으로 보낸다."
      active_actors: [text, model]
      description: "단어 자체가 아니라 문장 전체의 의미 맥락을 표현하려는 단계다."
      payload: ["sentence", "document", "query"]
      outcomes:
        - status: info
          text: "모델과 전처리 방식이 벡터 표현에 영향을 준다."
    - title: "2. 벡터 변환"
      from: "Embedding Model"
      to: "Vector Space"
      route_label: "텍스트를 고차원 수치 벡터의 한 점으로 매핑한다."
      active_actors: [model, space]
      description: "표현이 달라도 의미가 비슷하면 가까운 위치에 놓이도록 학습된 공간을 사용한다."
      payload: ["vector", "dimension", "semantic position"]
      outcomes:
        - status: allow
          text: "키워드가 완전히 같지 않아도 의미 유사도를 계산할 수 있다."
    - title: "3. 의미 검색"
      from: "Vector Space"
      to: "Semantic Search"
      route_label: "질문 벡터와 가까운 문서 벡터를 찾아 관련 근거 후보를 만든다."
      active_actors: [space, search, text]
      description: "검색 품질은 임베딩만이 아니라 청크·필터·재순위화와 함께 결정된다."
      payload: ["cosine similarity", "nearest neighbors", "top-k"]
      outcomes:
        - status: allow
          text: "의미 기반 후보 검색이 가능해진다."

graph_representation:
  eyebrow: "Interactive flow"
  title: "지식 그래프 표현"
  summary: "개체를 노드로, 개체 사이의 의미 관계를 엣지로 표현해 연결 구조를 따라 질문한다."
  actors:
    - id: entity
      kind: "대상"
      name: "Entity / Node"
      description: "사람·프로젝트·기술·문서 같은 지식 단위"
    - id: relation
      kind: "관계"
      name: "Relation / Edge"
      description: "사용·의존·소속·결정 같은 의미 연결"
    - id: graph
      kind: "구조"
      name: "Knowledge Graph"
      description: "노드와 엣지를 함께 저장한 연결 구조"
    - id: query
      kind: "질문"
      name: "Graph Query"
      description: "관계 경로를 따라 관련 개체와 근거를 찾는 질의"
  steps:
    - title: "1. 개체 추출"
      from: "Entity / Node"
      to: "Relation / Edge"
      route_label: "문서와 기록에서 의미 있는 개체와 개체 사이의 관계를 식별한다."
      active_actors: [entity, relation]
      description: "이름만 저장하지 않고 어떤 대상이 어떻게 연결되는지 표현한다."
      payload: ["project", "technology", "entity"]
      outcomes:
        - status: info
          text: "그래프 품질은 노드보다 관계 정의에 크게 좌우된다."
    - title: "2. 그래프 구성"
      from: "Relation / Edge"
      to: "Knowledge Graph"
      route_label: "개체와 관계를 노드·엣지 구조로 저장한다."
      active_actors: [relation, graph, entity]
      description: "계층·의존·원인·영향 같은 구조가 검색 가능한 데이터가 된다."
      payload: ["node", "edge", "property"]
      outcomes:
        - status: allow
          text: "관계 경로를 따라 연결된 지식을 조회할 수 있다."
    - title: "3. 관계 질의"
      from: "Knowledge Graph"
      to: "Graph Query"
      route_label: "출발 개체에서 관계를 따라 관련 프로젝트·결정·문서를 찾는다."
      active_actors: [graph, query, relation]
      description: "키워드 일치보다 관계 구조가 중요한 질문에 적합하다."
      payload: ["path", "neighbor", "subgraph"]
      outcomes:
        - status: allow
          text: "개체와 관계를 함께 설명하는 답변 근거를 만들 수 있다."

embedding_graph_combination:
  eyebrow: "Interactive flow"
  title: "임베딩과 지식 그래프 결합"
  summary: "임베딩은 의미가 가까운 후보를 찾고 그래프는 그 후보의 관계와 구조적 맥락을 보강한다."
  actors:
    - id: text
      kind: "원문"
      name: "Document / Query"
      description: "검색하려는 질문과 지식 문서"
    - id: vector
      kind: "후보 검색"
      name: "Embedding Retrieval"
      description: "의미 유사도로 관련 문서와 개체 후보를 찾음"
    - id: graph
      kind: "관계 보강"
      name: "Knowledge Graph"
      description: "후보 개체의 관계·계층·의존 경로를 확인"
    - id: answer
      kind: "결과"
      name: "Grounded Result"
      description: "의미 검색과 관계 맥락을 함께 반영한 결과"
  steps:
    - title: "1. 의미 후보 찾기"
      from: "Document / Query"
      to: "Embedding Retrieval"
      route_label: "질문과 의미가 가까운 문서·개체 후보를 벡터 검색으로 찾는다."
      active_actors: [text, vector]
      description: "표현이 달라도 관련 가능성이 있는 후보를 넓게 회수한다."
      payload: ["embedding", "similarity", "candidate"]
      outcomes:
        - status: allow
          text: "검색 후보를 의미 기반으로 확보한다."
    - title: "2. 관계 확인"
      from: "Embedding Retrieval"
      to: "Knowledge Graph"
      route_label: "후보 개체가 프로젝트·기술·결정과 어떻게 연결되는지 그래프에서 확인한다."
      active_actors: [vector, graph]
      description: "유사도만으로는 놓치는 상하위·의존·원인 관계를 보완한다."
      payload: ["entity", "edge", "neighbor"]
      outcomes:
        - status: info
          text: "후보의 의미와 구조적 맥락을 함께 평가한다."
    - title: "3. 근거 조합"
      from: "Knowledge Graph"
      to: "Grounded Result"
      route_label: "원문 근거와 그래프 경로를 결합해 설명 가능한 검색 결과를 만든다."
      active_actors: [graph, answer, vector]
      description: "검색 결과가 왜 관련 있는지 관계와 원문으로 확인할 수 있게 한다."
      payload: ["source", "path", "context"]
      outcomes:
        - status: allow
          text: "의미 검색의 유연성과 그래프의 설명력을 함께 얻는다."

sdd_llm_workflow:
  eyebrow: "Interactive flow"
  title: "SDD와 LLM 협업 워크플로우"
  summary: "요구사항을 명세로 고정하고 LLM이 설계·구현을 보조한 뒤 테스트와 사람 검토로 결과를 검증한다."
  actors:
    - id: request
      kind: "문제 정의"
      name: "Requirement"
      description: "사용자 문제와 성공 조건을 담은 요청"
    - id: spec
      kind: "명세"
      name: "Spec / Design"
      description: "범위·계약·예외·수용 기준을 문서화한 설계"
    - id: llm
      kind: "보조 구현"
      name: "LLM Assistant"
      description: "명세를 바탕으로 코드·테스트·문서 초안을 만드는 도구"
    - id: verify
      kind: "검증"
      name: "Tests + Human Review"
      description: "자동 검증과 개발자의 설계·보안·제품 판단"
  steps:
    - title: "1. 명세 고정"
      from: "Requirement"
      to: "Spec / Design"
      route_label: "문제를 범위·계약·예외·수용 기준이 있는 명세로 정리한다."
      active_actors: [request, spec]
      description: "LLM에게 구현을 맡기기 전에 무엇을 만들어야 하는지 판단 기준을 고정한다."
      payload: ["scope", "contract", "acceptance"]
      outcomes:
        - status: allow
          text: "코드보다 먼저 제품·기술 의도를 공유한다."
    - title: "2. 구현 보조"
      from: "Spec / Design"
      to: "LLM Assistant"
      route_label: "명세와 저장소 규칙을 컨텍스트로 주고 코드·테스트·문서 초안을 생성한다."
      active_actors: [spec, llm]
      description: "생성 결과의 품질은 입력 명세와 저장소 컨텍스트에 의존한다."
      payload: ["context", "code", "tests"]
      outcomes:
        - status: info
          text: "LLM 출력은 설계 결정을 대체하지 않고 작업을 가속한다."
    - title: "3. 검증·수정"
      from: "LLM Assistant"
      to: "Tests + Human Review"
      route_label: "테스트·린트·리뷰로 명세 충족과 부작용을 확인하고 필요한 부분을 수정한다."
      active_actors: [llm, verify, spec]
      description: "자동 생성이 성공해도 제품 의도와 운영 위험은 사람이 함께 확인한다."
      payload: ["test", "review", "feedback"]
      outcomes:
        - status: allow
          text: "명세·생성·검증의 반복으로 구현을 수렴시킨다."

github_collaboration:
  eyebrow: "Interactive flow"
  title: "GitHub 협업 워크플로우"
  summary: "이슈와 브랜치에서 작업하고 Pull Request 리뷰·CI를 거쳐 보호된 기본 브랜치에 병합한다."
  actors:
    - id: issue
      kind: "작업 정의"
      name: "Issue / Task"
      description: "문제·범위·완료 조건을 기록한 협업 단위"
    - id: branch
      kind: "개발"
      name: "Feature Branch"
      description: "작업을 격리하고 커밋을 쌓는 브랜치"
    - id: pr
      kind: "검토"
      name: "Pull Request"
      description: "변경 내용·리뷰·CI 상태를 모으는 병합 요청"
    - id: main
      kind: "통합"
      name: "Protected Main"
      description: "검증된 변경만 병합되는 기본 브랜치"
  steps:
    - title: "1. 작업 범위 정의"
      from: "Issue / Task"
      to: "Feature Branch"
      route_label: "이슈의 완료 조건과 범위를 기준으로 작업 브랜치를 만들고 커밋한다."
      active_actors: [issue, branch]
      description: "작업 단위를 작게 유지하면 리뷰와 롤백 범위도 줄어든다."
      payload: ["issue", "branch", "commit"]
      outcomes:
        - status: allow
          text: "변경의 목적과 코드 이력이 연결된다."
    - title: "2. PR 검증"
      from: "Feature Branch"
      to: "Pull Request"
      route_label: "Pull Request에서 diff·리뷰·자동 테스트·빌드 결과를 함께 확인한다."
      active_actors: [branch, pr]
      description: "사람의 설계 검토와 자동 검증을 같은 병합 기준으로 묶는다."
      payload: ["diff", "review", "CI"]
      outcomes:
        - status: info
          text: "검증 실패와 리뷰 의견을 반영한 뒤 병합한다."
    - title: "3. 보호 브랜치 병합"
      from: "Pull Request"
      to: "Protected Main"
      route_label: "필수 리뷰와 CI를 통과한 PR만 기본 브랜치에 병합한다."
      active_actors: [pr, main, issue]
      description: "병합 후 배포·릴리스와 이슈 상태를 연결해 작업을 닫는다."
      payload: ["approval", "merge", "release"]
      outcomes:
        - status: allow
          text: "협업의 기준과 배포 가능한 상태를 함께 관리한다."

concurrency_control_methods:
  eyebrow: "Interactive comparison"
  title: "동시성 제어 방법 선택"
  summary: "비관적 락·낙관적 락·원자적 쿼리·분산 락은 충돌 위치와 운영 경계가 서로 다르다."
  actors:
    - id: problem
      kind: "공유 상태"
      name: "Concurrent Update"
      description: "여러 요청이 같은 데이터를 읽고 변경하는 상황"
    - id: pessimistic
      kind: "DB 잠금"
      name: "Pessimistic Lock"
      description: "충돌 전에 행을 잠가 다른 변경을 기다리게 하는 방법"
    - id: optimistic
      kind: "버전 검증"
      name: "Optimistic Lock"
      description: "버전·조건을 확인해 충돌 시 실패시키는 방법"
    - id: atomic
      kind: "원자 연산"
      name: "Atomic Update / Distributed Lock"
      description: "DB 조건 연산 또는 여러 인스턴스 사이의 분산 잠금"
  steps:
    - title: "1. 충돌 지점 정의"
      from: "Concurrent Update"
      to: "Pessimistic Lock"
      route_label: "같은 행의 충돌을 사전에 막고 대기시키는 비관적 락을 검토한다."
      active_actors: [problem, pessimistic]
      description: "충돌 비용이 크고 짧은 트랜잭션으로 자원을 보호할 수 있을 때 적합하다."
      payload: ["row lock", "wait", "transaction"]
      outcomes:
        - status: info
          text: "잠금 대기와 데드락을 운영 지표로 관찰해야 한다."
    - title: "2. 충돌 감지"
      from: "Concurrent Update"
      to: "Optimistic Lock"
      route_label: "버전이나 조건이 바뀌었는지 확인하고 충돌한 요청을 재시도·실패 처리한다."
      active_actors: [problem, optimistic]
      description: "충돌이 드물고 대기보다 실패 후 재시도가 유리한 경우 선택한다."
      payload: ["version", "compare", "retry"]
      outcomes:
        - status: allow
          text: "잠금 없이도 변경 경쟁을 감지할 수 있다."
    - title: "3. 원자·분산 경계 선택"
      from: "Concurrent Update"
      to: "Atomic Update / Distributed Lock"
      route_label: "단일 DB 조건 연산으로 충분한지, 여러 인스턴스 자원을 분산 락으로 묶을지 판단한다."
      active_actors: [problem, atomic, pessimistic, optimistic]
      description: "기술 이름보다 데이터 경계와 실패 시나리오에 맞는 최소 제어를 선택한다."
      payload: ["conditional update", "distributed lock", "scope"]
      outcomes:
        - status: allow
          text: "공유 상태와 실행 환경에 맞춰 제어 범위를 줄인다."

pessimistic_lock_payment:
  eyebrow: "Interactive flow"
  title: "비관적 락 동작"
  summary: "트랜잭션이 행을 잠근 뒤 변경을 커밋할 때까지 같은 행을 수정하려는 다른 트랜잭션을 기다리게 한다."
  actors:
    - id: tx_a
      kind: "선점 요청"
      name: "Transaction A"
      description: "먼저 대상 행을 조회하고 잠금을 획득한 트랜잭션"
    - id: row
      kind: "DB 자원"
      name: "Locked Row"
      description: "동시 변경을 조정해야 하는 데이터 행"
    - id: tx_b
      kind: "대기 요청"
      name: "Transaction B"
      description: "잠긴 행에 접근해 대기하는 다른 트랜잭션"
    - id: commit
      kind: "해제"
      name: "Commit / Rollback"
      description: "변경을 확정하거나 되돌리며 락을 반환하는 경계"
  steps:
    - title: "1. 행 잠금 획득"
      from: "Transaction A"
      to: "Locked Row"
      route_label: "트랜잭션 A가 SELECT FOR UPDATE 같은 방식으로 대상 행을 잠근다."
      active_actors: [tx_a, row]
      description: "잠금 범위와 인덱스 조건에 따라 실제로 잠기는 행을 확인해야 한다."
      payload: ["SELECT FOR UPDATE", "row lock", "transaction"]
      outcomes:
        - status: allow
          text: "A가 변경하는 동안 다른 변경 요청을 조정할 수 있다."
    - title: "2. 다른 요청 대기"
      from: "Locked Row"
      to: "Transaction B"
      route_label: "트랜잭션 B가 같은 행을 잠그려 하면 A의 커밋·롤백까지 대기한다."
      active_actors: [row, tx_b, tx_a]
      description: "대기 시간이 길어지면 처리량과 타임아웃에 영향을 준다."
      payload: ["wait", "lock timeout", "contention"]
      outcomes:
        - status: warning
          text: "긴 트랜잭션과 잠금 순서 불일치는 데드락 위험을 키운다."
    - title: "3. 커밋 후 다음 처리"
      from: "Transaction A"
      to: "Commit / Rollback"
      route_label: "A가 변경을 확정하거나 되돌리면 락이 해제되고 B가 다음 상태를 읽는다."
      active_actors: [tx_a, commit, tx_b]
      description: "락 수명은 DB 트랜잭션 경계와 함께 설계한다."
      payload: ["commit", "rollback", "unlock"]
      outcomes:
        - status: allow
          text: "다음 요청이 확정된 상태를 기준으로 처리한다."

optimistic_lock_payment:
  eyebrow: "Interactive flow"
  title: "낙관적 락과 버전 검증"
  summary: "조회 시점의 버전을 기억하고 저장 시 같은 버전인지 확인해 먼저 변경된 요청을 감지한다."
  actors:
    - id: read
      kind: "조회"
      name: "Read Version"
      description: "엔티티와 현재 version을 함께 읽는 요청"
    - id: a
      kind: "변경 A"
      name: "Transaction A"
      description: "버전 N을 읽고 먼저 저장하려는 요청"
    - id: b
      kind: "변경 B"
      name: "Transaction B"
      description: "같은 버전 N을 읽고 나중에 저장하려는 요청"
    - id: result
      kind: "판정"
      name: "Version Check"
      description: "UPDATE 조건의 affected rows로 충돌을 판단"
  steps:
    - title: "1. 같은 버전 읽기"
      from: "Read Version"
      to: "Transaction A"
      route_label: "A와 B가 모두 version N인 데이터를 읽고 각자의 변경을 준비한다."
      active_actors: [read, a, b]
      description: "조회 시점에는 잠금을 잡지 않고 충돌을 저장 시점까지 늦춘다."
      payload: ["version N", "snapshot", "edit"]
      outcomes:
        - status: info
          text: "두 요청이 같은 상태를 기준으로 변경할 수 있다."
    - title: "2. 먼저 저장"
      from: "Transaction A"
      to: "Version Check"
      route_label: "A가 WHERE version = N 조건으로 저장하고 version을 N+1로 올린다."
      active_actors: [a, result]
      description: "조건이 맞는 한 건만 수정되어 A의 변경이 먼저 확정된다."
      payload: ["WHERE version=N", "UPDATE", "N+1"]
      outcomes:
        - status: allow
          text: "A의 변경이 새 기준 버전을 만든다."
    - title: "3. 충돌 감지"
      from: "Transaction B"
      to: "Version Check"
      route_label: "B가 같은 version N으로 저장하면 수정 행 0건이 되어 충돌로 판단한다."
      active_actors: [b, result, a]
      description: "B는 재조회·사용자 알림·재시도 같은 도메인 정책으로 후속 처리한다."
      payload: ["affected rows 0", "conflict", "retry"]
      outcomes:
        - status: reject
          text: "나중 저장이 먼저 저장한 변경을 조용히 덮어쓰지 않는다."

spring_ai_app_flow:
  eyebrow: "Interactive flow"
  title: "Spring AI 애플리케이션 흐름"
  summary: "애플리케이션이 사용자 입력을 ChatClient에 전달하고 모델 응답·구조화 결과를 도메인 처리에 연결한다."
  actors:
    - id: user
      kind: "입력"
      name: "User Request"
      description: "자연어 질문이나 업무 요청"
    - id: client
      kind: "오케스트레이션"
      name: "Spring AI ChatClient"
      description: "프롬프트·대화 기록·모델 호출을 조합하는 애플리케이션 API"
    - id: model
      kind: "생성"
      name: "Chat Model"
      description: "요청을 해석하고 텍스트 또는 구조화 결과를 생성하는 모델"
    - id: app
      kind: "업무 연결"
      name: "Application Service"
      description: "모델 결과를 검증하고 도메인 로직에 적용하는 서비스"
  steps:
    - title: "1. 요청 구성"
      from: "User Request"
      to: "Spring AI ChatClient"
      route_label: "사용자 입력과 시스템 지침·대화 문맥·필요한 옵션을 요청으로 구성한다."
      active_actors: [user, client]
      description: "프롬프트 조합과 모델 호출을 애플리케이션 코드의 한 경계에 둔다."
      payload: ["prompt", "context", "options"]
      outcomes:
        - status: info
          text: "모델에 전달하는 입력과 사용자 원문을 구분해 관리한다."
    - title: "2. 모델 호출"
      from: "Spring AI ChatClient"
      to: "Chat Model"
      route_label: "ChatClient가 선택한 모델에 요청을 보내 텍스트·JSON·도구 호출 결과를 받는다."
      active_actors: [client, model]
      description: "모델 호출은 외부 의존성이므로 타임아웃·실패·토큰 비용을 관찰한다."
      payload: ["model", "messages", "response"]
      outcomes:
        - status: allow
          text: "모델 추상화와 애플리케이션 흐름이 연결된다."
    - title: "3. 결과 검증·적용"
      from: "Chat Model"
      to: "Application Service"
      route_label: "응답 형식과 업무 규칙을 검증한 뒤 사용자 응답이나 도메인 처리로 연결한다."
      active_actors: [model, app, user]
      description: "모델 응답을 곧바로 신뢰하지 않고 애플리케이션 경계에서 검증한다."
      payload: ["structured output", "validation", "domain action"]
      outcomes:
        - status: allow
          text: "생성 결과가 통제된 업무 흐름 안에서 사용된다."

spring_ai_architecture:
  eyebrow: "Interactive flow"
  title: "Spring AI 구성 아키텍처"
  summary: "애플리케이션 계층이 Spring AI 추상화와 모델·메모리·벡터 저장소를 조합한다."
  actors:
    - id: app
      kind: "애플리케이션"
      name: "Application Layer"
      description: "업무 요구와 AI 기능을 연결하는 서비스 계층"
    - id: ai
      kind: "추상화"
      name: "Spring AI APIs"
      description: "ChatClient·프롬프트·출력 파서·Tool 인터페이스"
    - id: model
      kind: "모델"
      name: "Chat / Embedding Model"
      description: "텍스트 생성과 임베딩을 제공하는 모델 공급자"
    - id: memory
      kind: "상태·검색"
      name: "Memory / Vector Store"
      description: "대화 문맥과 검색용 벡터를 저장·조회하는 구성"
  steps:
    - title: "1. 업무 요구 연결"
      from: "Application Layer"
      to: "Spring AI APIs"
      route_label: "업무 서비스가 ChatClient·프롬프트·출력 처리 같은 Spring AI API를 사용한다."
      active_actors: [app, ai]
      description: "모델 공급자 세부 구현을 업무 코드에서 분리할 수 있다."
      payload: ["service", "prompt", "ChatClient"]
      outcomes:
        - status: allow
          text: "애플리케이션과 AI 인프라의 경계를 만든다."
    - title: "2. 모델 추상화 연결"
      from: "Spring AI APIs"
      to: "Chat / Embedding Model"
      route_label: "추상화 계층이 채팅 생성·임베딩 모델의 요청과 응답을 연결한다."
      active_actors: [ai, model]
      description: "모델 교체와 공급자별 설정을 한 경계에서 관리한다."
      payload: ["chat", "embedding", "provider"]
      outcomes:
        - status: info
          text: "추상화가 모델의 품질·비용·제한을 없애지는 않는다."
    - title: "3. 문맥과 검색 사용"
      from: "Spring AI APIs"
      to: "Memory / Vector Store"
      route_label: "대화 메모리와 문서 벡터를 저장·조회해 모델 입력 문맥을 보강한다."
      active_actors: [ai, memory, app]
      description: "생성 모델과 외부 상태 저장소의 책임을 분리한다."
      payload: ["conversation", "embedding", "retrieval"]
      outcomes:
        - status: allow
          text: "AI 기능을 모델 호출 하나가 아닌 조합 가능한 애플리케이션 구조로 본다."

spring_ai_components:
  eyebrow: "Interactive flow"
  title: "Spring AI 핵심 구성요소"
  summary: "프롬프트·ChatClient·모델·출력 파서·메모리가 요청부터 검증 가능한 결과까지 이어진다."
  actors:
    - id: prompt
      kind: "입력 설계"
      name: "Prompt Template"
      description: "시스템 지침과 사용자 입력을 조합하는 템플릿"
    - id: client
      kind: "호출 조정"
      name: "ChatClient"
      description: "모델 호출과 옵션·대화 흐름을 조정하는 API"
