<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">TCP 연결 수립과 정상 종료 메시지 흐름</title>
  <desc id="desc">두 호스트 사이의 SYN, SYN-ACK, ACK, FIN 메시지와 TIME-WAIT, FIN 재전송 흐름을 보여 주는 도식</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6ea5" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b66b28" />
    </marker>
    <style>
      .title { font: 700 28px Arial, 'Malgun Gothic', sans-serif; fill: #172b4d; }
      .panel { font: 700 20px Arial, 'Malgun Gothic', sans-serif; fill: #172b4d; }
      .host { font: 700 18px Arial, 'Malgun Gothic', sans-serif; fill: #172b4d; }
      .label { font: 700 17px Arial, 'Malgun Gothic', sans-serif; fill: #24425f; }
      .small { font: 400 15px Arial, 'Malgun Gothic', sans-serif; fill: #53657a; }
      .state { font: 700 16px Arial, 'Malgun Gothic', sans-serif; fill: #8b4d19; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#ffffff" />
  <text x="600" y="42" text-anchor="middle" class="title">TCP 연결 수립과 정상 종료</text>

  <rect x="60" y="65" width="1080" height="270" rx="14" fill="#f7fbff" stroke="#b8cde1" stroke-width="2" />
  <text x="90" y="101" class="panel">연결 수립 · 3-Way Handshake</text>
  <text x="285" y="132" text-anchor="middle" class="host">호스트 A</text>
  <text x="915" y="132" text-anchor="middle" class="host">호스트 B</text>
  <line x1="285" y1="148" x2="285" y2="300" stroke="#a8b4c2" stroke-width="2" />
  <line x1="915" y1="148" x2="915" y2="300" stroke="#a8b4c2" stroke-width="2" />

  <line x1="300" y1="170" x2="900" y2="170" stroke="#2f6ea5" stroke-width="3" marker-end="url(#arrow-blue)" />
  <text x="600" y="160" text-anchor="middle" class="label">SYN · 연결 요청과 초기 순서 번호</text>

  <line x1="900" y1="220" x2="300" y2="220" stroke="#2f6ea5" stroke-width="3" marker-end="url(#arrow-blue)" />
  <text x="600" y="210" text-anchor="middle" class="label">SYN-ACK · 요청 확인과 서버의 요청</text>

  <line x1="300" y1="270" x2="900" y2="270" stroke="#2f6ea5" stroke-width="3" marker-end="url(#arrow-blue)" />
  <text x="600" y="260" text-anchor="middle" class="label">ACK · 서버의 요청 확인</text>
  <text x="600" y="315" text-anchor="middle" class="small">양쪽의 요청과 응답을 확인한 뒤 통신을 시작한다</text>

  <rect x="60" y="365" width="1080" height="470" rx="14" fill="#fffaf5" stroke="#e2c4a4" stroke-width="2" />
  <text x="90" y="401" class="panel">정상 종료 · 4-Way Handshake</text>
  <text x="285" y="432" text-anchor="middle" class="host">호스트 A · 종료 시작</text>
  <text x="915" y="432" text-anchor="middle" class="host">호스트 B</text>
  <line x1="285" y1="448" x2="285" y2="795" stroke="#a8b4c2" stroke-width="2" />
  <line x1="915" y1="448" x2="915" y2="795" stroke="#a8b4c2" stroke-width="2" />

  <line x1="300" y1="480" x2="900" y2="480" stroke="#b66b28" stroke-width="3" marker-end="url(#arrow-orange)" />
  <text x="600" y="470" text-anchor="middle" class="label">FIN · A 방향 송신 종료</text>

  <line x1="900" y1="535" x2="300" y2="535" stroke="#b66b28" stroke-width="3" marker-end="url(#arrow-orange)" />
  <text x="600" y="525" text-anchor="middle" class="label">ACK · 첫 FIN 확인</text>

  <line x1="900" y1="590" x2="300" y2="590" stroke="#b66b28" stroke-width="3" marker-end="url(#arrow-orange)" />
  <text x="600" y="580" text-anchor="middle" class="label">FIN · B 방향 송신 종료</text>

  <line x1="300" y1="645" x2="900" y2="645" stroke="#b66b28" stroke-width="3" marker-end="url(#arrow-orange)" />
  <text x="600" y="635" text-anchor="middle" class="label">ACK · 두 번째 FIN 확인</text>

  <rect x="135" y="665" width="300" height="52" rx="9" fill="#fff0dc" stroke="#d79a5e" stroke-width="2" />
  <text x="285" y="697" text-anchor="middle" class="state">호스트 A · TIME-WAIT</text>
  <text x="600" y="693" text-anchor="middle" class="small">마지막 ACK를 받지 못하면 B가 FIN을 재전송할 수 있다</text>

  <line x1="900" y1="735" x2="300" y2="735" stroke="#b66b28" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-orange)" />
  <text x="600" y="725" text-anchor="middle" class="label">FIN 재전송</text>

  <line x1="300" y1="785" x2="900" y2="785" stroke="#b66b28" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-orange)" />
  <text x="600" y="775" text-anchor="middle" class="label">마지막 ACK 재전송</text>

  <line x1="90" y1="865" x2="145" y2="865" stroke="#b66b28" stroke-width="3" stroke-dasharray="9 7" />
  <text x="160" y="870" class="small">점선: 재전송 흐름</text>
</svg>
