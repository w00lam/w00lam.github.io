<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Cookie와 서버 Session으로 로그인 상태를 이어가는 흐름</title>
  <desc id="desc">브라우저가 로그인 요청을 보내면 서버가 Session에 상태를 저장하고 Set-Cookie로 세션 ID를 보낸다. 브라우저는 이후 요청에 Cookie로 세션 ID를 보내고 서버는 세션 저장소에서 사용자 상태를 찾는다.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, "Malgun Gothic", sans-serif; fill: #0f172a; text-anchor: middle; }
      .head { font: 700 25px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .label { font: 700 19px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .sub { font: 500 16px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .step { font: 700 17px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
      .box { stroke-width: 2; rx: 18; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" width="1400" height="700" rx="24" />
  <text class="title" x="700" y="54">Cookie는 세션 ID를 전달하고 Session은 사용자 상태를 보관한다</text>

  <rect class="box" x="70" y="115" width="350" height="440" fill="#dbeafe" stroke="#3b82f6" />
  <text class="head" x="245" y="165" fill="#1e3a8a">브라우저</text>
  <text class="sub" x="245" y="198" fill="#1e40af">Cookie 저장소</text>
  <rect class="box" x="125" y="270" width="240" height="125" fill="#ffffff" stroke="#60a5fa" />
  <text class="label" x="245" y="316" fill="#1e3a8a">Cookie</text>
  <text class="sub" x="245" y="350" fill="#1e40af">sessionId=abc...</text>
  <text class="sub" x="245" y="375" fill="#475569">세션 ID만 저장</text>
  <text class="sub" x="245" y="493" fill="#1e40af">로그인 정보 전체를</text>
  <text class="sub" x="245" y="518" fill="#1e40af">쿠키에 담는 구조가 아님</text>

  <rect class="box" x="980" y="115" width="350" height="440" fill="#dcfce7" stroke="#22c55e" />
  <text class="head" x="1155" y="165" fill="#14532d">서버</text>
  <text class="sub" x="1155" y="198" fill="#166534">Session 관리</text>
  <rect class="box" x="1035" y="270" width="240" height="125" fill="#ffffff" stroke="#4ade80" />
  <text class="label" x="1155" y="316" fill="#14532d">Session store</text>
  <text class="sub" x="1155" y="350" fill="#166534">abc... → 로그인 상태</text>
  <text class="sub" x="1155" y="375" fill="#475569">사용자별 상태 보관</text>
  <text class="sub" x="1155" y="493" fill="#166534">세션 ID로 상태를</text>
  <text class="sub" x="1155" y="518" fill="#166534">찾아 요청을 처리</text>

  <path class="arrow" d="M 420 230 C 600 170, 800 170, 980 230" />
  <rect x="577" y="150" width="245" height="38" rx="19" fill="#ffffff" stroke="#94a3b8" />
  <text class="step" x="700" y="175" fill="#334155">1. 로그인 요청</text>

  <path class="arrow" d="M 980 450 C 800 515, 600 515, 420 450" />
  <rect x="550" y="510" width="300" height="38" rx="19" fill="#ffffff" stroke="#94a3b8" />
  <text class="step" x="700" y="535" fill="#334155">2. 응답과 Set-Cookie</text>

  <path class="arrow" d="M 420 595 C 650 635, 750 635, 980 595" />
  <text class="step" x="700" y="630" fill="#475569">3. 이후 요청 + Cookie: sessionId=abc...</text>

  <path class="arrow" d="M 1155 395 V 430" />
  <text class="step" x="1155" y="420" fill="#166534">세션 ID 조회</text>

  <path class="dashed" d="M 245 395 V 430" />
  <text class="step" x="245" y="420" fill="#1e40af">브라우저에 저장</text>

  <rect x="510" y="85" width="380" height="38" rx="19" fill="#fff7ed" stroke="#fb923c" />
  <text class="step" x="700" y="110" fill="#9a3412">브라우저: ID 전달 · 서버: 상태 관리</text>
</svg>
