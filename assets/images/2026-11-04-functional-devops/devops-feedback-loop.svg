<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">DevOps와 Agile, 지속적 통합의 관계</title>
  <desc id="desc">DevOps 안에서 개발과 운영이 양방향으로 피드백을 주고받고 Agile과 지속적 통합이 관련된 실천으로 연결되는 관계</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 22; }
      .title { font: 700 30px Arial, "Malgun Gothic", sans-serif; fill: #0f172a; text-anchor: middle; }
      .heading { font: 700 25px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .label { font: 700 23px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .sub { font: 500 17px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .note { font: 600 17px Arial, "Malgun Gothic", sans-serif; fill: #475569; text-anchor: middle; }
      .solid-arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
      .related { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="700" rx="24" />
  <text class="title" x="700" y="52">개발과 운영은 피드백으로 연결되고, 관련 실천은 반복된다</text>

  <rect class="panel" x="55" y="110" width="1290" height="370" />
  <text class="heading" x="700" y="155" fill="#1e3a8a">DevOps: 개발과 운영의 소통·협업·통합</text>

  <rect x="185" y="225" width="300" height="125" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text class="label" x="335" y="272" fill="#1e3a8a">개발</text>
  <text class="sub" x="335" y="308" fill="#1e40af">기능과 변경을 만든다</text>

  <rect x="915" y="225" width="300" height="125" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
  <text class="label" x="1065" y="272" fill="#14532d">운영</text>
  <text class="sub" x="1065" y="308" fill="#166534">운영 관점과 문제를 공유한다</text>

  <path class="solid-arrow" d="M485 260 H905" />
  <path class="feedback" d="M915 315 H495" />
  <text class="note" x="700" y="246">변경과 배포</text>
  <text class="note" x="700" y="355">운영 피드백과 요구</text>
  <text class="note" x="700" y="425">한쪽이 끝난 뒤 넘겨받는 순서가 아니라 양방향 협업</text>

  <rect x="130" y="535" width="470" height="95" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
  <text class="label" x="365" y="575" fill="#78350f">Agile과 연관</text>
  <text class="sub" x="365" y="607" fill="#92400e">짧은 주기 · 피드백</text>

  <rect x="800" y="535" width="470" height="95" rx="18" fill="#fce7f3" stroke="#ec4899" stroke-width="2" />
  <text class="label" x="1035" y="575" fill="#831843">지속적 통합과 연관</text>
  <text class="sub" x="1035" y="607" fill="#9d174d">초기부터 반복 통합 · 품질 확인</text>

  <path class="related" d="M365 535 C365 495 470 480 560 465" />
  <path class="related" d="M1035 535 C1035 495 930 480 840 465" />
  <text class="note" x="700" y="675">서로 연결되지만 같은 개념도, 순차 단계도 아니다</text>
</svg>
