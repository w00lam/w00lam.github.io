<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">WAL과 데이터 페이지의 기록 시점 및 MVCC 가시성</title>
  <desc id="desc">SQL 실행 뒤 변경된 버퍼 페이지와 영속 WAL과 데이터 파일의 기록 시점을 보여 주고 장애가 발생하면 WAL로 데이터 파일을 다시 적용하는 흐름과 별도로 MVCC가 행 버전의 가시성을 관리하는 축을 구분한다.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3578c4"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b8a68"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c47a16"/></marker>
  </defs>
  <rect width="1500" height="980" fill="#f8fafc"/>
  <text x="48" y="54" fill="#1f2937" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="30" font-weight="700">커밋과 데이터 페이지 기록은 같은 사건이 아니다</text>
  <text x="48" y="88" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="16">WAL은 변경 기록의 영속화와 장애 복구를 담당하고 MVCC는 어떤 행 버전을 볼지 관리한다.</text>

  <rect x="48" y="128" width="1404" height="380" rx="16" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/>
  <rect x="48" y="128" width="1404" height="64" rx="16" fill="#eef5ff"/><rect x="48" y="176" width="1404" height="16" fill="#eef5ff"/>
  <text x="78" y="169" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="22" font-weight="700">장애 복구와 연결되는 기록 흐름</text>
  <text x="78" y="224" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">변경 페이지는 메모리에 남아 있다가 나중에 데이터 파일에 기록될 수 있다.</text>

  <rect x="78" y="270" width="260" height="138" rx="14" fill="#ffffff" stroke="#3578c4" stroke-width="2"/>
  <rect x="78" y="270" width="260" height="48" rx="14" fill="#dcecff"/><rect x="78" y="306" width="260" height="12" fill="#dcecff"/>
  <text x="208" y="301" text-anchor="middle" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" font-weight="700">SQL 실행</text>
  <text x="208" y="354" text-anchor="middle" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">Query Processor</text>
  <text x="208" y="382" text-anchor="middle" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">변경을 수행</text>

  <line x1="338" y1="339" x2="436" y2="339" stroke="#3578c4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="387" y="318" text-anchor="middle" fill="#3578c4" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13" font-weight="700">변경</text>

  <rect x="456" y="270" width="260" height="138" rx="14" fill="#ffffff" stroke="#3578c4" stroke-width="2"/>
  <rect x="456" y="270" width="260" height="48" rx="14" fill="#dcecff"/><rect x="456" y="306" width="260" height="12" fill="#dcecff"/>
  <text x="586" y="301" text-anchor="middle" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" font-weight="700">Buffer Manager</text>
  <text x="586" y="354" text-anchor="middle" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">변경된 데이터 페이지</text>
  <text x="586" y="382" text-anchor="middle" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">메모리에 유지</text>

  <line x1="716" y1="339" x2="814" y2="339" stroke="#2b8a68" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="765" y="318" text-anchor="middle" fill="#2b8a68" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13" font-weight="700">먼저 기록</text>

  <rect x="834" y="270" width="260" height="138" rx="14" fill="#ffffff" stroke="#2b8a68" stroke-width="2"/>
  <rect x="834" y="270" width="260" height="48" rx="14" fill="#e9f7f0"/><rect x="834" y="306" width="260" height="12" fill="#e9f7f0"/>
  <text x="964" y="301" text-anchor="middle" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" font-weight="700">영속 WAL</text>
  <text x="964" y="354" text-anchor="middle" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">변경 기록을 flush</text>
  <text x="964" y="382" text-anchor="middle" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">커밋 내구성과 연결</text>

  <line x1="716" y1="365" x2="1202" y2="455" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-blue)"/>
  <text x="1010" y="430" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13">데이터 페이지 쓰기는 늦을 수 있음</text>

  <rect x="1202" y="270" width="220" height="138" rx="14" fill="#ffffff" stroke="#c47a16" stroke-width="2"/>
  <rect x="1202" y="270" width="220" height="48" rx="14" fill="#fff7e8"/><rect x="1202" y="306" width="220" height="12" fill="#fff7e8"/>
  <text x="1312" y="301" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" font-weight="700">데이터 파일</text>
  <text x="1312" y="354" text-anchor="middle" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">최신 페이지</text>
  <text x="1312" y="382" text-anchor="middle" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">나중에 반영될 수 있음</text>

  <rect x="834" y="438" width="588" height="48" rx="12" fill="#fff1d6" stroke="#c47a16" stroke-width="2"/>
  <text x="1128" y="469" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15" font-weight="700">장애로 메모리를 잃으면 WAL을 읽어 데이터 파일에 REDO</text>

  <line x1="48" y1="560" x2="1452" y2="560" stroke="#dbe3ec" stroke-width="2"/>
  <text x="48" y="610" fill="#1f2937" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="22" font-weight="700">MVCC는 별도의 축에서 조회 가시성을 관리한다</text>
  <text x="48" y="642" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">MVCC를 WAL 기록 순서의 한 단계로 그리지 않는다.</text>

  <rect x="48" y="690" width="620" height="212" rx="16" fill="#ffffff" stroke="#3578c4" stroke-width="2"/>
  <rect x="48" y="690" width="620" height="56" rx="16" fill="#eef5ff"/><rect x="48" y="734" width="620" height="12" fill="#eef5ff"/>
  <text x="78" y="727" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="19" font-weight="700">행 버전</text>
  <rect x="78" y="774" width="236" height="76" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="196" y="805" text-anchor="middle" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="16" font-weight="700">v1 · 이전 값</text>
  <text x="196" y="830" text-anchor="middle" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13">다른 트랜잭션에 보일 수 있음</text>
  <line x1="314" y1="812" x2="402" y2="812" stroke="#3578c4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="422" y="774" width="216" height="76" rx="10" fill="#dcecff" stroke="#3578c4" stroke-width="2"/>
  <text x="530" y="805" text-anchor="middle" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="16" font-weight="700">v2 · 변경 값</text>
  <text x="530" y="830" text-anchor="middle" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13">스냅샷에 따라 가시성 결정</text>

  <rect x="728" y="690" width="724" height="212" rx="16" fill="#ffffff" stroke="#2b8a68" stroke-width="2"/>
  <rect x="728" y="690" width="724" height="56" rx="16" fill="#e9f7f0"/><rect x="728" y="734" width="724" height="12" fill="#e9f7f0"/>
  <text x="758" y="727" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="19" font-weight="700">스냅샷과 가시성</text>
  <text x="758" y="786" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">트랜잭션 A가 보는 버전</text>
  <rect x="1010" y="756" width="150" height="48" rx="10" fill="#dcecff" stroke="#3578c4" stroke-width="2"/>
  <text x="1085" y="787" text-anchor="middle" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15" font-weight="700">v1</text>
  <text x="758" y="846" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">트랜잭션 B가 보는 버전</text>
  <rect x="1010" y="816" width="150" height="48" rx="10" fill="#e9f7f0" stroke="#2b8a68" stroke-width="2"/>
  <text x="1085" y="847" text-anchor="middle" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15" font-weight="700">v2</text>
  <text x="1210" y="815" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">조회할 수 있는 버전은</text>
  <text x="1210" y="840" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">WAL 기록 순서와 다른 기준으로 결정된다.</text>

  <text x="750" y="948" text-anchor="middle" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">WAL은 장애 복구의 기록이고 MVCC는 동시 실행 중 데이터 가시성의 규칙이다.</text>
</svg>
