<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">HTTP 5xx 오류가 발생하는 요청 경로상의 위치</title>
  <desc id="desc">Client, Gateway 또는 Reverse Proxy, Application Server 사이의 요청 흐름에서 500, 502, 503, 504 오류가 어떤 상황을 나타내는지 비교한다. 503은 게이트웨이에서도 반환할 수 있다.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, "Malgun Gothic", sans-serif; fill: #0f172a; text-anchor: middle; }
      .node { font: 700 23px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .sub { font: 500 17px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .label { font: 700 18px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .note { font: 600 16px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .box { stroke-width: 2; rx: 18; }
      .flow { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .error { stroke-width: 3; fill: none; marker-end: url(#errorhead); stroke-dasharray: 10 8; }
    </style>
    <marker id="arrowhead" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#64748b" />
    </marker>
    <marker id="errorhead" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect class="bg" width="1400" height="820" rx="24" />
  <text class="title" x="700" y="54">5xx 오류는 요청 경로의 실패 지점을 함께 봐야 한다</text>

  <rect class="box" x="70" y="135" width="260" height="150" fill="#dbeafe" stroke="#3b82f6" />
  <text class="node" x="200" y="195" fill="#1e3a8a">Client</text>
  <text class="sub" x="200" y="232" fill="#1e40af">요청을 보내는 주체</text>

  <rect class="box" x="555" y="135" width="290" height="150" fill="#e0f2fe" stroke="#0284c7" />
  <text class="node" x="700" y="183" fill="#0c4a6e">Gateway</text>
  <text class="sub" x="700" y="216" fill="#075985">Reverse Proxy</text>
  <text class="sub" x="700" y="248" fill="#075985">상위 서버로 요청 전달</text>

  <rect class="box" x="1070" y="135" width="260" height="150" fill="#ede9fe" stroke="#8b5cf6" />
  <text class="node" x="1200" y="195" fill="#4c1d95">Application</text>
  <text class="sub" x="1200" y="232" fill="#5b21b6">요청 처리와 응답 생성</text>

  <path class="flow" d="M 330 210 H 545" />
  <path class="flow" d="M 855 210 H 1060" />
  <text class="note" x="438" y="188" fill="#475569">요청</text>
  <text class="note" x="960" y="188" fill="#475569">상위 요청</text>

  <rect class="box" x="1010" y="350" width="340" height="145" fill="#fee2e2" stroke="#dc2626" />
  <text class="label" x="1180" y="390" fill="#991b1b">500 Internal Server Error</text>
  <text class="sub" x="1180" y="428" fill="#991b1b">애플리케이션 서버 내부 처리 실패</text>
  <text class="sub" x="1180" y="458" fill="#b91c1c">예상하지 못한 예외 등</text>
  <path class="error" d="M 1200 285 V 340" />

  <rect class="box" x="425" y="350" width="400" height="145" fill="#ffedd5" stroke="#f97316" />
  <text class="label" x="625" y="390" fill="#9a3412">502 Bad Gateway</text>
  <text class="sub" x="625" y="428" fill="#9a3412">게이트웨이가 상위 서버에서</text>
  <text class="sub" x="625" y="458" fill="#c2410c">유효하지 않은 응답을 받음</text>
  <path class="error" d="M 1060 250 C 940 290 840 315 825 390" />

  <rect class="box" x="65" y="610" width="390" height="135" fill="#fef3c7" stroke="#f59e0b" />
  <text class="label" x="260" y="648" fill="#78350f">503 Service Unavailable</text>
  <text class="sub" x="260" y="685" fill="#92400e">서버가 일시적으로 요청을 처리할 수 없음</text>
  <text class="sub" x="260" y="715" fill="#a16207">게이트웨이에서도 반환 가능</text>
  <path d="M 560 285 C 430 350 350 470 290 600" stroke="#d97706" stroke-width="3" fill="none" stroke-dasharray="10 8" marker-end="url(#errorhead)" />

  <rect class="box" x="890" y="610" width="440" height="135" fill="#fce7f3" stroke="#ec4899" />
  <text class="label" x="1110" y="648" fill="#831843">504 Gateway Timeout</text>
  <text class="sub" x="1110" y="685" fill="#9d174d">게이트웨이가 상위 서버의 응답을</text>
  <text class="sub" x="1110" y="715" fill="#be185d">정해진 시간 안에 받지 못함</text>
  <path d="M 855 260 C 900 370 1030 430 1110 600" stroke="#db2777" stroke-width="3" fill="none" stroke-dasharray="10 8" marker-end="url(#errorhead)" />

  <rect x="430" y="535" width="450" height="48" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="7 6" />
  <text class="note" x="655" y="565" fill="#475569">502는 받은 응답이 잘못됨 · 504는 응답을 제때 받지 못함</text>
</svg>
