<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">HTTP 메서드의 역할과 안전성 및 멱등성 비교</title>
  <desc id="desc">GET, HEAD, POST, PUT, PATCH, DELETE를 카드형으로 비교한다. 각 카드에는 대표 역할과 안전성 및 멱등성을 표시하고 PATCH는 조건부 멱등성임을 설명한다.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px Arial, "Malgun Gothic", sans-serif; fill: #0f172a; text-anchor: middle; }
      .subtitle { font: 500 17px Arial, "Malgun Gothic", sans-serif; fill: #64748b; text-anchor: middle; }
      .method { font: 700 26px Arial, "Malgun Gothic", sans-serif; }
      .role { font: 600 19px Arial, "Malgun Gothic", sans-serif; fill: #1e293b; }
      .detail { font: 500 16px Arial, "Malgun Gothic", sans-serif; fill: #64748b; }
      .chip { font: 700 15px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .note { font: 600 17px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .small { font: 500 15px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .card { stroke-width: 2; rx: 24; }
      .pill { rx: 14; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900" rx="28" />
  <text class="title" x="700" y="58">HTTP 메서드는 요청의 의미에 따라 성질이 달라진다</text>
  <text class="subtitle" x="700" y="91">안전성은 서버 상태 변경을 요청하지 않는 성질이고 멱등성은 의도된 효과가 반복해도 같은 성질이다</text>

  <rect class="card" x="55" y="135" width="405" height="245" fill="#ffffff" stroke="#93c5fd" />
  <rect x="82" y="163" width="92" height="48" rx="14" fill="#dbeafe" />
  <text class="method" x="101" y="197" fill="#1d4ed8">GET</text>
  <text class="role" x="82" y="252">리소스 표현 조회</text>
  <text class="detail" x="82" y="282">서버 상태 변경을 요청하지 않음</text>
  <rect class="pill" x="82" y="314" width="118" height="36" fill="#dcfce7" />
  <text class="chip" x="141" y="337" fill="#166534">안전 · 예</text>
  <rect class="pill" x="214" y="314" width="142" height="36" fill="#dcfce7" />
  <text class="chip" x="285" y="337" fill="#166534">멱등 · 예</text>

  <rect class="card" x="497" y="135" width="405" height="245" fill="#ffffff" stroke="#7dd3fc" />
  <rect x="524" y="163" width="112" height="48" rx="14" fill="#e0f2fe" />
  <text class="method" x="543" y="197" fill="#0369a1">HEAD</text>
  <text class="role" x="524" y="252">메타데이터 확인</text>
  <text class="detail" x="524" y="282">GET과 같은 대상, 응답 본문 없음</text>
  <rect class="pill" x="524" y="314" width="118" height="36" fill="#dcfce7" />
  <text class="chip" x="583" y="337" fill="#166534">안전 · 예</text>
  <rect class="pill" x="656" y="314" width="142" height="36" fill="#dcfce7" />
  <text class="chip" x="727" y="337" fill="#166534">멱등 · 예</text>

  <rect class="card" x="939" y="135" width="405" height="245" fill="#ffffff" stroke="#f9a8d4" />
  <rect x="966" y="163" width="116" height="48" rx="14" fill="#fce7f3" />
  <text class="method" x="985" y="197" fill="#be185d">POST</text>
  <text class="role" x="966" y="252">데이터 제출과 처리 요청</text>
  <text class="detail" x="966" y="282">생성 외의 작업에도 사용</text>
  <rect class="pill" x="966" y="314" width="128" height="36" fill="#fee2e2" />
  <text class="chip" x="1030" y="337" fill="#b91c1c">안전 · 아니오</text>
  <rect class="pill" x="1108" y="314" width="155" height="36" fill="#fee2e2" />
  <text class="chip" x="1185" y="337" fill="#b91c1c">멱등 · 아니오</text>

  <rect class="card" x="55" y="415" width="405" height="245" fill="#ffffff" stroke="#86efac" />
  <rect x="82" y="443" width="101" height="48" rx="14" fill="#dcfce7" />
  <text class="method" x="101" y="477" fill="#15803d">PUT</text>
  <text class="role" x="82" y="532">표현을 생성하거나 교체</text>
  <text class="detail" x="82" y="562">지정한 상태로 맞추는 요청</text>
  <rect class="pill" x="82" y="594" width="128" height="36" fill="#fee2e2" />
  <text class="chip" x="146" y="617" fill="#b91c1c">안전 · 아니오</text>
  <rect class="pill" x="224" y="594" width="142" height="36" fill="#dcfce7" />
  <text class="chip" x="295" y="617" fill="#166534">멱등 · 예</text>

  <rect class="card" x="497" y="415" width="405" height="245" fill="#ffffff" stroke="#d8b4fe" />
  <rect x="524" y="443" width="145" height="48" rx="14" fill="#fae8ff" />
  <text class="method" x="543" y="477" fill="#a21caf">PATCH</text>
  <text class="role" x="524" y="532">부분 변경 적용</text>
  <text class="detail" x="524" y="562">변경 방식에 따라 멱등성이 달라짐</text>
  <rect class="pill" x="524" y="594" width="128" height="36" fill="#fee2e2" />
  <text class="chip" x="588" y="617" fill="#b91c1c">안전 · 아니오</text>
  <rect class="pill" x="666" y="594" width="184" height="36" fill="#fef3c7" />
  <text class="chip" x="758" y="617" fill="#92400e">멱등 · 조건부</text>

  <rect class="card" x="939" y="415" width="405" height="245" fill="#ffffff" stroke="#fcd34d" />
  <rect x="966" y="443" width="141" height="48" rx="14" fill="#fef3c7" />
  <text class="method" x="985" y="477" fill="#b45309">DELETE</text>
  <text class="role" x="966" y="532">리소스와 연결 제거 요청</text>
  <text class="detail" x="966" y="562">물리적 삭제 여부는 서버 구현에 따름</text>
  <rect class="pill" x="966" y="594" width="128" height="36" fill="#fee2e2" />
  <text class="chip" x="1030" y="617" fill="#b91c1c">안전 · 아니오</text>
  <rect class="pill" x="1108" y="594" width="142" height="36" fill="#dcfce7" />
  <text class="chip" x="1179" y="617" fill="#166534">멱등 · 예</text>

  <rect x="145" y="716" width="1110" height="112" rx="22" fill="#ffffff" stroke="#cbd5e1" />
  <circle cx="190" cy="772" r="17" fill="#f59e0b" />
  <text class="note" x="700" y="760" fill="#334155">PATCH는 메서드 자체로 멱등성을 보장하지 않는다</text>
  <text class="small" x="700" y="791" fill="#64748b">값을 특정 상태로 설정하는 변경은 반복해도 같은 결과가 될 수 있지만</text>
  <text class="small" x="700" y="814" fill="#64748b">값을 1씩 증가시키는 변경은 요청할 때마다 결과가 달라진다</text>
</svg>
