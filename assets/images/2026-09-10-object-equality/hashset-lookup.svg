<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">HashSet의 객체 탐색 흐름</title>
  <desc id="desc">HashSet은 User 객체의 hashCode로 해시 버킷을 찾고, 같은 버킷 안에서 equals로 논리적 동등성을 확인한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="30" font-weight="700" fill="#0f172a">HashSet은 두 단계로 객체를 찾는다</text>
  <text x="600" y="94" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#64748b">hashCode()로 범위를 좁히고 equals()로 최종 판단한다</text>

  <g filter="url(#shadow)">
    <rect x="430" y="125" width="340" height="96" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
    <text x="600" y="167" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">User 객체</text>
    <text x="600" y="198" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#475569">id = 1</text>
  </g>

  <line x1="600" y1="221" x2="600" y2="280" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="430" y="285" width="340" height="96" rx="18" fill="#0f172a"/>
    <text x="600" y="328" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="26" font-weight="700" fill="#ffffff">hashCode()</text>
    <text x="600" y="359" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#cbd5e1">탐색할 위치를 계산</text>
  </g>

  <line x1="600" y1="381" x2="600" y2="440" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="330" y="445" width="540" height="112" rx="18" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
    <text x="600" y="490" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="26" font-weight="700" fill="#5b21b6">Hash Bucket</text>
    <text x="600" y="524" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#6d28d9">비교할 후보를 좁힌다</text>
  </g>

  <line x1="600" y1="557" x2="600" y2="616" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="430" y="621" width="340" height="96" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <text x="600" y="664" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="26" font-weight="700" fill="#047857">equals()</text>
    <text x="600" y="695" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#065f46">논리적 동등성을 확인</text>
  </g>

  <text x="907" y="669" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857">동일 객체 판단</text>
  <line x1="775" y1="669" x2="890" y2="669" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
