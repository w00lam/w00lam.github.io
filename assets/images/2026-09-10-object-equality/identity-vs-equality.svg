<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">참조 동일성과 논리적 동등성 비교</title>
  <desc id="desc">user1과 user2는 같은 id를 가진 서로 다른 User 객체를 가리킨다. ==는 참조를 비교하고 equals는 논리적 동등성을 비교한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="30" font-weight="700" fill="#0f172a">같은 값과 같은 객체는 다르다</text>
  <text x="600" y="94" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#64748b">두 객체는 같은 id를 가지지만 서로 다른 인스턴스다</text>

  <g filter="url(#shadow)">
    <rect x="105" y="145" width="220" height="88" rx="16" fill="#0f172a"/>
    <text x="215" y="199" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#ffffff">user1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="875" y="145" width="220" height="88" rx="16" fill="#0f172a"/>
    <text x="985" y="199" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#ffffff">user2</text>
  </g>

  <line x1="325" y1="189" x2="475" y2="189" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="875" y1="189" x2="725" y2="189" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="445" y="135" width="310" height="108" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
    <text x="600" y="181" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">User(id=1)</text>
    <text x="600" y="214" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#475569">객체 A</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="445" y="300" width="310" height="108" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
    <text x="600" y="346" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">User(id=1)</text>
    <text x="600" y="379" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#475569">객체 B</text>
  </g>

  <line x1="600" y1="243" x2="600" y2="298" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="625" y="278" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#64748b">서로 다른 인스턴스</text>

  <g filter="url(#shadow)">
    <rect x="105" y="490" width="440" height="135" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <text x="325" y="535" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="27" font-weight="700" fill="#9a3412">==</text>
    <text x="325" y="575" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="600" fill="#7c2d12">reference comparison</text>
    <text x="325" y="605" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#9a3412">같은 인스턴스를 가리키는가?</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="655" y="490" width="440" height="135" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <text x="875" y="535" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="27" font-weight="700" fill="#047857">equals()</text>
    <text x="875" y="575" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="600" fill="#065f46">logical equality</text>
    <text x="875" y="605" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#047857">정의한 기준으로 같은가?</text>
  </g>

  <line x1="520" y1="408" x2="390" y2="488" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="680" y1="408" x2="810" y2="488" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
