<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">객체지향 설계와 의존성</title>
  <desc id="desc">관련 상태와 기능이 객체에 모이고 고수준 정책이 추상 타입에 의존하며 구체 구현체가 추상 타입을 구현하는 관계</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 20; }
      .title { font: 700 30px Arial, "Malgun Gothic", sans-serif; fill: #0f172a; text-anchor: middle; }
      .heading { font: 700 24px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .label { font: 700 21px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .sub { font: 500 17px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .note { font: 600 17px Arial, "Malgun Gothic", sans-serif; fill: #475569; }
      .solid-arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #2563eb; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1400" height="700" rx="24" />
  <text class="title" x="700" y="52">관련 책임은 객체에 모으고, 정책은 추상 타입을 바라본다</text>

  <rect class="panel" x="55" y="115" width="390" height="390" />
  <text class="heading" x="250" y="160" fill="#1e3a8a">객체 안에 모인 책임</text>
  <rect x="105" y="205" width="290" height="235" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text class="label" x="250" y="250" fill="#1e3a8a">Book 객체</text>
  <line x1="145" y1="275" x2="355" y2="275" stroke="#93c5fd" stroke-width="2" />
  <text class="sub" x="250" y="315" fill="#1e40af">상태: 제목·저자·페이지</text>
  <text class="sub" x="250" y="357" fill="#1e40af">기능: 읽기·예약</text>
  <text class="sub" x="250" y="408" fill="#1e40af">관련 데이터와 기능을 함께 관리</text>

  <rect class="panel" x="510" y="115" width="835" height="390" />
  <text class="heading" x="927" y="160" fill="#14532d">추상 타입을 사이에 둔 의존성</text>

  <rect x="555" y="235" width="230" height="120" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
  <text class="label" x="670" y="280" fill="#78350f">LibraryService</text>
  <text class="sub" x="670" y="315" fill="#92400e">고수준 정책</text>

  <rect x="855" y="235" width="230" height="120" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
  <text class="label" x="970" y="280" fill="#14532d">BookReader</text>
  <text class="sub" x="970" y="315" fill="#166534">추상 타입·read()</text>

  <rect x="1155" y="185" width="145" height="105" rx="16" fill="#fce7f3" stroke="#ec4899" stroke-width="2" />
  <text class="label" x="1227" y="225" fill="#831843">Memory</text>
  <text class="sub" x="1227" y="257" fill="#9d174d">구현체</text>

  <rect x="1155" y="335" width="145" height="105" rx="16" fill="#fce7f3" stroke="#ec4899" stroke-width="2" />
  <text class="label" x="1227" y="375" fill="#831843">File</text>
  <text class="sub" x="1227" y="407" fill="#9d174d">구현체</text>

  <path class="dashed" d="M785 295 H845" />
  <text class="note" x="815" y="270" text-anchor="middle">의존</text>
  <path class="solid-arrow" d="M1085 255 H1145" />
  <path class="solid-arrow" d="M1085 335 C1115 335 1115 387 1145 387" />
  <text class="note" x="1085" y="455" text-anchor="middle">같은 메시지에 구현체마다 다르게 반응</text>

  <rect x="315" y="570" width="770" height="70" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="7 6" />
  <text class="heading" x="700" y="614" fill="#334155">응집도는 높이고 · 구체 구현에 대한 결합도는 낮춘다</text>
</svg>
