<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">HashSet의 hashCode와 equals 비교 흐름</title>
  <desc id="desc">객체의 hashCode로 버킷을 찾고 equals로 논리적 동등성을 확인하는 과정</desc>
  <style>
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
    .accent { fill: #dbeafe; stroke: #2563eb; }
    .check { fill: #dcfce7; stroke: #16a34a; }
    .text { fill: #0f172a; font: 600 21px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .small { fill: #475569; font: 16px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#64748b"/></marker></defs>
  <rect width="960" height="360" fill="#ffffff"/>
  <rect x="30" y="120" width="150" height="70" class="box accent"/><text x="105" y="155" class="text">객체</text>
  <path d="M180 155 H250" class="arrow"/>
  <rect x="250" y="120" width="170" height="70" class="box"/><text x="335" y="155" class="text">hashCode()</text>
  <path d="M420 155 H490" class="arrow"/>
  <rect x="490" y="120" width="180" height="70" class="box"/><text x="580" y="146" class="text">해시 버킷</text><text x="580" y="172" class="small">탐색 범위 결정</text>
  <path d="M670 155 H740" class="arrow"/>
  <rect x="740" y="120" width="170" height="70" class="box check"/><text x="825" y="155" class="text">equals()</text>
  <path d="M825 190 V260" class="arrow"/>
  <text x="825" y="292" class="small">논리적 동등성 확인</text>
  <rect x="175" y="24" width="610" height="42" rx="21" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="480" y="45" class="small">같은 hashCode라도 equals()가 true라는 뜻은 아니다</text>
  <rect x="205" y="306" width="550" height="34" rx="17" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="480" y="323" class="small">equals()가 true라면 hashCode()도 같아야 한다</text>
</svg>
