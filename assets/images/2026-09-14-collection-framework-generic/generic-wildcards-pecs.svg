<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Generic Wildcard와 PECS</title>
  <desc id="desc">extends는 상위 타입으로 읽고 super는 하위 타입을 넣는 방향을 보여주는 비교</desc>
  <style>
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
    .blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
    .green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
    .text { fill: #0f172a; font: 600 21px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .small { fill: #475569; font: 17px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#64748b"/></marker></defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <rect x="30" y="30" width="440" height="390" class="panel"/>
  <rect x="530" y="30" width="440" height="390" class="panel"/>
  <text x="250" y="72" class="text">? extends Animal</text>
  <text x="750" y="72" class="text">? super Dog</text>
  <rect x="90" y="120" width="320" height="58" class="blue"/>
  <text x="250" y="149" class="text">List&lt;Dog&gt; / List&lt;Cat&gt;</text>
  <path d="M250 178 V235" class="arrow"/>
  <rect x="110" y="235" width="280" height="58" class="green"/>
  <text x="250" y="264" class="text">Animal로 읽기</text>
  <text x="250" y="335" class="small">Producer</text>
  <text x="250" y="368" class="small">읽기에 유리</text>
  <rect x="590" y="120" width="320" height="58" class="blue"/>
  <text x="750" y="149" class="text">List&lt;Dog&gt; / Animal / Object</text>
  <path d="M750 178 V235" class="arrow"/>
  <rect x="610" y="235" width="280" height="58" class="green"/>
  <text x="750" y="264" class="text">Dog 넣기</text>
  <text x="750" y="335" class="small">Consumer</text>
  <text x="750" y="368" class="small">쓰기에 유리</text>
  <text x="500" y="448" class="small">Producer Extends · Consumer Super</text>
</svg>
