<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">ArrayList와 LinkedList 구조 비교</title>
  <desc id="desc">ArrayList는 연속된 배열에 저장하고 LinkedList는 노드가 서로 연결되는 구조</desc>
  <style>
    .heading { fill: #0f172a; font: 700 24px Arial, sans-serif; text-anchor: middle; }
    .label { fill: #334155; font: 18px Arial, sans-serif; text-anchor: middle; }
    .cell { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .node { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
    .line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); marker-start: url(#arrowStart); }
    .arrow-line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#64748b"/></marker>
    <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="250" y="52" class="heading">ArrayList</text>
  <text x="750" y="52" class="heading">LinkedList</text>
  <text x="250" y="88" class="label">연속된 배열 공간</text>
  <text x="750" y="88" class="label">노드와 연결 관계</text>
  <g transform="translate(65,135)">
    <rect x="0" y="0" width="90" height="70" class="cell"/><rect x="90" y="0" width="90" height="70" class="cell"/><rect x="180" y="0" width="90" height="70" class="cell"/><rect x="270" y="0" width="90" height="70" class="cell"/><rect x="360" y="0" width="90" height="70" class="cell"/>
    <text x="45" y="42" class="heading">A</text><text x="135" y="42" class="heading">B</text><text x="225" y="42" class="heading">C</text><text x="315" y="42" class="heading">D</text><text x="405" y="42" class="heading">E</text>
    <text x="45" y="100" class="label">0</text><text x="135" y="100" class="label">1</text><text x="225" y="100" class="label">2</text><text x="315" y="100" class="label">3</text><text x="405" y="100" class="label">4</text>
    <path d="M225 125 V172" class="arrow-line"/>
    <text x="225" y="205" class="label">index로 바로 접근</text>
  </g>
  <g transform="translate(560,135)">
    <rect x="0" y="0" width="100" height="70" rx="12" class="node"/><rect x="170" y="0" width="100" height="70" rx="12" class="node"/><rect x="340" y="0" width="100" height="70" rx="12" class="node"/>
    <text x="50" y="42" class="heading">A</text><text x="220" y="42" class="heading">B</text><text x="390" y="42" class="heading">C</text>
    <path d="M102 35 H165" class="line"/><path d="M268 35 H335" class="line"/>
    <path d="M165 55 H102" class="line"/><path d="M335 55 H268" class="line"/>
    <path d="M390 95 V145" class="arrow-line"/>
    <text x="390" y="180" class="label">노드를 따라 탐색</text>
  </g>
  <line x1="500" y1="110" x2="500" y2="390" stroke="#cbd5e1" stroke-width="2"/>
  <text x="250" y="410" class="label">조회·순회 중심이면 유리</text>
  <text x="750" y="410" class="label">위치를 이미 알 때 연결 변경</text>
</svg>
