<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL Primary와 Read Replica의 쓰기·읽기 경로</title>
  <desc id="desc">관리자 쓰기는 Primary로 전달되고 일반 음식점 검색은 Read Replica로 분산된다. Primary의 WAL 변경은 Replica에 비동기로 적용될 수 있어 쓰기 직후 최신 값이 필요한 읽기는 Primary로 향한다. 동기 복제는 커밋 응답이 복제 확인을 기다릴 수 있다.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#3578c4"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2b8a68"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#c47a16"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="56" y="58" fill="#1f2937" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="30" font-weight="700">쓰기와 읽기를 나누어도 최신성은 따로 판단해야 한다</text>
  <text x="56" y="91" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="16">맛잇온 음식점 서비스의 관리자 수정, 일반 검색, 쓰기 직후 최신 값 확인 경로</text>

  <rect x="56" y="142" width="330" height="528" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/>
  <rect x="56" y="142" width="330" height="72" rx="18" fill="#eef5ff"/>
  <rect x="56" y="198" width="330" height="16" fill="#eef5ff"/>
  <text x="86" y="187" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700">요청 유형</text>

  <rect x="86" y="252" width="270" height="88" rx="12" fill="#fff7e8" stroke="#c47a16" stroke-width="2"/>
  <text x="221" y="287" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" font-weight="700">관리자 음식점 수정</text>
  <text x="221" y="316" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">쓰기 · 최신 상태 확인</text>

  <rect x="86" y="368" width="270" height="88" rx="12" fill="#eef5ff" stroke="#3578c4" stroke-width="2"/>
  <text x="221" y="403" text-anchor="middle" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" font-weight="700">일반 음식점 검색</text>
  <text x="221" y="432" text-anchor="middle" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">읽기 · 짧은 지연 허용</text>

  <rect x="86" y="484" width="270" height="122" rx="12" fill="#fef2f2" stroke="#b45309" stroke-width="2"/>
  <text x="221" y="519" text-anchor="middle" fill="#9a3412" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" font-weight="700">수정 직후 화면</text>
  <text x="221" y="548" text-anchor="middle" fill="#9a3412" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">읽기 · 최신 값 필요</text>
  <text x="221" y="577" text-anchor="middle" fill="#9a3412" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">Replica 지연을 허용하지 않음</text>

  <rect x="500" y="142" width="360" height="528" rx="18" fill="#ffffff" stroke="#3578c4" stroke-width="2"/>
  <rect x="500" y="142" width="360" height="72" rx="18" fill="#e9f2ff"/>
  <rect x="500" y="198" width="360" height="16" fill="#e9f2ff"/>
  <text x="530" y="187" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700">PostgreSQL Primary</text>
  <text x="680" y="257" text-anchor="middle" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">쓰기와 최신 상태 확인</text>
  <rect x="548" y="292" width="264" height="86" rx="12" fill="#eef5ff" stroke="#3578c4" stroke-width="2"/>
  <text x="680" y="328" text-anchor="middle" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" font-weight="700">INSERT · UPDATE</text>
  <text x="680" y="355" text-anchor="middle" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">최신 데이터가 먼저 반영됨</text>
  <rect x="548" y="430" width="264" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="680" y="466" text-anchor="middle" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" font-weight="700">WAL 생성</text>
  <text x="680" y="496" text-anchor="middle" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">변경 기록을 Standby로 전달</text>
  <text x="680" y="523" text-anchor="middle" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">비동기 복제에서는 적용 시점이 다름</text>

  <rect x="1030" y="142" width="314" height="528" rx="18" fill="#ffffff" stroke="#2b8a68" stroke-width="2"/>
  <rect x="1030" y="142" width="314" height="72" rx="18" fill="#e9f7f0"/>
  <rect x="1030" y="198" width="314" height="16" fill="#e9f7f0"/>
  <text x="1060" y="187" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700">Read Replica</text>
  <text x="1187" y="257" text-anchor="middle" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">Hot Standby · 읽기 전용 쿼리</text>
  <rect x="1070" y="302" width="234" height="106" rx="12" fill="#e9f7f0" stroke="#2b8a68" stroke-width="2"/>
  <text x="1187" y="341" text-anchor="middle" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="19" font-weight="700">일반 검색</text>
  <text x="1187" y="372" text-anchor="middle" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">복제 지연을 허용할 때</text>
  <text x="1187" y="398" text-anchor="middle" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">읽기 요청을 분산</text>
  <rect x="1070" y="456" width="234" height="104" rx="12" fill="#fff7e8" stroke="#c47a16" stroke-width="2"/>
  <text x="1187" y="494" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" font-weight="700">비동기 적용 지연</text>
  <text x="1187" y="524" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">이전 값이 보일 수 있음</text>

  <line x1="386" y1="296" x2="490" y2="296" stroke="#c47a16" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="438" y="275" text-anchor="middle" fill="#9a3412" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700">쓰기</text>
  <line x1="386" y1="410" x2="1020" y2="410" stroke="#3578c4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="704" y="389" text-anchor="middle" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700">일반 검색 읽기 분산</text>
  <line x1="386" y1="548" x2="490" y2="548" stroke="#b45309" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="438" y="527" text-anchor="middle" fill="#9a3412" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700">최신 값</text>
  <line x1="860" y1="498" x2="1020" y2="498" stroke="#64748b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-gray)"/>
  <text x="940" y="477" text-anchor="middle" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700">비동기 WAL 적용</text>

  <rect x="158" y="718" width="1084" height="64" rx="14" fill="#fff7e8" stroke="#c47a16" stroke-width="2"/>
  <text x="700" y="756" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="16" font-weight="700">동기 복제는 커밋 응답이 복제 확인을 기다릴 수 있어 응답 시간이 늘 수 있다.</text>
</svg>
