<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">연결 리스트의 인덱스 7 탐색</title>
  <desc id="desc">인덱스 0부터 9까지 연결된 이중 연결 리스트에서 tail인 9부터 8, 7로 이동하는 경로</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px sans-serif; fill: #111827; }
      .label { font: 700 19px sans-serif; fill: #1f2937; }
      .text { font: 500 17px sans-serif; fill: #374151; }
      .node { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .target { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .link { fill: none; stroke: #9ca3af; stroke-width: 3; }
      .route { fill: none; stroke: #dc2626; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="430" rx="24"/>
  <text class="title" x="55" y="58">인덱스 7은 tail에서 두 번 이동한다</text>
  <text class="text" x="55" y="93">요소 수 n = 10 · 인덱스 0~9 · 뒤에서의 이동 횟수 = n - 1 - index = 2</text>
  <text class="label" x="70" y="150">head</text>
  <text class="label" x="1040" y="150">tail</text>
  <g transform="translate(70 185)">
    <rect class="node" x="0" y="0" width="95" height="70" rx="12"/>
    <rect class="node" x="115" y="0" width="95" height="70" rx="12"/>
    <rect class="node" x="230" y="0" width="95" height="70" rx="12"/>
    <rect class="node" x="345" y="0" width="95" height="70" rx="12"/>
    <rect class="node" x="460" y="0" width="95" height="70" rx="12"/>
    <rect class="node" x="575" y="0" width="95" height="70" rx="12"/>
    <rect class="node" x="690" y="0" width="95" height="70" rx="12"/>
    <rect class="target" x="805" y="0" width="95" height="70" rx="12"/>
    <rect class="node" x="920" y="0" width="95" height="70" rx="12"/>
    <rect class="node" x="1035" y="0" width="95" height="70" rx="12"/>
    <text class="label" x="42" y="43">0</text><text class="label" x="157" y="43">1</text>
    <text class="label" x="272" y="43">2</text><text class="label" x="387" y="43">3</text>
    <text class="label" x="502" y="43">4</text><text class="label" x="617" y="43">5</text>
    <text class="label" x="732" y="43">6</text><text class="label" x="847" y="43">7</text>
    <text class="label" x="962" y="43">8</text><text class="label" x="1077" y="43">9</text>
    <path class="link" d="M98 35 L112 35 M213 35 L227 35 M328 35 L342 35 M443 35 L457 35 M558 35 L572 35 M673 35 L687 35 M788 35 L802 35 M903 35 L917 35 M1018 35 L1032 35"/>
    <path class="route" d="M1080 95 C1080 135 950 135 950 82"/>
    <path class="route" d="M930 95 C930 165 835 165 850 82"/>
  </g>
  <text class="text" x="885" y="365">9 → 8 → 7</text>
  <text class="text" x="55" y="365">배열처럼 인덱스로 위치를 계산하는 것이 아니라 노드의 참조를 따라간다</text>
</svg>
