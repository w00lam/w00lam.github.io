<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">멀티 플랫폼 이미지의 변형 선택</title>
  <desc id="desc">하나의 이미지 이름이 매니페스트 목록을 통해 linux/amd64와 linux/arm64 플랫폼별 이미지를 연결하고, 각 변형 안에 대상 플랫폼용 JVM과 라이브러리와 애플리케이션이 포함된 구조</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff" />
      <stop offset="1" stop-color="#edf4fb" />
    </linearGradient>
    <linearGradient id="index" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5df" />
      <stop offset="1" stop-color="#fffaf0" />
    </linearGradient>
    <linearGradient id="amd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2ff" />
      <stop offset="1" stop-color="#f5f9ff" />
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eafbf7" />
      <stop offset="1" stop-color="#f4fffc" />
    </linearGradient>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0f9f95" />
    </marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .title { font-size: 34px; font-weight: 750; fill: #10243e; }
      .sub { font-size: 18px; fill: #52657e; }
      .section { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #58708e; }
      .label { font-size: 24px; font-weight: 700; fill: #172b46; }
      .detail { font-size: 17px; fill: #51647d; }
      .small { font-size: 15px; fill: #60738d; }
      .note { font-size: 16px; fill: #6a4d12; }
      .node { fill: #fff; stroke: #c9d7e8; stroke-width: 2; }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .arrow-teal { fill: none; stroke: #0f9f95; stroke-width: 4; marker-end: url(#arrow-teal); }
      .divider { stroke: #d5e0ed; stroke-width: 2; stroke-dasharray: 7 8; }
    </style>
  </defs>

  <rect width="1400" height="900" rx="28" fill="url(#background)" />
  <text x="700" y="55" text-anchor="middle" class="title">멀티 플랫폼 이미지와 실행 환경</text>
  <text x="700" y="88" text-anchor="middle" class="sub">하나의 이미지 이름 아래에 플랫폼별 JVM·라이브러리·애플리케이션 변형이 연결된다</text>

  <rect x="425" y="125" width="550" height="115" rx="22" fill="url(#index)" stroke="#e5c77d" stroke-width="2" />
  <text x="700" y="160" text-anchor="middle" class="section">ONE IMAGE NAME</text>
  <text x="700" y="207" text-anchor="middle" class="label">registry.example/app:latest</text>

  <path d="M700 240 V310" class="arrow-blue" />
  <rect x="370" y="310" width="660" height="130" rx="22" fill="#fff" stroke="#c9d7e8" stroke-width="2" />
  <text x="700" y="350" text-anchor="middle" class="section">IMAGE INDEX / MANIFEST LIST</text>
  <text x="700" y="393" text-anchor="middle" class="label">플랫폼별 매니페스트를 연결</text>
  <text x="700" y="420" text-anchor="middle" class="small">실행 환경에 맞는 변형을 선택할 수 있도록 가리킨다</text>

  <path d="M525 440 V500 H325 V535" class="arrow-blue" />
  <path d="M875 440 V500 H1075 V535" class="arrow-teal" />
  <text x="365" y="492" text-anchor="middle" class="small">x86-64 호스트</text>
  <text x="1035" y="492" text-anchor="middle" class="small">ARM64 호스트</text>

  <rect x="75" y="535" width="500" height="245" rx="24" fill="url(#amd)" stroke="#bfd1ea" stroke-width="2" />
  <text x="325" y="578" text-anchor="middle" class="section">PLATFORM VARIANT</text>
  <text x="325" y="622" text-anchor="middle" class="label">linux/amd64</text>
  <rect x="125" y="650" width="400" height="88" rx="16" class="node" />
  <text x="325" y="684" text-anchor="middle" class="detail">JVM · 라이브러리 · 애플리케이션</text>
  <text x="325" y="714" text-anchor="middle" class="small">Linux x86-64 실행 환경에 맞춘 구성</text>

  <rect x="825" y="535" width="500" height="245" rx="24" fill="url(#arm)" stroke="#b9e1d6" stroke-width="2" />
  <text x="1075" y="578" text-anchor="middle" class="section">PLATFORM VARIANT</text>
  <text x="1075" y="622" text-anchor="middle" class="label">linux/arm64</text>
  <rect x="875" y="650" width="400" height="88" rx="16" class="node" />
  <text x="1075" y="684" text-anchor="middle" class="detail">JVM · 라이브러리 · 애플리케이션</text>
  <text x="1075" y="714" text-anchor="middle" class="small">Linux ARM64 실행 환경에 맞춘 구성</text>

  <line x1="105" y1="820" x2="1295" y2="820" class="divider" />
  <text x="700" y="858" text-anchor="middle" class="note">하나의 범용 바이너리가 아니라 플랫폼별 이미지를 하나의 이름으로 묶는 구조</text>
</svg>
