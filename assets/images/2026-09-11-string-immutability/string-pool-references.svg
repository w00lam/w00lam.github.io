<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">String Pool과 new String의 참조 관계</title>
  <desc id="desc">변수 a와 b는 String Pool의 같은 hello 객체를 가리키고, 변수 c는 Heap의 별도 String 객체를 가리킨다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="30" font-weight="700" fill="#0f172a">String Pool과 new String()의 참조 관계</text>
  <text x="600" y="86" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#64748b">같은 리터럴은 공유되지만 new String()은 별도 객체를 만든다</text>

  <rect x="70" y="135" width="200" height="300" rx="20" fill="#0f172a" filter="url(#shadow)"/>
  <text x="170" y="174" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#ffffff">참조 변수</text>
  <rect x="105" y="205" width="130" height="58" rx="12" fill="#1e3a8a"/>
  <text x="170" y="242" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="700" fill="#ffffff">a</text>
  <rect x="105" y="285" width="130" height="58" rx="12" fill="#1e3a8a"/>
  <text x="170" y="322" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="700" fill="#ffffff">b</text>
  <rect x="105" y="365" width="130" height="58" rx="12" fill="#1e3a8a"/>
  <text x="170" y="402" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="700" fill="#ffffff">c</text>

  <line x1="270" y1="234" x2="455" y2="234" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="270" y1="314" x2="455" y2="314" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="270" y1="394" x2="845" y2="394" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="435" y="125" width="330" height="270" rx="22" fill="#dbeafe" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="170" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">String Pool</text>
  <rect x="500" y="205" width="200" height="105" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  <text x="600" y="250" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="26" font-weight="700" fill="#0f172a">"hello"</text>
  <text x="600" y="284" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#475569">공유되는 String 객체</text>
  <text x="600" y="360" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="600" fill="#1d4ed8">a == b → true</text>

  <rect x="825" y="235" width="305" height="180" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <text x="977" y="280" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#9a3412">Heap의 별도 객체</text>
  <text x="977" y="326" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="26" font-weight="700" fill="#0f172a">"hello"</text>
  <text x="977" y="360" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#7c2d12">new String("hello")</text>
  <text x="977" y="394" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="600" fill="#c2410c">a == c → false</text>
</svg>
