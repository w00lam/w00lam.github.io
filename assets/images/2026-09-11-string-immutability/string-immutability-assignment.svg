<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">String 불변성과 변수 참조 재대입</title>
  <desc id="desc">value에 문자열을 이어 붙이면 기존 hello 객체를 수정하는 것이 아니라 새로운 hello world 객체를 만들고 value의 참조를 옮긴다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="30" font-weight="700" fill="#0f172a">String 불변성과 변수 참조 재대입</text>
  <text x="600" y="86" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#64748b">value의 참조는 이동하지만 기존 String 객체의 내용은 바뀌지 않는다</text>

  <rect x="65" y="135" width="455" height="300" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="3" filter="url(#shadow)"/>
  <rect x="65" y="135" width="455" height="62" rx="22" fill="#e2e8f0"/>
  <rect x="65" y="175" width="455" height="22" fill="#e2e8f0"/>
  <text x="292" y="175" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="23" font-weight="700" fill="#334155">변경 전</text>
  <rect x="110" y="245" width="125" height="62" rx="12" fill="#0f172a"/>
  <text x="172" y="285" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="700" fill="#ffffff">value</text>
  <line x1="235" y1="276" x2="325" y2="276" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="325" y="225" width="145" height="105" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <text x="397" y="272" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">"hello"</text>
  <text x="397" y="304" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">기존 객체</text>
  <text x="292" y="385" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#475569">value = "hello"</text>

  <line x1="520" y1="285" x2="680" y2="285" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="600" y="258" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">+ " world"</text>

  <rect x="680" y="135" width="455" height="300" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="3" filter="url(#shadow)"/>
  <rect x="680" y="135" width="455" height="62" rx="22" fill="#dbeafe"/>
  <rect x="680" y="175" width="455" height="22" fill="#dbeafe"/>
  <text x="907" y="175" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">변경 후</text>
  <rect x="720" y="245" width="125" height="62" rx="12" fill="#0f172a"/>
  <text x="782" y="285" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="700" fill="#ffffff">value</text>
  <line x1="845" y1="276" x2="895" y2="276" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="895" y="225" width="190" height="105" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <text x="990" y="272" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">"hello world"</text>
  <text x="990" y="304" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">새로운 결과 객체</text>
  <text x="907" y="385" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#475569">기존 "hello" 객체는 그대로 남음</text>
</svg>
