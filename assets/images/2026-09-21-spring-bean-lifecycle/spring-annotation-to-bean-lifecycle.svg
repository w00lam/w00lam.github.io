<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc">
  <title id="title">Annotation과 Reflection에서 Spring Bean 생명주기까지</title>
  <desc id="desc">개발자 코드의 Annotation 메타데이터를 Spring Component Scan이 확인해 BeanDefinition을 만들고 객체 생성과 의존성 주입, 초기화, Scope에 따른 사용과 소멸 Callback으로 이어진다. Java Reflection은 런타임 정보를 확인하는 방법 중 하나다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff" />
      <stop offset="1" stop-color="#edf4fb" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb" />
      <stop offset="1" stop-color="#0f9f95" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7186a3" />
    </marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .title { font-size: 36px; font-weight: 750; fill: #10243e; }
      .sub { font-size: 18px; fill: #52657e; }
      .section { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #58708e; }
      .label { font-size: 23px; font-weight: 700; fill: #172b46; }
      .detail { font-size: 17px; fill: #51647d; }
      .pill { font-size: 16px; font-weight: 650; fill: #21466f; }
      .note { font-size: 16px; fill: #6a4d12; }
      .node { fill: #ffffff; stroke: #d5e0ed; stroke-width: 2; }
      .flow { fill: none; stroke: #8497af; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1320" rx="30" fill="url(#bg)" />
  <text x="600" y="68" text-anchor="middle" class="title">Annotation과 Reflection에서 Spring Bean 생명주기까지</text>
  <text x="600" y="103" text-anchor="middle" class="sub">코드에 적은 메타데이터가 Container의 객체 관리로 이어진다</text>

  <rect x="112" y="128" width="976" height="1144" rx="28" fill="#ffffff" stroke="#c9d7e8" stroke-width="2" />
  <rect x="112" y="128" width="976" height="58" rx="28" fill="#eaf1fa" />
  <path d="M112 158 Q112 128 142 128 H1058 Q1088 128 1088 158 V186 H112 Z" fill="#eaf1fa" />
  <circle cx="151" cy="157" r="8" fill="#2563eb" />
  <text x="174" y="163" class="section">APPLICATION → SPRING FLOW</text>

  <rect x="300" y="214" width="600" height="90" rx="17" class="node" />
  <text x="600" y="250" text-anchor="middle" class="label">개발자 코드</text>
  <text x="600" y="280" text-anchor="middle" class="detail">@Service · @Component · @Bean</text>
  <path d="M600 305 V336" class="flow" />

  <rect x="300" y="346" width="600" height="90" rx="17" class="node" />
  <text x="600" y="382" text-anchor="middle" class="label">Annotation 메타데이터</text>
  <text x="600" y="412" text-anchor="middle" class="detail">적용 위치와 유지 시점 등 코드의 의미를 표시</text>
  <path d="M600 437 V468" class="flow" />

  <rect x="220" y="478" width="760" height="116" rx="17" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" />
  <text x="600" y="513" text-anchor="middle" class="label">메타데이터 확인</text>
  <text x="600" y="545" text-anchor="middle" class="detail">Spring Component Scan이 Classpath에서 Bean 후보를 찾는다</text>
  <text x="600" y="575" text-anchor="middle" class="detail">Java Reflection은 런타임 Annotation 조회 API · Spring은 여러 절차를 함께 사용</text>
  <path d="M600 595 V654" class="flow" />

  <rect x="300" y="666" width="600" height="82" rx="17" class="node" />
  <text x="600" y="702" text-anchor="middle" class="label">BeanDefinition 등록</text>
  <text x="600" y="730" text-anchor="middle" class="detail">Spring이 Bean을 구성하는 정보를 보관</text>
  <path d="M600 749 V780" class="flow" />

  <rect x="300" y="790" width="600" height="82" rx="17" class="node" />
  <text x="600" y="826" text-anchor="middle" class="label">Bean 생성과 의존성 주입</text>
  <text x="600" y="854" text-anchor="middle" class="detail">Container가 객체와 의존 관계를 준비</text>
  <path d="M600 873 V904" class="flow" />

  <rect x="300" y="914" width="600" height="108" rx="17" fill="#f2f7ff" stroke="#c7d8f0" stroke-width="2" />
  <text x="600" y="951" text-anchor="middle" class="label">초기화 Callback 후 애플리케이션에서 사용</text>
  <text x="600" y="984" text-anchor="middle" class="detail">Scope가 인스턴스를 공유하는 범위를 결정</text>
  <rect x="334" y="995" width="150" height="28" rx="14" fill="#dceaff" />
  <rect x="525" y="995" width="150" height="28" rx="14" fill="#d9f5ec" />
  <rect x="716" y="995" width="150" height="28" rx="14" fill="#fff0ce" />
  <text x="409" y="1015" text-anchor="middle" class="pill">Singleton</text>
  <text x="600" y="1015" text-anchor="middle" class="pill">Request</text>
  <text x="791" y="1015" text-anchor="middle" class="pill">Prototype</text>
  <path d="M600 1023 V1050" class="flow" />

  <rect x="300" y="1060" width="600" height="84" rx="17" class="node" />
  <text x="600" y="1096" text-anchor="middle" class="label">Container 종료와 소멸 Callback</text>
  <text x="600" y="1125" text-anchor="middle" class="detail">관리 대상 Bean의 자원을 정리</text>

  <rect x="220" y="1171" width="760" height="58" rx="14" fill="#fff8e6" stroke="#f0d58f" stroke-width="1.5" />
  <text x="600" y="1207" text-anchor="middle" class="note">Prototype Bean의 소멸과 자원 정리는 호출자 책임</text>
</svg>
