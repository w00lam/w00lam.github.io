<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" role="img" aria-label="로드밸런서가 요청을 세 대의 애플리케이션 서버로 분산하고, 세 서버가 모두 공용 Redis 세션 저장소를 참조하는 구조. 서버의 로컬 메모리 세션은 사용하지 않는다.">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97742"/>
    </marker>
  </defs>

  <style>
    .box   { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; }
    .lb    { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.8; }
    .ghost { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .store { fill: #fdf2ea; stroke: #d97742; stroke-width: 2; }
    .flow  { stroke: #64748b; stroke-width: 1.6; fill: none; }
    .flowA { stroke: #d97742; stroke-width: 2.2; fill: none; }
    text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #1f2937; }
    .n  { font-size: 13.5px; }
    .b  { font-size: 13.5px; font-weight: 700; }
    .s  { font-size: 11.5px; fill: #64748b; }
    .g  { font-size: 10.5px; fill: #94a3b8; }
  </style>

  <rect x="0" y="0" width="780" height="480" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- client -->
  <rect class="box" x="332" y="24" width="116" height="52" rx="6"/>
  <text class="n" x="390" y="55" text-anchor="middle">클라이언트</text>
  <line class="flow" x1="390" y1="76" x2="390" y2="112" marker-end="url(#arrow2)"/>
  <text class="s" x="404" y="99">세션 ID 쿠키</text>

  <!-- load balancer -->
  <rect class="lb" x="250" y="116" width="280" height="52" rx="6"/>
  <text class="b" x="390" y="147" text-anchor="middle">Load Balancer</text>

  <!-- lb -> servers -->
  <path class="flow" d="M320,168 V196 H140 V222" marker-end="url(#arrow2)"/>
  <path class="flow" d="M390,168 V222" marker-end="url(#arrow2)"/>
  <path class="flow" d="M460,168 V196 H640 V222" marker-end="url(#arrow2)"/>
  <text class="s" x="640" y="192" text-anchor="middle">요청이 어느 서버로 갈지 모른다</text>

  <!-- app servers -->
  <g>
    <rect class="box" x="70" y="226" width="140" height="96" rx="6"/>
    <text class="n" x="140" y="253" text-anchor="middle">App A</text>
    <rect class="ghost" x="86" y="266" width="108" height="38" rx="4"/>
    <text class="g" x="140" y="290" text-anchor="middle">로컬 메모리</text>
  </g>
  <g>
    <rect class="box" x="320" y="226" width="140" height="96" rx="6"/>
    <text class="n" x="390" y="253" text-anchor="middle">App B</text>
    <rect class="ghost" x="336" y="266" width="108" height="38" rx="4"/>
    <text class="g" x="390" y="290" text-anchor="middle">로컬 메모리</text>
  </g>
  <g>
    <rect class="box" x="570" y="226" width="140" height="96" rx="6"/>
    <text class="n" x="640" y="253" text-anchor="middle">App C</text>
    <rect class="ghost" x="586" y="266" width="108" height="38" rx="4"/>
    <text class="g" x="640" y="290" text-anchor="middle">로컬 메모리</text>
  </g>

  <!-- servers -> redis -->
  <path class="flowA" d="M140,322 V352 H330 V371" marker-end="url(#arrow2a)"/>
  <path class="flowA" d="M390,322 V371" marker-end="url(#arrow2a)"/>
  <path class="flowA" d="M640,322 V352 H450 V371" marker-end="url(#arrow2a)"/>

  <!-- redis store -->
  <path class="store" d="M300,384 h180 v52 a90,13 0 0 1 -180,0 z"/>
  <ellipse class="store" cx="390" cy="384" rx="90" ry="13"/>
  <text class="b" x="390" y="422" text-anchor="middle" fill="#a04f22">Redis</text>

  <text class="s" x="390" y="466" text-anchor="middle">세션을 서버 밖 공용 저장소에 두면 어느 서버가 받아도 같은 사용자로 인식된다.</text>
</svg>
