<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540" role="img" aria-label="Basic Auth는 요청마다 아이디와 비밀번호를 보내고 서버는 상태를 저장하지 않는다. 세션 인증은 최초 로그인 후 세션 ID 쿠키만 주고받고 서버가 세션 저장소를 둔다.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97742"/>
    </marker>
    <g id="lock">
      <rect x="-5" y="-3" width="10" height="8" rx="1.5" fill="none" stroke="#64748b" stroke-width="1.4"/>
      <path d="M-2.6,-3 v-2.4 a2.6,2.6 0 0 1 5.2,0 V-3" fill="none" stroke="#64748b" stroke-width="1.4"/>
    </g>
    <g id="cookie">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#d97742" stroke-width="1.4"/>
      <circle cx="-2" cy="-2" r="1.1" fill="#d97742"/>
      <circle cx="2.2" cy="0.6" r="1.1" fill="#d97742"/>
      <circle cx="-1" cy="2.6" r="1.1" fill="#d97742"/>
    </g>
  </defs>

  <style>
    .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .box   { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; }
    .ghost { fill: none; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .store { fill: #fdf2ea; stroke: #d97742; stroke-width: 1.8; }
    .flow  { stroke: #64748b; stroke-width: 1.6; fill: none; }
    .flowA { stroke: #d97742; stroke-width: 1.6; fill: none; }
    text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #1f2937; }
    .h  { font-size: 15px; font-weight: 700; }
    .n  { font-size: 13px; }
    .s  { font-size: 11.5px; fill: #64748b; }
    .sa { font-size: 11.5px; fill: #c2632f; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11.5px; fill: #64748b; }
  </style>

  <!-- ===== Panel 1: Basic Auth ===== -->
  <rect class="panel" x="20" y="20" width="740" height="216" rx="10"/>
  <text class="h" x="42" y="50">Basic Auth</text>
  <text class="s" x="130" y="50">— stateless</text>

  <rect class="box" x="48" y="96" width="112" height="72" rx="6"/>
  <text class="n" x="104" y="138" text-anchor="middle">클라이언트</text>

  <rect class="box" x="452" y="96" width="112" height="72" rx="6"/>
  <text class="n" x="508" y="138" text-anchor="middle">서버</text>

  <rect class="ghost" x="608" y="104" width="122" height="56" rx="6"/>
  <text class="s" x="669" y="137" text-anchor="middle">저장소 없음</text>

  <text class="mono" x="306" y="94" text-anchor="middle">Authorization: Basic</text>
  <line class="flow" x1="180" y1="112" x2="440" y2="112" marker-end="url(#arrow)"/>
  <line class="flow" x1="180" y1="132" x2="440" y2="132" marker-end="url(#arrow)"/>
  <line class="flow" x1="180" y1="152" x2="440" y2="152" marker-end="url(#arrow)"/>
  <use href="#lock" x="169" y="112"/>
  <use href="#lock" x="169" y="132"/>
  <use href="#lock" x="169" y="152"/>
  <text class="s" x="306" y="180" text-anchor="middle">매 요청마다 ID · PW</text>

  <text class="s" x="42" y="216">요청 하나하나가 독립적으로 검증된다.</text>

  <!-- ===== Panel 2: Session ===== -->
  <rect class="panel" x="20" y="256" width="740" height="262" rx="10"/>
  <text class="h" x="42" y="286">세션 인증</text>
  <text class="s" x="118" y="286">— stateful</text>

  <rect class="box" x="48" y="330" width="112" height="72" rx="6"/>
  <text class="n" x="104" y="372" text-anchor="middle">클라이언트</text>

  <rect class="box" x="452" y="330" width="112" height="72" rx="6"/>
  <text class="n" x="508" y="372" text-anchor="middle">서버</text>

  <!-- login -->
  <line class="flow" x1="180" y1="330" x2="440" y2="330" marker-end="url(#arrow)"/>
  <use href="#lock" x="169" y="330"/>
  <text class="s" x="310" y="322" text-anchor="middle">① 최초 1회 ID · PW</text>

  <!-- set-cookie -->
  <line class="flowA" x1="440" y1="362" x2="180" y2="362" marker-end="url(#arrowAccent)"/>
  <text class="mono" x="310" y="356" text-anchor="middle" fill="#c2632f">Set-Cookie</text>
  <text class="sa" x="310" y="378" text-anchor="middle">② 세션 ID 발급</text>

  <!-- subsequent -->
  <line class="flowA" x1="180" y1="398" x2="440" y2="398" marker-end="url(#arrowAccent)"/>
  <line class="flowA" x1="180" y1="416" x2="440" y2="416" marker-end="url(#arrowAccent)"/>
  <use href="#cookie" x="170" y="398"/>
  <use href="#cookie" x="170" y="416"/>
  <text class="sa" x="310" y="436" text-anchor="middle">③ 이후에는 세션 ID 쿠키만</text>

  <!-- session store -->
  <path class="store" d="M600,352 h124 v58 a62,11 0 0 1 -124,0 z"/>
  <ellipse class="store" cx="662" cy="352" rx="62" ry="11"/>
  <text class="n" x="662" y="392" text-anchor="middle" fill="#a04f22">Session</text>
  <line class="flowA" x1="564" y1="376" x2="596" y2="376" marker-end="url(#arrowAccent)"/>
  <text class="s" x="662" y="440" text-anchor="middle">조회 · 삭제 · 만료</text>

  <text class="s" x="42" y="486">인증 상태의 주도권이 서버에 있어 로그아웃과 만료를 처리할 수 있다.</text>
</svg>
