<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1540" role="img" aria-labelledby="title desc">
  <title id="title">Spring MVC의 JSON HTTP 요청 처리 흐름</title>
  <desc id="desc">Client의 JSON 요청이 Servlet Container와 DispatcherServlet을 거쳐 HandlerMapping, HandlerAdapter, ArgumentResolver, HttpMessageConverter와 Jackson을 지나 Controller에 도착하고 JSON 응답으로 돌아가는 흐름</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff" />
      <stop offset="1" stop-color="#edf4fb" />
    </linearGradient>
    <linearGradient id="request" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb" />
      <stop offset="1" stop-color="#0f9f95" />
    </linearGradient>
    <linearGradient id="response" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f9f95" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7186a3" />
    </marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .title { font-size: 36px; font-weight: 750; fill: #10243e; }
      .sub { font-size: 18px; fill: #52657e; }
      .section { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #58708e; }
      .label { font-size: 23px; font-weight: 700; fill: #172b46; }
      .detail { font-size: 16px; fill: #51647d; }
      .small { font-size: 14px; fill: #60738d; }
      .pill { font-size: 15px; font-weight: 650; fill: #21466f; }
      .note { font-size: 16px; fill: #6a4d12; }
      .inverse { fill: #ffffff; }
      .node { fill: #ffffff; stroke: #d5e0ed; stroke-width: 2; }
      .request-node { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; }
      .response-node { fill: #effaf7; stroke: #bce8dc; stroke-width: 2; }
      .flow { fill: none; stroke: #8497af; stroke-width: 3; marker-end: url(#arrow); }
      .divider { stroke: #d5e0ed; stroke-width: 2; stroke-dasharray: 7 8; }
    </style>
  </defs>

  <rect width="1200" height="1540" rx="30" fill="url(#background)" />
  <text x="600" y="68" text-anchor="middle" class="title">Spring MVC HTTP 요청 처리 흐름</text>
  <text x="600" y="103" text-anchor="middle" class="sub">JSON 요청·응답을 예시로 본 구성 요소별 책임</text>

  <rect x="88" y="128" width="1024" height="1320" rx="28" fill="#ffffff" stroke="#c9d7e8" stroke-width="2" />
  <rect x="88" y="128" width="1024" height="58" rx="28" fill="#eaf1fa" />
  <path d="M88 158 Q88 128 118 128 H1082 Q1112 128 1112 158 V186 H88 Z" fill="#eaf1fa" />
  <circle cx="127" cy="157" r="8" fill="#2563eb" />
  <text x="150" y="163" class="section">SPRING MVC REQUEST / RESPONSE</text>

  <rect x="270" y="214" width="660" height="78" rx="17" class="request-node" />
  <text x="600" y="247" text-anchor="middle" class="label">Client</text>
  <text x="600" y="274" text-anchor="middle" class="detail">POST /users · JSON HTTP Request</text>
  <path d="M600 293 V326" class="flow" />

  <rect x="270" y="336" width="660" height="78" rx="17" class="node" />
  <text x="600" y="369" text-anchor="middle" class="label">Servlet Container</text>
  <text x="600" y="396" text-anchor="middle" class="detail">HTTP 요청을 DispatcherServlet으로 전달</text>
  <path d="M600 415 V448" class="flow" />

  <rect x="270" y="458" width="660" height="90" rx="17" fill="#f2f7ff" stroke="#c7d8f0" stroke-width="2" />
  <text x="600" y="494" text-anchor="middle" class="label">DispatcherServlet</text>
  <text x="600" y="523" text-anchor="middle" class="detail">요청 처리 흐름을 조정하고 작업을 위임</text>
  <path d="M600 549 V582" class="flow" />

  <rect x="270" y="592" width="660" height="82" rx="17" class="node" />
  <text x="600" y="627" text-anchor="middle" class="label">HandlerMapping</text>
  <text x="600" y="654" text-anchor="middle" class="detail">경로·HTTP Method에 맞는 Handler 탐색</text>
  <path d="M600 675 V708" class="flow" />

  <rect x="270" y="718" width="660" height="82" rx="17" class="node" />
  <text x="600" y="753" text-anchor="middle" class="label">HandlerAdapter</text>
  <text x="600" y="780" text-anchor="middle" class="detail">찾아낸 Handler를 호출할 수 있도록 지원</text>
  <path d="M600 801 V834" class="flow" />

  <rect x="180" y="844" width="840" height="166" rx="18" fill="#f8fbff" stroke="#d5e3f2" stroke-width="2" />
  <text x="600" y="880" text-anchor="middle" class="label">Controller 메서드 매개변수 준비</text>
  <text x="600" y="912" text-anchor="middle" class="detail">ArgumentResolver가 매개변수 종류에 따라 값을 준비한다</text>
  <rect x="220" y="940" width="220" height="44" rx="22" fill="#e9f2ff" />
  <text x="330" y="968" text-anchor="middle" class="pill">@PathVariable / @RequestParam</text>
  <rect x="490" y="940" width="220" height="44" rx="22" fill="#e7f8f2" />
  <text x="600" y="968" text-anchor="middle" class="pill">@RequestBody</text>
  <rect x="760" y="940" width="220" height="44" rx="22" fill="#fff3d9" />
  <text x="870" y="968" text-anchor="middle" class="pill">그 밖의 매개변수</text>
  <path d="M600 1012 V1045" class="flow" />

  <rect x="180" y="1055" width="840" height="116" rx="18" class="request-node" />
  <text x="600" y="1091" text-anchor="middle" class="label">HttpMessageConverter → Jackson</text>
  <text x="600" y="1121" text-anchor="middle" class="detail">HTTP Body를 Java 객체로 변환 · JSON이면 Jackson이 역직렬화</text>
  <text x="600" y="1149" text-anchor="middle" class="small">Body가 필요한 @RequestBody 예시에서만 등장</text>
  <path d="M600 1173 V1206" class="flow" />

  <rect x="270" y="1216" width="660" height="86" rx="17" fill="url(#request)" />
  <text x="600" y="1252" text-anchor="middle" class="label inverse">Controller</text>
  <text x="600" y="1280" text-anchor="middle" class="detail inverse">준비된 매개변수로 메서드 실행 · UserResponse 반환</text>
  <path d="M600 1303 V1336" class="flow" />

  <rect x="180" y="1346" width="840" height="78" rx="17" class="response-node" />
  <text x="600" y="1378" text-anchor="middle" class="label">Jackson → HttpMessageConverter → Client</text>
  <text x="600" y="1406" text-anchor="middle" class="detail">Java 객체를 JSON Response Body로 직렬화해 반환</text>

  <line x1="128" y1="1458" x2="1072" y2="1458" class="divider" />
  <text x="600" y="1487" text-anchor="middle" class="note">모든 요청이 같은 단계를 거치는 것은 아니다. Jackson은 JSON Body를 예시로 든 경우에 사용된다.</text>
</svg>
