<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Direct Mapped 캐시에서 블록 0과 블록 4의 교체</title>
  <desc id="desc">블록 0과 블록 4가 모두 Index 0에 매핑되고, 블록 4가 들어온 뒤 주소 0 요청에서 충돌 미스가 발생하는 상태 변화</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff" />
      <stop offset="1" stop-color="#edf4fb" />
    </linearGradient>
    <linearGradient id="cache" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2ff" />
      <stop offset="1" stop-color="#f5f9ff" />
    </linearGradient>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-amber" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#c47b12" />
    </marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .title { font-size: 34px; font-weight: 750; fill: #10243e; }
      .sub { font-size: 18px; fill: #52657e; }
      .section { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #58708e; }
      .label { font-size: 23px; font-weight: 700; fill: #172b46; }
      .detail { font-size: 16px; fill: #51647d; }
      .small { font-size: 14px; fill: #60738d; }
      .legend { font-size: 16px; font-weight: 650; fill: #21466f; }
      .note { font-size: 15px; fill: #6a4d12; }
      .panel { fill: #f1f6ff; stroke: #b9cce5; stroke-width: 2; }
      .line { fill: #ffffff; stroke: #c9d7e8; stroke-width: 2; }
      .block0 { fill: #e3f7f1; stroke: #9bd8ca; stroke-width: 2; }
      .block4 { fill: #fff0cf; stroke: #e5bb6f; stroke-width: 2; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .replace { fill: none; stroke: #c47b12; stroke-width: 4; stroke-dasharray: 12 8; marker-end: url(#arrow-amber); }
      .divider { stroke: #d5e0ed; stroke-width: 2; stroke-dasharray: 7 8; }
    </style>
  </defs>

  <rect width="1400" height="980" rx="28" fill="url(#background)" />
  <text x="700" y="55" text-anchor="middle" class="title">Direct Mapped 캐시에서 블록 0과 블록 4의 교체</text>
  <text x="700" y="88" text-anchor="middle" class="sub">캐시 라인의 내용이 바뀌는 것과 원본 데이터의 값이 바뀌는 것은 다르다</text>

  <rect x="60" y="140" width="410" height="690" rx="24" class="panel" />
  <rect x="90" y="165" width="350" height="48" rx="16" fill="#dce9fb" />
  <text x="118" y="196" class="section">ADDRESS BREAKDOWN</text>
  <text x="265" y="270" text-anchor="middle" class="label">주소 0</text>
  <rect x="115" y="305" width="300" height="80" rx="16" fill="#ffffff" stroke="#c9d7e8" stroke-width="2" />
  <text x="265" y="337" text-anchor="middle" class="detail">블록 번호 = 0 / 4 = 0</text>
  <text x="265" y="365" text-anchor="middle" class="detail">Index = 0 % 4 = 0</text>
  <rect x="115" y="425" width="300" height="80" rx="16" fill="#ffffff" stroke="#c9d7e8" stroke-width="2" />
  <text x="265" y="457" text-anchor="middle" class="detail">Tag = 0 / 4 = 0</text>
  <text x="265" y="485" text-anchor="middle" class="detail">Offset = 0</text>
  <text x="265" y="585" text-anchor="middle" class="small">주소 16도 Index 0</text>
  <text x="265" y="614" text-anchor="middle" class="small">블록 번호 4 / 4 = Tag 1</text>
  <path d="M265 535 V680" class="replace" />
  <text x="305" y="652" class="note">같은 라인으로 이동</text>

  <rect x="520" y="140" width="365" height="690" rx="24" class="panel" />
  <rect x="550" y="165" width="305" height="48" rx="16" fill="#dce9fb" />
  <text x="578" y="196" class="section">CACHE · 4 LINES</text>
  <text x="590" y="260" class="label">Index 0</text>
  <rect x="590" y="285" width="225" height="115" rx="16" class="line" />
  <text x="702" y="322" text-anchor="middle" class="detail">Valid = 1</text>
  <rect x="610" y="340" width="185" height="40" rx="12" class="block0" />
  <text x="702" y="366" text-anchor="middle" class="legend">Tag 0 · Block 0</text>
  <path d="M815 342 H920" class="arrow" />
  <text x="868" y="325" text-anchor="middle" class="small">주소 0 저장</text>

  <text x="590" y="485" class="label">주소 16 접근 후</text>
  <rect x="590" y="510" width="225" height="115" rx="16" class="line" />
  <text x="702" y="547" text-anchor="middle" class="detail">Valid = 1</text>
  <rect x="610" y="565" width="185" height="40" rx="12" class="block4" />
  <text x="702" y="591" text-anchor="middle" class="legend">Tag 1 · Block 4</text>
  <path d="M815 568 H920" class="replace" />
  <text x="868" y="550" text-anchor="middle" class="note">기존 라인 교체</text>

  <rect x="980" y="140" width="360" height="690" rx="24" fill="#fffaf1" stroke="#ead8b4" stroke-width="2" />
  <rect x="1010" y="165" width="300" height="48" rx="16" fill="#fff0cf" />
  <text x="1038" y="196" class="section">ACCESS SEQUENCE</text>
  <text x="1035" y="285" class="label">0 → 1 → 16 → 0</text>
  <text x="1035" y="345" class="detail">0: Block 0을 가져옴</text>
  <text x="1035" y="390" class="detail">1: 같은 Block 0 안에서 히트</text>
  <text x="1035" y="435" class="detail">16: Block 4의 첫 접근</text>
  <text x="1035" y="480" class="detail">→ 콜드 미스 + 라인 교체</text>
  <text x="1035" y="555" class="detail">0: Block 0을 다시 요청</text>
  <text x="1035" y="600" class="detail">→ Index는 같지만 Tag가 다름</text>
  <rect x="1030" y="655" width="260" height="78" rx="16" fill="#fff0cf" stroke="#e5bb6f" stroke-width="2" />
  <text x="1160" y="687" text-anchor="middle" class="legend">충돌 미스</text>
  <text x="1160" y="714" text-anchor="middle" class="small">Block 0이 교체되어 없음</text>

  <line x1="90" y1="875" x2="1310" y2="875" class="divider" />
  <text x="700" y="920" text-anchor="middle" class="note">원본 메모리의 값이 수정된 것이 아니라 Index 0 캐시 라인이 보관하는 블록이 바뀐 상태다.</text>
  <text x="700" y="949" text-anchor="middle" class="note">Index만 같다고 히트가 되지 않으며 Valid와 Tag를 함께 확인해야 한다.</text>
</svg>
