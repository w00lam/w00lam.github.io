<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">CPU 캐시 계층과 히트·미스 흐름</title>
  <desc id="desc">CPU가 L1, L2, L3 캐시를 차례로 확인하고 미스가 나면 RAM에서 메모리 블록을 가져오는 단순화된 흐름</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff" />
      <stop offset="1" stop-color="#edf4fb" />
    </linearGradient>
    <linearGradient id="cache" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2ff" />
      <stop offset="1" stop-color="#f5f9ff" />
    </linearGradient>
    <linearGradient id="ram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfbf7" />
      <stop offset="1" stop-color="#f6fffc" />
    </linearGradient>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#0f9f95" />
    </marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .title { font-size: 34px; font-weight: 750; fill: #10243e; }
      .sub { font-size: 18px; fill: #52657e; }
      .section { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #58708e; }
      .label { font-size: 24px; font-weight: 700; fill: #172b46; }
      .detail { font-size: 16px; fill: #51647d; }
      .small { font-size: 14px; fill: #60738d; }
      .legend { font-size: 16px; font-weight: 650; fill: #21466f; }
      .note { font-size: 15px; fill: #6a4d12; }
      .cpu { fill: #f1f6ff; stroke: #b9cce5; stroke-width: 2; }
      .cache { fill: url(#cache); stroke: #bfd1ea; stroke-width: 2; }
      .ram { fill: url(#ram); stroke: #b6ddcf; stroke-width: 2; }
      .miss { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .hit { fill: none; stroke: #0f9f95; stroke-width: 4; marker-end: url(#arrow-teal); }
      .divider { stroke: #d5e0ed; stroke-width: 2; stroke-dasharray: 7 8; }
    </style>
  </defs>

  <rect width="1400" height="920" rx="28" fill="url(#background)" />
  <text x="700" y="55" text-anchor="middle" class="title">CPU 캐시 계층과 히트·미스 흐름</text>
  <text x="700" y="88" text-anchor="middle" class="sub">단순화한 모델: 요청한 블록을 가까운 계층부터 확인한다</text>

  <rect x="55" y="135" width="230" height="610" rx="24" class="cpu" />
  <rect x="82" y="160" width="176" height="48" rx="16" fill="#dce9fb" />
  <text x="108" y="191" class="section">CPU</text>
  <rect x="88" y="290" width="164" height="120" rx="18" fill="#ffffff" stroke="#c9d7e8" stroke-width="2" />
  <text x="170" y="335" text-anchor="middle" class="label">요청</text>
  <text x="170" y="367" text-anchor="middle" class="detail">주소의 블록을 읽기</text>

  <rect x="365" y="135" width="240" height="610" rx="24" class="cache" />
  <rect x="392" y="160" width="186" height="48" rx="16" fill="#dce9fb" />
  <text x="418" y="191" class="section">CACHE HIERARCHY</text>
  <rect x="405" y="250" width="160" height="92" rx="16" fill="#ffffff" stroke="#c9d7e8" stroke-width="2" />
  <text x="485" y="289" text-anchor="middle" class="label">L1</text>
  <text x="485" y="316" text-anchor="middle" class="detail">가까운 계층</text>
  <rect x="405" y="405" width="160" height="92" rx="16" fill="#ffffff" stroke="#c9d7e8" stroke-width="2" />
  <text x="485" y="444" text-anchor="middle" class="label">L2</text>
  <text x="485" y="471" text-anchor="middle" class="detail">다음 계층</text>
  <rect x="405" y="560" width="160" height="92" rx="16" fill="#ffffff" stroke="#c9d7e8" stroke-width="2" />
  <text x="485" y="599" text-anchor="middle" class="label">L3</text>
  <text x="485" y="626" text-anchor="middle" class="detail">더 큰 캐시 계층</text>

  <rect x="685" y="135" width="300" height="610" rx="24" class="ram" />
  <rect x="712" y="160" width="246" height="48" rx="16" fill="#d8f2eb" />
  <text x="738" y="191" class="section">MAIN MEMORY</text>
  <rect x="725" y="360" width="220" height="145" rx="16" fill="#ffffff" stroke="#b9e1d6" stroke-width="2" />
  <text x="835" y="405" text-anchor="middle" class="label">RAM</text>
  <text x="835" y="437" text-anchor="middle" class="detail">요청한 메모리 블록</text>
  <text x="835" y="469" text-anchor="middle" class="small">미스 뒤 하위 계층에서 가져옴</text>

  <rect x="1065" y="135" width="280" height="610" rx="24" fill="#fffaf1" stroke="#ead8b4" stroke-width="2" />
  <rect x="1092" y="160" width="226" height="48" rx="16" fill="#fff0cf" />
  <text x="1118" y="191" class="section">RESULT</text>
  <rect x="1100" y="290" width="210" height="120" rx="18" fill="#ffffff" stroke="#ead8b4" stroke-width="2" />
  <text x="1205" y="335" text-anchor="middle" class="label">히트</text>
  <text x="1205" y="367" text-anchor="middle" class="detail">해당 계층에서 얻음</text>
  <rect x="1100" y="500" width="210" height="120" rx="18" fill="#ffffff" stroke="#ead8b4" stroke-width="2" />
  <text x="1205" y="545" text-anchor="middle" class="label">미스</text>
  <text x="1205" y="577" text-anchor="middle" class="detail">하위 계층으로 이동</text>

  <path d="M252 350 H405" class="miss" />
  <text x="325" y="330" text-anchor="middle" class="legend">요청</text>
  <path d="M565 296 H1100" class="hit" />
  <text x="835" y="275" text-anchor="middle" class="legend">태그 일치 + 유효 → 히트</text>
  <path d="M485 342 V405" class="miss" />
  <text x="528" y="380" class="small">L1 미스</text>
  <path d="M485 497 V560" class="miss" />
  <text x="528" y="535" class="small">L2 미스</text>
  <path d="M565 606 H725" class="miss" />
  <text x="645" y="586" text-anchor="middle" class="small">L3 미스 → RAM</text>
  <path d="M945 430 H1065" class="hit" />
  <text x="1005" y="410" text-anchor="middle" class="legend">블록 전달</text>
  <path d="M1205 410 V500" class="miss" />
  <text x="1238" y="460" class="small">다음 계층 확인</text>

  <line x1="90" y1="805" x2="1310" y2="805" class="divider" />
  <text x="700" y="850" text-anchor="middle" class="note">이 그림은 L1 → L2 → L3 → RAM 순서로 확인하는 학습용 단순화 모델이다.</text>
  <text x="700" y="879" text-anchor="middle" class="note">실제 CPU의 계층 구성·공유 방식·접근 경로는 구현에 따라 달라질 수 있다.</text>
</svg>
