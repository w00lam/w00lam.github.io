<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Min Heap의 트리와 배열 대응</title>
  <desc id="desc">Min Heap 2 4 7 9 8을 완전 이진 트리와 0번 인덱스 배열로 대응한 개념도</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px sans-serif; fill: #111827; }
      .heading { font: 700 21px sans-serif; fill: #1f2937; }
      .text { font: 500 17px sans-serif; fill: #374151; }
      .node { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .cell { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; }
      .map { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="600" rx="24"/>
  <text class="title" x="55" y="58">Heap은 트리의 부분 순서를 배열 인덱스로 관리한다</text>
  <text class="text" x="55" y="92">Min Heap: 부모 ≤ 자식 · 형제끼리와 배열 전체가 정렬되어야 하는 것은 아니다</text>

  <text class="heading" x="95" y="145">완전 이진 트리</text>
  <path class="line" d="M300 205 L205 295 M300 205 L395 295 M205 345 L145 430 M205 345 L265 430"/>
  <circle class="node" cx="300" cy="190" r="42"/><circle class="node" cx="205" cy="330" r="42"/><circle class="node" cx="395" cy="330" r="42"/><circle class="node" cx="145" cy="465" r="42"/><circle class="node" cx="265" cy="465" r="42"/>
  <text class="heading" x="290" y="198">2</text><text class="heading" x="195" y="338">4</text><text class="heading" x="385" y="338">7</text><text class="heading" x="135" y="473">9</text><text class="heading" x="255" y="473">8</text>

  <text class="heading" x="690" y="145">0번 인덱스 배열</text>
  <g transform="translate(625 205)">
    <rect class="cell" x="0" y="0" width="95" height="78" rx="10"/><rect class="cell" x="105" y="0" width="95" height="78" rx="10"/><rect class="cell" x="210" y="0" width="95" height="78" rx="10"/><rect class="cell" x="315" y="0" width="95" height="78" rx="10"/><rect class="cell" x="420" y="0" width="95" height="78" rx="10"/>
    <text class="heading" x="40" y="49">2</text><text class="heading" x="145" y="49">4</text><text class="heading" x="250" y="49">7</text><text class="heading" x="355" y="49">9</text><text class="heading" x="460" y="49">8</text>
    <text class="text" x="42" y="112">0</text><text class="text" x="147" y="112">1</text><text class="text" x="252" y="112">2</text><text class="text" x="357" y="112">3</text><text class="text" x="462" y="112">4</text>
  </g>
  <path class="map" d="M300 232 C500 190 535 190 660 232"/><path class="map" d="M205 372 C450 355 570 310 765 232"/><path class="map" d="M395 372 C600 370 715 330 870 232"/><path class="map" d="M145 507 C410 535 625 500 975 232"/><path class="map" d="M265 507 C570 560 780 520 1080 232"/>

  <rect x="625" y="425" width="515" height="105" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="text" x="650" y="458">부모: (i - 1) / 2 · 왼쪽 자식: 2 * i + 1</text>
  <text class="text" x="650" y="490">오른쪽 자식: 2 * i + 2</text>
  <text class="text" x="650" y="522">인덱스는 트리 관계를 계산하기 위한 값이다</text>
</svg>
