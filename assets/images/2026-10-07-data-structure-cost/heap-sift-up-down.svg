<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Heap 삽입과 루트 제거 조정</title>
  <desc id="desc">Min Heap에 1을 삽입할 때 부모 방향으로 올라가고 루트 제거 후 7이 작은 자식 2를 따라 내려가는 과정</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 28px sans-serif; fill: #111827; }
      .heading { font: 700 22px sans-serif; fill: #1f2937; }
      .text { font: 500 17px sans-serif; fill: #374151; }
      .cell { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .active { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .route { fill: none; stroke: #dc2626; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1400" height="720" rx="24"/>
  <text class="title" x="55" y="58">삽입은 위로, 루트 제거는 아래로 조정한다</text>

  <rect class="panel" x="40" y="105" width="640" height="560" rx="18"/>
  <text class="heading" x="75" y="150">1 삽입 · sift up</text>
  <text class="text" x="75" y="181">마지막에 넣고 부모와 비교하며 올라간다</text>
  <g transform="translate(90 225)">
    <text class="text" x="0" y="-18">초기</text>
    <rect class="cell" x="0" y="0" width="90" height="58" rx="8"/><rect class="cell" x="100" y="0" width="90" height="58" rx="8"/><rect class="cell" x="200" y="0" width="90" height="58" rx="8"/><rect class="cell" x="300" y="0" width="90" height="58" rx="8"/><rect class="cell" x="400" y="0" width="90" height="58" rx="8"/>
    <text class="heading" x="37" y="38">2</text><text class="heading" x="137" y="38">4</text><text class="heading" x="237" y="38">7</text><text class="heading" x="337" y="38">9</text><text class="heading" x="437" y="38">8</text>
    <text class="text" x="0" y="95">마지막에 1 추가</text>
    <rect class="cell" x="0" y="118" width="90" height="58" rx="8"/><rect class="cell" x="100" y="118" width="90" height="58" rx="8"/><rect class="cell" x="200" y="118" width="90" height="58" rx="8"/><rect class="cell" x="300" y="118" width="90" height="58" rx="8"/><rect class="cell" x="400" y="118" width="90" height="58" rx="8"/><rect class="active" x="500" y="118" width="90" height="58" rx="8"/>
    <text class="heading" x="37" y="156">2</text><text class="heading" x="137" y="156">4</text><text class="heading" x="237" y="156">7</text><text class="heading" x="337" y="156">9</text><text class="heading" x="437" y="156">8</text><text class="heading" x="537" y="156">1</text>
    <path class="route" d="M545 108 C545 75 245 75 245 108"/>
    <text class="text" x="0" y="225">7과 교환</text>
    <rect class="cell" x="0" y="248" width="90" height="58" rx="8"/><rect class="cell" x="100" y="248" width="90" height="58" rx="8"/><rect class="active" x="200" y="248" width="90" height="58" rx="8"/><rect class="cell" x="300" y="248" width="90" height="58" rx="8"/><rect class="cell" x="400" y="248" width="90" height="58" rx="8"/><rect class="cell" x="500" y="248" width="90" height="58" rx="8"/>
    <text class="heading" x="37" y="286">2</text><text class="heading" x="137" y="286">4</text><text class="heading" x="237" y="286">1</text><text class="heading" x="337" y="286">9</text><text class="heading" x="437" y="286">8</text><text class="heading" x="537" y="286">7</text>
    <path class="route" d="M245 238 C245 210 45 210 45 238"/>
    <text class="text" x="0" y="355">2와 교환 → 최종</text>
    <text class="heading" x="0" y="398">[1, 4, 2, 9, 8, 7]</text>
  </g>

  <rect class="panel" x="720" y="105" width="640" height="560" rx="18"/>
  <text class="heading" x="755" y="150">2 루트 제거 · sift down</text>
  <text class="text" x="755" y="181">마지막 요소를 루트로 옮기고 작은 자식을 선택한다</text>
  <g transform="translate(770 225)">
    <text class="text" x="0" y="-18">루트 1 제거 후 7을 루트로 이동</text>
    <rect class="active" x="0" y="0" width="90" height="58" rx="8"/><rect class="cell" x="100" y="0" width="90" height="58" rx="8"/><rect class="cell" x="200" y="0" width="90" height="58" rx="8"/><rect class="cell" x="300" y="0" width="90" height="58" rx="8"/><rect class="cell" x="400" y="0" width="90" height="58" rx="8"/>
    <text class="heading" x="37" y="38">7</text><text class="heading" x="137" y="38">4</text><text class="heading" x="237" y="38">2</text><text class="heading" x="337" y="38">9</text><text class="heading" x="437" y="38">8</text>
    <text class="text" x="0" y="105">자식 4와 2 중 작은 2를 선택</text>
    <path class="route" d="M45 64 C45 95 245 95 245 64"/>
    <rect class="active" x="0" y="135" width="90" height="58" rx="8"/><rect class="cell" x="100" y="135" width="90" height="58" rx="8"/><rect class="cell" x="200" y="135" width="90" height="58" rx="8"/><rect class="cell" x="300" y="135" width="90" height="58" rx="8"/><rect class="cell" x="400" y="135" width="90" height="58" rx="8"/>
    <text class="heading" x="37" y="173">2</text><text class="heading" x="137" y="173">4</text><text class="heading" x="237" y="173">7</text><text class="heading" x="337" y="173">9</text><text class="heading" x="437" y="173">8</text>
    <text class="text" x="0" y="250">부모 2 ≤ 자식 4, 7 → 조정 중단</text>
    <text class="heading" x="0" y="314">[2, 4, 7, 9, 8]</text>
  </g>
  <text class="text" x="55" y="700">삽입과 제거 모두 완전 이진 트리의 경로만 조정하므로 비용은 높이 O(log n)에 비례한다</text>
</svg>
