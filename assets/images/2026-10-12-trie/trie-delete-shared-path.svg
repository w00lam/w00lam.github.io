<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <rect width="1500" height="900" fill="#f4f6f9"/>
  <style>
    .title { font: 700 38px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #071b3a; }
    .subtitle { font: 500 22px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #49627f; }
    .heading { font: 700 25px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #071b3a; }
    .label { font: 700 24px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #172b4d; }
    .small { font: 600 20px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #49627f; }
    .note { font: 700 21px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #1552d6; }
    .panel { fill: #ffffff; stroke: #cad5e2; stroke-width: 2.5; }
    .edge { stroke: #718198; stroke-width: 4; fill: none; }
    .shared-edge { stroke: #2864dc; stroke-width: 5; fill: none; }
    .shared { fill: #eef4ff; stroke: #2864dc; stroke-width: 4; }
    .terminal { fill: #fff3df; stroke: #e25716; stroke-width: 4; }
    .root { fill: #ffffff; stroke: #e25716; stroke-width: 3; }
    .pill { fill: #fff3df; stroke: #e25716; stroke-width: 2; }
    .ghost { fill: #f8fafc; stroke: #d94b4b; stroke-width: 3; stroke-dasharray: 8 6; }
    .cut { stroke: #d94b4b; stroke-width: 4; }
  </style>

  <text x="60" y="70" class="title">삭제는 종료 표시와 연결을 나누어 처리한다</text>
  <text x="60" y="110" class="subtitle">car와 care가 공유하는 경로를 삭제 사례별로 비교한다.</text>

  <rect x="30" y="150" width="440" height="700" rx="24" class="panel"/>
  <rect x="530" y="150" width="440" height="700" rx="24" class="panel"/>
  <rect x="1030" y="150" width="440" height="700" rx="24" class="panel"/>
  <text x="250" y="180" text-anchor="middle" class="heading">초기 상태</text>
  <text x="750" y="180" text-anchor="middle" class="heading">car 삭제</text>
  <text x="1250" y="180" text-anchor="middle" class="heading">care 삭제</text>

  <!-- initial: root → c → a → r → e -->
  <line x1="250" y1="265" x2="250" y2="300" class="shared-edge"/>
  <line x1="250" y1="360" x2="250" y2="380" class="shared-edge"/>
  <line x1="250" y1="440" x2="250" y2="460" class="shared-edge"/>
  <line x1="250" y1="520" x2="250" y2="540" class="shared-edge"/>
  <circle cx="250" cy="230" r="32" class="root"/><text x="250" y="238" text-anchor="middle" class="small">root</text>
  <rect x="215" y="300" width="70" height="60" rx="14" class="shared"/><text x="250" y="339" text-anchor="middle" class="label">c</text>
  <rect x="215" y="380" width="70" height="60" rx="14" class="shared"/><text x="250" y="419" text-anchor="middle" class="label">a</text>
  <rect x="215" y="460" width="70" height="60" rx="14" class="terminal"/><text x="250" y="499" text-anchor="middle" class="label">r</text>
  <rect x="215" y="540" width="70" height="60" rx="14" class="terminal"/><text x="250" y="579" text-anchor="middle" class="label">e</text>
  <rect x="315" y="472" width="80" height="34" rx="17" class="pill"/><text x="355" y="496" text-anchor="middle" class="small">car 끝</text>
  <rect x="315" y="552" width="92" height="34" rx="17" class="pill"/><text x="361" y="576" text-anchor="middle" class="small">care 끝</text>
  <text x="250" y="710" text-anchor="middle" class="note">r과 e 모두 end = true</text>
  <text x="250" y="752" text-anchor="middle" class="small">car → care가 하나의 경로로 이어짐</text>

  <!-- car deleted: r remains for care -->
  <line x1="750" y1="265" x2="750" y2="300" class="shared-edge"/>
  <line x1="750" y1="360" x2="750" y2="380" class="shared-edge"/>
  <line x1="750" y1="440" x2="750" y2="460" class="shared-edge"/>
  <line x1="750" y1="520" x2="750" y2="540" class="shared-edge"/>
  <circle cx="750" cy="230" r="32" class="root"/><text x="750" y="238" text-anchor="middle" class="small">root</text>
  <rect x="715" y="300" width="70" height="60" rx="14" class="shared"/><text x="750" y="339" text-anchor="middle" class="label">c</text>
  <rect x="715" y="380" width="70" height="60" rx="14" class="shared"/><text x="750" y="419" text-anchor="middle" class="label">a</text>
  <rect x="715" y="460" width="70" height="60" rx="14" class="shared"/><text x="750" y="499" text-anchor="middle" class="label">r</text>
  <rect x="715" y="540" width="70" height="60" rx="14" class="terminal"/><text x="750" y="579" text-anchor="middle" class="label">e</text>
  <rect x="815" y="472" width="100" height="34" rx="17" fill="#f7faff" stroke="#cad5e2" stroke-width="2"/><text x="865" y="496" text-anchor="middle" class="small">end 해제</text>
  <rect x="815" y="552" width="105" height="34" rx="17" class="pill"/><text x="867" y="576" text-anchor="middle" class="small">care 유지</text>
  <text x="750" y="710" text-anchor="middle" class="note">search(car) = false</text>
  <text x="750" y="752" text-anchor="middle" class="small">startsWith(car) = true · search(care) = true</text>

  <!-- care deleted: e connection removed, r remains for car -->
  <line x1="1250" y1="265" x2="1250" y2="300" class="shared-edge"/>
  <line x1="1250" y1="360" x2="1250" y2="380" class="shared-edge"/>
  <line x1="1250" y1="440" x2="1250" y2="460" class="shared-edge"/>
  <line x1="1250" y1="520" x2="1250" y2="550" class="cut" stroke-dasharray="8 7"/>
  <circle cx="1250" cy="230" r="32" class="root"/><text x="1250" y="238" text-anchor="middle" class="small">root</text>
  <rect x="1215" y="300" width="70" height="60" rx="14" class="shared"/><text x="1250" y="339" text-anchor="middle" class="label">c</text>
  <rect x="1215" y="380" width="70" height="60" rx="14" class="shared"/><text x="1250" y="419" text-anchor="middle" class="label">a</text>
  <rect x="1215" y="460" width="70" height="60" rx="14" class="terminal"/><text x="1250" y="499" text-anchor="middle" class="label">r</text>
  <rect x="1215" y="550" width="70" height="60" rx="14" class="ghost"/><text x="1250" y="589" text-anchor="middle" class="label">e</text>
  <line x1="1228" y1="563" x2="1272" y2="597" class="cut"/><line x1="1272" y1="563" x2="1228" y2="597" class="cut"/>
  <rect x="1315" y="472" width="92" height="34" rx="17" class="pill"/><text x="1361" y="496" text-anchor="middle" class="small">car 유지</text>
  <rect x="1315" y="552" width="110" height="34" rx="17" fill="#fff5f5" stroke="#d94b4b" stroke-width="2"/><text x="1370" y="576" text-anchor="middle" class="small">e 연결 제거</text>
  <text x="1250" y="710" text-anchor="middle" class="note">search(car) = true</text>
  <text x="1250" y="752" text-anchor="middle" class="small">care의 e만 더 이상 필요하지 않음</text>
</svg>
