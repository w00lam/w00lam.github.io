<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#ffffff"/>
  <style>
    .title { font: 700 30px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #1f2937; }
    .label { font: 700 24px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #111827; }
    .small { font: 500 20px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #4b5563; }
    .node { fill: #f8fafc; stroke: #64748b; stroke-width: 3; }
    .shared { fill: #e0f2fe; stroke: #0284c7; stroke-width: 4; }
    .terminal { fill: #fff7ed; stroke: #f97316; stroke-width: 4; }
    .edge { stroke: #64748b; stroke-width: 4; fill: none; }
    .end { fill: #f97316; }
  </style>
  <text x="60" y="58" class="title">그림 1. 공통 접두사와 종료 표시</text>
  <text x="60" y="98" class="small">경로를 공유하는 것과 단어가 끝나는 것은 별도의 상태다.</text>

  <line x1="600" y1="176" x2="600" y2="248" class="edge"/>
  <line x1="600" y1="312" x2="600" y2="390" class="edge"/>
  <line x1="600" y1="454" x2="390" y2="532" class="edge"/>
  <line x1="600" y1="454" x2="810" y2="532" class="edge"/>

  <circle cx="600" cy="144" r="34" fill="#f1f5f9" stroke="#334155" stroke-width="3"/>
  <text x="600" y="152" text-anchor="middle" class="label">root</text>
  <text x="650" y="151" class="small">시작점</text>

  <rect x="564" y="248" width="72" height="64" rx="14" class="shared"/>
  <text x="600" y="289" text-anchor="middle" class="label">p</text>
  <rect x="564" y="390" width="72" height="64" rx="14" class="shared"/>
  <text x="600" y="431" text-anchor="middle" class="label">e</text>

  <rect x="354" y="532" width="72" height="64" rx="14" class="terminal"/>
  <text x="390" y="573" text-anchor="middle" class="label">n</text>
  <circle cx="390" cy="620" r="10" class="end"/>
  <text x="415" y="628" class="small">end = true</text>

  <rect x="774" y="532" width="72" height="64" rx="14" class="terminal"/>
  <text x="810" y="573" text-anchor="middle" class="label">t</text>
  <circle cx="810" cy="620" r="10" class="end"/>
  <text x="835" y="628" class="small">end = true</text>

  <rect x="790" y="360" width="330" height="86" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="815" y="395" class="small">e 노드는 경로에 포함되지만</text>
  <text x="815" y="425" class="small">end = false 이므로 pe는 단어가 아니다.</text>
</svg>
