<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" fill="#f4f6f9"/>
  <style>
    .title { font: 700 38px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #071b3a; }
    .subtitle { font: 500 22px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #49627f; }
    .heading { font: 700 24px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #071b3a; }
    .label { font: 700 25px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #172b4d; }
    .small { font: 600 20px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #49627f; }
    .note { font: 700 22px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #1552d6; }
    .panel { fill: #ffffff; stroke: #cad5e2; stroke-width: 2.5; }
    .edge { stroke: #718198; stroke-width: 4; fill: none; }
    .shared-edge { stroke: #2864dc; stroke-width: 5; fill: none; }
    .root { fill: #ffffff; stroke: #e25716; stroke-width: 3; }
    .shared { fill: #eef4ff; stroke: #2864dc; stroke-width: 4; }
    .terminal { fill: #fff3df; stroke: #e25716; stroke-width: 4; }
    .pill { fill: #fff3df; stroke: #e25716; stroke-width: 2; }
  </style>

  <text x="60" y="70" class="title">Trie는 경로와 단어 끝을 따로 표시한다</text>
  <text x="60" y="110" class="subtitle">pen과 pet은 p → e를 공유하지만 e에서 단어가 끝나지는 않는다.</text>

  <rect x="30" y="150" width="1340" height="560" rx="24" class="panel"/>

  <line x1="420" y1="260" x2="420" y2="290" class="shared-edge"/>
  <line x1="420" y1="350" x2="420" y2="390" class="shared-edge"/>
  <line x1="420" y1="450" x2="310" y2="520" class="edge"/>
  <line x1="420" y1="450" x2="530" y2="520" class="edge"/>

  <circle cx="420" cy="225" r="35" class="root"/>
  <text x="420" y="234" text-anchor="middle" class="small">root</text>
  <rect x="385" y="290" width="70" height="60" rx="14" class="shared"/>
  <text x="420" y="329" text-anchor="middle" class="label">p</text>
  <rect x="385" y="390" width="70" height="60" rx="14" class="shared"/>
  <text x="420" y="429" text-anchor="middle" class="label">e</text>
  <rect x="275" y="520" width="70" height="60" rx="14" class="terminal"/>
  <text x="310" y="559" text-anchor="middle" class="label">n</text>
  <rect x="495" y="520" width="70" height="60" rx="14" class="terminal"/>
  <text x="530" y="559" text-anchor="middle" class="label">t</text>
  <rect x="264" y="602" width="92" height="36" rx="18" class="pill"/>
  <text x="310" y="627" text-anchor="middle" class="small">end</text>
  <rect x="484" y="602" width="92" height="36" rx="18" class="pill"/>
  <text x="530" y="627" text-anchor="middle" class="small">end</text>

  <rect x="730" y="220" width="570" height="112" rx="18" fill="#f7faff" stroke="#d5dfeb" stroke-width="2"/>
  <text x="765" y="262" class="heading">공유 경로</text>
  <text x="765" y="302" class="small">p → e는 pen과 pet이 함께 지나가는 경로</text>

  <rect x="730" y="360" width="570" height="112" rx="18" fill="#fffaf3" stroke="#f1d4aa" stroke-width="2"/>
  <text x="765" y="402" class="heading">단어 종료</text>
  <text x="765" y="442" class="small">n과 t에는 end가 있지만 e에는 end가 없음</text>

  <rect x="730" y="500" width="570" height="112" rx="18" fill="#f7faff" stroke="#d5dfeb" stroke-width="2"/>
  <text x="765" y="542" class="heading">검색 결과</text>
  <text x="765" y="582" class="small">search(pe) = false · startsWith(pe) = true</text>

  <text x="700" y="675" text-anchor="middle" class="note">경로가 있다고 단어가 저장된 것은 아니다.</text>
</svg>
