<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <rect width="1500" height="900" fill="#ffffff"/>
  <style>
    .title { font: 700 30px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #1f2937; }
    .panel { font: 700 26px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #111827; }
    .label { font: 700 23px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #111827; }
    .small { font: 500 20px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #4b5563; }
    .node { fill: #f8fafc; stroke: #64748b; stroke-width: 3; }
    .path { fill: #e0f2fe; stroke: #0284c7; stroke-width: 4; }
    .hit { fill: #fff7ed; stroke: #f97316; stroke-width: 5; }
    .edge { stroke: #64748b; stroke-width: 4; fill: none; }
    .alert { stroke: #dc2626; stroke-width: 5; fill: none; }
    .end { fill: #f97316; }
  </style>
  <text x="55" y="58" class="title">그림 3. 접두사 충돌의 두 방향</text>
  <text x="55" y="98" class="small">중간 노드의 종료 상태와 마지막 노드 아래의 자식 상태를 각각 확인한다.</text>

  <rect x="35" y="140" width="690" height="700" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="775" y="140" width="690" height="700" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="380" y="190" text-anchor="middle" class="panel">911 저장 후 9112 삽입</text>
  <text x="1120" y="190" text-anchor="middle" class="panel">9112 저장 후 911 삽입</text>

  <!-- left tree -->
  <line x1="380" y1="255" x2="380" y2="315" class="edge"/>
  <line x1="380" y1="375" x2="380" y2="435" class="edge"/>
  <line x1="380" y1="495" x2="380" y2="555" class="edge"/>
  <line x1="380" y1="615" x2="380" y2="675" class="alert"/>
  <circle cx="380" cy="225" r="30" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="380" y="233" text-anchor="middle" class="label">root</text>
  <rect x="350" y="315" width="60" height="60" rx="12" class="path"/><text x="380" y="354" text-anchor="middle" class="label">9</text>
  <rect x="350" y="435" width="60" height="60" rx="12" class="path"/><text x="380" y="474" text-anchor="middle" class="label">1</text>
  <rect x="350" y="555" width="60" height="60" rx="12" class="hit"/><text x="380" y="594" text-anchor="middle" class="label">1</text>
  <circle cx="380" cy="650" r="9" class="end"/>
  <text x="455" y="592" class="small">기존 911의 end</text>
  <text x="455" y="625" class="small">남은 문자 2를 처리하기 전</text>
  <text x="455" y="658" class="small">종료 지점을 만남</text>
  <text x="380" y="750" text-anchor="middle" class="small">기존 문자열이 새 문자열의 접두사</text>

  <!-- right tree -->
  <line x1="1120" y1="255" x2="1120" y2="315" class="edge"/>
  <line x1="1120" y1="375" x2="1120" y2="435" class="edge"/>
  <line x1="1120" y1="495" x2="1120" y2="555" class="edge"/>
  <line x1="1120" y1="615" x2="1120" y2="675" class="edge"/>
  <circle cx="1120" cy="225" r="30" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="1120" y="233" text-anchor="middle" class="label">root</text>
  <rect x="1090" y="315" width="60" height="60" rx="12" class="path"/><text x="1120" y="354" text-anchor="middle" class="label">9</text>
  <rect x="1090" y="435" width="60" height="60" rx="12" class="path"/><text x="1120" y="474" text-anchor="middle" class="label">1</text>
  <rect x="1090" y="555" width="60" height="60" rx="12" class="hit"/><text x="1120" y="594" text-anchor="middle" class="label">1</text>
  <rect x="1090" y="675" width="60" height="60" rx="12" class="path"/><text x="1120" y="714" text-anchor="middle" class="label">2</text>
  <circle cx="1120" cy="765" r="9" class="end"/>
  <text x="1140" y="772" class="small">end = true</text>
  <text x="1195" y="592" class="small">새 문자열 911의 마지막 노드</text>
  <text x="1195" y="625" class="small">아래에 기존 9112 경로가 남음</text>
  <text x="1195" y="658" class="small">pass = true인 상태 확인</text>
  <text x="1120" y="790" text-anchor="middle" class="small">새 문자열이 기존 문자열의 접두사</text>
</svg>
