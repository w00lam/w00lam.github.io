<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Health, Metrics, Trace ID, 로그의 역할 비교</title>
  <desc id="desc">Health는 현재 상태, Metrics는 시간에 따른 수치, Trace ID는 요청 흐름, 로그는 이벤트 기록을 확인한다</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, "Malgun Gothic", sans-serif; fill: #0f172a; text-anchor: middle; }
      .label { font: 700 25px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .sub { font: 500 19px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .question { font: 600 17px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .box { stroke-width: 2; rx: 18; }
    </style>
  </defs>
  <rect class="bg" width="1400" height="560" rx="24" />
  <text class="title" x="700" y="58">관측 도구마다 답하는 운영 질문이 다르다</text>

  <rect class="box" x="55" y="135" width="290" height="245" fill="#dbeafe" stroke="#3b82f6" />
  <text class="label" x="200" y="192" fill="#1e3a8a">Health</text>
  <text class="sub" x="200" y="235" fill="#1e40af">현재 상태</text>
  <text class="question" x="200" y="300" fill="#1e3a8a">지금 요청을 받을 수 있는가?</text>

  <rect class="box" x="385" y="135" width="290" height="245" fill="#dcfce7" stroke="#22c55e" />
  <text class="label" x="530" y="192" fill="#14532d">Metrics</text>
  <text class="sub" x="530" y="235" fill="#166534">시간에 따른 수치</text>
  <text class="question" x="530" y="300" fill="#14532d">지연과 사용량은 어떻게 변했는가?</text>

  <rect class="box" x="715" y="135" width="290" height="245" fill="#fce7f3" stroke="#ec4899" />
  <text class="label" x="860" y="192" fill="#831843">Trace ID</text>
  <text class="sub" x="860" y="235" fill="#9d174d">요청 흐름 식별자</text>
  <text class="question" x="860" y="300" fill="#831843">이 요청은 어디를 거쳤는가?</text>

  <rect class="box" x="1045" y="135" width="300" height="245" fill="#fef3c7" stroke="#f59e0b" />
  <text class="label" x="1195" y="192" fill="#78350f">로그</text>
  <text class="sub" x="1195" y="235" fill="#92400e">이벤트 기록</text>
  <text class="question" x="1195" y="300" fill="#78350f">무슨 일이 언제 기록되었는가?</text>

  <rect x="220" y="435" width="960" height="68" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="7 6" />
  <text class="question" x="700" y="477" fill="#475569">네 가지를 함께 읽어야 현재 상태, 변화, 요청 흐름, 사건을 연결할 수 있다</text>
</svg>
