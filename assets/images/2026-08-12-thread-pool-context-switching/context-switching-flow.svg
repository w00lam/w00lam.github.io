<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Context Switching flow</title>
  <desc id="desc">Thread A stops, its CPU state is saved, the scheduler selects Thread B, and Thread B resumes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1d3557" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 32px Inter, Segoe UI, sans-serif; fill: #0f172a; }
      .label { font: 700 24px Inter, Segoe UI, sans-serif; fill: #0f172a; }
      .detail { font: 500 20px Inter, Segoe UI, sans-serif; fill: #475569; }
      .small { font: 600 18px Inter, Segoe UI, sans-serif; fill: #2563eb; }
    </style>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" class="title">Context Switching</text>
  <text x="70" y="105" class="detail">작업을 바꾸기 위해 현재 실행 문맥을 저장하고 다음 문맥을 복원한다</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="240" height="170" rx="22" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text x="190" y="235" text-anchor="middle" class="label">Thread A</text>
    <text x="190" y="275" text-anchor="middle" class="detail">Running</text>
    <circle cx="190" cy="305" r="9" fill="#2563eb"/>

    <rect x="360" y="170" width="240" height="170" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="480" y="220" text-anchor="middle" class="label">Save Context</text>
    <text x="480" y="260" text-anchor="middle" class="detail">PC / Register</text>
    <text x="480" y="292" text-anchor="middle" class="detail">Stack Pointer</text>

    <rect x="650" y="170" width="200" height="170" rx="22" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="750" y="235" text-anchor="middle" class="label">Scheduler</text>
    <text x="750" y="275" text-anchor="middle" class="detail">다음 실행 대상</text>
    <text x="750" y="307" text-anchor="middle" class="detail">선택</text>

    <rect x="900" y="170" width="230" height="170" rx="22" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <text x="1015" y="220" text-anchor="middle" class="label">Restore</text>
    <text x="1015" y="260" text-anchor="middle" class="detail">Thread B 상태</text>
    <text x="1015" y="292" text-anchor="middle" class="detail">복원</text>
  </g>

  <path d="M310 255 H350" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 255 H640" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M850 255 H890" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1015 340 V470 H190 V350" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="610" y="455" text-anchor="middle" class="small">Thread B Running</text>
  <text x="610" y="500" text-anchor="middle" class="detail">전환 자체는 작업이 아니라 실행 흐름을 이어가기 위한 비용이다</text>
</svg>
