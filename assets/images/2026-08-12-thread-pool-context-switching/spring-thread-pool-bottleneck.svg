<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Spring server thread pool bottleneck</title>
  <desc id="desc">Three hundred Tomcat worker threads feed a Spring application, but only thirty database connections are available, so requests wait before the database.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fdfb"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#064e3b" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#059669"/>
    </marker>
    <style>
      .title { font: 700 32px Inter, Segoe UI, sans-serif; fill: #064e3b; }
      .label { font: 700 22px Inter, Segoe UI, sans-serif; fill: #064e3b; }
      .detail { font: 500 18px Inter, Segoe UI, sans-serif; fill: #065f46; }
      .small { font: 700 18px Inter, Segoe UI, sans-serif; fill: #047857; }
      .warn { font: 700 18px Inter, Segoe UI, sans-serif; fill: #b45309; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="65" y="70" class="title">Spring MVC: Thread Pool과 DB Connection Pool</text>
  <text x="65" y="105" class="detail">HTTP 요청을 받을 수 있는 수와 DB 작업을 동시에 수행할 수 있는 수는 다르다</text>

  <g filter="url(#shadow)">
    <rect x="65" y="180" width="190" height="190" rx="22" fill="#d1fae5" stroke="#34d399" stroke-width="2"/>
    <text x="160" y="245" text-anchor="middle" class="label">Client</text>
    <text x="160" y="285" text-anchor="middle" class="detail">Requests</text>
    <text x="160" y="325" text-anchor="middle" class="small">동시 요청</text>

    <rect x="325" y="155" width="245" height="240" rx="22" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text x="447" y="220" text-anchor="middle" class="label">Tomcat</text>
    <text x="447" y="255" text-anchor="middle" class="label">Thread Pool</text>
    <text x="447" y="310" text-anchor="middle" class="small">300 Threads</text>
    <text x="447" y="350" text-anchor="middle" class="detail">요청 진입·대기</text>

    <rect x="640" y="155" width="215" height="240" rx="22" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="747" y="235" text-anchor="middle" class="label">Spring</text>
    <text x="747" y="275" text-anchor="middle" class="label">Application</text>
    <text x="747" y="325" text-anchor="middle" class="detail">Service</text>
    <text x="747" y="355" text-anchor="middle" class="detail">Business Logic</text>

    <rect x="925" y="155" width="210" height="240" rx="22" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
    <text x="1030" y="220" text-anchor="middle" class="label">DB Connection</text>
    <text x="1030" y="255" text-anchor="middle" class="label">Pool</text>
    <text x="1030" y="310" text-anchor="middle" class="warn">30 Connections</text>
    <text x="1030" y="350" text-anchor="middle" class="detail">여기서 대기 가능</text>
  </g>

  <path d="M255 275 H315" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M570 275 H630" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M855 275 H915" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1030 395 V500 H447 V405" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="735" y="485" text-anchor="middle" class="warn">DB Connection 대기 → 응답 시간·메모리 증가</text>

  <g filter="url(#shadow)">
    <rect x="155" y="555" width="890" height="85" rx="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <text x="600" y="590" text-anchor="middle" class="label">Thread Pool을 500으로 늘려도 DB Connection이 30이면</text>
    <text x="600" y="620" text-anchor="middle" class="small">DB 처리량이 500으로 늘어나는 것은 아니다</text>
  </g>
</svg>
