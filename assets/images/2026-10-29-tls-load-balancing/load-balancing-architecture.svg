<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">로드 밸런서와 Spring Boot 인스턴스의 요청 분산</title>
  <desc id="desc">클라이언트 요청이 로드 밸런서를 거쳐 정상 상태인 Spring Boot 인스턴스 세 대로 분산되고 비정상 인스턴스는 제외되는 구조를 보여 준다. L4와 L7의 판단 기준과 헬스 체크도 표시한다.</desc>
  <style>
    .title { font: 700 30px Arial, sans-serif; fill: #1f2937; }
    .heading { font: 700 23px Arial, sans-serif; fill: #111827; }
    .label { font: 600 19px Arial, sans-serif; fill: #1f2937; }
    .small { font: 400 17px Arial, sans-serif; fill: #4b5563; }
    .tiny { font: 400 15px Arial, sans-serif; fill: #6b7280; }
  </style>
  <defs>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="700" y="48" text-anchor="middle" class="title">로드 밸런서는 기준에 따라 정상 인스턴스로 요청을 나눈다</text>

  <rect x="35" y="82" width="200" height="245" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <text x="135" y="125" text-anchor="middle" class="heading">클라이언트</text>
  <text x="135" y="170" text-anchor="middle" class="label">HTTP 요청</text>
  <text x="135" y="205" text-anchor="middle" class="small">여러 사용자의 요청</text>
  <text x="135" y="238" text-anchor="middle" class="small">Host · Path · Header</text>
  <line x1="235" y1="205" x2="385" y2="205" stroke="#2563eb" stroke-width="5" marker-end="url(#blue-arrow)"/>

  <rect x="385" y="82" width="370" height="245" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="570" y="125" text-anchor="middle" class="heading">로드 밸런서</text>
  <rect x="415" y="150" width="150" height="125" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="490" y="184" text-anchor="middle" class="label">L4 판단</text>
  <text x="490" y="214" text-anchor="middle" class="small">IP · Port</text>
  <text x="490" y="242" text-anchor="middle" class="small">TCP · UDP</text>
  <rect x="575" y="150" width="150" height="125" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="650" y="184" text-anchor="middle" class="label">L7 판단</text>
  <text x="650" y="214" text-anchor="middle" class="small">Host · Path</text>
  <text x="650" y="242" text-anchor="middle" class="small">Header</text>
  <line x1="755" y1="175" x2="900" y2="175" stroke="#059669" stroke-width="4" marker-end="url(#green-arrow)"/>
  <line x1="755" y1="235" x2="900" y2="235" stroke="#059669" stroke-width="4" marker-end="url(#green-arrow)"/>
  <line x1="755" y1="295" x2="900" y2="295" stroke="#059669" stroke-width="4" marker-end="url(#green-arrow)"/>

  <rect x="900" y="82" width="245" height="130" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
  <text x="1022" y="122" text-anchor="middle" class="heading">정상 인스턴스</text>
  <text x="1022" y="158" text-anchor="middle" class="label">Spring Boot A · B · C</text>
  <text x="1022" y="188" text-anchor="middle" class="small">요청을 처리한다</text>
  <rect x="900" y="260" width="245" height="130" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
  <text x="1022" y="300" text-anchor="middle" class="heading">비정상 인스턴스</text>
  <text x="1022" y="336" text-anchor="middle" class="label">Spring Boot D</text>
  <line x1="755" y1="355" x2="875" y2="355" stroke="#dc2626" stroke-width="4" stroke-dasharray="9 7"/>
  <line x1="858" y1="338" x2="882" y2="372" stroke="#dc2626" stroke-width="5"/>
  <line x1="882" y1="338" x2="858" y2="372" stroke="#dc2626" stroke-width="5"/>
  <text x="1022" y="375" text-anchor="middle" class="small">새 요청 분배에서 제외</text>
  <line x1="1022" y1="212" x2="1022" y2="260" stroke="#059669" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#green-arrow)"/>
  <text x="1210" y="315" text-anchor="start" class="tiny">헬스 체크 결과</text>

  <rect x="60" y="455" width="1280" height="235" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="700" y="495" text-anchor="middle" class="heading">헬스 체크 흐름</text>
  <line x1="210" y1="565" x2="430" y2="565" stroke="#059669" stroke-width="4" marker-end="url(#green-arrow)"/>
  <line x1="570" y1="565" x2="790" y2="565" stroke="#059669" stroke-width="4" marker-end="url(#green-arrow)"/>
  <line x1="930" y1="565" x2="1150" y2="565" stroke="#059669" stroke-width="4" marker-end="url(#green-arrow)"/>
  <rect x="95" y="525" width="115" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="152" y="558" text-anchor="middle" class="label">검사</text>
  <text x="152" y="584" text-anchor="middle" class="small">주기적 확인</text>
  <rect x="430" y="525" width="140" height="80" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="500" y="558" text-anchor="middle" class="label">정상</text>
  <text x="500" y="584" text-anchor="middle" class="small">분배 대상 포함</text>
  <rect x="790" y="525" width="140" height="80" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="860" y="558" text-anchor="middle" class="label">비정상</text>
  <text x="860" y="584" text-anchor="middle" class="small">새 요청 제외</text>
  <rect x="1150" y="525" width="140" height="80" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="1220" y="558" text-anchor="middle" class="label">회복 확인</text>
  <text x="1220" y="584" text-anchor="middle" class="small">다시 포함</text>
  <text x="700" y="650" text-anchor="middle" class="small">분산 알고리즘은 Round Robin · Weighted Round Robin · Least Connections · IP Hash처럼 선택할 수 있다</text>
</svg>
