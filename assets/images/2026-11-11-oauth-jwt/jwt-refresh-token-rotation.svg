<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
  <title id="title">Access Token 재발급과 Refresh Token Rotation</title>
  <desc id="desc">Access Token이 만료되면 Refresh Token R1을 서버가 검증하고 새 Access Token과 R2를 발급한 뒤 R1을 무효화하며 R1 재사용을 거부하는 흐름</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px Arial, "Malgun Gothic", sans-serif; fill: #0f172a; text-anchor: middle; }
      .subtitle { font: 500 17px Arial, "Malgun Gothic", sans-serif; fill: #64748b; text-anchor: middle; }
      .heading { font: 700 22px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .label { font: 700 16px Arial, "Malgun Gothic", sans-serif; fill: #475569; text-anchor: middle; }
      .body { font: 500 17px Arial, "Malgun Gothic", sans-serif; fill: #334155; }
      .small { font: 500 15px Arial, "Malgun Gothic", sans-serif; fill: #64748b; text-anchor: middle; }
      .mono { font: 600 18px Consolas, "Malgun Gothic", monospace; fill: #0f172a; }
      .card { fill: #ffffff; stroke-width: 2; rx: 22; }
      .request { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .success { stroke: #16a34a; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .danger { stroke: #dc2626; stroke-width: 4; fill: none; marker-end: url(#arrow-red); }
      .dashed { stroke-dasharray: 10 8; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect class="bg" width="1400" height="1040" rx="28" />
  <text class="title" x="700" y="58">Refresh Token Rotation은 이전 토큰을 폐기한다</text>
  <text class="subtitle" x="700" y="91">R1을 사용해 R2를 발급한 뒤, 다시 제출된 R1은 재사용으로 거부한다</text>

  <rect x="70" y="135" width="1260" height="400" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text class="heading" x="700" y="182" fill="#334155">정상적인 재발급 흐름</text>

  <rect class="card" x="110" y="245" width="270" height="150" stroke="#93c5fd" />
  <text class="heading" x="245" y="290" fill="#1d4ed8">Client</text>
  <text class="body" x="155" y="330">Access Token 만료</text>
  <text class="mono" x="155" y="365">Refresh Token: R1</text>

  <rect class="card" x="565" y="245" width="270" height="150" stroke="#c4b5fd" />
  <text class="heading" x="700" y="290" fill="#7c3aed">Auth Server</text>
  <text class="body" x="610" y="330">R1 유효성 검증</text>
  <text class="body" x="610" y="365">만료·폐기·재사용 확인</text>

  <rect class="card" x="1020" y="245" width="270" height="150" stroke="#86efac" />
  <text class="heading" x="1155" y="290" fill="#15803d">새 발급</text>
  <text class="mono" x="1070" y="330">Access Token: A2</text>
  <text class="mono" x="1070" y="365">Refresh Token: R2</text>

  <path class="request" d="M 385 320 L 555 320" />
  <text class="label" x="470" y="295">R1 제출</text>
  <path class="success" d="M 845 320 L 1010 320" />
  <text class="label" x="928" y="295" fill="#15803d">A2 + R2 발급</text>

  <path class="success dashed" d="M 1155 410 L 1155 470 L 245 470 L 245 410" />
  <text class="label" x="700" y="455" fill="#15803d">기존 R1은 Rotation 시점에 무효화</text>

  <rect x="70" y="600" width="1260" height="300" rx="26" fill="#fff7ed" stroke="#fdba74" stroke-width="2" />
  <text class="heading" x="700" y="648" fill="#c2410c">R1 재사용 시</text>

  <rect class="card" x="130" y="710" width="270" height="110" stroke="#fca5a5" />
  <text class="heading" x="265" y="755" fill="#b91c1c">공격자 또는 재사용</text>
  <text class="mono" x="265" y="790">Refresh Token: R1</text>

  <rect class="card" x="565" y="710" width="270" height="110" stroke="#fca5a5" />
  <text class="heading" x="700" y="755" fill="#b91c1c">서버 탐지</text>
  <text class="body" x="700" y="790" text-anchor="middle">이미 폐기된 R1</text>

  <rect class="card" x="1000" y="710" width="270" height="110" stroke="#fca5a5" />
  <text class="heading" x="1135" y="755" fill="#b91c1c">요청 거부</text>
  <text class="body" x="1135" y="790" text-anchor="middle">토큰군·세션 폐기 정책</text>

  <path class="danger" d="M 405 765 L 555 765" />
  <text class="label" x="480" y="740" fill="#b91c1c">재사용 제출</text>
  <path class="danger" d="M 845 765 L 990 765" />
  <text class="label" x="918" y="740" fill="#b91c1c">거부</text>

  <text class="small" x="700" y="965">새 토큰을 발급했다는 사실만으로 이전 토큰이 자동 무효화되지는 않는다</text>
  <text class="small" x="700" y="990">Rotation을 적용하려면 Refresh Token의 상태와 재사용 여부를 서버에서 관리해야 한다</text>
</svg>
