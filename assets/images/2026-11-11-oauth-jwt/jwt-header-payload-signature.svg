<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">JWT Header, Payload, Signature 구조</title>
  <desc id="desc">JWT 문자열을 Header, Payload, Signature 세 부분으로 나누고 각 부분의 역할과 Base64URL 인코딩 및 서명 검증을 설명하는 구조</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px Arial, "Malgun Gothic", sans-serif; fill: #0f172a; text-anchor: middle; }
      .subtitle { font: 500 17px Arial, "Malgun Gothic", sans-serif; fill: #64748b; text-anchor: middle; }
      .heading { font: 700 23px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; }
      .label { font: 700 16px Arial, "Malgun Gothic", sans-serif; fill: #475569; text-anchor: middle; }
      .body { font: 500 17px Arial, "Malgun Gothic", sans-serif; fill: #334155; }
      .small { font: 500 15px Arial, "Malgun Gothic", sans-serif; fill: #64748b; text-anchor: middle; }
      .mono { font: 600 18px Consolas, "Malgun Gothic", monospace; fill: #0f172a; }
      .card { fill: #ffffff; stroke-width: 2; rx: 22; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900" rx="28" />
  <text class="title" x="700" y="58">JWT는 Header.Payload.Signature로 나뉜다</text>
  <text class="subtitle" x="700" y="91">세 부분을 직접 대응해 보고, 디코딩과 검증을 다른 단계로 구분한다</text>

  <rect x="80" y="145" width="1240" height="180" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text class="label" x="700" y="182">JWT Compact Serialization</text>

  <rect x="115" y="215" width="350" height="60" rx="12" fill="#dbeafe" />
  <rect x="525" y="215" width="350" height="60" rx="12" fill="#fef3c7" />
  <rect x="935" y="215" width="350" height="60" rx="12" fill="#dcfce7" />
  <text class="mono" x="135" y="252">eyJhbGciOiJIUzI1NiJ9</text>
  <text class="mono" x="545" y="252">eyJzdWIiOiIxMjM0NSJ9</text>
  <text class="mono" x="955" y="252">SflKxwRJSMeKKF2QT4fwp</text>
  <text class="heading" x="495" y="252" fill="#7c3aed">.</text>
  <text class="heading" x="905" y="252" fill="#7c3aed">.</text>
  <text class="label" x="290" y="305" fill="#1d4ed8">Header</text>
  <text class="label" x="700" y="305" fill="#a16207">Payload</text>
  <text class="label" x="1110" y="305" fill="#15803d">Signature</text>

  <rect class="card" x="80" y="365" width="380" height="330" stroke="#93c5fd" />
  <text class="heading" x="270" y="420" fill="#1d4ed8">Header</text>
  <text class="label" x="270" y="455">메타데이터</text>
  <rect x="125" y="485" width="290" height="100" rx="16" fill="#dbeafe" />
  <text class="mono" x="150" y="525">{ "alg": "HS256",</text>
  <text class="mono" x="150" y="560">  "typ": "JWT" }</text>
  <text class="small" x="270" y="635">서명 알고리즘과 토큰 유형을 표시</text>
  <text class="small" x="270" y="660">허용 목록과 검증 키는</text>
  <text class="small" x="270" y="682">서버에서 관리</text>

  <rect class="card" x="510" y="365" width="380" height="330" stroke="#facc15" />
  <text class="heading" x="700" y="420" fill="#a16207">Payload</text>
  <text class="label" x="700" y="455">Claim 집합</text>
  <rect x="555" y="485" width="290" height="100" rx="16" fill="#fef3c7" />
  <text class="mono" x="580" y="525">{ "sub": "12345",</text>
  <text class="mono" x="580" y="560">  "iss": "auth", "exp": ... }</text>
  <text class="small" x="700" y="635">사용자 식별자와 만료 시각을 포함</text>
  <text class="small" x="700" y="660">Base64URL로 디코딩 가능</text>
  <text class="small" x="700" y="682">민감정보를 넣지 않음</text>

  <rect class="card" x="940" y="365" width="380" height="330" stroke="#86efac" />
  <text class="heading" x="1130" y="420" fill="#15803d">Signature</text>
  <text class="label" x="1130" y="455">서명 검증값</text>
  <rect x="985" y="485" width="290" height="100" rx="16" fill="#dcfce7" />
  <text class="mono" x="1010" y="525">Sign(</text>
  <text class="mono" x="1010" y="560">  Header + Payload, key)</text>
  <text class="small" x="1130" y="635">내용이 바뀌지 않았는지 검증</text>
  <text class="small" x="1130" y="660">서명 또는 MAC을 검증</text>
  <text class="small" x="1130" y="682">기밀성을 제공하지 않음</text>

  <rect x="140" y="755" width="1120" height="70" rx="18" fill="#ede9fe" />
  <text class="label" x="700" y="785" fill="#7c3aed">검증 순서</text>
  <text class="small" x="700" y="810">서명 알고리즘·키 확인 → Signature 검증 → iss·aud·exp 등 Claim 검증 → API 권한 검사</text>
</svg>
