<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">READ COMMITTED와 REPEATABLE READ의 스냅샷 기준</title>
  <desc id="desc">BEGIN과 첫 조회 시점을 구분하고 T1의 첫 조회 뒤 T2가 커밋한 변경을 T1이 재조회할 때 READ COMMITTED는 새 값을 보고 REPEATABLE READ는 첫 스냅샷의 값을 보는 흐름을 비교한다.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3578c4"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b8a68"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c47a16"/></marker>
  </defs>
  <rect width="1500" height="980" fill="#f8fafc"/>
  <text x="48" y="52" fill="#1f2937" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="30" font-weight="700">BEGIN의 시점과 스냅샷의 기준은 같은 사건이 아니다</text>
  <text x="48" y="86" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="16">공통 흐름: T1의 첫 조회 뒤 T2가 이름을 변경하고 커밋한 다음 T1이 같은 행을 다시 조회한다.</text>

  <rect x="48" y="116" width="1404" height="116" rx="14" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/>
  <text x="76" y="150" fill="#475569" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="16" font-weight="700">스냅샷을 정하는 기준</text>
  <rect x="76" y="170" width="256" height="38" rx="9" fill="#eef5ff" stroke="#3578c4" stroke-width="2"/>
  <text x="204" y="195" text-anchor="middle" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">T1: BEGIN</text>
  <line x1="350" y1="189" x2="408" y2="189" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="426" y="170" width="330" height="38" rx="9" fill="#fff7e8" stroke="#c47a16" stroke-width="2"/>
  <text x="591" y="195" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">BEGIN만으로 RR 스냅샷 확정 X</text>
  <line x1="774" y1="189" x2="832" y2="189" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="850" y="170" width="574" height="38" rx="9" fill="#e9f7f0" stroke="#2b8a68" stroke-width="2"/>
  <text x="1137" y="195" text-anchor="middle" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">첫 조회 또는 첫 변경 문장이 스냅샷 기준을 정함</text>

  <rect x="48" y="266" width="672" height="632" rx="16" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/>
  <rect x="48" y="266" width="672" height="70" rx="16" fill="#eef5ff"/><rect x="48" y="320" width="672" height="16" fill="#eef5ff"/>
  <text x="82" y="309" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="23" font-weight="700">READ COMMITTED</text>
  <text x="82" y="368" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">각 문장이 시작할 때의 스냅샷을 사용</text>

  <line x1="128" y1="426" x2="650" y2="426" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="128" y="410" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13">시간 흐름</text>
  <circle cx="160" cy="426" r="9" fill="#3578c4"/><circle cx="330" cy="426" r="9" fill="#3578c4"/><circle cx="500" cy="426" r="9" fill="#c47a16"/><circle cx="642" cy="426" r="9" fill="#2b8a68"/>
  <text x="160" y="462" text-anchor="middle" fill="#1f2937" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700">T1 BEGIN</text>
  <text x="160" y="486" text-anchor="middle" fill="#475569" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13">아직 조회 없음</text>
  <text x="330" y="462" text-anchor="middle" fill="#1f2937" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700">T1 첫 SELECT</text>
  <text x="330" y="486" text-anchor="middle" fill="#475569" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13">'달빛국수'</text>
  <text x="500" y="462" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700">T2 UPDATE + COMMIT</text>
  <text x="500" y="486" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13">'달빛면옥' 확정</text>
  <text x="642" y="462" text-anchor="middle" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700">T1 재조회</text>
  <text x="642" y="486" text-anchor="middle" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13">'달빛면옥'</text>

  <rect x="100" y="548" width="568" height="126" rx="12" fill="#fff7e8" stroke="#c47a16" stroke-width="2"/>
  <text x="384" y="584" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700">재조회는 새로운 문장</text>
  <text x="384" y="614" text-anchor="middle" fill="#475569" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">T2의 커밋 이후 시작한 스냅샷을 참조</text>
  <text x="384" y="642" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">같은 행의 값이 달라질 수 있음</text>

  <rect x="780" y="266" width="672" height="632" rx="16" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/>
  <rect x="780" y="266" width="672" height="70" rx="16" fill="#e9f7f0"/><rect x="780" y="320" width="672" height="16" fill="#e9f7f0"/>
  <text x="814" y="309" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="23" font-weight="700">REPEATABLE READ</text>
  <text x="814" y="368" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">첫 조회 또는 첫 변경 문장의 스냅샷을 유지</text>

  <line x1="860" y1="426" x2="1382" y2="426" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="860" y="410" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13">시간 흐름</text>
  <circle cx="892" cy="426" r="9" fill="#3578c4"/><circle cx="1062" cy="426" r="9" fill="#3578c4"/><circle cx="1232" cy="426" r="9" fill="#c47a16"/><circle cx="1374" cy="426" r="9" fill="#2b8a68"/>
  <text x="892" y="462" text-anchor="middle" fill="#1f2937" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700">T1 BEGIN</text>
  <text x="892" y="486" text-anchor="middle" fill="#475569" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13">아직 조회 없음</text>
  <text x="1062" y="462" text-anchor="middle" fill="#1f2937" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700">T1 첫 SELECT</text>
  <text x="1062" y="486" text-anchor="middle" fill="#475569" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13">'달빛국수'로 스냅샷 확정</text>
  <text x="1232" y="462" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700">T2 UPDATE + COMMIT</text>
  <text x="1232" y="486" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13">'달빛면옥' 확정</text>
  <text x="1374" y="462" text-anchor="middle" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700">T1 재조회</text>
  <text x="1374" y="486" text-anchor="middle" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13">'달빛국수'</text>

  <rect x="832" y="548" width="568" height="126" rx="12" fill="#eef5ff" stroke="#3578c4" stroke-width="2"/>
  <text x="1116" y="584" text-anchor="middle" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700">재조회도 같은 스냅샷</text>
  <text x="1116" y="614" text-anchor="middle" fill="#475569" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">T2가 뒤에서 커밋한 변경을 새로 반영하지 않음</text>
  <text x="1116" y="642" text-anchor="middle" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">같은 행의 값이 유지됨</text>

  <text x="750" y="946" text-anchor="middle" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">이름보다 첫 조회 또는 첫 변경 문장이 언제 시작됐는지부터 확인한다.</text>
</svg>
