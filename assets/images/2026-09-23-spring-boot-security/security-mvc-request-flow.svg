<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1740" role="img" aria-labelledby="title desc">
  <title id="title">JWT 기반 Spring Security와 Spring MVC 요청 흐름</title>
  <desc id="desc">Client 요청이 Servlet Container, Security Filter Chain, JWT 검증, Authentication, SecurityContext, Authorization을 거쳐 DispatcherServlet과 Spring MVC Controller로 이어지는 흐름</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff" />
      <stop offset="1" stop-color="#edf4fb" />
    </linearGradient>
    <linearGradient id="security" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb" />
      <stop offset="1" stop-color="#635bdb" />
    </linearGradient>
    <linearGradient id="mvc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f9f95" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7186a3" />
    </marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .title { font-size: 36px; font-weight: 750; fill: #10243e; }
      .sub { font-size: 18px; fill: #52657e; }
      .section { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #58708e; }
      .label { font-size: 22px; font-weight: 700; fill: #172b46; }
      .detail { font-size: 16px; fill: #51647d; }
      .small { font-size: 14px; fill: #60738d; }
      .pill { font-size: 15px; font-weight: 650; fill: #21466f; }
      .note { font-size: 16px; fill: #6a4d12; }
      .inverse { fill: #ffffff; }
      .node { fill: #ffffff; stroke: #d5e0ed; stroke-width: 2; }
      .security-node { fill: #f3f1ff; stroke: #cfc9f3; stroke-width: 2; }
      .mvc-node { fill: #effaf7; stroke: #bce8dc; stroke-width: 2; }
      .flow { fill: none; stroke: #8497af; stroke-width: 3; marker-end: url(#arrow); }
      .divider { stroke: #d5e0ed; stroke-width: 2; stroke-dasharray: 7 8; }
    </style>
  </defs>

  <rect width="1200" height="1740" rx="30" fill="url(#background)" />
  <text x="600" y="68" text-anchor="middle" class="title">JWT 기반 요청 처리 흐름</text>
  <text x="600" y="103" text-anchor="middle" class="sub">Spring Security가 인증·인가를 거쳐 Spring MVC로 요청을 넘기는 과정</text>

  <rect x="90" y="128" width="1020" height="1510" rx="28" fill="#ffffff" stroke="#c9d7e8" stroke-width="2" />
  <rect x="90" y="128" width="1020" height="58" rx="28" fill="#eaf1fa" />
  <path d="M90 158 Q90 128 120 128 H1080 Q1110 128 1110 158 V186 H90 Z" fill="#eaf1fa" />
  <circle cx="129" cy="157" r="8" fill="#2563eb" />
  <text x="152" y="163" class="section">HTTP REQUEST → SECURITY → SPRING MVC</text>

  <rect x="300" y="214" width="600" height="82" rx="17" class="node" />
  <text x="600" y="249" text-anchor="middle" class="label">Client</text>
  <text x="600" y="278" text-anchor="middle" class="detail">Authorization Header에 JWT를 포함한 요청</text>
  <path d="M600 299 V332" class="flow" />

  <rect x="300" y="342" width="600" height="82" rx="17" class="node" />
  <text x="600" y="377" text-anchor="middle" class="label">Servlet Container</text>
  <text x="600" y="406" text-anchor="middle" class="detail">Filter와 Servlet이 요청을 처리하는 실행 환경</text>
  <path d="M600 427 V460" class="flow" />

  <rect x="170" y="470" width="860" height="500" rx="22" class="security-node" />
  <rect x="170" y="470" width="860" height="62" rx="22" fill="url(#security)" />
  <path d="M170 502 Q170 470 202 470 H998 Q1030 470 1030 502 V532 H170 Z" fill="url(#security)" />
  <text x="600" y="510" text-anchor="middle" class="label inverse">Security Filter Chain</text>

  <rect x="280" y="568" width="640" height="76" rx="16" fill="#ffffff" stroke="#d5d0f3" stroke-width="2" />
  <text x="600" y="601" text-anchor="middle" class="label">JWT 서명 및 만료 검증</text>
  <text x="600" y="628" text-anchor="middle" class="detail">토큰에 값이 있다는 이유만으로 신뢰하지 않는다</text>
  <path d="M600 646 V674" class="flow" />

  <rect x="280" y="684" width="640" height="76" rx="16" fill="#ffffff" stroke="#d5d0f3" stroke-width="2" />
  <text x="600" y="717" text-anchor="middle" class="label">Authentication 생성</text>
  <text x="600" y="744" text-anchor="middle" class="detail">검증된 사용자 정보와 authorities를 인증 객체로 구성</text>
  <path d="M600 762 V790" class="flow" />

  <rect x="280" y="800" width="640" height="76" rx="16" fill="#ffffff" stroke="#d5d0f3" stroke-width="2" />
  <text x="600" y="833" text-anchor="middle" class="label">SecurityContext에 Authentication 저장</text>
  <text x="600" y="860" text-anchor="middle" class="detail">SecurityContextHolder를 통해 현재 실행 흐름에서 접근</text>
  <path d="M600 878 V906" class="flow" />

  <rect x="280" y="916" width="640" height="34" rx="17" fill="#e7e3ff" />
  <text x="600" y="939" text-anchor="middle" class="pill">Authorization · authorities를 기준으로 요청 허용 여부 판단</text>
  <path d="M600 972 V1005" class="flow" />

  <rect x="300" y="1015" width="600" height="82" rx="17" fill="url(#mvc)" />
  <text x="600" y="1050" text-anchor="middle" class="label inverse">DispatcherServlet</text>
  <text x="600" y="1079" text-anchor="middle" class="detail inverse">보안 검사를 통과한 요청의 MVC 흐름을 조정</text>
  <path d="M600 1100 V1133" class="flow" />

  <rect x="220" y="1143" width="760" height="360" rx="22" class="mvc-node" />
  <text x="600" y="1182" text-anchor="middle" class="label">Spring MVC</text>

  <rect x="310" y="1210" width="580" height="54" rx="14" fill="#ffffff" stroke="#bce8dc" stroke-width="2" />
  <text x="600" y="1244" text-anchor="middle" class="label">HandlerMapping · Handler 탐색</text>
  <path d="M600 1266 V1285" class="flow" />

  <rect x="310" y="1295" width="580" height="54" rx="14" fill="#ffffff" stroke="#bce8dc" stroke-width="2" />
  <text x="600" y="1329" text-anchor="middle" class="label">HandlerAdapter · Handler 실행 지원</text>
  <path d="M600 1351 V1370" class="flow" />

  <rect x="310" y="1380" width="580" height="54" rx="14" fill="#ffffff" stroke="#bce8dc" stroke-width="2" />
  <text x="600" y="1414" text-anchor="middle" class="label">ArgumentResolver / HttpMessageConverter</text>
  <path d="M600 1436 V1455" class="flow" />

  <rect x="350" y="1465" width="500" height="54" rx="14" fill="#d8f4eb" stroke="#9fddce" stroke-width="2" />
  <text x="600" y="1499" text-anchor="middle" class="label">Controller</text>

  <line x1="130" y1="1555" x2="1070" y2="1555" class="divider" />
  <text x="600" y="1586" text-anchor="middle" class="note">Filter 수준의 보안 검사를 통과한 뒤 DispatcherServlet과 Spring MVC 흐름으로 들어간다.</text>
</svg>
