<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">count++에서 발생하는 Race Condition</title>
  <desc id="desc">Thread A와 Thread B가 count를 각각 읽고 1을 더한 뒤 저장하면서, 두 번 증가했지만 최종 값이 1이 되는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
  </defs>
  <style>
    text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #24344a; }
    .title { font-size: 32px; font-weight: 700; }
    .heading { font-size: 24px; font-weight: 700; }
    .body { font-size: 21px; }
    .small { font-size: 18px; fill: #53647a; }
    .code { font-family: Consolas, "Liberation Mono", monospace; font-size: 22px; }
    .lane { fill: #eef4fd; stroke: #c4d5ed; stroke-width: 2; }
    .shared { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; }
    .step { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <rect width="1200" height="650" rx="20" fill="#f8fafc"/>
  <text x="48" y="58" class="title">count++는 읽기 · 수정 · 쓰기로 나뉜다</text>
  <text x="48" y="94" class="body">두 Thread의 실행이 겹치면 같은 값을 읽고, 나중에 저장한 결과가 앞선 증가를 덮어쓸 수 있다.</text>

  <rect x="48" y="132" width="1104" height="112" rx="16" class="shared"/>
  <text x="78" y="174" class="heading">공유 상태</text>
  <text x="78" y="215" class="code">count = 0</text>
  <text x="380" y="178" class="small">두 번 증가하면 기대값은 2</text>
  <text x="380" y="215" class="small">하지만 각 Thread가 0을 읽으면 결과가 겹친다</text>

  <rect x="48" y="286" width="500" height="276" rx="16" class="lane"/>
  <rect x="652" y="286" width="500" height="276" rx="16" class="lane"/>
  <text x="298" y="326" text-anchor="middle" class="heading">Thread A</text>
  <text x="902" y="326" text-anchor="middle" class="heading">Thread B</text>

  <rect x="102" y="356" width="392" height="54" rx="10" class="step"/>
  <text x="298" y="390" text-anchor="middle" class="body">count 읽기 → 0</text>
  <path d="M298 414 V442" class="arrow"/>
  <rect x="102" y="448" width="392" height="54" rx="10" class="step"/>
  <text x="298" y="482" text-anchor="middle" class="body">0 + 1 → 1 저장</text>

  <rect x="706" y="356" width="392" height="54" rx="10" class="step"/>
  <text x="902" y="390" text-anchor="middle" class="body">count 읽기 → 0</text>
  <path d="M902 414 V442" class="arrow"/>
  <rect x="706" y="448" width="392" height="54" rx="10" class="step"/>
  <text x="902" y="482" text-anchor="middle" class="body">0 + 1 → 1 저장</text>

  <rect x="244" y="590" width="712" height="42" rx="21" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
  <text x="600" y="617" text-anchor="middle" class="body">최종 count = 1 · Race Condition</text>
</svg>
