<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">JVM Stack과 Heap의 객체 생명주기</title>
  <desc id="desc">Thread가 JVM Stack의 Stack Frame을 실행하고, frame 안의 count와 두 참조 변수 user1, user2가 Heap의 동일한 User 객체를 가리키는 구조. 오른쪽에는 Method Area의 클래스 수준 정보가 표시되어 있다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <style>
    .title { fill: #0f172a; font: 700 28px "Segoe UI", "Malgun Gothic", Arial, sans-serif; }
    .heading { fill: #0f172a; font: 700 23px "Segoe UI", "Malgun Gothic", Arial, sans-serif; }
    .label { fill: #0f172a; font: 600 20px "Segoe UI", "Malgun Gothic", Arial, sans-serif; }
    .body { fill: #334155; font: 18px "Segoe UI", "Malgun Gothic", Arial, sans-serif; }
    .note { fill: #475569; font: 16px "Segoe UI", "Malgun Gothic", Arial, sans-serif; }
    .frame { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; rx: 16; }
    .heap { fill: #ecfdf5; stroke: #059669; stroke-width: 3; rx: 16; }
    .method { fill: #fff7ed; stroke: #ea580c; stroke-width: 3; rx: 16; }
    .inner { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 10; }
    .line { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .ref-line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#blue-arrow); }
    .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 7 7; }
  </style>

  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">참조 변수와 실제 객체의 생명주기</text>

  <text x="72" y="112" class="heading">Thread</text>
  <path d="M130 106 H180" class="line"/>

  <rect x="180" y="82" width="470" height="445" class="frame"/>
  <text x="415" y="122" text-anchor="middle" class="heading">JVM Stack</text>
  <rect x="220" y="152" width="390" height="325" class="inner"/>
  <text x="415" y="190" text-anchor="middle" class="label">Stack Frame: createUser()</text>

  <text x="260" y="250" class="label">count</text>
  <text x="555" y="250" text-anchor="end" class="body">= 1</text>
  <line x1="250" y1="275" x2="580" y2="275" class="divider"/>
  <text x="260" y="322" class="label">user1</text>
  <text x="260" y="405" class="label">user2</text>
  <path d="M340 315 C460 315, 680 315, 810 315" class="ref-line"/>
  <path d="M340 398 C490 398, 680 375, 810 350" class="ref-line"/>
  <text x="260" y="455" class="note">지역 참조 변수</text>

  <rect x="760" y="205" width="285" height="240" class="heap"/>
  <text x="902" y="245" text-anchor="middle" class="heading">Heap</text>
  <rect x="810" y="285" width="185" height="105" class="inner"/>
  <text x="902" y="320" text-anchor="middle" class="label">User 객체</text>
  <text x="902" y="355" text-anchor="middle" class="body">name = "woolam"</text>

  <rect x="760" y="500" width="340" height="125" class="method"/>
  <text x="930" y="538" text-anchor="middle" class="heading">Method Area</text>
  <text x="930" y="573" text-anchor="middle" class="body">Class metadata · method information</text>
  <text x="930" y="600" text-anchor="middle" class="body">static / class-level information</text>

  <path d="M650 270 H735 V250" class="line"/>
  <text x="682" y="228" text-anchor="middle" class="note">참조값</text>
  <path d="M650 452 H760 V500" class="line"/>
  <text x="680" y="480" text-anchor="middle" class="note">클래스 수준 정보</text>

  <text x="600" y="670" text-anchor="middle" class="note">Frame은 메서드 호출과 함께 사라지지만, 객체는 도달 가능성에 따라 GC 대상이 된다</text>
</svg>
