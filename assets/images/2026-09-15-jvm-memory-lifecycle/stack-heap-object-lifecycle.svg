<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">참조는 둘, User 객체는 하나</title>
  <desc id="desc">한 스레드의 JVM Stack 프레임에 있는 user1과 user2가 Heap의 같은 User 객체를 참조한다. User 객체의 name 필드는 문자열 woolam을 참조한다. Heap과 Method Area는 스레드가 공유한다. 메서드 실행이 끝나면 프레임이 제거되지만 객체는 GC 루트에서 도달할 수 없을 때 GC 대상이 된다. 지역 변수와 참조 관계에 초점을 맞춘 논리적 모델이다.</desc>
  <defs>
    <marker id="reference" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#3b68b1"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #24344a; }
    .title { font-size: 32px; font-weight: 700; }
    .heading { font-size: 25px; font-weight: 700; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #53647a; }
    .code { font-family: Consolas, "Liberation Mono", monospace; font-size: 22px; }
    .ref { fill: none; stroke: #3b68b1; stroke-width: 3; marker-end: url(#reference); }
  </style>
  <rect width="1200" height="880" rx="20" fill="#f8fafc"/>
  <text x="48" y="62" class="title">참조는 둘, User 객체는 하나</text>
  <text x="48" y="100" class="body">user2 = user1은 객체를 복제하지 않고, 같은 객체를 가리키는 참조를 복사한다.</text>

  <rect x="48" y="142" width="410" height="390" rx="18" fill="#eef4fd" stroke="#c4d5ed"/>
  <text x="76" y="185" class="heading">JVM Stack</text>
  <text x="76" y="216" class="small">스레드마다 별도로 관리</text>
  <rect x="76" y="244" width="354" height="258" rx="12" fill="#fff" stroke="#c4d5ed"/>
  <text x="100" y="282" class="body" font-weight="700">실행 중인 메서드의 프레임</text>
  <line x1="100" y1="302" x2="406" y2="302" stroke="#e1e8f0"/>
  <text x="100" y="340" class="code">count</text>
  <text x="330" y="340" class="code">1</text>
  <text x="100" y="395" class="code">user1</text>
  <rect x="285" y="368" width="110" height="38" rx="7" fill="#eef4fd"/>
  <text x="340" y="394" text-anchor="middle" class="small">참조값</text>
  <text x="100" y="460" class="code">user2</text>
  <rect x="285" y="433" width="110" height="38" rx="7" fill="#eef4fd"/>
  <text x="340" y="459" text-anchor="middle" class="small">참조값</text>

  <rect x="600" y="142" width="552" height="390" rx="18" fill="#eef8f4" stroke="#bcddce"/>
  <text x="628" y="185" class="heading">Heap</text>
  <text x="628" y="216" class="small">모든 스레드가 공유 · 객체와 배열</text>
  <rect x="636" y="282" width="225" height="154" rx="12" fill="#fff" stroke="#8ebaa7" stroke-width="2"/>
  <text x="748" y="325" text-anchor="middle" class="heading">User 객체</text>
  <line x1="660" y1="344" x2="837" y2="344" stroke="#dcebe3"/>
  <text x="663" y="389" class="code">name</text>
  <circle cx="826" cy="382" r="5" fill="#3b68b1"/>
  <rect x="924" y="340" width="200" height="96" rx="12" fill="#fff" stroke="#bcddce"/>
  <text x="1024" y="372" text-anchor="middle" class="small">String 객체</text>
  <text x="1024" y="408" text-anchor="middle" class="code">"woolam"</text>
  <path d="M832 382 H917" class="ref"/>
  <text x="636" y="484" class="small">두 지역 변수가 같은 User 객체를 참조한다.</text>
  <path d="M395 387 H496 Q512 387 512 371 V326 Q512 310 528 310 H628" class="ref"/>
  <path d="M395 452 H548 Q564 452 564 436 V392 Q564 376 580 376 H628" class="ref"/>

  <rect x="48" y="560" width="1104" height="112" rx="16" fill="#fff" stroke="#d6dee8"/>
  <text x="76" y="606" class="heading">Method Area</text>
  <text x="76" y="640" class="small">모든 스레드가 공유</text>
  <line x1="329" y1="584" x2="329" y2="648" stroke="#d6dee8"/>
  <text x="365" y="606" class="body">클래스 구조 · 메서드 정보 · 런타임 상수 풀</text>
  <text x="365" y="640" class="small">개별 User 객체의 상태와 구분되는 클래스 수준 정보</text>

  <text x="48" y="727" class="heading">메서드 실행이 끝나면?</text>
  <text x="48" y="766" class="body">프레임은 제거된다. 객체가 곧바로 사라지는 것은 아니다.</text>
  <text x="48" y="801" class="body">객체는 GC 루트에서 더 이상 도달할 수 없을 때 GC 대상이 된다.</text>
  <text x="48" y="851" class="small">지역 변수와 참조 관계를 단순화한 논리적 모델 · 실제 메모리 배치를 뜻하지 않음</text>
</svg>
