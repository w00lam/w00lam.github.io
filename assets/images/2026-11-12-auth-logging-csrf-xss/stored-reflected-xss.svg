<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Stored XSS와 Reflected XSS 비교</title>
  <desc id="desc">Stored XSS는 공격자 입력이 서버에 저장된 뒤 다른 사용자의 조회 응답에 포함되고 Reflected XSS는 요청 입력이 저장되지 않은 채 현재 응답에 반영되는 흐름</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; } .title { font: 700 31px Arial, "Malgun Gothic", sans-serif; fill: #0f172a; text-anchor: middle; } .subtitle { font: 500 17px Arial, "Malgun Gothic", sans-serif; fill: #64748b; text-anchor: middle; }
      .heading { font: 700 23px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; } .node { font: 700 18px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; } .body { font: 500 15px Arial, "Malgun Gothic", sans-serif; fill: #334155; text-anchor: middle; } .small { font: 500 14px Arial, "Malgun Gothic", sans-serif; fill: #64748b; text-anchor: middle; } .box { fill: #fff; stroke-width: 2; rx: 18; } .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 2; rx: 22; }
      .arrow { fill: none; stroke-width: 4; stroke: #dc2626; stroke-dasharray: 14 8; marker-end: url(#red); } .safe { stroke: #16a34a; } .rule { stroke: #cbd5e1; stroke-width: 2; }
      @media (prefers-color-scheme: dark) { .bg { fill: #0f172a; } .box, .panel { fill: #111827; stroke: #334155; } .title { fill: #f8fafc; } .subtitle, .small { fill: #cbd5e1; } .body { fill: #e2e8f0; } }
    </style>
    <marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626" /></marker>
    <marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a" /></marker>
  </defs>
  <rect class="bg" width="1400" height="780" rx="28" />
  <text class="title" x="700" y="58">Stored XSS와 Reflected XSS</text>
  <text class="subtitle" x="700" y="91">저장 여부와 악성 입력이 응답에 들어오는 경로가 다르다</text>
  <rect class="panel" x="55" y="135" width="620" height="500" /><rect class="panel" x="725" y="135" width="620" height="500" />
  <text class="heading" x="365" y="185" fill="#b91c1c">Stored XSS</text><text class="small" x="365" y="214">입력이 서버에 저장된 뒤 다른 조회에 포함됨</text>
  <text class="heading" x="1035" y="185" fill="#b91c1c">Reflected XSS</text><text class="small" x="1035" y="214">요청 입력이 현재 응답에 바로 반영됨</text>
  <rect class="box" x="100" y="260" width="180" height="85" stroke="#fca5a5" /><text class="node" x="190" y="295" fill="#b91c1c">공격자 입력</text><text class="small" x="190" y="322">게시글·댓글 등</text>
  <rect class="box" x="340" y="260" width="180" height="85" stroke="#fcd34d" /><text class="node" x="430" y="295" fill="#a16207">서버 저장소</text><text class="small" x="430" y="322">콘텐츠 보관</text>
  <rect class="box" x="220" y="425" width="260" height="85" stroke="#86efac" /><text class="node" x="350" y="460" fill="#15803d">다른 사용자 브라우저</text><text class="small" x="350" y="487">콘텐츠 조회</text>
  <line class="arrow" x1="280" y1="302" x2="340" y2="302" /><line class="arrow" x1="430" y1="345" x2="350" y2="425" />
  <text class="small" x="310" y="285" fill="#b91c1c">저장</text><text class="small" x="415" y="390" fill="#b91c1c">조회 응답에 포함</text>
  <rect class="box" x="770" y="260" width="180" height="85" stroke="#fca5a5" /><text class="node" x="860" y="295" fill="#b91c1c">준비된 요청</text><text class="small" x="860" y="322">공격자 링크 등</text>
  <rect class="box" x="1010" y="260" width="180" height="85" stroke="#fcd34d" /><text class="node" x="1100" y="295" fill="#a16207">서버</text><text class="small" x="1100" y="322">입력을 응답에 반영</text>
  <rect class="box" x="890" y="425" width="260" height="85" stroke="#86efac" /><text class="node" x="1020" y="460" fill="#15803d">피해자 브라우저</text><text class="small" x="1020" y="487">현재 응답 수신</text>
  <line class="arrow" x1="950" y1="302" x2="1010" y2="302" /><line class="arrow" x1="1100" y1="345" x2="1020" y2="425" />
  <text class="small" x="980" y="285" fill="#b91c1c">요청</text><text class="small" x="1080" y="390" fill="#b91c1c">현재 응답에 반영</text>
  <line class="rule" x1="120" y1="555" x2="610" y2="555" /><line class="rule" x1="790" y1="555" x2="1280" y2="555" />
  <text class="body" x="365" y="590">취약한 출력 처리에서 실행 가능한 문맥이 만들어질 때 문제</text><text class="body" x="1035" y="590">입력이 저장되지 않아도 응답 문맥에서 실행될 수 있음</text>
  <text class="small" x="700" y="700">입력이 있다는 사실만으로 실행되는 것은 아니다. 출력 문맥과 방어 상태를 함께 확인해야 한다.</text>
  <text class="small" x="700" y="730">단순 텍스트는 안전한 DOM API로 출력하고, HTML이 필요하면 적절한 Sanitization을 적용한다.</text>
</svg>
