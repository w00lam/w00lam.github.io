<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">CSRF 공격 흐름과 CSRF Token 검증</title>
  <desc id="desc">사용자가 대상 서버에 로그인한 뒤 공격자 사이트가 피해자의 브라우저를 통해 대상 서버로 요청을 유도하고 Cookie 전송 조건과 CSRF Token 검증에 따라 처리 결과가 달라지는 흐름</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; } .title { font: 700 31px Arial, "Malgun Gothic", sans-serif; fill: #0f172a; text-anchor: middle; } .subtitle { font: 500 17px Arial, "Malgun Gothic", sans-serif; fill: #64748b; text-anchor: middle; }
      .node { font: 700 20px Arial, "Malgun Gothic", sans-serif; text-anchor: middle; } .body { font: 500 15px Arial, "Malgun Gothic", sans-serif; fill: #334155; text-anchor: middle; } .small { font: 500 14px Arial, "Malgun Gothic", sans-serif; fill: #64748b; text-anchor: middle; } .label { font: 700 14px Arial, "Malgun Gothic", sans-serif; fill: #475569; text-anchor: middle; }
      .box { fill: #fff; stroke-width: 2; rx: 18; } .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 2; rx: 22; }
      .flow { fill: none; stroke-width: 4; stroke-dasharray: 15 9; animation: dash 2.3s linear infinite; } .packet { opacity: 0; animation: packet-opacity 9s linear infinite; } .packet.cookie { animation-delay: 2.3s; } .packet.attack { animation-delay: 4.6s; } .packet.safe { opacity: 1; animation: pulse 1.8s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -48; } } @keyframes packet-opacity { 0%, 6% { opacity: 0; } 12%, 25% { opacity: 1; } 33%, 100% { opacity: 0; } } @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .flow, .packet { animation: none !important; } .packet { display: none; } }
      @media (prefers-color-scheme: dark) { .bg { fill: #0f172a; } .box, .panel { fill: #111827; stroke: #334155; } .title { fill: #f8fafc; } .subtitle, .small { fill: #cbd5e1; } .body, .label { fill: #e2e8f0; } }
    </style>
    <marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb" /></marker>
    <marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626" /></marker>
    <marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a" /></marker>
  </defs>
  <rect class="bg" width="1400" height="860" rx="28" />
  <text class="title" x="700" y="58">CSRF 공격 흐름</text>
  <text class="subtitle" x="700" y="91">공격자는 Cookie 값을 읽지 않아도 피해자의 브라우저가 요청하도록 유도할 수 있다</text>

  <rect class="box" x="70" y="165" width="230" height="150" stroke="#93c5fd" /><text class="node" x="185" y="215" fill="#1d4ed8">User</text><text class="body" x="185" y="252">대상 서버에 로그인</text><text class="small" x="185" y="282">정상 사용자의 권한 보유</text>
  <rect class="box" x="390" y="165" width="250" height="150" stroke="#93c5fd" /><text class="node" x="515" y="215" fill="#1d4ed8">Browser</text><text class="body" x="515" y="252">Authentication Cookie</text><text class="small" x="515" y="282">Cookie 값을 공격자에게 공개하지 않음</text>
  <rect class="box" x="760" y="165" width="250" height="150" stroke="#fca5a5" /><text class="node" x="885" y="215" fill="#b91c1c">Attacker Site</text><text class="body" x="885" y="252">상태 변경 요청 유도</text><text class="small" x="885" y="282">피해자의 브라우저를 이용</text>
  <rect class="box" x="1120" y="165" width="230" height="150" stroke="#86efac" /><text class="node" x="1235" y="215" fill="#15803d">Target Server</text><text class="body" x="1235" y="252">Cookie와 Token 검증</text><text class="small" x="1235" y="282">요청 처리 또는 거부</text>
  <line x1="300" y1="240" x2="390" y2="240" class="flow" stroke="#2563eb" marker-end="url(#blue)" /><path d="M640 240V125H1120V240" class="flow" stroke="#16a34a" fill="none" marker-end="url(#green)" />
  <text class="label" x="345" y="220">1. 로그인</text><text class="label" x="880" y="112">정상 요청에는 Cookie가 포함될 수 있음</text>
  <circle class="packet" cx="640" cy="240" r="8" fill="#16a34a"><animateMotion dur="9s" repeatCount="indefinite" path="M 0 0 V -115 H 480 V 0" /></circle>
  <circle class="packet cookie" cx="300" cy="240" r="8" fill="#2563eb"><animateMotion dur="9s" begin="2.3s" repeatCount="indefinite" path="M 0 0 H 90" /></circle>

  <rect class="panel" x="80" y="385" width="1240" height="195" />
  <text class="node" x="700" y="425" fill="#b91c1c">2. 공격 페이지 방문 후 요청 유도</text>
  <line x1="885" y1="475" x2="515" y2="475" class="flow" stroke="#dc2626" marker-end="url(#red)" /><text class="label" x="700" y="457" fill="#b91c1c">공격 페이지가 Browser에 대상 서버 요청을 유도</text>
  <line x1="640" y1="520" x2="1120" y2="520" class="flow" stroke="#dc2626" marker-end="url(#red)" /><text class="label" x="880" y="550" fill="#b91c1c">Cookie 전송 조건이 충족되면 인증 Cookie가 포함될 수 있음</text>
  <circle class="packet attack" cx="885" cy="475" r="8" fill="#dc2626"><animateMotion dur="9s" begin="4.6s" repeatCount="indefinite" path="M 0 0 H -370" /></circle>

  <rect class="panel" x="80" y="620" width="1240" height="150" />
  <text class="node" x="700" y="660" fill="#15803d">3. CSRF Token 검증</text>
  <text class="body" x="355" y="705">Token 없음·불일치</text><text class="body" x="355" y="735" fill="#b91c1c">→ 보호 대상 요청 거부</text>
  <text class="body" x="1045" y="705">유효한 Token</text><text class="body" x="1045" y="735" fill="#15803d">→ 애플리케이션 정책에 따라 처리</text>
  <line x1="700" y1="705" x2="700" y2="735" stroke="#cbd5e1" stroke-width="2" /><circle class="packet safe" cx="1045" cy="705" r="8" fill="#16a34a" />
  <text class="small" x="700" y="815">SameSite 정책과 요청 조건에 따라 Cookie 전송 여부는 달라질 수 있다</text>
</svg>
