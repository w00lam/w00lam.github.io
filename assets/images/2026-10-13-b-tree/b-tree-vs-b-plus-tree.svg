<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">B-Tree와 B+Tree 비교</title>
  <desc id="desc">B-Tree는 내부 노드에도 데이터가 있을 수 있고, B+Tree는 연결된 리프 노드에 데이터를 모으는 구조를 비교한다.</desc>

  <rect width="1000" height="430" fill="#f8fafc"/>
  <text x="40" y="42" fill="#1f2937" font-family="Arial, sans-serif" font-size="26" font-weight="700">B-Tree와 B+Tree 비교</text>
  <text x="40" y="66" fill="#64748b" font-family="Arial, sans-serif" font-size="14">데이터의 위치와 범위 검색을 이어가는 방식이 다르다.</text>

  <rect x="40" y="88" width="440" height="300" rx="16" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/>
  <text x="260" y="120" text-anchor="middle" fill="#1f2937" font-family="Arial, sans-serif" font-size="20" font-weight="700">B-Tree</text>
  <text x="260" y="142" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="13">키와 데이터가 함께 있을 수 있음</text>

  <rect x="150" y="158" width="220" height="48" rx="8" fill="#fff2d8" stroke="#c47a16" stroke-width="2"/>
  <text x="260" y="182" text-anchor="middle" dominant-baseline="middle" fill="#7c4a03" font-family="Arial, sans-serif" font-size="15" font-weight="700">30 | 60 + 데이터</text>
  <line x1="260" y1="206" x2="260" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="222" x2="125" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="222" x2="395" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="222" x2="260" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <rect x="72" y="238" width="106" height="48" rx="8" fill="#fff7e8" stroke="#c47a16" stroke-width="2"/>
  <rect x="207" y="238" width="106" height="48" rx="8" fill="#fff7e8" stroke="#c47a16" stroke-width="2"/>
  <rect x="342" y="238" width="106" height="48" rx="8" fill="#fff7e8" stroke="#c47a16" stroke-width="2"/>
  <text x="125" y="262" text-anchor="middle" dominant-baseline="middle" fill="#7c4a03" font-family="Arial, sans-serif" font-size="14" font-weight="700">10 | 20 + 값</text>
  <text x="260" y="262" text-anchor="middle" dominant-baseline="middle" fill="#7c4a03" font-family="Arial, sans-serif" font-size="14" font-weight="700">40 | 50 + 값</text>
  <text x="395" y="262" text-anchor="middle" dominant-baseline="middle" fill="#7c4a03" font-family="Arial, sans-serif" font-size="14" font-weight="700">70 | 80 + 값</text>
  <rect x="125" y="318" width="270" height="34" rx="17" fill="#fff7e8"/>
  <text x="260" y="339" text-anchor="middle" dominant-baseline="middle" fill="#7c4a03" font-family="Arial, sans-serif" font-size="13" font-weight="700">검색이 어느 노드에서든 끝날 수 있음</text>

  <rect x="520" y="88" width="440" height="300" rx="16" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/>
  <text x="740" y="120" text-anchor="middle" fill="#1f2937" font-family="Arial, sans-serif" font-size="20" font-weight="700">B+Tree</text>
  <text x="740" y="142" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="13">내부 키는 안내하고 데이터는 리프에 저장</text>

  <rect x="630" y="158" width="220" height="48" rx="8" fill="#e9f2ff" stroke="#3578c4" stroke-width="2"/>
  <text x="740" y="182" text-anchor="middle" dominant-baseline="middle" fill="#1d4f91" font-family="Arial, sans-serif" font-size="15" font-weight="700">30 | 60 (인덱스 키)</text>
  <line x1="740" y1="206" x2="740" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="740" y1="222" x2="605" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="740" y1="222" x2="875" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <rect x="552" y="238" width="106" height="48" rx="8" fill="#e9f7f0" stroke="#2b8a68" stroke-width="2"/>
  <rect x="687" y="238" width="106" height="48" rx="8" fill="#e9f7f0" stroke="#2b8a68" stroke-width="2"/>
  <rect x="822" y="238" width="106" height="48" rx="8" fill="#e9f7f0" stroke="#2b8a68" stroke-width="2"/>
  <text x="605" y="262" text-anchor="middle" dominant-baseline="middle" fill="#176347" font-family="Arial, sans-serif" font-size="14" font-weight="700">10 | 20 : 값</text>
  <text x="740" y="262" text-anchor="middle" dominant-baseline="middle" fill="#176347" font-family="Arial, sans-serif" font-size="14" font-weight="700">30 | 50 : 값</text>
  <text x="875" y="262" text-anchor="middle" dominant-baseline="middle" fill="#176347" font-family="Arial, sans-serif" font-size="14" font-weight="700">70 | 80 : 값</text>
  <line x1="658" y1="298" x2="682" y2="298" stroke="#2b8a68" stroke-width="2"/>
  <polygon points="682,298 670,292 670,304" fill="#2b8a68"/>
  <line x1="793" y1="298" x2="817" y2="298" stroke="#2b8a68" stroke-width="2"/>
  <polygon points="817,298 805,292 805,304" fill="#2b8a68"/>
  <text x="740" y="339" text-anchor="middle" fill="#176347" font-family="Arial, sans-serif" font-size="13" font-weight="700">연결된 리프 → 범위 검색에 유리</text>
</svg>
