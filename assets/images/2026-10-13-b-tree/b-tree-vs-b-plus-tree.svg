<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">B-Tree and B+Tree comparison</title>
  <desc id="desc">A compact comparison showing data can live in B-Tree internal nodes, while B+Tree keeps data in linked leaf nodes.</desc>

  <rect width="1000" height="430" fill="#f8fafc"/>
  <text x="40" y="42" fill="#1f2937" font-family="Arial, sans-serif" font-size="26" font-weight="700">B-Tree vs B+Tree</text>
  <text x="40" y="66" fill="#64748b" font-family="Arial, sans-serif" font-size="14">The key difference is where data lives and how a range scan continues.</text>

  <rect x="40" y="88" width="440" height="300" rx="16" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/>
  <text x="260" y="120" text-anchor="middle" fill="#1f2937" font-family="Arial, sans-serif" font-size="20" font-weight="700">B-Tree</text>
  <text x="260" y="142" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="13">keys and data may coexist</text>

  <rect x="150" y="158" width="220" height="48" rx="8" fill="#fff2d8" stroke="#c47a16" stroke-width="2"/>
  <text x="260" y="182" text-anchor="middle" dominant-baseline="middle" fill="#7c4a03" font-family="Arial, sans-serif" font-size="15" font-weight="700">30 | 60 + data</text>
  <line x1="260" y1="206" x2="260" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="222" x2="125" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="222" x2="395" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="222" x2="260" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <rect x="72" y="238" width="106" height="48" rx="8" fill="#fff7e8" stroke="#c47a16" stroke-width="2"/>
  <rect x="207" y="238" width="106" height="48" rx="8" fill="#fff7e8" stroke="#c47a16" stroke-width="2"/>
  <rect x="342" y="238" width="106" height="48" rx="8" fill="#fff7e8" stroke="#c47a16" stroke-width="2"/>
  <text x="125" y="262" text-anchor="middle" dominant-baseline="middle" fill="#7c4a03" font-family="Arial, sans-serif" font-size="14" font-weight="700">10 | 20 + data</text>
  <text x="260" y="262" text-anchor="middle" dominant-baseline="middle" fill="#7c4a03" font-family="Arial, sans-serif" font-size="14" font-weight="700">40 | 50 + data</text>
  <text x="395" y="262" text-anchor="middle" dominant-baseline="middle" fill="#7c4a03" font-family="Arial, sans-serif" font-size="14" font-weight="700">70 | 80 + data</text>
  <rect x="125" y="318" width="270" height="34" rx="17" fill="#fff7e8"/>
  <text x="260" y="339" text-anchor="middle" dominant-baseline="middle" fill="#7c4a03" font-family="Arial, sans-serif" font-size="13" font-weight="700">a match may end at any node</text>

  <rect x="520" y="88" width="440" height="300" rx="16" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/>
  <text x="740" y="120" text-anchor="middle" fill="#1f2937" font-family="Arial, sans-serif" font-size="20" font-weight="700">B+Tree</text>
  <text x="740" y="142" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="13">internal keys guide; leaves hold data</text>

  <rect x="630" y="158" width="220" height="48" rx="8" fill="#e9f2ff" stroke="#3578c4" stroke-width="2"/>
  <text x="740" y="182" text-anchor="middle" dominant-baseline="middle" fill="#1d4f91" font-family="Arial, sans-serif" font-size="15" font-weight="700">30 | 60 (index keys)</text>
  <line x1="740" y1="206" x2="740" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="740" y1="222" x2="605" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="740" y1="222" x2="875" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <rect x="552" y="238" width="106" height="48" rx="8" fill="#e9f7f0" stroke="#2b8a68" stroke-width="2"/>
  <rect x="687" y="238" width="106" height="48" rx="8" fill="#e9f7f0" stroke="#2b8a68" stroke-width="2"/>
  <rect x="822" y="238" width="106" height="48" rx="8" fill="#e9f7f0" stroke="#2b8a68" stroke-width="2"/>
  <text x="605" y="262" text-anchor="middle" dominant-baseline="middle" fill="#176347" font-family="Arial, sans-serif" font-size="14" font-weight="700">10 | 20 : data</text>
  <text x="740" y="262" text-anchor="middle" dominant-baseline="middle" fill="#176347" font-family="Arial, sans-serif" font-size="14" font-weight="700">30 | 50 : data</text>
  <text x="875" y="262" text-anchor="middle" dominant-baseline="middle" fill="#176347" font-family="Arial, sans-serif" font-size="14" font-weight="700">70 | 80 : data</text>
  <line x1="658" y1="298" x2="682" y2="298" stroke="#2b8a68" stroke-width="2"/>
  <polygon points="682,298 670,292 670,304" fill="#2b8a68"/>
  <line x1="793" y1="298" x2="817" y2="298" stroke="#2b8a68" stroke-width="2"/>
  <polygon points="817,298 805,292 805,304" fill="#2b8a68"/>
  <text x="740" y="339" text-anchor="middle" fill="#176347" font-family="Arial, sans-serif" font-size="13" font-weight="700">linked leaves → easy range scan</text>
</svg>
