<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">PaymentService 계약과 BasePaymentService 상속 구조의 결합</title>
  <desc id="desc">외부의 PaymentController는 PaymentService 계약만 바라보고, 내부의 CardPaymentService는 계약을 구현하면서 BasePaymentService를 상속한다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="700" y="58" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="31" font-weight="700" fill="#0f172a">외부 계약과 내부 상속 구조를 함께 사용하기</text>
  <text x="700" y="94" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#64748b">호출부는 인터페이스를 보고, 구현체는 추상 클래스의 공통 구조를 활용한다</text>

  <g filter="url(#shadow)">
    <rect x="100" y="170" width="360" height="110" rx="18" fill="#0f172a"/>
    <text x="280" y="218" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="26" font-weight="700" fill="#ffffff">PaymentController</text>
    <text x="280" y="252" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#cbd5e1">외부 호출부</text>
  </g>
  <line x1="460" y1="225" x2="650" y2="225" stroke="#475569" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <text x="550" y="207" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">의존</text>

  <g filter="url(#shadow)">
    <rect x="675" y="145" width="430" height="160" rx="18" fill="#2563eb"/>
    <text x="890" y="208" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="29" font-weight="700" fill="#ffffff">PaymentService</text>
    <text x="890" y="248" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" fill="#dbeafe">기능의 계약 · pay()</text>
  </g>

  <line x1="890" y1="305" x2="890" y2="430" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="930" y="374" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#059669">implements</text>

  <g filter="url(#shadow)">
    <rect x="675" y="445" width="430" height="125" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <text x="890" y="495" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="27" font-weight="700" fill="#065f46">CardPaymentService</text>
    <text x="890" y="532" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#047857">실제 구현체</text>
  </g>

  <line x1="890" y1="570" x2="890" y2="690" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <text x="930" y="638" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#7c3aed">extends</text>

  <g filter="url(#shadow)">
    <rect x="675" y="705" width="430" height="125" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
    <text x="890" y="755" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="27" font-weight="700" fill="#4c1d95">BasePaymentService</text>
    <text x="890" y="792" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#6d28d9">상태 provider + 공통 행동 validate()</text>
  </g>

  <rect x="1150" y="420" width="175" height="220" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1237" y="466" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#334155">역할 분리</text>
  <text x="1237" y="515" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">밖에서는</text>
  <text x="1237" y="542" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#2563eb">계약</text>
  <text x="1237" y="584" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">안에서는</text>
  <text x="1237" y="611" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#7c3aed">공통 구조</text>
</svg>
