<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">DB 변경 뒤 Redis 캐시 무효화 흐름</title>
  <desc id="desc">DB에는 변경된 주소가 저장됐지만 Redis에는 이전 조회 결과가 남은 상황에서 DB 변경 커밋 뒤 관련 캐시를 삭제하고 다음 조회에서 DB 결과를 다시 캐시에 저장하는 흐름을 보여준다.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3578c4"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b8a68"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c47a16"/></marker>
  </defs>
  <rect width="1500" height="980" fill="#f8fafc"/>
  <text x="48" y="54" fill="#1f2937" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="30" font-weight="700">TTL 만료와 캐시 무효화는 서로 다른 흐름이다</text>
  <text x="48" y="88" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="16">DB 변경을 커밋한 뒤 오래된 검색 결과를 지우고 다음 캐시 미스에서 새 결과를 채운다.</text>

  <rect x="48" y="126" width="1404" height="170" rx="16" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/>
  <text x="78" y="165" fill="#475569" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700">변경 직후의 상태</text>
  <rect x="78" y="190" width="544" height="74" rx="12" fill="#e9f7f0" stroke="#2b8a68" stroke-width="2"/>
  <text x="350" y="220" text-anchor="middle" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700">관계형 DB</text>
  <text x="350" y="246" text-anchor="middle" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">주소가 '새 주소'로 변경되고 커밋됨</text>
  <line x1="654" y1="227" x2="846" y2="227" stroke="#c47a16" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow-orange)"/>
  <text x="750" y="207" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">아직 오래된 캐시가 남음</text>
  <rect x="878" y="190" width="544" height="74" rx="12" fill="#fff7e8" stroke="#c47a16" stroke-width="2"/>
  <text x="1150" y="220" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700">Redis</text>
  <text x="1150" y="246" text-anchor="middle" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">주소가 '이전 주소'인 조회 결과와 TTL 보유</text>

  <rect x="48" y="340" width="1404" height="488" rx="16" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/>
  <text x="78" y="382" fill="#475569" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700">캐시 무효화와 재생성</text>

  <rect x="78" y="426" width="270" height="102" rx="12" fill="#eef5ff" stroke="#3578c4" stroke-width="2"/>
  <text x="213" y="466" text-anchor="middle" fill="#1d4f91" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700">DB 변경 커밋</text>
  <text x="213" y="498" text-anchor="middle" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">원본 상태 확정</text>
  <line x1="368" y1="477" x2="438" y2="477" stroke="#3578c4" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="458" y="426" width="270" height="102" rx="12" fill="#fff1d6" stroke="#c47a16" stroke-width="2"/>
  <text x="593" y="466" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700">관련 캐시 삭제</text>
  <text x="593" y="498" text-anchor="middle" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">오래된 결과 무효화</text>
  <line x1="748" y1="477" x2="818" y2="477" stroke="#c47a16" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <rect x="838" y="426" width="270" height="102" rx="12" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/>
  <text x="973" y="466" text-anchor="middle" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700">다음 조회</text>
  <text x="973" y="498" text-anchor="middle" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">캐시 미스</text>
  <line x1="1128" y1="477" x2="1198" y2="477" stroke="#3578c4" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="1218" y="426" width="204" height="102" rx="12" fill="#e9f7f0" stroke="#2b8a68" stroke-width="2"/>
  <text x="1320" y="466" text-anchor="middle" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700">DB 조회</text>
  <text x="1320" y="498" text-anchor="middle" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">새 결과 반환</text>

  <path d="M 1320 548 L 1320 640 L 973 640 L 973 548" fill="none" stroke="#2b8a68" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="478" y="596" width="590" height="104" rx="12" fill="#e9f7f0" stroke="#2b8a68" stroke-width="2"/>
  <text x="773" y="635" text-anchor="middle" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700">새 조회 결과를 Redis에 저장</text>
  <text x="773" y="667" text-anchor="middle" fill="#334155" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">필요한 TTL을 다시 설정할 수 있음</text>
  <line x1="478" y1="648" x2="350" y2="648" stroke="#2b8a68" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="264" y="629" text-anchor="middle" fill="#176347" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14">다음 요청부터 새 결과 사용</text>

  <rect x="78" y="744" width="1344" height="54" rx="12" fill="#fff7e8" stroke="#c47a16" stroke-width="2"/>
  <text x="750" y="778" text-anchor="middle" fill="#7c4a03" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="16" font-weight="700">TTL은 시간이 지나면 만료시키고 캐시 무효화는 원본 변경으로 오래된 결과를 제거한다.</text>

  <text x="750" y="898" text-anchor="middle" fill="#64748b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">DB와 Redis가 하나의 트랜잭션으로 자동 처리된다고 가정하지 않고 두 흐름을 따로 확인한다.</text>
</svg>
