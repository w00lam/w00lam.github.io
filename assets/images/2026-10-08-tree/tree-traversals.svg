<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">A부터 F까지 트리의 네 가지 순회</title>
  <desc id="desc">같은 A B C D E F 트리를 전위, 중위, 후위, 레벨 순회로 방문한 번호와 결과</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 29px sans-serif; fill: #111827; }
      .panel-title { font: 700 20px sans-serif; fill: #1f2937; }
      .result { font: 600 15px sans-serif; fill: #1d4ed8; }
      .line { stroke: #64748b; stroke-width: 3; }
      .node { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .node-text { font: 700 17px sans-serif; fill: #9a3412; text-anchor: middle; dominant-baseline: middle; }
      .num { fill: #2563eb; stroke: #ffffff; stroke-width: 2; }
      .num-text { font: 700 12px sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 13px sans-serif; fill: #64748b; }
    </style>
  </defs>
  <rect class="bg" width="900" height="760" rx="24"/>
  <text class="title" x="42" y="52">같은 구조라도 방문 시점에 따라 순서가 달라진다</text>
  <text class="small" x="42" y="80">각 패널은 같은 A~F 트리를 반복하고, 숫자는 현재 노드를 처리한 순서다.</text>

  <g transform="translate(30 105)">
    <rect class="panel" width="400" height="295" rx="18"/>
    <text class="panel-title" x="20" y="35">전위 순회</text>
    <text class="small" x="20" y="57">현재 → 왼쪽 서브트리 → 오른쪽 서브트리</text>
    <path class="line" d="M200 104 L135 158 M200 104 L265 158 M135 183 L100 235 M135 183 L170 235 M265 183 L300 235"/>
    <circle class="node" cx="200" cy="90" r="24"/><circle class="node" cx="135" cy="170" r="24"/><circle class="node" cx="265" cy="170" r="24"/><circle class="node" cx="100" cy="250" r="24"/><circle class="node" cx="170" cy="250" r="24"/><circle class="node" cx="300" cy="250" r="24"/>
    <text class="node-text" x="200" y="90">A</text><text class="node-text" x="135" y="170">B</text><text class="node-text" x="265" y="170">C</text><text class="node-text" x="100" y="250">D</text><text class="node-text" x="170" y="250">E</text><text class="node-text" x="300" y="250">F</text>
    <circle class="num" cx="224" cy="66" r="12"/><circle class="num" cx="159" cy="146" r="12"/><circle class="num" cx="124" cy="226" r="12"/><circle class="num" cx="194" cy="226" r="12"/><circle class="num" cx="289" cy="146" r="12"/><circle class="num" cx="324" cy="226" r="12"/>
    <text class="num-text" x="224" y="66">1</text><text class="num-text" x="159" y="146">2</text><text class="num-text" x="124" y="226">3</text><text class="num-text" x="194" y="226">4</text><text class="num-text" x="289" y="146">5</text><text class="num-text" x="324" y="226">6</text>
    <text class="result" x="20" y="282">결과: A B D E C F</text>
  </g>

  <g transform="translate(470 105)">
    <rect class="panel" width="400" height="295" rx="18"/>
    <text class="panel-title" x="20" y="35">중위 순회</text>
    <text class="small" x="20" y="57">왼쪽 서브트리 → 현재 → 오른쪽 서브트리</text>
    <path class="line" d="M200 104 L135 158 M200 104 L265 158 M135 183 L100 235 M135 183 L170 235 M265 183 L300 235"/>
    <circle class="node" cx="200" cy="90" r="24"/><circle class="node" cx="135" cy="170" r="24"/><circle class="node" cx="265" cy="170" r="24"/><circle class="node" cx="100" cy="250" r="24"/><circle class="node" cx="170" cy="250" r="24"/><circle class="node" cx="300" cy="250" r="24"/>
    <text class="node-text" x="200" y="90">A</text><text class="node-text" x="135" y="170">B</text><text class="node-text" x="265" y="170">C</text><text class="node-text" x="100" y="250">D</text><text class="node-text" x="170" y="250">E</text><text class="node-text" x="300" y="250">F</text>
    <circle class="num" cx="224" cy="66" r="12"/><circle class="num" cx="159" cy="146" r="12"/><circle class="num" cx="124" cy="226" r="12"/><circle class="num" cx="194" cy="226" r="12"/><circle class="num" cx="289" cy="146" r="12"/><circle class="num" cx="324" cy="226" r="12"/>
    <text class="num-text" x="224" y="66">4</text><text class="num-text" x="159" y="146">2</text><text class="num-text" x="124" y="226">1</text><text class="num-text" x="194" y="226">3</text><text class="num-text" x="289" y="146">5</text><text class="num-text" x="324" y="226">6</text>
    <text class="result" x="20" y="282">결과: D B E A C F</text>
  </g>

  <g transform="translate(30 435)">
    <rect class="panel" width="400" height="295" rx="18"/>
    <text class="panel-title" x="20" y="35">후위 순회</text>
    <text class="small" x="20" y="57">왼쪽 서브트리 → 오른쪽 서브트리 → 현재</text>
    <path class="line" d="M200 104 L135 158 M200 104 L265 158 M135 183 L100 235 M135 183 L170 235 M265 183 L300 235"/>
    <circle class="node" cx="200" cy="90" r="24"/><circle class="node" cx="135" cy="170" r="24"/><circle class="node" cx="265" cy="170" r="24"/><circle class="node" cx="100" cy="250" r="24"/><circle class="node" cx="170" cy="250" r="24"/><circle class="node" cx="300" cy="250" r="24"/>
    <text class="node-text" x="200" y="90">A</text><text class="node-text" x="135" y="170">B</text><text class="node-text" x="265" y="170">C</text><text class="node-text" x="100" y="250">D</text><text class="node-text" x="170" y="250">E</text><text class="node-text" x="300" y="250">F</text>
    <circle class="num" cx="224" cy="66" r="12"/><circle class="num" cx="159" cy="146" r="12"/><circle class="num" cx="124" cy="226" r="12"/><circle class="num" cx="194" cy="226" r="12"/><circle class="num" cx="289" cy="146" r="12"/><circle class="num" cx="324" cy="226" r="12"/>
    <text class="num-text" x="224" y="66">6</text><text class="num-text" x="159" y="146">3</text><text class="num-text" x="124" y="226">1</text><text class="num-text" x="194" y="226">2</text><text class="num-text" x="289" y="146">5</text><text class="num-text" x="324" y="226">4</text>
    <text class="result" x="20" y="282">결과: D E B F C A</text>
  </g>

  <g transform="translate(470 435)">
    <rect class="panel" width="400" height="295" rx="18"/>
    <text class="panel-title" x="20" y="35">레벨 순회</text>
    <text class="small" x="20" y="57">위 레벨부터 같은 레벨의 왼쪽 순서</text>
    <path class="line" d="M200 104 L135 158 M200 104 L265 158 M135 183 L100 235 M135 183 L170 235 M265 183 L300 235"/>
    <circle class="node" cx="200" cy="90" r="24"/><circle class="node" cx="135" cy="170" r="24"/><circle class="node" cx="265" cy="170" r="24"/><circle class="node" cx="100" cy="250" r="24"/><circle class="node" cx="170" cy="250" r="24"/><circle class="node" cx="300" cy="250" r="24"/>
    <text class="node-text" x="200" y="90">A</text><text class="node-text" x="135" y="170">B</text><text class="node-text" x="265" y="170">C</text><text class="node-text" x="100" y="250">D</text><text class="node-text" x="170" y="250">E</text><text class="node-text" x="300" y="250">F</text>
    <circle class="num" cx="224" cy="66" r="12"/><circle class="num" cx="159" cy="146" r="12"/><circle class="num" cx="124" cy="226" r="12"/><circle class="num" cx="194" cy="226" r="12"/><circle class="num" cx="289" cy="146" r="12"/><circle class="num" cx="324" cy="226" r="12"/>
    <text class="num-text" x="224" y="66">1</text><text class="num-text" x="159" y="146">2</text><text class="num-text" x="289" y="146">3</text><text class="num-text" x="124" y="226">4</text><text class="num-text" x="194" y="226">5</text><text class="num-text" x="324" y="226">6</text>
    <text class="result" x="20" y="282">결과: A B C D E F</text>
  </g>
</svg>
