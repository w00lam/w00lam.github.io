<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">삽입 순서에 따른 BST의 모양</title>
  <desc id="desc">30, 20, 10을 순서대로 넣은 편향 트리와 20, 10, 30을 넣은 트리를 비교하고 10을 찾는 경로를 표시한다.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 29px sans-serif; fill: #111827; }
      .panel-title { font: 700 21px sans-serif; fill: #1f2937; }
      .text { font: 500 16px sans-serif; fill: #475569; }
      .small { font: 500 14px sans-serif; fill: #64748b; }
      .result { font: 600 15px sans-serif; fill: #1d4ed8; }
      .node { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .node-text { font: 700 17px sans-serif; fill: #9a3412; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #64748b; stroke-width: 3; fill: none; }
      .search-line { stroke: #2563eb; stroke-width: 4; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="1000" height="520" rx="24"/>
  <text class="title" x="42" y="52">삽입 순서에 따라 BST의 높이가 달라진다</text>

  <g transform="translate(30 100)">
    <rect class="panel" width="450" height="370" rx="18"/>
    <text class="panel-title" x="20" y="35">30 → 20 → 10</text>
    <text class="small" x="20" y="60">왼쪽으로만 이어지는 편향 트리 · 높이 2</text>
    <path class="search-line" d="M225 148 L165 177 M165 233 L105 262"/>
    <circle class="node" cx="225" cy="120" r="28"/><circle class="node" cx="165" cy="205" r="28"/><circle class="node" cx="105" cy="290" r="28"/>
    <text class="node-text" x="225" y="120">30</text><text class="node-text" x="165" y="205">20</text><text class="node-text" x="105" y="290">10</text>
    <text class="result" x="20" y="345">10 탐색: 비교 3회 · 이동 2회</text>
  </g>

  <g transform="translate(520 100)">
    <rect class="panel" width="450" height="370" rx="18"/>
    <text class="panel-title" x="20" y="35">20 → 10 → 30</text>
    <text class="small" x="20" y="60">루트 양쪽으로 나뉘는 트리 · 높이 1</text>
    <path class="line" d="M225 148 L145 192 M225 148 L305 192"/>
    <path class="search-line" d="M225 148 L145 192"/>
    <circle class="node" cx="225" cy="120" r="28"/><circle class="node" cx="145" cy="220" r="28"/><circle class="node" cx="305" cy="220" r="28"/>
    <text class="node-text" x="225" y="120">20</text><text class="node-text" x="145" y="220">10</text><text class="node-text" x="305" y="220">30</text>
    <text class="result" x="20" y="345">10 탐색: 비교 2회 · 이동 1회</text>
  </g>
</svg>
