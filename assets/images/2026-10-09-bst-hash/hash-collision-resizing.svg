<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">학습용 모듈러 해시의 충돌과 리사이징</title>
  <desc id="desc">key % bucketCount를 사용할 때 버킷이 5개면 1, 6, 11이 모두 인덱스 1에서 충돌하고, 버킷이 10개가 되면 6은 인덱스 6으로 이동한다.</desc>
  <style>
    text { font-family: Arial, 'Malgun Gothic', sans-serif; fill: #243447; }
    .title { font-size: 24px; font-weight: 700; }
    .label { font-size: 18px; font-weight: 700; }
    .small { font-size: 16px; }
    .bucket { fill: #ffffff; stroke: #9fb3c8; stroke-width: 2; }
    .key { fill: #e8f1fb; stroke: #2f80ed; stroke-width: 2; }
    .collision { fill: #fff1e6; stroke: #f2994a; stroke-width: 3; }
    .moved { fill: #e9f8ef; stroke: #27ae60; stroke-width: 3; }
    .arrow { stroke: #7b8794; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7b8794"/></marker>
  </defs>
  <rect width="1400" height="590" fill="#fbfcfe"/>
  <text x="700" y="40" text-anchor="middle" class="title">학습용 모듈러 해시: 버킷 수가 바뀌면 저장 위치도 다시 계산한다</text>
  <text x="700" y="72" text-anchor="middle" class="small">index = key % bucketCount · 체이닝 예제</text>

  <text x="350" y="125" text-anchor="middle" class="label">버킷 5개</text>
  <text x="1050" y="125" text-anchor="middle" class="label">버킷 10개로 리사이징한 뒤</text>
  <text x="350" y="153" text-anchor="middle" class="small">1 % 5 = 1 · 6 % 5 = 1 · 11 % 5 = 1</text>
  <text x="1050" y="153" text-anchor="middle" class="small">1 % 10 = 1 · 6 % 10 = 6 · 11 % 10 = 1</text>

  <g transform="translate(125,190)">
    <rect x="0" y="0" width="450" height="48" rx="7" class="bucket"/><text x="28" y="31" class="label">0</text>
    <rect x="0" y="55" width="450" height="48" rx="7" class="bucket"/><text x="28" y="86" class="label">1</text>
    <rect x="0" y="110" width="450" height="48" rx="7" class="bucket"/><text x="28" y="141" class="label">2</text>
    <rect x="0" y="165" width="450" height="48" rx="7" class="bucket"/><text x="28" y="196" class="label">3</text>
    <rect x="0" y="220" width="450" height="48" rx="7" class="bucket"/><text x="28" y="251" class="label">4</text>
    <rect x="95" y="64" width="82" height="30" rx="15" class="collision"/><text x="136" y="85" text-anchor="middle" class="small">1</text>
    <rect x="195" y="64" width="82" height="30" rx="15" class="collision"/><text x="236" y="85" text-anchor="middle" class="small">6</text>
    <rect x="295" y="64" width="82" height="30" rx="15" class="collision"/><text x="336" y="85" text-anchor="middle" class="small">11</text>
    <text x="225" y="313" text-anchor="middle" class="small" fill="#f2994a">인덱스 1에 세 엔트리 연결</text>
  </g>

  <path d="M590 330 C650 330 685 330 740 330" class="arrow"/>
  <text x="665" y="310" text-anchor="middle" class="small">버킷 수 증가</text>
  <text x="665" y="355" text-anchor="middle" class="small">기존 엔트리 재배치</text>

  <g transform="translate(825,190)">
    <rect x="0" y="0" width="450" height="36" rx="7" class="bucket"/><text x="28" y="25" class="label">0</text>
    <rect x="0" y="41" width="450" height="36" rx="7" class="bucket"/><text x="28" y="66" class="label">1</text>
    <rect x="0" y="82" width="450" height="36" rx="7" class="bucket"/><text x="28" y="107" class="label">2</text>
    <rect x="0" y="123" width="450" height="36" rx="7" class="bucket"/><text x="28" y="148" class="label">3</text>
    <rect x="0" y="164" width="450" height="36" rx="7" class="bucket"/><text x="28" y="189" class="label">4</text>
    <rect x="0" y="205" width="450" height="36" rx="7" class="bucket"/><text x="28" y="230" class="label">5</text>
    <rect x="0" y="246" width="450" height="36" rx="7" class="bucket"/><text x="28" y="271" class="label">6</text>
    <rect x="0" y="287" width="450" height="36" rx="7" class="bucket"/><text x="28" y="312" class="label">7</text>
    <rect x="0" y="328" width="450" height="36" rx="7" class="bucket"/><text x="28" y="353" class="label">8</text>
    <rect x="0" y="369" width="450" height="36" rx="7" class="bucket"/><text x="28" y="394" class="label">9</text>
    <rect x="95" y="47" width="82" height="24" rx="12" class="collision"/><text x="136" y="64" text-anchor="middle" class="small">1</text>
    <rect x="195" y="47" width="82" height="24" rx="12" class="collision"/><text x="236" y="64" text-anchor="middle" class="small">11</text>
    <rect x="95" y="252" width="82" height="24" rx="12" class="moved"/><text x="136" y="269" text-anchor="middle" class="small">6</text>
  </g>
  <text x="1050" y="625" text-anchor="middle" class="small" fill="#27ae60">같은 키라도 새 기준으로 해시 인덱스를 다시 계산해야 한다</text>
</svg>
