<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">학습용 모듈러 해시의 충돌과 리사이징</title>
  <desc id="desc">key % bucketCount를 사용할 때 버킷이 5개면 1, 6, 11이 모두 인덱스 1에서 충돌하고, 버킷이 10개가 되면 6은 인덱스 6으로 이동한다.</desc>
  <style>
    text { font-family: Arial, 'Malgun Gothic', sans-serif; fill: #14213d; }
    .panel { fill: #ffffff; stroke: #b8c7d9; stroke-width: 3; }
    .title { font-size: 34px; font-weight: 700; }
    .panel-title { font-size: 30px; font-weight: 700; }
    .formula { font-size: 23px; }
    .label { font-size: 25px; font-weight: 700; }
    .key { font-size: 23px; font-weight: 700; }
    .caption { font-size: 23px; font-weight: 700; }
    .bucket { fill: #ffffff; stroke: #8fa9c4; stroke-width: 3; }
    .collision { fill: #fff1e6; stroke: #ed8b32; stroke-width: 4; }
    .moved { fill: #e9f8ef; stroke: #21a45d; stroke-width: 4; }
    .arrow { stroke: #647b95; stroke-width: 5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="4" orient="auto"><path d="M0,0 L0,8 L12,4 z" fill="#647b95"/></marker></defs>
  <rect width="1100" height="650" fill="#fbfcfe"/>
  <text x="550" y="52" text-anchor="middle" class="title">버킷 수가 바뀌면 저장 위치도 다시 계산한다</text>
  <text x="550" y="88" text-anchor="middle" class="formula">학습용 식: index = key % bucketCount</text>
  <rect x="35" y="115" width="460" height="500" rx="16" class="panel"/>
  <rect x="605" y="115" width="460" height="500" rx="16" class="panel"/>
  <text x="265" y="165" text-anchor="middle" class="panel-title">버킷 5개</text>
  <text x="265" y="198" text-anchor="middle" class="formula">1, 6, 11 → 모두 인덱스 1</text>
  <rect x="75" y="230" width="380" height="52" rx="8" class="bucket"/><text x="100" y="265" class="label">0</text>
  <rect x="75" y="295" width="380" height="52" rx="8" class="bucket"/><text x="100" y="330" class="label">1</text>
  <rect x="75" y="360" width="380" height="52" rx="8" class="bucket"/><text x="100" y="395" class="label">2</text>
  <rect x="75" y="425" width="380" height="52" rx="8" class="bucket"/><text x="100" y="460" class="label">3</text>
  <rect x="75" y="490" width="380" height="52" rx="8" class="bucket"/><text x="100" y="525" class="label">4</text>
  <rect x="180" y="304" width="70" height="34" rx="17" class="collision"/><text x="215" y="328" text-anchor="middle" class="key">1</text>
  <rect x="265" y="304" width="70" height="34" rx="17" class="collision"/><text x="300" y="328" text-anchor="middle" class="key">6</text>
  <rect x="350" y="304" width="70" height="34" rx="17" class="collision"/><text x="385" y="328" text-anchor="middle" class="key">11</text>
  <text x="265" y="585" text-anchor="middle" class="caption" fill="#c96f21">인덱스 1에서 충돌</text>
  <path d="M510 365 L590 365" class="arrow"/>
  <text x="550" y="335" text-anchor="middle" class="formula">버킷 증가</text>
  <text x="550" y="405" text-anchor="middle" class="formula">재배치</text>
  <text x="835" y="165" text-anchor="middle" class="panel-title">버킷 10개</text>
  <text x="835" y="198" text-anchor="middle" class="formula">6만 인덱스 6으로 이동</text>
  <rect x="645" y="220" width="380" height="32" rx="7" class="bucket"/><text x="670" y="244" class="label">0</text>
  <rect x="645" y="258" width="380" height="32" rx="7" class="bucket"/><text x="670" y="282" class="label">1</text>
  <rect x="645" y="296" width="380" height="32" rx="7" class="bucket"/><text x="670" y="320" class="label">2</text>
  <rect x="645" y="334" width="380" height="32" rx="7" class="bucket"/><text x="670" y="358" class="label">3</text>
  <rect x="645" y="372" width="380" height="32" rx="7" class="bucket"/><text x="670" y="396" class="label">4</text>
  <rect x="645" y="410" width="380" height="32" rx="7" class="bucket"/><text x="670" y="434" class="label">5</text>
  <rect x="645" y="448" width="380" height="32" rx="7" class="bucket"/><text x="670" y="472" class="label">6</text>
  <rect x="645" y="486" width="380" height="32" rx="7" class="bucket"/><text x="670" y="510" class="label">7</text>
  <rect x="645" y="524" width="380" height="32" rx="7" class="bucket"/><text x="670" y="548" class="label">8</text>
  <rect x="645" y="562" width="380" height="32" rx="7" class="bucket"/><text x="670" y="586" class="label">9</text>
  <rect x="770" y="263" width="75" height="28" rx="14" class="collision"/><text x="807" y="283" text-anchor="middle" class="key">1</text>
  <rect x="860" y="263" width="75" height="28" rx="14" class="collision"/><text x="897" y="283" text-anchor="middle" class="key">11</text>
  <rect x="770" y="453" width="75" height="28" rx="14" class="moved"/><text x="807" y="473" text-anchor="middle" class="key">6</text>
</svg>
