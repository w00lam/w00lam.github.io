<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">학습용 모듈러 해시의 충돌과 리사이징</title>
  <desc id="desc">key % bucketCount를 사용할 때 버킷이 5개면 1, 6, 11이 인덱스 1에서 충돌하고, 버킷이 10개가 되면 6은 인덱스 6으로 이동한다.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 29px sans-serif; fill: #111827; }
      .panel-title { font: 700 21px sans-serif; fill: #1f2937; }
      .text { font: 500 16px sans-serif; fill: #475569; }
      .small { font: 500 14px sans-serif; fill: #64748b; }
      .result { font: 600 15px sans-serif; fill: #1d4ed8; }
      .cell { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .empty { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 5; }
      .highlight { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .map { fill: none; stroke: #2563eb; stroke-width: 3; stroke-dasharray: 7 6; }
      .bucket-label { font: 600 15px sans-serif; fill: #475569; }
      .key-text { font: 700 15px sans-serif; fill: #5b21b6; text-anchor: middle; dominant-baseline: middle; }
      .highlight-text { font: 700 15px sans-serif; fill: #92400e; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="640" rx="24"/>
  <text class="title" x="42" y="52">버킷 수가 바뀌면 저장 위치도 다시 계산한다</text>
  <text class="small" x="42" y="80">학습용 식: index = key % bucketCount · 체이닝 예제</text>

  <g transform="translate(30 110)">
    <rect class="panel" width="470" height="520" rx="18"/>
    <text class="panel-title" x="20" y="35">버킷 5개</text>
    <text class="small" x="20" y="60">1, 6, 11 → 모두 인덱스 1</text>
    <g transform="translate(25 90)">
      <rect class="cell" x="0" y="0" width="420" height="52" rx="10"/><text class="bucket-label" x="18" y="31">0</text>
      <rect class="cell" x="0" y="64" width="420" height="52" rx="10"/><text class="bucket-label" x="18" y="95">1</text>
      <rect class="cell" x="0" y="128" width="420" height="52" rx="10"/><text class="bucket-label" x="18" y="159">2</text>
      <rect class="cell" x="0" y="192" width="420" height="52" rx="10"/><text class="bucket-label" x="18" y="223">3</text>
      <rect class="cell" x="0" y="256" width="420" height="52" rx="10"/><text class="bucket-label" x="18" y="287">4</text>
      <rect class="highlight" x="110" y="72" width="72" height="36" rx="10"/><text class="highlight-text" x="146" y="90">1</text>
      <rect class="highlight" x="195" y="72" width="72" height="36" rx="10"/><text class="highlight-text" x="231" y="90">6</text>
      <rect class="highlight" x="280" y="72" width="72" height="36" rx="10"/><text class="highlight-text" x="316" y="90">11</text>
    </g>
    <text class="result" x="20" y="480">인덱스 1에서 충돌</text>
  </g>

  <path class="map" d="M515 355 C540 335 560 335 585 355"/>
  <text class="small" x="550" y="325" text-anchor="middle">버킷 증가</text>
  <text class="small" x="550" y="390" text-anchor="middle">재배치</text>

  <g transform="translate(630 110)">
    <rect class="panel" width="440" height="520" rx="18"/>
    <text class="panel-title" x="20" y="35">버킷 10개</text>
    <text class="small" x="20" y="60">6은 인덱스 6으로 이동</text>
    <g transform="translate(25 82)">
      <rect class="empty" x="0" y="0" width="390" height="32" rx="8"/><text class="bucket-label" x="18" y="22">0</text>
      <rect class="cell" x="0" y="38" width="390" height="32" rx="8"/><text class="bucket-label" x="18" y="60">1</text>
      <rect class="empty" x="0" y="76" width="390" height="32" rx="8"/><text class="bucket-label" x="18" y="98">2</text>
      <rect class="empty" x="0" y="114" width="390" height="32" rx="8"/><text class="bucket-label" x="18" y="136">3</text>
      <rect class="empty" x="0" y="152" width="390" height="32" rx="8"/><text class="bucket-label" x="18" y="174">4</text>
      <rect class="empty" x="0" y="190" width="390" height="32" rx="8"/><text class="bucket-label" x="18" y="212">5</text>
      <rect class="highlight" x="0" y="228" width="390" height="32" rx="8"/><text class="bucket-label" x="18" y="250">6</text>
      <rect class="empty" x="0" y="266" width="390" height="32" rx="8"/><text class="bucket-label" x="18" y="288">7</text>
      <rect class="empty" x="0" y="304" width="390" height="32" rx="8"/><text class="bucket-label" x="18" y="326">8</text>
      <rect class="empty" x="0" y="342" width="390" height="32" rx="8"/><text class="bucket-label" x="18" y="364">9</text>
      <rect class="highlight" x="110" y="42" width="72" height="28" rx="9"/><text class="highlight-text" x="146" y="56">1</text>
      <rect class="highlight" x="195" y="42" width="72" height="28" rx="9"/><text class="highlight-text" x="231" y="56">11</text>
      <rect class="highlight" x="110" y="230" width="72" height="28" rx="9"/><text class="highlight-text" x="146" y="244">6</text>
    </g>
    <text class="result" x="20" y="505">1·11은 1에 남고 6은 6으로 이동</text>
  </g>
</svg>
