<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">자식이 둘인 BST 노드 삭제</title>
  <desc id="desc">50을 삭제할 때 오른쪽 서브트리의 최솟값 60을 선택하고, 원래 60의 오른쪽 자식 70을 80의 왼쪽 자식으로 연결한다.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 29px sans-serif; fill: #111827; }
      .panel-title { font: 700 21px sans-serif; fill: #1f2937; }
      .text { font: 500 16px sans-serif; fill: #475569; }
      .small { font: 500 14px sans-serif; fill: #64748b; }
      .result { font: 600 15px sans-serif; fill: #1d4ed8; }
      .node { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .node-text { font: 700 17px sans-serif; fill: #9a3412; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #64748b; stroke-width: 3; fill: none; }
      .pick { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .pick-text { font: 700 17px sans-serif; fill: #92400e; text-anchor: middle; dominant-baseline: middle; }
      .path { stroke: #2563eb; stroke-width: 3; stroke-dasharray: 7 6; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="1120" height="680" rx="24"/>
  <text class="title" x="42" y="52">자식이 둘인 BST 노드는 대체 키와 연결을 함께 본다</text>

  <g transform="translate(30 100)">
    <rect class="panel" width="340" height="535" rx="18"/>
    <text class="panel-title" x="20" y="35">삭제 전</text>
    <path class="line" d="M170 148 L105 208 M170 148 L235 208 M235 268 L200 338 M200 398 L235 438"/>
    <circle class="node" cx="170" cy="120" r="28"/><circle class="node" cx="105" cy="240" r="28"/><circle class="node" cx="235" cy="240" r="28"/><circle class="node" cx="200" cy="370" r="28"/><circle class="node" cx="235" cy="470" r="28"/>
    <text class="node-text" x="170" y="120">50</text><text class="node-text" x="105" y="240">30</text><text class="node-text" x="235" y="240">80</text><text class="node-text" x="200" y="370">60</text><text class="node-text" x="235" y="470">70</text>
    <text class="result" x="20" y="510">50은 자식이 둘이다</text>
  </g>

  <g transform="translate(390 100)">
    <rect class="panel" width="340" height="535" rx="18"/>
    <text class="panel-title" x="20" y="35">대체 키 선택</text>
    <path class="line" d="M170 148 L105 208 M170 148 L235 208 M235 268 L200 338 M200 398 L235 438"/>
    <path class="path" d="M170 120 C130 210 140 290 200 370"/>
    <circle class="node" cx="170" cy="120" r="28"/><circle class="node" cx="105" cy="240" r="28"/><circle class="node" cx="235" cy="240" r="28"/><circle class="pick" cx="200" cy="370" r="28"/><circle class="node" cx="235" cy="470" r="28"/>
    <text class="node-text" x="170" y="120">50</text><text class="node-text" x="105" y="240">30</text><text class="node-text" x="235" y="240">80</text><text class="pick-text" x="200" y="370">60</text><text class="node-text" x="235" y="470">70</text>
    <text class="result" x="20" y="510">오른쪽 서브트리의 최솟값 = 60</text>
  </g>

  <g transform="translate(750 100)">
    <rect class="panel" width="340" height="535" rx="18"/>
    <text class="panel-title" x="20" y="35">삭제 후</text>
    <path class="line" d="M170 148 L105 208 M170 148 L235 208 M235 268 L200 338"/>
    <circle class="pick" cx="170" cy="120" r="28"/><circle class="node" cx="105" cy="240" r="28"/><circle class="node" cx="235" cy="240" r="28"/><circle class="node" cx="200" cy="370" r="28"/>
    <text class="pick-text" x="170" y="120">60</text><text class="node-text" x="105" y="240">30</text><text class="node-text" x="235" y="240">80</text><text class="node-text" x="200" y="370">70</text>
    <text class="result" x="20" y="510">70을 80의 왼쪽에 연결</text>
  </g>
</svg>
