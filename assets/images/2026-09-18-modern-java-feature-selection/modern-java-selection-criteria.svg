<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">코드 의도에 맞춰 Modern Java 기능을 선택하는 기준</title>
  <desc id="desc">중앙의 코드 의도에서 데이터 전달과 record, 값의 부재와 Optional, 비용 있는 기본값과 orElseGet, 명확한 타입과 var, 제한된 타입 계층과 sealed, 결과를 만드는 분기와 switch expression, 타입 검사와 변수 바인딩 및 instanceof pattern matching으로 연결되는 간결한 다이어그램</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker>
  </defs>
  <style>
    text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #24344a; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #53647a; }
    .center-title { font-size: 26px; font-weight: 700; }
    .center-body { font-size: 17px; fill: #53647a; }
    .card-title { font-size: 19px; font-weight: 700; }
    .card-body { font-size: 16px; fill: #53647a; }
    .center { fill: #e8f1ff; stroke: #78a9e8; stroke-width: 2.5; }
    .record { fill: #eef8f4; stroke: #8ebaa7; }
    .optional { fill: #fff7ed; stroke: #fdba74; }
    .lazy { fill: #f3eefc; stroke: #bba7e2; }
    .type { fill: #f1f5f9; stroke: #94a3b8; }
    .sealed { fill: #eef4fd; stroke: #8fb4e6; }
    .switch { fill: #fff1f2; stroke: #fda4af; }
    .pattern { fill: #f0fdf4; stroke: #86efac; }
    .card { stroke-width: 1.8; }
    .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <rect width="1200" height="640" rx="20" fill="#f8fafc"/>
  <text x="40" y="48" class="title">Modern Java는 코드의 의도에 맞춰 선택한다</text>
  <text x="40" y="77" class="subtitle">새 문법보다 먼저, 현재 코드가 무엇을 표현하려는지 살펴본다.</text>

  <path d="M445 305 L162 250" class="arrow"/>
  <path d="M535 305 L454 250" class="arrow"/>
  <path d="M665 305 L746 250" class="arrow"/>
  <path d="M755 305 L1038 250" class="arrow"/>
  <path d="M480 435 L309 495" class="arrow"/>
  <path d="M600 435 L600 495" class="arrow"/>
  <path d="M720 435 L891 495" class="arrow"/>

  <rect x="410" y="305" width="380" height="130" rx="20" class="center"/>
  <text x="600" y="355" text-anchor="middle" class="center-title">코드가 표현하려는 의도</text>
  <text x="600" y="388" text-anchor="middle" class="center-body">역할과 맥락을 먼저 본다</text>
  <text x="600" y="414" text-anchor="middle" class="center-body">이 문법이 의미를 더 분명히 하는가?</text>

  <rect x="24" y="130" width="276" height="120" rx="14" class="card record"/>
  <text x="162" y="176" text-anchor="middle" class="card-title">데이터 전달</text>
  <text x="162" y="209" text-anchor="middle" class="card-body">DTO 역할이 분명할 때 → record</text>

  <rect x="316" y="130" width="276" height="120" rx="14" class="card optional"/>
  <text x="454" y="176" text-anchor="middle" class="card-title">값의 부재</text>
  <text x="454" y="209" text-anchor="middle" class="card-body">결과가 없을 수 있음 → Optional</text>

  <rect x="608" y="130" width="276" height="120" rx="14" class="card lazy"/>
  <text x="746" y="176" text-anchor="middle" class="card-title">비용 있는 기본값</text>
  <text x="746" y="209" text-anchor="middle" class="card-body">필요할 때 생성 → orElseGet()</text>

  <rect x="900" y="130" width="276" height="120" rx="14" class="card type"/>
  <text x="1038" y="176" text-anchor="middle" class="card-title">타입이 분명한 지역 변수</text>
  <text x="1038" y="209" text-anchor="middle" class="card-body">우변에서 타입을 알 수 있음 → var</text>

  <rect x="171" y="495" width="276" height="120" rx="14" class="card sealed"/>
  <text x="309" y="541" text-anchor="middle" class="card-title">제한된 타입 계층</text>
  <text x="309" y="574" text-anchor="middle" class="card-body">허용 구현체를 제한 → sealed</text>

  <rect x="462" y="495" width="276" height="120" rx="14" class="card switch"/>
  <text x="600" y="541" text-anchor="middle" class="card-title">분기에서 결과값 생성</text>
  <text x="600" y="574" text-anchor="middle" class="card-body">값을 바로 선택 → switch expression</text>

  <rect x="753" y="495" width="276" height="120" rx="14" class="card pattern"/>
  <text x="891" y="541" text-anchor="middle" class="card-title">타입 검사와 변수 바인딩</text>
  <text x="891" y="574" text-anchor="middle" class="card-body">instanceof pattern matching</text>
</svg>
