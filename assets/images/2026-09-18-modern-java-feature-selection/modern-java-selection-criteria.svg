<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">코드 의도에 맞춰 Modern Java 기능을 선택하는 기준</title>
  <desc id="desc">중앙 판단 기준 아래 일곱 가지 상황을 두 열로 정리했다. 데이터 전달은 record, 결과의 부재는 Optional, 비용 있는 기본값은 orElseGet, 명확한 지역 변수 타입은 var, 제한된 타입 계층은 sealed, 분기 결과는 switch expression, 타입 검사와 변수 사용은 instanceof pattern matching으로 연결한다.</desc>
  <defs>
    <marker id="mapping-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1e293b; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #64748b; }
    .hub-title { font-size: 24px; font-weight: 700; fill: #ffffff; }
    .hub-copy { font-size: 16px; fill: #cbd5e1; }
    .column { font-size: 14px; font-weight: 700; fill: #64748b; letter-spacing: .04em; }
    .number { font-size: 13px; font-weight: 700; fill: #2563eb; }
    .intent { font-size: 17px; font-weight: 500; }
    .feature { font-size: 16px; font-weight: 700; fill: #1d4ed8; font-family: "Cascadia Code", Consolas, monospace; }
    .row { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .feature-bg { fill: #eff6ff; }
    .mapping-arrow { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; marker-end: url(#mapping-arrow); }
  </style>

  <rect width="1200" height="700" rx="20" fill="#f8fafc"/>
  <text x="56" y="48" class="title">Modern Java 기능 선택 기준</text>
  <text x="56" y="77" class="subtitle">새 문법을 쓰기 전에, 코드가 표현하려는 의도를 먼저 살펴본다.</text>

  <rect x="56" y="103" width="1088" height="80" rx="16" fill="#183153"/>
  <rect x="56" y="103" width="6" height="80" rx="3" fill="#60a5fa"/>
  <text x="84" y="137" class="hub-title">코드가 표현하려는 의도</text>
  <text x="84" y="162" class="hub-copy">현재 코드의 의미와 역할을 더 분명하게 드러내는 기능을 선택한다.</text>

  <text x="132" y="215" class="column">표현하려는 상황</text>
  <text x="834" y="215" class="column">살펴볼 기능</text>

  <g>
    <rect x="56" y="226" width="1088" height="54" rx="11" class="row"/>
    <circle cx="91" cy="253" r="15" fill="#eff6ff"/>
    <text x="91" y="258" text-anchor="middle" class="number">01</text>
    <text x="132" y="259" class="intent">DTO로 고정된 데이터를 전달한다</text>
    <path d="M760 253 H800" class="mapping-arrow"/>
    <rect x="834" y="235" width="288" height="36" rx="9" class="feature-bg"/>
    <text x="978" y="259" text-anchor="middle" class="feature">record</text>
  </g>

  <g>
    <rect x="56" y="288" width="1088" height="54" rx="11" class="row"/>
    <circle cx="91" cy="315" r="15" fill="#eff6ff"/>
    <text x="91" y="320" text-anchor="middle" class="number">02</text>
    <text x="132" y="321" class="intent">조회 결과가 없을 수 있다</text>
    <path d="M760 315 H800" class="mapping-arrow"/>
    <rect x="834" y="297" width="288" height="36" rx="9" class="feature-bg"/>
    <text x="978" y="321" text-anchor="middle" class="feature">Optional</text>
  </g>

  <g>
    <rect x="56" y="350" width="1088" height="54" rx="11" class="row"/>
    <circle cx="91" cy="377" r="15" fill="#eff6ff"/>
    <text x="91" y="382" text-anchor="middle" class="number">03</text>
    <text x="132" y="383" class="intent">비용 있는 기본값을 필요할 때 만든다</text>
    <path d="M760 377 H800" class="mapping-arrow"/>
    <rect x="834" y="359" width="288" height="36" rx="9" class="feature-bg"/>
    <text x="978" y="383" text-anchor="middle" class="feature">orElseGet()</text>
  </g>

  <g>
    <rect x="56" y="412" width="1088" height="54" rx="11" class="row"/>
    <circle cx="91" cy="439" r="15" fill="#eff6ff"/>
    <text x="91" y="444" text-anchor="middle" class="number">04</text>
    <text x="132" y="445" class="intent">지역 변수의 타입이 우변에서 분명하다</text>
    <path d="M760 439 H800" class="mapping-arrow"/>
    <rect x="834" y="421" width="288" height="36" rx="9" class="feature-bg"/>
    <text x="978" y="445" text-anchor="middle" class="feature">var</text>
  </g>

  <g>
    <rect x="56" y="474" width="1088" height="54" rx="11" class="row"/>
    <circle cx="91" cy="501" r="15" fill="#eff6ff"/>
    <text x="91" y="506" text-anchor="middle" class="number">05</text>
    <text x="132" y="507" class="intent">허용할 상속·구현 대상을 제한한다</text>
    <path d="M760 501 H800" class="mapping-arrow"/>
    <rect x="834" y="483" width="288" height="36" rx="9" class="feature-bg"/>
    <text x="978" y="507" text-anchor="middle" class="feature">sealed</text>
  </g>

  <g>
    <rect x="56" y="536" width="1088" height="54" rx="11" class="row"/>
    <circle cx="91" cy="563" r="15" fill="#eff6ff"/>
    <text x="91" y="568" text-anchor="middle" class="number">06</text>
    <text x="132" y="569" class="intent">분기에 따라 하나의 값을 만든다</text>
    <path d="M760 563 H800" class="mapping-arrow"/>
    <rect x="834" y="545" width="288" height="36" rx="9" class="feature-bg"/>
    <text x="978" y="569" text-anchor="middle" class="feature">switch expression</text>
  </g>

  <g>
    <rect x="56" y="598" width="1088" height="54" rx="11" class="row"/>
    <circle cx="91" cy="625" r="15" fill="#eff6ff"/>
    <text x="91" y="630" text-anchor="middle" class="number">07</text>
    <text x="132" y="631" class="intent">타입 검사 뒤 해당 타입의 변수를 사용한다</text>
    <path d="M760 625 H800" class="mapping-arrow"/>
    <rect x="834" y="607" width="288" height="36" rx="9" class="feature-bg"/>
    <text x="978" y="631" text-anchor="middle" class="feature" font-size="14">instanceof pattern matching</text>
  </g>
</svg>
